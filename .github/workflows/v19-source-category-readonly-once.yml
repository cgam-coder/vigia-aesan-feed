name: V19 official source categories bounded read-only audit once
on:
  push:
    branches: [sec-f1/cloudflare-api-readonly-20261009]
    paths: [.github/workflows/v19-source-category-readonly-once.yml]
permissions:
  contents: read
concurrency:
  group: v19-source-category-readonly-once
  cancel-in-progress: false
jobs:
  audit:
    if: github.event.deleted == false && github.actor == 'cgam-coder'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read metadata and quota; SELECT only after identity and economic gates
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CF_TOKEN;
          const account='9c1807c68493f14259248b5f5782cc6f',expectedDb='55596003-1b90-4f66-aad8-decb21205f13';
          const base='https://api.cloudflare.com/client/v4',root=base+'/accounts/'+account;
          const out=x=>console.log('V19_READONLY '+JSON.stringify(x));
          const safe=x=>{if(typeof x==='string')return x.split(token??'__UNSET__').join('[REDACTED]').replace(/Bearer\s+\S+/gi,'Bearer [REDACTED]');if(Array.isArray(x))return x.map(safe);if(x&&typeof x==='object')return Object.fromEntries(Object.entries(x).map(([k,v])=>[k,safe(v)]));return x;};
          const request=async(url,body)=>{if(!url.startsWith(base+'/'))throw Error('ORIGIN_REJECTED');const r=await fetch(url,{method:body?'POST':'GET',redirect:'error',headers:{Authorization:'Bearer '+token,Accept:'application/json',...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(15000)});return {http:r.status,j:await r.json().catch(()=>null)};};
          const get=async(label,path)=>{const r=await request(root+path);out({gate:label,http:r.http,success:r.j?.success===true,error_codes:r.j?.errors?.map(e=>e.code)??[]});if(r.http!==200||r.j?.success!==true)throw Error(label+'_UNAVAILABLE');return r.j.result;};
          const arr=x=>Array.isArray(x)?x:Array.isArray(x?.builds)?x.builds:Array.isArray(x?.results)?x.results:[];
          let reads=0,queries=0,db;
          const query=async(label,sql,params=[])=>{
          if(!/^(SELECT|EXPLAIN QUERY PLAN SELECT)\b/.test(sql)||/[;]/.test(sql)||queries>=16||reads>=1000000)throw Error('READ_BUDGET_STOP');
          queries++;const r=await request(root+'/d1/database/'+db+'/query',{sql,params});const results=arr(r.j?.result);
          if(r.http!==200||r.j?.success!==true||!results.length)throw Error('SELECT_UNAVAILABLE');
          for(const z of results){if(z.meta?.rows_written!==0||z.meta?.changes!==0||!Number.isFinite(z.meta?.rows_read))throw Error('READ_CONTRACT_VIOLATION');reads+=z.meta.rows_read;}
          out(safe({gate:label,http:r.http,rows_read:results.reduce((s,z)=>s+z.meta.rows_read,0),rows_written:0,changes:0,duration_ms:results.reduce((s,z)=>s+(z.meta.duration??0),0),results:results.flatMap(z=>z.results??[])}));
          if(reads>1000000)throw Error('READ_BUDGET_EXCEEDED');return results.flatMap(z=>z.results??[]);
          };
          try{
          if(!token)throw Error('TOKEN_UNAVAILABLE');
          const workers=arr(await get('workers','/workers/scripts'));
          let bindingsOk=true,activeBuilds=0;
          for(const name of ['vigia-runtime','vigia-source-runner']){
          const s=await get(name+'_settings','/workers/scripts/'+name+'/settings');
          const bindings=(s.bindings??[]).filter(b=>['d1','service'].includes(b.type)).map(b=>({name:b.name,type:b.type,id:b.id??null,service:b.service??null}));
          out({gate:'effective_bindings',worker:name,bindings,limits:s.limits??null});
          const found=bindings.find(b=>b.type==='d1'&&b.name==='DB');if(found?.id!==expectedDb)bindingsOk=false;else db=found.id;
          const d=await get(name+'_deployments','/workers/scripts/'+name+'/deployments');
          const deps=arr(d.deployments??d).slice(0,3);out({gate:'allocations',worker:name,deployments:deps.map(d=>({id:d.id,created:d.created_on,versions:d.versions}))});
          for(const dep of deps.slice(0,2))for(const version of dep.versions??[]){
          const id=version.version_id;if(!/^[a-f0-9-]{36}$/.test(id))throw Error('VERSION_REJECTED');
          const v=await get(name+'_version','/workers/scripts/'+name+'/versions/'+id);
          out(safe({gate:'version_available',worker:name,id,number:v.number??null,created:v.metadata?.created_on??null,tag:v.annotations?.['workers/tag']??null,message:v.annotations?.['workers/message']??null}));
          const b=await get(name+'_provenance','/builds/builds?version_ids='+id);
          out({gate:'version_build',worker:name,id,builds:arr(b).slice(0,3).map(x=>({id:x.build_uuid,status:x.status,outcome:x.build_outcome,created:x.created_on,commit:x.build_trigger_metadata?.commit_hash,branch:x.build_trigger_metadata?.branch,repo:x.build_trigger_metadata?.repo_name}))});
          }
          const w=workers.find(w=>w.id===name);if(!w?.tag)throw Error('WORKER_TAG_UNAVAILABLE');
          const builds=arr(await get(name+'_builds','/builds/workers/'+encodeURIComponent(w.tag)+'/builds'));
          const active=builds.filter(x=>!['success','failure','failed','cancelled','canceled','complete','completed','build_completed','skipped'].includes(String(x.status??x.build_outcome??'').toLowerCase())&&!['success','failure','failed','cancelled','canceled','skipped'].includes(String(x.build_outcome??'').toLowerCase()));
          activeBuilds+=active.length;out({gate:'recent_builds',worker:name,count:builds.length,active_candidates:active.map(x=>({id:x.build_uuid,status:x.status,outcome:x.build_outcome})),items:builds.slice(0,5).map(x=>({id:x.build_uuid,status:x.status,outcome:x.build_outcome,commit:x.build_trigger_metadata?.commit_hash}))});
          }
          if(!bindingsOk||!db)throw Error('DB_BINDING_MISMATCH');
          const detail=await get('database','/d1/database/'+db);
          out({gate:'database_identity',binding:'DB',uuid:detail.uuid,name:detail.name,file_size:detail.file_size,num_tables:detail.num_tables});
          if(detail.uuid!==db)throw Error('DB_IDENTITY_MISMATCH');
          const limits=await get('build_limits','/builds/account/limits');out({gate:'build_availability',has_reached_build_minutes_limit:limits.has_reached_build_minutes_limit??null,refresh:limits.build_minutes_refresh_on??null});
          const gql='query { viewer { accounts(filter: {accountTag: "'+account+'"}) { d1AnalyticsAdaptiveGroups(limit: 1, filter: {date_geq: "2026-09-25", date_leq: "2026-10-10"}) { sum { rowsRead rowsWritten } } } } }';
          const analytics=await request(base+'/graphql',{query:gql});
          const aggregates=analytics.j?.data?.viewer?.accounts?.[0]?.d1AnalyticsAdaptiveGroups;
          out(safe({gate:'d1_month_usage',http:analytics.http,errors:analytics.j?.errors?.map(e=>({message:String(e.message??'').slice(0,250)}))??[],period_start:'2026-09-25',period_end:'2026-10-10',aggregates:aggregates??null}));
          if(analytics.http!==200||analytics.j?.errors?.length||!Array.isArray(aggregates)||aggregates.length!==1||!Number.isFinite(aggregates[0]?.sum?.rowsRead)||aggregates[0].sum.rowsRead>=24999000000)throw Error('D1_HEADROOM_UNVERIFIED');
          if(activeBuilds)throw Error('ACTIVE_BUILDS_HOLD');
          out({gate:'economic',included_read_headroom:25000000000-aggregates[0].sum.rowsRead,max_audit_reads:1000000,overage_usd_if_all_reads_billable:0.001,expected_incremental_usd:0,new_cloudflare_builds:0,customer_worker_invocations:0});
          await query('schema',"SELECT name,sql FROM sqlite_schema WHERE (type='table' AND name='alerts') OR (type='index' AND tbl_name='alerts') ORDER BY name LIMIT 50");
          await query('control',"SELECT id,owner_id,expires_at,epoch,json_extract(state_json,'$.revisionAttempts') AS revisions FROM source_reliability_control WHERE id=1");
          const sources=['RASFF','SAFETY GATE','OECD'];const counts=await query('source_counts',"SELECT source,COUNT(*) AS n FROM alerts WHERE source IN (?,?,?) GROUP BY source",sources);
          if(counts.length!==3||counts.reduce((s,r)=>s+r.n,0)>150000)throw Error('SOURCE_CARDINALITY_BUDGET_HOLD');
          for(const source of sources){
          await query('category_plan:'+source,"EXPLAIN QUERY PLAN SELECT product_class,COUNT(*) FROM alerts WHERE source=? GROUP BY product_class",[source]);
          const rows=await query('categories:'+source,"SELECT product_class AS category,COUNT(*) AS n,MIN(published_at) AS first_date,MAX(published_at) AS last_date,SUM(published_at>=?) AS recent7,SUM(CASE WHEN json_valid(canonical_json) AND json_extract(canonical_json,'$.product.category.status')='known' THEN 1 ELSE 0 END) AS known,SUM(CASE WHEN json_valid(canonical_json) AND json_extract(canonical_json,'$.product.category.normalized')=product_class THEN 1 ELSE 0 END) AS canonical_match,GROUP_CONCAT(DISTINCT CASE WHEN json_valid(canonical_json) THEN json_extract(canonical_json,'$.product.category.provenance[0].sourceField') END) AS source_fields,MIN(id) AS sample_id FROM alerts WHERE source=? GROUP BY product_class ORDER BY n DESC,product_class LIMIT 1025",[new Date(Date.now()-7*86400000).toISOString(),source]);
          if(rows.length>1024||rows.reduce((s,r)=>s+r.n,0)!==counts.find(r=>r.source===source)?.n)throw Error('CATEGORY_TRUNCATED_HOLD');
          const samples=[...new Set([...rows.slice(0,6),...rows.filter(r=>r.known!==r.n||/product.type|unknown/i.test(r.source_fields??'')||/Sin clasificar|No alimentaci.n|Otros|OTHER/i.test(r.category??'')).slice(0,6),...rows.slice(-3)].map(r=>r.sample_id))].slice(0,15);
          await query('samples:'+source,"SELECT id,source,reference,url,product_class AS category,published_at,json_extract(canonical_json,'$.identity.sourceRecordId') AS native_id,json_extract(canonical_json,'$.product.category') AS category_value,json_extract(canonical_json,'$.sourceRecord.detail.product.productCategory') AS native_product_category,substr(json_extract(canonical_json,'$.sourceRecord.detail.\"product.code\"'),1,1800) AS native_product_codes,substr(json_extract(canonical_json,'$.sourceRecord.detail.\"product.type\"'),1,400) AS native_product_type FROM alerts WHERE id IN ("+samples.map(()=>'?').join(',')+")",samples);
          }
          out({gate:'complete',queries,rows_read:reads,rows_written:0});
          }catch(e){out({gate:'HOLD',reason:String(e.message??'Error'),queries,rows_read:reads,rows_written:0});process.exitCode=1;}
          
          NODE
