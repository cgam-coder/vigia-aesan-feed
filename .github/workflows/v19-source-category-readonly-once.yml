name: V19 official source categories bounded read-only audit once
on:
  push:
    branches: [sec-f1/cloudflare-api-readonly-20261009]
    paths: [.github/workflows/v19-source-category-readonly-once.yml]
permissions:
  contents: read
concurrency:
  group: v19-source-category-readonly-once
  cancel-in-progress: false
jobs:
  audit:
    if: github.event.deleted == false && github.actor == 'cgam-coder'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read metadata and quota; SELECT only after identity and economic gates
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CF_TOKEN;
          const account='9c1807c68493f14259248b5f5782cc6f',expectedDb='55596003-1b90-4f66-aad8-decb21205f13';
          const base='https://api.cloudflare.com/client/v4',root=base+'/accounts/'+account;
          const out=x=>console.log('V19_READONLY '+JSON.stringify(x));
          const safe=x=>{if(typeof x==='string')return x.split(token??'__UNSET__').join('[REDACTED]').replace(/Bearer\s+\S+/gi,'Bearer [REDACTED]');if(Array.isArray(x))return x.map(safe);if(x&&typeof x==='object')return Object.fromEntries(Object.entries(x).map(([k,v])=>[k,safe(v)]));return x;};
          const request=async(url,body)=>{if(!url.startsWith(base+'/'))throw Error('ORIGIN_REJECTED');const r=await fetch(url,{method:body?'POST':'GET',redirect:'error',headers:{Authorization:'Bearer '+token,Accept:'application/json',...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(15000)});return {http:r.status,j:await r.json().catch(()=>null)};};
          const get=async(label,path)=>{const r=await request(root+path);out({gate:label,http:r.http,success:r.j?.success===true,error_codes:r.j?.errors?.map(e=>e.code)??[]});if(r.http!==200||r.j?.success!==true)throw Error(label+'_UNAVAILABLE');return r.j.result;};
          const flatBuilds=(x,depth=0)=>{if(!x||typeof x!=='object'||depth>4)return [];if(x.build_uuid||x.build_trigger_metadata)return [x];return Object.values(x).flatMap(v=>flatBuilds(v,depth+1));};
          const arr=x=>Array.isArray(x)?x:Array.isArray(x?.builds)?x.builds:Array.isArray(x?.results)?x.results:[];
          let reads=0,queries=0,db;
          const query=async(label,sql,params=[])=>{
          if(!/^(SELECT|EXPLAIN QUERY PLAN SELECT)\b/.test(sql)||/[;]/.test(sql)||queries>=16||reads>=1000000)throw Error('READ_BUDGET_STOP');
          queries++;const r=await request(root+'/d1/database/'+db+'/query',{sql,params});const results=arr(r.j?.result);
          if(r.http!==200||r.j?.success!==true||!results.length)throw Error('SELECT_UNAVAILABLE');
          for(const z of results){if(z.meta?.rows_written!==0||z.meta?.changes!==0||!Number.isFinite(z.meta?.rows_read))throw Error('READ_CONTRACT_VIOLATION');reads+=z.meta.rows_read;}
          out(safe({gate:label,http:r.http,rows_read:results.reduce((s,z)=>s+z.meta.rows_read,0),rows_written:0,changes:0,duration_ms:results.reduce((s,z)=>s+(z.meta.duration??0),0),results:results.flatMap(z=>z.results??[])}));
          if(reads>1000000)throw Error('READ_BUDGET_EXCEEDED');return results.flatMap(z=>z.results??[]);
          };
          try{
          if(!token)throw Error('TOKEN_UNAVAILABLE');
          for(const name of ['vigia-runtime','vigia-source-runner']){const settings=await get(name+'_binding','/workers/scripts/'+name+'/settings');const b=settings.bindings?.find(b=>b.name==='DB'&&b.type==='d1');if(b?.id!==expectedDb)throw Error('DB_BINDING_MISMATCH');db=b.id;}
          const usage=await request(base+'/graphql',{query:'query { viewer { accounts(filter: {accountTag: "'+account+'"}) { d1AnalyticsAdaptiveGroups(limit: 1, filter: {date_geq: "2026-09-25", date_leq: "2026-10-10"}) { sum { rowsRead rowsWritten } } } } }'});
          const u=usage.j?.data?.viewer?.accounts?.[0]?.d1AnalyticsAdaptiveGroups?.[0]?.sum;out({gate:'d1_usage',http:usage.http,rowsRead:u?.rowsRead??null,rowsWritten:u?.rowsWritten??null,error_codes:usage.j?.errors?.map(e=>e.message)??[]});
          if(usage.j?.errors?.length||!Number.isFinite(u?.rowsRead)||u.rowsRead>=24999000000)throw Error('D1_HEADROOM_UNVERIFIED');
          const intro=await request(base+'/graphql',{query:'query { __type(name: "AccountWorkersInvocationsAdaptiveSum") { fields { name } } }'});
          const fields=intro.j?.data?.__type?.fields?.map(x=>x.name)??[];out({gate:'worker_metric_fields',http:intro.http,fields,errors:intro.j?.errors?.map(e=>String(e.message).slice(0,180))??[]});
          if(fields.includes('cpuTimeUs')){const cpu=await request(base+'/graphql',{query:'query { viewer { accounts(filter: {accountTag: "'+account+'"}) { workersInvocationsAdaptive(limit: 1, filter: {datetime_geq: "2026-09-25T00:00:00Z", datetime_leq: "'+new Date().toISOString()+'"}) { sum { requests errors cpuTimeUs } } } } }'});out({gate:'worker_account_usage',http:cpu.http,metrics:cpu.j?.data?.viewer?.accounts?.[0]?.workersInvocationsAdaptive??null,errors:cpu.j?.errors?.map(e=>String(e.message).slice(0,180))??[]});}
          const limits=await get('build_limits_detail','/builds/account/limits');out({gate:'build_limit_shape',type:typeof limits,is_array:Array.isArray(limits),keys:Object.keys(limits??{}).slice(0,25),value:limits});
          await query('rasff_native_fidelity',"SELECT COUNT(*) AS n,SUM(product_class=COALESCE(json_extract(canonical_json,'$.sourceRecord.detail.product.productCategory.description'),json_extract(canonical_json,'$.sourceRecord.index.productCategory.description'))) AS native_match,SUM(json_extract(canonical_json,'$.product.category.status')<>'known') AS not_known,MAX(length(product_class)) AS max_length,SUM(product_class<>TRIM(product_class)) AS surrounding_spaces FROM alerts WHERE source=? AND json_valid(canonical_json)",['RASFF']);
          await query('sg_native_fidelity',"SELECT COUNT(*) AS n,SUM(product_class=json_extract(canonical_json,'$.sourceRecord.detail.product.productCategory.name')) AS native_match,SUM(json_extract(canonical_json,'$.sourceRecord.detail.product.productCategory.name') IS NULL) AS native_missing,MAX(length(product_class)) AS max_length,SUM(product_class<>TRIM(product_class)) AS surrounding_spaces FROM alerts WHERE source=? AND json_valid(canonical_json)",['SAFETY GATE']);
          const levels=await query('oecd_provenance',"SELECT json_extract(canonical_json,'$.product.category.provenance[0].sourceField') AS field,json_extract(canonical_json,'$.product.category.status') AS status,COUNT(*) AS n,COUNT(DISTINCT product_class) AS labels,MIN(id) AS sample_id FROM alerts WHERE source=? AND json_valid(canonical_json) GROUP BY field,status",['OECD']);
          const count=await query('oecd_cardinality',"SELECT COUNT(*) AS n,COUNT(DISTINCT product_class) AS labels,MAX(length(product_class)) AS max_length,SUM(product_class<>TRIM(product_class)) AS surrounding_spaces FROM alerts WHERE source=?",['OECD']);
          if(count[0].labels>4096)throw Error('OECD_LABEL_CARDINALITY_HOLD');
          const cats=await query('oecd_all_categories',"SELECT product_class AS category,COUNT(*) AS n,GROUP_CONCAT(DISTINCT json_extract(canonical_json,'$.product.category.provenance[0].sourceField')) AS fields,MIN(id) AS sample_id,MIN(published_at) AS first_date,MAX(published_at) AS last_date,SUM(published_at>=?) AS recent7 FROM alerts WHERE source=? GROUP BY product_class ORDER BY n DESC,category LIMIT 4097",[new Date(Date.now()-7*86400000).toISOString(),'OECD']);
          if(cats.length!==count[0].labels||cats.reduce((s,r)=>s+r.n,0)!==count[0].n)throw Error('OECD_CATALOG_TRUNCATED');
          const ids=[...new Set([...levels,...cats.slice(0,4),...cats.filter(r=>/Produits|TOYS|EP91|GC1|Sin clasificar/.test(r.category??'')).slice(0,6)].map(r=>r.sample_id))].slice(0,15);
          await query('oecd_samples',"SELECT id,reference,url,product_class AS category,json_extract(canonical_json,'$.identity.sourceRecordId') AS native_id,json_extract(canonical_json,'$.product.category') AS category_value,substr(json_extract(canonical_json,'$.sourceRecord.detail.\"product.code\"'),1,1800) AS native_product_codes,substr(json_extract(canonical_json,'$.sourceRecord.detail.\"product.type\"'),1,400) AS native_product_type FROM alerts WHERE id IN ("+ids.map(()=>'?').join(',')+")",ids);
          await query('oecd_label_variants',"SELECT lower(TRIM(product_class)) AS folded,COUNT(DISTINCT product_class) AS variants,GROUP_CONCAT(DISTINCT product_class) AS labels,COUNT(*) AS n FROM alerts WHERE source=? GROUP BY folded HAVING COUNT(DISTINCT product_class)>1 ORDER BY n DESC LIMIT 30",['OECD']);
          out({gate:'complete_remaining',queries,rows_read:reads,rows_written:0,expected_incremental_usd:0});
          }catch(e){out({gate:'HOLD',reason:String(e.message??'Error'),queries,rows_read:reads,rows_written:0});process.exitCode=1;}
          
          NODE
