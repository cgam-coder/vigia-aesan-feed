name: VIGIA RAPNA secret preflight

on:
  push:
    branches:
      - codex/rapna-schedule-activation

permissions:
  contents: read
  statuses: write

jobs:
  verify-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify secret and Sites authentication
        env:
          VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
        run: |
          test -n "${VIGIA_SYNC_TOKEN}" || { echo "VIGIA_SYNC_TOKEN is unavailable"; exit 1; }
          response_file="${RUNNER_TEMP}/rapna-verify.json"
          http_code="$(curl --silent --show-error --location \
            --request POST \
            --header "Authorization: Bearer ${VIGIA_SYNC_TOKEN}" \
            --max-time 60 --output "${response_file}" --write-out '%{http_code}' \
            'https://vigia-alertas.csar68.chatgpt.site/api/rapna/sync?mode=verify')"
          node -e '
            const fs = require("node:fs");
            const status = Number(process.argv[1]);
            const body = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
            if (status !== 200 || !body?.audit) throw new Error(`Secret preflight failed with HTTP ${status}`);
            console.log(JSON.stringify({ authorized:true, rapnaAlerts:body.audit.counts.rapnaAlerts }));
          ' "${http_code}" "${response_file}"
      - name: Publish non-secret preflight status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_RESULT: ${{ job.status }}
        run: |
          state="failure"
          description="RAPNA secret preflight failed"
          if [ "${PREFLIGHT_RESULT}" = "success" ]; then
            state="success"
            description="RAPNA secret authenticated against Sites"
          fi
          curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "{\"state\":\"${state}\",\"context\":\"rapna-secret-preflight\",\"description\":\"${description}\"}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
