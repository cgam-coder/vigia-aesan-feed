name: VIGIA RAPNA secret preflight

on:
  push:
    branches:
      - codex/rapna-schedule-activation

permissions:
  contents: read
  statuses: write

jobs:
  verify-secret:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify secret and Sites authentication
        env:
          GH_TOKEN: ${{ github.token }}
          VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
        run: |
          publish_status() {
            state="$1"
            context="$2"
            curl --silent --show-error --fail-with-body \
              --request POST \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --data "{\"state\":\"${state}\",\"context\":\"${context}\",\"description\":\"Non-secret RAPNA authentication check\"}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
          }
          if [ -z "${VIGIA_SYNC_TOKEN}" ]; then
            publish_status failure rapna-secret-preflight/missing-secret
            exit 1
          fi
          response_file="${RUNNER_TEMP}/rapna-verify.json"
          http_code="$(curl --silent --show-error --location \
            --request POST \
            --header "Authorization: Bearer ${VIGIA_SYNC_TOKEN}" \
            --max-time 60 --output "${response_file}" --write-out '%{http_code}' \
            'https://vigia-alertas.csar68.chatgpt.site/api/rapna/sync?mode=verify')"
          if [ "${http_code}" = "401" ]; then
            publish_status failure rapna-secret-preflight/http-401
            exit 1
          fi
          if [ "${http_code}" != "200" ]; then
            publish_status failure "rapna-secret-preflight/http-${http_code}"
            exit 1
          fi
          node -e '
            const fs = require("node:fs");
            const body = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!body?.audit) throw new Error("Missing RAPNA audit response");
          ' "${response_file}" || { publish_status failure rapna-secret-preflight/invalid-response; exit 1; }
          publish_status success rapna-secret-preflight/authorized

# Preflight rerun after Sites env revision 8 deployment
