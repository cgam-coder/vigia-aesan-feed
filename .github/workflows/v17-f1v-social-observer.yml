# One-time GET-only Cloudflare post-merge verification for approved PR #267.
# Branch isolated from feed/main; API allowlist excludes any mutation.
name: V17 F1V production version and build observer (GET only)
on:
  push:
    branches:
      - v17/f1v-social-observer-readonly
permissions:
  contents: read
jobs:
  observe:
    if: github.event.head_commit.message == 'V17-F1V social share postflight GET-only observer' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET-only Cloudflare build and allocation comparison
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const expiry=Date.parse("2026-10-08T00:00:00Z");
          const root="https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f";
          const previous="747e5613-c3db-4e89-906d-97f8c7f4b304";
          const priorObserved=Date.parse("2026-10-07T20:16:10.032Z");
          const expectedCommit="3052f2599a87e4d7dca7a82158ecd8f0c26a49d3";
          const buildIds=["793f86d3-2cf5-4139-8107-bda09edc873d","2d517e13-2de3-4f3d-8dab-c90a820f1dc2"];
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!token) throw Error("token-unavailable");
          const allowed=/^\/(?:workers\/scripts\/vigia-runtime\/(?:deployments|versions\/[a-f0-9-]{36})|builds\/builds\/(?:793f86d3-2cf5-4139-8107-bda09edc873d|2d517e13-2de3-4f3d-8dab-c90a820f1dc2))$/;
          async function get(path){
            if(Date.now()>expiry) throw Error("observer-expired");
            if(!allowed.test(path)) throw Error("out-of-scope GET path");
            const response=await fetch(root+path,{method:"GET",redirect:"error",
              headers:{Authorization:"Bearer "+token,Accept:"application/json"},
              signal:AbortSignal.timeout(15_000)});
            if(!response.ok) throw Error("Cloudflare HTTP "+response.status+" on authorized GET");
            const obj=await response.json();
            if(!obj.success) throw Error("Cloudflare success=false");
            return obj.result;
          }
          async function snapshot(){
            const first=(await get("/workers/scripts/vigia-runtime/deployments"))?.deployments?.[0];
            if(!first || first.versions?.length!==1 || first.versions[0]?.percentage!==100) {
              throw Error("production allocation not one version at 100%");
            }
            const id=first.versions[0].version_id;
            if(!/^[a-f0-9-]{36}$/.test(id))throw Error("invalid production version id");
            const version=await get("/workers/scripts/vigia-runtime/versions/"+id);
            const second=(await get("/workers/scripts/vigia-runtime/deployments"))?.deployments?.[0];
            if(second?.id!==first.id || JSON.stringify(second.versions)!==JSON.stringify(first.versions)) {
              throw Error("deployment drift between reads");
            }
            return {deploymentId:first.id,createdOn:first.created_on,versionId:id,
              versionNumber:version.number,versionCreatedOn:version.metadata?.created_on??null,
              allocationPercentage:100};
          }
          let last;
          for(let attempt=1;attempt<=10;attempt++){
            const active=await snapshot();
            const builds=[];
            for(const id of buildIds){
              try{
                const b=await get("/builds/builds/"+id);
                builds.push({id,status:b.status,outcome:b.build_outcome,commit:b.build_trigger_metadata?.commit_hash,
                  branch:b.build_trigger_metadata?.branch,created:b.created_on,stopped:b.stopped_on});
              }catch(error){builds.push({id,error:error instanceof Error ? error.message : String(error)});}
            }
            const sourceMatched=builds.some(b=>b.status==="stopped"&&b.outcome==="success"&&
              b.commit===expectedCommit&&b.branch==="main");
            const changed=active.versionId!==previous;
            const fresh=Date.parse(active.createdOn)>priorObserved &&
              Date.parse(active.versionCreatedOn)>priorObserved;
            const verdict=(sourceMatched&&changed&&fresh)?"PASS":"HOLD";
            last={verdict,attempt,observedAt:new Date().toISOString(),
              expectedCommit,previousVersionId:previous,active,builds,sourceMatched,changed,fresh};
            console.log(JSON.stringify(last));
            if(verdict==="PASS")break;
            if(attempt<10)await new Promise(r=>setTimeout(r,16000));
          }
          const fs=await import("node:fs");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"### Post-merge Cloudflare identity\n\n"+
            JSON.stringify(last,null,2)+"\n");
          if(last.verdict!=="PASS")process.exitCode=1;
          NODE
