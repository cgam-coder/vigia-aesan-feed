# GET-only identity observer for the specifically authorised social-share PR #267 release.
# One isolated branch commit, no merge to feed/main, expires 2026-10-08 00:00 UTC.
name: V17 F1V production allocation identity (GET only)

on:
  push:
    branches:
      - v17/f1v-social-observer-readonly

permissions:
  contents: read

jobs:
  identity:
    if: github.event.head_commit.message == 'V17-F1V social share preflight GET-only observer' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read stable production Worker deployment and version only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const expiry=Date.parse("2026-10-08T00:00:00Z");
          const root="https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f";
          const script="vigia-runtime";
          const allowed=/^\/workers\/scripts\/vigia-runtime\/(?:deployments|versions\/[a-f0-9-]{36})$/;
          if(Date.now()>expiry) throw Error("observer-expired");
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!token) throw Error("token-unavailable");
          async function read(path){
            if(Date.now()>expiry) throw Error("observer-expired");
            if(!allowed.test(path)) throw Error("GET-path-denied");
            const response=await fetch(root+path,{
              method:"GET",redirect:"error",
              headers:{Authorization:"Bearer "+token,Accept:"application/json"},
              signal:AbortSignal.timeout(15_000),
            });
            if(!response.ok) throw Error("Cloudflare GET HTTP "+response.status);
            const json=await response.json();
            if(!json.success) throw Error("Cloudflare success=false");
            return json.result;
          }
          const first=(await read("/workers/scripts/"+script+"/deployments"))?.deployments?.[0];
          if(!first || !Array.isArray(first.versions) || first.versions.length!==1 ||
             first.versions[0].percentage!==100) throw Error("ambiguous-deployment-allocation");
          const id=first.versions[0].version_id;
          if(!/^[a-f0-9-]{36}$/.test(id)) throw Error("invalid-worker-version");
          const version=await read("/workers/scripts/"+script+"/versions/"+id);
          const second=(await read("/workers/scripts/"+script+"/deployments"))?.deployments?.[0];
          if(second?.id!==first.id || JSON.stringify(second.versions)!==JSON.stringify(first.versions)) {
            throw Error("deployment-allocation-drift");
          }
          const observedAt=new Date().toISOString();
          const result={
            verdict:"PASS",phase:"preflight",observedAt,
            worker:script,deploymentId:first.id,createdOn:first.created_on,
            activeVersionId:id,activeVersionNumber:version.number,
            allocationPercentage:100,versionCreatedOn:version.metadata?.created_on??null,
            note:"GET-only Cloudflare allocation observation; no production mutation. Provides rollback version ID.",
          };
          console.log(JSON.stringify(result));
          const fs=await import("node:fs");
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,"### GET-only production identity\n\n"+JSON.stringify(result,null,2)+"\n");
          NODE
