name: Scheduler S3 dormant post-merge evidence
on:
  push:
    branches: [work/scheduler-reliability-s0-evidence]
    paths:
      - ".github/workflows/scheduler-s3-dormant-postmerge.yml"
      - "diagnostics/scheduler-s3-dormant-postmerge.mjs"
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Certify dormant S3 production state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node diagnostics/scheduler-s3-dormant-postmerge.mjs
