name: NagameAlert V35 sealed readproof
on:
  push:
    branches: [ops/v35-readproof-20261027]
    paths: [operations/operator-readonly/v35-readproof-input.json]
permissions: {}
concurrency:
  group: nagamealert-v35-readproof
  cancel-in-progress: false
jobs:
  preflight:
    if: ${{ github.event_name == 'push' && github.repository == 'cgam-coder/vigia-aesan-feed' && github.ref == 'refs/heads/ops/v35-readproof-20261027' && github.run_attempt == 1 && github.event.deleted == false && github.event.head_commit.message == 'preflight' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    permissions: {}
    steps:
      - name: Sealed validate
        shell: bash
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          EVENT_DELETED: ${{ toJSON(github.event.deleted) }}
          VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {spawnSync} from 'node:child_process';
          const b=Buffer.from('','base64');
          if(createHash('sha256').update(b).digest('hex')!=='00edef707106f7aaf678546d9891b515fe04df2c9b1934be851ed81f4ccd2307')process.exit(2);
          fs.writeFileSync('sealed-runner.mjs',b,{mode:0o600});
          const r=spawnSync(process.execPath,['sealed-runner.mjs','run','preflight','validate','sealed/validate'],{stdio:'inherit'});
          process.exit(r.status??2);
          NODE
      - name: Sealed execute
        shell: bash
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          EVENT_DELETED: ${{ toJSON(github.event.deleted) }}
          VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {spawnSync} from 'node:child_process';
          const b=Buffer.from('','base64');
          if(createHash('sha256').update(b).digest('hex')!=='00edef707106f7aaf678546d9891b515fe04df2c9b1934be851ed81f4ccd2307')process.exit(2);
          fs.writeFileSync('sealed-runner.mjs',b,{mode:0o600});
          const r=spawnSync(process.execPath,['sealed-runner.mjs','run','preflight','execute','sealed/execute'],{stdio:'inherit'});
          process.exit(r.status??2);
          NODE
      - name: Upload sealed evidence only
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v35-sealed-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: sealed/**/*.v35e
          retention-days: 7
          compression-level: 0
          overwrite: false
          if-no-files-found: error
          include-hidden-files: false
  canary:
    if: ${{ github.event_name == 'push' && github.repository == 'cgam-coder/vigia-aesan-feed' && github.ref == 'refs/heads/ops/v35-readproof-20261027' && github.run_attempt == 1 && github.event.deleted == false && startsWith(github.event.head_commit.message, 'canary:') }}
