# Expiring GET-only Cloudflare baseline for corrective PR #268.
# Repeat premerge identity after CI PASS of head 0b42c6e00c66d6995e7afa80e97504b5d5a64f93.
# Isolated from feed/main. No deploy, D1, or secret disclosure.
name: V17 F1V corrective allocation preflight
on:
  push:
    branches: [v17/f1v-social-observer-readonly]
permissions:
  contents: read
jobs:
  preflight:
    if: github.event.head_commit.message == 'V17-F1V corrective preflight GET-only' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read stable allocation and rollback identity (GET-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const root="https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f";
          const expiry=Date.parse("2026-10-08T00:00:00Z");
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!token)throw Error("token unavailable");
          const allow=/^\/workers\/scripts\/vigia-runtime\/(deployments|versions\/[a-f0-9-]{36})$/;
          async function get(path){
            if(Date.now()>expiry)throw Error("expired");
            if(!allow.test(path))throw Error("out of scope");
            const res=await fetch(root+path,{method:"GET",redirect:"error",headers:{
              Authorization:"Bearer "+token,Accept:"application/json"},signal:AbortSignal.timeout(15000)});
            if(!res.ok)throw Error("GET HTTP "+res.status);
            const data=await res.json();
            if(!data.success)throw Error("API success false");
            return data.result;
          }
          const before=(await get("/workers/scripts/vigia-runtime/deployments"))?.deployments?.[0];
          if(!before||before.versions?.length!==1||before.versions[0]?.percentage!==100)throw Error("allocation ambiguous");
          const id=before.versions[0].version_id;
          if(!/^[a-f0-9-]{36}$/.test(id))throw Error("invalid version ID");
          const version=await get("/workers/scripts/vigia-runtime/versions/"+id);
          const after=(await get("/workers/scripts/vigia-runtime/deployments"))?.deployments?.[0];
          if(after?.id!==before.id||JSON.stringify(after.versions)!==JSON.stringify(before.versions))throw Error("allocation drift");
          const out={verdict:"PASS",stage:"corrective-preflight",at:new Date().toISOString(),deploymentId:before.id,
            deploymentCreated:before.created_on,activeVersionId:id,versionNumber:version.number,
            versionCreated:version.metadata?.created_on,allocation:100};
          console.log(JSON.stringify(out));
          NODE
