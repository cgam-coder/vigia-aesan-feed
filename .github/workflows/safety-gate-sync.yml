name: VIGIA Safety Gate + OECD recent sync

on:
  schedule:
    - cron: "7,37 * * * *"
    - cron: "22,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety_gate:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '7,37 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: vigia-safety-gate-recent
      cancel-in-progress: false
    env:
      VIGIA_BASE_URL: https://vigia-alertas.csar68.chatgpt.site
      VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
    steps:
      # Preflight <= 120s, mutation <= 420s, diagnostic <= 30s.
      # The 600s job retains 30s for parsing and shutdown.
      - name: Bounded read-plane and authorization preflight
        timeout-minutes: 2
        run: |
          root_code="$(curl --silent --show-error --location --max-time 30 \
            --output "${RUNNER_TEMP}/vigia-root.html" --write-out '%{http_code}' \
            "${VIGIA_BASE_URL}/")"
          alerts_code="$(curl --silent --show-error --location --max-time 60 \
            --output "${RUNNER_TEMP}/vigia-alerts.json" --write-out '%{http_code}' \
            "${VIGIA_BASE_URL}/api/v2/alerts?pageSize=1")"
          node -e '
            const fs = require("node:fs");
            const rootStatus = Number(process.argv[1]);
            const alertsStatus = Number(process.argv[2]);
            const body = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
            if (rootStatus !== 200) throw new Error(`VIGIA frontend smoke failed with HTTP ${rootStatus}`);
            if (alertsStatus !== 200 || body?.apiVersion !== 2 || body?.schemaVersion !== 4 || !Array.isArray(body?.items) || body.items.length === 0) {
              throw new Error(`VIGIA read-plane smoke failed with HTTP ${alertsStatus}`);
            }
            console.log(JSON.stringify({ rootStatus, alertsStatus, apiVersion:body.apiVersion, schemaVersion:body.schemaVersion, alerts:body.items.length }));
          ' "${root_code}" "${alerts_code}" "${RUNNER_TEMP}/vigia-alerts.json"
          if [ -z "${VIGIA_SYNC_TOKEN}" ]; then
            echo "VIGIA_SYNC_TOKEN is missing"
            exit 1
          fi
          for pair in "aesan:AESAN" "safety-gate:SAFETY GATE" "rapna:RAPNA" "oecd:OECD"; do
            route="${pair%%:*}"
            source="${pair#*:}"
            endpoint="${VIGIA_BASE_URL}/api/${route}/sync?mode=preflight"
            no_token_code="$(curl --silent --show-error --location --request POST --max-time 30 \
              --output "${RUNNER_TEMP}/${route}-no-token.json" --write-out '%{http_code}' "${endpoint}")"
            wrong_token_code="$(curl --silent --show-error --location --request POST --max-time 30 \
              --header 'Authorization: Bearer work-16-invalid-token' \
              --output "${RUNNER_TEMP}/${route}-wrong-token.json" --write-out '%{http_code}' "${endpoint}")"
            correct_token_code="$(curl --silent --show-error --location --request POST --max-time 30 \
              --header "Authorization: Bearer ${VIGIA_SYNC_TOKEN}" \
              --output "${RUNNER_TEMP}/${route}-authorized.json" --write-out '%{http_code}' "${endpoint}")"
            node -e '
              const fs = require("node:fs");
              const noToken = Number(process.argv[1]);
              const wrongToken = Number(process.argv[2]);
              const correctToken = Number(process.argv[3]);
              const source = process.argv[4];
              const body = JSON.parse(fs.readFileSync(process.argv[5], "utf8"));
              if (noToken !== 401 || wrongToken !== 401) throw new Error(`${source} accepted an unauthenticated mutation preflight`);
              if (correctToken !== 200 || body?.authorized !== true || body?.source !== source) {
                throw new Error(`${source} authorization preflight failed with HTTP ${correctToken}`);
              }
              console.log(`${source} authorization preflight passed`);
            ' "${no_token_code}" "${wrong_token_code}" "${correct_token_code}" "${source}" \
              "${RUNNER_TEMP}/${route}-authorized.json"
          done
          for route in aesan safety-gate rapna oecd; do
            observe_code="$(curl --silent --show-error --location --max-time 30 \
              --header "Authorization: Bearer ${VIGIA_SYNC_TOKEN}" \
              --output "${RUNNER_TEMP}/${route}-observe.json" --write-out '%{http_code}' \
              "${VIGIA_BASE_URL}/api/${route}/sync?observe=1")"
            if [ "${observe_code}" -ne 200 ]; then
              echo "${route} observe GET failed with HTTP ${observe_code}"
              exit 1
            fi
            mutation_code="$(curl --silent --show-error --location --max-time 30 \
              --output "${RUNNER_TEMP}/${route}-get-mutation.json" --write-out '%{http_code}' \
              "${VIGIA_BASE_URL}/api/${route}/sync?mode=recent")"
            if [ "${mutation_code}" -ne 405 ]; then
              echo "${route} mutating GET was not rejected: HTTP ${mutation_code}"
              exit 1
            fi
          done
          for mode in backfill snapshot; do
            status="$(curl --silent --show-error --location --max-time 30 \
              --output "${RUNNER_TEMP}/safety-gate-get-${mode}.json" --write-out '%{http_code}' \
              "${VIGIA_BASE_URL}/api/safety-gate/sync?mode=${mode}")"
            if [ "${status}" -ne 405 ]; then
              echo "Safety Gate ${mode} GET was not rejected: HTTP ${status}"
              exit 1
            fi
          done
          echo "All observation GETs are read-only and all mutating GETs return 405"

      - name: Refresh Safety Gate
        env:
          VIGIA_SAFETY_GATE_SYNC_URL: https://vigia-alertas.csar68.chatgpt.site/api/safety-gate/sync
        run: |
          response_file="${RUNNER_TEMP}/safety-gate-sync.json"
          mutation_exit=0
          http_code="$(curl -q --silent --show-error --request POST \
            --header "Authorization: Bearer ${VIGIA_SYNC_TOKEN}" \
            --max-time 420 --output "${response_file}" --write-out '%{http_code}' \
            "${VIGIA_SAFETY_GATE_SYNC_URL}?mode=recent")" || mutation_exit=$?
          if [ "${mutation_exit}" -eq 0 ]; then
            node -e '
              const fs = require("node:fs");
              const status = Number(process.argv[1]);
              const body = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
              const state = body?.state;
              if (status !== 200 || state?.source !== "SAFETY GATE" || state?.mode !== "recent" || state?.status !== "completed" || body.skipped != null) {
                throw new Error(`Safety Gate did not complete: HTTP ${status}, status=${state?.status}, skipped=${body?.skipped ?? state?.lastSkipReason ?? null}`);
              }
              if (state.lastError !== null) throw new Error("Safety Gate lastError must be null");
              if (state.leaseOwnerId !== null || state.leaseMode !== null || state.leaseExpiresAt !== null) {
                throw new Error("Safety Gate completed without clearing its lease state");
              }
              const started = typeof state.startedAt === "string" ? Date.parse(state.startedAt) : NaN;
              const completed = typeof state.completedAt === "string" ? Date.parse(state.completedAt) : NaN;
              if (!Number.isFinite(started) || !Number.isFinite(completed) || completed < started) {
                throw new Error("Safety Gate completion timestamps are absent, invalid or reversed");
              }
              console.log(JSON.stringify({ status:state.status, pagesScanned:state.pagesScanned,
                recordsObserved:state.recordsObserved, newCount:state.newCount,
                updatedCount:state.updatedCount, startedAt:state.startedAt,
                completedAt:state.completedAt, leaseReleased:true }));
            ' "${http_code}" "${response_file}" || mutation_exit=$?
          fi
          if [ "${mutation_exit}" -ne 0 ]; then
            echo "Safety Gate mutation failed: exit=${mutation_exit}, HTTP=${http_code}"
            observation_file="${RUNNER_TEMP}/safety-gate-failure-observation.json"
            if observe_code="$(curl -q --silent --show-error --request GET --max-time 30 \
              --header "Authorization: Bearer ${VIGIA_SYNC_TOKEN}" \
              --output "${observation_file}" --write-out '%{http_code}' \
              "${VIGIA_SAFETY_GATE_SYNC_URL}?observe=1")"; then
              node -e '
                const fs = require("node:fs");
                const body = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
                console.log(JSON.stringify({ diagnosticHttp:Number(process.argv[1]),
                  recent:body?.recent ?? null, lease:body?.lease ?? null }));
              ' "${observe_code}" "${observation_file}" || true
            else
              echo "Read-only observation failed; mutation failure remains authoritative"
            fi
            exit "${mutation_exit}"
          fi

  oecd:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '22,52 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: vigia-oecd-recent
      cancel-in-progress: false
    env:
      VIGIA_OECD_SYNC_URL: https://vigia-alertas.csar68.chatgpt.site/api/oecd/sync
      VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
    steps:
      - name: Preflight OECD authorization
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VIGIA_SYNC_TOKEN"
          response_file="$RUNNER_TEMP/oecd-preflight.json"
          http_code="$(curl --silent --show-error --location --request POST \
            --header "Authorization: Bearer $VIGIA_SYNC_TOKEN" --max-time 30 \
            --output "$response_file" --write-out '%{http_code}' "$VIGIA_OECD_SYNC_URL?mode=preflight")"
          node -e '
            const fs=require("node:fs");
            const status=Number(process.argv[1]);
            const body=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
            if(status!==200||body?.authorized!==true||body?.source!=="OECD") throw new Error(`OECD preflight failed with HTTP ${status}`);
          ' "$http_code" "$response_file"

      - name: Detect bounded gap recovery
        id: observe
        shell: bash
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/oecd-observe.json"
          http_code="$(curl --silent --show-error --location \
            --header "Authorization: Bearer $VIGIA_SYNC_TOKEN" --max-time 60 \
            --output "$response_file" --write-out '%{http_code}' "$VIGIA_OECD_SYNC_URL?observe=1")"
          test "$http_code" = "200"
          node -e '
            const fs=require("node:fs");
            const body=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            const last=body?.recent?.lastSuccessAt;
            const gap=Boolean(last&&Date.now()-Date.parse(last)>7*24*60*60*1000);
            fs.appendFileSync(process.env.GITHUB_OUTPUT,`gap_recovery=${gap}\n`);
            console.log(JSON.stringify({gapRecovery:gap,lastSuccessAt:last??null,lease:body?.lease??null}));
          ' "$response_file"

      - name: Dry-run and create exact snapshot
        if: steps.observe.outputs.gap_recovery == 'true'
        id: recovery
        shell: bash
        run: |
          set -euo pipefail
          dry_file="$RUNNER_TEMP/oecd-dry-run.json"
          dry_status="$(curl --silent --show-error --location --retry 2 --retry-all-errors \
            --request POST --header "Authorization: Bearer $VIGIA_SYNC_TOKEN" \
            --max-time 840 --output "$dry_file" --write-out '%{http_code}' \
            "$VIGIA_OECD_SYNC_URL?mode=dry-run")"
          test "$dry_status" = "200"
          node -e '
            const fs=require("node:fs");
            const dry=JSON.parse(fs.readFileSync(process.argv[1],"utf8"))?.dryRun;
            if(!dry) throw new Error("Missing dryRun");
            console.log("DRY_RUN "+JSON.stringify(dry));
            if(!dry.zeroWrite) throw new Error("Dry-run wrote data");
            if(dry.counts?.unexpected!==0) throw new Error("Unexpected OECD classifications");
            fs.writeFileSync(process.argv[2],JSON.stringify({targetIds:dry.targetIds}));
          ' "$dry_file" "$RUNNER_TEMP/oecd-snapshot-request.json"
          snapshot_file="$RUNNER_TEMP/oecd-snapshot.json"
          snapshot_status="$(curl --silent --show-error --location --request POST \
            --header "Authorization: Bearer $VIGIA_SYNC_TOKEN" --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/oecd-snapshot-request.json" --max-time 180 \
            --output "$snapshot_file" --write-out '%{http_code}' "$VIGIA_OECD_SYNC_URL?mode=snapshot")"
          test "$snapshot_status" = "201"
          node -e '
            const fs=require("node:fs");
            const manifest=JSON.parse(fs.readFileSync(process.argv[1],"utf8"))?.snapshot;
            if(!manifest?.id||manifest?.status!=="ready"||manifest?.purpose!=="pre-reconciliation") throw new Error("Snapshot OECD not ready");
            fs.appendFileSync(process.env.GITHUB_OUTPUT,`snapshot_id=${manifest.id}\n`);
            console.log("SNAPSHOT "+JSON.stringify(manifest));
          ' "$snapshot_file"

      - name: Verify snapshot and run recovery twice
        if: steps.observe.outputs.gap_recovery == 'true'
        env:
          SNAPSHOT_ID: ${{ steps.recovery.outputs.snapshot_id }}
        shell: bash
        run: |
          set -euo pipefail
          node -e 'require("node:fs").writeFileSync(process.argv[1],JSON.stringify({snapshotId:process.env.SNAPSHOT_ID}))' "$RUNNER_TEMP/oecd-snapshot-id.json"
          verify_file="$RUNNER_TEMP/oecd-verify-snapshot.json"
          verify_status="$(curl --silent --show-error --location --request POST \
            --header "Authorization: Bearer $VIGIA_SYNC_TOKEN" --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/oecd-snapshot-id.json" --max-time 180 \
            --output "$verify_file" --write-out '%{http_code}' "$VIGIA_OECD_SYNC_URL?mode=verify-snapshot")"
          test "$verify_status" = "200"
          node -e '
            const fs=require("node:fs");
            const verification=JSON.parse(fs.readFileSync(process.argv[1],"utf8"))?.verification;
            if(verification?.sourceMatches!==true||verification?.snapshotId!==process.env.SNAPSHOT_ID) throw new Error("Snapshot verification failed");
            console.log("VERIFICATION "+JSON.stringify(verification));
          ' "$verify_file"

          first_file="$RUNNER_TEMP/oecd-sync-1.json"
          first_status="$(curl --silent --show-error --location --request POST \
            --header "Authorization: Bearer $VIGIA_SYNC_TOKEN" --header "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/oecd-snapshot-id.json" --max-time 840 \
            --output "$first_file" --write-out '%{http_code}' "$VIGIA_OECD_SYNC_URL?mode=recent")"
          test "$first_status" = "200"
          node -e '
            const fs=require("node:fs");
            const state=JSON.parse(fs.readFileSync(process.argv[1],"utf8"))?.state;
            if(state?.status!=="completed"||state?.pageErrors!==0||state?.detailFailures!==0||state?.lastError!==null) throw new Error(state?.lastError||"Sync 1 failed");
            if(state?.leaseOwnerId!==null||state?.leaseMode!==null||state?.leaseExpiresAt!==null) throw new Error("Sync 1 lease not released");
            console.log("SYNC_1 "+JSON.stringify(state));
          ' "$first_file"

          second_file="$RUNNER_TEMP/oecd-sync-2.json"
          second_status="$(curl --silent --show-error --location --request POST \
            --header "Authorization: Bearer $VIGIA_SYNC_TOKEN" --max-time 840 \
            --output "$second_file" --write-out '%{http_code}' "$VIGIA_OECD_SYNC_URL?mode=recent")"
          test "$second_status" = "200"
          node -e '
            const fs=require("node:fs");
            const state=JSON.parse(fs.readFileSync(process.argv[1],"utf8"))?.state;
            if(state?.status!=="completed"||state?.recordsPersisted!==0||state?.newCount!==0||state?.updatedCount!==0) throw new Error("Sync 2 was not zero-write");
            if(state?.pageErrors!==0||state?.detailFailures!==0||state?.lastError!==null) throw new Error("Sync 2 reported failures");
            if(state?.leaseOwnerId!==null||state?.leaseMode!==null||state?.leaseExpiresAt!==null) throw new Error("Sync 2 lease not released");
            console.log("SYNC_2 "+JSON.stringify(state));
          ' "$second_file"

      - name: Audit recovered OECD invariants
        if: steps.observe.outputs.gap_recovery == 'true'
        shell: bash
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/oecd-final-audit.json"
          http_code="$(curl --silent --show-error --location --request POST \
            --header "Authorization: Bearer $VIGIA_SYNC_TOKEN" --max-time 300 \
            --output "$response_file" --write-out '%{http_code}' "$VIGIA_OECD_SYNC_URL?mode=verify")"
          test "$http_code" = "200"
          node -e '
            const fs=require("node:fs");
            const audit=JSON.parse(fs.readFileSync(process.argv[1],"utf8"))?.audit;
            if(!audit) throw new Error("Missing OECD audit");
            const integrity=audit.integrity??{};
            for(const key of ["duplicateReferenceGroups","invalidIdentities","emptyCanonicalRows","invalidOfficialUrls"]){
              if(integrity[key]!==0) throw new Error(`OECD invariant failed: ${key}=${integrity[key]}`);
            }
            console.log("FINAL_AUDIT "+JSON.stringify(audit));
          ' "$response_file"

      - name: Normal bounded recent
        if: steps.observe.outputs.gap_recovery != 'true'
        shell: bash
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/oecd-sync.json"
          http_code="$(curl --silent --show-error --location --request POST \
            --header "Authorization: Bearer $VIGIA_SYNC_TOKEN" --max-time 840 \
            --output "$response_file" --write-out '%{http_code}' "$VIGIA_OECD_SYNC_URL?mode=recent")"
          test "$http_code" = "200"
          node -e '
            const fs=require("node:fs");
            const state=JSON.parse(fs.readFileSync(process.argv[1],"utf8"))?.state;
            if(state?.status!=="completed"||state?.pageErrors!==0||state?.detailFailures!==0||state?.lastError!==null) throw new Error(state?.lastError||"OECD recent failed");
            if(state?.leaseOwnerId!==null||state?.leaseMode!==null||state?.leaseExpiresAt!==null) throw new Error("OECD recent lease not released");
            console.log("RECENT "+JSON.stringify(state));
          ' "$response_file"
