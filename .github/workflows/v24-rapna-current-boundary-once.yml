name: V24 RAPNA current budget-boundary proof one-shot
on:
  push:
    branches: [audit/v24-rapna-current-boundary-20261012]
    paths: [.github/workflows/v24-rapna-current-boundary-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: GET official audit and SELECT final effects only
        env:
          T: ${{ secrets.VIGIA_SYNC_TOKEN }}
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const out=(stage,data)=>console.log('V24_CURRENT_BOUNDARY '+JSON.stringify({stage,...data}));
          const sync=process.env.T,cf=process.env.CF,job='ab50d0f7-0ad7-4fb5-8078-f6c376aa8f53';
          const root='https://vigia-runtime.c-gamiz93.workers.dev';
          const d1='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f/d1/database/55596003-1b90-4f66-aad8-decb21205f13/query';
          if(!sync||!cf){out('verdict',{state:'HOLD',reason:'missing existing secret'});process.exit(2);}
          let queries=0,readCount=0;
          async function get(url,token){
            if(![root+'/api/source-reliability?observe=1',root+'/api/rapna/sync?observe=1',root+'/api/rapna/sync?audit=1'].includes(url))throw Error('GET_DENIED');
            const r=await fetch(url,{method:'GET',headers:{Authorization:'Bearer '+token,Accept:'application/json'},redirect:'error',signal:AbortSignal.timeout(55000)});
            const s=await r.text();if(r.status!==200||s.length>1500000)throw Error('GET_UNAVAILABLE_'+r.status);
            return JSON.parse(s);
          }
          async function select(label,sql,params=[]){
            if(++queries>4||!/^SELECT\s/u.test(sql)||sql.includes(';')||/\b(UPDATE|DELETE|INSERT|ALTER|CREATE|DROP|PRAGMA|REPLACE)\b/iu.test(sql))throw Error('SQL_DENIED');
            const r=await fetch(d1,{method:'POST',headers:{Authorization:'Bearer '+cf,'Content-Type':'application/json'},body:JSON.stringify({sql,params}),redirect:'error',signal:AbortSignal.timeout(20000)});
            const j=await r.json().catch(()=>null),v=j?.result?.[0];
            if(r.status!==200||j?.success!==true||!Array.isArray(v?.results)||v.meta?.rows_written!==0)throw Error('SQL_UNAVAILABLE_'+r.status);
            readCount+=v.meta.rows_read||0;if(readCount>5000)throw Error('SQL_READ_LIMIT');
            return v.results;
          }
          try{
            const c=await get(root+'/api/source-reliability?observe=1',sync);
            if(c.buildSha!=='d5fcd11cbeb563258b4bbdc9482a80b8684c81d3'||c.mode!=='five-source-coordinated')throw Error('BASELINE_CHANGED');
            const rapna=c.state?.revisionAttempts?.['RAPNA:current-parity'];
            if(rapna?.id!==job||rapna.outcome!=='unknown')throw Error('JOB_CHANGED');
            const view=await get(root+'/api/rapna/sync?observe=1',sync);
            const state=view.currentParity,cert=view.currentRevisionCertification;
            if(state?.status!=='completed'||state.cursor!==6||state.totalUnits!==6||cert?.completedAt===state.completedAt)throw Error('STATE_CHANGED');
            const base=await select('job',"SELECT id,epoch,deadline,started_at,finished_at,phase,write_intent_at,json_extract(receipt_json,'$.outcome') AS outcome,json_extract(receipt_json,'$.reason') AS reason,json_extract(receipt_json,'$.state.status') AS receipt_state_status,json_extract(receipt_json,'$.state.completedAt') AS receipt_completed_at,json_extract(receipt_json,'$.requests') AS upstream_requests FROM source_reliability_jobs WHERE id=? LIMIT 1",[job]);
            out('job',{rows:base.map(z=>({...z,reason:z.reason?.slice(0,100)}))});
            const stats=await select('stats',"SELECT COUNT(*) AS markers,COUNT(DISTINCT ordinal) AS distinct_ordinals,MIN(ordinal) AS min_ordinal,MAX(ordinal) AS max_ordinal,SUM(CASE WHEN committed_at IS NULL OR result_json IS NULL THEN 1 ELSE 0 END) AS pending, SUM(CASE WHEN json_extract(result_json,'$.checkpoint.status')='completed' THEN 1 ELSE 0 END) AS completed_checkpoints, SUM(CASE WHEN EXISTS(SELECT 1 FROM json_each(source_reliability_effects.manifest_json,'$.writes') WHERE json_extract(value,'$.sql') LIKE '%source_revision_certifications%') THEN 1 ELSE 0 END) AS certification_intents FROM source_reliability_effects WHERE job_id=?",[job]);
            out('stats',{rows:stats});
            const tail=await select('tail',"SELECT ordinal,committed_at,json_extract(result_json,'$.checkpoint.status') AS status,json_extract(result_json,'$.checkpoint.cursor') AS cursor,json_extract(result_json,'$.checkpoint.completed_at') AS completed_at,json_extract(result_json,'$.checkpoint.plan_version') AS plan_version,json_extract(result_json,'$.statementCount') AS statements,manifest_json,result_json FROM source_reliability_effects WHERE job_id=? AND ordinal>=109 AND ordinal<=114 ORDER BY ordinal",[job]);
            const summary=tail.map(x=>{
              const m=JSON.parse(x.manifest_json||'{}'),r=JSON.parse(x.result_json||'{}');
              const tables=(m.writes||[]).map(w=>(/^\s*(?:INSERT\s+(?:OR\s+\w+\s+)?INTO|UPDATE|DELETE\s+FROM)\s+([a-z_]+)/iu.exec(w.sql)||[])[1]||'unknown');
              return {ordinal:x.ordinal,committed_at:x.committed_at,status:x.status,cursor:x.cursor,completedAt:x.completed_at,planVersionMatches:x.plan_version===state.planVersion,
                statements:x.statements,tables:[...new Set(tables)],writes:tables.length,hasCheckpoint:!!r.checkpoint};
            });
            out('tail',{rows:summary});
            const certPresence=await select('cert','SELECT source,mode,cycle_id,completed_at,audit_status,coverage FROM source_revision_certifications WHERE source=? AND mode=? LIMIT 1',['RAPNA','current-parity']);
            const summaryState={status:state.status,cursor:state.cursor,total:state.totalUnits,completedAt:state.completedAt,
              planVersion:state.planVersion,hasLastError:!!state.lastError,detailFailures:state.detailFailures,pageErrors:state.pageErrors};
            out('current',{state:summaryState,cert:certPresence,coordinatorLease:c.activeLease,sourceLease:!!view.lease});
            // Expensive but already deployed, existing read-only independent integrity audit.
            const raw=await get(root+'/api/rapna/sync?audit=1',sync),a=raw.audit;
            out('audit',{checkedAt:a?.checkedAt,counts:a?.counts,integrity:a?.integrity,snapshot:a?.snapshot?{status:a.snapshot.status,sourceAlertCount:a.snapshot.sourceAlertCount,missingCount:a.snapshot.missingRapnaAlerts?.length??null,changedCount:a.snapshot.changedRapnaAlerts?.length??null}:null});
            out('verdict',{state:'PASS_READONLY_BOUNDARY',queries,readCount,rowsWritten:0,sourceJobs:0,certificationWrites:0,featureChanges:0,rollouts:0,
              auditIsCurrentNotHistorical:true});
          }catch(e){out('verdict',{state:'HOLD',reason:e instanceof Error?e.message:'unknown',queries,readCount,sourceJobs:0,writes:0});process.exitCode=1;}
          NODE
