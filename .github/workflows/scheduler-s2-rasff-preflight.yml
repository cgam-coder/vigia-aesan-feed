name: Scheduler S2 RASFF activation preflight

on:
  push:
    branches: [work/scheduler-reliability-s0-evidence]
    paths:
      - ".github/workflows/scheduler-s2-rasff-preflight.yml"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read RASFF live control state
        env:
          VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.VIGIA_SYNC_TOKEN;
          const url="https://vigia-runtime.c-gamiz93.workers.dev/api/rasff/sync?observe=1";
          const r=await fetch(url,{
            headers:{Authorization:`Bearer ${token}`,Accept:"application/json"},
            signal:AbortSignal.timeout(60000)
          });
          let body=null; try{body=await r.json();}catch{}
          if(!r.ok||!body) throw new Error(`RASFF_OBSERVE_HTTP_${r.status}`);
          const now=Date.now();
          const leaseExpires=Date.parse(body?.lease?.expiresAt??"");
          const leaseActive=Boolean(body?.lease&&Number.isFinite(leaseExpires)&&leaseExpires>now);
          const recentAge=body?.recent?.lastSuccessAt
            ? Math.round((now-Date.parse(body.recent.lastSuccessAt))/600)/100 : null;
          const result={
            status:leaseActive?"HOLD":"PASS",
            recentStatus:body?.recent?.status??null,
            recentLastSuccessAt:body?.recent?.lastSuccessAt??null,
            recentAgeMinutes:recentAge,
            recentPageErrors:body?.recent?.pageErrors??null,
            recentDetailFailures:body?.recent?.detailFailures??null,
            recentLastErrorPresent:Boolean(body?.recent?.lastError),
            reconcileStatus:body?.reconcile?.status??null,
            reconcileLastSuccessAt:body?.reconcile?.lastSuccessAt??null,
            reconcileCompletedAt:body?.reconcile?.completedAt??null,
            backfillStatus:body?.backfill?.status??null,
            leaseActive,
            leaseMode:leaseActive?(body?.lease?.mode??null):null
          };
          console.log(JSON.stringify(result));
          if(result.status!=="PASS")process.exit(1);
          NODE
