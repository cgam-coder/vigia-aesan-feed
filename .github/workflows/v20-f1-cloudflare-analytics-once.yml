name: V20 F1 final SQL-family ranking (read-only GraphQL)
on:
  push:
    branches: [audit/v20-f1-consumption-readonly-20261011]
    paths: [.github/workflows/v20-f1-cloudflare-analytics-once.yml]
permissions: { contents: read }
concurrency:
  group: vigia-v20-f1-analytics-20261011
  cancel-in-progress: false
jobs:
  analytics:
    if: github.repository == 'cgam-coder/vigia-aesan-feed' && github.actor == 'cgam-coder' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Categorize top query families without printing SQL or parameters
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CF_TOKEN,emit=x=>console.log('V20_SQL_FAMILY '+JSON.stringify(x));
          if(!token){emit({status:'HOLD',reason:'missing-token'});process.exitCode=1;process.exit();}
          const query='query TopD1($accountTag: string!, $db: string, $day: Date) {viewer {accounts(filter:{accountTag:$accountTag}) {d1QueriesAdaptiveGroups(limit:12,filter:{date:$day,databaseId:$db},orderBy:[sum_rowsRead_DESC]) {count sum {rowsRead rowsReturned rowsWritten} dimensions {query}}}}}';
          try{
            const r=await fetch('https://api.cloudflare.com/client/v4/graphql',{method:'POST',redirect:'error',
              headers:{Authorization:'Bearer '+token,Accept:'application/json','Content-Type':'application/json'},
              body:JSON.stringify({query,variables:{accountTag:'9c1807c68493f14259248b5f5782cc6f',db:'55596003-1b90-4f66-aad8-decb21205f13',day:'2026-10-10'}}),
              signal:AbortSignal.timeout(16000)});
            const j=await r.json().catch(()=>null);
            const rows=j?.data?.viewer?.accounts?.[0]?.d1QueriesAdaptiveGroups;
            if(r.status!==200||!Array.isArray(rows)){emit({status:'HOLD',http:r.status});process.exitCode=1;process.exit();}
            const groups=[
              ['core-alerts',/\balerts\b/iu],
              ['alias-and-identities',/\b(?:alert_aliases|alert_source_identities)\b/iu],
              ['geographies',/\balert_geographies\b/iu],
              ['dimensions-and-taxonomy',/\b(?:alert_dimension_state|alert_categories|alert_hazards|alert_actors)\b/iu],
              ['versions',/\balert_versions\b/iu],
              ['source-observations',/\b(?:source_checks|source_freshness)\b/iu],
              ['source-sync',/\b(?:source_sync_state|source_sync_locks)\b/iu],
              ['historical-certificates',/\bsource_revision_certifications\b/iu],
              ['journals-and-recovery',/\bsource_reliability_\w+\b/iu],
              ['snapshots',/\bsource_backfill_\w+\b/iu],
              ['metadata',/\b(?:sqlite_schema|sqlite_master|d1_migrations)\b/iu],
            ];
            const result=[];
            for(const x of rows){
              const sql=typeof x.dimensions?.query==='string'?x.dimensions.query:'';
              const match=groups.filter(([_,re])=>re.test(sql)).map(([name])=>name);
              const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(sql));
              const hash=[...new Uint8Array(digest)].slice(0,6).map(v=>v.toString(16).padStart(2,'0')).join('');
              result.push({hash,category:match,sqlLength:sql.length,
                reads:Number.isFinite(x.sum?.rowsRead)?x.sum.rowsRead:null,
                returned:Number.isFinite(x.sum?.rowsReturned)?x.sum.rowsReturned:null,
                count:Number.isFinite(x.count)?x.count:null,
                shape:{count:/\bCOUNT\s*\(/iu.test(sql),distinct:/\bDISTINCT\b/iu.test(sql),
                  where:/\bWHERE\b/iu.test(sql),join:/\bJOIN\b/iu.test(sql),
                  select:/^\s*(?:SELECT|WITH)\b/iu.test(sql),limit:/\bLIMIT\b/iu.test(sql)}});
            }
            emit({status:'PASS',date:'2026-10-10',ranking:result,note:'GraphQL adaptive sampling, no raw query/params'});
          }catch(e){emit({status:'HOLD',reason:e?.name??'transport'});process.exitCode=1;}
          NODE
