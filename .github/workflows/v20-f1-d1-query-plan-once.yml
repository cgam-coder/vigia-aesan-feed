name: V20 F1 safe D1 query-plan observation (one shot)
on:
  push:
    branches: [audit/v20-f1-consumption-readonly-20261011]
    paths: [.github/workflows/v20-f1-d1-query-plan-once.yml]
permissions: { contents: read }
concurrency:
  group: vigia-v20-f1-plan-readonly
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'cgam-coder/vigia-aesan-feed' && github.actor == 'cgam-coder' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read D1 index and EXPLAIN plans without executing costly COUNT queries
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CF_TOKEN,out=x=>console.log('V20_PLAN '+JSON.stringify(x));
          if(!token){out({status:'HOLD',reason:'token-unavailable'});process.exitCode=1;process.exit();}
          // Generic structural probes deliberately omit the private Runner's full CAS SQL.
          const entries=[
            ['count-by-source','EXPLAIN QUERY PLAN SELECT COUNT(*),MAX(id) FROM source_checks WHERE source = ?',["RAPNA"]],
            ['count-all','EXPLAIN QUERY PLAN SELECT COUNT(*),MAX(id) FROM source_checks',[]],
            ['index-list',"PRAGMA index_list('source_checks')",[]]
          ];
          const all=entries.map(([label,sql,params])=>({label,sql,params}));
          if(all.some(x=>!/^(?:EXPLAIN QUERY PLAN SELECT|PRAGMA index_list\('source_checks'\)$)/u.test(x.sql)))throw Error('Disallowed statement');
          for(const {label,sql,params} of all){
            try{
              const r=await fetch('https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f/d1/database/55596003-1b90-4f66-aad8-decb21205f13/query',{
                method:'POST',redirect:'error',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',Accept:'application/json'},
                body:JSON.stringify({sql,params}),signal:AbortSignal.timeout(13000)});
              const j=await r.json().catch(()=>null),v=Array.isArray(j?.result)?j.result[0]:j?.result;
              if(!r.ok||j?.success!==true||!Array.isArray(v?.results)){
                out({label,http:r.status,success:false,errorCodes:(j?.errors??[]).map(e=>e.code).filter(Number.isInteger).slice(0,3)});
                process.exitCode=1;continue;
              }
              if(label==='index-list')out({label,http:r.status,success:true,indexes:v.results.slice(0,12).map(x=>({
                name:typeof x.name==='string'&&/^[a-z0-9_]{1,100}$/i.test(x.name)?x.name:'other',
                unique:x.unique===1,origin:typeof x.origin==='string'?x.origin.slice(0,10):null,partial:x.partial===1
              }))});
              else out({label,http:r.status,success:true,steps:v.results.slice(0,10).map(x=>({
                id:Number.isSafeInteger(x.id)?x.id:null,parent:Number.isSafeInteger(x.parent)?x.parent:null,
                kind:/\bSEARCH\b/.test(x.detail)?'SEARCH':/\bSCAN\b/.test(x.detail)?'SCAN':'OTHER',
                covering:/COVERING INDEX/iu.test(x.detail),sourceChecksIndex:/source_checks_source_date_idx/iu.test(x.detail),
                rowid:/INTEGER PRIMARY KEY|rowid/iu.test(x.detail),
                usesTempTree:/TEMP B-TREE/iu.test(x.detail)
              }))});
            }catch(e){out({label,success:false,reason:e?.name??'Error'});process.exitCode=1;}
          }
          NODE
