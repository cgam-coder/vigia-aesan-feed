name: V22 F1 monthly D1 consumption and billing permission (read only)
on:
  push:
    branches: [audit/v22-f1-d1-billing-20261011]
    paths: [.github/workflows/v22-f1-d1-monthly-cost-one-shot.yml]
permissions: { contents: read }
concurrency:
  group: v22-f1-monthly-cost-20261011
  cancel-in-progress: false
jobs:
  observe:
    if: github.repository == 'cgam-coder/vigia-aesan-feed' && github.actor == 'cgam-coder' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read D1 usage and billing endpoint only; never query D1 database
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CF_TOKEN;
          const account='9c1807c68493f14259248b5f5782cc6f',db='55596003-1b90-4f66-aad8-decb21205f13';
          const emit=o=>console.log('V22_D1_MONTH '+JSON.stringify(o));
          if(!token){emit({kind:'gate',outcome:'HOLD',reason:'token-unavailable'});process.exitCode=1;process.exit();}
          const query='query Metrics($accountTag:string!,$db:string,$from:Date,$to:Date){viewer{accounts(filter:{accountTag:$accountTag}){d1AnalyticsAdaptiveGroups(limit:48,filter:{databaseId:$db,date_geq:$from,date_leq:$to},orderBy:[date_ASC]){sum{rowsRead rowsWritten readQueries writeQueries} dimensions{date databaseId}}}}}';
          async function gql(from,to){
            try{
              const r=await fetch('https://api.cloudflare.com/client/v4/graphql',{method:'POST',redirect:'error',
                headers:{Authorization:'Bearer '+token,Accept:'application/json','Content-Type':'application/json'},
                body:JSON.stringify({query,variables:{accountTag:account,db,from,to}}),signal:AbortSignal.timeout(16000)});
              const j=await r.json().catch(()=>null);
              const raw=j?.data?.viewer?.accounts?.[0]?.d1AnalyticsAdaptiveGroups;
              const errors=(j?.errors??[]).map(x=>String(x?.message??'query-error').slice(0,90)).slice(0,2);
              const good=r.status===200&&Array.isArray(raw)&&errors.length===0&&raw.every(x=>x.dimensions?.databaseId===db);
              const rows=good?raw.map(x=>({day:x.dimensions.date,rowsRead:x.sum?.rowsRead,
                rowsWritten:x.sum?.rowsWritten,readQueries:x.sum?.readQueries,writeQueries:x.sum?.writeQueries})):[];
              const metrics=['rowsRead','rowsWritten','readQueries','writeQueries'];
              const totals=Object.fromEntries(metrics.map(k=>[k,rows.reduce((n,v)=>n+(Number.isFinite(v[k])?v[k]:0),0)]));
              emit({kind:'monthly',period:[from,to],http:r.status,complete:good,days:rows.length,
                totals,dates:rows.map(x=>x.day),dailyTop:rows.slice().sort((a,b)=>b.rowsRead-a.rowsRead).slice(0,4),
                adaptiveSample:true,errors});
              return good&&rows.length>0;
            }catch {emit({kind:'monthly',period:[from,to],http:0,complete:false,reason:'transport'});return false;}
          }
          const september=await gql('2026-09-01','2026-09-30');
          const october=await gql('2026-10-01','2026-10-10');
          try{
            const r=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/billable-usage',{
              method:'GET',redirect:'error',headers:{Authorization:'Bearer '+token,Accept:'application/json'},
              signal:AbortSignal.timeout(12000)});
            const j=await r.json().catch(()=>null),a=Array.isArray(j?.result)?j.result:[];
            const group={};for(const x of a){
              const name=String(x.ServiceName??x.ProductName??x.Service??x.Product??'').toLowerCase();
              const type=/d1|database/.test(name)?'D1':/worker/.test(name)?'Workers':'other';
              const cost=Number(x.BilledCost);
              if(!group[type])group[type]={items:0,nonnegativeCostSample:0};
              group[type].items++;if(Number.isFinite(cost)&&cost>=0)group[type].nonnegativeCostSample+=cost;
            }
            emit({kind:'billing_permission',http:r.status,success:j?.success===true,
              accessible:r.status===200&&j?.success===true,resultRows:a.length,
              groups:Object.entries(group).map(([type,v])=>({type,items:v.items,
                nonnegativeCostSample:+v.nonnegativeCostSample.toFixed(6)})),
              note:'billable-usage may span billing periods and is not a final monthly invoice'});
          }catch {emit({kind:'billing_permission',http:0,success:false,reason:'transport'});}
          emit({kind:'decision',september,october,source:'Cloudflare Adaptive GraphQL',readOnly:true,
            note:'usage estimates, no SQL, no D1 writes, no configuration changes'});
          if(!september||!october)process.exitCode=1;
          NODE
