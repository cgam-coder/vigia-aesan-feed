name: RAPNA category candidate failed-build log read

on:
  push:
    branches: [sec-f1/cloudflare-api-readonly-20261009]
    paths: [.github/workflows/rapna-category-f1-build-log-read.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Inspect exactly one Cloudflare build log GET, print errors only
        shell: bash
        env:
          CF_BUILD_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CF_BUILD_TOKEN;
          const output=(x)=>console.log('RAPNA_CATEGORY_CI '+JSON.stringify(x));
          if(!token){output({auth:false});process.exitCode=1;process.exit();}
          const build='9fff63e9-24b5-4aaf-a1b8-e4f898bd1c4f';
          const endpoint='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f/builds/builds/'+build+'/logs';
          try{
            const r=await fetch(endpoint,{method:'GET',redirect:'error',headers:{Authorization:'Bearer '+token,Accept:'application/json'},signal:AbortSignal.timeout(17000)});
            const data=await r.json().catch(()=>null);
            const rows=Array.isArray(data?.result?.lines)?data.result.lines:[];
            const lines=rows.map(x=>Array.isArray(x)?String(x.at(-1)):String(x)).filter(x=>/error|fail|not found|test:|TS[0-9]{4}|undefined|cannot find/i.test(x));
            output({http:r.status,success:data?.success===true,error_codes:data?.errors?.map(x=>x.code)||[],
              matched_lines:lines.slice(-30).map(s=>s.slice(0,360)).map(x=>x.replace(/Bearer\s+\S+/g,'Bearer [REDACTED]')),
              raw_logs_discarded:true,log_line_count:rows.length,truncated:data?.result?.truncated??null});
          }catch(e){output({outcome:'failed_read',error_type:e?.name??'Error'});}
          NODE
