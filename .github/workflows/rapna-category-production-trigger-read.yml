name: RAPNA category inspect production vs preview build trigger (GET only)
on:
  push:
    branches: [sec-f1/cloudflare-api-readonly-20261009]
    paths: [.github/workflows/rapna-category-production-trigger-read.yml]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Only GET worker build triggers and historical/current build metadata
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CF_TOKEN;
          const base='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f';
          const output=(x)=>console.log('RAPNA_BUILD_BRANCH_READ '+JSON.stringify(x));
          if(!token){output({gate:'auth',ok:false});process.exitCode=1;process.exit();}
          const get=async(path)=>{
            const r=await fetch(base+path,{method:'GET',redirect:'error',headers:{Authorization:'Bearer '+token,Accept:'application/json'},signal:AbortSignal.timeout(15000)});
            return {http:r.status,payload:await r.json().catch(()=>null)};
          };
          try{
            const scripts=await get('/workers/scripts');
            const all=Array.isArray(scripts.payload?.result)?scripts.payload.result:[];
            const worker=all.find(x=>x.id==='vigia-runtime');
            output({gate:'script',http:scripts.http,success:scripts.payload?.success===true,found:!!worker,has_tag:typeof worker?.tag==='string'});
            if(worker?.tag){
              const triggers=await get('/builds/workers/'+encodeURIComponent(worker.tag)+'/triggers');
              const rows=Array.isArray(triggers.payload?.result)?triggers.payload.result:[];
              output({gate:'triggers',http:triggers.http,success:triggers.payload?.success===true,
                error_codes:triggers.payload?.errors?.map(x=>x.code)||[],count:rows.length,
                items:rows.slice(0,5).map(x=>({name:String(x.trigger_name??'').slice(0,70),
                  branches_included:x.branch_includes??null,branches_excluded:x.branch_excludes??null,
                  build_command:String(x.build_command??'').slice(0,120),deploy_command:String(x.deploy_command??'').slice(0,120),
                  default_branch:x.default_branch??null,trigger_uuid_present:typeof x.trigger_uuid==='string'}))});
            }
            for(const id of ['e484e709-d269-4a72-b9f4-aaa8be072f7f','2046b4ce-3be3-4779-9bf8-4b7d5878bebe']){
              const b=await get('/builds/builds/'+id);
              const x=b.payload?.result??{};
              output({gate:'build_metadata',id,http:b.http,success:b.payload?.success===true,
                fields:Object.keys(x).filter(k=>/branch|trigger|status|environment|deploy|commit|build|source|repo/i.test(k)).slice(0,25),
                status:x.status??null,branch:x.branch??x.build_branch??null,
                trigger_name:x.trigger_name??null,reason:x.reason??null,
                result:x.result??null});
              const logs=await get('/builds/builds/'+id+'/logs');
              const lines=Array.isArray(logs.payload?.result?.lines)?logs.payload.result.lines:[];
              const marked=lines.map(row=>Array.isArray(row)?String(row.at(-1)):String(row))
                .filter(x=>/wrangler\s+(?:deploy|preview|versions upload)|Production|Preview|Deployment|deploy command|Success|Failed|Error/i.test(x))
                .filter(x=>!/Bearer|token|secret|password|api_key/i.test(x));
              output({gate:'build_logs',id,http:logs.http,success:logs.payload?.success===true,
                line_count:lines.length,sanitized_tail:marked.slice(-16).map(x=>x.slice(0,220))});
            }
          }catch(e){output({gate:'read_failed',error_type:e?.name??'Error'});process.exitCode=1;}
          NODE
