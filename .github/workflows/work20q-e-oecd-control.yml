name: WORK20Q-E OECD production dry-run

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/work20q-e-oecd-control.yml

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VIGIA_OECD_SYNC_URL: https://vigia-alertas.csar68.chatgpt.site/api/oecd/sync
      VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
    steps:
      - name: Classify gap and current window without writes
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VIGIA_SYNC_TOKEN"
          response_file="$RUNNER_TEMP/oecd-dry-run.json"
          http_code="$(curl --silent --show-error --location --retry 2 --retry-all-errors \
            --request POST --header "Authorization: Bearer $VIGIA_SYNC_TOKEN" \
            --max-time 840 --output "$response_file" --write-out '%{http_code}' \
            "$VIGIA_OECD_SYNC_URL?mode=dry-run")"
          test "$http_code" = "200"
          node -e '
            const fs=require("node:fs");
            const dry=JSON.parse(fs.readFileSync(process.argv[1],"utf8"))?.dryRun;
            if(!dry) throw new Error("Missing dryRun");
            console.log(JSON.stringify(dry));
            if(!dry.zeroWrite) throw new Error("Dry-run wrote data");
            if(dry.counts?.unexpected!==0) throw new Error("Unexpected OECD classifications");
          ' "$response_file"
