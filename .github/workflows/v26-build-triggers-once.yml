name: V26 audit Cloudflare Workers Builds triggers GET only
on:
  push:
    branches: [audit/v26-runtime-build-trigger-readonly-20261012]
    paths: [.github/workflows/v26-build-triggers-once.yml]
permissions:
  contents: read
jobs:
  observe:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Discover runtime and Runner tags, list build triggers without mutation
        shell: bash
        run: |
          node <<'NODE'
          (async()=>{
            const t=process.env.CF_TOKEN||'',root='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f';
            if(!t)throw Error('NO_AUDITOR_TOKEN');
            let calls=0;
            const get=async endpoint=>{
              if(++calls>4)throw Error('GET_CAP');
              const r=await fetch(root+endpoint,{method:'GET',
                headers:{Authorization:'Bearer '+t,Accept:'application/json'},
                redirect:'error',signal:AbortSignal.timeout(14000)});
              const b=await r.json().catch(()=>null);
              return {http:r.status,ok:r.status===200&&b?.success===true,data:b?.result||null,errorCodes:(b?.errors||[]).map(x=>x.code).slice(0,3)};
            };
            const scripts=await get('/workers/scripts');
            const rows=Array.isArray(scripts.data)?scripts.data:[];
            const selected=rows.filter(x=>['vigia-runtime','vigia-source-runner'].includes(x.id||x.name));
            const out={scriptsHttp:scripts.http,scriptsOK:scripts.ok,workerCount:rows.length,
              workers:selected.map(x=>({name:x.id||x.name,tagPresent:typeof x.tag==='string',tagPrefix:String(x.tag||'').slice(0,8)})),
              source:'Cloudflare authenticated GET',actions:'none',writes:0,deploys:0,builds:0};
            const triggers={};
            for(const x of selected){
              const name=x.id||x.name;
              if(typeof x.tag!=='string')continue;
              const z=await get('/builds/workers/'+encodeURIComponent(x.tag)+'/triggers');
              const a=Array.isArray(z.data)?z.data:[];
              triggers[name]={http:z.http,ok:z.ok,count:a.length,config:a.map(v=>({
                name:String(v.trigger_name||''),branches:Array.isArray(v.branch_includes)?v.branch_includes:[],
                excludedBranches:Array.isArray(v.branch_excludes)?v.branch_excludes:[],
                deployCommand:String(v.deploy_command||'').slice(0,120),
                buildCommand:String(v.build_command||'').slice(0,100),
                pathIncludes:Array.isArray(v.path_includes)?v.path_includes.slice(0,12):[],
                pathExcludes:Array.isArray(v.path_excludes)?v.path_excludes.slice(0,12):[]
              }))};
            }
            out.triggers=triggers;out.requests=calls;
            console.log('V26_CF_TRIGGERS '+JSON.stringify(out));
            if(!scripts.ok||!selected.some(x=>(x.id||x.name)==='vigia-runtime'))process.exitCode=2;
          })().catch(e=>{console.log('V26_CF_TRIGGERS '+JSON.stringify({status:'HOLD',reason:e.name||'unknown',writes:0}));process.exitCode=2});
          NODE
