name: TEMP Appium dependency repair and clean installation
# Revision 2: use the already-tested graph checker and preserve generated inputs before gates.
# Preparation only; this workflow cannot allocate macOS or interact with the product.
"on":
  push:
    branches: [diag/ui-f1a-ios-simulator-20261001]
    paths: [.github/workflows/ui-f1a-appium-dependencies.yml]
permissions:
  contents: read
concurrency:
  group: nagamealert-appium-dependency-repair
  cancel-in-progress: false
jobs:
  verify:
    if: >-
      github.repository == 'cgam-coder/vigia-aesan-feed' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/diag/ui-f1a-ios-simulator-20261001' &&
      github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Original repository and coordinated security suite
        id: security
        run: |
          npm test
          node --test security-checks/workflow-security.test.mjs .diagnostics/appium-dependencies/scope.test.mjs
          python3 -m py_compile .diagnostics/appium-dependencies/resolve.py
          node --check .diagnostics/appium-dependencies/check-graph.cjs
      - name: Complete graph and clean install, never a native campaign
        run: python3 .diagnostics/appium-dependencies/resolve.py
      - name: Preserve only public dependency lock and validation logs
        if: always() && steps.security.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: appium-reviewed-deps-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/appium-reviewed-deps/package.json
            ${{ runner.temp }}/appium-reviewed-deps/package-lock.json
            ${{ runner.temp }}/appium-reviewed-deps/dependency-proof.json
            ${{ runner.temp }}/appium-reviewed-deps/01-dependency.log
            ${{ runner.temp }}/appium-reviewed-deps/02-dependency.log
            ${{ runner.temp }}/appium-reviewed-deps/03-resolve.log
            ${{ runner.temp }}/appium-reviewed-deps/04-graph.json
            ${{ runner.temp }}/appium-reviewed-deps/05-clean-install.log
            ${{ runner.temp }}/appium-reviewed-deps/06-installed-tree.json
            ${{ runner.temp }}/appium-reviewed-deps/07-appium-version.log
            ${{ runner.temp }}/appium-reviewed-deps/08-discovery.json
            ${{ runner.temp }}/appium-reviewed-deps/09-darwin-resolution-dry-run.log
          if-no-files-found: error
          retention-days: 2
