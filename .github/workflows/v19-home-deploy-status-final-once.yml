name: V19 home final release status GET only
on:
  push:
    branches: [sec-f1/cloudflare-api-readonly-20261009]
    paths: [.github/workflows/v19-home-deploy-status-final-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.actor == 'cgam-coder'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read exact production build/deployment, no writes
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CF_TOKEN;
          if(!token)throw Error('TOKEN_UNAVAILABLE');
          const root='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f';
          const get=async p=>{const r=await fetch(root+p,{method:'GET',redirect:'error',
            headers:{Authorization:'Bearer '+token,Accept:'application/json'},signal:AbortSignal.timeout(15000)});
            const j=await r.json().catch(()=>null);
            if(r.status!==200||j?.success!==true)throw Error('GET_FAIL_'+r.status);
            return j.result;
          };
          const ds=await get('/workers/scripts/vigia-runtime/deployments');
          console.log('V19_HOME_LIVE '+JSON.stringify((ds.deployments??[]).slice(0,2).map(d=>({
            id:d.id,created:d.created_on,versions:d.versions?.map(v=>({id:v.version_id,pct:v.percentage}))
          }))));
          const list=await get('/workers/scripts');
          const tag=(Array.isArray(list)?list:[]).find(s=>s.id==='vigia-runtime')?.tag;
          if(!tag)throw Error('WORKER_TAG_UNAVAILABLE');
          const data=await get('/builds/workers/'+encodeURIComponent(tag)+'/builds');
          const bs=Array.isArray(data)?data:(data?.builds??[]);
          const sel=bs.filter(b=>b.build_trigger_metadata?.commit_hash==='c52f638f50177ebb38ac364e8d8587a19aa42d7b');
          console.log('V19_HOME_BUILD '+JSON.stringify(sel.map(b=>({
            sha:b.build_trigger_metadata?.commit_hash,outcome:b.build_outcome,id:b.build_uuid
          }))));
          if(sel.some(b=>b.build_outcome==='fail')){
            const log=await get('/builds/builds/'+sel[0].build_uuid+'/logs');
            const lines=(log?.lines??[]).map(x=>String(x.at(-1)??''));
            const match=lines.map((x,i)=>({x,i})).filter(x=>/error TS\d+|^Failed:|\bnot ok\b|^Error:/.test(x.x)).slice(-8);
            console.log('V19_HOME_ERRORS '+JSON.stringify(match.map(x=>({line:x.i,text:x.x.replaceAll(token,'[REDACTED]').slice(0,250)}))));
          }
          NODE
