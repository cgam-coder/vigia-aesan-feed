name: VIGIA RASFF production scheduler

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rasff-control.yml"
      - "scripts/rasff-control.mjs"
  schedule:
    - cron: "9,39 * * * *"
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: RASFF lane
        required: true
        type: choice
        options: [recent, reconcile]

permissions:
  contents: read

jobs:
  recent:
    if: github.event_name == 'schedule' && github.event.schedule == '9,39 * * * *' || github.event_name == 'workflow_dispatch' && inputs.lane == 'recent'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: vigia-rasff-recent
      cancel-in-progress: false
    env:
      VIGIA_BASE_URL: https://vigia-alertas.csar68.chatgpt.site
      VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize recent RASFF notifications with bounded lease recovery
        run: |
          set -euo pipefail
          test -n "$VIGIA_SYNC_TOKEN"
          node scripts/rasff-control.mjs recent

  reconcile:
    if: github.event_name == 'push' || github.event_name == 'schedule' && github.event.schedule == '17 * * * *' || github.event_name == 'workflow_dispatch' && inputs.lane == 'reconcile'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: vigia-rasff-reconcile
      cancel-in-progress: false
    env:
      VIGIA_BASE_URL: https://vigia-alertas.csar68.chatgpt.site
      VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Continue reconcile while yielding deterministically to recent
        run: |
          set -euo pipefail
          test -n "$VIGIA_SYNC_TOKEN"
          node scripts/rasff-control.mjs reconcile
