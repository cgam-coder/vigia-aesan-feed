name: VIGIA RASFF production scheduler

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rasff-control.yml"
  schedule:
    - cron: "9,39 * * * *"
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: RASFF lane
        required: true
        type: choice
        options:
          - recent
          - reconcile

permissions:
  contents: read

jobs:
  recent:
    if: github.event_name == 'schedule' && github.event.schedule == '9,39 * * * *' || github.event_name == 'workflow_dispatch' && inputs.lane == 'recent'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: vigia-rasff-recent
      cancel-in-progress: false
    env:
      VIGIA_BASE_URL: https://vigia-alertas.csar68.chatgpt.site
      VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
    steps:
      - name: Synchronize recent RASFF notifications
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VIGIA_SYNC_TOKEN"
          node <<'NODE'
          const base = process.env.VIGIA_BASE_URL;
          const headers = { Authorization:"Bearer " + process.env.VIGIA_SYNC_TOKEN, "Content-Type":"application/json" };
          const response = await fetch(base + "/api/rasff/sync?mode=recent", {
            method:"POST", headers, redirect:"follow", signal:AbortSignal.timeout(600_000),
          });
          const raw = await response.text();
          let body;
          try { body = JSON.parse(raw); } catch { throw new Error("RASFF recent returned non-JSON HTTP " + response.status); }
          if (response.status === 202 && body?.state?.status === "skipped") {
            console.log("RASFF_RECENT_SKIPPED " + JSON.stringify(body));
            process.exit(0);
          }
          if (response.status !== 200) throw new Error("RASFF recent failed HTTP " + response.status + ": " + raw.slice(0, 1000));
          const state = body?.state;
          const deferred = state?.deferredDetails || [];
          if (state?.source !== "RASFF" || state.mode !== "recent" || state.status !== "completed" ||
              state.leaseOwnerId !== null || state.leaseMode !== null || state.leaseExpiresAt !== null ||
              state.detailFailures !== deferred.length ||
              deferred.some((item) => !["transport", "upstream"].includes(item.classification) ||
                !["http-429", "http-5xx", "timeout", "aborted", "network"].includes(item.reason)))
            throw new Error("RASFF recent contract failed: " + JSON.stringify(state));
          console.log("RASFF_RECENT_COMPLETE " + JSON.stringify(state));
          NODE

  reconcile:
    if: github.event_name == 'push' || github.event_name == 'schedule' && github.event.schedule == '17 * * * *' || github.event_name == 'workflow_dispatch' && inputs.lane == 'reconcile'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: vigia-rasff-reconcile
      cancel-in-progress: false
    env:
      VIGIA_BASE_URL: https://vigia-alertas.csar68.chatgpt.site
      VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
    steps:
      - name: Continue rotating RASFF reconcile sweep
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VIGIA_SYNC_TOKEN"
          node <<'NODE'
          const base = process.env.VIGIA_BASE_URL;
          const headers = { Authorization:"Bearer " + process.env.VIGIA_SYNC_TOKEN, "Content-Type":"application/json" };
          const SEARCH_URL = "https://webgate.ec.europa.eu/rasff-window/backend/public/notification/search/consolidated/en/";
          const BATCH_SIZE = 20;
          const MAX_BATCHES = 2_000;
          const TIME_BUDGET_MS = 340 * 60_000;
          const deadline = Date.now() + TIME_BUDGET_MS;
          const recoverableGlobalFailure = (state) => Boolean(state?.status === "failed" &&
            state.leaseOwnerId === null && state.leaseMode === null && state.leaseExpiresAt === null && (
              state.lastError === "D1_ERROR: out of memory: SQLITE_NOMEM" ||
              /^D1_ERROR: internal error; reference = [a-z0-9]+$/u.test(state.lastError || "") ||
              state.lastError === "RASFF agotó el timeout para " + SEARCH_URL ||
              state.lastError === "RASFF abortó la petición para " + SEARCH_URL ||
              state.lastError === "RASFF sufrió un fallo de red para " + SEARCH_URL ||
              state.lastError === "RASFF reconciliation index changed during cursor recovery" ||
              state.lastError === "RASFF reconciliation index changed during batch discovery" ||
              /^RASFF devolvió HTTP (?:429|5\d\d) para https:\/\/webgate\.ec\.europa\.eu\/rasff-window\/backend\/public\/notification\/search\/consolidated\/en\/$/u.test(state.lastError || "")
            ));
          const call = async (path, method = "GET") => {
            const response = await fetch(base + path, { method, headers, redirect:"follow", signal:AbortSignal.timeout(600_000) });
            const raw = await response.text();
            let body;
            try { body = JSON.parse(raw); } catch { throw new Error(method + " " + path + " returned non-JSON HTTP " + response.status); }
            if (response.status !== 200) throw new Error(method + " " + path + " failed HTTP " + response.status + ": " + raw.slice(0, 1000));
            return body;
          };
          let globalRecoveries = 0;
          const batch = async () => {
            for (let attempt = 1; attempt <= 5; attempt++) {
              const path = "/api/rasff/sync?mode=reconcile&batchSize=" + BATCH_SIZE;
              const response = await fetch(base + path, { method:"POST", headers, redirect:"follow", signal:AbortSignal.timeout(600_000) });
              const raw = await response.text();
              let body;
              try { body = JSON.parse(raw); } catch { throw new Error("RASFF reconcile returned non-JSON HTTP " + response.status); }
              if (response.status === 202 && body?.state?.status === "skipped") return body;
              if (response.status === 200) return body;
              if (response.status !== 503 || !recoverableGlobalFailure(body?.state))
                throw new Error("RASFF reconcile failed HTTP " + response.status + ": " + raw.slice(0, 1000));
              globalRecoveries++;
              console.log("RASFF_RECONCILE_RECOVERABLE_GLOBAL " + JSON.stringify(body.state));
              if (attempt === 5) throw new Error("RASFF reconcile exceeded five recoverable global retries");
              await new Promise((resolve) => setTimeout(resolve, attempt * 5_000));
            }
          };
          const observe = await call("/api/rasff/sync?observe=1");
          if (observe.lease !== null) {
            console.log("RASFF_RECONCILE_SKIPPED_ACTIVE_LEASE " + JSON.stringify(observe.lease));
            process.exit(0);
          }
          if (observe.backfill?.coverage !== "official-index-complete") throw new Error("RASFF historical coverage is not complete");
          if (observe.reconcile?.status === "failed" && !recoverableGlobalFailure(observe.reconcile))
            throw new Error("RASFF reconcile is semantically failed: " + observe.reconcile.lastError);
          let prior = observe.reconcile?.status === "completed" || !observe.reconcile
            ? { status:"idle", cursor:0, recordsObserved:0, recordsPersisted:0, newCount:0, updatedCount:0,
                detailFailures:0, pageErrors:0 }
            : observe.reconcile;
          let executed = 0;
          let budgetExhausted = false;
          for (let index = 1; index <= MAX_BATCHES; index++) {
            if (Date.now() >= deadline) {
              budgetExhausted = true;
              break;
            }
            const recoveriesBefore = globalRecoveries;
            const body = await batch();
            if (body?.state?.status === "skipped") break;
            const state = body?.state;
            const deferred = state?.deferredDetails || [];
            if (state?.source !== "RASFF" || state.mode !== "reconcile" ||
                !["partial", "completed"].includes(state.status) ||
                state.pageErrors - prior.pageErrors !== globalRecoveries - recoveriesBefore ||
                state.detailFailures - prior.detailFailures !== deferred.length ||
                deferred.some((item) => !["transport", "upstream"].includes(item.classification) ||
                  !["http-429", "http-5xx", "timeout", "aborted", "network"].includes(item.reason)) ||
                state.recordsObserved <= prior.recordsObserved || state.recordsPersisted < prior.recordsPersisted ||
                state.newCount < prior.newCount || state.updatedCount < prior.updatedCount ||
                state.leaseOwnerId !== null || state.leaseMode !== null || state.leaseExpiresAt !== null)
              throw new Error("RASFF reconcile batch contract failed: " + JSON.stringify(state));
            if (state.status === "partial" && (state.cursor <= prior.cursor || !state.cursorKey))
              throw new Error("RASFF reconcile cursor did not advance");
            if (state.status === "completed" && (state.cursor !== 0 || state.cursorKey !== null ||
                state.coverage !== "official-index-complete")) throw new Error("RASFF reconcile terminal state invalid");
            executed++;
            console.log("RASFF_RECONCILE_BATCH " + JSON.stringify({ index, state, deferred }));
            prior = state;
            if (index % 50 === 0 || state.status === "completed") {
              const audit = (await call("/api/rasff/sync?audit=1")).audit;
              if (Object.values(audit.integrity).some((value) => value !== 0) ||
                  audit.counts.rasffAlerts !== audit.counts.rasffUniqueReferences ||
                  audit.counts.rasffAlerts !== audit.counts.rasffSourceIdentities ||
                  audit.counts.rasffVersions !== audit.counts.rasffVersionCountSum)
                throw new Error("RASFF scheduled reconcile audit failed: " + JSON.stringify(audit));
              console.log("RASFF_RECONCILE_AUDIT " + JSON.stringify(audit));
            }
            if (state.status === "completed") break;
          }
          const finalObserve = await call("/api/rasff/sync?observe=1");
          if (finalObserve.lease !== null) throw new Error("RASFF scheduler left an active lease");
          if (finalObserve.reconcile?.status === "failed")
            throw new Error("RASFF scheduler ended in failed state: " + JSON.stringify(finalObserve.reconcile));
          console.log("RASFF_RECONCILE_STAGE_COMPLETE " + JSON.stringify({ executed, globalRecoveries, budgetExhausted,
            state:finalObserve.reconcile }));
          NODE
