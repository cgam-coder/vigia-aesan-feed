name: VIGIA RASFF production scheduler

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rasff-control.yml"
      - "scripts/rasff-control.mjs"
  schedule:
    - cron: "9,39 * * * *"
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: RASFF lane
        required: true
        type: choice
        options: [recent, reconcile]

permissions:
  contents: read

jobs:
  writer_gate:
    uses: ./.github/workflows/runtime-writer-gate.yml

  runtime_target:
    uses: ./.github/workflows/runtime-writer-target.yml

  recent:
    needs: [writer_gate, runtime_target]
    if: needs.writer_gate.outputs.allowed == 'true' && (github.event_name == 'schedule' && github.event.schedule == '9,39 * * * *' || github.event_name == 'workflow_dispatch' && inputs.lane == 'recent')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: vigia-rasff-recent
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Synchronize recent RASFF notifications with bounded lease recovery
        env:
          VIGIA_BASE_URL: ${{ needs.runtime_target.outputs.base_url }}
          VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VIGIA_SYNC_TOKEN"
          node scripts/rasff-control.mjs recent

  reconcile:
    needs: [writer_gate, runtime_target]
    if: needs.writer_gate.outputs.allowed == 'true' && (github.event_name == 'push' || github.event_name == 'schedule' && github.event.schedule == '17 * * * *' || github.event_name == 'workflow_dispatch' && inputs.lane == 'reconcile')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: vigia-rasff-reconcile
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Continue reconcile while yielding deterministically to recent
        env:
          VIGIA_BASE_URL: ${{ needs.runtime_target.outputs.base_url }}
          VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VIGIA_SYNC_TOKEN"
          node scripts/rasff-control.mjs reconcile
