name: SR271 AESAN official publication and taxonomy GET SELECT only
on:
  push:
    branches: [source-reliability/recovery-snapshot-20261009]
    paths: [.github/workflows/sr271-aesan-official-read.yml]
permissions:
  contents: read
concurrency:
  group: sr271-aesan-official-read-20261009
  cancel-in-progress: false
jobs:
  official_read:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Official AESAN GET and primary atomic D1 SELECT only
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node ops/sr271-aesan-official-read.mjs
