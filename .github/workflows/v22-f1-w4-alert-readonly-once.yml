name: V22 F1-W4 Cloudflare alert inventory (read only)
on:
  push:
    branches: [audit/v22-f1-w4-alerts-readonly-20261011]
    paths: [.github/workflows/v22-f1-w4-alert-readonly-once.yml]
permissions: { contents: read }
concurrency:
  group: v22-f1-w4-alert-inventory
  cancel-in-progress: false
jobs:
  observe:
    if: github.repository == 'cgam-coder/vigia-aesan-feed' && github.actor == 'cgam-coder' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Inspect alert types policies and destinations by GET only
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_BILLING_READ_TOKEN: ${{ secrets.CF_BILLING_AUDIT_READ_ONLY }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const account='9c1807c68493f14259248b5f5782cc6f';
          const url='https://api.cloudflare.com/client/v4/accounts/'+account+'/alerting/v3/';
          const print=(kind,obj)=>console.log('V22_ALERT_INVENTORY '+JSON.stringify({kind,...obj}));
          const sources=[['primary',process.env.CF_TOKEN],['billing_readonly',process.env.CF_BILLING_READ_TOKEN]];
          let any=false;
          for(const [tokenKind,token] of sources){
            if(!token){print('credential',{tokenKind,available:false});continue;}
            for(const [endpoint,path] of [['available_alerts','available_alerts'],['policies','policies'],['destinations','destinations/eligible']]){
              try{
                const r=await fetch(url+path,{method:'GET',redirect:'error',headers:{Authorization:'Bearer '+token,Accept:'application/json'},signal:AbortSignal.timeout(12000)});
                const j=await r.json().catch(()=>null);
                const result=j?.result;
                if(endpoint==='available_alerts'){
                  const items=result&&typeof result==='object'&&!Array.isArray(result)?Object.entries(result).flatMap(([category,list])=>Array.isArray(list)?list.map(x=>({type:x?.type,category})):[]):[];
                  const relevant=items.filter(x=>/worker|cron|schedule|usage|billing|custom|error|health|script|quota|exception/i.test(x.type+' '+x.category));
                  print(endpoint,{tokenKind,http:r.status,success:j?.success===true,total:items.length,relevant:relevant.slice(0,45)});
                  any ||= r.status===200&&j?.success===true;
                } else if(endpoint==='policies'){
                  const policies=Array.isArray(result)?result:[];
                  print(endpoint,{tokenKind,http:r.status,success:j?.success===true,count:policies.length,items:policies.map(p=>({
                    type:String(p.alert_type||'').slice(0,90),enabled:p.enabled===true,nameClass:/worker|cron|schedule|health|budget|billing|uptime|fail/i.test(String(p.name||''))?'relevant':'other',
                    emailCount:Array.isArray(p.mechanisms?.email)?p.mechanisms.email.length:0,
                    webhookCount:Array.isArray(p.mechanisms?.webhooks)?p.mechanisms.webhooks.length:0
                  })).slice(0,30)});
                } else {
                  const item=Array.isArray(result)?result:result&&typeof result==='object'?Object.values(result).flat().filter(x=>x&&typeof x==='object'):[];
                  print(endpoint,{tokenKind,http:r.status,success:j?.success===true,
                    types:item.slice(0,20).map(x=>({type:String(x.type||'unknown').slice(0,45),eligible:x.eligible===true,ready:x.ready===true}))});
                }
              } catch(e){print(endpoint,{tokenKind,http:0,error:'transport-or-timeout'});}
            }
          }
          print('decision',{reachable:any,zeroWrite:true,modifiedPolicies:false,changedDestinations:false,scope:'inventory only'});
          if(!any)process.exitCode=1;
          NODE
