name: RAPNA-MEDIA-F1 one-shot existing-log inspection
on:
  push:
    branches: [sec-f1/cloudflare-api-readonly-20261009]
    paths: [.github/workflows/rapna-media-readonly-logs.yml]
permissions:
  contents: read
concurrency:
  group: rapna-media-f1-once-20261010
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Query existing Cloudflare Workers logs without raw output
        env:
          CF_LOG_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const account='9c1807c68493f14259248b5f5782cc6f';
          const token=process.env.CF_LOG_READ_TOKEN;
          const out=(payload)=>console.log('RAPNA_MEDIA_READ '+JSON.stringify(payload));
          if(!token){out({step:'auth',outcome:'token_unavailable'});process.exitCode=1;process.exit();}
          const now=Date.now();
          const body={
            queryId:'rapna-media-f1-once-20261010',
            timeframe:{from:now-5*60*60*1000,to:now},
            view:'events',limit:12,dry:true,
            parameters:{datasets:[],needle:{value:'RAPNA public resource proxy failed',isRegex:false,matchCase:false}}
          };
          try{
            const response=await fetch('https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/observability/telemetry/query',{
              method:'POST',
              headers:{Authorization:'Bearer '+token,Accept:'application/json','Content-Type':'application/json'},
              redirect:'error',body:JSON.stringify(body),signal:AbortSignal.timeout(25000)
            });
            const data=await response.json().catch(()=>null);
            const status={step:'existing-log-query',http:response.status,success:data?.success===true,
              error_codes:Array.isArray(data?.errors)?data.errors.map(e=>e.code).filter(Number.isInteger):[]};
            if(!response.ok||data?.success!==true){out(status);process.exit(); }
            const root=data.result??{},records=Array.isArray(root.events)?root.events:
              Array.isArray(root.logs)?root.logs:Array.isArray(root.data)?root.data:[];
            const failures={network:0,timeout:0,http:0,'invalid-response':0,'too-large':0,'type-mismatch':0,unknown:0};
            const remoteCodes={};
            for(const entry of records){
              const text=JSON.stringify(entry);
              const match=text.match(/["\\]kind["\\]\s*:\s*["\\](network|timeout|http|invalid-response|too-large|type-mismatch)["\\]/);
              const kind=match?.[1]??'unknown';
              failures[kind]++;
              const http=text.match(/["\\]status["\\]\s*:\s*(\d{3})/);
              if(http)remoteCodes[http[1]]=(remoteCodes[http[1]]??0)+1;
            }
            out({...status,records:records.length,body_sections:Object.keys(root).filter(k=>/events|logs|results|statistics|run|data|rows/i.test(k)).slice(0,12),
              failures,remote_http_codes:remoteCodes,raw_logs_discarded:true});
          }catch(error){out({step:'existing-log-query',outcome:'network_or_parse_error',error_type:error?.name??'Error'});}
          NODE
