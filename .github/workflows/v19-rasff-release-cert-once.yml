name: V19 RASFF read-only final production release gate
on:
  push:
    branches: [sec-f1/cloudflare-api-readonly-20261009]
    paths: [.github/workflows/v19-rasff-release-cert-once.yml]
permissions:
  contents: read
concurrency:
  group: v19-rasff-final-release-gate
  cancel-in-progress: false
jobs:
  inspect:
    if: github.event.deleted == false && github.actor == 'cgam-coder'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Inspect exact main build and effective Worker versions GET only
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CF_TOKEN;
          if(!token)throw Error('TOKEN_UNAVAILABLE');
          const root="https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f";
          const get=async(p)=>{
            if(!p.startsWith('/'))throw Error('PATH_REJECTED');
            const r=await fetch(root+p,{method:'GET',redirect:'error',headers:{
              Authorization:'Bearer '+token,Accept:'application/json'
            },signal:AbortSignal.timeout(15000)});
            const j=await r.json().catch(()=>null);
            if(r.status!==200||j?.success!==true){console.log('V19_GET_HOLD '+JSON.stringify({path:p,http:r.status,errors:j?.errors?.map(x=>x.code)}));return null;}
            return j.result;
          };
          const scriptList=await get('/workers/scripts');
          const scripts=Array.isArray(scriptList)?scriptList:[];
          const tag=scripts.find(s=>s.id==='vigia-runtime')?.tag;
          if(!tag)throw Error('WORKER_TAG_UNAVAILABLE');
          const b=await get('/builds/workers/'+encodeURIComponent(tag)+'/builds');
          const builds=Array.isArray(b)?b:Array.isArray(b?.builds)?b.builds:[];
          const recent=builds.slice(0,4).map(x=>({
            commit:x.build_trigger_metadata?.commit_hash??null,
            branch:x.build_trigger_metadata?.branch??null,
            outcome:x.build_outcome??null,id:x.build_uuid??null
          }));
          console.log('V19_BUILDS '+JSON.stringify(recent));
          const active=await get('/workers/scripts/vigia-runtime/deployments');
          const versions=(active?.deployments??[]).slice(0,2).map(d=>({
            id:d.id,created:d.created_on,versions:d.versions?.map(v=>({id:v.version_id,pct:v.percentage}))??[]
          }));
          console.log('V19_DEPLOY '+JSON.stringify(versions));
          const failed=builds.find(x=>x.build_trigger_metadata?.commit_hash==='cf7376fa280eb29608a1da81a385618295393047'&&x.build_outcome==='fail');
          if(failed){
            const log=await get('/builds/builds/'+failed.build_uuid+'/logs');
            const msgs=(log?.lines??[]).map(row=>String(row.at(-1)??''));
            const err=msgs.map((v,i)=>({v,i})).filter(x=>/error TS\d+|^Failed:|\bnot ok\b|^Error:/i.test(x.v)).slice(-8);
            const clean=s=>s.replaceAll(token,'[REDACTED]').replace(/https?:\/\/\S+/g,'[URL]').slice(0,240);
            console.log('V19_ERROR '+JSON.stringify(err.map(x=>({line:x.i,text:clean(x.v)}))));
          }
          NODE
