# One-shot diagnostic. NO POST/PUT/PATCH/DELETE, no feed/main merge.
# Expires 2026-10-09 UTC. Do not use this workflow for recurrent jobs.
name: SR read-only production snapshot (2026-10-08)
on:
  push:
    branches: [diagnostics/source-reliability-readonly-20261008]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.event.head_commit.message == 'SR one-shot GET-only snapshot 20261008' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Read policy, five certified states, Safety Gate controller state and Cloudflare configuration
        env:
          VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const expires=Date.parse("2026-10-09T00:00:00Z");
          const api="https://vigia-runtime.c-gamiz93.workers.dev";
          const cf="https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f";
          const sourceMap={AESAN:"aesan",RAPNA:"rapna",RASFF:"rasff","SAFETY GATE":"safety-gate",OECD:"oecd"};
          const allowedCF=/^\/workers\/scripts\/vigia-runtime\/(?:deployments|settings|schedules)$/;
          const allowedApi=/^\/api\/(?:freshness\?observe=1(?:&policy=1)?|(?:aesan|rapna|rasff|safety-gate|oecd)\/sync\?observe=1)$/;
          const syncToken=process.env.VIGIA_SYNC_TOKEN,cfToken=process.env.CLOUDFLARE_API_TOKEN;
          if(!syncToken||!cfToken)throw Error("read-only-credentials-unavailable");
          async function get(base,path,token,allow){
            if(Date.now()>expires)throw Error("expired-observer");
            if(!allow.test(path))throw Error("GET-path-not-approved");
            const res=await fetch(base+path,{method:"GET",redirect:"error",headers:{Authorization:"Bearer "+token,Accept:"application/json"},
              signal:AbortSignal.timeout(28000)});
            const raw=await res.text();
            if(res.status!==200) return {ok:false,http:res.status};
            try{return {ok:true,http:res.status,json:JSON.parse(raw)}}catch{return {ok:false,http:res.status,error:"invalid-json"}}
          }
          const safeSource=(x)=>({
            source:x?.source,checkedAt:x?.checkedAt,status:x?.status,
            lastSyncSuccessAt:x?.lastSyncSuccessAt,revisionLastSuccessAt:x?.revisionLastSuccessAt,
            revisionStatus:x?.revisionStatus,latestIdentityParity:x?.latestIdentityParity,
            missingOfficialIdentitiesCount:Array.isArray(x?.missingOfficialIdentities)?x.missingOfficialIdentities.length:null,
            revisionMismatchesCount:Array.isArray(x?.revisionMismatches)?x.revisionMismatches.length:null,
            errorKind:x?.error===null?null:(typeof x?.error==="string"?x.error.slice(0,100):x?.error===undefined?"absent":"present-structured"),
            activeLease:x?.activeLease
          });
          const policy=await get(api,"/api/freshness?observe=1&policy=1",syncToken,allowedApi);
          const snapshot=await get(api,"/api/freshness?observe=1",syncToken,allowedApi);
          const states=Array.isArray(snapshot.json?.states)?snapshot.json.states.map(safeSource):[];
          console.log("SR_POLICY "+JSON.stringify({http:policy.http,policyVersion:policy.json?.policyVersion,
            policies:policy.json?.policies?.map(p=>({source:p.source,freshMaxAgeMinutes:p.recent?.freshMaxAgeMinutes,
              staleMaxAgeMinutes:p.recent?.staleMaxAgeMinutes,revisionRequired:p.revision?.required,
              revisionMaxAgeMinutes:p.revision?.maxAgeMinutes,revisionScope:p.revision?.scope}))??[]}));
          console.log("SR_STATES "+JSON.stringify({at:new Date().toISOString(),http:snapshot.http,allFresh:snapshot.json?.allFresh,
            policyVersion:snapshot.json?.policyVersion,states}));
          const observations=[];
          for(const [source,segment] of Object.entries(sourceMap)){
            const x=await get(api,"/api/"+segment+"/sync?observe=1",syncToken,allowedApi);
            const s=x.json;
            observations.push({source,http:x.http,leasePresent:s?.lease!==null&&s?.lease!==undefined,
              recentStatus:s?.recent?.status,recentLastSuccessAt:s?.recent?.lastSuccessAt,
              historicalStatus:s?.historicalReconcile?.status,
              historicalCursor:s?.historicalReconcile?.cursor,
              historicalTotalUnits:s?.historicalReconcile?.totalUnits,
              historicalRecordsObserved:s?.historicalReconcile?.recordsObserved,
              historicalLastSuccessAt:s?.historicalReconcile?.completedAt,
              historicalPlanVersion:s?.historicalReconcile?.planVersion,
              historicalCertificateStatus:s?.revisionCertification?.status,
              historicalCertificateCheckedAt:s?.revisionCertification?.checkedAt
            });
          }
          console.log("SR_OBSERVATIONS "+JSON.stringify({at:new Date().toISOString(),observations}));
          const [deploy,settings,schedules]=await Promise.all([
            get(cf,"/workers/scripts/vigia-runtime/deployments",cfToken,allowedCF),
            get(cf,"/workers/scripts/vigia-runtime/settings",cfToken,allowedCF),
            get(cf,"/workers/scripts/vigia-runtime/schedules",cfToken,allowedCF)]);
          const all=[deploy,settings,schedules].every(r=>r.json?.success===true);
          if(!all){console.log("SR_CF "+JSON.stringify({at:new Date().toISOString(),readable:false,
            statusCodes:[deploy.http,settings.http,schedules.http]}));process.exitCode=1;process.exit();}
          const ds=deploy.json.result?.deployments??deploy.json.result;
          const active=ds?.[0],prev=ds?.[1];
          const bindings=settings.json.result?.bindings??[];
          const readVar=name=>{const b=bindings.find(x=>x.name===name);return b?.text??b?.value??null;};
          const crons=schedules.json.result?.schedules??schedules.json.result;
          console.log("SR_CF "+JSON.stringify({at:new Date().toISOString(),readable:true,
            activeDeploymentId:active?.id,activeVersionId:active?.versions?.[0]?.version_id,
            allocations:active?.versions?.map(v=>v.percentage),previousDeploymentId:prev?.id,
            cronExpressions:Array.isArray(crons)?crons.map(c=>c.cron):null,
            recentSchedulerMode:readVar("NAGAMEALERT_RECENT_SCHEDULER_MODE"),
            safetyGateRecentModePresent:readVar("NAGAMEALERT_SAFETY_GATE_RECENT_MODE")!==null}));
          if(policy.http!==200||snapshot.http!==200||states.length!==5||observations.some(x=>x.http!==200))process.exitCode=1;
          NODE
