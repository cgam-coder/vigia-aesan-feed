name: SEC-F1 temporary billing metadata read-only
on:
  push:
    branches: [sec-f1/cloudflare-api-readonly-20261009]
    paths: [.github/workflows/sec-f1-budget-readonly.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Cloudflare billing metadata via GET only
        env:
          CF_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const auth=process.env.CF_READ_TOKEN;
          const account='9c1807c68493f14259248b5f5782cc6f';
          const base='https://api.cloudflare.com/client/v4/accounts/'+account;
          const log=(name,data)=>console.log('SEC_F1_BILLING '+JSON.stringify({check:name,...data}));
          if(!auth){log('token',{available:false});process.exitCode=1;process.exit();}
          async function query(name,path){
            try{
              const r=await fetch(base+path,{method:'GET',redirect:'error',headers:{Authorization:'Bearer '+auth,Accept:'application/json'},signal:AbortSignal.timeout(15000)});
              const d=await r.json().catch(()=>null);
              const status={http:r.status,success:d?.success===true,error_codes:Array.isArray(d?.errors)?d.errors.map(x=>x.code).filter(Number.isInteger):[]};
              if(!status.success){log(name,status);return;}
              const result=d.result;
              if(name==='subscriptions'){
                const a=Array.isArray(result)?result:[];
                log(name,{...status,count:a.length,items:a.map(x=>({frequency:x.frequency??null,state:x.state??null,price:Number.isFinite(x.price)?x.price:null,currency:x.currency??x.rate_plan?.currency??null,plan_scope:x.rate_plan?.scope??null,plan_name:x.rate_plan?.public_name??null,plan_id:x.rate_plan?.id??null})).slice(0,15)});
              } else if(name==='billable_usage_info'){
                log(name,{...status,covered:result?.covered??null,subscriptions:Array.isArray(result?.subscriptions)?result.subscriptions.length:null});
              } else if(name==='billable_usage_v1'){
                const a=Array.isArray(result)?result:[];
                const fields= [...new Set(a.flatMap(x=>Object.keys(x)))].filter(x=>/Product|Service|Category|Cost|Currency|Usage|Quantity|Period/i.test(x)).slice(0,25);
                const num=(x)=>typeof x==='number'&&Number.isFinite(x)?x:0;
                const sums={billedCost:a.reduce((s,x)=>s+num(x.BilledCost),0),contractedCost:a.reduce((s,x)=>s+num(x.ContractedCost),0)};
                const products=[...new Set(a.map(x=>x.ServiceName??x.ProductName??x.Service??x.Product??null).filter(Boolean))].slice(0,30);
                log(name,{...status,rows:a.length,available_fields:fields,aggregates:sums,product_names:products});
              } else if(name==='billable_usage_v2'){
                const a=Array.isArray(result)?result:[];
                log(name,{...status,rows:a.length,metrics:[...new Set(a.map(x=>x.ChargeCategory).filter(Boolean))].slice(0,25),cost_fields_present:a.some(x=>Object.keys(x).some(k=>/cost|price/i.test(k)))});
              } else if(name==='billing_notifications'){
                const a=Array.isArray(result)?result:[];
                log(name,{...status,policy_count:a.length,event_types:[...new Set(a.map(x=>x.alert_type).filter(Boolean))].slice(0,15)});
              } else log(name,status);
            }catch(e){log(name,{outcome:'request_failed',error_type:e?.name??'Error'});}
          }
          await query('subscriptions','/subscriptions');
          await query('billable_usage_info','/billable-usage/info');
          await query('billable_usage_v1','/billable-usage');
          await query('billable_usage_v2','/billable/usage');
          await query('billing_notifications','/alerting/v3/policies');
          NODE
