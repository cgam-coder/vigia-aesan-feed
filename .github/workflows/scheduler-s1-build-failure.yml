name: Scheduler S1 build failure evidence
on:
  push:
    branches: [work/scheduler-reliability-s0-evidence]
    paths:
      - ".github/workflows/scheduler-s1-build-failure.yml"
      - "diagnostics/scheduler-s1-build-failure.mjs"
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read failed Workers Build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node diagnostics/scheduler-s1-build-failure.mjs
