name: Cloudflare public routing audit

on:
  push:
    branches:
      - work/cloudflare-chat-operability-proof
    paths:
      - "ops/cloudflare-public-routing-audit.request.json"

permissions:
  contents: read

concurrency:
  group: cloudflare-public-routing-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_WORKER: vigia-runtime
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read-only routing and DNS audit
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          request="ops/cloudflare-public-routing-audit.request.json"
          nonce="$(node -e 'const fs=require("fs");const b=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(b?.operation!=="audit"||typeof b?.nonce!=="string"||!/^[A-Za-z0-9._:-]{8,120}$/.test(b.nonce)||Object.keys(b).some(k=>!["operation","nonce"].includes(k)))process.exit(2);process.stdout.write(b.nonce)' "$request")"
          echo "PUBLIC_ROUTING_AUDIT nonce=$nonce"

          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")

          cf_get(){
            local path="$1"
            curl --silent --show-error --fail-with-body --max-time 60 "${auth[@]}" "https://api.cloudflare.com/client/v4$path"
          }

          token="$(cf_get /user/tokens/verify)"
          TOKEN_JSON="$token" node - <<'NODE'
          const b=JSON.parse(process.env.TOKEN_JSON||"{}");
          if(b?.success!==true||b?.result?.status!=="active") throw new Error("Cloudflare token verification failed");
          console.log("CF_TOKEN status=active");
NODE

          for zone in nagamealert.com nagamealert.es; do
            out="$(cf_get "/zones?name=$zone&status=active&per_page=50")"
            ZONE_JSON="$out" ZONE="$zone" node - <<'NODE'
            const b=JSON.parse(process.env.ZONE_JSON||"{}");
            if(b?.success!==true) throw new Error("zone lookup failed");
            const rows=Array.isArray(b.result)?b.result:[];
            console.log("CF_ZONE "+JSON.stringify({
              name:process.env.ZONE,
              found:rows.length===1,
              status:rows[0]?.status??null,
              nameServers:Array.isArray(rows[0]?.name_servers)?rows[0].name_servers:[],
              plan:rows[0]?.plan?.name??null
            }));
            if(rows.length===1) process.stdout.write("ZONE_ID="+rows[0].id+"\n");
NODE
            zone_id="$(ZONE_JSON="$out" node -e 'const b=JSON.parse(process.env.ZONE_JSON||"{}");const r=Array.isArray(b.result)?b.result:[];process.stdout.write(r.length===1?String(r[0].id):"")')"
            if [ -n "$zone_id" ]; then
              records="$(cf_get "/zones/$zone_id/dns_records?per_page=100")"
              RECORDS_JSON="$records" ZONE="$zone" node - <<'NODE'
              const b=JSON.parse(process.env.RECORDS_JSON||"{}");
              if(b?.success!==true) throw new Error("DNS read failed");
              const wanted=new Set([process.env.ZONE,"www."+process.env.ZONE]);
              const rows=(Array.isArray(b.result)?b.result:[]).filter(r=>wanted.has(r.name));
              console.log("CF_DNS "+JSON.stringify({
                zone:process.env.ZONE,
                records:rows.map(r=>({
                  name:r.name,type:r.type,content:r.content,
                  proxied:r.proxied??null,ttl:r.ttl??null
                }))
              }));
NODE
              routes="$(cf_get "/zones/$zone_id/workers/routes")"
              ROUTES_JSON="$routes" ZONE="$zone" node - <<'NODE'
              const b=JSON.parse(process.env.ROUTES_JSON||"{}");
              if(b?.success!==true) throw new Error("Workers route read failed");
              const rows=Array.isArray(b.result)?b.result:[];
              console.log("CF_WORKER_ROUTES "+JSON.stringify({
                zone:process.env.ZONE,
                routes:rows.map(r=>({pattern:r.pattern,script:r.script??null}))
              }));
NODE
            fi
          done

          domains="$(cf_get "/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")"
          DOMAINS_JSON="$domains" node - <<'NODE'
          const b=JSON.parse(process.env.DOMAINS_JSON||"{}");
          if(b?.success!==true) throw new Error("Worker custom-domain read failed");
          const rows=Array.isArray(b.result)?b.result:[];
          console.log("CF_WORKER_DOMAINS "+JSON.stringify({
            domains:rows.map(r=>({
              hostname:r.hostname??null,
              service:r.service??null,
              environment:r.environment??null,
              zoneName:r.zone_name??null
            }))
          }));
NODE

          for host in nagamealert.com www.nagamealert.com nagamealert.es www.nagamealert.es; do
            echo "PUBLIC_DNS host=$host"
            for type in A AAAA CNAME NS; do
              values="$(dig +short "$host" "$type" | tr '\n' ',' | sed 's/,$//')"
              echo "DIG host=$host type=$type values=$values"
            done
          done

          probe(){
            local label="$1"; local url="$2"
            local headers="$RUNNER_TEMP/$label.headers"
            local body="$RUNNER_TEMP/$label.body"
            local code
            code="$(curl --silent --show-error --location --max-time 60 --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$url" || true)"
            echo "HTTP_PROBE label=$label status=$code final_url=$(awk 'BEGIN{IGNORECASE=1} /^location:/{gsub("\r",""); print $2}' "$headers" | tail -1) bytes=$(wc -c < "$body" 2>/dev/null || echo 0)"
          }
          probe apex https://nagamealert.com/
          probe www https://www.nagamealert.com/
          probe es https://nagamealert.es/
          probe es_www https://www.nagamealert.es/
          probe worker https://vigia-runtime.c-gamiz93.workers.dev/

          echo "PUBLIC_ROUTING_AUDIT status=PASS"
