name: RAPNA MEDIA revision health one-shot GET

on:
  push:
    branches: [sec-f1/cloudflare-api-readonly-20261009]
    paths: [.github/workflows/rapna-media-f1-revision-status-once.yml]

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Summarize existing revisions only, no writes
        env:
          READ_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.READ_TOKEN;
          const output=(x)=>console.log('RAPNA_REVISION_OBSERVE '+JSON.stringify(x));
          if(!token){output({auth:'missing'});process.exitCode=1;process.exit();}
          try{
            const r=await fetch('https://vigia-runtime.c-gamiz93.workers.dev/api/source-reliability?observe=1',{
              method:'GET',headers:{Authorization:'Bearer '+token,Accept:'application/json'},
              redirect:'error',signal:AbortSignal.timeout(16000)});
            const d=await r.json();
            const st=d.state??{},a=st.lastAudit??{},attempts=st.revisionAttempts??{};
            const rows=Object.entries(attempts).filter(([k])=>/^(?:RAPNA|RASFF):/.test(k)).map(([key,v])=>({
              key,kind:v?.kind??null,outcome:v?.outcome??null,startedAt:v?.startedAt??null,
              finishedAt:v?.finishedAt??null,reason_category:typeof v?.reason==='string'?
                (/recent.priority/i.test(v.reason)?'recent-priority':/time|budget/i.test(v.reason)?'time-or-budget':
                  /failed|error/i.test(v.reason)?'error':'other'):null,
              nextEligibleAt:v?.nextEligibleAt??null,failures:v?.failures??null,pendingDetails:v?.pendingDetails?.length??0
            }));
            output({http:r.status,mode:d.mode,outcome:d.outcome,certified:d.officialParityCertified===true,
              activeLease:d.activeLease,ageMinutes:d.ageMinutes,lastOutcome:st.lastOutcome,
              lastRevisionSelection:st.lastRevisionSelection,lastSelection:st.lastSelection,
              revisionRows:rows,unknownRecent:Object.entries(st.attempts??{}).filter(([k,v])=>v?.outcome==='unknown').map(([k])=>k),
              unknownRevision:Object.entries(attempts).filter(([k,v])=>v?.outcome==='unknown').map(([k])=>k),
              lastAuditTime:a.finishedAt??null,lastAuditAllFresh:a.allFresh??null});
          }catch(e){output({outcome:'transport_or_parse_error',type:e?.name??'Error'});}
          NODE
