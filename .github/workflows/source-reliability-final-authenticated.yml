name: Source reliability definitive authenticated snapshot
on:
  push:
    branches: [source-reliability/final-authenticated-20261008-1935]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Read allocations native ledger source states and receipts
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const root='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f',base='https://vigia-runtime.c-gamiz93.workers.dev';
          if(Date.now()>Date.parse('2026-10-08T20:40:00Z'))throw Error('snapshot expired');
          async function cf(path){const r=await fetch(root+path,{method:'GET',headers:{Authorization:'Bearer '+process.env.CF_TOKEN},signal:AbortSignal.timeout(30000)});const p=await r.json();if(!r.ok||!p.success)throw Error('CF GET failed '+r.status);return p.result;}
          for(const service of ['vigia-runtime','vigia-source-runner']){
           const dep=await cf('/workers/scripts/'+service+'/deployments'),settings=await cf('/workers/scripts/'+service+'/settings'),schedule=await cf('/workers/scripts/'+service+'/schedules');
           const active=dep.deployments[0],v=await cf('/workers/scripts/'+service+'/versions/'+active.versions[0].version_id);
           const flags=settings.bindings?.filter(b=>b.type==='plain_text'&&/MODE|BUILD_SHA/.test(b.name)).map(b=>({name:b.name,text:b.text}));
           console.log('FINAL_ALLOCATION '+JSON.stringify({at:new Date().toISOString(),service,deployments:dep.deployments.slice(0,3),versionNumber:v.number,flags,schedule,db:settings.bindings?.filter(b=>b.type==='d1').map(b=>({name:b.name,id:b.id}))}));
          }
          for(const path of ['/api/source-reliability?observe=1','/api/aesan/sync?observe=1','/api/rapna/sync?observe=1','/api/rasff/sync?observe=1','/api/safety-gate/sync?observe=1','/api/oecd/sync?observe=1']){
           const r=await fetch(base+path,{method:'GET',headers:{Authorization:'Bearer '+process.env.SYNC_TOKEN,'Cache-Control':'no-store'},signal:AbortSignal.timeout(30000)}),p=await r.json();
           if(p.state)delete p.state.ownershipFingerprint;
           console.log('FINAL_NATIVE '+JSON.stringify({at:new Date().toISOString(),path,http:r.status,body:p}));if(!r.ok)throw Error('native read failed '+r.status);
          }
          for(const sql of ["SELECT owner_id,expires_at,epoch,last_scheduled_time,state_json FROM source_reliability_control WHERE id=1","SELECT id,source,mode,kind,epoch,started_at,deadline,phase,write_intent_at,finished_at,receipt_json FROM source_reliability_jobs WHERE finished_at IS NULL OR started_at>='2026-10-08T13:40:00Z' ORDER BY started_at","SELECT * FROM source_sync_locks","SELECT * FROM source_sync_state","SELECT source,mode,cycle_id,completed_at,total_units,records_observed,coverage,audit_status,audit_checked_at,updated_at FROM source_revision_certifications","SELECT id,reference,content_hash,version_count,published_at,detected_at,updated_at FROM alerts WHERE source='SAFETY GATE' AND (detected_at>='2026-10-08T13:41:39Z' OR updated_at>='2026-10-08T13:41:39Z') ORDER BY id LIMIT 100","SELECT v.id,v.alert_id,v.content_hash,v.detected_at FROM alert_versions v JOIN alerts a ON a.id=v.alert_id WHERE a.source='SAFETY GATE' AND v.detected_at>='2026-10-08T13:41:39Z' ORDER BY v.detected_at LIMIT 100","SELECT id,source,checked_at,status,found_count,changed_count,error FROM source_checks WHERE source='SAFETY GATE' AND checked_at>='2026-10-08T13:41:39Z' ORDER BY id LIMIT 100","SELECT id,reference,content_hash,version_count,published_at,detected_at,updated_at,canonical_json FROM alerts WHERE source='AESAN' AND reference IN ('ES2026/604','ES2026/382')","SELECT source,COUNT(*) AS alerts,SUM(version_count) AS versions,MAX(updated_at) AS max_updated_at FROM alerts GROUP BY source"]){
           if(!/^SELECT\s/i.test(sql))throw Error('SELECT only');
           const r=await fetch(root+'/d1/database/55596003-1b90-4f66-aad8-decb21205f13/query',{method:'POST',headers:{Authorization:'Bearer '+process.env.CF_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({sql}),signal:AbortSignal.timeout(30000)}),p=await r.json();
           for(const row of p.result?.flatMap(x=>x.results)||[])if(row.state_json){const s=JSON.parse(row.state_json);delete s.ownershipFingerprint;row.state_json=JSON.stringify(s);}
           console.log('FINAL_SELECT '+JSON.stringify({at:new Date().toISOString(),sql,http:r.status,data:p}));if(!r.ok||!p.success||p.result?.some(x=>!x.success||x.meta?.changes||x.meta?.rows_written))throw Error('SELECT failed or not readonly');
          }
          for(const service of ['vigia-runtime','vigia-source-runner']){
           const q={queryId:'source-reliability-final-read',dry:true,view:'events',limit:100,timeframe:{from:Date.parse('2026-10-08T13:40:00Z'),to:Date.now()},parameters:{filters:[{key:'$metadata.service',operation:'eq',type:'string',value:service},{key:'$workers.outcome',operation:'eq',type:'string',value:'canceled'}],filterCombination:'and'}};
           const r=await fetch(root+'/workers/observability/telemetry/query',{method:'POST',headers:{Authorization:'Bearer '+process.env.CF_TOKEN,'Content-Type':'application/json'},body:JSON.stringify(q),signal:AbortSignal.timeout(30000)}),p=await r.json(),events=Array.isArray(p.result?.events)?p.result.events:p.result?.events?.events??[];
           console.log('FINAL_CANCELLED '+JSON.stringify({service,http:r.status,success:p.success,events:events.map(e=>({metadata:e.$metadata,worker:e.$workers}))}));if(!r.ok||!p.success)throw Error('telemetry read failed');
          }
          
          NODE
