name: RAPNA visual publication read-only preflight
on:
  push:
    branches: [sec-f1/cloudflare-api-readonly-20261009]
    paths: [.github/workflows/rapna-visual-preflight-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Read production isolation and ordinary publication budget
        env:
          CF_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SYNC_READ_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
          BILLING_READ_TOKEN: ${{ secrets.CF_BILLING_AUDIT_READ_ONLY }}
        run: |
          node --input-type=module <<'NODE'
          const base='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f';
          const cf=process.env.CF_READ_TOKEN,sync=process.env.SYNC_READ_TOKEN,bill=process.env.BILLING_READ_TOKEN||cf;
          const out=x=>console.log('MEDIA_PREFLIGHT '+JSON.stringify(x));
          const req=async(path,token=cf,body)=>{const r=await fetch(path.startsWith('https:')?path:base+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},redirect:'error',...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(18000)});return {http:r.status,...await r.json()};};
          if(!cf||!sync)throw Error('MISSING_EXISTING_AUTH');
          const n=await req('https://vigia-runtime.c-gamiz93.workers.dev/api/source-reliability?observe=1',sync);
          out({gate:'native',http:n.http,buildSha:n.buildSha,activeLease:n.activeLease,observedAt:n.observedAt,officialParityCertified:n.officialParityCertified,attempts:n.state?.attempts,revisions:n.state?.revisionAttempts,lastAudit:n.state?.lastAudit});
          if(n.http!==200||n.buildSha!=='11e21985160c0e29cb61b58ff1226d178618a1fb')throw Error('PRODUCTION_COMMIT_GATE');
          if(Object.values(n.state?.attempts??{}).some(x=>x.outcome==='unknown')||Object.values(n.state?.revisionAttempts??{}).some(x=>x.outcome==='unknown'))throw Error('UNKNOWN_GATE');
          for(const name of ['vigia-runtime','vigia-source-runner']){
           const d=await req('/workers/scripts/'+name+'/deployments');out({gate:'deployments',name,http:d.http,deployments:d.result?.deployments?.slice(0,3)});
           const versions=await req('/workers/scripts/'+name+'/versions');out({gate:'versions',name,http:versions.http,versions:versions.result?.items?.slice(0,3).map(v=>({id:v.id,number:v.number,metadata:v.metadata,annotations:v.annotations}))});
           const s=await req('/workers/scripts/'+name+'/schedules');out({gate:'schedules',name,http:s.http,result:s.result});
          }
          const settings=await req('/workers/scripts/vigia-runtime/settings');
          out({gate:'bindings',http:settings.http,d1:settings.result?.bindings?.filter(x=>x.type==='d1'),limits:settings.result?.limits});
          const db='55596003-1b90-4f66-aad8-decb21205f13';
          if(!settings.result?.bindings?.some(x=>x.type==='d1'&&x.name==='DB'&&x.id===db))throw Error('BINDING_MISMATCH');
          let rowsRead=0;
          const q=async(gate,sql,params=[])=>{if(!/^SELECT\b/.test(sql)||sql.includes(';'))throw Error('READ_ONLY_STOP');const r=await req('/d1/database/'+db+'/query',cf,{sql,params});if(r.http!==200||!r.success)throw Error('D1_READ_FAILED_'+gate);for(const a of r.result){rowsRead+=a.meta?.rows_read||0;if(a.meta?.rows_written!==0)throw Error('UNEXPECTED_WRITE');}out({gate,rows:r.result.flatMap(x=>x.results),rowsRead});};
          await q('coordinator',"SELECT owner_id,expires_at,epoch,json_extract(state_json,'$.revisionAttempts') AS revisions FROM source_reliability_control WHERE id=1");
          await q('leases',"SELECT * FROM source_sync_locks LIMIT 10");
          await q('unfinished_jobs',"SELECT id,source,mode,kind,phase,deadline,write_intent_at,finished_at FROM source_reliability_jobs WHERE finished_at IS NULL ORDER BY started_at DESC LIMIT 15");
          const ids=['15ff9a7c-4094-4836-996b-b36591cab779','bb90ee24-dffa-4b25-9a03-8e994a29df64','7d965614-eb79-468c-838a-249147a0fb58'];
          await q('historical_jobs',"SELECT id,source,mode,kind,phase,finished_at,json_extract(receipt_json,'$.outcome') AS outcome,json_extract(receipt_json,'$.reason') AS reason FROM source_reliability_jobs WHERE id IN (?,?,?)",ids);
          await q('pending_historical_effects',"SELECT job_id,COUNT(*) AS markers,SUM(committed_at IS NULL OR result_json IS NULL) AS pending FROM source_reliability_effects WHERE job_id IN (?,?,?) GROUP BY job_id",ids);
          await q('recovery_receipts',"SELECT old_job_id,recovery_id,manifest_hash,committed_at FROM source_reliability_recoveries WHERE old_job_id IN (?,?,?)",ids);
          out({gate:'read_cost',rowsRead,rowsWritten:0});
          const scripts=await req('/workers/scripts');
          if(scripts.http!==200||!Array.isArray(scripts.result))throw Error('SCRIPT_LIST_HOLD');
          const tags=[...new Set([...scripts.result.map(x=>x.tag).filter(Boolean),'970603d17e814ae191c510624f9200bf'])];
          let calls=0,count=0,minutes=0,active=0,unknownTimes=0;
          for(const tag of tags){
           for(let page=1;page<=8;page++){
            if(++calls>160)throw Error('BUILD_READ_CAP_HOLD');
            const r=await req('/builds/workers/'+tag+'/builds?per_page=100&page='+page);
            if(r.http!==200||!r.success)throw Error('BUILD_LIST_HOLD_'+r.http);
            const builds=Array.isArray(r.result)?r.result:r.result?.builds??[];
            for(const b of builds){if(b.created_on<'2026-09-25T00:00:00Z')continue;count++;if(!b.stopped_on){active++;minutes+=20;}else {const t=(Date.parse(b.stopped_on)-Date.parse(b.running_on??b.initializing_on??b.created_on))/60000;if(!Number.isFinite(t)||t<0){unknownTimes++;minutes+=20;}else minutes+=Math.ceil(t);}}
            if(page===1)out({gate:'build_page',tag,keys:Object.keys(r.result??{}),count:builds.length,result_info:r.result_info,sample:builds.slice(0,1).map(b=>({status:b.status,created_on:b.created_on,running_on:b.running_on,stopped_on:b.stopped_on}))});
            if(builds.length<100||page>=(r.result_info?.total_pages??999))break;
            if(page===8)throw Error('BUILD_PAGINATION_HOLD');
           }
          }
          out({gate:'build_budget',workerTags:tags.length,calls,buildCount:count,conservativeRoundedMinutes:minutes,active,unknownTimes,includedMinutes:6000,reservedProductionBuildMinutes:20,remainingAfterReserve:6000-minutes-20});
          if(active||unknownTimes||minutes+20>=6000)throw Error('BUILD_BUDGET_HOLD');
          const query='query { viewer { accounts(filter:{accountTag:"9c1807c68493f14259248b5f5782cc6f"}) { workersInvocationsAdaptive(limit:10,filter:{scriptName:"vigia-runtime",datetime_geq:"2026-10-10T08:38:00Z",datetime_leq:"2026-10-10T08:50:00Z"}) { sum { requests errors subrequests } quantiles { cpuTimeP50 cpuTimeP99 } dimensions { status } } } } }';
          const metrics=await req('https://api.cloudflare.com/client/v4/graphql',cf,{query});
          out({gate:'pre_metrics',http:metrics.http,data:metrics.data,errors:metrics.errors?.map(x=>x.message)});
          const pub=await fetch('https://nagamealert.com/api/terminal/alerts?source=RASFF&period=30d&pageSize=20',{signal:AbortSignal.timeout(15000)});
          const p=await pub.json();out({gate:'rasff_latest_public',http:pub.status,references:p.items?.slice(0,4).map(x=>x.reference),updated:p.lastUpdatedAt});
          for(const tag of ['c16d1153847b48f7ba2245915cfd97ab','970603d17e814ae191c510624f9200bf']){const t=await req('/builds/workers/'+tag+'/triggers');out({gate:'existing_build_triggers',tag,http:t.http,triggers:t.result?.map(x=>({uuid:x.trigger_uuid,branch_includes:x.branch_includes,branch_excludes:x.branch_excludes,build_command:x.build_command,deploy_command:x.deploy_command,deleted_on:x.deleted_on}))});}
          const b=await req('/builds/builds/4e105ba5-de31-4492-9730-6d8158e55041');
          out({gate:'production_build',http:b.http,result:{id:b.result?.build_uuid,status:b.result?.status,outcome:b.result?.build_outcome,created:b.result?.created_on,running:b.result?.running_on,stopped:b.result?.stopped_on,commit:b.result?.build_trigger_metadata?.commit_hash,branch:b.result?.build_trigger_metadata?.branch,command:b.result?.build_trigger_metadata?.build_command,deploy:b.result?.build_trigger_metadata?.deploy_command}});
          const logs=await req('/builds/builds/4e105ba5-de31-4492-9730-6d8158e55041/logs');
          const lines=Array.isArray(logs.result)?logs.result:logs.result?.lines??[];
          out({gate:'production_quality_logs',http:logs.http,keys:Object.keys(logs.result??{}).slice(0,8),proof:lines.map(x=>typeof x==='string'?x:x.line??x.message??x.text??JSON.stringify(x)).filter(x=>/Running Cloudflare CI|tests \d|pass \d|fail \d|duration_ms|artifact.*valid|Validation|typecheck|lint/i.test(x)).slice(-35)});
          NODE
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install existing pinned browser harness without secrets or checkout
        run: |
          npm install --prefix "$RUNNER_TEMP/rapna-playwright" playwright@1.56.1 --ignore-scripts --no-audit --no-fund --silent
          timeout 240 "$RUNNER_TEMP/rapna-playwright/node_modules/.bin/playwright" install --with-deps webkit
      - name: Verify production cards and details in both languages
        run: |
          node <<'NODE'
          const path=require('node:path'),crypto=require('node:crypto');
          const {chromium,webkit}=require(path.join(process.env.RUNNER_TEMP,'rapna-playwright/node_modules/playwright'));
          const origin='https://nagamealert.com';
          const output=x=>console.log('RAPNA_PRODUCTION_BROWSER '+JSON.stringify(x));
          (async()=>{
          const api=await fetch(origin+'/api/terminal/alerts?source=RAPNA&period=30d&pageSize=10',{signal:AbortSignal.timeout(15000)});
          const data=await api.json();if(api.status!==200||!data.items?.find(x=>x.reference==='159/2026'&&x.imageUrl))throw Error('REAL_PRODUCTION_RECORD_MISSING');
          output({gate:'real_records',http:api.status,refs:data.items.map(x=>({reference:x.reference,hasImage:!!x.imageUrl})),fixtures:0,interceptedResponses:0});
          let nagameRequests=1,passes=0;
          const profiles=[{name:'Chrome desktop',engine:chromium,mobile:false},{name:'Chrome mobile emulation',engine:chromium,mobile:true},{name:'WebKit Linux desktop',engine:webkit,mobile:false}];
          for(const profile of profiles){
           const browser=await profile.engine.launch(profile.engine===chromium?{headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']}:{headless:true});
           const context=await browser.newContext({viewport:profile.mobile?{width:390,height:844}:{width:1440,height:900},...(profile.mobile?{isMobile:true,hasTouch:true,deviceScaleFactor:2}:{}),serviceWorkers:'block',locale:'es-ES'});
           try {
           for(const locale of ['es','en']){
            const page=await context.newPage();const errors=[],csp=[],official=[],failures=[];
            await page.addInitScript(()=>{window.__mediaCsp=[];document.addEventListener('securitypolicyviolation',e=>window.__mediaCsp.push({directive:e.violatedDirective,blocked:e.blockedURI}));});
            page.on('request',r=>{if(r.url().startsWith(origin)){nagameRequests++;if(nagameRequests>500)throw Error('ORDINARY_SMOKE_REQUEST_CAP');}});
            page.on('pageerror',e=>errors.push(String(e.message).slice(0,180)));
            page.on('requestfailed',r=>{if(r.url().includes('rapna')||r.url().includes('consumo.gob.es'))failures.push({url:r.url().split('?')[0],reason:r.failure()?.errorText});});
            page.on('response',async r=>{if(r.url()==='https://servicios.consumo.gob.es/rapnaBEPublic/listadoPublico/fichero'){const h=await r.request().allHeaders();official.push({status:r.status(),cookie:!!h.cookie,referer:!!h.referer,origin:h.origin});}});
            const response=await page.goto(origin+'/'+locale+'/'+(locale==='es'?'alertas':'alerts')+'?source=RAPNA&period=30d',{waitUntil:'domcontentloaded',timeout:30000});
            if(response.status()!==200)throw Error('LIST_HTTP_'+response.status());
            const policy=response.headers()['content-security-policy']??'';if(!policy.includes('https://servicios.consumo.gob.es')||!policy.includes('blob:'))throw Error('PRODUCTION_CSP_MISSING');
            const cards=page.locator('article.na-alert-card[data-source="RAPNA"]');
            await cards.first().waitFor({state:'visible',timeout:22000});
            const photo=async(element)=>{
             await element.waitFor({state:'attached',timeout:10000});await element.scrollIntoViewIfNeeded();
             await element.evaluate(i=>new Promise((resolve,reject)=>{if(i.complete&&i.naturalWidth>0)return resolve(true);const t=setTimeout(()=>reject(Error('IMAGE_LOAD_TIMEOUT')),25000);i.addEventListener('load',()=>{clearTimeout(t);resolve(true);},{once:true});i.addEventListener('error',()=>{clearTimeout(t);reject(Error('IMAGE_LOAD_ERROR'));},{once:true});}));
             const value=await element.evaluate(i=>({complete:i.complete,width:i.naturalWidth,height:i.naturalHeight,blob:i.src.startsWith('blob:'),hidden:!!i.closest('[hidden]'),visible:i.getBoundingClientRect().width>0&&i.getBoundingClientRect().height>0}));
             if(!value.blob||value.hidden||!value.visible||value.width<10||value.height<10)throw Error('PHOTO_CRITICAL_GATE');
             return value;
            };
            const card159=cards.filter({hasText:'159/2026'}).first();await card159.waitFor({state:'visible',timeout:15000});
            const image159=await photo(card159.locator('figure.na-alert-card__media img').first());
            const screenshotHash=crypto.createHash('sha256').update(await card159.screenshot()).digest('hex');
            let image158=null;
            if(data.items.some(x=>x.reference==='158/2026'&&x.imageUrl)){const card158=cards.filter({hasText:'158/2026'}).first();image158=await photo(card158.locator('figure.na-alert-card__media img').first());}
            const href=await card159.locator('a[href*="/rapna/"]').first().getAttribute('href');if(!href)throw Error('REAL_DETAIL_LINK_MISSING');
            csp.push(...await page.evaluate(()=>window.__mediaCsp??[]));
          const detail=await page.goto(new URL(href,origin).href,{waitUntil:'domcontentloaded',timeout:30000});
            if(detail.status()!==200)throw Error('DETAIL_HTTP_'+detail.status());
            const imageDetail=await photo(page.locator('.na-alert-detail__media img').first());
            csp.push(...await page.evaluate(()=>window.__mediaCsp??[]));
            if(errors.length||csp.length||official.some(x=>x.status!==200||x.cookie||x.referer)||!official.length)throw Error('BROWSER_SECURITY_OR_JS_GATE');
            output({gate:'PASS',profile:profile.name,locale,listHttp:response.status(),detailHttp:detail.status(),detailUrl:page.url(),card159:image159,card158:image158,detail159:imageDetail,cardScreenshotSha256:screenshotHash,officialRequests:official,jsErrors:errors,cspViolations:csp,requestFailures:failures,fixtures:0,physicalSafari:false});
            passes++;await page.close();
           }
           }finally{await context.close();await browser.close();}
          }
          output({gate:'SUMMARY',result:passes===6?'PASS':'FAIL',passes,nagameRequests,requestCap:500,noFixtures:true,noD1Writes:true,noNewBuild:true});
          if(passes!==6)process.exitCode=1;
          })().catch(e=>{output({gate:'FAIL',name:e.name,reason:String(e.message).slice(0,220)});process.exitCode=1;});
          NODE
