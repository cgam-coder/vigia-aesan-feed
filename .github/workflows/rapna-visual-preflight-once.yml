name: RAPNA read existing production build chain
on:
  push:
    branches: [sec-f1/cloudflare-api-readonly-20261009]
    paths: [.github/workflows/rapna-visual-preflight-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Read build trigger and current deployment only
        env:
          CF_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CF_READ_TOKEN;
          const root='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f';
          const get=async p=>{const r=await fetch(root+p,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(18000)});return{http:r.status,...await r.json()};};
          const out=x=>console.log('RAPNA_CHAIN_READ '+JSON.stringify(x));
          const b=await get('/builds/builds/ca4bab1d-5c4c-4ec9-bcd5-c6279ae4dcfe');out({gate:'main_build_metadata',http:b.http,status:b.result?.status,outcome:b.result?.build_outcome,trigger:b.result?.trigger,source:b.result?.build_trigger_metadata});
          const t=await get('/builds/workers/c16d1153847b48f7ba2245915cfd97ab/triggers');out({gate:'production_triggers',http:t.http,result:t.result});
          const builds=await get('/builds/workers/c16d1153847b48f7ba2245915cfd97ab/builds?per_page=8&page=1');out({gate:'production_builds',http:builds.http,items:builds.result?.map(x=>({id:x.build_uuid,status:x.status,outcome:x.build_outcome,created:x.created_on,source:x.build_trigger_metadata,trigger:x.trigger}))});
          const d=await get('/workers/scripts/vigia-runtime/deployments');out({gate:'actual_allocation',http:d.http,items:d.result?.deployments?.slice(0,2).map(x=>({id:x.id,created:x.created_on,versions:x.versions}))});
          NODE
