name: RAPNA exact build failure read-only
on:
  push:
    branches: [sec-f1/cloudflare-api-readonly-20261009]
    paths: [.github/workflows/rapna-visual-preflight-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Read exact failed build log only
        env:
          CF_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CF_READ_TOKEN;
          const root='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f';
          const r=await fetch(root+'/builds/builds/4e105ba5-de31-4492-9730-6d8158e55041/logs',{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(18000)});
          const d=await r.json();const ls=(d.result?.lines??[]).map(x=>Array.isArray(x)?String(x[1]):typeof x==='string'?x:x.line??x.message??JSON.stringify(x));
          const fail=ls.map((line,i)=>({line,i})).filter(x=>/✖|not ok|AssertionError|ERR_ASSERTION|failing tests|Error:|Failed:/.test(x.line));
          const clean=s=>s.split(token).join('[REDACTED]').replace(/Bearer\s+\S+/gi,'Bearer [REDACTED]');
          console.log('RAPNA_BUILD_FAILURE '+JSON.stringify({http:r.status,truncated:d.result?.truncated,cursor:d.result?.cursor,totalLines:ls.length,failures:fail.map(x=>({line:clean(x.line),context:ls.slice(Math.max(0,x.i-3),x.i+25).map(clean)})).slice(0,15)}));
          NODE
