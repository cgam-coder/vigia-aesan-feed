name: SR271 quiet runtime-only RAPNA planner corrective checkpoint
on:
  push:
    branches: [source-reliability/durable-recovery-20261009]
    paths: [.github/workflows/sr271-rapna-admission-activation.yml, ops/sr271-rapna-admission-claim.mjs]
permissions:
  contents: read
jobs:
  checkpoint:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Authenticated primary SELECT then one CAS quiet claim, no deploy or source mutation
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node ops/sr271-rapna-admission-claim.mjs
