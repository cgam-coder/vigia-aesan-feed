name: RAPNA category exact production build once (guarded)
on:
  push:
    branches: [sec-f1/cloudflare-api-readonly-20261009]
    paths: [.github/workflows/rapna-category-prod-release-exact.yml]
permissions:
  contents: read
concurrency:
  group: rapna-category-prod-build-exact-0c924db3
  cancel-in-progress: false
jobs:
  production:
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    steps:
      - name: Preflight / single official Cloudflare production trigger / verify allocation
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const base='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f';
          const expected='0c924db3ec367614a3d57ecd94ab24428f3794e6';
          const oldVersion='a501a21b-5bed-406d-87b2-d82fe0d59f11';
          const token=process.env.CF_TOKEN,auth=process.env.VIGIA_SYNC_TOKEN;
          const log=(x)=>console.log('RAPNA_CATEGORY_PROD '+JSON.stringify(x));
          if(!token||!auth){log({gate:'credentials',outcome:'HOLD'});process.exitCode=1;process.exit();}
          const nap=async ms=>new Promise(resolve=>setTimeout(resolve,ms));
          const get=async(url,t)=>{
            const r=await fetch(url,{method:'GET',redirect:'error',headers:{Authorization:'Bearer '+t,Accept:'application/json'},signal:AbortSignal.timeout(16000)});
            return {http:r.status,data:await r.json().catch(()=>null)};
          };
          const gate=async()=>{
            const r=await get('https://vigia-runtime.c-gamiz93.workers.dev/api/source-reliability?observe=1',auth);
            return {http:r.http,mode:r.data?.mode,sha:r.data?.buildSha,
              activeLease:r.data?.activeLease===true,lastAudit:r.data?.state?.lastAudit?.finishedAt,
              unknownRecent:Object.entries(r.data?.state?.recentAttempts??{}).filter(([_,v])=>v?.outcome==='unknown').map(([k])=>k),
              unknownRevision:Object.entries(r.data?.state?.revisionAttempts??{}).filter(([_,v])=>v?.outcome==='unknown').map(([k])=>k)};
          };
          let triggered=false;
          try{
            const scripts=await get(base+'/workers/scripts',token);
            const worker=(Array.isArray(scripts.data?.result)?scripts.data.result:[]).find(x=>x.id==='vigia-runtime');
            if(scripts.http!==200||!worker?.tag)throw Error('worker_lookup_failed');
            const rows=await get(base+'/builds/workers/'+encodeURIComponent(worker.tag)+'/triggers',token);
            const triggers=Array.isArray(rows.data?.result)?rows.data.result:[];
            const exact=triggers.filter(x=>Array.isArray(x.branch_includes)&&x.branch_includes.includes('main')&&
              (x.deploy_command??'').trim()==='npx wrangler deploy'&&
              (x.build_command??'').trim()==='npm run build:cloudflare'&&
              Array.isArray(x.branch_excludes)&&!x.branch_excludes.includes('main'));
            log({gate:'production_trigger',http:rows.http,matched:exact.length,total:triggers.length,
              commands_match:exact.length===1,token_configured:typeof exact[0]?.build_token_uuid==='string'});
            if(rows.http!==200||exact.length!==1||typeof exact[0].trigger_uuid!=='string')throw Error('production_trigger_not_unique');
            const deployments=await get(base+'/workers/scripts/vigia-runtime/deployments',token);
            const entry=deployments.data?.result?.deployments?.[0];
            const version=entry?.versions?.[0];
            const native=await gate();
            log({gate:'baseline',sha:native.sha,lease:native.activeLease,
              unknownRecent:native.unknownRecent.length,unknownRevision:native.unknownRevision.length,
              allocated_version:version?.version_id,allocation_pct:version?.percentage});
            if(deployments.http!==200||version?.percentage!==100||version?.version_id!==oldVersion||
              native.http!==200||native.mode!=='five-source-coordinated'||
              ![oldVersion,expected].includes(native.sha)&&native.sha!=='318151cd69f1afbfcecb281e15ba787d11f297bc'||
              native.activeLease||native.unknownRecent.length||native.unknownRevision.length)throw Error('baseline_gate_failed');
            if(native.sha===expected){log({gate:'idempotency',outcome:'already_deployed'});process.exit();}

            const history=await get(base+'/builds/workers/'+encodeURIComponent(worker.tag)+'/builds',token);
            const builds=Array.isArray(history.data?.result)?history.data.result:
              Array.isArray(history.data?.result?.builds)?history.data.result.builds:null;
            log({gate:'builds',http:history.http,success:history.data?.success===true,records:builds?.length??null});
            if(history.http!==200||!Array.isArray(builds))throw Error('build_listing_unavailable');
            const concurrent=builds.filter(x=>['queued','running','building','in_progress'].includes(x.status));
            if(concurrent.length>0)throw Error('concurrent_cloudflare_build');
            const already=builds.find(x=>x.build_trigger_metadata?.commit_hash===expected&&
              x.build_trigger_metadata?.deploy_command?.trim()==='npx wrangler deploy');
            if(already)throw Error('production_attempt_already_recorded_no_retry');

            const trigger=exact[0].trigger_uuid;
            log({gate:'immutable_intent',commit:expected,branch:'main',request_count:1,previous_version:oldVersion,
              no_retry_on_unknown_outcome:true});
            const resp=await fetch(base+'/builds/triggers/'+trigger+'/builds',{
              method:'POST',redirect:'error',headers:{Authorization:'Bearer '+token,Accept:'application/json','Content-Type':'application/json'},
              body:JSON.stringify({branch:'main',commit_hash:expected}),signal:AbortSignal.timeout(25000)});
            triggered=true;
            const payload=await resp.json().catch(()=>null);
            const buildId=payload?.result?.build_uuid??payload?.result?.uuid??null;
            log({gate:'one_production_build_requested',http:resp.status,success:payload?.success===true,
              error_codes:payload?.errors?.map(e=>e.code)??[],build_uuid:buildId});
            if(!resp.ok||!payload?.success||!buildId)throw Error('production_trigger_response_uncertain_do_not_retry');
            let buildOutcome='unknown',verifiedDeployCommand=false;
            for(let i=0;i<38;i++){
              await nap(12000);
              const b=await get(base+'/builds/builds/'+buildId,token);
              buildOutcome=b.data?.result?.build_outcome??'unknown';
              const status=b.data?.result?.status??'unknown';
              if(buildOutcome==='success'||buildOutcome==='failure'||buildOutcome==='failed'){
                log({gate:'build_result',id:buildId,http:b.http,status,outcome:buildOutcome,polls:i+1});
                break;
              }
            }
            if(buildOutcome!=='success')throw Error('build_not_certified_success');
            const logs=await get(base+'/builds/builds/'+buildId+'/logs',token);
            const raw=Array.isArray(logs.data?.result?.lines)?logs.data.result.lines:[];
            const lines=raw.map(x=>Array.isArray(x)?String(x.at(-1)):String(x));
            verifiedDeployCommand=lines.some(x=>x.includes('Executing user deploy command: npx wrangler deploy'));
            const preview=lines.some(x=>x.includes('Executing user deploy command: npx wrangler preview'));
            log({gate:'deployment_command',logs_http:logs.http,production_command:verifiedDeployCommand,
              unexpected_preview_command:preview,full_payload_discarded:true});
            if(!verifiedDeployCommand||preview)throw Error('not_production_deployment_command');
            for(let i=0;i<7;i++){
              const d=await get(base+'/workers/scripts/vigia-runtime/deployments',token);
              const cur=d.data?.result?.deployments?.[0]?.versions?.[0];
              const current=await gate();
              if(cur?.percentage===100&&cur?.version_id!==oldVersion&&current.sha===expected){
                log({gate:'deployment_verified',outcome:'PASS',build:expected,version:cur.version_id,
                  pct:cur.percentage,created:d.data?.result?.deployments?.[0]?.created_on,
                  lease:current.activeLease,unknownRecent:current.unknownRecent.length,
                  unknownRevision:current.unknownRevision.length});
                process.exit();
              }
              if(i===6)log({gate:'deployment_verified',outcome:'HOLD',version:cur?.version_id,build:current.sha});
              await nap(10000);
            }
            throw Error('post_build_worker_allocation_not_verified');
          }catch(e){
            log({gate:'abort',outcome:'HOLD',reason:e?.message??'unknown',
              possibly_triggered:triggered,no_automatic_retry:true});
            process.exitCode=1;
          }
          NODE
