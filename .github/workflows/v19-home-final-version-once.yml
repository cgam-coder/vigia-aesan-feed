name: V19 home final Worker version read-only
on:
  push:
    branches: [sec-f1/cloudflare-api-readonly-20261009]
    paths: [.github/workflows/v19-home-final-version-once.yml]
permissions:
  contents: read
jobs:
  audit:
    if: github.actor == 'cgam-coder'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: GET exact Worker deployment/rollback and latest build
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CF_TOKEN;
          if(!token)throw Error('TOKEN_MISSING');
          const root='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f';
          async function get(path){
            const r=await fetch(root+path,{method:'GET',redirect:'error',
              headers:{Authorization:'Bearer '+token,Accept:'application/json'},signal:AbortSignal.timeout(15000)});
            const j=await r.json().catch(()=>null);
            if(r.status!==200||j?.success!==true)throw Error('GET_FAIL_'+r.status);
            return j.result;
          }
          for(const name of ['vigia-runtime','vigia-source-runner']){
            const x=await get('/workers/scripts/'+name+'/deployments');
            console.log('V19_HOME_FINAL_DEPLOY '+JSON.stringify({name,deployments:(x.deployments??[]).slice(0,2).map(d=>({
              id:d.id,created:d.created_on,versions:(d.versions??[]).map(v=>({id:v.version_id,pct:v.percentage}))
            }))}));
          }
          const scripts=await get('/workers/scripts');
          const tag=(Array.isArray(scripts)?scripts:[]).find(x=>x.id==='vigia-runtime')?.tag;
          if(!tag)throw Error('WORKER_TAG_MISSING');
          const v=await get('/builds/workers/'+encodeURIComponent(tag)+'/builds');
          const b=Array.isArray(v)?v:(v.builds??[]);
          console.log('V19_HOME_FINAL_BUILD '+JSON.stringify(b.filter(x=>x.build_trigger_metadata?.commit_hash==='c52f638f50177ebb38ac364e8d8587a19aa42d7b').map(x=>({
            commit:x.build_trigger_metadata.commit_hash,outcome:x.build_outcome,id:x.build_uuid
          }))));
          NODE
