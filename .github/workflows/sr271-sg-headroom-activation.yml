name: SR271 Safety Gate commit headroom exclusive quiet checkpoint
on:
  push:
    branches: [source-reliability/durable-recovery-20261009]
    paths: [.github/workflows/sr271-sg-headroom-activation.yml]
permissions:
  contents: read
jobs:
  checkpoint:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Authenticated GET SELECT preflight and one fenced control claim
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          const root='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f',database='55596003-1b90-4f66-aad8-decb21205f13',script='/workers/scripts/vigia-source-runner';
          if(Date.now()>Date.parse('2026-10-09T11:25:00Z')||Number(process.env.RUN_ATTEMPT)!==1)throw Error('Runner preflight expired');
          const report=(tag,value)=>console.log(tag+' '+JSON.stringify(value));
          async function cf(path){const r=await fetch(root+path,{headers:{Authorization:'Bearer '+process.env.CF_TOKEN},signal:AbortSignal.timeout(25000)}),p=await r.json();if(!r.ok||!p.success)throw Error('Cloudflare GET failed '+path);return p.result;}
          for(const service of ['vigia-runtime','vigia-source-runner']){const d=await cf('/workers/scripts/'+service+'/deployments'),v=await cf('/workers/scripts/'+service+'/versions/'+d.deployments[0].versions[0].version_id);report('R17_RUNNER_PREFLIGHT_ALLOCATION',{at:new Date().toISOString(),service,active:d.deployments[0],number:v.number,rollback:d.deployments.slice(1,3)});}
          const r=await fetch(root+script+'/content/v2',{headers:{Authorization:'Bearer '+process.env.CF_TOKEN},signal:AbortSignal.timeout(25000)});
          if(!r.ok)throw Error('Runner artifact GET failed '+r.status);
          const type=r.headers.get('content-type')??'',bytes=new Uint8Array(await r.arrayBuffer());let module=bytes,names=[];
          if(type.includes('multipart')){const response=new Response(bytes,{headers:{'Content-Type':type.replace('multipart/mixed','multipart/form-data')}}),form=await response.formData();names=[...form.keys()];const file=form.get('source-runner.mjs');if(!file||typeof file==='string')throw Error('Runner content module not found: '+names.join(','));module=new Uint8Array(await file.arrayBuffer());}
          const hash=crypto.createHash('sha256').update(module).digest('hex');report('R17_RUNNER_PREFLIGHT_ARTIFACT',{at:new Date().toISOString(),http:r.status,type,names,bytes:module.byteLength,hash});
          const settings=await cf(script+'/settings'),subdomain=await cf(script+'/subdomain'),schedules=await cf(script+'/schedules');report('R17_RUNNER_PREFLIGHT_SETTINGS',{compatibility_date:settings.compatibility_date,compatibility_flags:settings.compatibility_flags,limits:settings.limits,observability:settings.observability,bindings:settings.bindings.map(b=>({name:b.name,type:b.type,id:b.id,text:b.type==='plain_text'?b.text:undefined})),subdomain,schedules});
          for(const sql of ["SELECT owner_id,epoch,expires_at FROM source_reliability_control WHERE id=1","SELECT * FROM source_sync_locks","SELECT id,source,mode,kind,phase,started_at,deadline,finished_at,receipt_json FROM source_reliability_jobs WHERE finished_at IS NULL OR started_at>='2026-10-09T07:54:00Z' ORDER BY started_at","SELECT effect_key,job_id,source,mode,ordinal FROM source_reliability_effects WHERE committed_at IS NULL","SELECT job_id,COUNT(*) AS markers,SUM(committed_at IS NULL) AS pending,MAX(ordinal) AS head FROM source_reliability_effects WHERE job_id='b217d0ca-28ee-43f0-9480-9b99c7775971' GROUP BY job_id"]){const r=await fetch(root+'/d1/database/'+database+'/query',{method:'POST',headers:{Authorization:'Bearer '+process.env.CF_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({sql}),signal:AbortSignal.timeout(25000)}),p=await r.json();if(!r.ok||!p.success||p.result.some(x=>x.meta?.changes||x.meta?.rows_written||x.meta?.served_by_primary!==true))throw Error('SELECT unconfirmed');report('R17_RUNNER_PREFLIGHT_SELECT',{at:new Date().toISOString(),sql,result:p.result});}
          report('R17_RUNNER_PREFLIGHT_COMPLETE',{at:new Date().toISOString(),zeroWrite:true,runner12ArtifactVerified:hash==='23d7225d57268fbe27278eae746e5c9cc9764d2ea6af6f4871206f663394b98a'});
          const owner='sr271-sg-commit-headroom-20261009',stop=Math.min(Date.now()+360000,Date.parse('2026-10-09T11:20:00Z'));
          async function select(sql,params=[]){if(!sql.startsWith('SELECT '))throw Error('Read only');const r=await fetch(root+'/d1/database/'+database+'/query',{method:'POST',headers:{Authorization:'Bearer '+process.env.CF_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({sql,params}),signal:AbortSignal.timeout(25000)}),p=await r.json();if(!r.ok||!p.success||p.result.some(x=>x.meta?.changes||x.meta?.rows_written||x.meta?.served_by_primary!==true))throw Error('SELECT failed');return p.result[0].results;}
          let before;
          for(;;){before=(await select('SELECT owner_id,epoch,expires_at FROM source_reliability_control WHERE id=1'))[0];const leases=await select('SELECT source,owner_id,expires_at FROM source_sync_locks WHERE expires_at>?',[new Date().toISOString()]);const jobs=await select('SELECT id,source,mode FROM source_reliability_jobs WHERE finished_at IS NULL AND deadline>?',[Date.now()]);const pending=await select('SELECT effect_key FROM source_reliability_effects WHERE committed_at IS NULL');const unknown=await select("SELECT id FROM source_reliability_jobs WHERE id!='6c7b88a1-f52e-4087-bf0c-0719a533a60c' AND (receipt_json IS NULL OR json_extract(receipt_json,'$.outcome')='unknown')");if(before.owner_id===null&&!leases.length&&!jobs.length&&!pending.length&&!unknown.length)break;report('R17_RUNNER_CLAIM_WAIT',{at:new Date().toISOString(),owner:before.owner_id,leases,jobs,pending,zeroWrite:true});if(Date.now()>=stop)throw Error('No quiet checkpoint; no concurrent deployment');await new Promise(r=>setTimeout(r,10000));}
          
          const incident='6c7b88a1-f52e-4087-bf0c-0719a533a60c';
          const incidentJob=(await select('SELECT * FROM source_reliability_jobs WHERE id=?',[incident]))[0],incidentState=(await select("SELECT * FROM source_sync_state WHERE source='SAFETY GATE' AND mode='recent'"))[0];
          const prefix=(await select("SELECT COUNT(*) AS n,COUNT(DISTINCT ordinal) AS distinct_n,MIN(ordinal) AS first,MAX(ordinal) AS head,SUM(committed_at IS NULL OR result_json IS NULL) AS pending,SUM(json_extract(manifest_json,'$.jobId') IS NOT ? OR json_extract(manifest_json,'$.source') IS NOT 'SAFETY GATE' OR json_extract(manifest_json,'$.mode') IS NOT 'recent' OR json_extract(manifest_json,'$.ordinal') IS NOT ordinal) AS invalid FROM source_reliability_effects WHERE job_id=?",[incident,incident]))[0];
          const stateMarker=(await select("SELECT manifest_json,effect_key FROM source_reliability_effects AS e WHERE job_id=? AND committed_at IS NOT NULL AND EXISTS(SELECT 1 FROM json_each(e.manifest_json,'$.writes') AS w WHERE json_extract(w.value,'$.sql') LIKE '%INSERT INTO source_sync_state%') ORDER BY ordinal DESC LIMIT 1",[incident]))[0];
          const original=JSON.parse(incidentJob.receipt_json),body=JSON.parse(stateMarker.manifest_json),write=body.writes.filter(w=>/^\s*INSERT\s+INTO\s+source_sync_state\b/iu.test(w.sql));
          const match=/INSERT\s+INTO\s+source_sync_state\s*\(([^)]+)\)\s*SELECT\s+((?:\?\s*,\s*)+\?)/iu.exec(write[0]?.sql??''),stateNames=match?.[1].split(',').map(x=>x.trim());
          if(incidentJob.source!=='SAFETY GATE'||incidentJob.mode!=='recent'||incidentJob.kind!=='recent'||incidentJob.phase!=='finished'||incidentJob.deadline>=Date.now()||original.outcome!=='unknown'||!original.state.lastError.endsWith(incident+':effect:134')||prefix.n!==133||prefix.head!==133||prefix.distinct_n!==133||prefix.first!==1||prefix.pending||prefix.invalid||write.length!==1||!stateNames||stateNames.length!==Object.keys(incidentState).length||stateNames.some((k,i)=>incidentState[k]!==write[0].params[i])||incidentState.status!=='running'||incidentState.lease_owner_id!==incident)throw Error('Quarantined job prefix or exact state changed; no deployment');
          report('R17_SG_ABSENT_NEXT_INTENT_PROOF',{at:new Date().toISOString(),id:incident,prefix,stateEffect:stateMarker.effect_key,nextIntentAbsent:true,exactState:true,lastSuccess:incidentState.last_success_at,unknownPreserved:true,zeroWrite:true});
          
          const runtime=await cf('/workers/scripts/vigia-runtime/deployments'),runner=await cf(script+'/deployments');
          if(runtime.deployments[0].versions.length!==1||runtime.deployments[0].versions[0].version_id!=='f08b6a16-495f-4752-9a1f-64e2d18eaee0'||runtime.deployments[0].versions[0].percentage!==100||runner.deployments[0].versions[0].version_id!=='6e8aed06-f861-4301-b34b-0a539d6974b9'||!runner.deployments[0].versions.every(x=>x.percentage===100)||hash!=='23d7225d57268fbe27278eae746e5c9cc9764d2ea6af6f4871206f663394b98a')throw Error('Allocation or runner artifact drift');
          const at=new Date().toISOString(),expires=new Date(Date.now()+480000).toISOString(),epoch=before.epoch+1;
          const stateKeys=Object.keys(incidentState),quote=x=>'"'+x.replaceAll('"','""')+'"',chunks=[];for(let i=0;i<stateKeys.length;i+=16)chunks.push('json_array('+stateKeys.slice(i,i+16).map(quote).join(',')+')');const stateValue=[];for(let i=0;i<stateKeys.length;i+=16)stateValue.push(stateKeys.slice(i,i+16).map(k=>incidentState[k]));
          const incidentGuard=" AND EXISTS(SELECT 1 FROM source_reliability_jobs WHERE id=? AND phase='finished' AND deadline<? AND receipt_json=?) AND (SELECT COUNT(*) FROM source_reliability_effects WHERE job_id=?)=133 AND (SELECT MAX(ordinal) FROM source_reliability_effects WHERE job_id=?)=133 AND (SELECT json_array("+chunks.join(',')+") FROM source_sync_state WHERE source='SAFETY GATE' AND mode='recent') IS ?";
          const statement={sql:"UPDATE source_reliability_control SET owner_id=?,epoch=epoch+1,expires_at=? WHERE id=1 AND owner_id IS NULL AND epoch=? AND NOT EXISTS(SELECT 1 FROM source_sync_locks WHERE expires_at>?) AND NOT EXISTS(SELECT 1 FROM source_reliability_jobs WHERE finished_at IS NULL AND deadline>?) AND NOT EXISTS(SELECT 1 FROM source_reliability_effects WHERE committed_at IS NULL) "+incidentGuard+" RETURNING epoch",params:[owner,expires,before.epoch,at,Date.now(),incident,Date.now(),incidentJob.receipt_json,incident,incident,JSON.stringify(stateValue)]};
          try{const r=await fetch(root+'/d1/database/'+database+'/query',{method:'POST',headers:{Authorization:'Bearer '+process.env.CF_TOKEN,'Content-Type':'application/json'},body:JSON.stringify(statement),signal:AbortSignal.timeout(25000)}),p=await r.json();if(!r.ok||!p.success||p.result[0].results[0]?.epoch!==epoch)throw Error('Exclusive claim not confirmed');}catch(error){const row=(await select('SELECT owner_id,epoch,expires_at FROM source_reliability_control WHERE id=1'))[0];if(row.owner_id!==owner||row.epoch!==epoch||row.expires_at!==expires)throw error;}
          const after=(await select('SELECT owner_id,epoch,expires_at FROM source_reliability_control WHERE id=1'))[0];if(after.owner_id!==owner||after.epoch!==epoch)throw Error('Claim postflight changed');report('R17_RUNNER_EXCLUSIVE_CHECKPOINT',{at:new Date().toISOString(),owner,epoch,expires,sourceWorkNotRepeated:true,readyForVerifiedMergeAndOneRunnerUpload:true});
          NODE
