name: Temporary WORK23-F1 production release smoke

on:
  push:
    branches: [ops/work23-f1-preview-smoke]
    paths:
      - ".github/workflows/work23-f1-preview-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate WORK23-F1 production release
        shell: bash
        run: |
          set -euo pipefail
          base="https://nagamealert.com"
          ready=0
          for attempt in $(seq 1 60); do
            code="$(curl -sS --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -o /tmp/es -D /tmp/es-h -w '%{http_code}' "$base/es/patrones" || true)"
            if [ "$code" = "200" ] && grep -Fq "No son una taxonomía oficial de AESAN" /tmp/es; then
              echo "Release visible on attempt $attempt"
              ready=1
              break
            fi
            echo "Release not visible yet: attempt=$attempt code=$code"
            sleep 5
          done
          test "$ready" = "1"

          grep -Fq "Qué se repite en el archivo público de AESAN" /tmp/es
          grep -Fq "Recurrencia no significa identidad" /tmp/es
          grep -Fq "Clasificación NagameAlert" /tmp/es
          grep -Fq "Marcas repetidas" /tmp/es
          grep -Fq "Carrefour" /tmp/es
          grep -Fq 'href="/es/patrones"' /tmp/es
          grep -Fq 'href="/en/patterns"' /tmp/es
          grep -Fq '<link rel="canonical" href="https://nagamealert.com/es/patrones"/>' /tmp/es
          grep -Fq '<link rel="alternate" hrefLang="es" href="https://nagamealert.com/es/patrones"/>' /tmp/es
          grep -Fq '<link rel="alternate" hrefLang="en" href="https://nagamealert.com/en/patterns"/>' /tmp/es
          grep -Fq '<link rel="alternate" hrefLang="x-default" href="https://nagamealert.com/es/patrones"/>' /tmp/es
          if grep -qi '^x-robots-tag:.*noindex' /tmp/es-h; then echo "Clean ES route unexpectedly noindex"; exit 1; fi
          if grep -Fq '<meta name="robots" content="noindex' /tmp/es; then echo "Clean ES meta noindex"; exit 1; fi

          code="$(curl -sS --max-time 30 -H 'Cache-Control: no-cache' -o /tmp/en -D /tmp/en-h -w '%{http_code}' "$base/en/patterns")"
          test "$code" = "200"
          grep -Fq "What repeats across the public AESAN archive" /tmp/en
          grep -Fq "Recurrence does not mean identity" /tmp/en
          grep -Fq "They are not an official AESAN taxonomy" /tmp/en
          grep -Fq "NagameAlert classification" /tmp/en
          grep -Fq '<link rel="canonical" href="https://nagamealert.com/en/patterns"/>' /tmp/en
          if grep -qi '^x-robots-tag:.*noindex' /tmp/en-h; then echo "Clean EN route unexpectedly noindex"; exit 1; fi

          code="$(curl -sS --max-time 30 -o /tmp/query -D /tmp/query-h -w '%{http_code}' "$base/es/patrones?brand=Carrefour")"
          test "$code" = "200"
          grep -qi '^x-robots-tag: noindex' /tmp/query-h

          curl -sS --max-time 30 -o /tmp/static-es "$base/sitemaps/static-es.xml"
          curl -sS --max-time 30 -o /tmp/static-en "$base/sitemaps/static-en.xml"
          grep -Fq '<loc>https://nagamealert.com/es/patrones</loc>' /tmp/static-es
          grep -Fq '<loc>https://nagamealert.com/en/patterns</loc>' /tmp/static-en

          curl -sS --max-time 30 -o /tmp/home "$base/"
          grep -Fq 'href="/es/patrones"' /tmp/home

          echo "WORK23-F1 production smoke PASS"
