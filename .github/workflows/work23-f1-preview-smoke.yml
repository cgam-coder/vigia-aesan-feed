name: Temporary WORK23-F1 Preview diagnostic

on:
  push:
    branches: [ops/work23-f1-preview-smoke]
    paths:
      - ".github/workflows/work23-f1-preview-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose WORK23-F1 Preview content
        shell: bash
        run: |
          set -euo pipefail
          base="https://work-work23-f1-public-patterns-vigia-runtime.c-gamiz93.workers.dev"
          curl -sS --max-time 30 -H 'Cache-Control: no-cache' -o /tmp/es -D /tmp/es-h "$base/es/patrones"
          curl -sS --max-time 30 -H 'Cache-Control: no-cache' -o /tmp/en -D /tmp/en-h "$base/en/patterns"
          echo "=== ES headers ==="
          grep -iE '^(HTTP/|x-robots-tag|location|content-type):' /tmp/es-h || true
          echo "=== ES markers ==="
          grep -oE 'Qué se repite[^<]*|Recurrencia no significa identidad[^<]*|taxonomía oficial de AESAN[^<]*|clasificación de NagameAlert[^<]*|href="/(?:es/patrones|en/patterns)"' /tmp/es | head -40 || true
          echo "=== EN headers ==="
          grep -iE '^(HTTP/|x-robots-tag|location|content-type):' /tmp/en-h || true
          echo "=== EN markers ==="
          grep -oE 'What repeats[^<]*|Recurrence does not mean identity[^<]*|official AESAN taxonomy[^<]*|NagameAlert classification[^<]*|href="/(?:es/patrones|en/patterns)"' /tmp/en | head -40 || true
          echo "=== bytes ==="
          wc -c /tmp/es /tmp/en
