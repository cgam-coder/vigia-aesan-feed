name: Temporary WORK23-F1 production diagnostic

on:
  push:
    branches: [ops/work23-f1-preview-smoke]
    paths:
      - ".github/workflows/work23-f1-preview-smoke.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose production WORK23-F1 contracts
        shell: bash
        run: |
          set -euo pipefail
          base="https://nagamealert.com"
          curl -sS --max-time 30 -H 'Cache-Control: no-cache' -o /tmp/es -D /tmp/es-h "$base/es/patrones"
          curl -sS --max-time 30 -H 'Cache-Control: no-cache' -o /tmp/en -D /tmp/en-h "$base/en/patterns"
          curl -sS --max-time 30 -o /tmp/query -D /tmp/query-h "$base/es/patrones?brand=Carrefour"
          curl -sS --max-time 30 -o /tmp/static-es "$base/sitemaps/static-es.xml"
          curl -sS --max-time 30 -o /tmp/static-en "$base/sitemaps/static-en.xml"
          curl -sS --max-time 30 -o /tmp/home "$base/"

          echo "=== ES headers ==="
          grep -iE '^(HTTP/|x-robots-tag|content-type|cf-cache-status|location):' /tmp/es-h || true
          echo "=== ES head ==="
          grep -oE '<title[^>]*>[^<]*</title>|<meta[^>]+robots[^>]*>|<link[^>]+(canonical|alternate)[^>]*>' /tmp/es | head -30 || true
          echo "=== ES markers ==="
          for needle in "Qué se repite en el archivo público de AESAN" "Recurrencia no significa identidad" "Clasificación NagameAlert" "No son una taxonomía oficial de AESAN" "Marcas repetidas" "Carrefour" 'href="/es/patrones"' 'href="/en/patterns"'; do
            if grep -Fq "$needle" /tmp/es; then echo "PASS ES: $needle"; else echo "MISS ES: $needle"; fi
          done

          echo "=== EN headers/head ==="
          grep -iE '^(HTTP/|x-robots-tag|content-type|cf-cache-status|location):' /tmp/en-h || true
          grep -oE '<title[^>]*>[^<]*</title>|<meta[^>]+robots[^>]*>|<link[^>]+(canonical|alternate)[^>]*>' /tmp/en | head -30 || true
          for needle in "What repeats across the public AESAN archive" "Recurrence does not mean identity" "NagameAlert classification" "They are not an official AESAN taxonomy"; do
            if grep -Fq "$needle" /tmp/en; then echo "PASS EN: $needle"; else echo "MISS EN: $needle"; fi
          done

          echo "=== QUERY headers ==="
          grep -iE '^(HTTP/|x-robots-tag|content-type|cf-cache-status|location):' /tmp/query-h || true
          echo "=== SITEMAPS ==="
          grep -F 'https://nagamealert.com/es/patrones' /tmp/static-es || true
          grep -F 'https://nagamealert.com/en/patterns' /tmp/static-en || true
          echo "=== HOME ==="
          if grep -Fq 'href="/es/patrones"' /tmp/home; then echo "PASS HOME patterns"; else echo "MISS HOME patterns"; fi
          echo "=== BYTES ==="
          wc -c /tmp/es /tmp/en /tmp/query /tmp/static-es /tmp/static-en /tmp/home
