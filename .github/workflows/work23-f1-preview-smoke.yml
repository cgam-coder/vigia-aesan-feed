name: Temporary WORK23 rollback wait gate

on:
  push:
    branches: [ops/work23-f1-preview-smoke]
    paths:
      - ".github/workflows/work23-f1-preview-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for and certify removal of public Patterns surface
        shell: bash
        run: |
          set -euo pipefail
          base="https://nagamealert.com"
          removed=0
          for attempt in $(seq 1 36); do
            code="$(curl -sS --max-time 20 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' -o /tmp/es -w '%{http_code}' "$base/es/patrones" || true)"
            echo "attempt $attempt: /es/patrones => $code"
            if [ "$code" = "404" ]; then removed=1; break; fi
            sleep 10
          done
          test "$removed" = "1"

          code="$(curl -sS --max-time 30 -H 'Cache-Control: no-cache' -o /tmp/en -w '%{http_code}' "$base/en/patterns")"
          echo "/en/patterns => $code"
          test "$code" = "404"

          code="$(curl -sS --max-time 30 -H 'Cache-Control: no-cache' -o /tmp/root -w '%{http_code}' "$base/")"
          echo "/ => $code"
          test "$code" = "200"
          if grep -Fq 'href="/es/patrones"' /tmp/root; then echo "Patterns still linked from landing"; exit 1; fi

          code="$(curl -sS --max-time 30 -H 'Cache-Control: no-cache' -o /tmp/alerts -w '%{http_code}' "$base/es/alertas")"
          echo "/es/alertas => $code"
          test "$code" = "200"

          code="$(curl -sS --max-time 30 -H 'Cache-Control: no-cache' -o /tmp/ses -w '%{http_code}' "$base/sitemaps/static-es.xml")"
          test "$code" = "200"
          if grep -Fq 'https://nagamealert.com/es/patrones' /tmp/ses; then echo "ES sitemap still contains Patterns"; exit 1; fi

          code="$(curl -sS --max-time 30 -H 'Cache-Control: no-cache' -o /tmp/sen -w '%{http_code}' "$base/sitemaps/static-en.xml")"
          test "$code" = "200"
          if grep -Fq 'https://nagamealert.com/en/patterns' /tmp/sen; then echo "EN sitemap still contains Patterns"; exit 1; fi

          echo "WORK23 rollback production smoke PASS"
