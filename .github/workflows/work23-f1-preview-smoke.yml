name: Temporary WORK23-F1 production smoke

on:
  push:
    branches: [ops/work23-f1-preview-smoke]
    paths:
      - ".github/workflows/work23-f1-preview-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Validate WORK23-F1 production release
        shell: bash
        run: |
          set -euo pipefail
          base="https://nagamealert.com"

          request() {
            local path="$1"
            curl -sS --max-time 30 -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              -H 'User-Agent: NagameAlert-WORK23-F1-Release/1.0' \
              -o /tmp/body -D /tmp/headers -w '%{http_code}' "$base$path"
          }

          expect200() {
            local path="$1"
            local code
            code="$(request "$path")"
            echo "$path => $code"
            test "$code" = "200"
          }

          expect200 "/es/patrones"
          grep -Fq "Qué se repite en el archivo público de AESAN" /tmp/body
          grep -Fq "Recurrencia no significa identidad" /tmp/body
          grep -Fq "No son una taxonomía oficial de AESAN" /tmp/body
          grep -Fq "Clasificación NagameAlert" /tmp/body
          grep -Fq "Marcas repetidas" /tmp/body
          grep -Fq '<link rel="canonical" href="https://nagamealert.com/es/patrones"/>' /tmp/body
          grep -Fq '<link rel="alternate" hrefLang="es" href="https://nagamealert.com/es/patrones"/>' /tmp/body
          grep -Fq '<link rel="alternate" hrefLang="en" href="https://nagamealert.com/en/patterns"/>' /tmp/body
          grep -Fq '<link rel="alternate" hrefLang="x-default" href="https://nagamealert.com/es/patrones"/>' /tmp/body
          grep -Fq '<meta name="robots" content="index, follow"/>' /tmp/body
          if grep -qi '^x-robots-tag:.*noindex' /tmp/headers; then echo "Clean ES route unexpectedly noindex"; exit 1; fi

          expect200 "/en/patterns"
          grep -Fq "What repeats across the public AESAN archive" /tmp/body
          grep -Fq "Recurrence does not mean identity" /tmp/body
          grep -Fq "They are not an official AESAN taxonomy" /tmp/body
          grep -Fq "NagameAlert classification" /tmp/body
          grep -Fq '<link rel="canonical" href="https://nagamealert.com/en/patterns"/>' /tmp/body
          grep -Fq '<meta name="robots" content="index, follow"/>' /tmp/body

          expect200 "/es/patrones?brand=Carrefour"
          grep -Fq '<meta name="robots" content="noindex, follow"/>' /tmp/body

          expect200 "/"
          grep -Fq 'href="/es/patrones"' /tmp/body

          expect200 "/sitemaps/static-es.xml"
          grep -Fq '<loc>https://nagamealert.com/es/patrones</loc>' /tmp/body

          expect200 "/sitemaps/static-en.xml"
          grep -Fq '<loc>https://nagamealert.com/en/patterns</loc>' /tmp/body

          echo "WORK23-F1 production smoke PASS"
