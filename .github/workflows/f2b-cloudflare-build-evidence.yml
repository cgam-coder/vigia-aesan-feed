name: F2B Cloudflare build evidence
on:
  push:
    branches: [work/scheduler-reliability-s0-evidence]
    paths:
      - ".github/workflows/f2b-cloudflare-build-evidence.yml"
      - "diagnostics/f2b-cloudflare-build-evidence.mjs"
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read F2B Cloudflare build metadata
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node diagnostics/f2b-cloudflare-build-evidence.mjs
