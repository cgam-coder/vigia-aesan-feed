name: PRE1 observer budget and coexistence preflight CP9
on:
  push:
    branches: [work/scheduler-reliability-s0-evidence]
    paths: [".github/workflows/f2b-cloudflare-build-evidence.yml"]
permissions:
  contents: read
jobs:
  collect:
    if: >-
      github.event.head_commit.message == 'PRE1: observer budget reader syntax fix CP9 20261002' &&
      github.run_number == 19 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read current configuration and existing log sink without production mutations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const root='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f';
          const begun=Date.now(), token=process.env.CLOUDFLARE_API_TOKEN;
          const out={checkpoint:'OBSERVER_CP9_PREFLIGHT',observedAt:new Date(begun).toISOString(),productionMutationAttempts:0,retries:0,reads:[]};
          let bytes=0;
          async function read(path,body) {
           const left=90000-(Date.now()-begun); if(left<=0||!token)throw Error('budget-or-token');
           const r=await fetch(path==='/graphql'?'https://api.cloudflare.com/client/v4/graphql':root+path,{method:body?'POST':'GET',redirect:'error',headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(Math.min(8000,left))});
           const b=await r.text();bytes+=Buffer.byteLength(b);if(bytes>1024*1024||b.length>512*1024)throw Error('byte-budget');
           let j;try{j=JSON.parse(b)}catch{}
           const meta={path,http:r.status,success:j?.success===true,errorCodes:(j?.errors||[]).map(x=>x.code),observedAt:new Date().toISOString()};out.reads.push(meta);return {meta,result:j?.result,data:j?.data,errors:(j?.errors||[]).map(x=>({code:x.code,message:typeof x.message==='string'?x.message.slice(0,200):null}))};
          }
          try{
           const month=Date.parse('2026-10-01T00:00:00Z');
           const telemetry=async(id,view,from,filters,calculations)=>read('/workers/observability/telemetry/query',{queryId:id,dry:true,view,chart:false,chartType:'aggregate',ignoreSeries:true,limit:10,timeframe:{from,to:begun},parameters:{datasets:[],filterCombination:'and',filters,limit:10,...(calculations?{calculations}:{})}});
           const usage=await telemetry('observer-cp9-account-log-budget','calculations',month,[],[{operator:'count',alias:'accountEvents'}]);out.accountEvents={meta:usage.meta,result:usage.result};
           const scheduled=await telemetry('observer-cp9-s0-coexistence','events',begun-15*60000,[{key:'$metadata.service',type:'string',operation:'eq',value:'vigia-runtime'},{key:'$metadata.origin',type:'string',operation:'eq',value:'scheduled'}]);
           const es=Array.isArray(scheduled.result?.events?.events)?scheduled.result.events.events:Array.isArray(scheduled.result?.events)?scheduled.result.events:[];
           out.scheduledLogs={meta:scheduled.meta,resultKeys:Object.keys(scheduled.result||{}),events:es.map(e=>({timestamp:e.timestamp,metadata:e.$metadata?{id:e.$metadata.id,service:e.$metadata.service,origin:e.$metadata.origin,type:e.$metadata.type}:null,worker:e.$workers?{scriptName:e.$workers.scriptName,scriptVersion:e.$workers.scriptVersion,eventType:e.$workers.eventType,outcome:e.$workers.outcome,cron:e.$workers.event?.cron}:null,sourceKeys:Object.keys(e.source||{})}))};
           const scripts=await read('/workers/scripts');const worker=Array.isArray(scripts.result)?scripts.result.find(x=>x.id==='vigia-runtime'):null;out.worker={id:worker?.id,tag:worker?.tag,usage_model:worker?.usage_model};
           if(worker?.tag&&/^[a-f0-9-]+$/.test(worker.tag)){const triggers=await read('/builds/workers/'+worker.tag+'/triggers');out.triggers={meta:triggers.meta,list:(Array.isArray(triggers.result)?triggers.result:triggers.result?.triggers||[]).map(x=>({trigger_uuid:x.trigger_uuid,trigger_name:x.trigger_name,build_command:x.build_command,deploy_command:x.deploy_command,branch_includes:x.branch_includes,branch_excludes:x.branch_excludes,path_includes:x.path_includes,path_excludes:x.path_excludes,root_directory:x.root_directory,build_token_uuid_present:!!x.build_token_uuid}))}; const builds=await read('/builds/workers/'+worker.tag+'/builds?per_page=5');out.builds={meta:builds.meta,result:builds.result};}
           const leases=await read('/d1/database/55596003-1b90-4f66-aad8-decb21205f13/query',{sql:"SELECT source, CASE WHEN owner_id IS NULL THEN 0 ELSE 1 END AS ownerPresent, mode, acquired_at AS acquiredAt, expires_at AS expiresAt FROM source_sync_locks WHERE source IN ('AESAN','RAPNA','RASFF','SAFETY GATE','OECD') ORDER BY source LIMIT 5"});out.leases={meta:leases.meta,result:leases.result};
           const graph=await read('/graphql',{query:'query ObserverBudget($tag: string, $from: string, $to: string) { viewer { accounts(filter: {accountTag: $tag}) { workersInvocationsAdaptive(limit: 1, filter: {datetime_geq: $from, datetime_leq: $to}) { sum { requests cpuTimeUs } } } } }',variables:{tag:'9c1807c68493f14259248b5f5782cc6f',from:new Date(month).toISOString(),to:new Date(begun).toISOString()}});out.workerUsage={meta:graph.meta,data:graph.data,errors:graph.errors};
           const dep=await read('/workers/scripts/vigia-runtime/deployments');out.finalDeployment=dep.result?.deployments?.[0];
           out.status='READS_COMPLETE';
          }catch(e){out.status='STOP';out.reason=['budget-or-token','byte-budget'].includes(e.message)?e.message:'transport-or-shape';}
          out.completedAt=new Date().toISOString();out.bytes=bytes;console.log('OBSERVER_BUDGET_PREFLIGHT '+JSON.stringify(out));
          NODE
