name: PRE1 bounded source preflight
on:
  push:
    branches: [work/scheduler-reliability-s0-evidence]
    paths: [".github/workflows/f2b-cloudflare-build-evidence.yml"]
permissions:
  contents: read
jobs:
  collect:
    if: >-
      github.event.head_commit.message == 'PRE1: release85 postrelease 20261002 CP5'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read current source state without audits or recovery
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          // Fixed read-only production preflight. No sync/audit/recovery POST, SQL or retry.
          const CF='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f';
          const BASE='https://vigia-runtime.c-gamiz93.workers.dev';
          const EXPECTED='4fdc2bd3-f2f2-4fb2-8fd9-51a4a47c0704';
          const SOURCES=['AESAN','RAPNA','RASFF','SAFETY GATE','OECD'];
          const ROUTES=['aesan','rapna','rasff','safety-gate','oecd'];
          const tokens={cf:process.env.CLOUDFLARE_API_TOKEN, runtime:process.env.VIGIA_SYNC_TOKEN};
          const blocked={cf:false,runtime:false};
          const start=performance.now();
          const remaining=()=>240000-(performance.now()-start);
          const out={checkpoint:'PRE1-PREFLIGHT-20261002-RELEASE85-CP5',observedAt:new Date().toISOString(),zeroProductWrites:true,
           publicationAuthorized:false,officialParityCertified:false,calls:[],sources:[]};
          const scalar=(o,keys)=>Object.fromEntries(keys.filter(k=>o && Object.hasOwn(o,k) &&
           (o[k]===null||typeof o[k]==='boolean'||Number.isFinite(o[k])||typeof o[k]==='string'&&o[k].length<=100)).map(k=>[k,o[k]]));
          const age=v=>typeof v==='string' && Number.isFinite(Date.parse(v)) && Date.parse(v)<=Date.now() ? (Date.now()-Date.parse(v))/60000:null;
          async function read(path,plane,label,kind='json',reserve=10000){
           const call={label,plane,method:'GET'};out.calls.push(call);
           if((plane!=='public' && !tokens[plane])||blocked[plane]||remaining()<=reserve){call.result='NOT_ATTEMPTED';return null;}
           const url=(plane==='cf'?CF:BASE)+path;
           if(!((plane==='cf'&&['/workers/scripts/vigia-runtime/deployments','/workers/scripts/vigia-runtime/settings'].includes(path))||
           (plane==='public'&&['/','/api/v2/alerts?pageSize=1'].includes(path))||
           (plane==='runtime'&&['/api/freshness?observe=1','/api/freshness?observe=1&policy=1',...ROUTES.map(r=>`/api/${r}/sync?observe=1`)].includes(path))))throw new Error('path-not-allowed');
           const began=performance.now();
           try{
            const r=await fetch(url,{method:'GET',redirect:'error',cache:'no-store',headers:plane==='public'?{}:{Authorization:`Bearer ${tokens[plane]}`},
             signal:AbortSignal.timeout(Math.floor(Math.min(30000,remaining()-reserve)))});
            call.http=r.status;
            if([401,403].includes(r.status)){if(plane!=='public')blocked[plane]=true;call.result='AUTH_HOLD';return null;}
            if(r.status!==200){call.result='HTTP_HOLD';return null;}
            if(kind==='status'){await r.body?.cancel();call.result='OBSERVED';return true;}
            const body=await r.json();
            if(plane==='cf' && (body.success!==true||body.result==null)){call.result='SHAPE_HOLD';return null;}
            call.result='OBSERVED';return plane==='cf'?body.result:body;
           }catch{call.result='TRANSPORT_OR_JSON_HOLD';return null;}
           finally{call.elapsedMs=Math.round(performance.now()-began);}
          }
          const deploy=d=>d?{id:d.id,versions:(d.versions??[]).map(v=>scalar(v,['version_id','percentage']))}:null;
          const before=await read('/workers/scripts/vigia-runtime/deployments','cf','deployment-before');
          out.deploymentBefore=deploy(before?.deployments?.[0]);
          const settings=await read('/workers/scripts/vigia-runtime/settings','cf','settings');
          out.bindings=settings?{db:(settings.bindings??[]).filter(b=>b.type==='d1'&&b.name==='DB').map(b=>scalar(b,['id','database_id'])),
           modes:(settings.bindings??[]).filter(b=>b.type==='plain_text'&&['NAGAMEALERT_RECENT_SCHEDULER_MODE','NAGAMEALERT_SAFETY_GATE_RECENT_MODE'].includes(b.name)).map(b=>scalar(b,['name','text']))}:null;
          out.rootHttp200=await read('/','public','root','status');
          const api=await read('/api/v2/alerts?pageSize=1','public','alerts-smoke');
          out.api=api?{...scalar(api,['apiVersion','schemaVersion']),itemCount:Array.isArray(api.items)?api.items.length:null}:null;
          const p=await read('/api/freshness?observe=1&policy=1','runtime','policy');
          const validPolicy=p?.policyVersion===1&&Array.isArray(p.policies)&&p.policies.length===5&&new Set(p.policies.map(x=>x.source)).size===5&&
           p.policies.every(x=>SOURCES.includes(x.source)&&Number.isFinite(x.recent?.freshMaxAgeMinutes)&&x.recent.freshMaxAgeMinutes>0&&typeof x.revision?.required==='boolean');
          out.policyValid=validPolicy;
          out.policies=validPolicy?p.policies.map(x=>({source:x.source,recent:scalar(x.recent,['freshMaxAgeMinutes','staleMaxAgeMinutes']),revision:scalar(x.revision,['required','mode','scope','maxAgeMinutes','certification'])})):null;
          const stored=await read('/api/freshness?observe=1','runtime','persisted-freshness');
          out.persisted=Array.isArray(stored?.states)?stored.states.filter(x=>SOURCES.includes(x.source)).map(x=>({
           ...scalar(x,['source','checkedAt','status','lastSyncSuccessAt','revisionStatus','revisionLastSuccessAt','latestIdentityParity']),
           observationAgeMinutes:age(x.checkedAt),recentAgeMinutesNow:age(x.lastSyncSuccessAt),revisionAgeMinutesNow:age(x.revisionLastSuccessAt),
           missingCount:Array.isArray(x.missingOfficialIdentities)?x.missingOfficialIdentities.length:null,
           revisionMismatchCount:Array.isArray(x.revisionMismatches)?x.revisionMismatches.length:null,errorPresent:x.error!==null})):null;
          const fields=['source','mode','status','lastSuccessAt','startedAt','completedAt','cursor','cursorKey','totalUnits','coverage','pageErrors','detailFailures','recordsObserved','recordsPersisted','newCount','updatedCount','auditStatus','auditCheckedAt','cycleId','planVersion'];
          const state=x=>x && typeof x==='object'?{...scalar(x,fields),lastErrorPresent:Object.hasOwn(x,'lastError')?x.lastError!==null:null}:null;
          for(let i=0;i<SOURCES.length;i++){
           const source=SOURCES[i];const body=await read(`/api/${ROUTES[i]}/sync?observe=1`,'runtime','observe-'+source);
           const valid=Boolean(body && body.recent?.source===source && body.recent?.mode==='recent' && Object.hasOwn(body,'lease') &&
            (body.lease===null||body.lease?.source===source));
           const rev=body?Object.fromEntries(Object.entries(body).filter(([k])=>/revision|reconcile|parity|historical|legacy/i.test(k))
            .map(([k,v])=>[k,state(v)])):null;
           out.sources.push({source,observed:valid,observedAt:new Date().toISOString(),recent:state(body?.recent),
            recentAgeMinutes:age(body?.recent?.lastSuccessAt),lease:body&&Object.hasOwn(body,'lease')?
            (body.lease===null?null:scalar(body.lease,['source','mode','expiresAt'])):'UNKNOWN',
            backfill:state(body?.backfill),snapshot:body?.snapshot?scalar(body.snapshot,['status','purpose']):null,revision:rev});
          }
          const after=await read('/workers/scripts/vigia-runtime/deployments','cf','deployment-after','json',0);
          out.deploymentAfter=deploy(after?.deployments?.[0]);
          out.deploymentUnchanged=Boolean(out.deploymentBefore?.id===EXPECTED&&JSON.stringify(out.deploymentBefore)===JSON.stringify(out.deploymentAfter));
          out.readsComplete=out.calls.length===12 && out.calls.every(x=>x.result==='OBSERVED') && validPolicy && out.sources.every(x=>x.observed);
          out.completedAt=new Date().toISOString();out.elapsedMs=Math.round(performance.now()-start);
          console.log('PRE1_PREFLIGHT '+JSON.stringify(out));
          if(!out.readsComplete||!out.deploymentUnchanged)process.exitCode=1;
          NODE
