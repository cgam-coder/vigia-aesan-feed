name: PRE1 observer current release preflight CP9
on:
  push:
    branches: [work/scheduler-reliability-s0-evidence]
    paths: [".github/workflows/f2b-cloudflare-build-evidence.yml"]
permissions:
  contents: read
jobs:
  collect:
    if: >-
      github.event.head_commit.message == 'PRE1: observer release read-only preflight CP9 20261002' &&
      github.run_number == 17 && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read current configuration and existing log sink without production mutations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const root='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f';
          const begun=Date.now(), token=process.env.CLOUDFLARE_API_TOKEN;
          const out={checkpoint:'OBSERVER_CP9_PREFLIGHT',observedAt:new Date(begun).toISOString(),productionMutationAttempts:0,retries:0,reads:[]};
          let bytes=0;
          async function read(path,body) {
           const left=90000-(Date.now()-begun); if(left<=0||!token)throw Error('budget-or-token');
           const r=await fetch(root+path,{method:body?'POST':'GET',redirect:'error',headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{}),signal:AbortSignal.timeout(Math.min(8000,left))});
           const b=await r.text();bytes+=Buffer.byteLength(b);if(bytes>1024*1024||b.length>512*1024)throw Error('byte-budget');
           let j;try{j=JSON.parse(b)}catch{}
           const meta={path,http:r.status,success:j?.success===true,errorCodes:(j?.errors||[]).map(x=>x.code),observedAt:new Date().toISOString()};out.reads.push(meta);return {meta,result:j?.result};
          }
          try{
           const dep=await read('/workers/scripts/vigia-runtime/deployments');out.deployments=dep.result?.deployments?.slice(0,2);
           const settings=await read('/workers/scripts/vigia-runtime/settings');
           const s=settings.result;out.settings=s?{logpush:s.logpush,observability:s.observability,usage_model:s.usage_model,limits:s.limits,bindings:(s.bindings||[]).filter(x=>x.type==='d1'||x.type==='plain_text').map(x=>x.type==='d1'?{name:x.name,type:x.type,id:x.id,database_id:x.database_id}:{name:x.name,type:x.type,text:/^NAGAMEALERT_(RECENT_SCHEDULER_MODE|WATCHDOG_OBSERVER_MODE|SAFETY_GATE_RECENT_MODE|PUBLIC_ORIGIN)$/.test(x.name)?x.text:'REDACTED'})}:null;
           const schedules=await read('/workers/scripts/vigia-runtime/schedules');out.schedules=schedules.result;
           const account=await read('/workers/account-settings');out.accountSettings=account.result;
           const subs=await read('/subscriptions');out.subscriptions=Array.isArray(subs.result)?subs.result.map(x=>({state:x.state,rate_plan:{id:x.rate_plan?.id,public_name:x.rate_plan?.public_name,scope:x.rate_plan?.scope},current_period_start:x.current_period_start,current_period_end:x.current_period_end})):null;
           const active=out.deployments?.[0]?.versions;if(active?.length===1){const v=await read('/workers/scripts/vigia-runtime/versions/'+active[0].version_id);out.version=v.result?{id:v.result.id,metadata:v.result.metadata,annotations:v.result.annotations,resources:{script:v.result.resources?.script,bindings:(v.result.resources?.bindings||[]).filter(x=>x.type==='d1').map(x=>({type:x.type,name:x.name,id:x.id}))}}:null;}
           const logs=await read('/workers/observability/telemetry/query',{queryId:'observer-cp9-preflight',dry:true,view:'events',limit:20,timeframe:{from:begun-15*60000,to:begun},parameters:{datasets:[],filters:[{key:'$metadata.service',type:'string',operation:'eq',value:'vigia-runtime'}],filterCombination:'and',limit:20}});
           out.logRead={meta:logs.meta,keys:Object.keys(logs.result||{}),events:(Array.isArray(logs.result?.events?.events)?logs.result.events.events:Array.isArray(logs.result?.events)?logs.result.events:[]).map(e=>({timestamp:e.timestamp,keys:Object.keys(e),metadata:e.$metadata?{id:e.$metadata.id,service:e.$metadata.service,origin:e.$metadata.origin,type:e.$metadata.type}:null,cloudflare:e.$cloudflare?{scriptName:e.$cloudflare.scriptName,requestId:e.$cloudflare.requestId,eventType:e.$cloudflare.eventType,outcome:e.$cloudflare.outcome}:null}))}; 
           out.status='READS_COMPLETE';
          }catch(e){out.status='STOP';out.reason=['budget-or-token','byte-budget'].includes(e.message)?e.message:'transport-or-shape';}
          out.completedAt=new Date().toISOString();out.bytes=bytes;console.log('OBSERVER_PREFLIGHT '+JSON.stringify(out));
          NODE
