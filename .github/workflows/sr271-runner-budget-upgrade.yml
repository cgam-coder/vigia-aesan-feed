name: SR271 single verified RASFF durable capacity activation
on:
  push:
    branches: [source-reliability/durable-recovery-20261009]
    paths: [.github/workflows/sr271-runner-budget-upgrade.yml]
permissions:
  contents: read
concurrency:
  group: sr271-runner-capacity-upgrade-20261009
  cancel-in-progress: false
jobs:
  activate:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify owned checkpoint and upload exactly once then release
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          const root='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f',database='55596003-1b90-4f66-aad8-decb21205f13',script='/workers/scripts/vigia-source-runner';
          if(Date.now()>Date.parse('2026-10-09T09:10:00Z')||Number(process.env.RUN_ATTEMPT)!==1)throw Error('Runner preflight expired');
          const report=(tag,value)=>console.log(tag+' '+JSON.stringify(value));
          async function cf(path){const r=await fetch(root+path,{headers:{Authorization:'Bearer '+process.env.CF_TOKEN},signal:AbortSignal.timeout(25000)}),p=await r.json();if(!r.ok||!p.success)throw Error('Cloudflare GET failed '+path);return p.result;}
          
          import {gunzipSync} from 'node:zlib';
          const expectedOld='301ab8ea-56d3-4765-a979-7674c4604f10',expectedHash='422fd0033c235aed95c7d06b535483b019a38481649643361a8ab37a66b03e07',owner='sr271-capacity-runner-20261009',epoch=222;
          async function query(sql,params=[]){const r=await fetch(root+'/d1/database/'+database+'/query',{method:'POST',headers:{Authorization:'Bearer '+process.env.CF_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({sql,params}),signal:AbortSignal.timeout(25000)}),p=await r.json();if(!r.ok||!p.success)throw Error('D1 statement unconfirmed');if(sql.startsWith('SELECT')&&p.result.some(x=>x.meta?.rows_written||x.meta?.changes))throw Error('SELECT wrote');return p.result[0];}
          async function moduleHash(){const r=await fetch(root+script+'/content/v2',{headers:{Authorization:'Bearer '+process.env.CF_TOKEN},signal:AbortSignal.timeout(25000)});if(!r.ok)throw Error('Module GET failed');const form=await r.formData(),file=form.get('source-runner.mjs');if(!file||typeof file==='string')throw Error('Module missing');return crypto.createHash('sha256').update(new Uint8Array(await file.arrayBuffer())).digest('hex');}
          const allocation=await cf(script+'/deployments'),runtime=await cf('/workers/scripts/vigia-runtime/deployments'),settings=await cf(script+'/settings');
          report('R11_UPLOAD_PREFLIGHT',{at:new Date().toISOString(),runner:allocation.deployments[0],runtime:runtime.deployments[0]});
          const control=(await query('SELECT owner_id,epoch,expires_at FROM source_reliability_control WHERE id=1')).results[0],leases=(await query('SELECT * FROM source_sync_locks WHERE expires_at>?',[new Date().toISOString()])).results,jobs=(await query('SELECT id FROM source_reliability_jobs WHERE finished_at IS NULL AND deadline>?',[Date.now()])).results,pending=(await query('SELECT effect_key FROM source_reliability_effects WHERE committed_at IS NULL')).results;
          report('R11_UPLOAD_FENCE',{control,leases,jobs,pending});
          if(control.owner_id!==owner||control.epoch!==epoch||Date.parse(control.expires_at)<Date.now()+60000||leases.length||jobs.length||pending.length)throw Error('Exclusive checkpoint expired or source active; no upload');
          const beforeHash=await moduleHash();const old=allocation.deployments[0];
          if(old.versions.length!==1||old.versions[0].percentage!==100)throw Error('Mixed runner allocation');
          if(beforeHash!==expectedHash){
          if(old.versions[0].version_id!==expectedOld||beforeHash!=='f2e91c02c9242403f511bdcf90fa90f77fedda04cd6f62653745e30a171e2445')throw Error('Unexpected runner drift');
          await cf(script+'/versions/'+expectedOld);
          if(settings.compatibility_date!=='2026-09-25'||!settings.compatibility_flags.includes('nodejs_compat')||settings.bindings.find(b=>b.name==='DB')?.id!==database||!settings.bindings.some(b=>b.type==='secret_text'&&b.name==='VIGIA_SYNC_TOKEN'))throw Error('Settings changed');
          const module=gunzipSync(Buffer.from('','base64'));
          if(crypto.createHash('sha256').update(module).digest('hex')!==expectedHash)throw Error('Artifact hash mismatch');
          const form=new FormData();form.set('metadata',new Blob([JSON.stringify({main_module:'source-runner.mjs',compatibility_date:settings.compatibility_date,compatibility_flags:settings.compatibility_flags,limits:settings.limits,observability:settings.observability,keep_bindings:['secret_text'],bindings:settings.bindings.filter(b=>b.type!=='secret_text'),annotations:{'workers/message':'sr271-rasff60-capacity:c0bf3b0e07dbc9d237a05fe7373baa12a81412f4','workers/tag':'sr271-c0bf3b0e07dbc9d2'}})],{type:'application/json'}));form.set('source-runner.mjs',new Blob([module],{type:'application/javascript+module'}),'source-runner.mjs');
          report('R11_UPLOAD_INTENT',{at:new Date().toISOString(),rollback:expectedOld,hash:expectedHash,onePutOnly:true});
          try{const r=await fetch(root+script,{method:'PUT',headers:{Authorization:'Bearer '+process.env.CF_TOKEN},body:form,signal:AbortSignal.timeout(25000)}),p=await r.json();report('R11_UPLOAD_RESPONSE',{http:r.status,success:p.success,result:p.success?{id:p.result.id,etag:p.result.etag}:undefined,errors:p.errors});}catch(e){report('R11_UPLOAD_TRANSPORT_UNCONFIRMED',{name:e.name,readMarkerOnly:true});}
          }
          const after=await cf(script+'/deployments'),version=await cf(script+'/versions/'+after.deployments[0].versions[0].version_id),afterHash=await moduleHash(),afterSettings=await cf(script+'/settings'),subdomain=await cf(script+'/subdomain'),schedules=await cf(script+'/schedules');
          if(after.deployments[0].versions.length!==1||after.deployments[0].versions[0].percentage!==100||afterHash!==expectedHash||!afterSettings.bindings.some(b=>b.type==='secret_text'&&b.name==='VIGIA_SYNC_TOKEN')||afterSettings.bindings.find(b=>b.name==='DB')?.id!==database||subdomain.enabled||subdomain.previews_enabled||schedules.schedules?.length)throw Error('Runner upload verification failed; no repeat');
          report('R11_UPLOAD_VERIFIED',{at:new Date().toISOString(),allocation:after.deployments[0],version:version.id,number:version.number,hash:afterHash,rollback:expectedOld,secretPreserved:true,private:true,noCron:true});
          try{await query('UPDATE source_reliability_control SET owner_id=NULL,expires_at=NULL WHERE id=1 AND owner_id=? AND epoch=?',[owner,epoch]);}catch(e){report('R10_RELEASE_UNCONFIRMED',{name:e.name});}
          const released=(await query('SELECT owner_id,epoch,expires_at FROM source_reliability_control WHERE id=1')).results[0];if(released.owner_id===owner)throw Error('Own lease remains; do not repeat upload');report('R11_UPLOAD_COMPLETE',{at:new Date().toISOString(),released,sourceEffectsNotReplayed:true});
          NODE
