name: V24 RAPNA 313 Cloudflare build and drift audit once
on:
  push:
    branches: [audit/v24-rapna313-build-and-drift-20261012]
    paths: [.github/workflows/v24-rapna-build-drift-once.yml]
permissions: {contents: read}
jobs:
  audit:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: GET build logs and SELECT-only post-cycle drift
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VIGIA_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const emit=(stage,x)=>console.log('V24_313_DIAG '+JSON.stringify({stage,...x}));
          const account='9c1807c68493f14259248b5f5782cc6f',database='55596003-1b90-4f66-aad8-decb21205f13';
          const cf='https://api.cloudflare.com/client/v4/accounts/'+account,origin='https://vigia-runtime.c-gamiz93.workers.dev';
          const id='6af1c17c-0bba-451f-b8de-fdda79ed7185',T=process.env.VIGIA_TOKEN,CF=process.env.CF_TOKEN;
          if(!T||!CF){emit('verdict',{status:'HOLD_MISSING_EXISTING_TOKEN'});process.exit(2)}
          const allowed=new Set([origin+'/api/source-reliability?observe=1',origin+'/api/rapna/sync?observe=1',
            cf+'/builds/builds/'+id,cf+'/builds/builds/'+id+'/logs',cf+'/d1/database/'+database,cf+'/d1/database/'+database+'/query']);
          let n=0,rowsRead=0;
          async function req(url,token,sql=null){
            if(!allowed.has(url)||++n>6)throw Error('READ_URL_OR_BUDGET');
            if(sql&&(!/^SELECT\s/u.test(sql)||sql.includes(';')||/\b(DELETE|UPDATE|INSERT|ALTER|DROP|PRAGMA|CREATE|REPLACE)\b/iu.test(sql)))throw Error('SQL_NOT_SELECT');
            try{const r=await fetch(url,{method:sql?'POST':'GET',headers:{Authorization:'Bearer '+token,Accept:'application/json',...(sql?{'Content-Type':'application/json'}:{})},...(sql?{body:JSON.stringify({sql})}:{}),redirect:'error',signal:AbortSignal.timeout(16000)});
              const j=await r.json().catch(()=>null);return {http:r.status,json:j};}
            catch(e){return {http:0,json:null,error:e instanceof Error?e.name:'fetch-error'};}
          }
          const [c,rapna,build,logs,db]=await Promise.all([
            req(origin+'/api/source-reliability?observe=1',T),req(origin+'/api/rapna/sync?observe=1',T),
            req(cf+'/builds/builds/'+id,CF),req(cf+'/builds/builds/'+id+'/logs',CF),
            req(cf+'/d1/database/'+database,CF)]);
          const buildInfo=build.json?.result||{};
          const list=(logs.json?.result?.lines||[]).map(v=>Array.isArray(v)?v.map(x=>String(x)).join(' '):String(v));
          const classify=(line)=>{
            const s=line.toLowerCase();
            if(/minutes|quota|billing|credit/.test(s)&&/exceed|limit|spent|fail|error/.test(s))return 'BILLING_OR_QUOTA';
            if(/oom|out of memory|memory limit|allocation/.test(s))return 'MEMORY';
            if(/timeout|timed out|time limit/.test(s))return 'TIMEOUT';
            if(/npm error|npm err|dependency|package-lock/.test(s))return 'DEPENDENCY';
            if(/wrangler|deploy|upload|preview/.test(s)&&/fail|error|exception/.test(s))return 'DEPLOY_OR_WRANGLER';
            if(/typescript|typecheck|ts\d{4}/.test(s)&&/fail|error/.test(s))return 'TYPECHECK';
            if(/git clone|checkout|source commit/.test(s)&&/fail|error/.test(s))return 'CHECKOUT';
            if(/failed|failure|fatal|error/.test(s))return 'GENERIC_ERROR';
            return null;
          };
          const hits=list.map((line,i)=>({i,class:classify(line)})).filter(x=>x.class).slice(-35);
          const classes=[...new Set(hits.map(x=>x.class))];
          emit('build',{http:build.http,logsHttp:logs.http,status:buildInfo.status??null,outcome:buildInfo.build_outcome??null,
            buildTime:buildInfo.build_time_ms??null,branch:buildInfo.build_trigger_metadata?.branch??null,
            commit:buildInfo.build_trigger_metadata?.commit_hash?.slice(0,12)??null,logCount:list.length,
            logTruncated:logs.json?.result?.truncated??null,errorClasses:classes,lastErrorIndices:hits.slice(-12)});
          const okBaseline=c.http===200&&c.json?.buildSha==='d5fcd11cbeb563258b4bbdc9482a80b8684c81d3'&&
            rapna.http===200&&db.http===200&&db.json?.result?.uuid===database;
          if(!okBaseline){emit('verdict',{status:'HOLD_BASELINE',requestCount:n,queries:0,sourceWrites:0});process.exit(2);}
          const sql="SELECT COUNT(*) AS checks,COALESCE(SUM(CASE WHEN changed_count>0 THEN 1 ELSE 0 END),0) AS changedChecks,COALESCE(SUM(changed_count),0) AS changedAlerts,MAX(checked_at) AS latestChecked,MIN(CASE WHEN changed_count>0 THEN checked_at END) AS firstChanged FROM source_checks WHERE source='RAPNA' AND checked_at>'2026-10-12T00:09:09.851Z'";
          const drift=await req(cf+'/d1/database/'+database+'/query',CF,sql);
          const result=drift.json?.result?.[0],row=result?.results?.[0],isRead=drift.http===200&&drift.json?.success===true&&result?.meta?.rows_written===0;
          emit('drift',{http:drift.http,validSelect:isRead,rowsRead:result?.meta?.rows_read??null,rowsWritten:result?.meta?.rows_written??null,
            checks:row?.checks??null,changedChecks:row?.changedChecks??null,changedAlerts:row?.changedAlerts??null,
            firstChanged:row?.firstChanged??null,latestChecked:row?.latestChecked??null,
            rapnaCurrentStatus:rapna.json?.currentParity?.status??null,
            rapnaCurrentCertificateMatches:rapna.json?.currentParity?.completedAt===rapna.json?.currentRevisionCertification?.completedAt,
            strongHistoricalEquivalenceProved:false});
          emit('verdict',{status:isRead?'PASS_OBSERVATION':'HOLD',readCalls:n,d1Selects:1,d1Writes:0,
            sourceJobs:0,deploys:0,runnerChanges:0,noBuildTrigger:true});
          if(!isRead)process.exitCode=1;
          NODE
