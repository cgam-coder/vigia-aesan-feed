name: TEMP UI-F1A XCTest native navigation and single tap
# Owner-authorized isolated public-page/localhost probes. DO NOT MERGE. Remove after recovery.
"on":
  push:
    branches: [diag/ui-f1a-ios-simulator-20261001]
    paths:
      - .diagnostics/neutral_xctest_only.py
      - .diagnostics/neutral_xctest_project.rb
      - .github/workflows/ui-f1a-ios-simulator-once.yml
permissions:
  contents: read
concurrency:
  group: ui-f1a-ios-simulator-viability-${{ github.ref }}
  cancel-in-progress: false
jobs:
  neutral-xctest:
    if: >-
      github.repository == 'cgam-coder/vigia-aesan-feed' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/diag/ui-f1a-ios-simulator-20261001' &&
      github.run_attempt == '1'
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Checkout reviewed public diagnostics and original security contracts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .diagnostics
            .github/workflows
            security-checks
      - name: Verify exact harness pins, negative security checks and offline classifiers
        id: security
        run: |
          echo '27e5e20180ad4f5c63ee2e3f3792770da58f4012f521e79c89c83ca269bafd19  .diagnostics/neutral_xctest_only.py' | shasum -a 256 -c -
          echo '72a74dfe470d93340e72c0c6e6e6872a0c3231d203f27a45819b66bca19f35b8  .diagnostics/native_input_theme.py' | shasum -a 256 -c -
          echo '498f0739b56fc6b99ef3f7de3830434f56549aa1fd3828742b9cf2b9efeaab3b  .diagnostics/neutral_xctest_project.rb' | shasum -a 256 -c -
          echo '52b63de8b3e2721b667e151072292a60aaab2a0a876cb8110ed71080a4192afb  .diagnostics/ios_safari_smoke.py' | shasum -a 256 -c -
          node --test security-checks/workflow-security.test.mjs
          python3 .diagnostics/neutral_xctest_only.py --self-test
      - name: One native XCTest tap on neutral control without SafariDriver
        run: python3 .diagnostics/neutral_xctest_only.py
      - name: Recover only explicit neutral and public Preview evidence
        if: always() && steps.security.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: neutral-xctest-${{ github.run_id }}
          path: |
            neutral-xctest-evidence/report.json
            neutral-xctest-evidence/xctest-neutral-before-native.png
            neutral-xctest-evidence/xctest-neutral-after-native.png
            neutral-xctest-evidence/neutral-xctest-before.png
            neutral-xctest-evidence/neutral-xctest-after.png
            neutral-xctest-evidence/final-native.png
            neutral-xctest-evidence/neutral-safari-foreground.png
            neutral-xctest-evidence/neutral-navigation-before.png
            neutral-xctest-evidence/neutral-navigation-after.png
            neutral-xctest-evidence/neutral-xctest-final.png
            neutral-xctest-evidence/xcresult-summary.json
            neutral-xctest-evidence/xcresult-tests.json
            neutral-xctest-evidence/xctest-states.json
            neutral-xctest-evidence/build.log
            neutral-xctest-evidence/test.log
            neutral-xctest-evidence/neutral-safari-foreground.png
            neutral-xctest-evidence/neutral-navigation-before.png
            neutral-xctest-evidence/neutral-navigation-after.png
            neutral-xctest-evidence/neutral-xctest-final.png
            neutral-xctest-evidence/xcresult-summary.json
            neutral-xctest-evidence/xcresult-tests.json
            neutral-xctest-evidence/xctest-states.json
            neutral-xctest-evidence/build.log
            neutral-xctest-evidence/test.log
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
