name: TEMP UI-F1A product native interactions after calibration PASS
# Owner-authorized isolated public-page/localhost probes. DO NOT MERGE. Remove after recovery.
"on":
  push:
    branches: [diag/ui-f1a-ios-simulator-20261001]
    paths:
      - .diagnostics/product_ui_only.py
      - .diagnostics/product_ui_project.rb
      - .diagnostics/recover_product_attachments.py
      - .diagnostics/test_recover_product_attachments.py
      - .github/workflows/ui-f1a-ios-simulator-once.yml
permissions:
  contents: read
concurrency:
  group: ui-f1a-ios-simulator-viability-${{ github.ref }}
  cancel-in-progress: false
jobs:
  product-xctest:
    if: >-
      github.repository == 'cgam-coder/vigia-aesan-feed' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/diag/ui-f1a-ios-simulator-20261001' &&
      github.run_attempt == '1'
    runs-on: macos-15
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Checkout reviewed public diagnostics and original security contracts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .diagnostics
            .github/workflows
            security-checks
      - name: Verify exact harness pins, negative security checks and offline classifiers
        id: security
        run: |
          echo '227d5cfd2f8a65bfbb3052c6eb31f8ffa92e4471d2aa80788f6a8fb2502f10ec  .diagnostics/product_ui_only.py' | shasum -a 256 -c -
          echo 'd6bcb32b19bd7078ee62efab8a7bd9d2cbc25b3d41240ce84dd5283bb24d189b  .diagnostics/product_ui_project.rb' | shasum -a 256 -c -
          echo '1f1b25119c9b22ae498cc291527bea4845e92698a31c76dfe2ca27c7c306dec7  .diagnostics/recover_product_attachments.py' | shasum -a 256 -c -
          echo '9ec0cb3ace1a9c8265d8b3879342e94a359ce2646c94bc04b812281a19eb8e05  .diagnostics/test_recover_product_attachments.py' | shasum -a 256 -c -
          ruby -c .diagnostics/product_ui_project.rb
          python3 -m unittest discover -s .diagnostics -p test_recover_product_attachments.py -v
          python3 -m py_compile .diagnostics/product_ui_only.py
          node --test security-checks/workflow-security.test.mjs
      - name: One native product XCTest block without calibration or SafariDriver
        run: python3 .diagnostics/product_ui_only.py
      - name: Enforce bounded reviewed evidence before upload
        id: evidence_size
        if: always() && steps.security.outcome == 'success'
        run: |
          python3 -c "from pathlib import Path; p=Path('product-xctest-evidence'); assert p.exists(); assert sum(x.stat().st_size for x in p.iterdir() if x.is_file()) <= 24000000, 'Evidence size ceiling exceeded'"
      - name: Recover only explicit public Preview product evidence
        if: always() && steps.security.outcome == 'success' && steps.evidence_size.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: product-xctest-${{ github.run_id }}
          path: |
            product-xctest-evidence/report.json
            product-xctest-evidence/xcresult-tests.json
            product-xctest-evidence/xctest-states.json
            product-xctest-evidence/build.log
            product-xctest-evidence/test.log
            product-xctest-evidence/manifest.original.json
            product-xctest-evidence/export-inventory.json
            product-xctest-evidence/product-export-reviewed.zip
            product-xctest-evidence/recovery-report.json
            product-xctest-evidence/export-help.txt
            product-xctest-evidence/export-output.txt
            product-xctest-evidence/upload-integrity.json
            product-xctest-evidence/product-consent-before.png
            product-xctest-evidence/product-consent-before.jpg
            product-xctest-evidence/product-consent-after.png
            product-xctest-evidence/product-consent-after.jpg
            product-xctest-evidence/product-theme-before.png
