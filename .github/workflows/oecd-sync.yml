name: VIGÍA OECD WORK20Q-E dry-run diagnosis

on:
  push:
    branches:
      - work/20q-e-oecd-preflight
    paths:
      - .github/workflows/oecd-sync.yml

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VIGIA_OECD_SYNC_URL: https://vigia-alertas.csar68.chatgpt.site/api/oecd/sync
      VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
    steps:
      - name: Capture production dry-run response
        shell: bash
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/oecd-dry-run.json"
          http_code="$(curl --silent --show-error --location \
            --request POST --header "Authorization: Bearer $VIGIA_SYNC_TOKEN" \
            --max-time 840 --output "$response_file" --write-out '%{http_code}' \
            "$VIGIA_OECD_SYNC_URL?mode=dry-run")"
          echo "HTTP_STATUS=$http_code"
          jq -c . "$response_file"
          test "$http_code" = "200"
