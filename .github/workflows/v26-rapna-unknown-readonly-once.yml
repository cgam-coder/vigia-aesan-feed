name: V26 RAPNA UNKNOWN strict metadata readiness read-only one-shot
on:
  push:
    branches: [audit/v26-rapna-unknown-readiness-20261012]
    paths: [.github/workflows/v26-rapna-unknown-readonly-once.yml]
permissions:
  contents: read
jobs:
  observe:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      T: ${{ secrets.VIGIA_SYNC_TOKEN }}
      CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Six exact GETs and four bounded SELECT-only D1 statements
        shell: bash
        run: |
          node <<'NODE'
          (async()=>{
            const jobid='ab50d0f7-0ad7-4fb5-8078-f6c376aa8f53';
            const root='https://vigia-runtime.c-gamiz93.workers.dev';
            const base='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f';
            const id='55596003-1b90-4f66-aad8-decb21205f13';
            const t=process.env.T||'',cf=process.env.CF||'';
            if(!t||!cf)throw Error('EXISTING_SECRET_UNAVAILABLE');
            const urls=[
              ['fresh',root+'/api/freshness?observe=1',t],
              ['coordinator',root+'/api/source-reliability?observe=1',t],
              ['runner',base+'/workers/scripts/vigia-source-runner/deployments',cf],
              ['runnerSettings',base+'/workers/scripts/vigia-source-runner/settings',cf],
              ['runtime',base+'/workers/scripts/vigia-runtime/deployments',cf],
              ['d1',base+'/d1/database/'+id,cf]
            ];
            let gets=0,selects=0,rowsRead=0,rowsWritten=0;
            const request=async(url,token,sql=null,params=[])=>{
              if(sql===null){
                if(!urls.some(x=>x[1]===url)||++gets>6)throw Error('GET_POLICY');
              }else{
                if(url!==base+'/d1/database/'+id+'/query'||++selects>4||
                  !/^SELECT\s/iu.test(sql)||sql.includes(';')||
                  /\b(INSERT|UPDATE|DELETE|DROP|ALTER|ATTACH|PRAGMA|VACUUM|REPLACE|CREATE)\b/iu.test(sql))throw Error('D1_SELECT_ONLY_POLICY');
              }
              const r=await fetch(url,{method:sql===null?'GET':'POST',redirect:'error',
                headers:{Authorization:'Bearer '+token,Accept:'application/json',
                  ...(sql===null?{}:{'Content-Type':'application/json'})},
                ...(sql===null?{}:{body:JSON.stringify({sql,params})}),
                signal:AbortSignal.timeout(15000)});
              const raw=await r.text();
              const body=raw.length<1300000?JSON.parse(raw):null;
              return {http:r.status,success:body?.success===true,result:body?.result||null,raw:sql===null&&url.startsWith(root)?body:null,
                codes:(body?.errors||[]).map(x=>x.code).slice(0,3)};
            };
            const values=Object.fromEntries(await Promise.all(urls.map(async([k,url,token])=>[k,await request(url,token)])));
            const code=(name)=>values[name].http;
            const owner=values.coordinator.raw||{};
            const f=values.fresh.raw||{};
            const state=owner.state||{};
            const statements=[
              ['job',"SELECT id,source,mode,phase,epoch,started_at,json_extract(receipt_json,'$.outcome') AS outcome,json_extract(receipt_json,'$.reason') AS reason FROM source_reliability_jobs WHERE id=? LIMIT 1",[jobid]],
              ['recoveryPlan','SELECT old_job_id FROM source_reliability_recovery_plans WHERE old_job_id=? LIMIT 1',[jobid]],
              ['recoveryReceipt','SELECT old_job_id FROM source_reliability_recoveries WHERE old_job_id=? LIMIT 1',[jobid]],
              ['successor',"SELECT COUNT(*) AS n FROM source_reliability_jobs WHERE source='RAPNA' AND mode='current-parity' AND id<>? AND started_at>=(SELECT started_at FROM source_reliability_jobs WHERE id=? LIMIT 1)",[jobid,jobid]]
            ];
            const info={};
            for(const [k,sql,params] of statements){
              const z=await request(base+'/d1/database/'+id+'/query',cf,sql,params);
              const q=z.result?.[0];
              if(z.http!==200||!z.success||!Array.isArray(q?.results)||q.meta?.rows_written!==0)
                throw Error('D1_READ_HOLD_'+k+'_'+z.http);
              rowsRead+=Number(q.meta?.rows_read||0);rowsWritten+=Number(q.meta?.rows_written||0);
              info[k]=q.results;
              if(rowsRead>3000||rowsWritten!==0)throw Error('D1_BUDGET_EXCEEDED');
            }
            const deployed=x=>x.result?.deployments||[];
            const active=x=>deployed(x)[0]?.versions?.find(z=>z.percentage===100)?.version_id||'';
            const bindings=values.runnerSettings.result?.bindings||[];
            const job=info.job[0]||{},next=Number(info.successor[0]?.n);
            const identity={
              cloudflareHttp:Object.fromEntries(urls.slice(2).map(([name])=>[name,code(name)])),
              runtimeHttp:{fresh:code('fresh'),coordinator:code('coordinator')},
              fiveRecentHealthy:['AESAN','RAPNA','RASFF','SAFETY GATE','OECD'].every(n=>{
                const z=(f.states||[]).find(v=>v.source===n);
                const age=x=>typeof x==='string'&&Number.isFinite(Date.parse(x))?(Date.now()-Date.parse(x))/60000:null;
                const a=age(z?.lastSyncSuccessAt),p=age(z?.checkedAt);
                return a!==null&&a>=0&&a<=45&&p!==null&&p>=0&&p<=45&&z?.latestIdentityParity===true&&
                  (z?.missingOfficialIdentities||[]).length===0&&(z?.revisionMismatches||[]).length===0
              }),
              noCoordinatorLease:owner.activeLease===false,
              coordinatorShaExpected:owner.buildSha==='d5fcd11cbeb563258b4bbdc9482a80b8684c81d3',
              originalAttemptStillUnknown:state.revisionAttempts?.['RAPNA:current-parity']?.outcome==='unknown'&&
                state.revisionAttempts?.['RAPNA:current-parity']?.id===jobid,
              runnerActive:active(values.runner).slice(0,12),runtimeActive:active(values.runtime).slice(0,12),
              d1Correct:values.d1.result?.uuid===id||values.d1.result?.id===id,
              runnerD1Correct:bindings.some(x=>x.name==='DB'&&x.id===id),
              runnerModeActive:bindings.some(x=>x.name==='SOURCE_RUNNER_MODE'&&x.text==='active'),
              secretPresent:bindings.some(x=>x.name==='VIGIA_SYNC_TOKEN'),
              jobOutcome:job.outcome||null,jobReason:job.reason||null,jobPhase:job.phase||null,
              recoveryPlanExists:info.recoveryPlan.length>0,
              recoveryReceiptExists:info.recoveryReceipt.length>0,
              successorCount:Number.isSafeInteger(next)?next:null,
              fetchedAt:new Date().toISOString(),
              GETs:gets,SELECTs:selects,rowsRead,rowsWritten,
              sourceJobs:0,writeOps:0,deployments:0
            };
            identity.partialPass=identity.fiveRecentHealthy&&identity.noCoordinatorLease&&identity.coordinatorShaExpected&&identity.originalAttemptStillUnknown&&
              identity.runnerActive.startsWith('92273d27')&&identity.runtimeActive.startsWith('2914305e')&&
              identity.d1Correct&&identity.runnerD1Correct&&identity.runnerModeActive&&identity.secretPresent&&
              job.outcome==='unknown'&&job.reason==='RELIABILITY_BUDGET_EXHAUSTED'&&
              job.phase==='finished'&&!identity.recoveryPlanExists&&!identity.recoveryReceiptExists&&next===0;
            console.log('V26_UNKNOWN_READINESS '+JSON.stringify(identity));
            if(!identity.partialPass)process.exitCode=2;
          })().catch(e=>{console.log('V26_UNKNOWN_READINESS '+JSON.stringify({state:'HOLD',reason:String(e.message||e.name).slice(0,85),noWrites:true}));process.exitCode=2});
          NODE
