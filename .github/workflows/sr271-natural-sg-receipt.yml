name: SR271 natural Safety Gate recovery durable SELECT-only receipt proof
on:
  push:
    branches: [source-reliability/recovery-snapshot-20261009]
    paths: [.github/workflows/sr271-natural-sg-receipt.yml, ops/sr271-natural-sg-receipt.mjs]
permissions:
  contents: read
jobs:
  inspect:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
          CHECKPOINT_AT: 2026-10-09T11:14:00.000Z
          RUN_ATTEMPT: ${{ github.run_attempt }}
          FINAL_CHECKPOINT: 'false'
        run: |
          node --input-type=module -e "while(Date.now()<Date.parse('2026-10-09T11:14:00Z'))await new Promise(r=>setTimeout(r,5000))"
          node ops/sr271-natural-sg-receipt.mjs
