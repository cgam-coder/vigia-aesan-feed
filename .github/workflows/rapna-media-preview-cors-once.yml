name: RAPNA-MEDIA-F1 preview-origin CORS one-shot
on:
  push:
    branches: [sec-f1/cloudflare-api-readonly-20261009]
    paths: [.github/workflows/rapna-media-preview-cors-once.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Verify official response authorizes preview origin without saving media
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const origin='https://rapna-media-f1-direct-cors-proof-20261010-vigia-runtime.c-gamiz93.workers.dev';
          const url='https://servicios.consumo.gob.es/rapnaBEPublic/listadoPublico/fichero';
          const output=(x)=>console.log('RAPNA_PREVIEW_CORS '+JSON.stringify(x));
          try{
            const pre=await fetch(url,{method:'OPTIONS',headers:{Origin:origin,
              'Access-Control-Request-Method':'POST','Access-Control-Request-Headers':'content-type'},
              redirect:'error',signal:AbortSignal.timeout(12000)});
            const acao=pre.headers.get('access-control-allow-origin');
            const methods=pre.headers.get('access-control-allow-methods')??'';
            const headers=pre.headers.get('access-control-allow-headers')??'';
            const allowed=pre.ok&&(acao==='*'||acao===origin)&&methods.toUpperCase().split(/[ ,]+/).includes('POST') &&
              (headers==='*'||headers.toLowerCase().split(/[ ,]+/).includes('content-type'));
            output({phase:'preflight',http:pre.status,allowed_origin:acao==='*'||acao===origin,allowed_post:methods.toUpperCase().split(/[ ,]+/).includes('POST'),allowed_content_type:headers==='*'||headers.toLowerCase().split(/[ ,]+/).includes('content-type'),cors_valid:allowed});
            if(!allowed)process.exit();
            const response=await fetch(url,{method:'POST',headers:{Origin:origin,Accept:'application/json','Content-Type':'application/json'},
              body:JSON.stringify({document:'159_2026_Fotografía_web.jpg',notificacion:84341,type:'IMG',fichaWeb:true}),
              redirect:'error',signal:AbortSignal.timeout(12000)});
            const ac=response.headers.get('access-control-allow-origin');
            output({phase:'actual',http:response.status,allowed_origin:ac==='*'||ac===origin,json_response:/^application\/json(?:\s*;|$)/i.test(response.headers.get('content-type')??'')});
            await response.body?.cancel().catch(()=>{});
          }catch(e){output({outcome:'request_failed',type:e?.name??'Error'});}
          NODE
