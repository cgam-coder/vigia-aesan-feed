name: TEMP RAPNA CURRENT snapshot V2 validation

on:
  pull_request:
    branches: [main]
    types: [opened]

permissions:
  contents: read

concurrency:
  group: work-20q-c3s-rapna-current-snapshot-v2
  cancel-in-progress: false

jobs:
  rapna-current-snapshot-v2:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      github.head_ref == 'work/20q-c3s-rapna-current-snapshot-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Build and verify one RAPNA CURRENT V2 snapshot
        env:
          VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test -n "${VIGIA_SYNC_TOKEN}"

          endpoint="https://nagamealert.com/api/rapna/sync"
          report_dir="${RUNNER_TEMP}/work20q-c3s"
          mkdir -p "${report_dir}"

          request() {
            local label="$1"
            local method="$2"
            local query="$3"
            local expected="$4"
            local with_auth="${5:-yes}"
            local headers=()
            if [ "${with_auth}" = "yes" ]; then
              headers+=(--header "Authorization: Bearer ${VIGIA_SYNC_TOKEN}")
            fi
            local metrics code elapsed
            metrics="$(curl --silent --show-error --location --request "${method}" --max-time 900 \
              "${headers[@]}" --output "${report_dir}/${label}.json" --write-out '%{http_code} %{time_total}' \
              "${endpoint}?${query}")"
            code="${metrics%% *}"
            elapsed="${metrics#* }"
            case ",${expected}," in
              *,${code},*) ;;
              *) echo "${label}: unexpected HTTP ${code}; expected ${expected}" >&2; return 1 ;;
            esac
            echo "WORK20Q_C3S_REQUEST label=${label} http=${code} seconds=${elapsed}"
          }

          request snapshot-unauthenticated POST 'mode=current-snapshot&batchSize=25' 401 no
          request replay-unauthenticated POST 'mode=current-replay' 401 no
          request rollback-unauthenticated POST 'mode=current-rollback' 401 no
          request preflight POST 'mode=preflight' 200

          for attempt in $(seq 1 30); do
            request observe-pre GET 'observe=1' 200
            lease_present="$(node -e 'const b=require(process.argv[1]);process.stdout.write(b.lease===null?"no":"yes")' "${report_dir}/observe-pre.json")"
            [ "${lease_present}" = "no" ] && break
            echo "WORK20Q_C3S_LEASE_WAIT attempt=${attempt}"
            sleep 15
          done

          request pre-audit GET 'audit=1' 200
          node - "${report_dir}" <<'NODE'
          const fs=require("node:fs"), path=require("node:path");
          const dir=process.argv[2];
          const read=(name)=>JSON.parse(fs.readFileSync(path.join(dir,name+".json"),"utf8"));
          const observe=read("observe-pre"), audit=read("pre-audit").audit;
          if(observe.lease!==null) throw new Error("RAPNA lease remained active");
          if(observe.currentReplay!==null) throw new Error("currentReplay already exists");
          if(observe.currentSnapshot!==null) throw new Error("A RAPNA CURRENT V2 manifest already exists");
          if(observe.recent?.status==="running"||observe.backfill?.status==="running") throw new Error("RAPNA sync is running");
          if(audit.counts.rapnaAlerts!==2567||audit.counts.rapnaUniqueReferences!==2567) throw new Error("RAPNA total drift");
          if(Object.values(audit.integrity).some((value)=>Number(value)!==0)) throw new Error("RAPNA integrity drift");
          console.log("WORK20Q_C3S_PREFLIGHT "+JSON.stringify({
            lease:observe.lease,currentReplay:observe.currentReplay,currentSnapshot:observe.currentSnapshot,
            counts:audit.counts,integrity:audit.integrity,logicalStorage:audit.logicalStorage,
            previousSnapshot:observe.snapshot,sourceChecks:observe.controlFingerprint?.sourceChecks
          }));
          NODE

          for year in 2021 2022 2023 2024 2025 2026; do
            request "dryrun-${year}" POST "mode=current-dry-run&year=${year}" 200
          done
          node - "${report_dir}" <<'NODE'
          const fs=require("node:fs"),path=require("node:path");
          const dir=process.argv[2],years=[2021,2022,2023,2024,2025,2026];
          const bodies=years.map((year)=>JSON.parse(fs.readFileSync(path.join(dir,"dryrun-"+year+".json"),"utf8")));
          if(bodies.some((body)=>body.zeroWrite?.verified!==true)) throw new Error("Dry-run is not zero-write");
          const reports=bodies.map((body)=>body.report),sum=(key)=>reports.reduce((total,item)=>total+Number(item[key]||0),0);
          const exact={incomingRecords:1480,storedMatches:1480,missingStored:0,storedNotPresentIncoming:0,
            ghostExpansionRepair:1357,pluralLabelRepair:102,observationRefresh:1,sourceRecordMetadataRefresh:123,
            metadataRefreshDetected:1479,genuineSemanticChange:0,unexpected:0,invalidRecords:0,duplicateRecords:0};
          for(const [key,value] of Object.entries(exact)) if(sum(key)!==value) throw new Error("C2 drift "+key+"="+sum(key));
          console.log("WORK20Q_C3S_DRYRUN "+JSON.stringify(exact));
          NODE

          request observe-before-build GET 'observe=1' 200
          node - "${report_dir}/observe-before-build.json" <<'NODE'
          const b=require(process.argv[2]);
          if(b.lease!==null||b.currentReplay!==null||b.currentSnapshot!==null) throw new Error("Pre-build state drift");
          NODE

          snapshot_id=""
          previous=0
          completed="false"
          for step in $(seq 1 80); do
            if [ -z "${snapshot_id}" ]; then
              query='mode=current-snapshot&batchSize=25'
            else
              query="mode=current-snapshot&snapshotId=${snapshot_id}&batchSize=25"
            fi
            request "snapshot-${step}" POST "${query}" 200,202
            values="$(node - "${report_dir}/snapshot-${step}.json" "${snapshot_id}" "${previous}" <<'NODE'
          const body=require(process.argv[2]),expected=process.argv[3],previous=Number(process.argv[4]);
          if(!body.snapshotId||body.formatVersion!==2||body.purpose!=="pre-current-replay") throw new Error("Invalid V2 response");
          if(expected&&body.snapshotId!==expected) throw new Error("snapshotId changed");
          if(body.processedCount<previous||body.processedCount-previous>25) throw new Error("Invalid bounded progress");
          if(body.sourceAlertCount!==body.processedCount||body.totalEstimated!==1480) throw new Error("Invalid CURRENT counts");
          if(body.completed&&body.status!=="ready") throw new Error("Completed snapshot is not READY");
          if(!body.completed&&body.status!=="building") throw new Error("Incomplete snapshot is not BUILDING");
          process.stdout.write([body.snapshotId,body.processedCount,String(body.completed),body.status,body.chunkCount,body.versionCount].join(" "));
          NODE
          )"
            read -r snapshot_id previous completed status chunk_count version_count <<< "${values}"
            echo "WORK20Q_C3S_STEP step=${step} snapshotId=${snapshot_id} processed=${previous} status=${status} chunks=${chunk_count} versions=${version_count}"
            [ "${completed}" = "true" ] && break
          done
          [ "${completed}" = "true" ]

          request snapshot-verify POST "mode=current-snapshot-verify&snapshotId=${snapshot_id}" 200
          request observe-after GET 'observe=1' 200
          request audit-after GET 'audit=1' 200
          node - "${report_dir}" "${snapshot_id}" <<'NODE'
          const fs=require("node:fs"),path=require("node:path");
          const dir=process.argv[2],snapshotId=process.argv[3];
          const read=(name)=>JSON.parse(fs.readFileSync(path.join(dir,name+".json"),"utf8"));
          const verify=read("snapshot-verify").verification,observe=read("observe-after"),before=read("pre-audit").audit,after=read("audit-after").audit;
          if(!verify||verify.snapshotId!==snapshotId||verify.status!=="ready"||verify.purpose!=="pre-current-replay"||
              verify.formatVersion!==2||verify.sourceAlertCount!==1480||verify.sourceMatches!==true) throw new Error("V2 verify failed");
          if(observe.lease!==null||observe.currentReplay!==null) throw new Error("Snapshot left lease/replay state");
          if(observe.currentSnapshot?.snapshotId!==snapshotId||observe.currentSnapshot?.status!=="ready"||
              observe.currentSnapshot?.sourceAlertCount!==1480||observe.currentSnapshot?.completed!==true) throw new Error("Observe V2 mismatch");
          for(const key of ["alerts","rapnaAlerts","rapnaUniqueReferences","rapnaVersions","rapnaVersionCountSum"]){
            if(before.counts[key]!==after.counts[key]) throw new Error("Alert/version write detected: "+key);
          }
          console.log("WORK20Q_C3S_FINAL "+JSON.stringify({
            snapshotId,status:verify.status,purpose:verify.purpose,formatVersion:verify.formatVersion,
            current:verify.sourceAlertCount,legacyCaptured:0,versions:verify.versionCount,chunks:verify.chunkCount,
            checksum:verify.checksum,sourceDataChecksum:verify.sourceDataChecksum,sourceMatches:verify.sourceMatches,
            alertsUnchanged:true,currentReplay:observe.currentReplay,lease:observe.lease,logicalStorage:before.logicalStorage
          }));
          NODE

          echo "WORK20Q_C3S_DECISION GO — RAPNA CURRENT SNAPSHOT V2 READY — C3 MAY RESUME WITHOUT REPLAY EXECUTED"
