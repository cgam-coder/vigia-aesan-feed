name: V22 F1-COST D1 weekly baseline comparison (read-only)
on:
  push:
    branches: [audit/v22-f1-cost-week-compare-20261011]
    paths: [.github/workflows/v22-f1-cost-d1-weeks-readonly-once.yml]
permissions: { contents: read }
concurrency:
  group: v22-f1-cost-week-compare
  cancel-in-progress: false
jobs:
  metrics:
    if: github.repository == 'cgam-coder/vigia-aesan-feed' && github.actor == 'cgam-coder' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read one D1 Analytics time-series only, no mutation
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CF_TOKEN;
          const account='9c1807c68493f14259248b5f5782cc6f',db='55596003-1b90-4f66-aad8-decb21205f13';
          const output=o=>console.log('V22_F1_COST '+JSON.stringify(o));
          if(!token){output({state:'HOLD',reason:'token-unavailable'});process.exitCode=1;process.exit();}
          const query='query D1Metrics($accountTag: string!, $db: string, $from: Date, $to: Date) { viewer { accounts(filter: {accountTag: $accountTag}) { d1AnalyticsAdaptiveGroups(limit: 30, filter: {date_geq:$from,date_leq:$to,databaseId:$db},orderBy:[date_DESC]) { sum {readQueries writeQueries rowsRead rowsWritten} dimensions {date databaseId} } } } }';
          const variables={accountTag:account,db,from:'2026-09-27',to:'2026-10-10'};
          try{
            const r=await fetch('https://api.cloudflare.com/client/v4/graphql',{method:'POST',redirect:'error',
              headers:{Authorization:'Bearer '+token,Accept:'application/json','Content-Type':'application/json'},
              body:JSON.stringify({query,variables}),signal:AbortSignal.timeout(18000)});
            const j=await r.json().catch(()=>null);
            const a=j?.data?.viewer?.accounts?.[0]?.d1AnalyticsAdaptiveGroups??null;
            const err=(j?.errors??[]).map(x=>String(x?.message??'').slice(0,120)).slice(0,3);
            const valid=r.status===200&&Array.isArray(a)&&a.length<=30&&err.length===0&&a.every(x=>x.dimensions?.databaseId===db);
            const rows=valid?a.map(x=>({date:x.dimensions.date,rowsRead:x.sum?.rowsRead??null,
              rowsWritten:x.sum?.rowsWritten??null,readQueries:x.sum?.readQueries??null,writeQueries:x.sum?.writeQueries??null})).sort((a,b)=>a.date.localeCompare(b.date)):[];
            const metric=['rowsRead','rowsWritten','readQueries','writeQueries'];
            const total=group=>Object.fromEntries(metric.map(k=>[k,rows.filter(x=>x.date>=group[0]&&x.date<=group[1]).reduce((s,x)=>s+(typeof x[k]==='number'?x[k]:0),0)]));
            const earlier=total(['2026-09-27','2026-10-03']),later=total(['2026-10-04','2026-10-10']);
            output({http:r.status,complete:valid,rows:rows.length,errors:err,from:variables.from,to:variables.to,series:rows,
              weekly:[{period:'2026-09-27..2026-10-03',totals:earlier},{period:'2026-10-04..2026-10-10',totals:later}],
              previousDates:rows.filter(x=>x.date>='2026-09-27'&&x.date<='2026-10-03').length,
              currentDates:rows.filter(x=>x.date>='2026-10-04'&&x.date<='2026-10-10').length,
              note:'Cloudflare Adaptive estimates: usage telemetry not invoice, do not impute charges or percent contribution by SQL fingerprints',
              apiRequests:1,noD1Operations:true,noWrites:true});
            if(!valid||rows.filter(x=>x.date>='2026-09-27'&&x.date<='2026-10-03').length!==7||
              rows.filter(x=>x.date>='2026-10-04'&&x.date<='2026-10-10').length!==7)process.exitCode=1;
          }catch{output({state:'HOLD',reason:'transport-or-response-invalid',noWrites:true});process.exitCode=1;}
          NODE
