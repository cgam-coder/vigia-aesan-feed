name: VIGIA WORK16B certified prune auth preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certified-prune-auth-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Verify non-destructive authentication barriers
        env:
          CERTIFIED_PRUNE_ENDPOINT: https://vigia-alertas.csar68.chatgpt.site/api/admin/work16b/certified-prune
          SYNC_BEARER: ${{ secrets.VIGIA_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          check_status() {
            expected="$1"
            label="$2"
            shift 2
            actual="$(curl --silent --show-error \
              --output "${RUNNER_TEMP}/${label}.body" \
              --write-out "%{http_code}" \
              "$@")"
            printf '%s=%s\n' "$label" "$actual"
            test "$actual" = "$expected"
          }

          check_status 405 get --request GET "$CERTIFIED_PRUNE_ENDPOINT"
          check_status 401 post_no_bearer --request POST "$CERTIFIED_PRUNE_ENDPOINT"
          check_status 401 post_invalid_bearer --request POST \
            --header "Authorization: Bearer work16b-invalid-token" \
            "$CERTIFIED_PRUNE_ENDPOINT"
          check_status 403 post_valid_bearer_no_confirmation --request POST \
            --header "Authorization: Bearer ${SYNC_BEARER}" \
            "$CERTIFIED_PRUNE_ENDPOINT"
