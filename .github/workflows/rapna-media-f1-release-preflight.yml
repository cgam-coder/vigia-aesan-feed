name: RAPNA MEDIA release preflight GET only

on:
  push:
    branches: [sec-f1/cloudflare-api-readonly-20261009]
    paths: [.github/workflows/rapna-media-f1-release-preflight.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check five-source health and deployment allocation without mutations
        env:
          VIGIA_READ_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
          CF_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const out=(x)=>console.log('RAPNA_RELEASE_GATE '+JSON.stringify(x));
          const tok=process.env.VIGIA_READ_TOKEN;
          const cf=process.env.CF_READ_TOKEN;
          const base='https://vigia-runtime.c-gamiz93.workers.dev';
          const req=async(url,auth)=> {
            const r=await fetch(url,{method:'GET',redirect:'error',
              headers:{Authorization:'Bearer '+auth,Accept:'application/json'},signal:AbortSignal.timeout(15000)});
            const j=await r.json().catch(()=>null);return {status:r.status,data:j};
          };
          if(!tok||!cf){out({gate:'auth',ok:false});process.exitCode=1;process.exit();}
          try {
            const native=await req(base+'/api/source-reliability?observe=1',tok);
            const pol=await req(base+'/api/freshness?observe=1&policy=1',tok);
            const policyList=Array.isArray(pol.data?.policies)?pol.data.policies:[];
            const policies=Object.fromEntries(policyList.map(p=>[p.source,p]));
            const st=native.data?.state??{};
            const a=st.lastAudit??{};
            const states=Array.isArray(a.states)?a.states:[];
            const now=Date.now();
            const sources=['AESAN','RAPNA','RASFF','SAFETY GATE','OECD'];
            const each=sources.map(source=>{
              const x=states.find(v=>v.source===source);
              const p=policies[source];
              const success=x?.lastSyncSuccessAt?Date.parse(x.lastSyncSuccessAt):NaN;
              const rev=x?.revisionLastSuccessAt?Date.parse(x.revisionLastSuccessAt):NaN;
              const recentAge=Number.isFinite(success)?Math.round((now-success)/60000):null;
              const revisionAge=Number.isFinite(rev)?Math.round((now-rev)/60000):null;
              const recentOk=recentAge!==null&&recentAge>=0&&recentAge<=(p?.recent?.freshMaxAgeMinutes??0);
              const revOk=p?.revision?.required===false||(revisionAge!==null&&revisionAge>=0&&revisionAge<=(p?.revision?.maxAgeMinutes??0));
              const parity=x?.latestIdentityParity===true;
              const missing=Array.isArray(x?.missingOfficialIdentities)?x.missingOfficialIdentities.length:null;
              const mismatches=Array.isArray(x?.revisionMismatches)?x.revisionMismatches.length:null;
              const ok=Boolean(recentOk&&revOk&&parity&&missing===0&&mismatches===0&&x?.error===null);
              return {source,ok,recentAgeMinutes:recentAge,revisionAgeMinutes:revisionAge,
                recentFresh:recentOk,revisionFresh:revOk,parity,missingCount:missing,mismatchCount:mismatches};
            });
            out({gate:'health',httpNative:native.status,httpPolicy:pol.status,
              mode:native.data?.mode??null,outcome:native.data?.outcome??null,
              certified:native.data?.officialParityCertified===true,
              auditTimestamp:a.finishedAt??null,
              activeLease:native.data?.activeLease??null,ageMinutes:native.data?.ageMinutes??null,
              sources:each});
          }catch(e){out({gate:'health',error_type:e?.name??'Error'});}
          for(const name of ['vigia-runtime','vigia-source-runner']){
            try{
              const r=await req('https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f/workers/scripts/'+name+'/deployments',cf);
              const list=Array.isArray(r.data?.result?.deployments)?r.data.result.deployments:[];
              out({gate:'deployment',worker:name,http:r.status,success:r.data?.success===true,
                deployments:list.slice(0,2).map(d=>({id:d.id,created_on:d.created_on,versions:d.versions?.map(v=>({version_id:v.version_id,percentage:v.percentage}))}))});
            }catch(e){out({gate:'deployment',worker:name,error_type:e?.name??'Error'});}
          }
          NODE
