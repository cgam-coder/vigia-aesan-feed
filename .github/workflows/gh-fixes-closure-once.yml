name: WORK GH-FIXES-CLOSURE production closure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type RUN-GH-FIXES-CLOSURE to authorize this extraordinary repair
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: work-gh-fixes-closure-production
  cancel-in-progress: false

jobs:
  writer_gate:
    uses: ./.github/workflows/runtime-writer-gate.yml

  repair-and-verify:
    needs: writer_gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require explicit manual confirmation
        shell: bash
        env:
          GH_FIXES_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$GH_FIXES_CONFIRM" = "RUN-GH-FIXES-CLOSURE"
      - name: Preview, repair only when required, and re-audit
        shell: bash
        env:
          VIGIA_BASE_URL: "${{ needs.writer_gate.outputs.base_url }}"
          VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VIGIA_SYNC_TOKEN"
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          import path from "node:path";

          const base = process.env.VIGIA_BASE_URL;
          const headers = { Authorization:`Bearer ${process.env.VIGIA_SYNC_TOKEN}`, "Content-Type":"application/json" };
          const call = async (pathname, method = "GET", allowed = [200]) => {
            const response = await fetch(base + pathname, {
              method, headers, redirect:"follow", signal:AbortSignal.timeout(600_000),
            });
            const raw = await response.text();
            let body;
            try { body = JSON.parse(raw); }
            catch { throw new Error(`${method} ${pathname} returned non-JSON HTTP ${response.status}`); }
            if (!allowed.includes(response.status)) {
              throw new Error(`${method} ${pathname} failed HTTP ${response.status}: ${raw.slice(0, 1000)}`);
            }
            return { status:response.status, body };
          };
          const summary = (value) => {
            const body = value.body;
            return { http:value.status, status:body.status ?? body.state?.status ?? null,
              repaired:body.repaired ?? null, remaining:body.remaining ?? null,
              reference:body.reference ?? null, alertId:body.alertId ?? null,
              cursor:body.state?.cursor ?? null, lastError:body.state?.lastError ?? null,
              skipped:body.skipped ?? null };
          };

          const evidence = { checkedAt:new Date().toISOString(), before:{}, operations:{}, after:{} };
          const evidencePath = path.join(process.env.RUNNER_TEMP, "gh-fixes-closure-evidence.json");
          const saveEvidence = () => fs.writeFileSync(evidencePath, JSON.stringify(evidence, null, 2));
          await call("/api/aesan/sync?mode=preflight", "POST");
          await call("/api/rasff/sync?mode=preflight", "POST");
          evidence.before.aesanObserve = (await call("/api/aesan/sync?observe=1")).body;
          evidence.before.rasffObserve = (await call("/api/rasff/sync?observe=1")).body;
          evidence.before.rasffAudit = (await call("/api/rasff/sync?audit=1")).body.audit;
          evidence.before.aesanPreview = (await call(
            "/api/aesan/sync?mode=preview-publication-identity&reference=ES2026%2F517", "POST"
          )).body;
          evidence.before.rasffPreview = (await call(
            "/api/rasff/sync?mode=preview-version-counts", "POST"
          )).body;
          saveEvidence();
          console.log("AESAN_PREVIEW " + JSON.stringify(summary({ status:200, body:evidence.before.aesanPreview })));
          console.log("RASFF_PREVIEW " + JSON.stringify(summary({ status:200, body:evidence.before.rasffPreview })));

          if (evidence.before.aesanPreview.status === "ready") {
            evidence.operations.aesanRepair = await call(
              "/api/aesan/sync?mode=repair-publication-identity&reference=ES2026%2F517&dryRun=0", "POST"
            );
            if (evidence.operations.aesanRepair.body.repaired !== true ||
                evidence.operations.aesanRepair.body.status !== "already-repaired") {
              throw new Error("AESAN repair did not confirm the bounded transition");
            }
            saveEvidence();
          } else if (evidence.before.aesanPreview.status !== "already-repaired") {
            throw new Error("AESAN preview returned an unsupported state");
          }

          const rasffRemaining = evidence.before.rasffPreview.remaining;
          if (!Number.isSafeInteger(rasffRemaining) || rasffRemaining < 0 || rasffRemaining > 50) {
            throw new Error("RASFF preview count is outside the guarded contract");
          }
          if (rasffRemaining > 0) {
            evidence.operations.rasffRepair = await call(
              "/api/rasff/sync?mode=repair-version-counts&dryRun=0", "POST"
            );
            if (evidence.operations.rasffRepair.body.repaired !== rasffRemaining ||
                evidence.operations.rasffRepair.body.remaining !== 0) {
              throw new Error("RASFF repair did not confirm every guarded row");
            }
            saveEvidence();
          }

          evidence.after.aesanPreview = (await call(
            "/api/aesan/sync?mode=preview-publication-identity&reference=ES2026%2F517", "POST"
          )).body;
          evidence.after.rasffPreview = (await call(
            "/api/rasff/sync?mode=preview-version-counts", "POST"
          )).body;
          evidence.after.rasffAudit = (await call("/api/rasff/sync?audit=1")).body.audit;
          if (evidence.after.aesanPreview.status !== "already-repaired" || evidence.after.aesanPreview.repaired !== false) {
            throw new Error("AESAN post-repair idempotence preview failed");
          }
          if (evidence.after.rasffPreview.remaining !== 0 || evidence.after.rasffPreview.repaired !== 0) {
            throw new Error("RASFF post-repair preview is not clean");
          }

          evidence.operations.aesanHistoricalReconcile = await call(
            "/api/aesan/sync?mode=historical-reconcile", "POST", [200, 202]
          );
          evidence.operations.rasffReconcile = await call(
            "/api/rasff/sync?mode=reconcile&batchSize=40", "POST", [200, 202]
          );
          saveEvidence();
          evidence.after.aesanObserve = (await call("/api/aesan/sync?observe=1")).body;
          evidence.after.rasffObserve = (await call("/api/rasff/sync?observe=1")).body;
          evidence.after.rasffAuditFinal = (await call("/api/rasff/sync?audit=1")).body.audit;
          evidence.after.aesanPreviewAfterReconcile = (await call(
            "/api/aesan/sync?mode=preview-publication-identity&reference=ES2026%2F517", "POST"
          )).body;
          if (evidence.after.aesanPreviewAfterReconcile.status !== "already-repaired") {
            throw new Error("AESAN historical reread degraded the repaired publication identity");
          }
          if (evidence.after.rasffAuditFinal.integrity?.versionCountMismatches !== 0) {
            throw new Error("RASFF final audit still has version-count mismatches");
          }

          console.log("AESAN_REPAIR " + JSON.stringify(evidence.operations.aesanRepair ?
            summary(evidence.operations.aesanRepair) : { skipped:"already-repaired" }));
          console.log("RASFF_REPAIR " + JSON.stringify(evidence.operations.rasffRepair ?
            summary(evidence.operations.rasffRepair) : { skipped:"already-correct" }));
          console.log("AESAN_RECONCILE " + JSON.stringify(summary(evidence.operations.aesanHistoricalReconcile)));
          console.log("RASFF_RECONCILE " + JSON.stringify(summary(evidence.operations.rasffReconcile)));
          console.log("RASFF_FINAL_AUDIT " + JSON.stringify(evidence.after.rasffAuditFinal));
          saveEvidence();
          NODE
      - name: Preserve bounded before and after evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gh-fixes-closure-production-evidence
          path: ${{ runner.temp }}/gh-fixes-closure-evidence.json
          if-no-files-found: warn
          retention-days: 14
