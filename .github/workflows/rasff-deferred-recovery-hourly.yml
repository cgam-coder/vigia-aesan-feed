name: VIGIA RASFF temporary hourly deferred recovery

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vigia-rasff-controlled-activation
  cancel-in-progress: false

jobs:
  repair-known-deferred:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VIGIA_BASE_URL: https://vigia-alertas.csar68.chatgpt.site
      VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
    steps:
      - name: Retry only known RASFF deferred identities
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VIGIA_SYNC_TOKEN"
          node <<'NODE'
          const base = process.env.VIGIA_BASE_URL;
          const headers = { Authorization:"Bearer " + process.env.VIGIA_SYNC_TOKEN, "Content-Type":"application/json" };
          const known = [
            ["2022.4518",563471],["2022.4827",565971],["2022.6820",581438],["2022.7175",584299],
            ["2023.0258",590576],["2023.0743",593935],["2023.2096",603355],["2023.2243",604694],
            ["2023.3564",613521],["2023.3613",613394],["2023.5372",627424],["2023.5493",628446],
            ["2023.6454",634224],["2023.6581",633489],["2023.7272",640503],["2024.1414",665628],
            ["2024.2480",674245],["2024.3003",678239],["2024.3006",678211],["2024.3943",685998],
            ["2024.4788",693051],["2024.4966",692360],["2024.5011",694197],["2024.6656",708893],
            ["2024.7178",713592],["2025.2720",756612],["2025.5455",777370],["2025.5375",773733],
          ].map(([reference, notifId]) => ({ reference, notifId }));
          const call = async (path, method = "GET", body) => {
            const response = await fetch(base + path, { method, headers, redirect:"follow",
              body:body === undefined ? undefined : JSON.stringify(body), signal:AbortSignal.timeout(900_000) });
            const raw = await response.text();
            let parsed;
            try { parsed = JSON.parse(raw); } catch { throw new Error(method + " " + path + " returned non-JSON HTTP " + response.status); }
            if (response.status !== 200) throw new Error(method + " " + path + " failed HTTP " + response.status + ": " + raw.slice(0, 2000));
            return parsed;
          };
          const pending = async () => {
            const result = [];
            for (let offset = 0; offset < known.length; offset += 8) {
              const rows = await Promise.all(known.slice(offset, offset + 8).map(async (item) => {
                const page = await call("/api/v2/alerts?source=RASFF&reference=" + encodeURIComponent(item.reference) + "&pageSize=5");
                if (!Array.isArray(page.items) || page.items.length > 1 ||
                    page.items.some((alert) => alert.id !== "rasff:" + item.reference || alert.reference !== item.reference))
                  throw new Error("Invalid D1 identity for " + item.reference);
                return page.items.length ? null : item;
              }));
              result.push(...rows.filter(Boolean));
            }
            return result;
          };
          const snapshot = async () => {
            const observe = await call("/api/rasff/sync?observe=1");
            if (observe.lease !== null) return { skipped:true, observe };
            const audit = (await call("/api/rasff/sync?audit=1")).audit;
            const official = (await call("/api/rasff/sync?mode=preview-reconcile&cursor=0&batchSize=1", "POST")).preview;
            const missing = await pending();
            const expectedOperational = official.totalElements - official.archiveSkippedCount;
            const delta = expectedOperational - audit.counts.rasffAlerts;
            if (delta !== missing.length || Object.values(audit.integrity).some((value) => value !== 0) ||
                audit.counts.rasffAlerts !== audit.counts.rasffUniqueReferences ||
                audit.counts.rasffAlerts !== audit.counts.rasffSourceIdentities ||
                audit.counts.rasffVersions !== audit.counts.rasffVersionCountSum)
              throw new Error("Hourly recovery found an unexplained corpus delta: " + JSON.stringify({ expectedOperational, delta, missing, audit }));
            return { skipped:false, observe, audit, expectedOperational, delta, missing };
          };
          const before = await snapshot();
          if (before.skipped) {
            console.log("HOURLY_RECOVERY_SKIPPED_ACTIVE_LEASE " + JSON.stringify(before.observe.lease));
            process.exit(0);
          }
          if (!before.missing.length) {
            console.log("HOURLY_RECOVERY_COMPLETE " + JSON.stringify({ pending:[], delta:0, audit:before.audit }));
            process.exit(0);
          }
          const result = await call("/api/rasff/sync?mode=repair-detail", "POST", { items:before.missing });
          const output = [...result.repaired, ...result.unchanged, ...result.failed];
          const inputKeys = before.missing.map((item) => item.reference + "/" + item.notifId).sort();
          const outputKeys = output.map((item) => item.reference + "/" + item.notifId).sort();
          if (JSON.stringify(inputKeys) !== JSON.stringify(outputKeys) || result.failed.some((item) =>
              item.deferred !== true || !["transport", "upstream"].includes(item.classification) ||
              !["http-429", "http-5xx", "timeout", "aborted", "network"].includes(item.reason)))
            throw new Error("Hourly recovery returned an invalid partition: " + JSON.stringify(result));
          const after = await snapshot();
          if (after.skipped || after.missing.length !== result.failed.length ||
              after.audit.counts.rasffAlerts - before.audit.counts.rasffAlerts !== before.missing.length - after.missing.length ||
              after.audit.counts.rasffVersions - before.audit.counts.rasffVersions !== before.missing.length - after.missing.length)
            throw new Error("Hourly recovery post-audit mismatch: " + JSON.stringify({ before, result, after }));
          console.log("HOURLY_RECOVERY_RESULT " + JSON.stringify({ before:{ delta:before.delta, pending:before.missing },
            repaired:result.repaired, unchanged:result.unchanged, failed:result.failed,
            after:{ delta:after.delta, pending:after.missing }, audit:after.audit }));
          NODE
