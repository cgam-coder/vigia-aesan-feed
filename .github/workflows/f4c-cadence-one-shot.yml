name: VIGIA F4C cadence parity one-shot

on:
  push:
    branches:
      - work/scheduler-reliability-s0-evidence
    paths:
      - ".github/workflows/f4c-cadence-one-shot.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: vigia-revision-control-bounded
  cancel-in-progress: false

jobs:
  writer_gate:
    uses: ./.github/workflows/runtime-writer-gate.yml
  runtime_target:
    uses: ./.github/workflows/runtime-writer-target.yml
  cycle:
    needs: [writer_gate, runtime_target]
    if: needs.writer_gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Execute one F4C cadence parity window
        env:
          VIGIA_BASE_URL: ${{ needs.runtime_target.outputs.base_url }}
          VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node ops/revision-control-cycle.mjs active
