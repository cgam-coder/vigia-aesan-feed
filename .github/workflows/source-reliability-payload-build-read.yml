name: Source reliability publication build forensic read
on:
  push:
    branches: [source-reliability/payload-build-read-20261008]
permissions:
  contents: read
jobs:
  inspect:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read exact observed build identifiers and allocation
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          if(Date.now()>Date.parse('2026-10-08T15:45:00Z'))throw Error('expired build read');
          const root='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f';
          for(const path of ['/builds/builds/2d8eae88-d7ba-47e0-bfa0-db7ade253ba0','/builds/builds/678c6972-f929-4912-8a50-906c102957cd','/workers/scripts/vigia-runtime/deployments']){
            const r=await fetch(root+path,{method:'GET',headers:{Authorization:'Bearer '+process.env.CF_TOKEN},signal:AbortSignal.timeout(30000)}),p=await r.json();
            const b=p.result?.build??p.result;
            const safe=path.endsWith('/deployments')?{deployments:b?.deployments?.slice(0,2)}:{keys:Object.keys(b??{}),id:b?.build_uuid,status:b?.status,outcome:b?.build_outcome,failureReason:b?.failure_reason,created:b?.created_on,started:b?.started_on,ended:b?.ended_on,metadata:{branch:b?.build_trigger_metadata?.branch,commit:b?.build_trigger_metadata?.commit_hash}};
            console.log('SR_EXACT_BUILD_READ '+JSON.stringify({path,http:r.status,success:p.success,errors:p.errors,result:safe}));
          }
          NODE
