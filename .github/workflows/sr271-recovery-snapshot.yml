name: SR271 read-only Cloudflare lifecycle diagnosis
on:
  push:
    branches: [source-reliability/recovery-snapshot-20261009]
permissions:
  contents: read
concurrency:
  group: sr271-recovery-snapshot-20261009
  cancel-in-progress: false
jobs:
  lifecycle:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Official telemetry query dry results with no application writes
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const root='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f';
          if(Date.now()>Date.parse('2026-10-09T07:15:00Z'))throw Error('diagnostic expired');
          const redact=v=>JSON.parse(JSON.stringify(v).replaceAll(process.env.CF_TOKEN,'[redacted]'));
          for(const view of ['invocations','events']){
           const body={queryId:'sr271-readonly-lifecycle-20261009-'+view,dry:true,view,limit:200,timeframe:{from:Date.parse('2026-10-09T06:18:00Z'),to:Date.now()},parameters:{filterCombination:'or',filters:['vigia-runtime','vigia-source-runner'].map(value=>({key:'$metadata.service',operation:'eq',type:'string',value}))}};
           const r=await fetch(root+'/workers/observability/telemetry/query',{method:'POST',headers:{Authorization:'Bearer '+process.env.CF_TOKEN,'Content-Type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(30000)});const p=await r.json();
           console.log('R9_TELEMETRY_STATUS '+JSON.stringify({at:new Date().toISOString(),view,http:r.status,success:p.success,errors:p.errors,run:p.result?.run,keys:Object.keys(p.result??{})}));
           const clean=(v,depth=0)=>{if(depth>12)return '[depth]';if(Array.isArray(v))return v.map(x=>clean(x,depth+1));if(v&&typeof v==='object'){const o={};for(const [k,x]of Object.entries(v)){if(/headers|cookie|authorization|token|body|email|ipAddress/i.test(k))continue;o[k]=clean(x,depth+1);}return o;}return v};
           for(const k of ['events','invocations','requests','traces'])if(p.result?.[k])console.log('R9_TELEMETRY '+JSON.stringify({view,key:k,data:redact(clean(p.result[k]))}));
           if(!r.ok||!p.success)break;
          }
          console.log('R9_TELEMETRY_COMPLETE '+JSON.stringify({at:new Date().toISOString(),dry:true,domainWrites:0}));
          NODE
