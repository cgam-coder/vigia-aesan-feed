name: TEMP RAPNA CURRENT C2 final read-only verification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  authenticated-read-only-final:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'work/20q-c2-rapna-forensic-readonly-auth'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Run final RAPNA CURRENT zero-write verification
        env:
          VIGIA_SYNC_TOKEN: \${{ secrets.VIGIA_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          test -n "\${VIGIA_SYNC_TOKEN}"
          endpoint="https://nagamealert.com/api/rapna/sync"
          report_dir="\${RUNNER_TEMP}/work20q-c2-final"
          mkdir -p "\${report_dir}"

          request() {
            label="$1"
            method="$2"
            query="$3"
            expected="$4"
            with_auth="\${5:-yes}"
            headers=()
            if [ "\${with_auth}" = "yes" ]; then headers+=(--header "Authorization: Bearer \${VIGIA_SYNC_TOKEN}"); fi
            code="$(curl --silent --show-error --location --request "\${method}" --max-time 480 \
              "\${headers[@]}" --output "\${report_dir}/\${label}.json" --write-out '%{http_code}' \
              "\${endpoint}?\${query}")"
            if [ "\${code}" != "\${expected}" ]; then
              echo "\${label}: unexpected HTTP \${code}; expected \${expected}" >&2
              exit 1
            fi
          }

          request preflight POST 'mode=preflight' 200
          request observe-before GET 'observe=1' 200
          request dryrun-unauthenticated POST 'mode=current-dry-run&year=2021' 401 no
          request replay-unauthenticated POST 'mode=current-replay&batchSize=1' 401 no
          request replay-no-confirm POST 'mode=current-replay&batchSize=1' 400
          request replay-no-snapshot POST 'mode=current-replay&batchSize=1&confirm=RAPNA_CURRENT_ONLY' 400

          for year in 2021 2022 2023 2024 2025 2026; do
            request "dryrun-\${year}" POST "mode=current-dry-run&year=\${year}" 200
          done
          request observe-after GET 'observe=1' 200

          node - "\${report_dir}" <<'NODE'
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");
          const directory = process.argv[2];
          const read = (name) => JSON.parse(fs.readFileSync(path.join(directory, name + ".json"), "utf8"));
          const stable = (value) => Array.isArray(value) ? value.map(stable)
            : value && typeof value === "object"
              ? Object.fromEntries(Object.entries(value).sort(([a],[b]) => a.localeCompare(b)).map(([key, child]) => [key, stable(child)]))
              : value;
          const equal = (left, right) => JSON.stringify(stable(left)) === JSON.stringify(stable(right));
          const hash = (value) => crypto.createHash("sha256").update(JSON.stringify(stable(value))).digest("hex");
          const years = [2021, 2022, 2023, 2024, 2025, 2026];
          const expectedPlan = years.map((year) => ({ archive:"current", year }));
          const bodies = years.map((year) => read("dryrun-" + year));
          const reports = bodies.map(({ report }) => report);

          for (let index=0; index<years.length; index+=1) {
            const body=bodies[index];
            const report=reports[index];
            if (!report || report.year!==years[index] || !equal(report.plan, expectedPlan)) throw new Error("Invalid CURRENT-only report " + years[index]);
            if (!body.zeroWrite?.verified || !equal(body.zeroWrite.before, body.zeroWrite.after)) throw new Error("Per-year zero-write failed " + years[index]);
            if (!report.changes.every((change) => Array.isArray(change.canonicalChangedPaths) &&
              Array.isArray(change.sourceRecordChangedPaths) && Array.isArray(change.semanticChangedPaths) &&
              Array.isArray(change.legacyChangedPaths) && typeof change.metadataRefresh === "boolean")) {
              throw new Error("Forensic paths unavailable " + years[index]);
            }
          }

          const before = read("observe-before");
          const after = read("observe-after");
          for (const key of ["recent", "backfill", "currentReplay", "lease", "snapshot", "controlFingerprint"]) {
            if (!equal(before[key], after[key])) throw new Error("Global zero-write mismatch: " + key);
          }

          const numeric = [
            "incomingRecords", "storedMatches", "missingStored", "storedNotPresentIncoming", "unchanged",
            "ghostExpansionRepair", "pluralLabelRepair", "observationRefresh", "sourceRecordMetadataRefresh",
            "metadataRefreshDetected", "metadataRepairOverlaps", "overlaps", "genuineSemanticChange", "unexpected",
            "invalidRecords", "duplicateRecords", "pagesScanned", "storedIsUpdateTrue", "incomingIsUpdateTrue",
            "isUpdateFlagChanges", "isUpdateTrueToFalse", "isUpdateFalseToTrue", "pluralLabelCandidates",
            "pluralAlreadyRepaired", "pluralPending", "pluralHashChanges"
          ];
          const sum = (key) => reports.reduce((total, report) => total + Number(report[key] || 0), 0);
          const aggregate = Object.fromEntries(numeric.map((key) => [key, sum(key)]));
          const changes = reports.flatMap((report) => report.changes.map((change) => ({ year:report.year, ...change })));
          const metadata = changes.filter(({classification}) => classification === "source-record-metadata-refresh");

          const combinations = {};
          for (const report of reports) {
            for (const [key,count] of Object.entries(report.repairManifest || {})) combinations[key]=(combinations[key]||0)+Number(count);
          }
          const combinationTotal = Object.values(combinations).reduce((total,count)=>total+count,0);

          const patternMap = new Map();
          for (const change of metadata) {
            const key=JSON.stringify(change.canonicalChangedPaths);
            const current=patternMap.get(key) ?? { paths:change.canonicalChangedPaths, count:0, years:new Set(), references:[] };
            current.count+=1;
            current.years.add(change.year);
            if (current.references.length<8) current.references.push(change.reference);
            patternMap.set(key,current);
          }
          const changedPathPatterns=[...patternMap.values()].map(({paths,count,years,references}) => ({
            paths, count, years:[...years].sort(), representativeReferences:references
          })).sort((a,b) => b.count-a.count || JSON.stringify(a.paths).localeCompare(JSON.stringify(b.paths)));

          const manifest=metadata.map((change) => ({
            year:change.year,
            reference:change.reference,
            changedPaths:change.canonicalChangedPaths,
            semanticChangedPaths:change.semanticChangedPaths,
            legacyChangedPaths:change.legacyChangedPaths,
            expected:change.classification
          })).sort((a,b) => a.year-b.year || a.reference.localeCompare(b.reference,"en"));

          const result={
            plan:expectedPlan,
            perYear:reports.map((report)=>Object.fromEntries(["year",...numeric].map((key)=>[key,report[key]]))),
            aggregate,
            changedPaths:{
              patternCount:changedPathPatterns.length,
              patterns:changedPathPatterns,
              manifest:{ count:manifest.length, sha256:hash(manifest) }
            },
            semanticProof:{
              publishedProjectionEqual:metadata.filter((c)=>c.publishedProjectionEqual).length,
              semanticPathEmpty:metadata.filter((c)=>c.semanticChangedPaths.length===0).length,
              sameHash:metadata.filter((c)=>c.beforeContentHash===c.afterContentHash).length,
              sameUpdateFlag:metadata.filter((c)=>c.beforeIsUpdate===c.afterIsUpdate).length,
              legacyUpdatedAtOnly:metadata.filter((c)=>equal(c.legacyChangedPaths,["updatedAt"])).length
            },
            exactClassification:{ combinations, total:combinationTotal },
            zeroWrite:{
              verified:true,
              beforeSha256:hash(before.controlFingerprint),
              afterSha256:hash(after.controlFingerprint)
            }
          };
          console.log("WORK20Q_C2_FINAL " + JSON.stringify(result));

          const blockers=["missingStored","storedNotPresentIncoming","genuineSemanticChange","unexpected","invalidRecords","duplicateRecords"];
          if (blockers.some((key)=>aggregate[key]!==0)) throw new Error("Blocking CURRENT drift: " + JSON.stringify(Object.fromEntries(blockers.map((key)=>[key,aggregate[key]]))));
          if (aggregate.incomingRecords!==1480 || aggregate.storedMatches!==aggregate.incomingRecords || combinationTotal!==aggregate.incomingRecords) {
            throw new Error("CURRENT reconciliation failed");
          }
          if (aggregate.ghostExpansionRepair!==1357 || aggregate.pluralLabelRepair!==102 ||
              aggregate.observationRefresh!==1 || aggregate.sourceRecordMetadataRefresh!==123 ||
              aggregate.metadataRefreshDetected!==1479 || aggregate.metadataRepairOverlaps!==1356 ||
              aggregate.overlaps!==103) throw new Error("Certified classification counts changed");
          if (!equal(combinations,{
            "ghost+metadata":1254,
            "ghost+observation":1,
            "ghost+plural+metadata":102,
            "metadata-only":123
          })) throw new Error("Exact repair manifest changed: " + JSON.stringify(combinations));
          if (metadata.length!==123 || metadata.some((c)=>!c.metadataClassificationEligible || !c.publishedProjectionEqual ||
              c.semanticChangedPaths.length || c.legacyChangedPaths.some((item)=>item!=="updatedAt") ||
              c.canonicalChangedPaths.some((item)=>item!=="sourceRecord" && !item.startsWith("sourceRecord.")))) {
            throw new Error("Unsafe source-record metadata classification");
          }
          NODE
