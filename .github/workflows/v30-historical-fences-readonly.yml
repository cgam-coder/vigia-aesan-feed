name: V30 three historical fences forensic checkpoint GET/SELECT only
on:
  push:
    branches: [audit/v30-historical-fences-20261012]
    paths: [.github/workflows/v30-historical-fences-readonly.yml]
permissions:
  contents: read
jobs:
  observe:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VIGIA: ${{ secrets.VIGIA_SYNC_TOKEN }}
    steps:
      - name: Bounded GET plus indexed D1 SELECT only, zero mutations
        shell: bash
        run: |
          node <<'NODE'
          (async()=>{
            const CF=process.env.CF||'',T=process.env.VIGIA||'';
            if(!CF||!T)throw Error('MISSING_EXISTING_READ_CREDENTIALS');
            const base='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f';
            const db='55596003-1b90-4f66-aad8-decb21205f13';
            const live='https://vigia-runtime.c-gamiz93.workers.dev';
            const jobs=['15ff9a7c-4094-4836-996b-b36591cab779','bb90ee24-dffa-4b25-9a03-8e994a29df64','7d965614-eb79-468c-838a-249147a0fb58'];
            let gets=0,selects=0,rowsRead=0,rowsWritten=0;
            const fetchJson=async(url,token,sql=null,params=[])=>{
              if(sql!==null){
                if(url!==base+'/d1/database/'+db+'/query'||++selects>7||!/^SELECT\s/iu.test(sql)||sql.includes(';')||/\b(?:DELETE|INSERT|UPDATE|REPLACE|DROP|CREATE|ALTER|PRAGMA|VACUUM|ATTACH|DETACH)\b/iu.test(sql))throw Error('SQL_POLICY_HOLD');
              }else if(++gets>6)throw Error('GET_LIMIT');
              const r=await fetch(url,{method:sql===null?'GET':'POST',headers:{Authorization:'Bearer '+token,Accept:'application/json',...(sql?{'Content-Type':'application/json'}:{})},...(sql?{body:JSON.stringify({sql,params})}:{}),redirect:'error',signal:AbortSignal.timeout(15000)});
              const raw=await r.text();
              if(raw.length>1250000)throw Error('RESULT_LIMIT');
              const body=JSON.parse(raw);
              return {http:r.status,body,ok:r.ok&&(url.startsWith(base)?body.success===true:true)};
            };
            const reqs=[
              ['control',live+'/api/source-reliability?observe=1',T],
              ['fresh',live+'/api/freshness?observe=1',T],
              ['runner',base+'/workers/scripts/vigia-source-runner/deployments',CF],
              ['runtime',base+'/workers/scripts/vigia-runtime/deployments',CF],
              ['db',base+'/d1/database/'+db,CF],
            ];
            const pre=Object.fromEntries(await Promise.all(reqs.map(async([name,url,t])=>[name,await fetchJson(url,t)])));
            if(Object.values(pre).some(x=>!x.ok||x.http!==200))throw Error('GET_PREFLIGHT_UNAVAILABLE');
            const active=o=>(o.body?.result?.deployments||[])[0]?.versions?.find(v=>v.percentage===100)?.version_id||'';
            const runner=active(pre.runner),runtime=active(pre.runtime);
            const owner=pre.control.body,states=pre.fresh.body?.states||[];
            const age=x=>typeof x==='string'&&Number.isFinite(Date.parse(x))?(Date.now()-Date.parse(x))/60000:null;
            const recentFive=['AESAN','RAPNA','RASFF','SAFETY GATE','OECD'].map(n=>{const s=states.find(x=>x.source===n);return{name:n,parity:s?.latestIdentityParity===true,ageMin:age(s?.lastSyncSuccessAt),probeAgeMin:age(s?.checkedAt),missing:(s?.missingOfficialIdentities||[]).length,mismatches:(s?.revisionMismatches||[]).length}});
            const enough=runner.startsWith('92273d27')&&runtime.startsWith('2914305e')&&owner.buildSha==='d5fcd11cbeb563258b4bbdc9482a80b8684c81d3';
            if(!enough)throw Error('VERSION_FENCE_CHANGED');
            const query=async(name,sql,params=[])=>{
              const r=await fetchJson(base+'/d1/database/'+db+'/query',CF,sql,params);
              const d=r.body?.result?.[0];
              if(r.http!==200||!r.ok||!Array.isArray(d?.results)||d?.meta?.rows_written!==0)throw Error('READ_HOLD_'+name);
              rowsRead+=Number(d.meta?.rows_read||0);rowsWritten+=Number(d.meta?.rows_written||0);
              if(rowsRead>4500||rowsWritten!==0)throw Error('D1_RESOURCE_LIMIT');
              return d.results;
            };
            const placeholders=jobs.map(()=>'?').join(',');
            const state=await query('states', "SELECT source,mode,status,cursor,cursor_key,total_units,plan_version,last_error,completed_at,updated_at FROM source_sync_state WHERE (source='RASFF' AND mode='reconcile') OR (source='OECD' AND mode='historical-reconcile') OR (source='RAPNA' AND mode='legacy-reconcile')");
            const job=await query('jobs',"SELECT id,source,mode,phase,json_extract(receipt_json,'$.outcome') AS receipt_outcome,json_extract(receipt_json,'$.reason') AS receipt_reason FROM source_reliability_jobs WHERE id IN ("+placeholders+")",jobs);
            const effects=[];
            for(const id of jobs){const v=await query('effects',"SELECT COUNT(*) AS n,COUNT(DISTINCT ordinal) AS unique_ordinals,MIN(ordinal) AS first_ordinal,MAX(ordinal) AS last_ordinal,COALESCE(SUM(CASE WHEN committed_at IS NULL OR result_json IS NULL THEN 1 ELSE 0 END),0) AS pending FROM source_reliability_effects WHERE job_id=? AND ordinal>0",[id]);effects.push({id,...v[0]});}
            const recoveries=await query('recoveries',"SELECT old_job_id,substr(manifest_hash,1,16) AS hash_prefix FROM source_reliability_recoveries WHERE old_job_id IN ("+placeholders+")",jobs);
            const plans=await query('plans',"SELECT old_job_id,COUNT(*) AS parts FROM source_reliability_recovery_plans WHERE old_job_id IN ("+placeholders+") GROUP BY old_job_id",jobs);
            const controls=['RASFF:reconcile','OECD:historical-reconcile','RAPNA:legacy-reconcile'].map(k=>{const z=owner.state?.revisionAttempts?.[k]||{};return{key:k,outcome:z.outcome??null,id:z.id??null,reasonClass:/403/i.test(z.reason||'')?'HTTP403':/incomplete/i.test(z.reason||'')?'INCOMPLETE':/D1_ERROR/i.test(z.reason||'')?'D1':'OTHER',durableFence:String(z.nextEligibleAt||'').startsWith('9999')}});
            const snapshot={at:new Date().toISOString(),http:Object.fromEntries(reqs.map(([n])=>[n,pre[n].http])),runnerVersion:runner.slice(0,12),runtimeVersion:runtime.slice(0,12),activeLease:owner.activeLease??null,recentFive,states:state,originalJobs:job,effects,recoveryReceipts:recoveries,recoveryPlanCounts:plans,coordinatorAttempts:controls,globalHistoricalCertificate:owner.officialParityCertified===true,GETs:gets,SELECTs:selects,rowsRead,rowsWritten,sourceJobs:0,deployments:0,modifications:0};
            const pass=state.length===3&&job.length===3&&effects.length===3&&effects.every(e=>e.n===e.unique_ordinals&&e.first_ordinal===1&&e.pending===0)&&controls.every(x=>x.outcome==='failed'&&x.durableFence)&&recoveries.length===2&&plans.length>=2;
            console.log('V30_FENCES '+JSON.stringify({...snapshot,pass}));
            if(!pass)process.exitCode=2;
          })().catch(e=>{console.log('V30_FENCES '+JSON.stringify({state:'HOLD',reason:String(e.message||e.name).slice(0,100),zeroWrites:true}));process.exitCode=2});
          NODE
