name: TEMP WORK20Q-D Safety Gate closure audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
    steps:
      - name: Prove backup and database closure
        run: |
          closure_file="${RUNNER_TEMP}/closure.json"
          aggregate_file="${RUNNER_TEMP}/aggregate.json"
          observe_file="${RUNNER_TEMP}/observe.json"
          closure_code="$(curl -q --silent --show-error --request POST --max-time 60 \
            --header "Authorization: Bearer ${VIGIA_SYNC_TOKEN}" --output "${closure_file}" --write-out '%{http_code}' \
            "https://vigia-alertas.csar68.chatgpt.site/api/safety-gate/sync?mode=audit-repair-closure")"
          aggregate_code="$(curl -q --silent --show-error --request GET --max-time 60 \
            --header "Authorization: Bearer ${VIGIA_SYNC_TOKEN}" --output "${aggregate_file}" --write-out '%{http_code}' \
            "https://vigia-alertas.csar68.chatgpt.site/api/safety-gate/sync?audit=1")"
          observe_code="$(curl -q --silent --show-error --request GET --max-time 60 \
            --header "Authorization: Bearer ${VIGIA_SYNC_TOKEN}" --output "${observe_file}" --write-out '%{http_code}' \
            "https://vigia-alertas.csar68.chatgpt.site/api/safety-gate/sync?observe=1")"
          node - <<'NODE' "${closure_code}" "${closure_file}" "${aggregate_code}" "${aggregate_file}" "${observe_code}" "${observe_file}"
          const fs=require("node:fs");
          const closure=JSON.parse(fs.readFileSync(process.argv[3],"utf8")).closure;
          const aggregate=JSON.parse(fs.readFileSync(process.argv[5],"utf8")).audit;
          const observe=JSON.parse(fs.readFileSync(process.argv[7],"utf8"));
          const c=closure?.consistency, counts=aggregate?.counts, integrity=aggregate?.integrity;
          if (Number(process.argv[2])!==200 || Number(process.argv[4])!==200 || Number(process.argv[6])!==200 ||
              closure?.snapshot?.alertCount!==116 || closure?.snapshot?.sourceAlertCount!==116 ||
              closure?.snapshot?.versionCount!==116 || closure?.snapshot?.status!=="repair-applied" ||
              closure?.checksumMatches!==true || closure?.sourceChecksumMatches!==true ||
              closure?.payloadPurpose!=="work20q-d-order-churn" || closure?.backedUpRows!==116 ||
              c?.alerts!==21071 || c?.versionRows!==22533 || c?.versionCountSum!==23001 ||
              c?.missingCurrentHashRows!==0 || c?.invalidVersionCountRows!==0 ||
              counts?.safetyGateAlerts!==21071 || counts?.safetyGateUniqueReferences!==21071 ||
              counts?.safetyGateVersions!==22533 || counts?.safetyGateVersionCountSum!==23001 ||
              integrity?.duplicateReferenceGroups!==0 || integrity?.invalidIdentities!==0 ||
              integrity?.emptyCanonicalRows!==0 || integrity?.invalidOfficialUrls!==0 ||
              observe?.lease!==null || observe?.recent?.status!=="completed" ||
              observe?.recent?.updatedCount!==0 || observe?.recent?.newCount!==0) {
            throw new Error(`unexpected closure: ${JSON.stringify({closure,aggregate,observe})}`);
          }
          console.log(JSON.stringify({closure,aggregate,observe:{recent:observe.recent,lease:observe.lease}}));
          NODE
