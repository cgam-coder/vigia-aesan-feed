name: TEMP WORK20Q-D Safety Gate aggregate audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
    steps:
      - name: Prove exact nondeterministic-order window
        run: |
          response_file="${RUNNER_TEMP}/order-churn.json"
          http_code="$(curl -q --silent --show-error --request POST --max-time 60 \
            --header "Authorization: Bearer ${VIGIA_SYNC_TOKEN}" \
            --output "${response_file}" --write-out '%{http_code}' \
            "https://vigia-alertas.csar68.chatgpt.site/api/safety-gate/sync?mode=audit-order-churn&startedAt=2026-09-12T14%3A36%3A34.693Z&completedAt=2026-09-12T14%3A47%3A02.540Z")"
          node - <<'NODE' "${http_code}" "${response_file}"
          const fs = require("node:fs");
          const status = Number(process.argv[2]);
          const body = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          const audit = body?.audit;
          if (status !== 200 || audit?.candidateVersions !== 137 || audit?.repairableVersions !== 137 ||
              audit?.officialChangeVersions !== 0 || audit?.invalidVersions !== 0) {
            throw new Error(`unexpected audit: HTTP ${status} ${JSON.stringify(body)}`);
          }
          console.log(JSON.stringify(audit));
          NODE
