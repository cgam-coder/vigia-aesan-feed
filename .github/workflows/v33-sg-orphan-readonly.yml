name: V33 Safety Gate recent orphan forensic SELECT-only once
on:
  push:
    branches: [audit/v33-sg-orphan-forensics-20261013]
    paths: [.github/workflows/v33-sg-orphan-readonly.yml]
permissions: { contents: read }
jobs:
  audit:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VIGIA: ${{ secrets.VIGIA_SYNC_TOKEN }}
    steps:
      - name: Only Cloudflare GET and bounded D1 SELECT
        shell: bash
        run: |
          node <<'NODE'
          (async()=>{
            const C=process.env.CF||'',T=process.env.VIGIA||'';
            if(!C||!T)throw Error('EXISTING_TOKEN_MISSING');
            const root='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f';
            const db='55596003-1b90-4f66-aad8-decb21205f13',host='https://vigia-runtime.c-gamiz93.workers.dev';
            let gets=0,selects=0,rows=0;
            const GET=async(u,t)=>{if(++gets>5)throw Error('GET_BUDGET');const r=await fetch(u,{method:'GET',headers:{Authorization:'Bearer '+t,Accept:'application/json'},redirect:'error',signal:AbortSignal.timeout(16000)});const j=await r.json().catch(()=>null);if(r.status!==200||!j)throw Error('GET_UNAVAILABLE_'+r.status);return j};
            const SELECT=async(tag,sql,params=[])=>{
              if(++selects>12||!/^SELECT\s/iu.test(sql)||/\b(INSERT|UPDATE|DELETE|DROP|CREATE|ALTER|REPLACE|PRAGMA|VACUUM|ATTACH)\b/iu.test(sql)||sql.includes(';'))throw Error('SQL_POLICY');
              const r=await fetch(root+'/d1/database/'+db+'/query',{method:'POST',redirect:'error',signal:AbortSignal.timeout(18000),headers:{Authorization:'Bearer '+C,'Content-Type':'application/json'},body:JSON.stringify({sql,params})});
              const j=await r.json().catch(()=>null),t=j?.result?.[0];
              if(r.status!==200||j?.success!==true||!Array.isArray(t?.results)||t?.meta?.rows_written!==0)throw Error('D1_SELECT_'+tag+'_'+r.status);
              rows+=Number(t.meta?.rows_read||0);if(rows>6500)throw Error('ROWS_BUDGET');
              return t.results;
            };
            const [owner,fresh,sg,runnerDep,runtimeDep]=await Promise.all([
              GET(host+'/api/source-reliability?observe=1',T),
              GET(host+'/api/freshness?observe=1',T),
              GET(host+'/api/safety-gate/sync?observe=1',T),
              GET(root+'/workers/scripts/vigia-source-runner/deployments',C),
              GET(root+'/workers/scripts/vigia-runtime/deployments',C)
            ]);
            const v=d=>d?.result?.deployments?.[0]?.versions?.find(x=>x.percentage===100)?.version_id||null;
            const versions={runner:v(runnerDep),runtime:v(runtimeDep)};
            if(versions.runner!=='92273d27-d9d4-4b07-a06b-bc9f9c324d7a'||versions.runtime!=='2914305e-d833-457f-a656-898b9ffc5392')throw Error('VERSION_DRIFT');
            const [state,control,locks,jobs,recovery,latestSf,freshSql]=await Promise.all([
              SELECT('state',"SELECT source,mode,status,cursor,cursor_key,total_units,plan_version,started_at,completed_at,last_success_at,last_error,page_errors,detail_failures,lease_owner_id,lease_mode,lease_expires_at,updated_at FROM source_sync_state WHERE source='SAFETY GATE' AND mode='recent'"),
              SELECT('control',"SELECT owner_id,expires_at,epoch,json_extract(state_json,'$.attempts.\"SAFETY GATE\".id') AS sg_job,json_extract(state_json,'$.attempts.\"SAFETY GATE\".outcome') AS sg_outcome,json_extract(state_json,'$.attempts.\"SAFETY GATE\".reason') AS sg_reason,json_extract(state_json,'$.attempts.\"SAFETY GATE\".startedAt') AS sg_attempt_start,json_extract(state_json,'$.lastWakeAt') AS last_wake FROM source_reliability_control WHERE id=1"),
              SELECT('locks',"SELECT source,mode,owner_id,expires_at FROM source_sync_locks WHERE source='SAFETY GATE'"),
              SELECT('jobs',"SELECT id,source,mode,kind,epoch,phase,started_at,finished_at,deadline,write_intent_at,json_extract(receipt_json,'$.outcome') AS outcome,json_extract(receipt_json,'$.reason') AS reason FROM source_reliability_jobs WHERE source='SAFETY GATE' AND mode='recent' ORDER BY started_at DESC LIMIT 8"),
              SELECT('recoveries',"SELECT old_job_id,substr(manifest_hash,1,12) AS hash_prefix FROM source_reliability_recoveries WHERE old_job_id IN (SELECT id FROM source_reliability_jobs WHERE source='SAFETY GATE' AND mode='recent' ORDER BY started_at DESC LIMIT 8)"),
              SELECT('plans',"SELECT old_job_id,part,substr(manifest_hash,1,12) AS hash_prefix FROM source_reliability_recovery_plans WHERE old_job_id IN (SELECT id FROM source_reliability_jobs WHERE source='SAFETY GATE' AND mode='recent' ORDER BY started_at DESC LIMIT 8)"),
              SELECT('fresh',"SELECT source,status,checked_at,last_sync_success_at,latest_identity_parity,json_array_length(missing_official_identities) AS missing,json_array_length(revision_mismatches) AS mismatches FROM source_freshness_state ORDER BY source")
            ]);
            const effects=[];
            for(const j of jobs.slice(0,3)){
              const x=await SELECT('effects',"SELECT COUNT(*) AS n,COUNT(DISTINCT ordinal) AS distinct_n,MIN(ordinal) AS first_n,MAX(ordinal) AS last_n,COALESCE(SUM(CASE WHEN committed_at IS NULL OR result_json IS NULL THEN 1 ELSE 0 END),0) AS pending FROM source_reliability_effects WHERE job_id=?",[j.id]);
              effects.push({id:j.id,...x[0]});
            }
            const at=new Date(),m=ts=>typeof ts==='string'&&Number.isFinite(Date.parse(ts))?+((at.getTime()-Date.parse(ts))/60000).toFixed(1):null;
            const stateRow=state[0]||null;
            const result={at:at.toISOString(),versions,owner:{buildSha:owner.buildSha||null,mode:owner.mode||null,
                activeLease:owner.activeLease??null,sgAttempt:owner.state?.attempts?.['SAFETY GATE']?.outcome??null},
              source:{...stateRow,sinceSuccessMin:m(stateRow?.last_success_at),stateAgeMin:m(stateRow?.updated_at)},
              currentLease:locks,controller:control,latestJobs:jobs,effects,recoveryReceipts:recovery,recoveryPlans:latestSf,
              latestObservation:{recentStatus:sg.recent?.status||null,ageMinutes:m(sg.recent?.lastSuccessAt),lease:sg.lease?.expiresAt||null},
              fiveFresh:freshSql.map(x=>({source:x.source,status:x.status,parity:x.latest_identity_parity===1,ageMin:m(x.last_sync_success_at),checkedAgo:m(x.checked_at),missing:x.missing,mismatches:x.mismatches})),
              GET:gets,SELECT:selects,rowsRead:rows,rowsWritten:0,sourceJobsStarted:0,noDeploy:true};
            const passed=state.length===1&&control.length===1&&freshSql.length===5&&jobs.length>=1;
            console.log('V33_SG_FORENSICS '+JSON.stringify({pass:passed,...result}));
            if(!passed)process.exitCode=3;
          })().catch(e=>{console.log('V33_SG_FORENSICS '+JSON.stringify({state:'HOLD',reason:String(e.message||e.name).slice(0,100),zeroWrite:true}));process.exitCode=2});
          NODE
