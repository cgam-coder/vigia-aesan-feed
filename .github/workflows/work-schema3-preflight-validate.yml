name: WORK schema3 preflight validation

on:
  push:
    branches:
      - work/schema3-preflight-compat

permissions:
  contents: read

jobs:
  validate:
    if: github.event.head_commit.message == 'RUN SCHEMA3 PREFLIGHT VALIDATION'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test feed repository
        run: npm test
      - name: Verify schema guard contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '![2, 3].includes(body?.schemaVersion)' .github/workflows/safety-gate-sync.yml
          node - <<'NODE'
          for (const schemaVersion of [2,3]) {
            const body={apiVersion:2,schemaVersion,items:[{}]};
            if (body.apiVersion !== 2 || ![2,3].includes(body.schemaVersion) || !Array.isArray(body.items) || body.items.length===0) process.exit(1);
          }
          NODE
