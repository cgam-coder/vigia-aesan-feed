name: AESAN generator original source export once

on:
  push:
    branches: [ops/aesan-generator-source-20260922]
    paths: [.github/workflows/aesan-generator-source-once.yml]

permissions:
  contents: read

jobs:
  export:
    if: github.ref == 'refs/heads/ops/aesan-generator-source-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d02ffc4ec80a4e4a6d30ce214b6bf0b5402e8130
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact original commit without executing application code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d02ffc4ec80a4e4a6d30ce214b6bf0b5402e8130
          test "$(git rev-parse 'HEAD^{tree}')" = 6408e928be6fc1678a4151fdf769abd0441ce25d
          test -z "$(git status --porcelain)"
          git fsck --full --strict
          mkdir -p "$RUNNER_TEMP/aesan-source-export"
          git branch aesan-generator-approved HEAD
          git bundle create "$RUNNER_TEMP/aesan-source-export/aesan-original.bundle" refs/heads/aesan-generator-approved
          git bundle verify "$RUNNER_TEMP/aesan-source-export/aesan-original.bundle"
          git archive --format=tar --output="$RUNNER_TEMP/aesan-source-export/source.tar" HEAD
          git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/aesan-source-export/refs.txt"
          cd "$RUNNER_TEMP/aesan-source-export"
          sha256sum aesan-original.bundle source.tar refs.txt > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aesan-generator-original-source-d02ffc4e
          path: ${{ runner.temp }}/aesan-source-export/
          if-no-files-found: error
          retention-days: 1
