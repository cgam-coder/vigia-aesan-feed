name: TEMP AESAN multisurface validation

on:
  push:
    branches:
      - work/aesan-multisurface-discovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Inspect AESAN landing raw HTML
        run: |
          curl --silent --show-error --location --max-time 45 \
            -H 'Accept: text/html,application/xhtml+xml' \
            -H 'Accept-Language: es-ES,es;q=0.9' \
            -A 'VIGIA-AESAN-Feed/1.0 (+https://github.com/cgam-coder/vigia-aesan-feed)' \
            'https://www.aesan.gob.es/alertas/alertas-alimentarias' -o /tmp/aesan-landing.html
          echo "bytes=$(wc -c </tmp/aesan-landing.html)"
          echo '--- 2026_65_rev matches ---'
          grep -n -o -E '.{0,180}2026_65_rev.{0,220}' /tmp/aesan-landing.html | head -20 || true
          echo '--- href alert matches ---'
          grep -n -o -E 'href="[^"]*/alertas/[^"]+"' /tmp/aesan-landing.html | head -40 || true
          echo '--- structural markers ---'
          grep -n -o -E '.{0,80}(seeMoreCard|ES2026/517|Ampliaci[^<]{0,120}).{0,160}' /tmp/aesan-landing.html | head -40 || true
