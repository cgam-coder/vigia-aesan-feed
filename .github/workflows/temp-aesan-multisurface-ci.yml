name: TEMP AESAN multisurface validation

on:
  push:
    branches:
      - work/aesan-multisurface-discovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Run live AESAN discovery dry validation
        env:
          OUTPUT_PATH: /tmp/aesan-feed-validation.json
          AESAN_FULL_HISTORY: "0"
        run: |
          cp feed.json "${OUTPUT_PATH}"
          npm run update | tee /tmp/aesan-validation.log
          grep -q '"discoverySurfaces":2' /tmp/aesan-validation.log
          grep -q '"landingOnlyCards":' /tmp/aesan-validation.log
          node - <<'NODE'
          const fs = require('node:fs');
          const feed = JSON.parse(fs.readFileSync(process.env.OUTPUT_PATH, 'utf8'));
          const hit = feed.alerts.find((a) => a.reference === 'ES2026/517');
          if (!hit) throw new Error('ES2026/517 missing after multisurface discovery');
          console.log(JSON.stringify({reference:hit.reference,url:hit.url,title:hit.title,publishedAt:hit.publishedAt,versionCount:hit.versionCount}));
          NODE
