name: V16 F5-C live production browser certification
on:
  push:
    branches: [v16/f5c-live-certification-readonly]
    paths: [".github/workflows/v16-f5c-live.yml"]
permissions:
  contents: read
jobs:
  baseline:
    if: github.event.head_commit.message == 'V16 F5-C live smoke logs-only' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      baseline: ${{ steps.live.outputs.baseline }}
    steps:
      - name: Install pinned browser dependency
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Exact live baseline
        id: live
        run: |
          cat > smoke.mjs <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const phase=process.argv[2],root='https://nagamealert.com',out='evidence';fs.mkdirSync(out,{recursive:true});
          const report={phase,at:new Date().toISOString(),method:'Live production browser HTML/CSS/JS/API; no fixtures, response replacement, data writes or TLS bypass',rows:[],errors:[]};
          const browser=await chromium.launch({headless:true});
          const prior=phase==='after'?JSON.parse(fs.readFileSync(out+'/before.json')):null;
          const save=()=>fs.writeFileSync(out+'/'+phase+'.json',JSON.stringify(report,null,2));
          const white='rgb(255, 255, 255)',cream='rgb(255, 242, 231)';
          async function ctx(width,theme='light',extra={}){const c=await browser.newContext({viewport:{width,height:width===1363?936:width===390?844:700},colorScheme:theme,reducedMotion:'reduce',hasTouch:width!==1363,...extra});await c.addInitScript(theme=>{localStorage.setItem('nagamealert-theme',theme);localStorage.setItem('nagamealert.analytics-consent.v1',JSON.stringify({version:1,choice:'rejected',updatedAt:Date.now()}));},theme);return c;}
          async function settled(p,terminal=false){if(terminal)await p.locator('.na-terminal-results[aria-busy="false"]').waitFor({timeout:60000});await p.evaluate(async()=>{await document.fonts.ready;await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));});await p.waitForTimeout(200);assert.equal(await p.evaluate(()=>document.documentElement.scrollWidth>innerWidth),false);}
          async function go(p,path){const r=await p.goto(root+path,{waitUntil:'domcontentloaded',timeout:60000});assert.equal(r.status(),200);await settled(p,path.startsWith('/es/alertas'));return r;}
          async function paint(p,sel){return p.locator(sel).first().evaluate(n=>{const c=getComputedStyle(n);return {bg:c.backgroundColor,border:c.borderColor,color:c.color,outline:c.outlineStyle,duration:c.transitionDuration,appearance:c.appearance,thumb:getComputedStyle(n,'::before').content};});}
          async function shape(p,sel){return p.locator(sel).evaluate(n=>{const c=getComputedStyle(n),r=n.getBoundingClientRect();return {box:[r.x+scrollX,r.y+scrollY,r.width,r.height],padding:c.padding,grid:c.gridTemplateColumns,gap:c.gap,links:[...n.querySelectorAll('a')].map(x=>[x.textContent,x.getAttribute('href')]),text:n.textContent};});}
          async function run(key,fn){const row={key,status:'RUNNING'};report.rows.push(row);save();try{await fn(row);row.status='PASS';}catch(e){row.status='FAIL';row.reason=e.stack;}save();console.log(JSON.stringify({phase,key,status:row.status,reason:row.reason}));}
          function prev(key){const row=prior?.rows.find(x=>x.key===key);assert.ok(row&&row.status==='PASS','trusted baseline '+key);return row;}
          async function pageContext(width,theme){const c=await ctx(width,theme),p=await c.newPage();p.setDefaultTimeout(20000);p.on('pageerror',e=>report.errors.push(e.message));return {c,p};}
          const routes=['/es/fuentes','/es/metodologia','/es/fuentes/aesan','/es/fuentes/rapna','/es/fuentes/rasff','/es/fuentes/safety-gate','/es/fuentes/oecd'];
          async function support(route,width,theme){const key=route+'-'+width+'-'+theme;await run(key,async row=>{const {c,p}=await pageContext(width,theme);try{await go(p,route);row.footer=await shape(p,'.na-public-footer');row.footerPaint=await paint(p,'.na-public-footer');row.links=await p.locator('main a').evaluateAll(ns=>ns.map(n=>[n.textContent.trim(),n.getAttribute('href')]));row.main=await p.locator('main').evaluate(n=>{const c=getComputedStyle(n);return {padding:c.padding,grid:c.gridTemplateColumns,width:c.width}});row.dark=theme==='dark'?await p.locator('main *').evaluateAll(ns=>ns.filter(n=>!n.closest('.na-source-authority__latest')).map(n=>{const c=getComputedStyle(n);return [n.tagName,n.className,c.backgroundColor,c.backgroundImage,c.color,c.borderColor,c.padding,c.margin,c.width,c.height]})):null;
          if(phase==='after'){const old=prev(key);assert.deepEqual(row.footer,old.footer,'footer exact geometry/content/navigation');assert.deepEqual(row.main,old.main,'main geometry');if(theme==='dark'){assert.deepEqual(row.dark,old.dark,'dark exact computed paint and layout');assert.deepEqual(row.footerPaint,old.footerPaint);}else{assert.equal((await paint(p,'.na-public-shell')).bg,cream);assert.equal(row.footerPaint.bg,white);assert.equal(row.footerPaint.border,'rgb(234, 216, 201)');assert.equal((await paint(p,'.na-public-footer a')).color,'rgb(166, 75, 32)');if(route==='/es/fuentes')assert.equal((await paint(p,'.na-public-layers article')).bg,white);else if(route==='/es/metodologia'){assert.equal((await paint(p,'.na-method-network')).bg,white);assert.equal((await paint(p,'.na-method-network__output')).bg,white);}else{assert.equal((await paint(p,'.na-source-authority__official')).bg,white);assert.ok(await p.locator('.na-source-authority__official a[href^="http"]').count());row.latest=await p.locator('.na-source-authority__latest li a').evaluateAll(ns=>ns.map(n=>[n.textContent,n.getAttribute('href')]));}}}
          if(phase==='after'&&theme==='light')await p.screenshot({path:out+'/'+route.replaceAll('/','-')+'-'+width+'.png',fullPage:true});
          }finally{await c.close();}});}
          async function mapSnap(p){return p.locator('.na-terminal-map').evaluate(m=>{const dim=n=>{const c=getComputedStyle(n),r=n.getBoundingClientRect();return [r.width,r.height,c.width,c.height,c.transform,c.transformOrigin]};return {viewport:dim(m.querySelector('.na-terminal-map__viewport')),canvas:[...m.querySelectorAll('.na-terminal-map__pan,.na-terminal-map__fit,.na-terminal-map__layer,.na-geo-map-geometry')].map(dim),camera:[...m.querySelectorAll('.na-terminal-map__pan,.na-terminal-map__fit,.na-terminal-map__layer')].map(n=>n.getAttribute('style')),geography:[...m.querySelectorAll('.na-geo-map-geometry [data-code]')].map(n=>[n.getAttribute('data-code'),n.getAttribute('d'),n.getAttribute('transform'),n.getAttribute('data-active')]),markers:[...m.querySelectorAll('.na-terminal-map__marker')].map(n=>[n.getAttribute('style'),n.getAttribute('aria-label'),dim(n)]),selected:document.querySelector('.na-alert-card[data-map-selected="true"] h3 a')?.getAttribute('href')||null};});}
          async function mapReady(p){await p.locator('.na-terminal-map__viewport').waitFor({timeout:45000});await p.waitForFunction(()=>{const m=document.querySelector('.na-terminal-map');return m?.querySelector('.na-geo-map-geometry [data-code]')&&!/Cargando|Loading/.test(m.querySelector('.na-terminal-map__status')?.textContent||'');},null,{timeout:45000});await p.waitForTimeout(200);}
          async function map(source,width){const key='map-'+source+'-'+width;await run(key,async row=>{const {c,p}=await pageContext(width,'light');try{await go(p,'/es/alertas?period=30d&source='+encodeURIComponent(source));row.states={};row.count=await p.locator('.na-alert-card').count();assert.ok(row.count);row.href=phase==='after'?prev(key).href:await p.locator('.na-alert-card h3 a').first().getAttribute('href');const card=p.locator('.na-alert-card').filter({has:p.locator('h3 a[href="'+row.href+'"]')});assert.equal(await card.count(),1,'same real selected record');await card.locator('.na-alert-card__map-action').click();await mapReady(p);row.states.selected=await mapSnap(p);if(phase==='after')assert.equal((await paint(p,'.na-terminal-map')).bg,white);
          await p.locator('.na-terminal-map__controls button').first().click();await p.waitForTimeout(200);row.states.zoom=await mapSnap(p);assert.notDeepEqual(row.states.zoom.camera,row.states.selected.camera);
          await p.locator('.na-terminal-map__viewport').press('ArrowRight');await p.waitForTimeout(200);row.states.pan=await mapSnap(p);assert.notDeepEqual(row.states.pan.camera,row.states.zoom.camera);
          await p.locator('.na-terminal-map__controls button').last().click();await p.waitForTimeout(200);row.states.reset=await mapSnap(p);assert.deepEqual(row.states.reset.camera,row.states.selected.camera);
          await p.locator('.na-terminal-map__marker').first().press('Enter');await p.waitForTimeout(200);row.states.marker=await mapSnap(p);
          if(phase==='after')for(const name of Object.keys(row.states))assert.deepEqual(row.states[name],prev(key).states[name],name+' map exact pre-release equality');
          await p.screenshot({path:out+'/'+phase+'-'+key+'.png'});await p.locator('.na-terminal-map__back').click();await mapReady(p);assert.equal((await mapSnap(p)).selected,null);
          const actions=p.locator('.na-geo-map__text-actions button');row.countryCards=await actions.count();if(phase==='after'&&row.countryCards&&width===1363){row.countryPaint=await paint(p,'.na-geo-map__text-actions button');assert.equal(row.countryPaint.bg,'rgb(255, 240, 226)');assert.equal(row.countryPaint.border,'rgb(223, 199, 178)');assert.equal(row.countryPaint.color,'rgb(104, 74, 55)');await actions.first().hover();assert.equal((await paint(p,'.na-geo-map__text-actions button')).bg,'rgb(255, 234, 214)');await p.mouse.move(1,1);await actions.first().press('Tab');await p.keyboard.press('Shift+Tab');assert.equal((await paint(p,'.na-geo-map__text-actions button')).bg,'rgb(255, 234, 214)');await actions.first().press('Enter');await p.waitForTimeout(300);assert.equal((await paint(p,'.na-geo-map__text-actions button')).bg,'rgb(255, 224, 194)');}else if(!row.countryCards)row.countryObservation='naturally unobservable; no data manufactured';
          }finally{await c.close();}});}
          async function change(p,action,predicate=()=>true){const response=p.waitForResponse(r=>r.url().includes('/api/terminal/alerts?')&&predicate(new URL(r.url()).searchParams),{timeout:60000});await action();const r=await response;assert.equal(r.status(),200);const d=await r.json();await settled(p,true);assert.equal(await p.locator('.na-alert-card').count(),d.items.length);return {url:p.url(),query:d.query,total:d.total,facets:d.facets,items:d.items.map(x=>({id:x.id,type:x.aesanAlertType})),pagination:d.pagination};}
          async function functional(width){await run('filters-'+width,async row=>{const {c,p}=await pageContext(width,'light');row.steps=[];try{await go(p,'/es/alertas?period=30d&source=AESAN');if(width!==1363)await p.locator('.na-terminal-filter-trigger').tap();const radios=p.locator('input[type="radio"][name="aesanType"]');assert.equal(await radios.count(),4);assert.equal(await p.locator('input[name="aesanType"]:checked').count(),1);assert.equal((await paint(p,'.na-terminal-filters')).bg,width===1363?white:(await paint(p,'.na-terminal-filters')).bg);if(width!==1363)assert.equal((await paint(p,'.na-terminal-filters__body')).bg,white);row.native=await radios.evaluateAll(ns=>ns.map(n=>({type:n.type,name:n.name,value:n.value,checked:n.checked})));
          for(let i=1;i<4;i++){const val=await radios.nth(i).inputValue();const state=await change(p,()=>width===1363?radios.nth(i).locator('..').click():radios.nth(i).locator('..').tap(),q=>q.get('aesanType')===val);assert.equal(state.query.aesanType,val);assert.equal(new URL(state.url).searchParams.get('aesanType'),val);assert.equal(await p.locator('input[name="aesanType"]:checked').count(),1);assert.ok(state.items.every(x=>x.type===val));const expected=state.facets.aesan[val];assert.equal(state.total,expected);row.steps.push({kind:'classification label/touch',val,state});}
          let state=await change(p,()=>radios.nth(0).locator('..').click(),q=>!q.has('aesanType'));assert.equal(await radios.nth(0).isChecked(),true);assert.equal(state.query.aesanType,null);row.steps.push({kind:'Todas clears',state});
          state=await change(p,()=>radios.nth(0).press('ArrowDown'),q=>q.get('aesanType')===row.native[1].value);assert.equal(await radios.nth(1).isChecked(),true);row.steps.push({kind:'native ArrowDown',state});await radios.nth(1).press('Tab');await p.keyboard.press('Shift+Tab');assert.notEqual((await paint(p,'input[name="aesanType"]:checked')).outline,'none');await radios.nth(1).press('Space');assert.equal(await p.locator('input[name="aesanType"]:checked').count(),1);row.steps.push({kind:'native Space/focus'});
          const domains=p.locator('.na-terminal-filters input[type="checkbox"]');assert.equal(await domains.count(),3);state=await change(p,()=>domains.first().locator('..').click(),q=>q.getAll('domain').length===2);assert.equal(await domains.first().isChecked(),false);row.steps.push({kind:'Domain native label',state});state=await change(p,()=>domains.first().press('Space'),q=>!q.has('domain'));assert.equal(await domains.first().isChecked(),true);row.steps.push({kind:'Domain native Space',state});
          const country=p.locator('#terminal-country');state=await change(p,()=>country.selectOption('ES'),q=>q.get('country')==='ES');assert.equal(state.query.country,'ES');row.steps.push({kind:'country',state});
          if(width!==1363)await p.locator('.na-terminal-filters__close').click();const period=p.locator(width===1363?'#terminal-period-desktop':'#terminal-period-mobile');state=await change(p,()=>period.selectOption('custom'),q=>q.get('period')==='custom');if(width!==1363)await p.locator('.na-terminal-filter-trigger').tap();state=await change(p,()=>p.locator('#terminal-from').fill('2026-09-01'),q=>q.get('from')==='2026-09-01');state=await change(p,()=>p.locator('#terminal-to').fill('2026-10-05'),q=>q.get('to')==='2026-10-05');assert.equal(state.query.to,'2026-10-05');row.steps.push({kind:'custom dates',state});
          state=await change(p,()=>p.getByRole('button',{name:'Restablecer filtros',exact:true}).click(),q=>q.get('period')==='7d'&&!q.has('aesanType'));assert.equal(state.query.aesanType,null);assert.equal(state.query.country,'ALL');row.steps.push({kind:'reset',state});if(width!==1363){await p.locator('.na-terminal-filters__close').click();assert.equal(await p.locator('.na-terminal-filters').getAttribute('open'),null);row.steps.push({kind:'close/no trap',active:await p.evaluate(()=>document.activeElement?.outerHTML)});}
          await p.screenshot({path:out+'/filters-'+width+'.png'});
          }finally{await c.close();}});}
          async function all(width){await run('ALL-'+width,async row=>{const {c,p}=await pageContext(width,'light');try{const response=p.waitForResponse(r=>r.url().includes('/api/terminal/alerts?'));await go(p,'/es/alertas?period=30d');const d=await (await response).json();assert.equal((await paint(p,'.na-terminal-page')).bg,cream);if(width===1363){assert.equal((await paint(p,'.na-terminal-filters')).bg,white);assert.equal(await p.locator('.na-terminal-panorama').count(),1);assert.equal(Number((await p.locator('.na-terminal-panorama__metric > strong').innerText()).replace(/[^0-9]/g,'')),d.total);}assert.equal(await p.locator('.na-terminal-tabs button').count(),6);assert.equal(await p.locator('.na-alert-card').count(),d.items.length);row.footer=await shape(p,'.na-public-footer');assert.equal((await paint(p,'.na-public-footer')).bg,white);row.apiTotal=d.total;row.cards=d.items.slice(0,3).map(x=>x.id);if(d.pagination.hasMore){assert.equal((await paint(p,'.na-alert-pagination')).bg,white);const geometry=await p.locator('.na-alert-pagination').evaluate(n=>({width:n.clientWidth,height:n.clientHeight}));let s=await change(p,()=>p.getByRole('button',{name:'Siguiente página',exact:true}).click(),q=>q.get('cursor')===d.pagination.nextCursor);assert.equal(new URL(s.url).searchParams.get('cursor'),d.pagination.nextCursor);assert.ok((await p.locator('.na-alert-pagination').innerText()).includes('Página 2'));row.pagination={geometry,next:s};s=await change(p,()=>p.goBack(),q=>!q.has('cursor'));row.pagination.previous=s;assert.ok((await p.locator('.na-alert-pagination').innerText()).includes('Página 1'));}await p.screenshot({path:out+'/ALL-'+width+'.png'});}finally{await c.close();}});}
          async function footerNav(){await run('footer-nav-keyboard-touch',async row=>{row.links=[];const {c,p}=await pageContext(1363,'light');try{await go(p,'/es/fuentes');const names=['Inicio','Alertas','Fuentes','Metodología','Aviso legal','Privacidad','Cookies'];for(const name of names){await go(p,'/es/fuentes');const link=p.locator('.na-public-footer').getByRole('link',{name,exact:true});const href=await link.getAttribute('href');await link.press('Enter');await p.waitForURL(root+href);await p.locator('h1').waitFor();row.links.push({name,href,url:p.url()});}await go(p,'/es/fuentes');await p.locator('.na-cookie-settings-link').press('Enter');await p.locator('.na-consent').waitFor();row.keyboardCookies=true;}finally{await c.close();}const mobile=await pageContext(320,'light');try{await go(mobile.p,'/es/metodologia');await mobile.p.locator('.na-cookie-settings-link').tap();await mobile.p.locator('.na-consent').waitFor();row.touchCookies=true;}finally{await mobile.c.close();}});}
          async function a11y(){for(const forced of ['active','none'])await run('a11y-'+forced,async row=>{const c=await ctx(1363,'light',{forcedColors:forced}),p=await c.newPage();try{await go(p,'/es/alertas?period=30d&source=AESAN');const radio=p.locator('input[name="aesanType"]:checked');row.paint=await paint(p,'input[name="aesanType"]:checked');if(forced==='active'){assert.equal(row.paint.appearance,'auto');assert.equal(row.paint.thumb,'none');}else{assert.equal(row.paint.duration,'0s');await radio.press('Tab');await p.keyboard.press('Shift+Tab');assert.notEqual((await paint(p,'input[name="aesanType"]:checked')).outline,'none');}row.native=await radio.evaluate(n=>({type:n.type,name:n.name}));}finally{await c.close();}});}
          async function preserve(){for(const width of [1363,320])await run('HOME-'+width,async row=>{const {c,p}=await pageContext(width,'light');try{await go(p,'/es/');assert.equal(await p.locator('[data-home-version]').getAttribute('data-home-version'),'f7-pixel-locked');await p.screenshot({path:out+'/HOME-'+width+'.png'});}finally{await c.close();}});for(const slug of ['aesan','rapna','rasff','safety-gate','oecd'])await run('F1-'+slug,async row=>{const {c,p}=await pageContext(1363,'dark');try{await go(p,'/es/fuentes/'+slug);const latest=p.locator('.na-source-authority__latest li a').first();assert.ok(await latest.count());row.detail=await latest.getAttribute('href');for(const width of [1363,320]){await p.setViewportSize({width,height:width===320?700:936});await go(p,row.detail);assert.equal(await p.locator('h1').count(),1);assert.ok(await p.locator('.na-alert-detail__hero').count());assert.ok(await p.locator('.na-alert-detail__summary').count());assert.ok(await p.locator('.na-alert-detail a[href^="http"]').count());assert.ok(await p.locator('link[rel="canonical"]').getAttribute('href'));row.source=await p.locator('.na-alert-detail').getAttribute('data-source');await p.screenshot({path:out+'/F1-'+slug+'-'+width+'.png'});}}finally{await c.close();}});}
          try{if(phase==='wait'){const c=await ctx(1363),p=await c.newPage();let found=false;for(let i=0;i<54;i++){await go(p,'/es/fuentes');if((await paint(p,'.na-public-shell')).bg===cream){found=true;break;}console.log('WAITING_FOR_PRODUCTIVE_DAYLIGHT');await p.waitForTimeout(20000);}assert.ok(found,'productive candidate not served');await c.close();console.log('PRODUCTIVE_DAYLIGHT_OBSERVED');}else{for(const route of routes)for(const width of [1363,390,320])for(const theme of ['light','dark'])await support(route,width,theme);for(const source of ['RASFF','SAFETY GATE','OECD'])for(const width of [1363,320])await map(source,width);if(phase==='after'){for(const width of [1363,390,320]){await functional(width);await all(width);}await footerNav();await a11y();await preserve();}assert.deepEqual(report.errors,[]);report.status=report.rows.every(x=>x.status==='PASS')?'PASS':'FAIL';save();console.log('EVIDENCE_GZIP_BASE64 '+(await import('node:zlib')).gzipSync(fs.readFileSync(out+'/'+phase+'.json')).toString('base64'));if(phase==='before'&&report.status==='PASS')fs.appendFileSync(process.env.GITHUB_OUTPUT,'baseline='+(await import('node:zlib')).gzipSync(fs.readFileSync(out+'/before.json')).toString('base64')+'\n');console.log(phase.toUpperCase()+'_SMOKE_TERMINAL '+JSON.stringify({status:report.status,rows:report.rows.length,failures:report.rows.filter(x=>x.status!=='PASS')}));if(report.status!=='PASS')process.exitCode=1;}}finally{await browser.close();}
          JS
          node smoke.mjs before
  productive:
    needs: baseline
    if: github.event.head_commit.message == 'V16 F5-C live smoke logs-only' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Install pinned browser dependency
        run: |
          npm install --no-save --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Live productive smoke
        env:
          BASELINE_GZIP: ${{ needs.baseline.outputs.baseline }}
        run: |
          cat > smoke.mjs <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const phase=process.argv[2],root='https://nagamealert.com',out='evidence';fs.mkdirSync(out,{recursive:true});
          const report={phase,at:new Date().toISOString(),method:'Live production browser HTML/CSS/JS/API; no fixtures, response replacement, data writes or TLS bypass',rows:[],errors:[]};
          const browser=await chromium.launch({headless:true});
          const prior=phase==='after'?JSON.parse(fs.readFileSync(out+'/before.json')):null;
          const save=()=>fs.writeFileSync(out+'/'+phase+'.json',JSON.stringify(report,null,2));
          const white='rgb(255, 255, 255)',cream='rgb(255, 242, 231)';
          async function ctx(width,theme='light',extra={}){const c=await browser.newContext({viewport:{width,height:width===1363?936:width===390?844:700},colorScheme:theme,reducedMotion:'reduce',hasTouch:width!==1363,...extra});await c.addInitScript(theme=>{localStorage.setItem('nagamealert-theme',theme);localStorage.setItem('nagamealert.analytics-consent.v1',JSON.stringify({version:1,choice:'rejected',updatedAt:Date.now()}));},theme);return c;}
          async function settled(p,terminal=false){if(terminal)await p.locator('.na-terminal-results[aria-busy="false"]').waitFor({timeout:60000});await p.evaluate(async()=>{await document.fonts.ready;await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));});await p.waitForTimeout(200);assert.equal(await p.evaluate(()=>document.documentElement.scrollWidth>innerWidth),false);}
          async function go(p,path){const r=await p.goto(root+path,{waitUntil:'domcontentloaded',timeout:60000});assert.equal(r.status(),200);await settled(p,path.startsWith('/es/alertas'));return r;}
          async function paint(p,sel){return p.locator(sel).first().evaluate(n=>{const c=getComputedStyle(n);return {bg:c.backgroundColor,border:c.borderColor,color:c.color,outline:c.outlineStyle,duration:c.transitionDuration,appearance:c.appearance,thumb:getComputedStyle(n,'::before').content};});}
          async function shape(p,sel){return p.locator(sel).evaluate(n=>{const c=getComputedStyle(n),r=n.getBoundingClientRect();return {box:[r.x+scrollX,r.y+scrollY,r.width,r.height],padding:c.padding,grid:c.gridTemplateColumns,gap:c.gap,links:[...n.querySelectorAll('a')].map(x=>[x.textContent,x.getAttribute('href')]),text:n.textContent};});}
          async function run(key,fn){const row={key,status:'RUNNING'};report.rows.push(row);save();try{await fn(row);row.status='PASS';}catch(e){row.status='FAIL';row.reason=e.stack;}save();console.log(JSON.stringify({phase,key,status:row.status,reason:row.reason}));}
          function prev(key){const row=prior?.rows.find(x=>x.key===key);assert.ok(row&&row.status==='PASS','trusted baseline '+key);return row;}
          async function pageContext(width,theme){const c=await ctx(width,theme),p=await c.newPage();p.setDefaultTimeout(20000);p.on('pageerror',e=>report.errors.push(e.message));return {c,p};}
          const routes=['/es/fuentes','/es/metodologia','/es/fuentes/aesan','/es/fuentes/rapna','/es/fuentes/rasff','/es/fuentes/safety-gate','/es/fuentes/oecd'];
          async function support(route,width,theme){const key=route+'-'+width+'-'+theme;await run(key,async row=>{const {c,p}=await pageContext(width,theme);try{await go(p,route);row.footer=await shape(p,'.na-public-footer');row.footerPaint=await paint(p,'.na-public-footer');row.links=await p.locator('main a').evaluateAll(ns=>ns.map(n=>[n.textContent.trim(),n.getAttribute('href')]));row.main=await p.locator('main').evaluate(n=>{const c=getComputedStyle(n);return {padding:c.padding,grid:c.gridTemplateColumns,width:c.width}});row.dark=theme==='dark'?await p.locator('main *').evaluateAll(ns=>ns.filter(n=>!n.closest('.na-source-authority__latest')).map(n=>{const c=getComputedStyle(n);return [n.tagName,n.className,c.backgroundColor,c.backgroundImage,c.color,c.borderColor,c.padding,c.margin,c.width,c.height]})):null;
          if(phase==='after'){const old=prev(key);assert.deepEqual(row.footer,old.footer,'footer exact geometry/content/navigation');assert.deepEqual(row.main,old.main,'main geometry');if(theme==='dark'){assert.deepEqual(row.dark,old.dark,'dark exact computed paint and layout');assert.deepEqual(row.footerPaint,old.footerPaint);}else{assert.equal((await paint(p,'.na-public-shell')).bg,cream);assert.equal(row.footerPaint.bg,white);assert.equal(row.footerPaint.border,'rgb(234, 216, 201)');assert.equal((await paint(p,'.na-public-footer a')).color,'rgb(166, 75, 32)');if(route==='/es/fuentes')assert.equal((await paint(p,'.na-public-layers article')).bg,white);else if(route==='/es/metodologia'){assert.equal((await paint(p,'.na-method-network')).bg,white);assert.equal((await paint(p,'.na-method-network__output')).bg,white);}else{assert.equal((await paint(p,'.na-source-authority__official')).bg,white);assert.ok(await p.locator('.na-source-authority__official a[href^="http"]').count());row.latest=await p.locator('.na-source-authority__latest li a').evaluateAll(ns=>ns.map(n=>[n.textContent,n.getAttribute('href')]));}}}
          if(phase==='after'&&theme==='light')await p.screenshot({path:out+'/'+route.replaceAll('/','-')+'-'+width+'.png',fullPage:true});
          }finally{await c.close();}});}
          async function mapSnap(p){return p.locator('.na-terminal-map').evaluate(m=>{const dim=n=>{const c=getComputedStyle(n),r=n.getBoundingClientRect();return [r.width,r.height,c.width,c.height,c.transform,c.transformOrigin]};return {viewport:dim(m.querySelector('.na-terminal-map__viewport')),canvas:[...m.querySelectorAll('.na-terminal-map__pan,.na-terminal-map__fit,.na-terminal-map__layer,.na-geo-map-geometry')].map(dim),camera:[...m.querySelectorAll('.na-terminal-map__pan,.na-terminal-map__fit,.na-terminal-map__layer')].map(n=>n.getAttribute('style')),geography:[...m.querySelectorAll('.na-geo-map-geometry [data-code]')].map(n=>[n.getAttribute('data-code'),n.getAttribute('d'),n.getAttribute('transform'),n.getAttribute('data-active')]),markers:[...m.querySelectorAll('.na-terminal-map__marker')].map(n=>[n.getAttribute('style'),n.getAttribute('aria-label'),dim(n)]),selected:document.querySelector('.na-alert-card[data-map-selected="true"] h3 a')?.getAttribute('href')||null};});}
          async function mapReady(p){await p.locator('.na-terminal-map__viewport').waitFor({timeout:45000});await p.waitForFunction(()=>{const m=document.querySelector('.na-terminal-map');return m?.querySelector('.na-geo-map-geometry [data-code]')&&!/Cargando|Loading/.test(m.querySelector('.na-terminal-map__status')?.textContent||'');},null,{timeout:45000});await p.waitForTimeout(200);}
          async function map(source,width){const key='map-'+source+'-'+width;await run(key,async row=>{const {c,p}=await pageContext(width,'light');try{await go(p,'/es/alertas?period=30d&source='+encodeURIComponent(source));row.states={};row.count=await p.locator('.na-alert-card').count();assert.ok(row.count);row.href=phase==='after'?prev(key).href:await p.locator('.na-alert-card h3 a').first().getAttribute('href');const card=p.locator('.na-alert-card').filter({has:p.locator('h3 a[href="'+row.href+'"]')});assert.equal(await card.count(),1,'same real selected record');await card.locator('.na-alert-card__map-action').click();await mapReady(p);row.states.selected=await mapSnap(p);if(phase==='after')assert.equal((await paint(p,'.na-terminal-map')).bg,white);
          await p.locator('.na-terminal-map__controls button').first().click();await p.waitForTimeout(200);row.states.zoom=await mapSnap(p);assert.notDeepEqual(row.states.zoom.camera,row.states.selected.camera);
          await p.locator('.na-terminal-map__viewport').press('ArrowRight');await p.waitForTimeout(200);row.states.pan=await mapSnap(p);assert.notDeepEqual(row.states.pan.camera,row.states.zoom.camera);
          await p.locator('.na-terminal-map__controls button').last().click();await p.waitForTimeout(200);row.states.reset=await mapSnap(p);assert.deepEqual(row.states.reset.camera,row.states.selected.camera);
          await p.locator('.na-terminal-map__marker').first().press('Enter');await p.waitForTimeout(200);row.states.marker=await mapSnap(p);
          if(phase==='after')for(const name of Object.keys(row.states))assert.deepEqual(row.states[name],prev(key).states[name],name+' map exact pre-release equality');
          await p.screenshot({path:out+'/'+phase+'-'+key+'.png'});await p.locator('.na-terminal-map__back').click();await mapReady(p);assert.equal((await mapSnap(p)).selected,null);
          const actions=p.locator('.na-geo-map__text-actions button');row.countryCards=await actions.count();if(phase==='after'&&row.countryCards&&width===1363){row.countryPaint=await paint(p,'.na-geo-map__text-actions button');assert.equal(row.countryPaint.bg,'rgb(255, 240, 226)');assert.equal(row.countryPaint.border,'rgb(223, 199, 178)');assert.equal(row.countryPaint.color,'rgb(104, 74, 55)');await actions.first().hover();assert.equal((await paint(p,'.na-geo-map__text-actions button')).bg,'rgb(255, 234, 214)');await p.mouse.move(1,1);await actions.first().press('Tab');await p.keyboard.press('Shift+Tab');assert.equal((await paint(p,'.na-geo-map__text-actions button')).bg,'rgb(255, 234, 214)');await actions.first().press('Enter');await p.waitForTimeout(300);assert.equal((await paint(p,'.na-geo-map__text-actions button')).bg,'rgb(255, 224, 194)');}else if(!row.countryCards)row.countryObservation='naturally unobservable; no data manufactured';
          }finally{await c.close();}});}
          async function change(p,action,predicate=()=>true){const response=p.waitForResponse(r=>r.url().includes('/api/terminal/alerts?')&&predicate(new URL(r.url()).searchParams),{timeout:60000});await action();const r=await response;assert.equal(r.status(),200);const d=await r.json();await settled(p,true);assert.equal(await p.locator('.na-alert-card').count(),d.items.length);return {url:p.url(),query:d.query,total:d.total,facets:d.facets,items:d.items.map(x=>({id:x.id,type:x.aesanAlertType})),pagination:d.pagination};}
          async function functional(width){await run('filters-'+width,async row=>{const {c,p}=await pageContext(width,'light');row.steps=[];try{await go(p,'/es/alertas?period=30d&source=AESAN');if(width!==1363)await p.locator('.na-terminal-filter-trigger').tap();const radios=p.locator('input[type="radio"][name="aesanType"]');assert.equal(await radios.count(),4);assert.equal(await p.locator('input[name="aesanType"]:checked').count(),1);assert.equal((await paint(p,'.na-terminal-filters')).bg,width===1363?white:(await paint(p,'.na-terminal-filters')).bg);if(width!==1363)assert.equal((await paint(p,'.na-terminal-filters__body')).bg,white);row.native=await radios.evaluateAll(ns=>ns.map(n=>({type:n.type,name:n.name,value:n.value,checked:n.checked})));
          for(let i=1;i<4;i++){const val=await radios.nth(i).inputValue();const state=await change(p,()=>width===1363?radios.nth(i).locator('..').click():radios.nth(i).locator('..').tap(),q=>q.get('aesanType')===val);assert.equal(state.query.aesanType,val);assert.equal(new URL(state.url).searchParams.get('aesanType'),val);assert.equal(await p.locator('input[name="aesanType"]:checked').count(),1);assert.ok(state.items.every(x=>x.type===val));const expected=state.facets.aesan[val];assert.equal(state.total,expected);row.steps.push({kind:'classification label/touch',val,state});}
          let state=await change(p,()=>radios.nth(0).locator('..').click(),q=>!q.has('aesanType'));assert.equal(await radios.nth(0).isChecked(),true);assert.equal(state.query.aesanType,null);row.steps.push({kind:'Todas clears',state});
          state=await change(p,()=>radios.nth(0).press('ArrowDown'),q=>q.get('aesanType')===row.native[1].value);assert.equal(await radios.nth(1).isChecked(),true);row.steps.push({kind:'native ArrowDown',state});await radios.nth(1).press('Tab');await p.keyboard.press('Shift+Tab');assert.notEqual((await paint(p,'input[name="aesanType"]:checked')).outline,'none');await radios.nth(1).press('Space');assert.equal(await p.locator('input[name="aesanType"]:checked').count(),1);row.steps.push({kind:'native Space/focus'});
          const domains=p.locator('.na-terminal-filters input[type="checkbox"]');assert.equal(await domains.count(),3);state=await change(p,()=>domains.first().locator('..').click(),q=>q.getAll('domain').length===2);assert.equal(await domains.first().isChecked(),false);row.steps.push({kind:'Domain native label',state});state=await change(p,()=>domains.first().press('Space'),q=>!q.has('domain'));assert.equal(await domains.first().isChecked(),true);row.steps.push({kind:'Domain native Space',state});
          const country=p.locator('#terminal-country');state=await change(p,()=>country.selectOption('ES'),q=>q.get('country')==='ES');assert.equal(state.query.country,'ES');row.steps.push({kind:'country',state});
          if(width!==1363)await p.locator('.na-terminal-filters__close').click();const period=p.locator(width===1363?'#terminal-period-desktop':'#terminal-period-mobile');state=await change(p,()=>period.selectOption('custom'),q=>q.get('period')==='custom');if(width!==1363)await p.locator('.na-terminal-filter-trigger').tap();state=await change(p,()=>p.locator('#terminal-from').fill('2026-09-01'),q=>q.get('from')==='2026-09-01');state=await change(p,()=>p.locator('#terminal-to').fill('2026-10-05'),q=>q.get('to')==='2026-10-05');assert.equal(state.query.to,'2026-10-05');row.steps.push({kind:'custom dates',state});
          state=await change(p,()=>p.getByRole('button',{name:'Restablecer filtros',exact:true}).click(),q=>q.get('period')==='7d'&&!q.has('aesanType'));assert.equal(state.query.aesanType,null);assert.equal(state.query.country,'ALL');row.steps.push({kind:'reset',state});if(width!==1363){await p.locator('.na-terminal-filters__close').click();assert.equal(await p.locator('.na-terminal-filters').getAttribute('open'),null);row.steps.push({kind:'close/no trap',active:await p.evaluate(()=>document.activeElement?.outerHTML)});}
          await p.screenshot({path:out+'/filters-'+width+'.png'});
          }finally{await c.close();}});}
          async function all(width){await run('ALL-'+width,async row=>{const {c,p}=await pageContext(width,'light');try{const response=p.waitForResponse(r=>r.url().includes('/api/terminal/alerts?'));await go(p,'/es/alertas?period=30d');const d=await (await response).json();assert.equal((await paint(p,'.na-terminal-page')).bg,cream);if(width===1363){assert.equal((await paint(p,'.na-terminal-filters')).bg,white);assert.equal(await p.locator('.na-terminal-panorama').count(),1);assert.equal(Number((await p.locator('.na-terminal-panorama__metric > strong').innerText()).replace(/[^0-9]/g,'')),d.total);}assert.equal(await p.locator('.na-terminal-tabs button').count(),6);assert.equal(await p.locator('.na-alert-card').count(),d.items.length);row.footer=await shape(p,'.na-public-footer');assert.equal((await paint(p,'.na-public-footer')).bg,white);row.apiTotal=d.total;row.cards=d.items.slice(0,3).map(x=>x.id);if(d.pagination.hasMore){assert.equal((await paint(p,'.na-alert-pagination')).bg,white);const geometry=await p.locator('.na-alert-pagination').evaluate(n=>({width:n.clientWidth,height:n.clientHeight}));let s=await change(p,()=>p.getByRole('button',{name:'Siguiente página',exact:true}).click(),q=>q.get('cursor')===d.pagination.nextCursor);assert.equal(new URL(s.url).searchParams.get('cursor'),d.pagination.nextCursor);assert.ok((await p.locator('.na-alert-pagination').innerText()).includes('Página 2'));row.pagination={geometry,next:s};s=await change(p,()=>p.goBack(),q=>!q.has('cursor'));row.pagination.previous=s;assert.ok((await p.locator('.na-alert-pagination').innerText()).includes('Página 1'));}await p.screenshot({path:out+'/ALL-'+width+'.png'});}finally{await c.close();}});}
          async function footerNav(){await run('footer-nav-keyboard-touch',async row=>{row.links=[];const {c,p}=await pageContext(1363,'light');try{await go(p,'/es/fuentes');const names=['Inicio','Alertas','Fuentes','Metodología','Aviso legal','Privacidad','Cookies'];for(const name of names){await go(p,'/es/fuentes');const link=p.locator('.na-public-footer').getByRole('link',{name,exact:true});const href=await link.getAttribute('href');await link.press('Enter');await p.waitForURL(root+href);await p.locator('h1').waitFor();row.links.push({name,href,url:p.url()});}await go(p,'/es/fuentes');await p.locator('.na-cookie-settings-link').press('Enter');await p.locator('.na-consent').waitFor();row.keyboardCookies=true;}finally{await c.close();}const mobile=await pageContext(320,'light');try{await go(mobile.p,'/es/metodologia');await mobile.p.locator('.na-cookie-settings-link').tap();await mobile.p.locator('.na-consent').waitFor();row.touchCookies=true;}finally{await mobile.c.close();}});}
          async function a11y(){for(const forced of ['active','none'])await run('a11y-'+forced,async row=>{const c=await ctx(1363,'light',{forcedColors:forced}),p=await c.newPage();try{await go(p,'/es/alertas?period=30d&source=AESAN');const radio=p.locator('input[name="aesanType"]:checked');row.paint=await paint(p,'input[name="aesanType"]:checked');if(forced==='active'){assert.equal(row.paint.appearance,'auto');assert.equal(row.paint.thumb,'none');}else{assert.equal(row.paint.duration,'0s');await radio.press('Tab');await p.keyboard.press('Shift+Tab');assert.notEqual((await paint(p,'input[name="aesanType"]:checked')).outline,'none');}row.native=await radio.evaluate(n=>({type:n.type,name:n.name}));}finally{await c.close();}});}
          async function preserve(){for(const width of [1363,320])await run('HOME-'+width,async row=>{const {c,p}=await pageContext(width,'light');try{await go(p,'/es/');assert.equal(await p.locator('[data-home-version]').getAttribute('data-home-version'),'f7-pixel-locked');await p.screenshot({path:out+'/HOME-'+width+'.png'});}finally{await c.close();}});for(const slug of ['aesan','rapna','rasff','safety-gate','oecd'])await run('F1-'+slug,async row=>{const {c,p}=await pageContext(1363,'dark');try{await go(p,'/es/fuentes/'+slug);const latest=p.locator('.na-source-authority__latest li a').first();assert.ok(await latest.count());row.detail=await latest.getAttribute('href');for(const width of [1363,320]){await p.setViewportSize({width,height:width===320?700:936});await go(p,row.detail);assert.equal(await p.locator('h1').count(),1);assert.ok(await p.locator('.na-alert-detail__hero').count());assert.ok(await p.locator('.na-alert-detail__summary').count());assert.ok(await p.locator('.na-alert-detail a[href^="http"]').count());assert.ok(await p.locator('link[rel="canonical"]').getAttribute('href'));row.source=await p.locator('.na-alert-detail').getAttribute('data-source');await p.screenshot({path:out+'/F1-'+slug+'-'+width+'.png'});}}finally{await c.close();}});}
          try{if(phase==='wait'){const c=await ctx(1363),p=await c.newPage();let found=false;for(let i=0;i<54;i++){await go(p,'/es/fuentes');if((await paint(p,'.na-public-shell')).bg===cream){found=true;break;}console.log('WAITING_FOR_PRODUCTIVE_DAYLIGHT');await p.waitForTimeout(20000);}assert.ok(found,'productive candidate not served');await c.close();console.log('PRODUCTIVE_DAYLIGHT_OBSERVED');}else{for(const route of routes)for(const width of [1363,390,320])for(const theme of ['light','dark'])await support(route,width,theme);for(const source of ['RASFF','SAFETY GATE','OECD'])for(const width of [1363,320])await map(source,width);if(phase==='after'){for(const width of [1363,390,320]){await functional(width);await all(width);}await footerNav();await a11y();await preserve();}assert.deepEqual(report.errors,[]);report.status=report.rows.every(x=>x.status==='PASS')?'PASS':'FAIL';save();console.log('EVIDENCE_GZIP_BASE64 '+(await import('node:zlib')).gzipSync(fs.readFileSync(out+'/'+phase+'.json')).toString('base64'));if(phase==='before'&&report.status==='PASS')fs.appendFileSync(process.env.GITHUB_OUTPUT,'baseline='+(await import('node:zlib')).gzipSync(fs.readFileSync(out+'/before.json')).toString('base64')+'\n');console.log(phase.toUpperCase()+'_SMOKE_TERMINAL '+JSON.stringify({status:report.status,rows:report.rows.length,failures:report.rows.filter(x=>x.status!=='PASS')}));if(report.status!=='PASS')process.exitCode=1;}}finally{await browser.close();}
          JS
          mkdir -p evidence
          node --input-type=module -e "import fs from 'node:fs';import zlib from 'node:zlib';fs.writeFileSync('evidence/before.json',zlib.gunzipSync(Buffer.from(process.env.BASELINE_GZIP,'base64')));"
          node smoke.mjs wait
