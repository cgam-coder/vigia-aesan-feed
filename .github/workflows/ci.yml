name: Feed offline regression tests

on:
  push:
    paths:
      - "scripts/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "scripts/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feed-offline-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run offline tests without production credentials
        run: npm test
