name: Chat repair RASFF version counts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chat-repair-rasff-version-counts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-and-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: vigia-rasff-reconcile
      cancel-in-progress: false
    env:
      VIGIA_BASE_URL: https://vigia-alertas.csar68.chatgpt.site
      VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
    steps:
      - name: Repair bounded version-count mismatches
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VIGIA_SYNC_TOKEN"
          node <<'NODE'
          const base = process.env.VIGIA_BASE_URL;
          const headers = { Authorization:`Bearer ${process.env.VIGIA_SYNC_TOKEN}`, "Content-Type":"application/json" };
          const request = async (path, method="GET") => {
            const response = await fetch(base + path, { method, headers, redirect:"follow", signal:AbortSignal.timeout(600_000) });
            const raw = await response.text();
            let body;
            try { body = JSON.parse(raw); } catch { throw new Error(`${method} ${path} returned non-JSON HTTP ${response.status}`); }
            if (response.status !== 200) throw new Error(`${method} ${path} failed HTTP ${response.status}: ${raw.slice(0,1000)}`);
            return body;
          };

          const before = (await request("/api/rasff/sync?audit=1")).audit;
          const nonVersionIntegrity = Object.entries(before.integrity).filter(([key,value]) => key !== "versionCountMismatches" && value !== 0);
          if (nonVersionIntegrity.length || before.counts.rasffAlerts !== before.counts.rasffUniqueReferences ||
              before.counts.rasffAlerts !== before.counts.rasffSourceIdentities) {
            throw new Error("RASFF repair refused because non-version integrity defects exist: " + JSON.stringify(before));
          }
          const mismatchCount = Number(before.integrity.versionCountMismatches || 0);
          const countDelta = Number(before.counts.rasffVersionCountSum) - Number(before.counts.rasffVersions);
          if (mismatchCount === 0 && countDelta === 0) {
            console.log("RASFF_VERSION_COUNTS_ALREADY_CLEAN");
          } else {
            if (mismatchCount < 1 || mismatchCount > 50) throw new Error(`RASFF bounded repair refused for ${mismatchCount} mismatches`);
            const repair = await request("/api/rasff/sync?mode=repair-version-counts", "POST");
            if (repair.remaining !== 0 || repair.repaired !== mismatchCount) {
              throw new Error("RASFF version-count repair incomplete: " + JSON.stringify(repair));
            }
            console.log("RASFF_VERSION_COUNTS_REPAIRED " + JSON.stringify({ repaired:repair.repaired }));
          }

          const after = (await request("/api/rasff/sync?audit=1")).audit;
          if (Object.values(after.integrity).some((value) => value !== 0) ||
              after.counts.rasffAlerts !== after.counts.rasffUniqueReferences ||
              after.counts.rasffAlerts !== after.counts.rasffSourceIdentities ||
              after.counts.rasffVersions !== after.counts.rasffVersionCountSum) {
            throw new Error("RASFF audit not clean after repair: " + JSON.stringify(after));
          }
          console.log("RASFF_AUDIT_CLEAN " + JSON.stringify({ alerts:after.counts.rasffAlerts, versions:after.counts.rasffVersions }));
          NODE

      - name: Resume existing reconcile checkpoint to completion
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = process.env.VIGIA_BASE_URL;
          const headers = { Authorization:`Bearer ${process.env.VIGIA_SYNC_TOKEN}`, "Content-Type":"application/json" };
          const SEARCH_URL = "https://webgate.ec.europa.eu/rasff-window/backend/public/notification/search/consolidated/en/";
          const recoverable = (state) => Boolean(state?.status === "failed" &&
            state.leaseOwnerId === null && state.leaseMode === null && state.leaseExpiresAt === null && (
              state.lastError === "D1_ERROR: out of memory: SQLITE_NOMEM" ||
              /^D1_ERROR: internal error; reference = [a-z0-9]+$/u.test(state.lastError || "") ||
              state.lastError === "RASFF agotó el timeout para " + SEARCH_URL ||
              state.lastError === "RASFF abortó la petición para " + SEARCH_URL ||
              state.lastError === "RASFF sufrió un fallo de red para " + SEARCH_URL ||
              state.lastError === "RASFF reconciliation index changed during cursor recovery" ||
              state.lastError === "RASFF reconciliation index changed during batch discovery" ||
              /^RASFF devolvió HTTP (?:429|5\d\d) para https:\/\/webgate\.ec\.europa\.eu\/rasff-window\/backend\/public\/notification\/search\/consolidated\/en\/$/u.test(state.lastError || "")
            ));
          const observe = async () => {
            const response = await fetch(base + "/api/rasff/sync?observe=1", { headers, signal:AbortSignal.timeout(60_000) });
            const body = await response.json();
            if (response.status !== 200) throw new Error("RASFF observe failed HTTP " + response.status);
            return body;
          };
          const initial = await observe();
          if (initial.lease) throw new Error("RASFF repair resume found active lease");
          if (initial.backfill?.coverage !== "official-index-complete") throw new Error("RASFF historical backfill coverage is not complete");
          let priorCursor = initial.reconcile?.status === "partial" ? Number(initial.reconcile.cursor || 0) : 0;
          for (let batchNo=1; batchNo<=100; batchNo++) {
            let body;
            for (let attempt=1; attempt<=5; attempt++) {
              const response = await fetch(base + "/api/rasff/sync?mode=reconcile&batchSize=40", {
                method:"POST", headers, redirect:"follow", signal:AbortSignal.timeout(600_000),
              });
              const raw = await response.text();
              try { body = JSON.parse(raw); } catch { throw new Error("RASFF reconcile returned non-JSON HTTP " + response.status); }
              if (response.status === 200) break;
              if (response.status === 202 && body?.state?.status === "skipped") throw new Error("RASFF reconcile unexpectedly skipped: " + JSON.stringify(body));
              if (response.status !== 503 || !recoverable(body?.state) || attempt === 5)
                throw new Error("RASFF reconcile failed HTTP " + response.status + ": " + raw.slice(0,1000));
              await new Promise((resolve) => setTimeout(resolve, attempt * 5_000));
            }
            const state = body?.state;
            if (!state || state.source !== "RASFF" || state.mode !== "reconcile" || !["partial","completed"].includes(state.status) ||
                state.leaseOwnerId !== null || state.leaseMode !== null || state.leaseExpiresAt !== null) {
              throw new Error("RASFF reconcile contract invalid: " + JSON.stringify(state));
            }
            if (state.status === "completed") {
              if (state.cursor !== 0 || state.cursorKey !== null || state.coverage !== "official-index-complete")
                throw new Error("RASFF reconcile terminal state invalid: " + JSON.stringify(state));
              console.log("RASFF_RECONCILE_COMPLETED " + JSON.stringify({ batchNo, completedAt:state.completedAt, totalUnits:state.totalUnits }));
              const finalAuditResponse = await fetch(base + "/api/rasff/sync?audit=1", { headers, signal:AbortSignal.timeout(120_000) });
              const finalAudit = (await finalAuditResponse.json()).audit;
              if (finalAuditResponse.status !== 200 || Object.values(finalAudit.integrity).some((value) => value !== 0) ||
                  finalAudit.counts.rasffVersions !== finalAudit.counts.rasffVersionCountSum) {
                throw new Error("RASFF final audit failed: " + JSON.stringify(finalAudit));
              }
              process.exit(0);
            }
            if (Number(state.cursor) <= priorCursor || !state.cursorKey) throw new Error("RASFF reconcile cursor did not advance");
            priorCursor = Number(state.cursor);
            console.log("RASFF_RECONCILE_PROGRESS " + JSON.stringify({ batchNo, cursor:state.cursor, totalUnits:state.totalUnits }));
          }
          throw new Error("RASFF reconcile did not complete within 100 bounded batches");
          NODE
