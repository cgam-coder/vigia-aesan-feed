name: Temporary SEO brand Preview smoke

on:
  push:
    branches: [ops/seo-brand-preview-smoke-20260928]
    paths:
      - ".github/workflows/seo-brand-preview-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose and validate runtime Preview root-home SEO contract
        shell: bash
        run: |
          set -euo pipefail
          base="https://work-seo-brand-f1-root-home-vigia-runtime.c-gamiz93.workers.dev"

          fetch_one() {
            local path="$1"
            local code
            code="$(curl -sS --max-time 30 -o /tmp/body -D /tmp/headers -w '%{http_code}' "$base$path")"
            echo "===== $path => $code ====="
            grep -iE '^(location|x-robots-tag|content-type):' /tmp/headers || true
            echo "-- links/meta/jsonld --"
            grep -oE '<link[^>]+(canonical|alternate)[^>]*>|<meta[^>]+robots[^>]*>|"@type":"WebSite"|"alternateName":\[[^]]+\]|<title>[^<]+</title>' /tmp/body | head -30 || true
            echo "-- body size --"
            wc -c /tmp/body
            echo "$code"
          }

          test "$(fetch_one "/" | tee /tmp/root.out | tail -1)" = "200"
          cat /tmp/root.out
          grep -Fq 'https://nagamealert.com/' /tmp/body
          grep -Fq '"@type":"WebSite"' /tmp/body
          grep -Fq '"alternateName":["Nagame Alert","nagamealert.com"]' /tmp/body
          grep -Fq 'NagameAlert | Alertas y notificaciones oficiales' /tmp/body

          for p in /es /es/ '/es/?utm_source=linkedin' /en /en/; do
            fetch_one "$p" | tee "/tmp/$(echo "$p" | tr '/?=&' '_____').out"
          done

          echo "SEO-BRAND Preview diagnostic completed"
