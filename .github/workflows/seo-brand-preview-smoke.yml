name: Temporary SEO brand production diagnostic

on:
  push:
    branches: [ops/seo-brand-preview-smoke-20260928]
    paths:
      - ".github/workflows/seo-brand-preview-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose production root-home SEO contract
        shell: bash
        run: |
          set -euo pipefail
          base="https://nagamealert.com"

          fetch_one() {
            local path="$1"
            local slug
            slug="$(echo "$path" | tr '/?=&' '_____')"
            local body="/tmp/body-${slug}"
            local headers="/tmp/headers-${slug}"
            local code
            code="$(curl -sS --max-time 30 \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              -H 'User-Agent: NagameAlert-SEO-Brand-Diagnostic/1.0' \
              -o "$body" -D "$headers" -w '%{http_code}' "$base$path")"
            echo "===== $path => $code ====="
            grep -iE '^(location|x-robots-tag|content-type|cf-cache-status|age):' "$headers" || true
            echo "-- TITLE --"
            grep -oE '<title[^>]*>[^<]*</title>' "$body" | head -5 || true
            echo "-- CANONICAL / ALTERNATES --"
            grep -oE '<link[^>]+(canonical|alternate)[^>]*>' "$body" | head -20 || true
            echo "-- ROBOTS --"
            grep -oE '<meta[^>]+(robots|googlebot)[^>]*>' "$body" | head -10 || true
            echo "-- WEBSITE JSONLD --"
            grep -oE '"@type":"WebSite"|"name":"NagameAlert"|"alternateName":[^,}]*|"url":"https://nagamealert.com/"' "$body" | head -20 || true
            echo "-- BRAND / H1 --"
            grep -oE '<h1[^>]*>[^<]*(<[^>]+>[^<]*</[^>]+>)*[^<]*</h1>' "$body" | head -5 || true
            echo "-- BYTES --"
            wc -c "$body"
          }

          fetch_one "/"
          fetch_one "/es"
          fetch_one "/es/"
          fetch_one "/en"
          fetch_one "/en/"
          fetch_one "/robots.txt"
          fetch_one "/sitemap.xml"
          fetch_one "/sitemaps/static-es.xml"
