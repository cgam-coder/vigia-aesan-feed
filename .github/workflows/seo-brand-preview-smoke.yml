name: Temporary SEO brand production diagnostic

on:
  push:
    branches: [ops/seo-brand-preview-smoke-20260928]
    paths:
      - ".github/workflows/seo-brand-preview-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose production root-home metadata
        shell: bash
        run: |
          set -euo pipefail
          base="https://nagamealert.com"
          for path in / /es /es/ /en /en/ /sitemaps/static-es.xml /robots.txt; do
            echo "===== $path ====="
            code="$(curl -sS --max-time 30 -o /tmp/body -D /tmp/headers -w '%{http_code}' "$base$path")"
            echo "status=$code"
            grep -iE '^(location|x-robots-tag|content-type|cf-ray|date):' /tmp/headers || true
            if [[ "$path" == "/" || "$path" == "/en/" ]]; then
              echo "-- metadata --"
              grep -oE '<title>[^<]+</title>|<meta[^>]+(?:robots|googlebot)[^>]*>|<link[^>]+(?:canonical|alternate)[^>]*>|"@type":"WebSite"|"alternateName":\[[^]]+\]|"url":"https://nagamealert.com/"' /tmp/body | head -40 || true
            elif [[ "$path" == "/sitemaps/static-es.xml" ]]; then
              grep -o '<loc>[^<]*</loc>' /tmp/body | head -20 || true
            else
              head -10 /tmp/body || true
            fi
          done
          echo "diagnostic complete"
