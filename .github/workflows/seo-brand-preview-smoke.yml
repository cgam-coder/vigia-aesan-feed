name: Temporary SEO brand Preview smoke

on:
  push:
    branches: [ops/seo-brand-preview-smoke-20260928]
    paths:
      - ".github/workflows/seo-brand-preview-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate runtime Preview routing and isolation
        shell: bash
        run: |
          set -euo pipefail
          base="https://work-seo-brand-f1-root-home-vigia-runtime.c-gamiz93.workers.dev"

          request() {
            local path="$1"
            curl -sS --max-time 30 -o /tmp/body -D /tmp/headers -w '%{http_code}' "$base$path"
          }

          expect_status() {
            local path="$1" expected="$2"
            local code
            code="$(request "$path")"
            echo "$path => $code"
            test "$code" = "$expected"
          }

          expect_redirect() {
            local path="$1" expected_suffix="$2"
            expect_status "$path" 308
            local location
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/,""); print $2}' /tmp/headers)"
            echo "$path location=$location"
            case "$location" in
              "$base$expected_suffix"|"$expected_suffix") ;;
              *) echo "Unexpected redirect: $location"; exit 1 ;;
            esac
          }

          expect_status "/" 200
          grep -Fq 'NagameAlert | Alertas y notificaciones oficiales' /tmp/body
          grep -Fq 'Portal de Alertas y Notificaciones Oficiales' /tmp/body
          grep -qi '^x-robots-tag: noindex' /tmp/headers
          grep -Fq '<meta name="robots" content="noindex, follow"/>' /tmp/body
          if grep -Fq 'rel="canonical"' /tmp/body; then
            echo "Technical Preview unexpectedly emitted canonical metadata"; exit 1
          fi

          expect_redirect "/es" "/"
          expect_redirect "/es/" "/"
          expect_redirect "/es/?utm_source=linkedin" "/?utm_source=linkedin"

          expect_redirect "/en" "/en/"
          expect_status "/en/" 200
          grep -Fq 'NagameAlert | Official alerts and notifications' /tmp/body
          grep -qi '^x-robots-tag: noindex' /tmp/headers

          echo "SEO-BRAND Preview routing/isolation PASS"
