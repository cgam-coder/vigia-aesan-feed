name: Temporary SEO brand production smoke final

on:
  push:
    branches: [ops/seo-brand-preview-smoke-20260928]
    paths:
      - ".github/workflows/seo-brand-preview-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate production root-home SEO contract
        shell: bash
        run: |
          set -euo pipefail
          base="https://nagamealert.com"

          request() {
            local path="$1"
            curl -sS --max-time 30 \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              -H 'User-Agent: NagameAlert-SEO-Brand-Release/1.0' \
              -o /tmp/body -D /tmp/headers -w '%{http_code}' "$base$path"
          }

          expect_status() {
            local path="$1" expected="$2"
            local code
            code="$(request "$path")"
            echo "$path => $code"
            test "$code" = "$expected"
          }

          expect_redirect() {
            local path="$1" expected_suffix="$2"
            expect_status "$path" 308
            local location
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/\r$/,""); print $2}' /tmp/headers)"
            echo "$path location=$location"
            case "$location" in
              "$base$expected_suffix"|"$expected_suffix") ;;
              *) echo "Unexpected redirect: $location"; exit 1 ;;
            esac
          }

          expect_status "/" 200
          grep -Fq '<title>NagameAlert | Alertas y notificaciones oficiales</title>' /tmp/body
          grep -Fq '<link rel="canonical" href="https://nagamealert.com/"/>' /tmp/body
          grep -Fq '<link rel="alternate" hrefLang="es" href="https://nagamealert.com/"/>' /tmp/body
          grep -Fq '<link rel="alternate" hrefLang="en" href="https://nagamealert.com/en/"/>' /tmp/body
          grep -Fq '<link rel="alternate" hrefLang="x-default" href="https://nagamealert.com/"/>' /tmp/body
          grep -Fq '<meta name="robots" content="index, follow"/>' /tmp/body
          grep -Fq '"@type":"WebSite"' /tmp/body
          grep -Fq '"name":"NagameAlert"' /tmp/body
          grep -Fq '"alternateName":["Nagame Alert","nagamealert.com"]' /tmp/body
          grep -Fq '"url":"https://nagamealert.com/"' /tmp/body
          if grep -qi '^x-robots-tag:.*noindex' /tmp/headers; then echo "Root unexpectedly noindex"; exit 1; fi

          expect_redirect "/es" "/"
          expect_redirect "/es/" "/"
          expect_redirect "/es/?utm_source=linkedin" "/?utm_source=linkedin"

          expect_redirect "/en" "/en/"
          expect_status "/en/" 200
          grep -Fq '<title>NagameAlert | Official alerts and notifications</title>' /tmp/body
          grep -Fq '<link rel="canonical" href="https://nagamealert.com/en/"/>' /tmp/body
          grep -Fq '<link rel="alternate" hrefLang="es" href="https://nagamealert.com/"/>' /tmp/body
          grep -Fq '<link rel="alternate" hrefLang="x-default" href="https://nagamealert.com/"/>' /tmp/body
          if grep -Fq '"@type":"WebSite"' /tmp/body; then echo "English home has duplicate site-level WebSite"; exit 1; fi

          expect_status "/robots.txt" 200
          grep -Fq 'Sitemap: https://nagamealert.com/sitemap.xml' /tmp/body

          expect_status "/sitemap.xml" 200
          grep -Fq '<sitemapindex' /tmp/body

          expect_status "/sitemaps/static-es.xml" 200
          grep -Fq '<loc>https://nagamealert.com/</loc>' /tmp/body
          if grep -Fq '<loc>https://nagamealert.com/es/</loc>' /tmp/body; then
            echo "Legacy /es/ home still emitted in static sitemap"; exit 1
          fi

          echo "SEO-BRAND production smoke PASS"
