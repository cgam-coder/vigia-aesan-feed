name: VIGIA RASFF staged backfill completion

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rasff-product-description-backfill.yml"

permissions:
  contents: read

concurrency:
  group: vigia-rasff-controlled-activation
  cancel-in-progress: true

jobs:
  stopped:
    runs-on: ubuntu-latest
    steps:
      - name: Preserve current checkpoint after Sites divergence STOP
        run: echo "RASFF writes remain stopped pending explicit authorization."
