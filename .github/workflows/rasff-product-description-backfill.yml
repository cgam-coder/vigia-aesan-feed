name: VIGIA RASFF final recent certification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rasff-product-description-backfill.yml"

permissions:
  contents: read

concurrency:
  group: vigia-rasff-controlled-activation
  cancel-in-progress: false

jobs:
  recent-twice:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VIGIA_BASE_URL: https://vigia-alertas.csar68.chatgpt.site
      VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
    steps:
      - name: Run and certify recent twice
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VIGIA_SYNC_TOKEN"
          node <<'NODE'
          const base = process.env.VIGIA_BASE_URL;
          const headers = { Authorization:"Bearer " + process.env.VIGIA_SYNC_TOKEN, "Content-Type":"application/json" };
          const call = async (path, method = "GET") => {
            const response = await fetch(base + path, { method, headers, redirect:"follow", signal:AbortSignal.timeout(600_000) });
            const raw = await response.text();
            let body;
            try { body = JSON.parse(raw); }
            catch { throw new Error(method + " " + path + " returned non-JSON HTTP " + response.status); }
            if (response.status !== 200) throw new Error(method + " " + path + " failed HTTP " + response.status + ": " + raw.slice(0, 1000));
            return body;
          };
          const assertAudit = (audit, label) => {
            const anomalies = Object.entries(audit.integrity).filter(([, value]) => value !== 0);
            if (anomalies.length || audit.productDomains.missingOrStaleDimensionState !== 0 ||
                audit.counts.rasffAlerts !== audit.counts.rasffUniqueReferences ||
                audit.counts.rasffAlerts !== audit.counts.rasffSourceIdentities ||
                audit.counts.rasffVersions !== audit.counts.rasffVersionCountSum)
              throw new Error(label + " audit failed: " + JSON.stringify({ anomalies, counts:audit.counts }));
          };
          const counts = (audit) => ({ AESAN:audit.counts.aesanAlerts, RAPNA:audit.counts.rapnaAlerts,
            RASFF:audit.counts.rasffAlerts, "SAFETY GATE":audit.counts.safetyGateAlerts, OECD:audit.counts.oecdAlerts,
            versions:audit.counts.rasffVersions });
          const validDeferred = (state) => (state.deferredDetails || []).every((item) =>
            ["transport", "upstream"].includes(item.classification) &&
            ["http-429", "http-5xx", "timeout", "aborted", "network"].includes(item.reason));
          const initialObserve = await call("/api/rasff/sync?observe=1");
          const before = (await call("/api/rasff/sync?audit=1")).audit;
          assertAudit(before, "recent-before");
          if (initialObserve.lease !== null || initialObserve.backfill?.coverage !== "official-index-complete" ||
              initialObserve.reconcile?.status !== "completed") throw new Error("Recent requires completed reconcile and free lease");
          const first = (await call("/api/rasff/sync?mode=recent", "POST")).state;
          const middleObserve = await call("/api/rasff/sync?observe=1");
          const middle = (await call("/api/rasff/sync?audit=1")).audit;
          assertAudit(middle, "recent-first");
          if (first?.status !== "completed" || !validDeferred(first) ||
              first.detailFailures !== (first.deferredDetails || []).length ||
              first.leaseOwnerId !== null || middleObserve.lease !== null)
            throw new Error("First recent state/deferred/lease contract failed: " + JSON.stringify(first));
          const second = (await call("/api/rasff/sync?mode=recent", "POST")).state;
          const finalObserve = await call("/api/rasff/sync?observe=1");
          const after = (await call("/api/rasff/sync?audit=1")).audit;
          assertAudit(after, "recent-second");
          if (second?.status !== "completed" || !validDeferred(second) ||
              second.detailFailures !== (second.deferredDetails || []).length ||
              second.newCount !== 0 || second.updatedCount !== 0 || second.recordsPersisted !== 0 ||
              second.leaseOwnerId !== null || finalObserve.lease !== null)
            throw new Error("Second recent is not idempotent: " + JSON.stringify(second));
          const beforeCounts = counts(before), afterCounts = counts(after);
          for (const source of ["AESAN", "RAPNA", "SAFETY GATE", "OECD"])
            if (afterCounts[source] < beforeCounts[source]) throw new Error(source + " regressed during RASFF recent");
          if (JSON.stringify(counts(middle)) !== JSON.stringify(afterCounts))
            throw new Error("Corpus drifted between equivalent recent runs");
          console.log("RECENT_BEFORE " + JSON.stringify(before));
          console.log("RECENT_FIRST " + JSON.stringify(first));
          console.log("RECENT_MIDDLE " + JSON.stringify(middle));
          console.log("RECENT_SECOND " + JSON.stringify(second));
          console.log("RECENT_AFTER " + JSON.stringify(after));
          console.log("RECENT_FINAL_OBSERVE " + JSON.stringify(finalObserve));
          NODE
