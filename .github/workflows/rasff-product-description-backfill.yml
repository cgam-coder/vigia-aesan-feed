name: VIGIA RASFF deferred-detail staged reconcile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rasff-product-description-backfill.yml"

permissions:
  contents: read

concurrency:
  group: vigia-rasff-controlled-activation
  cancel-in-progress: false

jobs:
  staged-reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VIGIA_BASE_URL: https://vigia-alertas.csar68.chatgpt.site
      VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
      STAGE_BATCHES: "400"
      STAGE_MARKER: "reconcile-1-recovery-20"
      BATCH_SIZE: "20"
      ALLOW_EMPTY_STATE: "false"
    steps:
      - name: Reconcile exact official index with deferred-detail semantics
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VIGIA_SYNC_TOKEN"
          node <<'NODE'
          const base = process.env.VIGIA_BASE_URL;
          const headers = { Authorization:"Bearer " + process.env.VIGIA_SYNC_TOKEN, "Content-Type":"application/json" };
          const MAX_BATCHES = Number(process.env.STAGE_BATCHES);
          const BATCH_SIZE = Number(process.env.BATCH_SIZE);
          const call = async (path, method = "GET") => {
            const response = await fetch(base + path, { method, headers, redirect:"follow", signal:AbortSignal.timeout(600_000) });
            const text = await response.text();
            let body;
            try { body = JSON.parse(text); }
            catch { throw new Error(method + " " + path + " returned non-JSON HTTP " + response.status); }
            if (response.status !== 200) throw new Error(method + " " + path + " failed HTTP " + response.status + ": " + text.slice(0, 1000));
            return body;
          };
          const sourceCounts = (audit) => ({ AESAN:audit.counts.aesanAlerts, RAPNA:audit.counts.rapnaAlerts,
            "SAFETY GATE":audit.counts.safetyGateAlerts, OECD:audit.counts.oecdAlerts });
          const assertAudit = (audit, label) => {
            const anomalies = Object.entries(audit.integrity).filter(([, value]) => value !== 0);
            if (anomalies.length || audit.productDomains.missingOrStaleDimensionState !== 0 ||
                audit.counts.rasffAlerts !== audit.counts.rasffUniqueReferences ||
                audit.counts.rasffAlerts !== audit.counts.rasffSourceIdentities ||
                audit.counts.rasffVersions !== audit.counts.rasffVersionCountSum)
              throw new Error(label + " audit failed: " + JSON.stringify({ anomalies, counts:audit.counts, domains:audit.productDomains }));
          };
          const compact = (state) => ({ status:state.status, cursor:state.cursor, cursorKey:state.cursorKey,
            totalUnits:state.totalUnits, pagesScanned:state.pagesScanned, recordsObserved:state.recordsObserved,
            recordsPersisted:state.recordsPersisted, newCount:state.newCount, updatedCount:state.updatedCount,
            detailFailures:state.detailFailures, pageErrors:state.pageErrors, coverage:state.coverage,
            lastError:state.lastError, leaseOwnerId:state.leaseOwnerId, leaseMode:state.leaseMode,
            leaseExpiresAt:state.leaseExpiresAt });

          const observe = await call("/api/rasff/sync?observe=1");
          const initialAudit = (await call("/api/rasff/sync?audit=1")).audit;
          const preflight = await call("/api/rasff/sync?mode=preflight", "POST");
          assertAudit(initialAudit, "reconcile-initial");
          if (observe.lease !== null || observe.backfill?.status !== "completed" ||
              observe.backfill?.coverage !== "official-index-complete") throw new Error("Reconcile requires completed backfill and a free lease");
          if (observe.reconcile?.status === "failed") {
            const recoverableD1Oom = observe.reconcile.lastError === "D1_ERROR: out of memory: SQLITE_NOMEM" &&
              observe.reconcile.pageErrors > 0 && observe.reconcile.leaseOwnerId === null &&
              observe.reconcile.leaseMode === null && observe.reconcile.leaseExpiresAt === null;
            if (!recoverableD1Oom) throw new Error("Reconcile is failed before this stage: " + observe.reconcile.lastError);
            console.log("RECONCILE_RECOVERABLE_GLOBAL " + JSON.stringify({ marker:process.env.STAGE_MARKER,
              cursor:observe.reconcile.cursor, cursorKey:observe.reconcile.cursorKey,
              pageErrors:observe.reconcile.pageErrors, lastError:observe.reconcile.lastError }));
          }
          if (!observe.reconcile && process.env.ALLOW_EMPTY_STATE !== "true") throw new Error("Reconcile state unexpectedly missing");
          if (observe.reconcile?.status === "completed") throw new Error("Reconcile sweep is already completed; refusing implicit restart");
          let prior = observe.reconcile || { source:"RASFF", mode:"reconcile", status:"idle", cursor:0, cursorKey:null,
            totalUnits:preflight.officialIndex.totalElements, pagesScanned:0, recordsObserved:0, recordsPersisted:0,
            newCount:0, updatedCount:0, detailFailures:0, pageErrors:0, coverage:"unknown",
            leaseOwnerId:null, leaseMode:null, leaseExpiresAt:null };
          const preview = await call("/api/rasff/sync?mode=preview-reconcile&cursor=" + prior.cursor +
            "&cursorKey=" + encodeURIComponent(prior.cursorKey || "") + "&batchSize=" + BATCH_SIZE, "POST");
          console.log("RECONCILE_STAGE_INITIAL " + JSON.stringify({ marker:process.env.STAGE_MARKER, observe, audit:initialAudit, preflight, preview }));
          const baselineSources = sourceCounts(initialAudit);
          let executed = 0;
          for (let batch = 1; batch <= MAX_BATCHES && prior.status !== "completed"; batch++) {
            const body = await call("/api/rasff/sync?mode=reconcile&batchSize=" + BATCH_SIZE, "POST");
            const state = body.state;
            if (!state || state.source !== "RASFF" || state.mode !== "reconcile" || !["partial", "completed"].includes(state.status))
              throw new Error("Reconcile batch " + batch + " returned invalid state");
            const deferred = Array.isArray(state.deferredDetails) ? state.deferredDetails : [];
            if (state.pageErrors !== prior.pageErrors || state.detailFailures - prior.detailFailures !== deferred.length ||
                deferred.some((item) => !["transport", "upstream"].includes(item.classification) ||
                  !["http-429", "http-5xx", "timeout", "aborted", "network"].includes(item.reason)))
              throw new Error("Reconcile batch " + batch + " error classification/counter mismatch");
            if (state.recordsObserved <= prior.recordsObserved || state.recordsPersisted < prior.recordsPersisted ||
                state.newCount < prior.newCount || state.updatedCount < prior.updatedCount)
              throw new Error("Reconcile batch " + batch + " counters regressed");
            if (state.status === "partial" && (state.cursor <= prior.cursor || !state.cursorKey))
              throw new Error("Reconcile batch " + batch + " cursor did not advance");
            if (state.status === "completed" && (state.cursor !== 0 || state.cursorKey !== null ||
                state.coverage !== "official-index-complete")) throw new Error("Reconcile completed with invalid terminal state");
            if (state.leaseOwnerId !== null || state.leaseMode !== null || state.leaseExpiresAt !== null)
              throw new Error("Reconcile batch " + batch + " response retained a lease");
            executed++;
            console.log("RECONCILE_BATCH " + JSON.stringify({ batch, stage:process.env.STAGE_MARKER,
              state:compact(state), deferredDetails:deferred }));
            prior = state;
            if (batch % 25 === 0 || state.status === "completed") {
              const audit = (await call("/api/rasff/sync?audit=1")).audit;
              assertAudit(audit, "reconcile-batch-" + batch);
              const counts = sourceCounts(audit);
              for (const source of Object.keys(baselineSources)) if (counts[source] < baselineSources[source])
                throw new Error("Other source regressed during reconcile: " + source);
              console.log("RECONCILE_AUDIT " + JSON.stringify({ batch, stage:process.env.STAGE_MARKER, audit }));
            }
          }
          const finalObserve = await call("/api/rasff/sync?observe=1");
          const finalAudit = (await call("/api/rasff/sync?audit=1")).audit;
          assertAudit(finalAudit, "reconcile-stage-final");
          if (finalObserve.lease !== null) throw new Error("Reconcile stage ended with active lease");
          console.log("RECONCILE_STAGE_COMPLETE " + JSON.stringify({ marker:process.env.STAGE_MARKER, executed,
            state:compact(finalObserve.reconcile), audit:finalAudit }));
          NODE
