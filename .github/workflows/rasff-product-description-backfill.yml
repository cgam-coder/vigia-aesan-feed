name: VIGIA RASFF resume complete backfill

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rasff-product-description-backfill.yml"

permissions:
  contents: read

concurrency:
  group: vigia-rasff-controlled-activation
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      VIGIA_BASE_URL: https://vigia-alertas.csar68.chatgpt.site
      VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
    steps:
      - name: Resume and complete RASFF backfill without restart
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VIGIA_SYNC_TOKEN"
          node <<'NODE'
          const base = process.env.VIGIA_BASE_URL;
          const headers = { Authorization:`Bearer ${process.env.VIGIA_SYNC_TOKEN}` };
          const MAX_REQUESTS = 1_200;
          const BATCH_SIZE = 40;

          (async () => {

          const request = async (path, method = "GET") => {
            let last;
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                const response = await fetch(base + path, { method, headers, redirect:"follow", signal:AbortSignal.timeout(600_000) });
                const text = await response.text();
                let body;
                try { body = JSON.parse(text); }
                catch { throw new Error(`${method} ${path} returned non-JSON HTTP ${response.status}: ${text.slice(0, 240)}`); }
                return { status:response.status, body };
              } catch (error) { last = error; }
              if (attempt < 3) await new Promise((resolve) => setTimeout(resolve, attempt * 3_000));
            }
            throw last;
          };
          const call = async (path, method = "GET") => {
            const result = await request(path, method);
            if (result.status !== 200) throw new Error(`${method} ${path} failed HTTP ${result.status}: ${JSON.stringify(result.body).slice(0, 500)}`);
            return result.body;
          };
          const sourceCounts = (audit) => ({
            AESAN:audit.counts.aesanAlerts,
            RAPNA:audit.counts.rapnaAlerts,
            "SAFETY GATE":audit.counts.safetyGateAlerts,
            OECD:audit.counts.oecdAlerts,
          });
          const assertIntegrity = (audit, label) => {
            const anomalies = Object.entries(audit.integrity).filter(([, value]) => value !== 0);
            const domains = audit.productDomains;
            const geography = audit.geography;
            const hazards = audit.hazards;
            if (anomalies.length || audit.counts.rasffMissingProductAlerts !== 0 ||
                audit.counts.rasffNullProductDescriptionAlerts !== audit.counts.rasffProductIdWithoutDescriptionAlerts ||
                domains.missingOrStaleDimensionState !== 0 ||
                domains.humanFood + domains.animalFeed + domains.nonFood + domains.unknown !== audit.counts.rasffAlerts ||
                geography.mappedRows + geography.unmappedRows !== geography.rows ||
                geography.originRows + geography.notifyingRows + geography.distributionRows + geography.affectedRows !== geography.rows ||
                geography.alertsWithGeography > audit.counts.rasffAlerts ||
                hazards.mappedRows + hazards.unmappedRows + hazards.unknownRows !== hazards.rows ||
                hazards.alertsWithHazards > audit.counts.rasffAlerts)
              throw new Error(`${label} audit failed: ${JSON.stringify({ anomalies, counts:audit.counts, domains, geography, hazards })}`);
          };
          const assertOtherSources = (baseline, audit, label) => {
            const current = sourceCounts(audit);
            for (const source of Object.keys(baseline))
              if (baseline[source] !== current[source]) throw new Error(`${label}: ${source} changed from ${baseline[source]} to ${current[source]}`);
          };
          const compact = (state) => ({
            status:state.status, cursor:state.cursor, cursorKey:state.cursorKey, totalUnits:state.totalUnits,
            pagesScanned:state.pagesScanned, recordsObserved:state.recordsObserved,
            recordsPersisted:state.recordsPersisted, newCount:state.newCount, updatedCount:state.updatedCount,
            detailFailures:state.detailFailures, pageErrors:state.pageErrors, coverage:state.coverage,
            lastError:state.lastError, leaseOwnerId:state.leaseOwnerId,
            leaseMode:state.leaseMode, leaseExpiresAt:state.leaseExpiresAt,
          });
          const transient = (message) => /HTTP (?:429|5\d\d)|fetch failed|timeout|aborted/iu.test(message || "");

          const initialAudit = (await call("/api/rasff/sync?audit=1")).audit;
          const initialObserve = await call("/api/rasff/sync?observe=1");
          assertIntegrity(initialAudit, "initial");
          if (initialObserve.lease !== null || !initialObserve.backfill)
            throw new Error("RASFF initial backfill state/lease is missing");
          const initialState = initialObserve.backfill;
          if (initialState.status !== "completed" &&
              (initialState.cursor < 8475 || initialState.recordsObserved < 8475 || initialState.recordsPersisted < 8160))
            throw new Error(`RASFF state moved backwards: ${JSON.stringify(initialState)}`);
          if (initialState.status !== "completed" && initialState.coverage !== "partial")
            throw new Error(`RASFF incomplete state has invalid coverage: ${JSON.stringify(initialState)}`);
          const baselineSources = sourceCounts(initialAudit);
          console.log("BACKFILL_INITIAL_AUDIT " + JSON.stringify(initialAudit));
          console.log("BACKFILL_INITIAL_OBSERVE " + JSON.stringify(initialObserve));

          let priorCursor = initialState.cursor;
          let priorObserved = initialState.recordsObserved;
          let priorPersisted = initialState.recordsPersisted;
          let priorPageErrors = initialState.pageErrors;
          let successfulBatches = 0;
          let transientFailures = 0;
          let finalState = initialState.status === "completed" ? initialState : null;

          for (let requestNumber = 1; !finalState && requestNumber <= MAX_REQUESTS; requestNumber++) {
            const result = await request(`/api/rasff/sync?mode=backfill&batchSize=${BATCH_SIZE}`, "POST");
            const state = result.body?.state;
            if (!state || state.source !== "RASFF" || state.mode !== "backfill")
              throw new Error(`Request ${requestNumber} returned an invalid state: ${JSON.stringify(result.body)}`);

            if (result.status === 503) {
              if (state.status !== "failed" || !transient(state.lastError) || state.cursor !== priorCursor ||
                  state.recordsObserved !== priorObserved || state.recordsPersisted !== priorPersisted ||
                  state.pageErrors !== priorPageErrors + 1 || state.detailFailures !== 0 ||
                  state.leaseOwnerId !== null || state.leaseMode !== null || state.leaseExpiresAt !== null)
                throw new Error(`Request ${requestNumber} non-recoverable failure: ${JSON.stringify(compact(state))}`);
              transientFailures += 1;
              priorPageErrors = state.pageErrors;
              console.log("BACKFILL_RECOVERED_HTTP_503 " + JSON.stringify({ requestNumber, transientFailures, ...compact(state) }));
              await new Promise((resolve) => setTimeout(resolve, Math.min(30_000, 3_000 * transientFailures)));
              continue;
            }
            if (result.status !== 200 || !["partial", "completed"].includes(state.status) ||
                state.detailFailures !== 0 || state.lastError !== null || state.pageErrors !== priorPageErrors ||
                state.leaseOwnerId !== null || state.leaseMode !== null || state.leaseExpiresAt !== null)
              throw new Error(`Request ${requestNumber} ingestion failure: HTTP ${result.status} ${JSON.stringify(compact(state))}`);
            if ((state.status !== "completed" && state.cursor <= priorCursor) || state.recordsObserved <= priorObserved ||
                state.recordsPersisted < priorPersisted)
              throw new Error(`Request ${requestNumber} cursor/counter did not advance consistently`);

            successfulBatches += 1;
            priorCursor = state.cursor;
            priorObserved = state.recordsObserved;
            priorPersisted = state.recordsPersisted;
            const observed = await call("/api/rasff/sync?observe=1");
            if (observed.lease !== null || !observed.backfill)
              throw new Error(`Batch ${successfulBatches} observe reported an active/missing lease`);
            for (const key of ["status", "cursor", "cursorKey", "recordsObserved", "recordsPersisted",
              "newCount", "updatedCount", "detailFailures", "pageErrors", "coverage"])
              if (observed.backfill[key] !== state[key]) throw new Error(`Batch ${successfulBatches} observe drift at ${key}`);

            console.log("BACKFILL_BATCH " + JSON.stringify({ batch:successfulBatches, requestNumber, ...compact(state) }));
            if (successfulBatches % 25 === 0 || state.status === "completed") {
              const audit = (await call("/api/rasff/sync?audit=1")).audit;
              assertIntegrity(audit, `batch-${successfulBatches}`);
              assertOtherSources(baselineSources, audit, `batch-${successfulBatches}`);
              if (audit.counts.rasffAlerts > state.recordsObserved)
                throw new Error(`Batch ${successfulBatches} audit exceeds observed official records`);
              console.log("BACKFILL_AUDIT " + JSON.stringify({ batch:successfulBatches, audit }));
            }
            if (state.status === "completed") finalState = state;
          }

          if (!finalState || finalState.status !== "completed" || finalState.coverage !== "official-index-complete" ||
              finalState.cursor !== 0 || finalState.cursorKey !== null)
            throw new Error(`Backfill did not reach complete coverage: ${JSON.stringify(finalState)}`);

          const official = (await call("/api/rasff/sync?mode=preview-reconcile&cursor=0&batchSize=40", "POST")).preview;
          const expectedOperational = official.totalElements - official.archiveSkippedCount;
          const finalAudit = (await call("/api/rasff/sync?audit=1")).audit;
          const finalObserve = await call("/api/rasff/sync?observe=1");
          assertIntegrity(finalAudit, "final");
          assertOtherSources(baselineSources, finalAudit, "final");
          if (finalObserve.lease !== null || finalObserve.backfill?.status !== "completed" ||
              finalObserve.backfill.coverage !== "official-index-complete" ||
              official.totalElements !== finalState.totalUnits || finalAudit.counts.rasffAlerts !== expectedOperational ||
              finalAudit.counts.rasffUniqueReferences !== finalAudit.counts.rasffAlerts ||
              finalAudit.counts.rasffSourceIdentities !== finalAudit.counts.rasffAlerts ||
              finalAudit.counts.rasffVersions !== finalAudit.counts.rasffVersionCountSum)
            throw new Error("Final RASFF corpus does not match the official operational universe");

          console.log("BACKFILL_FINAL_STATE " + JSON.stringify(finalState));
          console.log("BACKFILL_FINAL_SUMMARY " + JSON.stringify({
            successfulBatches, transientFailures, initialCursor:initialState.cursor,
            initialPageErrors:initialState.pageErrors, finalPageErrors:finalState.pageErrors,
            totalElements:official.totalElements, archiveSkipped:official.archiveSkippedCount, expectedOperational,
          }));
          console.log("BACKFILL_FINAL_AUDIT " + JSON.stringify(finalAudit));
          console.log("BACKFILL_FINAL_OBSERVE " + JSON.stringify(finalObserve));
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE
