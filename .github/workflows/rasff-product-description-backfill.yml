name: VIGIA RASFF safe stop after persistent official 5xx

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rasff-product-description-backfill.yml"

permissions:
  contents: read

concurrency:
  group: vigia-rasff-controlled-activation
  cancel-in-progress: true

jobs:
  safe_stop:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VIGIA_BASE_URL: https://vigia-alertas.csar68.chatgpt.site
      VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
    steps:
      - name: Preserve checkpoint and leave RASFF lease null
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VIGIA_SYNC_TOKEN"
          node <<'NODE'
          const base = process.env.VIGIA_BASE_URL;
          const headers = { Authorization:`Bearer ${process.env.VIGIA_SYNC_TOKEN}` };
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          const call = async (path, method = "GET") => {
            let last;
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                const response = await fetch(base + path, {
                  method, headers, redirect:"follow", signal:AbortSignal.timeout(600_000),
                });
                const text = await response.text();
                let body;
                try { body = JSON.parse(text); }
                catch { throw new Error(`${method} ${path} non-JSON HTTP ${response.status}: ${text.slice(0,240)}`); }
                return { status:response.status, body };
              } catch (error) {
                last = error;
                if (attempt < 3) await sleep(attempt * 3_000);
              }
            }
            throw last;
          };
          const get = async (path) => {
            const result = await call(path);
            if (result.status !== 200) throw new Error(`GET ${path} HTTP ${result.status}`);
            return result.body;
          };
          let observed;
          for (let poll = 1; poll <= 90; poll++) {
            observed = await get("/api/rasff/sync?observe=1");
            const lease = observed.lease;
            if (lease === null || Date.parse(lease.expiresAt) <= Date.now()) break;
            if (poll % 4 === 0) console.log("SAFE_STOP_WAIT " + JSON.stringify({poll,lease}));
            await sleep(10_000);
          }
          if (!observed?.backfill || observed.backfill.cursor < 11515 ||
              observed.backfill.recordsObserved < 11515 || observed.backfill.recordsPersisted < 11200 ||
              observed.backfill.detailFailures !== 0)
            throw new Error(`Checkpoint drift during safe stop: ${JSON.stringify(observed)}`);

          if (observed.lease !== null) {
            if (Date.parse(observed.lease.expiresAt) > Date.now())
              throw new Error(`Lease did not expire during safe stop: ${JSON.stringify(observed.lease)}`);
            const result = await call("/api/rasff/sync?mode=backfill&batchSize=40", "POST");
            const state = result.body?.state;
            const transient = /HTTP (?:429|5\d\d)|fetch failed|timeout|aborted/iu.test(state?.lastError || "");
            if (!state || state.cursor < observed.backfill.cursor ||
                state.recordsObserved < observed.backfill.recordsObserved ||
                state.recordsPersisted < observed.backfill.recordsPersisted || state.detailFailures !== 0 ||
                !((result.status === 503 && state.status === "failed" && transient) ||
                  (result.status === 200 && ["partial","completed"].includes(state.status) && state.lastError === null)))
              throw new Error(`Unexpected final cleanup attempt: HTTP ${result.status} ${JSON.stringify(state)}`);
            console.log("SAFE_STOP_FINAL_ATTEMPT " + JSON.stringify({httpStatus:result.status,state}));
          }

          const finalObserve = await get("/api/rasff/sync?observe=1");
          const finalAudit = (await get("/api/rasff/sync?audit=1")).audit;
          if (finalObserve.lease !== null || !finalObserve.backfill ||
              finalObserve.backfill.cursor < 11515 || finalObserve.backfill.recordsPersisted < 11200 ||
              finalObserve.backfill.detailFailures !== 0 ||
              Object.values(finalAudit.integrity).some((value) => value !== 0))
            throw new Error(`Unsafe final stop state: ${JSON.stringify({finalObserve,finalAudit})}`);
          console.log("SAFE_STOP_OBSERVE " + JSON.stringify(finalObserve));
          console.log("SAFE_STOP_AUDIT " + JSON.stringify(finalAudit));
          NODE
