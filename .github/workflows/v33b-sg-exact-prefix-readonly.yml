name: V33b Safety Gate journal exact checkpoint eligibility GET SELECT only
on:
  push:
    branches: [audit/v33-sg-orphan-forensics-20261013]
    paths: [.github/workflows/v33b-sg-exact-prefix-readonly.yml]
permissions: { contents: read }
jobs:
  verify:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VIGIA: ${{ secrets.VIGIA_SYNC_TOKEN }}
    steps:
      - name: Prove exact last state effect matches D1; no D1 mutations
        shell: bash
        run: |
          node <<'NODE'
          (async()=>{
            const token=process.env.CF||'',vigia=process.env.VIGIA||'';
            if(!token||!vigia)throw Error('EXISTING_TOKENS_MISSING');
            const job='639b03ca-2df5-4bab-a689-276029e8fa48';
            const prefix='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f';
            const db='55596003-1b90-4f66-aad8-decb21205f13';
            const time=new Date().toISOString();
            let selects=0,rows=0,gets=0;
            const SELECT=async(tag,sql,params=[])=>{
              if(++selects>9||!/^SELECT\s/iu.test(sql)||sql.includes(';')||/\b(?:INSERT|UPDATE|DELETE|DROP|CREATE|ALTER|REPLACE|PRAGMA|VACUUM|ATTACH)\b/iu.test(sql))throw Error('SELECT_POLICY_DENIED');
              const r=await fetch(prefix+'/d1/database/'+db+'/query',{method:'POST',redirect:'error',signal:AbortSignal.timeout(18000),headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({sql,params})});
              const j=await r.json().catch(()=>null),t=j?.result?.[0];
              if(r.status!==200||j?.success!==true||!Array.isArray(t?.results)||t.meta?.rows_written!==0)throw Error('SQL_READ_FAILED_'+tag);
              rows+=Number(t.meta?.rows_read||0);if(rows>4000)throw Error('D1_READ_BUDGET');
              return t.results;
            };
            const GET=async(url)=>{
              if(++gets>2)throw Error('GET_BUDGET');
              const r=await fetch(url,{method:'GET',headers:{Authorization:'Bearer '+vigia,Accept:'application/json'},redirect:'error',signal:AbortSignal.timeout(15000)});
              const j=await r.json().catch(()=>null);
              if(r.status!==200||!j)throw Error('RUNTIME_READ_FAILED_'+r.status);return j;
            };
            const [owner,obs]=await Promise.all([
              GET('https://vigia-runtime.c-gamiz93.workers.dev/api/source-reliability?observe=1'),
              GET('https://vigia-runtime.c-gamiz93.workers.dev/api/safety-gate/sync?observe=1')
            ]);
            const [jrows,src,eff,summary,control,locks,pre,successors,intent]=await Promise.all([
              SELECT('job','SELECT id,source,mode,kind,epoch,phase,started_at,finished_at,deadline,write_intent_at,receipt_json FROM source_reliability_jobs WHERE id=?',[job]),
              SELECT('state',"SELECT * FROM source_sync_state WHERE source='SAFETY GATE' AND mode='recent'"),
              SELECT('effects','SELECT effect_key,ordinal,committed_at,manifest_json,result_json FROM source_reliability_effects WHERE job_id=? ORDER BY ordinal ASC',[job]),
              SELECT('stats','SELECT COUNT(*) AS n,COUNT(DISTINCT ordinal) AS distinct_n,MIN(ordinal) AS lo,MAX(ordinal) AS hi,COALESCE(SUM(CASE WHEN committed_at IS NULL OR result_json IS NULL THEN 1 ELSE 0 END),0) AS pending FROM source_reliability_effects WHERE job_id=?',[job]),
              SELECT('control',"SELECT owner_id,expires_at,epoch,json_extract(state_json,'$.attempts.\"SAFETY GATE\".id') AS job_id,json_extract(state_json,'$.attempts.\"SAFETY GATE\".outcome') AS outcome FROM source_reliability_control WHERE id=1"),
              SELECT('locks',"SELECT owner_id,expires_at FROM source_sync_locks WHERE source='SAFETY GATE'"),
              SELECT('recovery','SELECT COUNT(*) AS n FROM source_reliability_recoveries WHERE old_job_id=?',[job]),
              SELECT('successors',"SELECT COUNT(*) AS n FROM source_reliability_jobs WHERE source='SAFETY GATE' AND mode='recent' AND id<>? AND started_at>=(SELECT started_at FROM source_reliability_jobs WHERE id=?)",[job,job]),
              SELECT('intent','SELECT COUNT(*) AS n FROM source_reliability_effects WHERE effect_key=?',['checkpoint-reconcile:'+job])
            ]);
            const jb=jrows[0],raw=src[0],stats=summary[0],co=control[0];
            const rc=jb?.receipt_json?JSON.parse(jb.receipt_json):null;
            const canonical=eff.every((e,i)=>{
              const x=JSON.parse(e.manifest_json);
              return e.committed_at&&e.result_json&&e.ordinal===i+1&&x.jobId===job&&x.ordinal===i+1&&x.source==='SAFETY GATE'&&x.mode==='recent';
            });
            const markers=eff.filter(e=>JSON.parse(e.manifest_json).writes.some(w=>/^\s*INSERT\s+INTO\s+source_sync_state\b/iu.test(w.sql)));
            const last=markers.at(-1);
            let exactRow=false,markerOrdinal=null;
            if(last&&raw){
              const manifests=JSON.parse(last.manifest_json);
              const writes=manifests.writes.filter(w=>/^\s*INSERT\s+INTO\s+source_sync_state\b/iu.test(w.sql));
              if(writes.length===1){
                const m=/INSERT\s+INTO\s+source_sync_state\s*\(([^)]+)\)\s*SELECT\s+((?:\?\s*,\s*)+\?)/iu.exec(writes[0].sql);
                if(m){
                  const names=m[1].split(',').map(x=>x.trim());
                  exactRow=names.length===Object.keys(raw).length&&names.every((n,i)=>Object.hasOwn(raw,n)&&raw[n]===writes[0].params[i]);
                }
              }
              markerOrdinal=last.ordinal;
            }
            const due=Date.now()>Number(jb?.deadline||Infinity),coActive=!!(co?.owner_id&&Date.parse(co?.expires_at)>Date.now());
            const obsAge=obs.recent?.lastSuccessAt?+((Date.now()-Date.parse(obs.recent.lastSuccessAt))/60000).toFixed(1):null;
            const receiptCorrect=rc?.outcome==='unknown'&&rc?.reason==='persistence-outcome-unknown-no-retry'&&
             rc?.state?.lastError==='SOURCE_PERSISTENCE_OUTCOME_UNKNOWN: durable effect '+job+':effect:5';
            const journalCorrect=stats?.n===4&&stats.distinct_n===4&&stats.lo===1&&stats.hi===4&&stats.pending===0&&canonical;
            const rowCorrect=raw?.status==='running'&&raw.lease_owner_id===job&&raw.last_error===null&&
             raw.page_errors===0&&raw.detail_failures===0&&exactRow;
            const noOverlap=successors[0]?.n===0&&locks.length===0&&!coActive;
            const outcome={
              at:time,job,kind:jb?.kind,phase:jb?.phase,receipt:rc?.outcome,reason:rc?.reason,
              receiptCorrect,receiptStateLastError:String(rc?.state?.lastError??'').slice(-180),journalCorrect,effectsCount:stats?.n,nextEffectAbsent:stats?.hi===4,
              markerOrdinal,exactSourceStatePreimage:exactRow,rowCorrect,
              noRecoveryReceipt:pre[0]?.n===0,noRecoveryIntent:intent[0]?.n===0,noSuccessor:successors[0]?.n===0,
              sourceLockCount:locks.length,controlIdle:!coActive,deadlineExpired:due,coordinatorAttempt:co?.outcome,
              sourceStateStatus:raw?.status,safetyAgeMin:obsAge,runtimeBuild:owner.buildSha,
              GET:gets,SELECT:selects,rowsRead:rows,D1Writes:0,sourceJobsStarted:0,deploys:0
            };
            const pass=receiptCorrect&&journalCorrect&&rowCorrect&&noOverlap&&pre[0]?.n===0&&intent[0]?.n===0&&
              due&&co?.job_id===job&&co?.outcome==='unknown'&&owner.buildSha==='d5fcd11cbeb563258b4bbdc9482a80b8684c81d3';
            console.log('V33_SG_EXACT '+JSON.stringify({...outcome,passObservational:pass,writeAuthorized:false}));
            if(!pass)process.exitCode=3;
          })().catch(e=>{console.log('V33_SG_EXACT '+JSON.stringify({state:'HOLD',reason:String(e.message||e.name).slice(0,90),noWrites:true}));process.exitCode=3});
          NODE
