name: V16 F3-D actual production build and allocation
on:
  push:
    branches: [v16/f3d-production-observer-readonly]
    paths: [".github/workflows/v16-f3d-release-alt.yml"]
permissions:
  contents: read
jobs:
  observe:
    if: github.event.head_commit.message == 'V16 F3-D alternate production observer GET only' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: GET exact production build logs and stable allocation
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const root='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f',sha='26be9222b0c54be71980de1b2bcded722164733b';
          const out={phase:'V16-F3-D',merge:sha,observedAt:new Date().toISOString(),productionMutationAttempts:0,reads:[]};
          async function get(path){if(Date.now()>Date.parse('2026-10-06T01:00:00Z'))throw Error('expired');
          if(!/^\/(?:workers\/scripts(?:\/vigia-runtime\/(?:deployments|versions\/[a-f0-9-]{36}))?|builds\/workers\/[a-f0-9-]+\/builds\?per_page=10|builds\/builds\/[a-f0-9-]{36}(?:\/logs(?:\?cursor=[A-Za-z0-9_%.-]+)?)?)$/.test(path))throw Error('scope');
          const r=await fetch(root+path,{method:'GET',redirect:'error',headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},signal:AbortSignal.timeout(15000)});out.reads.push({path,http:r.status,at:new Date().toISOString()});if(!r.ok)throw Error('HTTP-'+r.status);const j=await r.json();if(!j.success)throw Error('envelope');return j.result;}
          try{const scripts=await get('/workers/scripts'),tag=scripts.find(x=>x.id==='vigia-runtime')?.tag;if(!tag)throw Error('worker-tag');
          let build;for(let i=0;i<20;i++){const bs=await get('/builds/workers/'+tag+'/builds?per_page=10'),list=Array.isArray(bs)?bs:bs.builds||bs.results||[];build=list.find(b=>b.build_trigger_metadata?.commit_hash===sha&&b.build_trigger_metadata?.branch==='main'&&b.build_trigger_metadata?.deploy_command==='npx wrangler deploy');if(build){build=await get('/builds/builds/'+build.build_uuid);if(build.status==='stopped')break;}console.log('F3D_BUILD_PENDING '+JSON.stringify({at:new Date().toISOString(),id:build?.build_uuid,status:build?.status}));await new Promise(r=>setTimeout(r,20000));}
          if(!build)throw Error('production-build-not-found');out.build={id:build.build_uuid,status:build.status,outcome:build.build_outcome,commit:build.build_trigger_metadata.commit_hash,branch:build.build_trigger_metadata.branch,buildCommand:build.build_trigger_metadata.build_command,deployCommand:build.build_trigger_metadata.deploy_command,createdOn:build.created_on,stoppedOn:build.stopped_on};
          if(build.status!=='stopped'||build.build_outcome!=='success')throw Error('production-build-not-success');
          const strings=[];function collect(v){if(typeof v==='string')strings.push(v);else if(Array.isArray(v))v.forEach(collect);else if(v&&typeof v==='object')Object.values(v).forEach(collect);}out.logPages=[];let cursor='';for(let p=0;p<10;p++){const logs=await get('/builds/builds/'+build.build_uuid+'/logs'+(cursor?'?cursor='+encodeURIComponent(cursor):''));out.logPages.push({page:p,lines:logs.lines?.length,cursor:logs.cursor,truncated:logs.truncated});collect(logs.lines);collect(logs.events);if(!logs.truncated)break;if(!logs.cursor||logs.cursor===cursor)throw Error('log-pagination-stuck');cursor=logs.cursor;}if(out.logPages.at(-1).truncated)throw Error('logs-not-complete');const all=strings.join('\n');
          out.evidenceLines=strings.flatMap(s=>s.split('\n')).filter(s=>/Running Cloudflare CI|ℹ tests |ℹ pass |ℹ fail |Validated cloudflare artifact|Version ID:|0 errors|post.build/i.test(s));
          out.gates={unit:/tests 837/.test(all)&&/pass 837/.test(all),postBuild:/tests 115/.test(all)&&/pass 115/.test(all),typecheck:/Running Cloudflare CI: typecheck/.test(all),lint:/0 errors/.test(all),artifactSafety:/Validated cloudflare artifact: safety scan and ESM Worker default.fetch passed/.test(all)};
          if(!Object.values(out.gates).every(Boolean))throw Error('technical-gate-evidence-missing');
          const active=(await get('/workers/scripts/vigia-runtime/deployments')).deployments?.[0];if(active?.versions?.length!==1||active.versions[0].percentage!==100)throw Error('production-ambiguous');const v=await get('/workers/scripts/vigia-runtime/versions/'+active.versions[0].version_id);
          out.active={deploymentId:active.id,createdOn:active.created_on,versionId:v.id,percentage:100,versionNumber:v.number,versionCreatedOn:v.metadata?.created_on};
          const printed=all.match(/(?:Current )?Version ID:\s*([a-f0-9-]{36})/i)?.[1];out.deployedVersionFromBuildLog=printed||null;if(printed!==v.id)throw Error('build-active-version-unproven');
          const end=(await get('/workers/scripts/vigia-runtime/deployments')).deployments?.[0];if(end?.id!==active.id||JSON.stringify(end.versions)!==JSON.stringify(active.versions))throw Error('allocation-drift');out.status='PASS';
          }catch(e){out.status='HOLD';out.reason=e.message;process.exitCode=1;}out.completedAt=new Date().toISOString();console.log('F3D_RELEASE_TERMINAL '+JSON.stringify(out));
          NODE
