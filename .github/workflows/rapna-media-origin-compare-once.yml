name: RAPNA-MEDIA-F1 external origin single-request comparison
on:
  push:
    branches: [sec-f1/cloudflare-api-readonly-20261009]
    paths: [.github/workflows/rapna-media-origin-compare-once.yml]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: One official RAPNA resource POST (read semantics), bounded response, no media persistence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const root='https://servicios.consumo.gob.es/rapnaBEPublic/listadoPublico/fichero';
          const data={document:'159_2026_Fotografía_web.jpg',notificacion:84341,type:'IMG',fichaWeb:true};
          const safe=(x)=>console.log('RAPNA_ORIGIN_COMPARISON '+JSON.stringify(x));
          const started=Date.now();
          try{
            const response=await fetch(root,{method:'POST',redirect:'error',
              headers:{Accept:'application/json','Content-Type':'application/json'},
              body:JSON.stringify(data),signal:AbortSignal.timeout(17000)});
            const meta={http:response.status,elapsed_ms:Date.now()-started,
              content_type_allowed:/^application\/json(?:\s*;|$)/i.test(response.headers.get('Content-Type')||'')};
            if(!response.ok||!meta.content_type_allowed){safe({...meta,result:'no_valid_official_response'});process.exit(); }
            let received=0;const chunks=[];const reader=response.body?.getReader();
            if(!reader){safe({...meta,result:'empty_stream'});process.exit();}
            for(;;){
              const {done,value}=await reader.read();if(done)break;
              received+=value.byteLength;
              if(received>7*1024*1024){await reader.cancel();safe({...meta,result:'oversize'});process.exit();}
              chunks.push(value);
            }
            const bytes=new Uint8Array(received);
            let offset=0;for(const chunk of chunks){bytes.set(chunk,offset);offset+=chunk.length;}
            const text=new TextDecoder().decode(bytes);
            const parsed=JSON.parse(text);
            const b64=typeof parsed?.data==='string'?parsed.data:'';
            const valid=/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(b64);
            const padding=b64.endsWith('==')?2:b64.endsWith('=')?1:0;
            const estimate=valid?b64.length/4*3-padding:0;
            const magic=valid&&b64.length>=16?Buffer.from(b64.slice(0,16),'base64'):{};
            const jpeg=magic instanceof Buffer && magic.length>=3&&magic[0]===255&&magic[1]===216&&magic[2]===255;
            safe({...meta,official_code:typeof parsed?.code==='number'?parsed.code:null,
              valid_base64:valid,estimated_image_bytes:estimate,photo_magic_is_jpeg:jpeg,
              result:parsed?.code===0&&valid&&jpeg&&estimate<=5*1024*1024?'official_media_available':'official_media_not_verified',
              response_body_not_logged:true,media_not_stored:true});
          }catch(e){safe({result:'request_or_validation_failed',error_type:e?.name??'Error',elapsed_ms:Date.now()-started});}
          NODE
