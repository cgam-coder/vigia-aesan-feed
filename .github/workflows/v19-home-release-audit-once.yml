name: V19 home latest deploy read-only one-off
on:
  push:
    branches: [sec-f1/cloudflare-api-readonly-20261009]
    paths: [.github/workflows/v19-home-release-audit-once.yml]
permissions:
  contents: read
concurrency:
  group: v19-home-release-audit
  cancel-in-progress: false
jobs:
  inspect:
    if: github.actor == 'cgam-coder'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: GET Worker and Runner deployment heads and recent builds, no writes
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CF_TOKEN;
          if(!token)throw Error('TOKEN_UNAVAILABLE');
          const root='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f';
          const get=async(path)=>{
            if(!path.startsWith('/'))throw Error('PATH_UNSAFE');
            const r=await fetch(root+path,{method:'GET',redirect:'error',
              headers:{Authorization:'Bearer '+token,Accept:'application/json'},
              signal:AbortSignal.timeout(15000)});
            const j=await r.json().catch(()=>null);
            if(r.status!==200||j?.success!==true)throw Error('GET_BLOCKED_'+path+'_'+r.status);
            return j.result;
          };
          for(const script of ['vigia-runtime','vigia-source-runner']){
            const d=await get('/workers/scripts/'+script+'/deployments');
            const row=(d.deployments??[]).slice(0,2).map(x=>({
              id:x.id,created:x.created_on,
              versions:(x.versions??[]).map(v=>({id:v.version_id,pct:v.percentage}))
            }));
            console.log('V19_HOME_DEPLOY '+JSON.stringify({script,deployments:row}));
          }
          const scripts=await get('/workers/scripts');
          const tag=(Array.isArray(scripts)?scripts:[]).find(s=>s.id==='vigia-runtime')?.tag;
          if(!tag)throw Error('WORKER_TAG_UNKNOWN');
          const rows=await get('/builds/workers/'+encodeURIComponent(tag)+'/builds');
          const b=Array.isArray(rows)?rows:(rows?.builds??[]);
          console.log('V19_HOME_BUILDS '+JSON.stringify(b.slice(0,3).map(x=>({
            commit:x.build_trigger_metadata?.commit_hash??null,
            branch:x.build_trigger_metadata?.branch??null,
            outcome:x.build_outcome??null,id:x.build_uuid??null
          }))));
          NODE
