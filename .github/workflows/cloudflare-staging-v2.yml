name: Cloudflare staging operations v2

on:
  push:
    branches:
      - work/cloudflare-chat-operability-proof
    paths:
      - "ops/cloudflare-staging-v2.request.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-staging-v2
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      CF_WORKER: vigia-runtime
      CF_D1: nagamealert-staging-db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Execute allowlisted staging operation
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          request="ops/cloudflare-staging-v2.request.json"
          node --input-type=module - "$request" <<'NODE' > "$RUNNER_TEMP/request.env"
          import { readFile } from "node:fs/promises";
          const body=JSON.parse(await readFile(process.argv[2],"utf8"));
          const allowed=new Set([
            "probe","d1-canary-write","d1-canary-read",
            "worker-secret-list","worker-bootstrap-secrets",
            "worker-versions","worker-versions-detailed","worker-versions-api-detailed","worker-status","worker-rollback","worker-build-trigger-inspect","worker-build-env-inspect","worker-builds-list","home-f7-production-build","home-f7-build-log","worker-settings-readonly",
            "staging-bootstrap-status","staging-bootstrap-apply",
            "staging-ledger-cert","staging-http-smoke","f1b-import-manifest","f1b-import-reset","f1b-import-canary","d1-info","postcutover-drop-import-state","p4-owner-stage1-preflight","p4-owner-lease-state","p4-owner-stage1-apply-audit","p4-owner-stage1-perf","p4-owner-taxonomy-semantic-snapshot","p4-owner-stage2-country-diagnose","p4-owner-stage2b-country-benchmark","preview-d1-create-or-inspect","preview-d1-bootstrap-aesan","preview-secret-bootstrap-smoke","f3b-b1-browser-matrix","perf-v2-preview-certification","terminal-default-geo-hydration-benchmark","terminal-perf-production-cert-current","terminal-perf-candidate-preview-cert","terminal-list-plan-benchmark","terminal-geo-plan-benchmark","terminal-perf-baseline-current","aesan-functional-recheck","f3b-production-certification","perf-f1-bind-limit-production-cert","perf-f1-bind-limit-preview-cert","rasff-integrity-readonly","oecd-observe-readonly","source-reliability-f1-audit","owner-runtime-readonly-smoke","owner-runtime-post-preflight"
          ]);
          if(!body || typeof body!=="object" || Array.isArray(body)) throw new Error("invalid request");
          if(typeof body.operation!=="string" || !allowed.has(body.operation)) throw new Error("operation not allowed");
          if(typeof body.nonce!=="string" || !/^[A-Za-z0-9._:-]{8,120}$/.test(body.nonce)) throw new Error("invalid nonce");
          const allowedKeys=new Set(["operation","nonce","versionId","expectedFreezeRunId","expectedFreezeSha"]);
          if(Object.keys(body).some(k=>!allowedKeys.has(k))) throw new Error("unexpected key");
          if(body.operation==="worker-rollback"){
            if(typeof body.versionId!=="string" || !/^[0-9a-f-]{20,80}$/i.test(body.versionId)) throw new Error("invalid versionId");
          } else if("versionId" in body) throw new Error("versionId only valid for rollback");
          if(body.operation==="p4-owner-stage1-apply-audit"){
            if(!Number.isSafeInteger(body.expectedFreezeRunId)||body.expectedFreezeRunId<=0) throw new Error("invalid expectedFreezeRunId");
            if(typeof body.expectedFreezeSha!=="string"||!/^[a-f0-9]{40}$/i.test(body.expectedFreezeSha)) throw new Error("invalid expectedFreezeSha");
          } else if("expectedFreezeRunId" in body||"expectedFreezeSha" in body) {
            throw new Error("freeze expectations only valid for P4 apply");
          }
          console.log("OPERATION="+body.operation);
          console.log("NONCE="+body.nonce);
          if(body.versionId) console.log("VERSION_ID="+body.versionId);
          if(body.expectedFreezeRunId) console.log("EXPECTED_FREEZE_RUN_ID="+body.expectedFreezeRunId);
          if(body.expectedFreezeSha) console.log("EXPECTED_FREEZE_SHA="+body.expectedFreezeSha);
          NODE
          source "$RUNNER_TEMP/request.env"
          wrangler(){ npx --yes wrangler@4.135.0 "$@"; }

          case "$OPERATION" in
            probe)
              wrangler d1 info "$CF_D1" --json >/dev/null
              wrangler deployments status --name "$CF_WORKER" --json >/dev/null
              ;;
            d1-canary-write)
              test "$CF_D1" = "nagamealert-staging-db"
              sql="CREATE TABLE IF NOT EXISTS cf_chat_control_probe (nonce TEXT PRIMARY KEY, created_at TEXT NOT NULL); INSERT OR REPLACE INTO cf_chat_control_probe (nonce, created_at) VALUES ('$NONCE', datetime('now'));"
              wrangler d1 execute "$CF_D1" --remote --command "$sql" --yes --json >/dev/null
              ;;
            source-reliability-f1-audit)
              test -n "$VIGIA_SYNC_TOKEN"
              base="https://work-source-reliability-v2-f1-vigia-runtime.c-gamiz93.workers.dev"
              for endpoint in aesan rapna rasff oecd; do
                out="$RUNNER_TEMP/reliability-$endpoint.json"
                code="$(curl --silent --show-error --location --max-time 180 \
                  --header "Authorization: Bearer $VIGIA_SYNC_TOKEN" \
                  --output "$out" --write-out '%{http_code}' \
                  "$base/api/$endpoint/sync?audit=1")"
                echo "SOURCE_RELIABILITY_F1_HTTP endpoint=$endpoint code=$code bytes=$(wc -c < "$out")"
                if [ "$code" != "200" ]; then
                  ENDPOINT="$endpoint" CODE="$code" node --input-type=module - "$out" <<'NODE'
          import { readFileSync } from "node:fs";
          let error="non-json response";
          try {
            const body=JSON.parse(readFileSync(process.argv[2],"utf8"));
            if(typeof body?.error==="string") error=body.error.slice(0,500);
          } catch {}
          console.log("SOURCE_RELIABILITY_F1_ERROR "+JSON.stringify({
            endpoint:process.env.ENDPOINT,http:Number(process.env.CODE),error
          }));
          NODE
                  exit 1
                fi
                ENDPOINT="$endpoint" node --input-type=module - "$out" <<'NODE'
          import { readFileSync } from "node:fs";
          const endpoint=process.env.ENDPOINT;
          const body=JSON.parse(readFileSync(process.argv[2],"utf8"));
          const audit=body?.audit;
          if(!audit?.checkedAt||!audit?.counts||!audit?.integrity) throw new Error(endpoint+" audit shape invalid");
          const counts=Object.fromEntries(Object.entries(audit.counts).filter(([key])=>
            /(?:Alerts|Versions|VersionCountSum|UniqueReferences|SourceIdentities)$/u.test(key)));
          console.log("SOURCE_RELIABILITY_F1_AUDIT "+JSON.stringify({
            endpoint,checkedAt:audit.checkedAt,counts,integrity:audit.integrity
          }));
          NODE
              done
              echo "SOURCE_RELIABILITY_F1_AUDIT_ALL status=PASS"
              ;;
            owner-runtime-post-preflight)
              test -n "$VIGIA_SYNC_TOKEN"
              base="https://vigia-runtime.c-gamiz93.workers.dev"
              for endpoint in aesan rapna safety-gate oecd rasff; do
                code="$(curl --silent --show-error --location --request POST --max-time 90 \
                  --header "Authorization: Bearer $VIGIA_SYNC_TOKEN" \
                  --output "$RUNNER_TEMP/$endpoint-preflight.json" --write-out '%{http_code}' \
                  "$base/api/$endpoint/sync?mode=preflight")"
                test "$code" = "200"
                ENDPOINT="$endpoint" node --input-type=module - "$RUNNER_TEMP/$endpoint-preflight.json" <<'NODE'
          import { readFileSync } from "node:fs";
          const body=JSON.parse(readFileSync(process.argv[2],"utf8"));
          if(body?.authorized!==true) throw new Error("preflight authorization failed");
          console.log("OWNER_RUNTIME_POST_PREFLIGHT "+JSON.stringify({
            endpoint:process.env.ENDPOINT,
            authorized:body.authorized,
            source:body.source??null,
            officialIndex:body.officialIndex?{
              totalElements:body.officialIndex.totalElements??null,
              newestReference:body.officialIndex.newest?.reference??null
            }:null
          }));
          NODE
              done
              echo "OWNER_RUNTIME_POST_PREFLIGHT_ALL status=PASS"
              ;;
            perf-v2-preview-certification)
              test "$CF_WORKER" = "vigia-runtime"
              candidate="https://work-cloudflare-precheck-perf-v2-current-vigia-runtime.c-gamiz93.workers.dev"
              baseline="https://work-f3b-worker-previews-base-vigia-runtime.c-gamiz93.workers.dev"
              preview_d1="nagamealert-preview-db"
              candidate_commit="aa860cf04bfae058e028a570d85b56ddac17c487"

              prod_before="$(wrangler d1 execute "$CF_D1" --remote --command "SELECT COUNT(*) AS total, SUM(CASE WHEN source='AESAN' THEN 1 ELSE 0 END) AS aesan FROM alerts" --json)"
              preview_before="$(wrangler d1 execute "$preview_d1" --remote --command "SELECT COUNT(*) AS total, SUM(CASE WHEN source='AESAN' THEN 1 ELSE 0 END) AS aesan, SUM(CASE WHEN source<>'AESAN' THEN 1 ELSE 0 END) AS non_aesan FROM alerts" --json)"
              PROD="$prod_before" PREVIEW="$preview_before" node --input-type=module - <<'NODE'
          const row=(raw)=>(JSON.parse(raw||"[]")||[]).flatMap?.(x=>x.results??[])?.[0]??{};
          const prod=row(process.env.PROD), preview=row(process.env.PREVIEW);
          if(Number(prod.total)!==84786||Number(prod.aesan)!==128) throw new Error("production baseline drift");
          if(Number(preview.total)!==129||Number(preview.aesan)!==129||Number(preview.non_aesan)!==0) throw new Error("preview D1 isolation drift");
          console.log("PERF_V2_PREVIEW_D1_PREFLIGHT "+JSON.stringify({production:{total:Number(prod.total),aesan:Number(prod.aesan)},preview:{total:Number(preview.total),aesan:Number(preview.aesan),nonAesan:Number(preview.non_aesan)}}));
          NODE

              compare_api(){
                local name="$1"
                shift
                local a="$RUNNER_TEMP/perf-v2-$name-candidate.json"
                local b="$RUNNER_TEMP/perf-v2-$name-baseline.json"
                curl --silent --show-error --fail-with-body --max-time 120 --get "$@" "$candidate/api/terminal/alerts" > "$a"
                curl --silent --show-error --fail-with-body --max-time 120 --get "$@" "$baseline/api/terminal/alerts" > "$b"
                NAME="$name" A="$a" B="$b" node --input-type=module - <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          const a=JSON.parse(readFileSync(process.env.A,"utf8"));
          const b=JSON.parse(readFileSync(process.env.B,"utf8"));
          const canonical=(value)=>JSON.stringify(value);
          if(canonical(a)!==canonical(b)){
            const digest=(value)=>createHash("sha256").update(canonical(value)).digest("hex");
            throw new Error("API semantic mismatch "+process.env.NAME+" candidate="+digest(a)+" baseline="+digest(b));
          }
          console.log("PERF_V2_API_EQ "+JSON.stringify({name:process.env.NAME,total:a.total,returned:a.pagination?.returned,hasMore:a.pagination?.hasMore,pageSize:a.pagination?.pageSize,aesanType:a.query?.aesanType??null}));
          NODE
              }

              compare_api all-100 \
                --data-urlencode "period=all" --data-urlencode "country=ALL" --data-urlencode "source=AESAN" --data-urlencode "pageSize=100"
              compare_api general-100 \
                --data-urlencode "period=all" --data-urlencode "country=ALL" --data-urlencode "source=AESAN" --data-urlencode "aesanType=general_population" --data-urlencode "pageSize=100"
              compare_api allergy-50 \
                --data-urlencode "period=all" --data-urlencode "country=ALL" --data-urlencode "source=AESAN" --data-urlencode "aesanType=allergy_intolerance_adverse" --data-urlencode "pageSize=50"
              compare_api supplements-50 \
                --data-urlencode "period=all" --data-urlencode "country=ALL" --data-urlencode "source=AESAN" --data-urlencode "aesanType=food_supplements" --data-urlencode "pageSize=50"
              compare_api country-es \
                --data-urlencode "period=all" --data-urlencode "country=ES" --data-urlencode "source=AESAN" --data-urlencode "pageSize=50"
              compare_api search-sulfitos \
                --data-urlencode "q=sulfitos" --data-urlencode "period=all" --data-urlencode "country=ALL" --data-urlencode "source=AESAN" --data-urlencode "pageSize=50"
              compare_api recent-7d \
                --data-urlencode "period=7d" --data-urlencode "country=ALL" --data-urlencode "source=AESAN" --data-urlencode "pageSize=50"

              first="$RUNNER_TEMP/perf-v2-all-100-candidate.json"
              cursor="$(FIRST="$first" node --input-type=module - <<'NODE'
          import { readFileSync } from "node:fs";
          const body=JSON.parse(readFileSync(process.env.FIRST,"utf8"));
          if(body?.total!==129||body?.pagination?.returned!==100||body?.pagination?.hasMore!==true||!body?.pagination?.nextCursor) throw new Error("pageSize=100 did not exercise 101-row internal page");
          process.stdout.write(body.pagination.nextCursor);
          NODE
              )"
              compare_api page2-after-100 \
                --data-urlencode "period=all" --data-urlencode "country=ALL" --data-urlencode "source=AESAN" --data-urlencode "pageSize=100" --data-urlencode "cursor=$cursor"

              for ref in "ES2026/266" "ES2026/382" "PREVIEW/CONFLICT"; do
                safe="$(printf '%s' "$ref" | tr '/:' '__')"
                compare_api "case-$safe" \
                  --data-urlencode "q=$ref" --data-urlencode "period=all" --data-urlencode "country=ALL" --data-urlencode "source=AESAN" --data-urlencode "pageSize=50"
              done

              for target in candidate baseline; do
                if [ "$target" = candidate ]; then url="$candidate"; else url="$baseline"; fi
                headers="$RUNNER_TEMP/perf-v2-$target.headers"
                body="$RUNNER_TEMP/perf-v2-$target-perf.json"
                code="$(curl --silent --show-error --get --max-time 120 --header "X-Nagame-Perf: 1" \
                  --dump-header "$headers" --output "$body" --write-out '%{http_code}' \
                  --data-urlencode "period=all" --data-urlencode "country=ALL" --data-urlencode "source=AESAN" --data-urlencode "pageSize=100" \
                  "$url/api/terminal/alerts")"
                test "$code" = "200"
                TARGET="$target" HEADERS="$headers" node --input-type=module - <<'NODE'
          import { readFileSync } from "node:fs";
          const lines=readFileSync(process.env.HEADERS,"utf8").split(/\r?\n/);
          const line=[...lines].reverse().find((value)=>value.toLowerCase().startsWith("x-nagame-d1-rows:"));
          if(!line) throw new Error("missing perf rows header");
          const raw=line.slice(line.indexOf(":")+1).trim();
          const reads={},writes={};
          for(const token of raw.split(",")){
            const [key,value]=token.trim().split("=");
            const n=Number(value);
            if(key?.endsWith(".rows_read")&&Number.isFinite(n)) reads[key.replace(/\.rows_read$/,"")]=n;
            if(key?.endsWith(".rows_written")&&Number.isFinite(n)) writes[key.replace(/\.rows_written$/,"")]=n;
          }
          if(Object.values(writes).some((n)=>n!==0)) throw new Error("Preview perf write detected");
          console.log("PERF_V2_PREVIEW_ROWS "+JSON.stringify({target:process.env.TARGET,totalRows:Object.values(reads).reduce((a,b)=>a+b,0),reads,writes}));
          NODE
              done

              browser_dir="$RUNNER_TEMP/perf-v2-browser"
              rm -rf "$browser_dir"
              mkdir -p "$browser_dir"
              cp "$GITHUB_WORKSPACE/ops/f3b-b1-browser-matrix.mjs" "$browser_dir/matrix.mjs"
              cd "$browser_dir"
              npm init -y >/dev/null 2>&1
              npm install --no-audit --no-fund --silent puppeteer-core@24.24.1
              chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
              test -n "$chrome"
              B1_URL="$candidate" CHROME="$chrome" node matrix.mjs
              cd "$GITHUB_WORKSPACE"

              prod_after="$(wrangler d1 execute "$CF_D1" --remote --command "SELECT COUNT(*) AS total, SUM(CASE WHEN source='AESAN' THEN 1 ELSE 0 END) AS aesan FROM alerts" --json)"
              preview_after="$(wrangler d1 execute "$preview_d1" --remote --command "SELECT COUNT(*) AS total, SUM(CASE WHEN source='AESAN' THEN 1 ELSE 0 END) AS aesan, SUM(CASE WHEN source<>'AESAN' THEN 1 ELSE 0 END) AS non_aesan FROM alerts" --json)"
              PROD_BEFORE="$prod_before" PROD_AFTER="$prod_after" PREVIEW_BEFORE="$preview_before" PREVIEW_AFTER="$preview_after" node --input-type=module - <<'NODE'
          const row=(raw)=>(JSON.parse(raw||"[]")||[]).flatMap?.(x=>x.results??[])?.[0]??{};
          const pb=row(process.env.PROD_BEFORE),pa=row(process.env.PROD_AFTER),vb=row(process.env.PREVIEW_BEFORE),va=row(process.env.PREVIEW_AFTER);
          if(Number(pb.total)!==Number(pa.total)||Number(pb.aesan)!==Number(pa.aesan)) throw new Error("production D1 changed");
          for(const key of ["total","aesan","non_aesan"]) if(Number(vb[key])!==Number(va[key])) throw new Error("preview D1 changed: "+key);
          console.log("PERF_V2_PREVIEW_D1_POST "+JSON.stringify({production:{total:Number(pa.total),aesan:Number(pa.aesan)},preview:{total:Number(va.total),aesan:Number(va.aesan),nonAesan:Number(va.non_aesan)}}));
          NODE
              echo "PERF_V2_PREVIEW_CERTIFICATION commit=$candidate_commit status=PASS"
              ;;
            terminal-default-geo-hydration-benchmark)
              test "$CF_WORKER" = "vigia-runtime"
              cutoff="2026-09-21T04:22:30.000Z"
              out="$RUNNER_TEMP/default-geo-hydration.ndjson"
              : > "$out"

              run_sql(){
                local name="$1"
                local sql="$2"
                local file="$RUNNER_TEMP/default-$name.json"
                wrangler d1 execute "$CF_D1" --remote --command "$sql" --json > "$file"
                NAME="$name" FILE="$file" node --input-type=module - <<'NODE' | tee -a "$out"
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          const raw=JSON.parse(readFileSync(process.env.FILE,"utf8"));
          const blocks=Array.isArray(raw)?raw:[raw];
          const rows=blocks.flatMap((block)=>block?.results??[]);
          const metas=blocks.map((block)=>block?.meta??{});
          const rowsRead=metas.reduce((sum,meta)=>sum+Number(meta.rows_read??0),0);
          const rowsWritten=metas.reduce((sum,meta)=>sum+Number(meta.rows_written??0),0);
          const duration=metas.reduce((sum,meta)=>sum+Number(meta.duration??0),0);
          if(rowsWritten!==0) throw new Error("read-only benchmark wrote rows");
          const stable=(value)=>Array.isArray(value)?value.map(stable):value&&typeof value==="object"
            ? Object.fromEntries(Object.entries(value).sort(([a],[b])=>a.localeCompare(b)).map(([k,v])=>[k,stable(v)])):value;
          const digest=createHash("sha256").update(JSON.stringify(stable(rows))).digest("hex");
          console.log(JSON.stringify({name:process.env.NAME,rowsRead,duration,resultRows:rows.length,digest,rows}));
          NODE
              }

              identity="((alerts.source <> 'OECD' AND ag.role = 'notifying') OR (alerts.source = 'OECD' AND ag.role = 'affected' AND ag.source_field = 'countryName:economy-of-recall' AND ag.reason = 'explicit-oecd-economy-of-recall'))"
              jurisdiction="((ag.admin_level = 'country' AND ag.code_scheme = 'ISO_3166_1_ALPHA2') OR (ag.admin_level = 'subdivision' AND ag.code_scheme = 'ISO_3166_2') OR (ag.admin_level = 'territory' AND ag.code_scheme = 'EU_COUNTRY' AND ag.geography_code = 'XI'))"
              filtered="WITH filtered_alerts AS MATERIALIZED (SELECT alerts.id, alerts.source FROM alerts LEFT JOIN alert_dimension_state ds ON ds.alert_id = alerts.id WHERE alerts.published_at >= '$cutoff')"

              country_select="SELECT CASE WHEN ag.code_scheme = 'EU_COUNTRY' AND ag.geography_code = 'XI' THEN ag.geography_code ELSE ag.country_code END AS code, COUNT(DISTINCT ag.alert_id) AS alertCount"
              country_tail="WHERE $identity AND ag.status = 'mapped' AND $jurisdiction GROUP BY code HAVING code <> '' AND COUNT(DISTINCT ag.alert_id) > 0 ORDER BY code"
              run_sql "country-current" "$filtered $country_select FROM filtered_alerts alerts INNER JOIN alert_geographies ag ON ag.alert_id = alerts.id $country_tail"
              run_sql "country-cross-indexed" "$filtered $country_select FROM filtered_alerts alerts CROSS JOIN alert_geographies ag INDEXED BY alert_geographies_alert_role_idx ON ag.alert_id = alerts.id $country_tail"

              map_identity="((alerts.source <> 'OECD' AND mg.role = 'notifying') OR (alerts.source = 'OECD' AND mg.role = 'affected' AND mg.source_field = 'countryName:economy-of-recall' AND mg.reason = 'explicit-oecd-economy-of-recall'))"
              map_tail="WHERE mg.status = 'mapped' AND $map_identity AND mg.admin_level = 'country' AND mg.code_scheme = 'ISO_3166_1_ALPHA2'"
              map_select="SELECT mg.geography_code AS geographyCode, mg.country_code AS countryCode, mg.admin_level AS adminLevel, alerts.source, COUNT(DISTINCT alerts.id) AS alertCount"
              map_group="GROUP BY mg.geography_code, mg.country_code, mg.admin_level, alerts.source ORDER BY mg.geography_code, alerts.source"
              run_sql "map-current" "$filtered $map_select FROM filtered_alerts alerts INNER JOIN alert_geographies mg ON mg.alert_id = alerts.id $map_tail $map_group"
              run_sql "map-cross-indexed" "$filtered $map_select FROM filtered_alerts alerts CROSS JOIN alert_geographies mg INDEXED BY alert_geographies_alert_role_idx ON mg.alert_id = alerts.id $map_tail $map_group"
              run_sql "represented-current" "$filtered SELECT COUNT(DISTINCT alerts.id) AS represented FROM filtered_alerts alerts INNER JOIN alert_geographies mg ON mg.alert_id = alerts.id $map_tail"
              run_sql "represented-cross-indexed" "$filtered SELECT COUNT(DISTINCT alerts.id) AS represented FROM filtered_alerts alerts CROSS JOIN alert_geographies mg INDEXED BY alert_geographies_alert_role_idx ON mg.alert_id = alerts.id $map_tail"

              ids_raw="$(wrangler d1 execute "$CF_D1" --remote --command "SELECT json_group_array(id) AS ids FROM (SELECT alerts.id FROM alerts LEFT JOIN alert_dimension_state ds ON ds.alert_id = alerts.id WHERE alerts.published_at >= '$cutoff' ORDER BY alerts.published_at DESC, alerts.id DESC LIMIT 101)" --json)"
              ids_json="$(IDS_RAW="$ids_raw" node --input-type=module - <<'NODE'
          const raw=JSON.parse(process.env.IDS_RAW||"[]");
          const rows=(Array.isArray(raw)?raw:[raw]).flatMap((block)=>block?.results??[]);
          const ids=JSON.parse(String(rows[0]?.ids??"[]"));
          if(ids.length!==101) throw new Error("expected 101 page ids, got "+ids.length);
          process.stdout.write(JSON.stringify(ids).replaceAll("'","''"));
          NODE
              )"

              hydrate_sql="SELECT alert_id AS alertId, role, geography_code AS geographyCode, country_code AS countryCode, admin_level AS adminLevel, code_scheme AS codeScheme, source_field AS sourceField, reason FROM alert_geographies INDEXED BY alert_geographies_alert_role_idx WHERE status = 'mapped' AND alert_id IN (SELECT value FROM json_each('$ids_json')) ORDER BY alert_id, role, country_code, geography_code, source_field, reason"
              run_sql "hydrate-json-101" "$hydrate_sql"
              wrangler d1 execute "$CF_D1" --remote --command "EXPLAIN QUERY PLAN $hydrate_sql" --json > "$RUNNER_TEMP/hydrate-explain.json"

              OUT="$out" EXPLAIN="$RUNNER_TEMP/hydrate-explain.json" node --input-type=module - <<'NODE'
          import { readFileSync } from "node:fs";
          const rows=readFileSync(process.env.OUT,"utf8").trim().split("\n").filter(Boolean).map(JSON.parse);
          const by=new Map(rows.map((row)=>[row.name,row]));
          for(const base of ["country","map","represented"]){
            const current=by.get(base+"-current"), candidate=by.get(base+"-cross-indexed");
            if(!current||!candidate||current.digest!==candidate.digest) throw new Error(base+" semantic mismatch");
            console.log("TERMINAL_DEFAULT_GEO "+JSON.stringify({query:base,current:{rowsRead:current.rowsRead,duration:current.duration},candidate:{rowsRead:candidate.rowsRead,duration:candidate.duration},digest:current.digest}));
          }
          const hydration=by.get("hydrate-json-101");
          if(!hydration||hydration.rowsRead<=0) throw new Error("hydration benchmark missing");
          const raw=JSON.parse(readFileSync(process.env.EXPLAIN,"utf8"));
