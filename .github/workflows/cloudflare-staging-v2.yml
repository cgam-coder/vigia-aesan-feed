              wrangler d1 execute "$prod_name" --remote --command "SELECT * FROM d1_migrations ORDER BY id" --json > "$work/migrations.json"

              WORK="$work" node --input-type=module - <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          import { join } from "node:path";

          const readRows=(file)=>{
            const raw=JSON.parse(readFileSync(join(process.env.WORK,file),"utf8"));
            return (Array.isArray(raw)?raw:[]).flatMap(x=>x.results??[]);
          };
          const object=(value)=>value && typeof value==="object" && !Array.isArray(value) ? value : {};
          const array=(value)=>Array.isArray(value) ? value : [];
          const validHash=/^[0-9a-f]{64}$/u;
          const compactList=(value,maxItems,maxBytes)=>{
            const source=array(value).slice(0,maxItems);
            const out=[];
            let bytes=2;
            for(const item of source){
              const encoded=JSON.stringify(item);
              const next=new TextEncoder().encode(encoded).byteLength + (out.length?1:0);
              if(bytes+next>maxBytes) break;
              out.push(item);
              bytes+=next;
            }
            return out;
          };
          const compactCanonical=(row)=>{
            let canonical;
            try { canonical=JSON.parse(String(row.canonical_json??"{}")); }
            catch { throw new Error("invalid AESAN canonical_json in preview source: "+row.reference); }
            const sourceRecord=object(canonical.sourceRecord);
            const classification=sourceRecord.aesanAlertClassification;
            if(!classification || typeof classification!=="object" || Array.isArray(classification)) {
              throw new Error("missing AESAN classification in preview source: "+row.reference);
            }
            const hashCandidates=[sourceRecord.sourceRecordHash,row.content_hash].map((x)=>typeof x==="string"?x.toLowerCase():"");
            const sourceRecordHash=hashCandidates.find((x)=>validHash.test(x)) ?? "0".repeat(64);
            const officialTitle=typeof sourceRecord.officialTitle==="string" && sourceRecord.officialTitle.trim()
              ? sourceRecord.officialTitle.trim() : String(row.title||row.reference||"AESAN");
            const identity={...object(canonical.identity),source:"AESAN",internalId:String(row.id)};
            const compact={
              identity,
              headline:Object.keys(object(canonical.headline)).length ? canonical.headline : { title:String(row.title||row.reference||"AESAN") },
              dates:Object.keys(object(canonical.dates)).length ? canonical.dates : { publishedAt:row.published_at??null },
              product:Object.keys(object(canonical.product)).length ? canonical.product : { name:String(row.product||"") },
              operators:array(canonical.operators).slice(0,16),
              geography:Object.keys(object(canonical.geography)).length ? canonical.geography : {},
              risk:Object.keys(object(canonical.risk)).length ? canonical.risk : {},
              resources:compactList(canonical.resources,16,12_000),
              sourceRecord:{
                sourceRecordSchemaVersion:2,
                sourceRecordHash,
                officialTitle,
                publishedFields:compactList(sourceRecord.publishedFields,8,10_000),
                materialParagraphs:compactList(sourceRecord.materialParagraphs,2,8_000),
                resources:compactList(sourceRecord.resources,8,8_000),
                officialDates:compactList(sourceRecord.officialDates,4,4_000),
                aesanAlertClassification:classification,
              },
            };
            const encoded=JSON.stringify(compact);
            const size=new TextEncoder().encode(encoded).byteLength;
            if(size>48_000) throw new Error("compacted canonical fixture still too large: "+row.reference+" "+size);
            return {...row,canonical_json:encoded};
          };

          const alerts=readRows("alerts.json").map(compactCanonical);
          if(alerts.length<50) throw new Error("preview fixture AESAN snapshot unexpectedly small: "+alerts.length);
          const maxCanonicalBytes=Math.max(...alerts.map((row)=>new TextEncoder().encode(String(row.canonical_json)).byteLength));
          console.log("PREVIEW_CANONICAL_COMPACTION "+JSON.stringify({alerts:alerts.length,maxCanonicalBytes}));
          const ids=new Set(alerts.map(r=>String(r.id)));
          const onlyIds=(rows)=>rows.filter(r=>ids.has(String(r.alert_id)));

          const dimension=onlyIds(readRows("dimension.json"));
          const geographies=onlyIds(readRows("geographies.json"));
          const aliases=readRows("aliases.json").filter(r=>ids.has(String(r.alert_id)));
          const categories=onlyIds(readRows("categories.json"));
          const hazards=onlyIds(readRows("hazards.json"));
          const syncState=readRows("sync-state.json").map(row=>({
            ...row,
            lease_owner_id:null,
            lease_mode:null,
            lease_expires_at:null,
          }));
          const freshnessState=readRows("freshness-state.json").map(row=>({...row,active_lease:0}));
          const migrations=readRows("migrations.json");
          if(migrations.length!==14||String(migrations.at(-1)?.name)!=="0013_chubby_morph.sql") throw new Error("production ledger is not at 0013");

          const template=alerts.find(r=>String(r.reference)==="ES2026/266");
          if(!template) throw new Error("mandatory ES2026/266 template unavailable for conflict fixture");
          const conflictId="preview:aesan:taxonomy-conflict";
          const conflictRef="PREVIEW/CONFLICT";
          const conflict={...template};
          conflict.id=conflictId;
          conflict.reference=conflictRef;
          conflict.title="[PREVIEW] Fixture de conflicto de clasificación AESAN";
          conflict.url="https://example.invalid/nagamealert-preview-conflict";
          conflict.content_hash="preview-taxonomy-conflict-fixture";
          conflict.version_count=1;
          conflict.is_update=0;
          conflict.detected_at="2026-09-27T19:20:00.000Z";
          conflict.updated_at="2026-09-27T19:20:00.000Z";
          conflict.published_at="2026-09-27T19:20:00.000Z";
          delete conflict.aesan_taxonomy_status;
          delete conflict.aesan_taxonomy_code;
          try{
            const canonical=JSON.parse(String(conflict.canonical_json??"{}"));
            canonical.identity={...object(canonical.identity),internalId:conflictId,source:"AESAN"};
            canonical.headline={...object(canonical.headline),title:conflict.title};
            const sourceRecord=object(canonical.sourceRecord);
            const current=object(sourceRecord.aesanAlertClassification);
            const publications=array(current.publications).map((publication)=>({
              ...object(publication),
              matches:array(object(publication).matches).map((match)=>({...object(match)})),
            }));
            if(!publications.length) throw new Error("template classification has no publications");
            const generalMatch={
              code:"general_population",
              sourceTypeId:"b5c27f12-7f21-4d2e-bc5c-d5186b4d6259",
              officialLabel:"Alertas alimentarias de interés para toda la población",
            };
            const first=publications[0];
            const existing=array(first.matches);
            if(!existing.some((match)=>object(match).code==="general_population")) existing.push(generalMatch);
            first.matches=existing
              .filter((match,index,self)=>self.findIndex((other)=>object(other).code===object(match).code)===index)
              .sort((left,right)=>String(object(left).code).localeCompare(String(object(right).code),"en"));
            canonical.sourceRecord={
              ...sourceRecord,
              aesanAlertClassification:{
                schemaVersion:1,
                status:"conflict",
                code:null,
                sourceTypeId:null,
                officialLabel:null,
                publications,
              }
            };
            conflict.canonical_json=JSON.stringify(canonical);
          }catch(error){
            throw new Error("failed to build valid conflict canonical fixture: "+String(error));
          }
          alerts.push(conflict);

          const templateId=String(template.id);
          const dimensionTemplate=dimension.find(r=>String(r.alert_id)===templateId);
          if(dimensionTemplate) dimension.push({...dimensionTemplate,alert_id:conflictId});
          for(const row of geographies.filter(r=>String(r.alert_id)===templateId)) geographies.push({...row,alert_id:conflictId});
          for(const row of categories.filter(r=>String(r.alert_id)===templateId)) categories.push({...row,alert_id:conflictId});
          for(const row of hazards.filter(r=>String(r.alert_id)===templateId)) hazards.push({...row,alert_id:conflictId});

          const lit=(value)=>{
            if(value===null||value===undefined) return "NULL";
            if(typeof value==="number"){
              if(!Number.isFinite(value)) throw new Error("non-finite numeric fixture value");
              return String(value);
            }
            if(typeof value==="boolean") return value?"1":"0";
            return "'" + String(value).replaceAll("'","''") + "'";
          };
          const insertRows=(table,rows,{exclude=[]}={})=>{
            const excluded=new Set(exclude);
            let out="";
            for(const row of rows){
              const cols=Object.keys(row).filter(k=>!excluded.has(k));
              if(!cols.length) continue;
              const statement=`INSERT OR REPLACE INTO "${table}" (${cols.map(c=>`"${c.replaceAll('"','""')}"`).join(",")}) VALUES (${cols.map(c=>lit(row[c])).join(",")});\n`;
              const statementBytes=new TextEncoder().encode(statement).byteLength;
              if(statementBytes>80_000) throw new Error("preview fixture statement too large before D1: "+table+" "+statementBytes);
              out+=statement;
            }
            return out;
          };

          let sql="";
          sql+=insertRows("d1_migrations",migrations);
          sql+=insertRows("alerts",alerts,{exclude:["aesan_taxonomy_status","aesan_taxonomy_code"]});
          sql+=insertRows("alert_dimension_state",dimension);
          sql+=insertRows("alert_geographies",geographies);
          sql+=insertRows("alert_aliases",aliases);
          sql+=insertRows("alert_categories",categories);
          sql+=insertRows("alert_hazards",hazards);
          sql+=insertRows("source_sync_state",syncState);
          sql+=insertRows("source_freshness_state",freshnessState);
          writeFileSync(join(process.env.WORK,"fixtures.sql"),sql);

          console.log("PREVIEW_FIXTURE_BUILD "+JSON.stringify({
            alerts:alerts.length,
            realAesanAlerts:alerts.length-1,
            conflictFixture:conflictRef,
            dimension:dimension.length,
            geographies:geographies.length,
            aliases:aliases.length,
            categories:categories.length,
            hazards:hazards.length,
            syncState:syncState.length,
            freshnessState:freshnessState.length,
            migrations:migrations.length
          }));
          NODE

              wrangler d1 execute "$preview_name" --remote --file="$work/fixtures.sql" --yes >/dev/null

              verify="$(wrangler d1 execute "$preview_name" --remote --command "SELECT COUNT(*) AS total, SUM(CASE WHEN source='AESAN' AND aesan_taxonomy_status='known' AND aesan_taxonomy_code='general_population' THEN 1 ELSE 0 END) AS general_population, SUM(CASE WHEN source='AESAN' AND aesan_taxonomy_status='known' AND aesan_taxonomy_code='allergy_intolerance_adverse' THEN 1 ELSE 0 END) AS allergy, SUM(CASE WHEN source='AESAN' AND aesan_taxonomy_status='known' AND aesan_taxonomy_code='food_supplements' THEN 1 ELSE 0 END) AS supplements, SUM(CASE WHEN source='AESAN' AND aesan_taxonomy_status='unknown' THEN 1 ELSE 0 END) AS unknown_count, SUM(CASE WHEN source='AESAN' AND aesan_taxonomy_status='conflict' THEN 1 ELSE 0 END) AS conflict_count, SUM(CASE WHEN source<>'AESAN' THEN 1 ELSE 0 END) AS non_aesan FROM alerts" --json)"
              mandatory="$(wrangler d1 execute "$preview_name" --remote --command "SELECT reference,aesan_taxonomy_status,aesan_taxonomy_code FROM alerts WHERE reference IN ('ES2026/266','ES2026/382','ES2026/085','ES2026/177','ES2026/517','PREVIEW/CONFLICT') ORDER BY reference" --json)"
              ledger="$(wrangler d1 execute "$preview_name" --remote --command "SELECT id,name FROM d1_migrations ORDER BY id" --json)"
              locks="$(wrangler d1 execute "$preview_name" --remote --command "SELECT COUNT(*) AS n FROM source_sync_locks" --json)"
              VERIFY="$verify" MANDATORY="$mandatory" LEDGER="$ledger" LOCKS="$locks" node --input-type=module - <<'NODE'
          const rows=(raw)=>(JSON.parse(raw||"[]")||[]).flatMap?.(x=>x.results??[])??[];
          const v=rows(process.env.VERIFY)[0]??{};
          const summary={
            total:Number(v.total??0),
            general:Number(v.general_population??0),
            allergy:Number(v.allergy??0),
            supplements:Number(v.supplements??0),
            unknown:Number(v.unknown_count??0),
            conflict:Number(v.conflict_count??0),
            nonAesan:Number(v.non_aesan??0),
          };
          if(summary.total<51||summary.general<1||summary.allergy<1||summary.supplements<1||summary.unknown<1||summary.conflict!==1||summary.nonAesan!==0){
            throw new Error("preview taxonomy fixture verification failed: "+JSON.stringify(summary));
          }
          const mandatory=rows(process.env.MANDATORY);
          const refs=new Set(mandatory.map(r=>String(r.reference)));
          for(const ref of ["ES2026/266","ES2026/382","ES2026/085","ES2026/177","ES2026/517","PREVIEW/CONFLICT"]){
            if(!refs.has(ref)) throw new Error("mandatory preview fixture missing: "+ref);
          }
          const ledger=rows(process.env.LEDGER);
          if(ledger.length!==14||String(ledger.at(-1)?.name)!=="0013_chubby_morph.sql") throw new Error("preview ledger mismatch");
          const locks=Number(rows(process.env.LOCKS)[0]?.n??-1);
          if(locks!==0) throw new Error("preview unexpectedly contains sync locks");
          console.log("PREVIEW_D1_BOOTSTRAP_PASS "+JSON.stringify({
            taxonomy:summary,
            mandatory,
            ledgerCount:ledger.length,
            ledgerLast:ledger.at(-1)?.name,
            syncLocks:locks
          }));
          NODE
              ;;
            preview-d1-create-or-inspect)
              preview_name="nagamealert-preview-db"
              list_json="$(wrangler d1 list --json)"
              set +e
              LIST_JSON="$list_json" PREVIEW_NAME="$preview_name" node --input-type=module - <<'NODE'
          const value=JSON.parse(process.env.LIST_JSON||"[]");
          const rows=Array.isArray(value)?value:(value?.result??[]);
          const matches=rows.filter((row)=>row?.name===process.env.PREVIEW_NAME);
          if(matches.length>1) throw new Error("multiple preview D1 databases with same name");
          if(matches.length===1){
            const row=matches[0];
            console.log("PREVIEW_D1_FOUND "+JSON.stringify({
              name:row.name,
              databaseId:row.uuid??row.id??row.database_id??null,
              createdAt:row.created_at??null
            }));
            process.exit(0);
          }
          console.log("PREVIEW_D1_ABSENT "+JSON.stringify({name:process.env.PREVIEW_NAME}));
          process.exit(10);
          NODE
              rc=$?
              set -e
              if [ "$rc" -eq 10 ]; then
                wrangler d1 create "$preview_name"
                echo "PREVIEW_D1_CREATE_REQUESTED name=$preview_name"
              elif [ "$rc" -ne 0 ]; then
                exit "$rc"
              fi

              info_json="$(wrangler d1 info "$preview_name" --json)"
              INFO_JSON="$info_json" PREVIEW_NAME="$preview_name" node --input-type=module - <<'NODE'
          const raw=JSON.parse(process.env.INFO_JSON||"{}");
          let row=Array.isArray(raw)?raw[0]:(raw?.result??raw);
          if(Array.isArray(row)) row=row[0];
          if(!row||typeof row!=="object") throw new Error("invalid preview D1 info payload");
          const id=row.uuid??row.id??row.database_id??null;
          const numTables=Number(row.num_tables??0);
          const fileSize=Number(row.file_size??row.database_size??0);
          if(row.name!==process.env.PREVIEW_NAME) throw new Error("preview D1 name mismatch");
          if(!id||typeof id!=="string") throw new Error("preview D1 id missing");
          if(!Number.isFinite(numTables)||numTables!==0) throw new Error("preview D1 is not empty; refusing to proceed");
          console.log("PREVIEW_D1_READY "+JSON.stringify({
            name:row.name,
            databaseId:id,
            numTables,
            fileSizeBytes:Number.isFinite(fileSize)?fileSize:null,
            runningInRegion:row.running_in_region??null,
          }));
          NODE
              ;;
            d1-info)
              test "$CF_D1" = "nagamealert-staging-db"
              info_json="$(wrangler d1 info "$CF_D1" --json)"
              INFO_JSON="$info_json" node --input-type=module - <<'NODE'
          const raw=JSON.parse(process.env.INFO_JSON||"{}");
          let row=Array.isArray(raw)?raw[0]:(raw?.result??raw);
          if(Array.isArray(row)) row=row[0];
          if(!row||typeof row!=="object") throw new Error("invalid d1 info payload");
          const fileSize=Number(row.file_size ?? row.database_size);
          const rawNumTables=Number(row.num_tables);
          if(!Number.isSafeInteger(fileSize)||fileSize<0) {
            throw new Error("missing d1 size; keys="+Object.keys(row).sort().join(","));
          }
          const numTables=Number.isSafeInteger(rawNumTables)&&rawNumTables>=0?rawNumTables:null;
          console.log("D1_INFO "+JSON.stringify({
            name:row.name??null,
            databaseId:row.uuid??row.id??row.database_id??null,
            fileSizeBytes:fileSize,
            fileSizeGiB:Number((fileSize/1024/1024/1024).toFixed(4)),
            numTables,
            version:row.version??null,
            runningInRegion:row.running_in_region??null,
          }));
          NODE
              ;;
            p4-owner-stage2b-country-benchmark)
              test "$CF_D1" = "nagamealert-staging-db"
              out="$RUNNER_TEMP/p4-stage2b-country.ndjson"
              : > "$out"

              country_tail="SELECT CASE WHEN ag.code_scheme = 'EU_COUNTRY' AND ag.geography_code = 'XI' THEN ag.geography_code ELSE ag.country_code END AS code, COUNT(DISTINCT ag.alert_id) AS alertCount FROM __FROM__ INNER JOIN alert_geographies ag ON ag.alert_id = alerts.id WHERE ag.role = 'notifying' AND ag.status = 'mapped' AND ((ag.admin_level = 'country' AND ag.code_scheme = 'ISO_3166_1_ALPHA2') OR (ag.admin_level = 'subdivision' AND ag.code_scheme = 'ISO_3166_2') OR (ag.admin_level = 'territory' AND ag.code_scheme = 'EU_COUNTRY' AND ag.geography_code = 'XI')) GROUP BY code HAVING code <> '' AND COUNT(DISTINCT ag.alert_id) > 0 ORDER BY code"

              run_variant(){
                local type="$1"
                local expected="$2"
                local variant="$3"
                local sql
                case "$variant" in
                  json_materialized)
                    sql="WITH filtered_alerts AS MATERIALIZED (SELECT alerts.id, alerts.source FROM alerts LEFT JOIN alert_dimension_state ds ON ds.alert_id = alerts.id WHERE alerts.source = 'AESAN' AND json_extract(alerts.canonical_json, '$.sourceRecord.aesanAlertClassification.status') = 'known' AND json_extract(alerts.canonical_json, '$.sourceRecord.aesanAlertClassification.code') = '$type' AND alerts.source = 'AESAN') ${country_tail/__FROM__/filtered_alerts alerts}"
                    ;;
                  generated_materialized)
                    sql="WITH filtered_alerts AS MATERIALIZED (SELECT alerts.id, alerts.source FROM alerts LEFT JOIN alert_dimension_state ds ON ds.alert_id = alerts.id WHERE alerts.source = 'AESAN' AND alerts.aesan_taxonomy_status = 'known' AND alerts.aesan_taxonomy_code = '$type' AND alerts.source = 'AESAN') ${country_tail/__FROM__/filtered_alerts alerts}"
                    ;;
                  direct_indexed)
                    sql="SELECT CASE WHEN ag.code_scheme = 'EU_COUNTRY' AND ag.geography_code = 'XI' THEN ag.geography_code ELSE ag.country_code END AS code, COUNT(DISTINCT ag.alert_id) AS alertCount FROM alerts INDEXED BY alerts_aesan_taxonomy_known_code_id_idx INNER JOIN alert_geographies ag ON ag.alert_id = alerts.id WHERE alerts.source = 'AESAN' AND alerts.aesan_taxonomy_status = 'known' AND alerts.aesan_taxonomy_code = '$type' AND ag.role = 'notifying' AND ag.status = 'mapped' AND ((ag.admin_level = 'country' AND ag.code_scheme = 'ISO_3166_1_ALPHA2') OR (ag.admin_level = 'subdivision' AND ag.code_scheme = 'ISO_3166_2') OR (ag.admin_level = 'territory' AND ag.code_scheme = 'EU_COUNTRY' AND ag.geography_code = 'XI')) GROUP BY code HAVING code <> '' AND COUNT(DISTINCT ag.alert_id) > 0 ORDER BY code"
                    ;;
                  direct_indexed_ds)
                    sql="SELECT CASE WHEN ag.code_scheme = 'EU_COUNTRY' AND ag.geography_code = 'XI' THEN ag.geography_code ELSE ag.country_code END AS code, COUNT(DISTINCT ag.alert_id) AS alertCount FROM alerts INDEXED BY alerts_aesan_taxonomy_known_code_id_idx LEFT JOIN alert_dimension_state ds ON ds.alert_id = alerts.id INNER JOIN alert_geographies ag ON ag.alert_id = alerts.id WHERE alerts.source = 'AESAN' AND alerts.aesan_taxonomy_status = 'known' AND alerts.aesan_taxonomy_code = '$type' AND ag.role = 'notifying' AND ag.status = 'mapped' AND ((ag.admin_level = 'country' AND ag.code_scheme = 'ISO_3166_1_ALPHA2') OR (ag.admin_level = 'subdivision' AND ag.code_scheme = 'ISO_3166_2') OR (ag.admin_level = 'territory' AND ag.code_scheme = 'EU_COUNTRY' AND ag.geography_code = 'XI')) GROUP BY code HAVING code <> '' AND COUNT(DISTINCT ag.alert_id) > 0 ORDER BY code"
                    ;;
                  seeded_materialized)
                    sql="WITH taxonomy_ids AS MATERIALIZED (SELECT alerts.id, alerts.source FROM alerts INDEXED BY alerts_aesan_taxonomy_known_code_id_idx WHERE alerts.source = 'AESAN' AND alerts.aesan_taxonomy_status = 'known' AND alerts.aesan_taxonomy_code = '$type') SELECT CASE WHEN ag.code_scheme = 'EU_COUNTRY' AND ag.geography_code = 'XI' THEN ag.geography_code ELSE ag.country_code END AS code, COUNT(DISTINCT ag.alert_id) AS alertCount FROM taxonomy_ids alerts INNER JOIN alert_geographies ag ON ag.alert_id = alerts.id WHERE ag.role = 'notifying' AND ag.status = 'mapped' AND ((ag.admin_level = 'country' AND ag.code_scheme = 'ISO_3166_1_ALPHA2') OR (ag.admin_level = 'subdivision' AND ag.code_scheme = 'ISO_3166_2') OR (ag.admin_level = 'territory' AND ag.code_scheme = 'EU_COUNTRY' AND ag.geography_code = 'XI')) GROUP BY code HAVING code <> '' AND COUNT(DISTINCT ag.alert_id) > 0 ORDER BY code"
                    ;;
                  *)
                    echo "unknown variant $variant" >&2
                    return 1
                    ;;
                esac

                local result plan
                result="$(wrangler d1 execute "$CF_D1" --remote --command "$sql" --json)"
                plan="$(wrangler d1 execute "$CF_D1" --remote --command "EXPLAIN QUERY PLAN $sql" --json)"
                TYPE="$type" EXPECTED="$expected" VARIANT="$variant" RESULT="$result" PLAN="$plan" OUT="$out" node --input-type=module - <<'NODE'
          import { appendFileSync } from "node:fs";
          const one=(raw)=>{const v=JSON.parse(raw||"[]"); return Array.isArray(v)?v[0]:v;};
          const result=one(process.env.RESULT)??{};
          const rows=Array.isArray(result.results)?result.results:[];
          const safeRows=rows.map(r=>({code:String(r.code??""),alertCount:Number(r.alertCount??0)}));
          const expected=Number(process.env.EXPECTED);
          if(safeRows.length!==1||safeRows[0].code!=="ES"||safeRows[0].alertCount!==expected) {
            throw new Error("Stage2B semantic mismatch "+JSON.stringify({type:process.env.TYPE,variant:process.env.VARIANT,rows:safeRows,expected}));
          }
          const p=one(process.env.PLAN)??{};
          const plan=(Array.isArray(p.results)?p.results:[]).map(r=>String(r.detail??""));
          const row={
            type:process.env.TYPE,
            variant:process.env.VARIANT,
            result:safeRows,
            rowsRead:Number(result.meta?.rows_read??result.meta?.rowsRead??-1),
            duration:Number(result.meta?.duration??-1),
            plan,
            usesTaxonomyIndex:plan.some(x=>x.includes("alerts_aesan_taxonomy_known_code_id_idx")),
          };
          console.log("P4_STAGE2B_COUNTRY "+JSON.stringify(row));
          appendFileSync(process.env.OUT,JSON.stringify(row)+"\n");
          NODE
              }

              for spec in "general_population 35" "allergy_intolerance_adverse 44" "food_supplements 6"; do
                set -- $spec
                type="$1"; expected="$2"
                for variant in json_materialized generated_materialized direct_indexed direct_indexed_ds seeded_materialized; do
                  run_variant "$type" "$expected" "$variant"
                done
              done

              OUT="$out" node --input-type=module - <<'NODE'
          import { readFileSync } from "node:fs";
          const rows=readFileSync(process.env.OUT,"utf8").trim().split("\n").filter(Boolean).map(JSON.parse);
          if(rows.length!==15) throw new Error("Stage2B benchmark count mismatch");
          const byType=Object.groupBy(rows,r=>r.type);
          const summary={};
          for(const [type,items] of Object.entries(byType)){
            const baseline=items.find(x=>x.variant==="json_materialized");
            if(!baseline) throw new Error("missing baseline "+type);
            summary[type]=items.map(x=>({
              variant:x.variant,
              rowsRead:x.rowsRead,
              duration:x.duration,
              usesTaxonomyIndex:x.usesTaxonomyIndex,
              rowsReadReductionPct:baseline.rowsRead>0
                ? Number(((1-x.rowsRead/baseline.rowsRead)*100).toFixed(2))
                : null,
              plan:x.plan,
            }));
          }
          console.log("P4_STAGE2B_COUNTRY_SUMMARY "+JSON.stringify(summary));
          NODE
