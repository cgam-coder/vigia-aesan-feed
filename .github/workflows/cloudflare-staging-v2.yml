name: Cloudflare staging operations v2

on:
  push:
    branches:
      - work/cloudflare-chat-operability-proof
    paths:
      - "ops/cloudflare-staging-v2.request.json"

permissions:
  contents: read

concurrency:
  group: cloudflare-staging-v2
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
      CF_WORKER: vigia-runtime
      CF_D1: nagamealert-staging-db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Execute allowlisted staging operation
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          request="ops/cloudflare-staging-v2.request.json"
          node --input-type=module - "$request" <<'NODE' > "$RUNNER_TEMP/request.env"
          import { readFile } from "node:fs/promises";
          const body=JSON.parse(await readFile(process.argv[2],"utf8"));
          const allowed=new Set([
            "probe","d1-canary-write","d1-canary-read",
            "worker-secret-list","worker-bootstrap-secrets",
            "worker-versions","worker-status","worker-rollback",
            "staging-bootstrap-status","staging-bootstrap-apply",
            "staging-ledger-cert","staging-http-smoke","f1b-import-manifest","f1b-import-reset","f1b-import-canary,"f1b-export-proof"
          ]);
          if(!body || typeof body!=="object" || Array.isArray(body)) throw new Error("invalid request");
          if(typeof body.operation!=="string" || !allowed.has(body.operation)) throw new Error("operation not allowed");
          if(typeof body.nonce!=="string" || !/^[A-Za-z0-9._:-]{8,120}$/.test(body.nonce)) throw new Error("invalid nonce");
          const allowedKeys=new Set(["operation","nonce","versionId"]);
          if(Object.keys(body).some(k=>!allowedKeys.has(k))) throw new Error("unexpected key");
          if(body.operation==="worker-rollback"){
            if(typeof body.versionId!=="string" || !/^[0-9a-f-]{20,80}$/i.test(body.versionId)) throw new Error("invalid versionId");
          } else if("versionId" in body) throw new Error("versionId only valid for rollback");
          console.log("OPERATION="+body.operation);
          console.log("NONCE="+body.nonce);
          if(body.versionId) console.log("VERSION_ID="+body.versionId);
          NODE
          source "$RUNNER_TEMP/request.env"
          wrangler(){ npx --yes wrangler@4.135.0 "$@"; }

          case "$OPERATION" in
            probe)
              wrangler d1 info "$CF_D1" --json >/dev/null
              wrangler deployments status --name "$CF_WORKER" --json >/dev/null
              ;;
            d1-canary-write)
              test "$CF_D1" = "nagamealert-staging-db"
              sql="CREATE TABLE IF NOT EXISTS cf_chat_control_probe (nonce TEXT PRIMARY KEY, created_at TEXT NOT NULL); INSERT OR REPLACE INTO cf_chat_control_probe (nonce, created_at) VALUES ('$NONCE', datetime('now'));"
              wrangler d1 execute "$CF_D1" --remote --command "$sql" --yes --json >/dev/null
              ;;
            d1-canary-read)
              test "$CF_D1" = "nagamealert-staging-db"
              out="$(wrangler d1 execute "$CF_D1" --remote --command "SELECT nonce FROM cf_chat_control_probe WHERE nonce='$NONCE' LIMIT 1" --json)"
              OUT="$out" EXPECTED="$NONCE" node --input-type=module -e 'const value=JSON.parse(process.env.OUT||"[]"); const rows=Array.isArray(value)?value.flatMap(x=>x.results??[]):[]; if(!rows.some(row=>row.nonce===process.env.EXPECTED)) throw new Error("canary not found");'
              ;;
            worker-secret-list)
              wrangler secret list --name "$CF_WORKER" --format json >/dev/null
              ;;
            worker-bootstrap-secrets)
              test -n "$VIGIA_SYNC_TOKEN"
              printf '%s' "$VIGIA_SYNC_TOKEN" | wrangler secret put VIGIA_SYNC_TOKEN --name "$CF_WORKER" >/dev/null
              cursor_secret="$(openssl rand -hex 32)"
              printf '%s' "$cursor_secret" | wrangler secret put VIGIA_QUERY_CURSOR_SECRET --name "$CF_WORKER" >/dev/null
              unset cursor_secret
              ;;
            worker-versions)
              versions_json="$(wrangler versions list --name "$CF_WORKER" --json)"
              VERSIONS_JSON="$versions_json" node -e 'const v=JSON.parse(process.env.VERSIONS_JSON||"[]"); const rows=Array.isArray(v)?v:[]; console.log("WORKER_VERSIONS "+JSON.stringify({count:rows.length,ids:rows.map(x=>x.id)}));'
              ;;
            worker-rollback)
              test "$CF_WORKER" = "vigia-runtime"
              wrangler rollback "$VERSION_ID" --name "$CF_WORKER" --message "NagameAlert staging rollback $NONCE" >/dev/null
              echo "WORKER_ROLLBACK version=$VERSION_ID status=PASS"
              ;;
            worker-status)
              status_json="$(wrangler deployments status --name "$CF_WORKER" --json)"
              STATUS_JSON="$status_json" node -e 'const v=JSON.parse(process.env.STATUS_JSON||"{}"); console.log("WORKER_DEPLOYMENT_STATUS "+JSON.stringify(v));'
              ;;
            staging-bootstrap-status)
              test -n "$VIGIA_SYNC_TOKEN"
              code="$(curl --silent --show-error --location --max-time 60 \
                --header "Authorization: Bearer $VIGIA_SYNC_TOKEN" \
                --output "$RUNNER_TEMP/bootstrap-status.json" --write-out '%{http_code}' \
                "https://vigia-runtime.c-gamiz93.workers.dev/api/admin/staging-bootstrap")"
              test "$code" = "200"
              node -e 'const fs=require("fs"); const b=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(b.staging!==true||b.target!=="0012") process.exit(1); console.log("STAGING_BOOTSTRAP_STATUS "+JSON.stringify({ledgerStatus:b.ledgerStatus,ledgerCount:Array.isArray(b.ledger)?b.ledger.length:null,tables:Array.isArray(b.tables)?b.tables:null}));' "$RUNNER_TEMP/bootstrap-status.json"
              ;;
            staging-bootstrap-apply)
              test -n "$VIGIA_SYNC_TOKEN"
              code="$(curl --silent --show-error --location --request POST --max-time 120 \
                --header "Authorization: Bearer $VIGIA_SYNC_TOKEN" \
                --header "X-Nagame-Staging-Bootstrap: APPLY-THROUGH-0012" \
                --output "$RUNNER_TEMP/bootstrap-apply.json" --write-out '%{http_code}' \
                "https://vigia-runtime.c-gamiz93.workers.dev/api/admin/staging-bootstrap")"
              cat "$RUNNER_TEMP/bootstrap-apply.json"
              test "$code" = "200"
              node -e 'const fs=require("fs"); const b=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!["ready","already-ready"].includes(b.status)||b.target!=="0012"||b.applied!==13) process.exit(1);' "$RUNNER_TEMP/bootstrap-apply.json"
              ;;
            staging-ledger-cert)
              out="$(wrangler d1 execute "$CF_D1" --remote --command "SELECT id,name FROM d1_migrations ORDER BY id ASC" --json)"
              OUT="$out" node -e 'const v=JSON.parse(process.env.OUT||"[]"); const rows=(Array.isArray(v)?v:[]).flatMap(x=>x.results??[]); if(rows.length!==13) throw new Error("ledger count"); const names=rows.map(r=>r.name); if(names[0]!=="0000_massive_goliath.sql"||names.at(-1)!=="0012_useful_roulette.sql"||names.some(n=>String(n).startsWith("0013_"))) throw new Error("ledger chain"); console.log("STAGING_LEDGER_CERT "+JSON.stringify({count:rows.length,first:names[0],last:names.at(-1),has0013:names.some(n=>String(n).startsWith("0013_"))}));'
              ;;
            staging-http-smoke)
              base="https://vigia-runtime.c-gamiz93.workers.dev"
              probe_url(){
                local name="$1"; local url="$2"; local expected="$3"
                local headers="$RUNNER_TEMP/$name.headers"; local body="$RUNNER_TEMP/$name.body"
                local code
                code="$(curl --silent --show-error --location --max-time 60 --dump-header "$headers" --output "$body" --write-out '%{http_code}' "$url")"
                test "$code" = "$expected"
                echo "STAGING_HTTP name=$name status=$code bytes=$(wc -c < "$body") xrobots=$(awk 'BEGIN{IGNORECASE=1} /^x-robots-tag:/{gsub("\\r",""); sub(/^[^:]*:[[:space:]]*/,""); print; exit}' "$headers")"
              }
              probe_url root "$base/" 200
              probe_url es "$base/es/" 200
              probe_url terminal "$base/api/terminal/alerts?period=7d&pageSize=1" 200
              ;;
            f1b-import-manifest)
              test -n "$VIGIA_SYNC_TOKEN"
              base="https://vigia-runtime.c-gamiz93.workers.dev"
              code="$(curl --silent --show-error --location --max-time 60 \
                --header "Authorization: Bearer $VIGIA_SYNC_TOKEN" \
                --header "X-Nagame-Migration-Import: NAGAMEALERT_STAGING_D1_IMPORT_V2" \
                --output "$RUNNER_TEMP/f1b-import-manifest.json" --write-out '%{http_code}' \
                "$base/api/admin/migration-import?mode=manifest")"
              if [ "$code" != "200" ]; then
                HTTP_CODE="$code" node - "$RUNNER_TEMP/f1b-import-manifest.json" <<'NODE'
          const fs=require("fs");
          let error="non-json response";
          try {
            const body=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
            if(typeof body?.error==="string") error=body.error.slice(0,500);
          } catch {}
          console.log("F1B_IMPORT_MANIFEST_ERROR "+JSON.stringify({http:Number(process.env.HTTP_CODE),error}));
          NODE
                exit 1
              fi
              node - "$RUNNER_TEMP/f1b-import-manifest.json" <<'NODE'
          const fs=require("fs");
          const body=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          const m=body?.import;
          if(!m||m.formatVersion!==2||m.pagination!=="logical-keyset"||m.staging!==true) throw new Error("invalid F1B staging manifest");
          if(m.scope!=="operational-post-retention"||m.pre2020ArchiveIncluded!==false) throw new Error("invalid F1B staging scope");
          if(m.ledger?.count!==13||m.ledger?.first!=="0000_massive_goliath.sql"||
             m.ledger?.last!=="0012_useful_roulette.sql"||m.ledger?.has0013!==false) throw new Error("invalid F1B staging ledger");
          if(typeof m.schema?.sha256!=="string"||!/^[a-f0-9]{64}$/.test(m.schema.sha256)) throw new Error("invalid F1B staging schema digest");
          const safe={
            formatVersion:m.formatVersion,
            pagination:m.pagination,
            staging:m.staging,
            scope:m.scope,
            pre2020ArchiveIncluded:m.pre2020ArchiveIncluded,
            ledger:{count:m.ledger.count,first:m.ledger.first,last:m.ledger.last,has0013:m.ledger.has0013},
            schema:m.schema,
            tables:m.tables,
            extraTables:m.extraTables,
            importStateRows:Array.isArray(m.importState)?m.importState.length:null,
            sqlite:m.sqlite,
          };
          console.log("F1B_IMPORT_MANIFEST "+JSON.stringify(safe));
          NODE
              ;;
            f1b-import-reset)
              test -n "$VIGIA_SYNC_TOKEN"
              base="https://vigia-runtime.c-gamiz93.workers.dev"
              common_auth=(
                --header "Authorization: Bearer $VIGIA_SYNC_TOKEN"
                --header "X-Nagame-Migration-Import: NAGAMEALERT_STAGING_D1_IMPORT_V2"
              )
              code="$(curl --silent --show-error --location --request POST --max-time 120 \
                "${common_auth[@]}" \
                --header "X-Nagame-Migration-Reset: RESET-STAGING-F1B-V2" \
                --output "$RUNNER_TEMP/f1b-reset.json" --write-out '%{http_code}' \
                "$base/api/admin/migration-import?mode=reset")"
              test "$code" = "200"
              node - "$RUNNER_TEMP/f1b-reset.json" <<'NODE'
          const fs=require("fs");
          const body=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          if(body?.import?.status!=="reset"||body?.import?.tables!==17) throw new Error("invalid F1B reset result");
          console.log("F1B_IMPORT_RESET "+JSON.stringify(body.import));
          NODE
              code="$(curl --silent --show-error --location --max-time 60 \
                "${common_auth[@]}" \
                --output "$RUNNER_TEMP/f1b-after-reset.json" --write-out '%{http_code}' \
                "$base/api/admin/migration-import?mode=manifest")"
              test "$code" = "200"
              node - "$RUNNER_TEMP/f1b-after-reset.json" <<'NODE'
          const fs=require("fs");
          const m=JSON.parse(fs.readFileSync(process.argv[2],"utf8"))?.import;
          if(!m||m.staging!==true||m.ledger?.count!==13||m.ledger?.has0013!==false) throw new Error("post-reset ledger invalid");
          if(Object.values(m.tables??{}).some(v=>v!==0)) throw new Error("post-reset operational rows remain");
          if(!Array.isArray(m.importState)||m.importState.length!==17) throw new Error("post-reset import state invalid");
          if(m.importState.some(r=>Number(r.completed)!==0||Number(r.pages)!==0||Number(r.rows_imported)!==0||r.cursor_json!==null)) throw new Error("post-reset checkpoint not clean");
          if(!Array.isArray(m.extraTables)||m.extraTables.length!==1||m.extraTables[0]!=="cf_f1b_import_state") throw new Error("post-reset extra table contract invalid");
          console.log("F1B_IMPORT_RESET_CERT "+JSON.stringify({
            ledger:{count:m.ledger.count,first:m.ledger.first,last:m.ledger.last,has0013:m.ledger.has0013},
            stateRows:m.importState.length,
            extraTables:m.extraTables,
            tables:m.tables
          }));
          NODE
              ;;
            f1b-import-canary)
              test -n "$VIGIA_SYNC_TOKEN"
              base="https://vigia-runtime.c-gamiz93.workers.dev"
              common_auth=(
                --header "Authorization: Bearer $VIGIA_SYNC_TOKEN"
                --header "X-Nagame-Migration-Import: NAGAMEALERT_STAGING_D1_IMPORT_V2"
              )
              node - "$RUNNER_TEMP/f1b-canary-page.json" "$NONCE" <<'NODE'
          const fs=require("fs");
          const crypto=require("crypto");
          const out=process.argv[2];
          const nonce=process.argv[3];
          const row={
            id:"f1b-canary:"+nonce,
            reference:"F1B-CANARY",
            source:"AESAN",
            type:"Alimentaria",
            priority:"Media",
            title:"F1B staging import canary",
            product:"Canary",
            brand:"",
            product_class:"Sin clasificar",
            product_key:"canary",
            brand_key:"",
            provider:"",
            provider_key:"",
            provider_role:"",
            provider_evidence:"",
            hazard:"Canary",
            origin:"No indicado",
            scope:"No indicado",
            action:"No action",
            lots:"[]",
            image_url:null,
            url:"https://example.invalid/f1b-canary",
            published_at:"2026-09-26T00:00:00.000Z",
            detected_at:"2026-09-26T00:00:00.000Z",
            updated_at:"2026-09-26T00:00:00.000Z",
            content_hash:"f1b-canary-"+nonce,
            version_count:1,
            is_update:0,
            canonical_json:"{}"
          };
          const stable=(value)=>{
            if(Array.isArray(value)) return value.map(stable);
            if(value&&typeof value==="object") return Object.fromEntries(Object.entries(value).sort(([a],[b])=>a.localeCompare(b)).map(([k,v])=>[k,stable(v)]));
            return value;
          };
          const canonical=JSON.stringify(stable(row));
          const sha256=crypto.createHash("sha256").update(canonical).digest("hex");
          fs.writeFileSync(out,JSON.stringify({
            table:"alerts",cursor:null,returned:1,hasMore:false,
            lastCursor:[row.id],nextCursor:null,sha256,rows:[row]
          }));
          NODE
              code="$(curl --silent --show-error --location --request POST --max-time 60 \
                "${common_auth[@]}" --header "Content-Type: application/json" \
                --data-binary "@$RUNNER_TEMP/f1b-canary-page.json" \
                --output "$RUNNER_TEMP/f1b-canary-apply.json" --write-out '%{http_code}' \
                "$base/api/admin/migration-import?mode=page")"
              test "$code" = "200"
              node - "$RUNNER_TEMP/f1b-canary-apply.json" <<'NODE'
          const fs=require("fs");
          const body=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
          if(body?.import?.status!=="page-applied"||body?.import?.table!=="alerts"||body?.import?.rows!==1||body?.import?.hasMore!==false) throw new Error("canary apply failed");
          console.log("F1B_IMPORT_CANARY_APPLY "+JSON.stringify(body.import));
          NODE
              code="$(curl --silent --show-error --location --max-time 60 \
                "${common_auth[@]}" \
                --output "$RUNNER_TEMP/f1b-canary-read.json" --write-out '%{http_code}' \
                "$base/api/admin/migration-import?mode=page&table=alerts&limit=10")"
              test "$code" = "200"
              EXPECTED_ID="f1b-canary:$NONCE" node - "$RUNNER_TEMP/f1b-canary-read.json" <<'NODE'
          const fs=require("fs");
          const page=JSON.parse(fs.readFileSync(process.argv[2],"utf8"))?.import;
          if(!page||page.returned!==1||page.hasMore!==false||page.rows?.[0]?.id!==process.env.EXPECTED_ID) throw new Error("canary readback failed");
          console.log("F1B_IMPORT_CANARY_READ "+JSON.stringify({returned:page.returned,hasMore:page.hasMore,id:page.rows[0].id,sha256:page.sha256}));
          NODE
              code="$(curl --silent --show-error --location --request POST --max-time 120 \
                "${common_auth[@]}" \
                --header "X-Nagame-Migration-Reset: RESET-STAGING-F1B-V2" \
                --output "$RUNNER_TEMP/f1b-canary-reset.json" --write-out '%{http_code}' \
                "$base/api/admin/migration-import?mode=reset")"
              test "$code" = "200"
              code="$(curl --silent --show-error --location --max-time 60 \
                "${common_auth[@]}" \
                --output "$RUNNER_TEMP/f1b-canary-final.json" --write-out '%{http_code}' \
                "$base/api/admin/migration-import?mode=manifest")"
              test "$code" = "200"
              node - "$RUNNER_TEMP/f1b-canary-final.json" <<'NODE'
          const fs=require("fs");
          const m=JSON.parse(fs.readFileSync(process.argv[2],"utf8"))?.import;
          if(!m||Object.values(m.tables??{}).some(v=>v!==0)||m.ledger?.count!==13||m.ledger?.has0013!==false) throw new Error("canary cleanup failed");
          if(!Array.isArray(m.importState)||m.importState.length!==17||m.importState.some(r=>Number(r.completed)!==0||Number(r.rows_imported)!==0)) throw new Error("canary checkpoint cleanup failed");
          console.log("F1B_IMPORT_CANARY_CLEAN "+JSON.stringify({ledgerCount:m.ledger.count,has0013:m.ledger.has0013,stateRows:m.importState.length}));
          NODE
              ;;
            f1b-export-proof)
              test -n "$VIGIA_SYNC_TOKEN"
              base="https://vigia-runtime.c-gamiz93.workers.dev"
              common_export=(
                --header "Authorization: Bearer $VIGIA_SYNC_TOKEN"
                --header "X-Nagame-Migration-Export: NAGAMEALERT_OPERATIONAL_D1_EXPORT_V2"
              )
              code="$(curl --silent --show-error --location --max-time 60 \
                "${common_export[@]}" \
                --output "$RUNNER_TEMP/f1b-export-manifest.json" --write-out '%{http_code}' \
                "$base/api/admin/migration-export?mode=manifest")"
              test "$code" = "200"
              node - "$RUNNER_TEMP/f1b-export-manifest.json" <<'NODE'
          const fs=require("fs");
          const m=JSON.parse(fs.readFileSync(process.argv[2],"utf8"))?.export;
          if(!m||m.formatVersion!==2||m.pagination!=="logical-keyset"||
             m.scope!=="operational-post-retention"||m.pre2020ArchiveIncluded!==false) throw new Error("invalid export manifest contract");
          if(m.ledger?.count!==13||m.ledger?.first!=="0000_massive_goliath.sql"||
             m.ledger?.last!=="0012_useful_roulette.sql"||m.ledger?.has0013!==false) throw new Error("invalid export ledger");
          if(typeof m.schema?.sha256!=="string"||!/^[a-f0-9]{64}$/.test(m.schema.sha256)) throw new Error("invalid export schema digest");
          if(Object.values(m.tables??{}).some(v=>v!==0)) throw new Error("staging export proof expected empty operational tables");
          console.log("F1B_EXPORT_MANIFEST "+JSON.stringify({
            formatVersion:m.formatVersion,pagination:m.pagination,scope:m.scope,
            ledger:{count:m.ledger.count,first:m.ledger.first,last:m.ledger.last,has0013:m.ledger.has0013},
            schema:m.schema,tables:m.tables,sequences:m.sequences
          }));
          NODE
              code="$(curl --silent --show-error --location --max-time 60 \
                "${common_export[@]}" \
                --output "$RUNNER_TEMP/f1b-export-page.json" --write-out '%{http_code}' \
                "$base/api/admin/migration-export?mode=page&table=alerts&limit=1")"
              test "$code" = "200"
              node - "$RUNNER_TEMP/f1b-export-page.json" <<'NODE'
          const fs=require("fs");
          const p=JSON.parse(fs.readFileSync(process.argv[2],"utf8"))?.export;
          if(!p||p.table!=="alerts"||p.cursor!==null||p.returned!==0||p.hasMore!==false||
             p.lastCursor!==null||p.nextCursor!==null||!Array.isArray(p.rows)||p.rows.length!==0||
             typeof p.sha256!=="string"||!/^[a-f0-9]{64}$/.test(p.sha256)) throw new Error("invalid empty export page");
          console.log("F1B_EXPORT_PAGE "+JSON.stringify({
            table:p.table,returned:p.returned,hasMore:p.hasMore,lastCursor:p.lastCursor,nextCursor:p.nextCursor,sha256:p.sha256
          }));
          NODE
              ;;
          esac
          echo "CLOUDFLARE_STAGING_V2 operation=$OPERATION nonce=$NONCE status=PASS"
