name: Cloudflare staging operations v2

on:
  push:
    branches:
      - work/cloudflare-chat-operability-proof
    paths:
      - "ops/cloudflare-staging-v2.request.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-staging-v2
  cancel-in-progress: false

jobs:
  operate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      CF_WORKER: vigia-runtime
      CF_D1: nagamealert-staging-db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Execute allowlisted staging operation
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          request="ops/cloudflare-staging-v2.request.json"
          node --input-type=module - "$request" <<'NODE' > "$RUNNER_TEMP/request.env"
          import { readFile } from "node:fs/promises";
          const body=JSON.parse(await readFile(process.argv[2],"utf8"));
          const allowed=new Set([
            "probe","d1-canary-write","d1-canary-read",
            "worker-secret-list","worker-bootstrap-secrets",
            "worker-versions","worker-status","worker-rollback",
            "staging-bootstrap-status","staging-bootstrap-apply",
            "staging-ledger-cert","staging-http-smoke","f1b-import-manifest","f1b-import-reset","f1b-import-canary","d1-info","postcutover-drop-import-state","p4-owner-stage1-preflight","p4-owner-lease-state","p4-owner-stage1-apply-audit","p4-owner-stage1-perf","p4-owner-taxonomy-semantic-snapshot","p4-owner-stage2-country-diagnose","p4-owner-stage2b-country-benchmark","preview-d1-create-or-inspect","owner-runtime-readonly-smoke","owner-runtime-post-preflight"
          ]);
          if(!body || typeof body!=="object" || Array.isArray(body)) throw new Error("invalid request");
          if(typeof body.operation!=="string" || !allowed.has(body.operation)) throw new Error("operation not allowed");
          if(typeof body.nonce!=="string" || !/^[A-Za-z0-9._:-]{8,120}$/.test(body.nonce)) throw new Error("invalid nonce");
          const allowedKeys=new Set(["operation","nonce","versionId","expectedFreezeRunId","expectedFreezeSha"]);
          if(Object.keys(body).some(k=>!allowedKeys.has(k))) throw new Error("unexpected key");
          if(body.operation==="worker-rollback"){
            if(typeof body.versionId!=="string" || !/^[0-9a-f-]{20,80}$/i.test(body.versionId)) throw new Error("invalid versionId");
          } else if("versionId" in body) throw new Error("versionId only valid for rollback");
          if(body.operation==="p4-owner-stage1-apply-audit"){
            if(!Number.isSafeInteger(body.expectedFreezeRunId)||body.expectedFreezeRunId<=0) throw new Error("invalid expectedFreezeRunId");
            if(typeof body.expectedFreezeSha!=="string"||!/^[a-f0-9]{40}$/i.test(body.expectedFreezeSha)) throw new Error("invalid expectedFreezeSha");
          } else if("expectedFreezeRunId" in body||"expectedFreezeSha" in body) {
            throw new Error("freeze expectations only valid for P4 apply");
          }
          console.log("OPERATION="+body.operation);
          console.log("NONCE="+body.nonce);
          if(body.versionId) console.log("VERSION_ID="+body.versionId);
          if(body.expectedFreezeRunId) console.log("EXPECTED_FREEZE_RUN_ID="+body.expectedFreezeRunId);
          if(body.expectedFreezeSha) console.log("EXPECTED_FREEZE_SHA="+body.expectedFreezeSha);
          NODE
          source "$RUNNER_TEMP/request.env"
          wrangler(){ npx --yes wrangler@4.135.0 "$@"; }

          case "$OPERATION" in
            probe)
              wrangler d1 info "$CF_D1" --json >/dev/null
              wrangler deployments status --name "$CF_WORKER" --json >/dev/null
              ;;
            d1-canary-write)
              test "$CF_D1" = "nagamealert-staging-db"
              sql="CREATE TABLE IF NOT EXISTS cf_chat_control_probe (nonce TEXT PRIMARY KEY, created_at TEXT NOT NULL); INSERT OR REPLACE INTO cf_chat_control_probe (nonce, created_at) VALUES ('$NONCE', datetime('now'));"
              wrangler d1 execute "$CF_D1" --remote --command "$sql" --yes --json >/dev/null
              ;;
            owner-runtime-post-preflight)
              test -n "$VIGIA_SYNC_TOKEN"
              base="https://vigia-runtime.c-gamiz93.workers.dev"
              for endpoint in aesan rapna safety-gate oecd rasff; do
                code="$(curl --silent --show-error --location --request POST --max-time 90 \
                  --header "Authorization: Bearer $VIGIA_SYNC_TOKEN" \
                  --output "$RUNNER_TEMP/$endpoint-preflight.json" --write-out '%{http_code}' \
                  "$base/api/$endpoint/sync?mode=preflight")"
                test "$code" = "200"
                ENDPOINT="$endpoint" node --input-type=module - "$RUNNER_TEMP/$endpoint-preflight.json" <<'NODE'
          import { readFileSync } from "node:fs";
          const body=JSON.parse(readFileSync(process.argv[2],"utf8"));
          if(body?.authorized!==true) throw new Error("preflight authorization failed");
          console.log("OWNER_RUNTIME_POST_PREFLIGHT "+JSON.stringify({
            endpoint:process.env.ENDPOINT,
            authorized:body.authorized,
            source:body.source??null,
            officialIndex:body.officialIndex?{
              totalElements:body.officialIndex.totalElements??null,
              newestReference:body.officialIndex.newest?.reference??null
            }:null
          }));
          NODE
              done
              echo "OWNER_RUNTIME_POST_PREFLIGHT_ALL status=PASS"
              ;;
            owner-runtime-readonly-smoke)
              test -n "$VIGIA_SYNC_TOKEN"
              base="https://vigia-runtime.c-gamiz93.workers.dev"
              for path in / /es/ /es/alertas; do
                code="$(curl --silent --show-error --location --max-time 60 \
                  --output "$RUNNER_TEMP/public-smoke.json" --write-out '%{http_code}' "$base$path")"
                test "$code" = "200"
                echo "OWNER_RUNTIME_PUBLIC path=$path status=$code bytes=$(wc -c < "$RUNNER_TEMP/public-smoke.json")"
              done
              for endpoint in aesan rapna safety-gate oecd rasff; do
                code="$(curl --silent --show-error --location --max-time 60 \
                  --header "Authorization: Bearer $VIGIA_SYNC_TOKEN" \
                  --output "$RUNNER_TEMP/$endpoint-observe.json" --write-out '%{http_code}' \
                  "$base/api/$endpoint/sync?observe=1")"
                test "$code" = "200"
                ENDPOINT="$endpoint" node --input-type=module - "$RUNNER_TEMP/$endpoint-observe.json" <<'NODE'
          import { readFileSync } from "node:fs";
          const body=JSON.parse(readFileSync(process.argv[2],"utf8"));
          if(!body||typeof body!=="object"||Array.isArray(body)) throw new Error("invalid observe body");
          console.log("OWNER_RUNTIME_OBSERVE "+JSON.stringify({
            endpoint:process.env.ENDPOINT,
            keys:Object.keys(body).sort(),
            hasLease:Object.prototype.hasOwnProperty.call(body,"lease"),
          }));
          NODE
              done
              code="$(curl --silent --show-error --location --max-time 60 \
                --header "Authorization: Bearer $VIGIA_SYNC_TOKEN" \
                --output "$RUNNER_TEMP/freshness-observe.json" --write-out '%{http_code}' \
                "$base/api/freshness?observe=1")"
              test "$code" = "200"
              node --input-type=module - "$RUNNER_TEMP/freshness-observe.json" <<'NODE'
          import { readFileSync } from "node:fs";
          const body=JSON.parse(readFileSync(process.argv[2],"utf8"));
          if(!Array.isArray(body?.states)) throw new Error("invalid freshness observe body");
          console.log("OWNER_RUNTIME_FRESHNESS "+JSON.stringify({
            states:body.states.length,
            sources:body.states.map((row)=>row.source).filter(Boolean).sort(),
          }));
          NODE
              echo "OWNER_RUNTIME_READONLY_SMOKE status=PASS"
              ;;
            preview-d1-create-or-inspect)
              preview_name="nagamealert-preview-db"
              list_json="$(wrangler d1 list --json)"
              LIST_JSON="$list_json" PREVIEW_NAME="$preview_name" node --input-type=module - <<'NODE'
          const value=JSON.parse(process.env.LIST_JSON||"[]");
          const rows=Array.isArray(value)?value:(value?.result??[]);
          const matches=rows.filter((row)=>row?.name===process.env.PREVIEW_NAME);
          if(matches.length>1) throw new Error("multiple preview D1 databases with same name");
          if(matches.length===1){
            const row=matches[0];
            console.log("PREVIEW_D1_FOUND "+JSON.stringify({
              name:row.name,
              databaseId:row.uuid??row.id??row.database_id??null,
              createdAt:row.created_at??null
            }));
            process.exit(0);
          }
          console.log("PREVIEW_D1_ABSENT "+JSON.stringify({name:process.env.PREVIEW_NAME}));
          process.exit(10);
          NODE
              rc=$?
              if [ "$rc" -eq 10 ]; then
                create_json="$(wrangler d1 create "$preview_name" --json)"
                CREATE_JSON="$create_json" PREVIEW_NAME="$preview_name" node --input-type=module - <<'NODE'
          const value=JSON.parse(process.env.CREATE_JSON||"{}");
          let row=Array.isArray(value)?value[0]:(value?.result??value);
          if(Array.isArray(row)) row=row[0];
          const id=row?.uuid??row?.id??row?.database_id??null;
          if(!id||typeof id!=="string") throw new Error("preview D1 create returned no database id");
          console.log("PREVIEW_D1_CREATED "+JSON.stringify({name:process.env.PREVIEW_NAME,databaseId:id}));
          NODE
              elif [ "$rc" -ne 0 ]; then
                exit "$rc"
              fi

              info_json="$(wrangler d1 info "$preview_name" --json)"
              INFO_JSON="$info_json" PREVIEW_NAME="$preview_name" node --input-type=module - <<'NODE'
          const raw=JSON.parse(process.env.INFO_JSON||"{}");
          let row=Array.isArray(raw)?raw[0]:(raw?.result??raw);
          if(Array.isArray(row)) row=row[0];
          if(!row||typeof row!=="object") throw new Error("invalid preview D1 info payload");
          const id=row.uuid??row.id??row.database_id??null;
          const numTables=Number(row.num_tables??0);
          const fileSize=Number(row.file_size??row.database_size??0);
          if(row.name!==process.env.PREVIEW_NAME) throw new Error("preview D1 name mismatch");
          if(!id||typeof id!=="string") throw new Error("preview D1 id missing");
          if(!Number.isFinite(numTables)||numTables!==0) throw new Error("preview D1 is not empty; refusing to proceed");
          console.log("PREVIEW_D1_READY "+JSON.stringify({
            name:row.name,
            databaseId:id,
            numTables,
            fileSizeBytes:Number.isFinite(fileSize)?fileSize:null,
            runningInRegion:row.running_in_region??null,
          }));
          NODE
              ;;
            d1-info)
              test "$CF_D1" = "nagamealert-staging-db"
              info_json="$(wrangler d1 info "$CF_D1" --json)"
              INFO_JSON="$info_json" node --input-type=module - <<'NODE'
          const raw=JSON.parse(process.env.INFO_JSON||"{}");
          let row=Array.isArray(raw)?raw[0]:(raw?.result??raw);
          if(Array.isArray(row)) row=row[0];
          if(!row||typeof row!=="object") throw new Error("invalid d1 info payload");
          const fileSize=Number(row.file_size ?? row.database_size);
          const rawNumTables=Number(row.num_tables);
          if(!Number.isSafeInteger(fileSize)||fileSize<0) {
            throw new Error("missing d1 size; keys="+Object.keys(row).sort().join(","));
          }
          const numTables=Number.isSafeInteger(rawNumTables)&&rawNumTables>=0?rawNumTables:null;
          console.log("D1_INFO "+JSON.stringify({
            name:row.name??null,
            databaseId:row.uuid??row.id??row.database_id??null,
            fileSizeBytes:fileSize,
            fileSizeGiB:Number((fileSize/1024/1024/1024).toFixed(4)),
            numTables,
            version:row.version??null,
            runningInRegion:row.running_in_region??null,
          }));
          NODE
              ;;
            p4-owner-stage2b-country-benchmark)
              test "$CF_D1" = "nagamealert-staging-db"
              out="$RUNNER_TEMP/p4-stage2b-country.ndjson"
              : > "$out"

              country_tail="SELECT CASE WHEN ag.code_scheme = 'EU_COUNTRY' AND ag.geography_code = 'XI' THEN ag.geography_code ELSE ag.country_code END AS code, COUNT(DISTINCT ag.alert_id) AS alertCount FROM __FROM__ INNER JOIN alert_geographies ag ON ag.alert_id = alerts.id WHERE ag.role = 'notifying' AND ag.status = 'mapped' AND ((ag.admin_level = 'country' AND ag.code_scheme = 'ISO_3166_1_ALPHA2') OR (ag.admin_level = 'subdivision' AND ag.code_scheme = 'ISO_3166_2') OR (ag.admin_level = 'territory' AND ag.code_scheme = 'EU_COUNTRY' AND ag.geography_code = 'XI')) GROUP BY code HAVING code <> '' AND COUNT(DISTINCT ag.alert_id) > 0 ORDER BY code"

              run_variant(){
                local type="$1"
                local expected="$2"
                local variant="$3"
                local sql
                case "$variant" in
                  json_materialized)
                    sql="WITH filtered_alerts AS MATERIALIZED (SELECT alerts.id, alerts.source FROM alerts LEFT JOIN alert_dimension_state ds ON ds.alert_id = alerts.id WHERE alerts.source = 'AESAN' AND json_extract(alerts.canonical_json, '$.sourceRecord.aesanAlertClassification.status') = 'known' AND json_extract(alerts.canonical_json, '$.sourceRecord.aesanAlertClassification.code') = '$type' AND alerts.source = 'AESAN') ${country_tail/__FROM__/filtered_alerts alerts}"
                    ;;
                  generated_materialized)
                    sql="WITH filtered_alerts AS MATERIALIZED (SELECT alerts.id, alerts.source FROM alerts LEFT JOIN alert_dimension_state ds ON ds.alert_id = alerts.id WHERE alerts.source = 'AESAN' AND alerts.aesan_taxonomy_status = 'known' AND alerts.aesan_taxonomy_code = '$type' AND alerts.source = 'AESAN') ${country_tail/__FROM__/filtered_alerts alerts}"
                    ;;
                  direct_indexed)
                    sql="SELECT CASE WHEN ag.code_scheme = 'EU_COUNTRY' AND ag.geography_code = 'XI' THEN ag.geography_code ELSE ag.country_code END AS code, COUNT(DISTINCT ag.alert_id) AS alertCount FROM alerts INDEXED BY alerts_aesan_taxonomy_known_code_id_idx INNER JOIN alert_geographies ag ON ag.alert_id = alerts.id WHERE alerts.source = 'AESAN' AND alerts.aesan_taxonomy_status = 'known' AND alerts.aesan_taxonomy_code = '$type' AND ag.role = 'notifying' AND ag.status = 'mapped' AND ((ag.admin_level = 'country' AND ag.code_scheme = 'ISO_3166_1_ALPHA2') OR (ag.admin_level = 'subdivision' AND ag.code_scheme = 'ISO_3166_2') OR (ag.admin_level = 'territory' AND ag.code_scheme = 'EU_COUNTRY' AND ag.geography_code = 'XI')) GROUP BY code HAVING code <> '' AND COUNT(DISTINCT ag.alert_id) > 0 ORDER BY code"
                    ;;
                  direct_indexed_ds)
                    sql="SELECT CASE WHEN ag.code_scheme = 'EU_COUNTRY' AND ag.geography_code = 'XI' THEN ag.geography_code ELSE ag.country_code END AS code, COUNT(DISTINCT ag.alert_id) AS alertCount FROM alerts INDEXED BY alerts_aesan_taxonomy_known_code_id_idx LEFT JOIN alert_dimension_state ds ON ds.alert_id = alerts.id INNER JOIN alert_geographies ag ON ag.alert_id = alerts.id WHERE alerts.source = 'AESAN' AND alerts.aesan_taxonomy_status = 'known' AND alerts.aesan_taxonomy_code = '$type' AND ag.role = 'notifying' AND ag.status = 'mapped' AND ((ag.admin_level = 'country' AND ag.code_scheme = 'ISO_3166_1_ALPHA2') OR (ag.admin_level = 'subdivision' AND ag.code_scheme = 'ISO_3166_2') OR (ag.admin_level = 'territory' AND ag.code_scheme = 'EU_COUNTRY' AND ag.geography_code = 'XI')) GROUP BY code HAVING code <> '' AND COUNT(DISTINCT ag.alert_id) > 0 ORDER BY code"
                    ;;
                  seeded_materialized)
                    sql="WITH taxonomy_ids AS MATERIALIZED (SELECT alerts.id, alerts.source FROM alerts INDEXED BY alerts_aesan_taxonomy_known_code_id_idx WHERE alerts.source = 'AESAN' AND alerts.aesan_taxonomy_status = 'known' AND alerts.aesan_taxonomy_code = '$type') SELECT CASE WHEN ag.code_scheme = 'EU_COUNTRY' AND ag.geography_code = 'XI' THEN ag.geography_code ELSE ag.country_code END AS code, COUNT(DISTINCT ag.alert_id) AS alertCount FROM taxonomy_ids alerts INNER JOIN alert_geographies ag ON ag.alert_id = alerts.id WHERE ag.role = 'notifying' AND ag.status = 'mapped' AND ((ag.admin_level = 'country' AND ag.code_scheme = 'ISO_3166_1_ALPHA2') OR (ag.admin_level = 'subdivision' AND ag.code_scheme = 'ISO_3166_2') OR (ag.admin_level = 'territory' AND ag.code_scheme = 'EU_COUNTRY' AND ag.geography_code = 'XI')) GROUP BY code HAVING code <> '' AND COUNT(DISTINCT ag.alert_id) > 0 ORDER BY code"
                    ;;
                  *)
                    echo "unknown variant $variant" >&2
                    return 1
                    ;;
                esac

                local result plan
                result="$(wrangler d1 execute "$CF_D1" --remote --command "$sql" --json)"
                plan="$(wrangler d1 execute "$CF_D1" --remote --command "EXPLAIN QUERY PLAN $sql" --json)"
                TYPE="$type" EXPECTED="$expected" VARIANT="$variant" RESULT="$result" PLAN="$plan" OUT="$out" node --input-type=module - <<'NODE'
          import { appendFileSync } from "node:fs";
          const one=(raw)=>{const v=JSON.parse(raw||"[]"); return Array.isArray(v)?v[0]:v;};
          const result=one(process.env.RESULT)??{};
          const rows=Array.isArray(result.results)?result.results:[];
          const safeRows=rows.map(r=>({code:String(r.code??""),alertCount:Number(r.alertCount??0)}));
          const expected=Number(process.env.EXPECTED);
          if(safeRows.length!==1||safeRows[0].code!=="ES"||safeRows[0].alertCount!==expected) {
            throw new Error("Stage2B semantic mismatch "+JSON.stringify({type:process.env.TYPE,variant:process.env.VARIANT,rows:safeRows,expected}));
          }
          const p=one(process.env.PLAN)??{};
          const plan=(Array.isArray(p.results)?p.results:[]).map(r=>String(r.detail??""));
          const row={
            type:process.env.TYPE,
            variant:process.env.VARIANT,
            result:safeRows,
            rowsRead:Number(result.meta?.rows_read??result.meta?.rowsRead??-1),
            duration:Number(result.meta?.duration??-1),
            plan,
            usesTaxonomyIndex:plan.some(x=>x.includes("alerts_aesan_taxonomy_known_code_id_idx")),
          };
          console.log("P4_STAGE2B_COUNTRY "+JSON.stringify(row));
          appendFileSync(process.env.OUT,JSON.stringify(row)+"\n");
          NODE
              }

              for spec in "general_population 35" "allergy_intolerance_adverse 44" "food_supplements 6"; do
                set -- $spec
                type="$1"; expected="$2"
                for variant in json_materialized generated_materialized direct_indexed direct_indexed_ds seeded_materialized; do
                  run_variant "$type" "$expected" "$variant"
                done
              done

              OUT="$out" node --input-type=module - <<'NODE'
          import { readFileSync } from "node:fs";
          const rows=readFileSync(process.env.OUT,"utf8").trim().split("\n").filter(Boolean).map(JSON.parse);
          if(rows.length!==15) throw new Error("Stage2B benchmark count mismatch");
          const byType=Object.groupBy(rows,r=>r.type);
          const summary={};
          for(const [type,items] of Object.entries(byType)){
            const baseline=items.find(x=>x.variant==="json_materialized");
            if(!baseline) throw new Error("missing baseline "+type);
            summary[type]=items.map(x=>({
              variant:x.variant,
              rowsRead:x.rowsRead,
              duration:x.duration,
              usesTaxonomyIndex:x.usesTaxonomyIndex,
              rowsReadReductionPct:baseline.rowsRead>0
                ? Number(((1-x.rowsRead/baseline.rowsRead)*100).toFixed(2))
                : null,
              plan:x.plan,
            }));
          }
          console.log("P4_STAGE2B_COUNTRY_SUMMARY "+JSON.stringify(summary));
          NODE
              ;;
            p4-owner-stage2-country-diagnose)
              test "$CF_D1" = "nagamealert-staging-db"

              generated="WITH filtered_alerts AS MATERIALIZED (SELECT alerts.id, alerts.source FROM alerts LEFT JOIN alert_dimension_state ds ON ds.alert_id = alerts.id WHERE alerts.source = 'AESAN' AND alerts.aesan_taxonomy_status = 'known' AND alerts.aesan_taxonomy_code = 'general_population' AND alerts.source = 'AESAN') SELECT CASE WHEN ag.code_scheme = 'EU_COUNTRY' AND ag.geography_code = 'XI' THEN ag.geography_code ELSE ag.country_code END AS code, COUNT(DISTINCT ag.alert_id) AS alertCount FROM filtered_alerts alerts INNER JOIN alert_geographies ag ON ag.alert_id = alerts.id WHERE ag.role = 'notifying' AND ag.status = 'mapped' AND ((ag.admin_level = 'country' AND ag.code_scheme = 'ISO_3166_1_ALPHA2') OR (ag.admin_level = 'subdivision' AND ag.code_scheme = 'ISO_3166_2') OR (ag.admin_level = 'territory' AND ag.code_scheme = 'EU_COUNTRY' AND ag.geography_code = 'XI')) GROUP BY code HAVING code <> '' AND COUNT(DISTINCT ag.alert_id) > 0 ORDER BY code"
              jsonsql="WITH filtered_alerts AS MATERIALIZED (SELECT alerts.id, alerts.source FROM alerts LEFT JOIN alert_dimension_state ds ON ds.alert_id = alerts.id WHERE alerts.source = 'AESAN' AND json_extract(alerts.canonical_json, '$.sourceRecord.aesanAlertClassification.status') = 'known' AND json_extract(alerts.canonical_json, '$.sourceRecord.aesanAlertClassification.code') = 'general_population' AND alerts.source = 'AESAN') SELECT CASE WHEN ag.code_scheme = 'EU_COUNTRY' AND ag.geography_code = 'XI' THEN ag.geography_code ELSE ag.country_code END AS code, COUNT(DISTINCT ag.alert_id) AS alertCount FROM filtered_alerts alerts INNER JOIN alert_geographies ag ON ag.alert_id = alerts.id WHERE ag.role = 'notifying' AND ag.status = 'mapped' AND ((ag.admin_level = 'country' AND ag.code_scheme = 'ISO_3166_1_ALPHA2') OR (ag.admin_level = 'subdivision' AND ag.code_scheme = 'ISO_3166_2') OR (ag.admin_level = 'territory' AND ag.code_scheme = 'EU_COUNTRY' AND ag.geography_code = 'XI')) GROUP BY code HAVING code <> '' AND COUNT(DISTINCT ag.alert_id) > 0 ORDER BY code"

              gen="$(wrangler d1 execute "$CF_D1" --remote --command "$generated" --json)"
              jsn="$(wrangler d1 execute "$CF_D1" --remote --command "$jsonsql" --json)"
              plan="$(wrangler d1 execute "$CF_D1" --remote --command "EXPLAIN QUERY PLAN $generated" --json)"
              simple="$(wrangler d1 execute "$CF_D1" --remote --command "EXPLAIN QUERY PLAN SELECT id FROM alerts WHERE source='AESAN' AND aesan_taxonomy_status='known' AND aesan_taxonomy_code='general_population' ORDER BY id LIMIT 10" --json)"
              GEN="$gen" JSN="$jsn" PLAN="$plan" SIMPLE="$simple" node --input-type=module - <<'NODE'
          const one=(raw)=>{const v=JSON.parse(raw||"[]"); return Array.isArray(v)?v[0]:v;};
          const safe=(raw)=>{
            const x=one(raw)??{};
            return {
              results:Array.isArray(x.results)?x.results:[],
              rowsRead:Number(x.meta?.rows_read??x.meta?.rowsRead??-1),
              duration:Number(x.meta?.duration??-1),
            };
          };
          const plan=(raw)=>(one(raw)?.results??[]).map(r=>String(r.detail??""));
          console.log("P4_STAGE2_COUNTRY_DIAG "+JSON.stringify({
            generated:safe(process.env.GEN),
            json:safe(process.env.JSN),
            generatedPlan:plan(process.env.PLAN),
            simplePlan:plan(process.env.SIMPLE),
          }));
          NODE
              ;;
            p4-owner-taxonomy-semantic-snapshot)
              base="https://nagamealert.com"
              probe(){
                local label="$1"
                local query="$2"
                local expected="$3"
                local body="$RUNNER_TEMP/p4-semantic-$label.json"
                local code
                code="$(curl --silent --show-error --max-time 120 --output "$body" --write-out '%{http_code}' "$base/api/terminal/alerts?$query")"
                LABEL="$label" CODE="$code" EXPECTED="$expected" BODY="$body" node --input-type=module - <<'NODE'
          import { readFileSync } from "node:fs";
          const code=Number(process.env.CODE);
          const expected=Number(process.env.EXPECTED);
          if(code!==expected) throw new Error(process.env.LABEL+" HTTP "+code+" expected "+expected);
          const body=JSON.parse(readFileSync(process.env.BODY,"utf8"));
          const snapshot={
            label:process.env.LABEL,
            http:code,
            total:Number(body?.total??-1),
            refs:Array.isArray(body?.items)?body.items.map((x)=>x.reference).filter(Boolean):[],
