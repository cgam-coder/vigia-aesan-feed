name: RAPNA category release gate (read-only single run)
on:
  push:
    branches: [sec-f1/cloudflare-api-readonly-20261009]
    paths: [.github/workflows/rapna-category-release-read-gate.yml]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Observe cloudflare runtime, certified recent states, quotas and rollback with GET only
        shell: bash
        env:
          VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const log=(o)=>console.log('RAPNA_CATEGORY_RELEASE '+JSON.stringify(o));
          const auth=process.env.VIGIA_SYNC_TOKEN;
          const cf=process.env.CLOUDFLARE_TOKEN;
          if(!auth||!cf){log({gate:'auth',pass:false});process.exitCode=1;process.exit();}
          const origin='https://vigia-runtime.c-gamiz93.workers.dev';
          async function get(url,token) {
            const r=await fetch(url,{method:'GET',redirect:'error',headers:{Authorization:'Bearer '+token,Accept:'application/json'},signal:AbortSignal.timeout(15000)});
            return {http:r.status,body:await r.json().catch(()=>null)};
          }
          try{
            const n=await get(origin+'/api/source-reliability?observe=1',auth);
            const p=await get(origin+'/api/freshness?observe=1&policy=1',auth);
            const audits=n.body?.state?.lastAudit?.states??[];
            const policyRows=Array.isArray(p.body?.policies)?p.body.policies:[];
            const policyBySource=Object.fromEntries(policyRows.map(x=>[x.source,x]));
            const freshness=['AESAN','RAPNA','RASFF','SAFETY GATE','OECD'].map(source=>{
              const state=audits.find(x=>x.source===source);
              const max=policyBySource[source]?.recent?.freshMaxAgeMinutes;
              const at=state?.lastSyncSuccessAt?Date.parse(state.lastSyncSuccessAt):NaN;
              const age=Number.isFinite(at)?Math.round((Date.now()-at)/60000):null;
              return {source,recentAgeMinutes:age,recentMaxMinutes:typeof max==='number'?max:null,
                recentFresh:typeof max==='number'&&age!==null&&age>=0&&age<=max,
                parity:state?.latestIdentityParity===true};
            });
            const att=n.body?.state??{};
            const recent=Object.entries(att.recentAttempts??{}).map(([key,v])=>({key,outcome:v?.outcome??null}));
            const unknownRecent=recent.filter(x=>x.outcome==='unknown').map(x=>x.key);
            const unknownRevision=Object.entries(att.revisionAttempts??{}).filter(([_,v])=>v?.outcome==='unknown').map(([key])=>key);
            const quarantined=Object.entries(att.revisionAttempts??{}).filter(([key,v])=>/RAPNA|RASFF|OECD/.test(key)&&v?.outcome==='failed'&&v?.nextEligibleAt==='9999-01-01T00:00:00.000Z').map(([key])=>key);
            const flags=audits.map(s=>({source:s.source,latestIdentityParity:s.latestIdentityParity===true,
              missing:(s.missingOfficialIdentities??[]).length,mismatches:(s.revisionMismatches??[]).length}));
            log({gate:'source-stability',http:n.http,mode:n.body?.mode,build_sha:n.body?.buildSha,
              age_minutes:n.body?.ageMinutes,active_lease:n.body?.activeLease,
              recent_completed:recent.filter(x=>x.outcome==='completed').length,
              recent_total:recent.length,unknown_recent:unknownRecent,unknown_revision:unknownRevision,
              quarantined_revision_attempts:quarantined,
              lastAuditAt:att.lastAudit?.finishedAt,flags,freshness,
              historical_5of5_certified:n.body?.officialParityCertified===true,
              policy_http:p.http,write_operations_performed:0});
          }catch(e){log({gate:'source-stability',error:e?.name??'Error'});process.exitCode=1;}
          for(const worker of ['vigia-runtime','vigia-source-runner']){
            try{
              const u='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f/workers/scripts/'+worker+'/deployments';
              const d=await get(u,cf);
              const entries=(d.body?.result?.deployments??[]).slice(0,2);
              log({gate:'deployment',worker,http:d.http,success:d.body?.success===true,
                current:entries[0]?{id:entries[0].id,versions:entries[0].versions?.map(v=>({id:v.version_id,pct:v.percentage}))}:null,
                previous:entries[1]?{id:entries[1].id,versions:entries[1].versions?.map(v=>({id:v.version_id,pct:v.percentage}))}:null});
            }catch(e){log({gate:'deployment',worker,error:e?.name??'Error'});process.exitCode=1;}
          }
          NODE
