name: RAPNA category postdeploy read-only and Chrome once
on:
  push:
    branches: [sec-f1/cloudflare-api-readonly-20261009]
    paths: [.github/workflows/rapna-category-postdeploy-browser-once.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check allocations and native health (GET only)
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node <<'NODE'
          const log=x=>console.log('RAPNA_CATEGORY_PROD '+JSON.stringify(x));
          const token=process.env.READ_TOKEN,cf=process.env.CF_TOKEN;
          const get=async(url,key)=>{
            const r=await fetch(url,{method:'GET',redirect:'error',headers:{Authorization:'Bearer '+key,Accept:'application/json'},signal:AbortSignal.timeout(14000)});
            return {http:r.status,payload:await r.json().catch(()=>null)};
          };
          if(!token||!cf){log({gate:'health',pass:false,reason:'missing_read_token'});process.exitCode=1;process.exit();}
          try {
            const n=await get('https://vigia-runtime.c-gamiz93.workers.dev/api/source-reliability?observe=1',token);
            const d=await get('https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f/workers/scripts/vigia-runtime/deployments',cf);
            const run=await get('https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f/workers/scripts/vigia-source-runner/deployments',cf);
            const state=n.payload?.state??{};
            const unknownRecent=Object.entries(state.attempts??{}).filter(([,v])=>v?.outcome==='unknown').map(([k])=>k);
            const unknownRevision=Object.entries(state.revisionAttempts??{}).filter(([,v])=>v?.outcome==='unknown').map(([k])=>k);
            const oldQuarantines=Object.entries(state.revisionAttempts??{}).filter(([,v])=>v?.nextEligibleAt==='9999-01-01T00:00:00.000Z').map(([k])=>k);
            const dep=d.payload?.result?.deployments??[],rdep=run.payload?.result?.deployments??[];
            const active=dep[0]??{},runner=rdep[0]??{};
            const versions=z=>Array.isArray(z.versions)?z.versions.map(v=>({id:v.version_id,pct:v.percentage})):[];
            const build=n.payload?.buildSha??null;
            const ok=n.http===200&&d.http===200&&run.http===200&&
              build==='56d4451e7f060c222b99abc3c7acd3bd88e14bdd'&&
              unknownRecent.length===0&&unknownRevision.length===0&&
              versions(active).some(v=>v.pct===100)&&versions(runner).some(v=>v.pct===100);
            log({gate:'allocation_and_health',pass:ok,build_sha:build,native_status:n.payload?.outcome??null,
              active_lease:n.payload?.activeLease??null,unknownRecent,unknownRevision,knownQuarantine:oldQuarantines,
              historical_5of5_certified:n.payload?.officialParityCertified===true,
              runtime:{deployment_id:active.id??null,versions:versions(active)},
              rollback:dep[1]?{deployment_id:dep[1].id,versions:versions(dep[1])}:null,
              runner:{deployment_id:runner.id??null,versions:versions(runner)}});
            if(!ok)process.exitCode=1;
          }catch(e){log({gate:'allocation_and_health',pass:false,error:e?.name??'Error'});process.exitCode=1;}
          NODE
      - name: Install pinned browser driver
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/rapna-filter-probe" playwright@1.56.1 --ignore-scripts --no-audit --no-fund --silent
          command -v google-chrome
      - name: Real browser smoke on public RAPNA pages
        shell: bash
        run: |
          node <<'NODE'
          const path=require('node:path');
          const {chromium}=require(path.join(process.env.RUNNER_TEMP,'rapna-filter-probe/node_modules/playwright'));
          const base='https://nagamealert.com';
          const v={gate:'browser_production',fixtures:false,checks:{},requests:0,js_errors:[]};
          const log=()=>console.log('RAPNA_CATEGORY_PROD '+JSON.stringify(v));
          let browser,context;
          (async()=>{
            try{
              browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
              context=await browser.newContext({viewport:{width:1440,height:900},locale:'es-ES',serviceWorkers:'block'});
              const page=await context.newPage();
              const filterReq=async(route)=>{
                const url=route.request().url();
                if(url.includes('/api/rapna/resource?')||url.startsWith('https://servicios.consumo.gob.es/')||
                  url.includes('google-analytics.com'))return route.abort();
                return route.continue();
              };
              await page.route('**/*',filterReq);
              page.on('request',req=>{if(req.url().startsWith(base))v.requests++;});
              page.on('pageerror',err=>{if(v.js_errors.length<3)v.js_errors.push(err.name);});
              let res=await page.goto(base+'/es/alertas?source=RAPNA&period=30d',{waitUntil:'domcontentloaded',timeout:30000});
              v.checks.spanish_load=res?.status()===200;
              const field=page.locator('fieldset.na-terminal-rapna-categories');
              await field.waitFor({state:'visible',timeout:20000});
              v.checks.panel_visible=true;
              await field.locator('summary').click();
              const search=field.locator('input[type=search]');
              await search.fill('jUgU');
              v.checks.casefold_search=(await field.locator('.na-terminal-rapna-categories__options label').count())===1;
              await search.fill('');
              await field.locator('.na-terminal-rapna-categories__options label').filter({hasText:'Juguetes'}).locator('input').check();
              await page.waitForURL(u=>new URL(u).searchParams.getAll('rapnaCategory').includes('Juguetes'),{timeout:16000});
              await page.waitForFunction(()=>document.querySelectorAll('article.na-alert-card[data-source="RAPNA"]').length===3,null,{timeout:18000});
              v.checks.toys_three=true;
              if(!await field.locator('details').evaluate(el=>el.open))await field.locator('summary').click();
              await field.locator('.na-terminal-rapna-categories__options label').filter({hasText:'Material eléctrico'}).locator('input').check();
              await page.waitForURL(u=>new URL(u).searchParams.getAll('rapnaCategory').length===2,{timeout:16000});
              await page.waitForFunction(()=>document.querySelectorAll('article.na-alert-card[data-source="RAPNA"]').length===5,null,{timeout:18000});
              v.checks.multi_five=true;
              v.checks.two_params=new URL(page.url()).searchParams.getAll('rapnaCategory').length===2;
              await page.goto(base+'/es/alertas?source=AESAN',{waitUntil:'domcontentloaded',timeout:30000});
              v.checks.aesan_isolated=(await page.locator('fieldset.na-terminal-rapna-categories').count())===0;
              res=await page.goto(base+'/en/alerts?source=RAPNA&period=30d',{waitUntil:'domcontentloaded',timeout:30000});
              await page.locator('fieldset.na-terminal-rapna-categories').waitFor({state:'visible',timeout:16000});
              v.checks.english_visible=res?.status()===200;
              await context.close();
              context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,serviceWorkers:'block'});
              const mobile=await context.newPage();
              await mobile.route('**/*',filterReq);
              mobile.on('request',req=>{if(req.url().startsWith(base))v.requests++;});
              await mobile.goto(base+'/es/alertas?source=RAPNA&period=30d',{waitUntil:'domcontentloaded',timeout:30000});
              const toggle=mobile.locator('button.na-terminal-filter-trigger');
              if(await toggle.isVisible())await toggle.click();
              await mobile.locator('fieldset.na-terminal-rapna-categories').waitFor({state:'visible',timeout:15000});
              v.checks.mobile_visible=true;
              v.pass=Object.values(v.checks).every(Boolean)&&v.js_errors.length===0&&v.requests<=250;
              if(!v.pass)process.exitCode=1;
            }catch(e){v.pass=false;v.error_type=e?.name??'Error';v.error=String(e?.message??'').split('\n')[0].slice(0,150);process.exitCode=1;}
            finally{await context?.close().catch(()=>{});await browser?.close().catch(()=>{});log();}
          })();
          NODE
