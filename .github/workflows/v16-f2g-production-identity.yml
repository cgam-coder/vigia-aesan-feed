name: V16 F2-G single production identity read
on:
  push:
    branches: [v16/f2g-production-identity-readonly]
    paths: [".github/workflows/v16-f2g-production-identity.yml"]
permissions:
  contents: read
jobs:
  read:
    if: github.event.head_commit.message == 'V16 F2-G authorized single read-only production identity' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read active deployment and minimum version metadata only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const root='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f/workers/scripts/vigia-runtime';
          const expiry=Date.parse('2026-10-05T23:59:00Z');
          if(Date.now()>expiry)throw Error('expired');
          const out={phase:'V16-F2-G',observedAt:new Date().toISOString(),worker:'vigia-runtime',plane:'production',productionMutationAttempts:0,reads:[]};
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!token)throw Error('credential-unavailable');
          async function get(path){
            if(path!=='/deployments'&&!/^\/versions\/[a-f0-9-]{36}$/.test(path))throw Error('path-outside-scope');
            const r=await fetch(root+path,{method:'GET',redirect:'error',headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(15000)});
            out.reads.push({path,http:r.status,at:new Date().toISOString()});
            if(!r.ok)throw Error('http-'+r.status);
            const j=await r.json();if(j.success!==true||!j.result)throw Error('invalid-envelope');return j.result;
          }
          try{
            const a=await get('/deployments'),active=a.deployments?.[0];
            if(!active?.id||active.versions?.length!==1||active.versions[0].percentage!==100)throw Error('ambiguous-production');
            const versionId=active.versions[0].version_id;
            const v=await get('/versions/'+versionId);
            if(v.id!==versionId)throw Error('version-identity-mismatch');
            out.active={deploymentId:active.id,createdOn:active.created_on,source:active.source,strategy:active.strategy,versions:active.versions.map(x=>({versionId:x.version_id,percentage:x.percentage}))};
            out.version={id:v.id,number:v.number,metadata:v.metadata,annotations:v.annotations};
            const b=await get('/deployments');
            const current=b.deployments?.[0];
            if(current?.id!==active.id||JSON.stringify(current.versions)!==JSON.stringify(active.versions))throw Error('active-deployment-drift');
            out.status='PASS';out.completedAt=new Date().toISOString();
          }catch(e){out.status='HOLD';out.reason=e.message;process.exitCode=1;}
          console.log('F2G_PRODUCTION_IDENTITY '+JSON.stringify(out));
          NODE
