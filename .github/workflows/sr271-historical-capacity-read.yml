name: SR271 historical bounded official read capacity and exact identity hash parity
on:
  push:
    branches: [source-reliability/recovery-snapshot-20261009]
    paths: [.github/workflows/sr271-historical-capacity-read.yml]
permissions:
  contents: read
jobs:
  official_read:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Primary SELECT preserved cursors official read endpoints only no persistence
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node --input-type=module <<'NODE'
          import{gunzipSync}from'node:zlib';import{createHash}from'node:crypto';import{writeFileSync}from'node:fs';
          const b=gunzipSync(Buffer.from('','base64'));if(createHash('sha256').update(b).digest('hex')!=='90a8763e2dab8d6673968b37ce6ab712336133e1a973e99ee5e67edc3e5d1740')throw Error('Read artifact hash drift');writeFileSync('sr271-capacity-read.mjs',b);await import('./sr271-capacity-read.mjs');
          NODE
