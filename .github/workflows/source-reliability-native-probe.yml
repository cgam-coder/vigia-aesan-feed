name: Source reliability native read-only probe
on:
  push:
    branches: [source-reliability/native-probe-20261008]
permissions:
  contents: read
jobs:
  probe:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Provision probe-only runner and read both official sources
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const root='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f';
          const script='/workers/scripts/vigia-source-runner';
          const expected='76eaef5f-0e16-40b8-9856-cf2d9d9e6576';
          const bundle=readFileSync('ops/source-reliability/source-runner-probe.mjs');
          if(createHash('sha256').update(bundle).digest('hex')!=='d6dddfb17fbbaf574653514cbb366b78060d9eee6402eb1478dba10b5d9ab10a')throw Error('artifact mismatch');
          async function cf(path,method='GET',body){
            if(Date.now()>Date.parse('2026-10-08T13:30:00Z'))throw Error('expired probe');
            if(![script,script+'/settings',script+'/subdomain',script+'/schedules',script+'/deployments','/workers/scripts/vigia-runtime/deployments'].includes(path))throw Error('invalid scope');
            if(method!=='GET'&&!path.startsWith(script))throw Error('production mutation forbidden');
            const headers={Authorization:'Bearer '+process.env.CF_TOKEN};
            if(body&&!(body instanceof FormData))headers['Content-Type']='application/json';
            const response=await fetch(root+path,{method,headers,body:body instanceof FormData?body:body?JSON.stringify(body):undefined,redirect:'error',signal:AbortSignal.timeout(45000)});
            if(response.status===404&&method==='GET')return null;
            const result=await response.json();if(!response.ok||!result.success)throw Error('CF '+method+' HTTP '+response.status+' codes '+JSON.stringify(result.errors?.map(x=>x.code)));
            return result.result;
          }
          const allocation=await cf('/workers/scripts/vigia-runtime/deployments');
          if(allocation.deployments?.[0]?.versions?.length!==1||allocation.deployments[0].versions[0].version_id!==expected||allocation.deployments[0].versions[0].percentage!==100)throw Error('runtime baseline moved');
          const prior=await cf(script+'/settings'),runnerAllocation=await cf(script+'/deployments');
          if(!prior?.bindings?.some(b=>b.name==='SOURCE_RUNNER_MODE'&&b.text==='probe')||runnerAllocation?.deployments?.[0]?.versions?.length!==1||runnerAllocation.deployments[0].versions[0].version_id!=='4e757c99-0aed-4eb8-bb54-9ac76fde46d8'||runnerAllocation.deployments[0].versions[0].percentage!==100)throw Error('runner baseline moved');
          const metadata={main_module:'source-runner.mjs',compatibility_date:'2026-09-25',compatibility_flags:['nodejs_compat'],usage_model:'standard',limits:{cpu_ms:60000},observability:{enabled:true},annotations:{'workers/message':'source-reliability-probe:637e895a6966aa14510c9463f753768e95e1519a'},bindings:[{type:'d1',name:'DB',id:'55596003-1b90-4f66-aad8-decb21205f13'},{type:'plain_text',name:'SOURCE_RUNNER_MODE',text:'probe'},{type:'secret_text',name:'VIGIA_SYNC_TOKEN',text:process.env.SYNC_TOKEN}]};
          const form=new FormData();form.set('metadata',new Blob([JSON.stringify(metadata)],{type:'application/json'}));form.set('source-runner.mjs',new Blob([bundle],{type:'application/javascript+module'}),'source-runner.mjs');
          const uploaded=await cf(script,'PUT',form);console.log('SR_NATIVE_ARTIFACT '+JSON.stringify({at:new Date().toISOString(),candidate:'637e895a6966aa14510c9463f753768e95e1519a',sha256:'d6dddfb17fbbaf574653514cbb366b78060d9eee6402eb1478dba10b5d9ab10a',mode:'probe',startupMs:uploaded.startup_time_ms,id:uploaded.id}));
          const currentRunnerAllocation=await cf(script+'/deployments');
          let enabled=false;
          try{
            const settings=await cf(script+'/settings');
            if(!settings.bindings?.some(b=>b.name==='SOURCE_RUNNER_MODE'&&b.text==='probe')||!Array.isArray((await cf(script+'/schedules'))?.schedules)||(await cf(script+'/schedules')).schedules.length!==0)throw Error('runner is not cron-free probe');
            await cf(script+'/subdomain','POST',{enabled:true,previews_enabled:false});enabled=true;
            const base='https://vigia-source-runner.c-gamiz93.workers.dev';
            let ready=false;
            for(let attempt=0;attempt<7;attempt++){
              const unauthorized=await fetch(base+'/status',{signal:AbortSignal.timeout(15000)});
              console.log('SR_NATIVE_READINESS '+JSON.stringify({attempt,http:unauthorized.status}));
              if(unauthorized.status===401){ready=true;break;}
              if(![404,502,503,520,522,523].includes(unauthorized.status))throw Error('probe authentication HTTP '+unauthorized.status);
              await unauthorized.body?.cancel();await new Promise(resolve=>setTimeout(resolve,Math.min(10000,1000*2**attempt)));
            }
            if(!ready)throw Error('bounded endpoint propagation timeout');
            const statusResponse=await fetch(base+'/status',{headers:{Authorization:'Bearer '+process.env.SYNC_TOKEN},signal:AbortSignal.timeout(15000)});
            const status=await statusResponse.json();if(statusResponse.status!==200||status.mode!=='probe'||status.configVersion!==2||status.hasCron!==false)throw Error('authenticated probe status failed');
            for(const source of ['AESAN']){
              const path='/probe?source='+encodeURIComponent(source)+(source==='AESAN'?'&full=1':'');
              const response=await fetch(base+path,{method:'GET',headers:{Authorization:'Bearer '+process.env.SYNC_TOKEN},signal:AbortSignal.timeout(380000),redirect:'error'});
              const body=await response.json();console.log('SR_NATIVE_PROBE '+JSON.stringify({http:response.status,...body}));
              if(body.zeroWrite!==true)throw Error('missing zero-write witness');
            }
          }finally{
            if(enabled)await cf(script+'/subdomain','POST',{enabled:false,previews_enabled:false});
            if(JSON.stringify(currentRunnerAllocation)!==JSON.stringify(await cf(script+'/deployments')))throw Error('runner allocation changed');
            const after=await cf('/workers/scripts/vigia-runtime/deployments');
            if(JSON.stringify(allocation)!==JSON.stringify(after))throw Error('production allocation changed');
            console.log('SR_NATIVE_CLEANUP '+JSON.stringify({at:new Date().toISOString(),endpointDisabled:true,productionUnchanged:true}));
          }
          NODE
