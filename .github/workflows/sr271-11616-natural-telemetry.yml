name: SR27111616 natural lifecycle readonly telemetry
on:
  push:
    branches: [source-reliability/recovery-snapshot-20261009]
    paths: [.github/workflows/sr271-11616-natural-telemetry.yml]
permissions:
  contents: read
jobs:
  telemetry:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Bounded official dry telemetry source lifecycle without secrets in output
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node --input-type=module <<'NODE'
          if(Number(process.env.RUN_ATTEMPT)!==1||Date.now()>Date.parse('2026-10-09T11:20:00Z'))throw Error('Readonly natural telemetry checkpoint expired');
          while(Date.now()<Date.parse('2026-10-09T10:48:00Z'))await new Promise(r=>setTimeout(r,5000));
          const root='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f';
          for(const service of ['vigia-source-runner','vigia-runtime']){
           const filters=[{key:'$metadata.service',operation:'eq',type:'string',value:service}];if(service==='vigia-runtime')filters.push({key:'$workers.eventType',operation:'eq',type:'string',value:'scheduled'});
           const body={queryId:'sr271-116-16-natural-'+service+'-'+Date.now(),dry:true,view:'invocations',limit:100,timeframe:{from:Date.parse('2026-10-09T10:30:00Z'),to:Date.now()},parameters:{filterCombination:'and',filters}};
           const r=await fetch(root+'/workers/observability/telemetry/query',{method:'POST',headers:{Authorization:'Bearer '+process.env.CF_TOKEN,'Content-Type':'application/json'},body:JSON.stringify(body),signal:AbortSignal.timeout(30000)}),p=await r.json();
           if(!r.ok||!p.success||p.result?.run?.dry!==true)throw Error('Dry telemetry query unconfirmed');
           console.log('SR271_116_16_NATURAL_TELEMETRY '+JSON.stringify({at:new Date().toISOString(),service,dry:p.result.run.dry,events:Object.values(p.result.invocations??{}).flat().map(x=>({at:x.timestamp,component:x.source?.component,sourceOutcome:x.source?.outcome,sourceName:x.source?.source,service:x.$metadata?.service,requestId:x.$metadata?.requestId,traceId:x.$metadata?.traceId,version:x.$workers?.scriptVersion?.id,outcome:x.$workers?.outcome,cpuMs:x.$workers?.cpuTimeMs,wallMs:x.$workers?.wallTimeMs}))}));
          }
          console.log('SR271_116_16_TELEMETRY_COMPLETE '+JSON.stringify({at:new Date().toISOString(),zeroWrite:true,noSourceInvocationsInitiated:true}));
          NODE
