name: Source reliability post-payload bounded natural check
on:
  push:
    branches: [source-reliability/post-payload-natural-20261008]
permissions:
  contents: read
jobs:
  verify:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Bounded real-coordinator observation and strict watchdog
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {runWatchdog} from './scripts/freshness-watchdog.mjs';
          const base='https://vigia-runtime.c-gamiz93.workers.dev',root='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f',deadline=Date.parse('2026-10-08T15:40:00Z');
          const expected='937ee3bbb18b19eb7bb0b03654ca64dcd5faa832';
          async function read(path){const r=await fetch(base+path,{method:'GET',headers:{Authorization:'Bearer '+process.env.VIGIA_SYNC_TOKEN,'Cache-Control':'no-store'},signal:AbortSignal.timeout(30000)});if(r.status!==200&&r.status!==503)throw Error('GET HTTP '+r.status);return {http:r.status,body:await r.json()};}
          async function cf(path){if(!/^\/workers\/scripts\/(vigia-runtime|vigia-source-runner)\/(deployments|settings|schedules|versions\/[a-f0-9-]{36})$/.test(path))throw Error('unapproved read');const r=await fetch(root+path,{method:'GET',headers:{Authorization:'Bearer '+process.env.CF_TOKEN},signal:AbortSignal.timeout(30000)});const p=await r.json();if(!r.ok||!p.success)throw Error('CF read unconfirmed');return p.result;}
          let final=null,seenNew=false;
          while(Date.now()<deadline){
            const owner=await read('/api/source-reliability?observe=1');final=owner.body;
            seenNew||=final.buildSha===expected;
            const state=final.state;
            console.log('SR_NATURAL_RESUME '+JSON.stringify({at:new Date().toISOString(),http:owner.http,buildSha:final.buildSha,mode:final.mode,activeLease:final.activeLease,epoch:final.epoch,officialParityCertified:final.officialParityCertified,
              lastWakeAt:state?.lastWakeAt,lastOutcome:state?.lastOutcome,attempts:state?.attempts,revisionAttempts:state?.revisionAttempts,lastAuditAt:state?.lastAuditAt,lastAudit:state?.lastAudit&&{allFresh:state.lastAudit.allFresh,startedAt:state.lastAudit.startedAt,finishedAt:state.lastAudit.finishedAt,states:state.lastAudit.states?.map(x=>({source:x.source,status:x.status,lastSyncSuccessAt:x.lastSyncSuccessAt,latestIdentityParity:x.latestIdentityParity,missing:x.missingOfficialIdentities,revisionStatus:x.revisionStatus,error:x.error}))}}));
            if(seenNew&&final.activeLease===false&&(final.officialParityCertified===true||['AESAN','RAPNA','OECD'].every(s=>state?.attempts?.[s]?.outcome==='completed'&&Date.parse(state.attempts[s].startedAt)>=Date.parse('2026-10-08T15:20:00Z'))))break;
            await new Promise(resolve=>setTimeout(resolve,Math.min(60000,Math.max(1,deadline-Date.now()))));
          }
          const allocations={runtime:await cf('/workers/scripts/vigia-runtime/deployments'),runner:await cf('/workers/scripts/vigia-source-runner/deployments')};
          console.log('SR_RESUME_FINAL_ALLOCATION '+JSON.stringify({runtime:allocations.runtime.deployments?.slice(0,3),runner:allocations.runner.deployments?.slice(0,2)}));
          const sourceStates=[];
          for(const route of ['aesan','rapna','rasff','safety-gate','oecd'])sourceStates.push({route,...await read('/api/'+route+'/sync?observe=1')});
          console.log('SR_RESUME_FINAL_SOURCE_STATES '+JSON.stringify(sourceStates));
          const settings=await cf('/workers/scripts/vigia-runtime/settings'),schedule=await cf('/workers/scripts/vigia-runtime/schedules'),rs=await cf('/workers/scripts/vigia-source-runner/settings'),rc=await cf('/workers/scripts/vigia-source-runner/schedules');
          const flag=(s,n)=>s.bindings?.find(b=>b.name===n)?.text??null;
          console.log('SR_RESUME_FINAL_CONFIGURATION '+JSON.stringify({schedulerMode:flag(settings,'NAGAMEALERT_RECENT_SCHEDULER_MODE'),delta:flag(settings,'NAGAMEALERT_SAFETY_GATE_RECENT_MODE'),schedules:schedule,runnerMode:flag(rs,'SOURCE_RUNNER_MODE'),runnerSchedules:rc}));
          for(const sql of ["SELECT id,source,mode,kind,epoch,started_at,deadline,phase,write_intent_at,finished_at,receipt_json FROM source_reliability_jobs WHERE finished_at IS NULL OR started_at>='2026-10-08T14:45:00Z' ORDER BY started_at","SELECT * FROM source_sync_locks","SELECT source,mode,cycle_id,completed_at,total_units,records_observed,coverage,audit_status,audit_checked_at,evidence_json,updated_at FROM source_revision_certifications WHERE source='SAFETY GATE'"]){
            const r=await fetch(root+'/d1/database/55596003-1b90-4f66-aad8-decb21205f13/query',{method:'POST',headers:{Authorization:'Bearer '+process.env.CF_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({sql}),signal:AbortSignal.timeout(30000)}),p=await r.json();
            console.log('SR_RESUME_FINAL_SELECT '+JSON.stringify({sql,http:r.status,data:p}));if(!r.ok||!p.success||p.result?.some(x=>!x.success||x.meta?.changes||x.meta?.rows_written))throw Error('D1 read unconfirmed');
          }
          for(const service of ['vigia-runtime','vigia-source-runner']){
            const query={queryId:'source-reliability-cancellation-final-read',dry:true,view:'events',limit:100,timeframe:{from:Date.parse('2026-10-08T13:40:00Z'),to:Date.now()},parameters:{filters:[{key:'$metadata.service',operation:'eq',type:'string',value:service},{key:'$workers.outcome',operation:'eq',type:'string',value:'canceled'}],filterCombination:'and'}};
            const r=await fetch(root+'/workers/observability/telemetry/query',{method:'POST',headers:{Authorization:'Bearer '+process.env.CF_TOKEN,'Content-Type':'application/json'},body:JSON.stringify(query),signal:AbortSignal.timeout(30000)}),p=await r.json(),events=Array.isArray(p.result?.events)?p.result.events:p.result?.events?.events??[];
            let output=JSON.stringify({service,http:r.status,success:p.success,events:events.map(e=>({metadata:e.$metadata,worker:{outcome:e.$workers?.outcome,eventType:e.$workers?.eventType,scriptVersion:e.$workers?.scriptVersion,wallTimeMs:e.$workers?.wallTimeMs,cpuTimeMs:e.$workers?.cpuTimeMs},error:e.error,message:e.message}))});for(const secret of [process.env.CF_TOKEN,process.env.VIGIA_SYNC_TOKEN])if(secret)output=output.replaceAll(secret,'***');
            console.log('SR_RESUME_FINAL_CANCELLED '+output);
          }
          const report=await runWatchdog({url:base+'/api/freshness',token:process.env.VIGIA_SYNC_TOKEN,fetchImpl:(url,init)=>{if(init?.method!=='GET')throw Error('verification forbids mutations');return fetch(url,init);}});
          console.log('SR_RESUME_STRICT_RESULT '+JSON.stringify({at:new Date().toISOString(),zeroWrite:true,expectedBuild:expected,seenNew,report}));
          if(!seenNew||!report.allFresh||report.states.length!==5||!report.states.every(s=>s.verdict==='PASS'))process.exitCode=1;
          NODE
