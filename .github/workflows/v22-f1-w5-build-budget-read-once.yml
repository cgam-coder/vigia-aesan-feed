name: V22 F1-W5 Cloudflare Builds budget preflight (GET only)
on:
  push:
    branches: [audit/v22-f1-w5-build-budget-read-20261011]
    paths: [.github/workflows/v22-f1-w5-build-budget-read-once.yml]
permissions: { contents: read }
concurrency:
  group: v22-f1-w5-build-budget-read
  cancel-in-progress: false
jobs:
  observe:
    if: github.repository == 'cgam-coder/vigia-aesan-feed' && github.actor == 'cgam-coder' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: GET Builds budget only (no billing or secrets in logs)
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CF_TOKEN,account='9c1807c68493f14259248b5f5782cc6f';
          const output=x=>console.log('V22_BUILDS_PREFLIGHT '+JSON.stringify(x));
          if(!token){output({available:false,reason:'missing-token'});process.exitCode=1;process.exit();}
          const target='https://api.cloudflare.com/client/v4/accounts/'+account+'/builds/account/limits';
          try {
            const r=await fetch(target,{method:'GET',redirect:'error',headers:{Authorization:'Bearer '+token,Accept:'application/json'},signal:AbortSignal.timeout(12000)});
            const j=await r.json().catch(()=>null),data=j?.result;
            const scalar={};
            if(data&&typeof data==='object')for(const[k,v]of Object.entries(data)){
              if(typeof v==='number'&&/minutes|remaining|used|limit|quota|included|count/i.test(k))scalar[k]=v;
              else if(v&&typeof v==='object')for(const[n,w]of Object.entries(v))if(typeof w==='number'&&/minutes|remaining|used|limit|quota|included|count/i.test(n))scalar[k+'.'+n]=w;
            }
            output({http:r.status,success:j?.success===true,available:Boolean(r.ok&&j?.success===true),limits:scalar, keys:data?Object.keys(data):[],requestKind:'GET',zeroWrite:true});
            if(!r.ok||j?.success!==true)process.exitCode=1;
          } catch {output({http:0,available:false,reason:'transport-error'});process.exitCode=1;}
          NODE
