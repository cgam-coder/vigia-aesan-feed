name: TEMP UI Appium certification with verified frozen dependencies
# One corrective native campaign. No automatic reruns and no production writes.
"on":
  push:
    branches: [diag/ui-f1a-ios-simulator-20261001]
    paths: [.github/workflows/ui-f1a-appium-certify.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: nagamealert-ui-appium-certify
  cancel-in-progress: false
jobs:
  preflight:
    if: >-
      github.repository == 'cgam-coder/vigia-aesan-feed' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/diag/ui-f1a-ios-simulator-20261001' &&
      github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Complete original suites and exact client preflight
        run: |
          echo 'ca28051e7afb22dc705a9669aa79508b5892f2ce5ffb22323ccfca39e96a87b7  .diagnostics/appium-native/hashes.json' | sha256sum -c -
          npm test
          node --test security-checks/workflow-security.test.mjs .diagnostics/appium-native/scope.test.mjs
          python3 -m unittest discover -s .diagnostics/appium-native -p 'test_*.py' -v
          python3 .diagnostics/appium-native/preflight.py
  native:
    needs: preflight
    if: needs.preflight.result == 'success' && github.run_attempt == '1'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Anchor all reserves to the real GitHub job start
        env:
          METADATA_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,json,time,datetime,urllib.request
          repo=os.environ['GITHUB_REPOSITORY'];run=os.environ['GITHUB_RUN_ID']
          assert repo=='cgam-coder/vigia-aesan-feed'
          url=f'https://api.github.com/repos/{repo}/actions/runs/{run}/jobs?per_page=10'
          req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['METADATA_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=15) as response:data=json.load(response)
          jobs=[j for j in data['jobs'] if j['name']=='native' and j['status']=='in_progress']
          assert len(jobs)==1,'Ambiguous actual job clock'
          epoch=datetime.datetime.fromisoformat(jobs[0]['started_at'].replace('Z','+00:00')).timestamp()
          assert 0<=time.time()-epoch<180,'Invalid actual start timestamp'
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write(f'NA_JOB_STARTED_EPOCH={epoch}\n')
          print(json.dumps({'nativeJobId':jobs[0]['id'],'startedAt':jobs[0]['started_at'],'maxSeconds':1800}))
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: |
            .diagnostics/appium-native
            .github/workflows
            security-checks
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Retrieve immutable dependency inputs from the verified Ubuntu run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: cgam-coder/vigia-aesan-feed
          run-id: 36931076558
          name: appium-reviewed-deps-36931076558
          path: ${{ runner.temp }}/appium-lock
      - name: Verify the same frozen client and security contract on Apple
        id: security
        run: |
          echo 'ca28051e7afb22dc705a9669aa79508b5892f2ce5ffb22323ccfca39e96a87b7  .diagnostics/appium-native/hashes.json' | shasum -a 256 -c -
          node --test security-checks/workflow-security.test.mjs .diagnostics/appium-native/scope.test.mjs
          python3 .diagnostics/appium-native/preflight.py
      - name: Install frozen graph, build WDA once, execute independent clean-profile blocks
        id: campaign
        run: python3 .diagnostics/appium-native/runner.py
      - name: Preserve bounded original native evidence even when cases fail
        if: always() && steps.security.outcome == 'success'
        timeout-minutes: 3
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-appium-native-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/nagamealert-appium/evidence.zip
            ${{ runner.temp }}/nagamealert-appium/integrity.json
          if-no-files-found: error
          retention-days: 2
