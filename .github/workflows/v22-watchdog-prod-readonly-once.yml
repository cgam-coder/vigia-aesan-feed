name: V22 PR90 bounded settle observation (read only)
on:
  push:
    branches: [audit/v22-pr90-prod-readonly-20261011]
    paths: [.github/workflows/v22-watchdog-prod-readonly-once.yml]
permissions: { contents: read }
concurrency:
  group: v22-pr90-prod-readonly-once
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'cgam-coder/vigia-aesan-feed' && github.actor == 'cgam-coder' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Observe stable quiescent snapshot using GET and static SELECT only
        shell: bash
        env:
          RUNTIME_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const rt=process.env.RUNTIME_TOKEN,cf=process.env.CF_TOKEN,base='https://nagamealert.com';
          const account='9c1807c68493f14259248b5f5782cc6f',db='55596003-1b90-4f66-aad8-decb21205f13';
          const expected='0c61589b485a1e40ab8728378e14b85631f89d36';
          const sources=['AESAN','RAPNA','RASFF','SAFETY GATE','OECD'];
          const say=(o)=>console.log('V22_SETTLE '+JSON.stringify(o));
          const sql='SELECT EXISTS(SELECT 1 FROM source_reliability_jobs WHERE finished_at IS NULL) AS unfinished_jobs, EXISTS(SELECT 1 FROM source_sync_locks WHERE expires_at>?) AS active_source_locks, EXISTS(SELECT 1 FROM source_reliability_control WHERE expires_at>?) AS active_control_lease';
          async function get(url,token,payload=null) {
            if(!token)return {http:0,body:null};
            try {const r=await fetch(url,{method:payload?'POST':'GET',redirect:'error',headers:{
              Authorization:'Bearer '+token,Accept:'application/json',...(payload?{'Content-Type':'application/json'}:{})},
              ...(payload?{body:JSON.stringify(payload)}:{}),signal:AbortSignal.timeout(16000)});
              return {http:r.status,body:await r.json().catch(()=>null)};
            }catch{return {http:0,body:null};}
          }
          const policy=await get(base+'/api/freshness?observe=1&policy=1',rt);
          const rows=Array.isArray(policy.body?.policies)?policy.body.policies:[];
          let seen=false;
          for(let i=0;i<4;i++){
            if(i>0)await new Promise(done=>setTimeout(done,20000));
            const n=await get(base+'/api/source-reliability?observe=1',rt);
            const b=n.body??{},s=b.state??{},audit=s.lastAudit??{};
            const evidence=Array.isArray(audit.states)?audit.states:[];
            const now=Date.now(),age=x=>typeof x==='string'&&Number.isFinite(Date.parse(x))&&Date.parse(x)<=now?(now-Date.parse(x))/60000:null;
            const recent=sources.map(source=>{
              const row=evidence.find(x=>x?.source===source),p=rows.find(x=>x?.source===source);
              const last=age(row?.lastSyncSuccessAt),checked=age(row?.checkedAt);
              return {source,ok:Boolean(row&&p&&last!==null&&checked!==null&&
                last<=p.recent?.freshMaxAgeMinutes&&checked<=p.recent?.freshMaxAgeMinutes&&
                row.error===null&&row.latestIdentityParity===true&&row.missingOfficialIdentities?.length===0&&
                row.revisionMismatches?.length===0&&s.attempts?.[source]?.outcome==='completed'),
                attempt:s.attempts?.[source]?.outcome??null};
            });
            const iso=new Date().toISOString();
            const d=await get('https://api.cloudflare.com/client/v4/accounts/'+account+'/d1/database/'+db+'/query',cf,{sql,params:[iso,iso]});
            const r=Array.isArray(d.body?.result)?d.body.result[0]?.results?.[0]:null;
            const leasesClear=Boolean(d.http===200&&d.body?.success===true&&r&&r.unfinished_jobs===0&&
              r.active_source_locks===0&&r.active_control_lease===0);
            const wake=age(s.lastWakeAt),auditAge=age(audit.finishedAt);
            const ok=n.http===200&&policy.http===200&&b.mode==='five-source-coordinated'&&
              b.buildSha===expected&&b.outcome==='observed'&&b.activeLease===false&&
              wake!==null&&wake<=15&&auditAge!==null&&auditAge<=15&&
              evidence.length===5&&rows.length===5&&recent.every(x=>x.ok)&&leasesClear;
            say({sample:i+1,at:iso,http:n.http,policyHttp:policy.http,d1Http:d.http,d1Success:d.body?.success===true,
              activeLease:b.activeLease??null,wakeMinutes:wake,auditMinutes:auditAge,
              unfinishedJobs:r?.unfinished_jobs??null,sourceLocks:r?.active_source_locks??null,
              coordinatorLease:r?.active_control_lease??null,recent,globalHistoricalCertified:b.officialParityCertified===true,
              healthySnapshot:ok});
            if(ok){seen=true;break;}
          }
          say({decision:seen?'QUIESCENT_SNAPSHOT_OBSERVED':'HOLD',noWrites:true,scope:'no merge, no recovery, no certification of historical 5/5'});
          if(!seen)process.exitCode=1;
          NODE
