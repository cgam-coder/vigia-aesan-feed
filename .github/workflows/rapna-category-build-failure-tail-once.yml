name: RAPNA category production build failure tail read once

on:
  push:
    branches: [sec-f1/cloudflare-api-readonly-20261009]
    paths: [.github/workflows/rapna-category-build-failure-tail-once.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: GET existing Cloudflare failed build logs only
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CF_TOKEN;
          const emit=x=>console.log('RAPNA_CATEGORY_BUILD_DIAG '+JSON.stringify(x));
          if(!token){emit({status:'HOLD',reason:'missing_token'});process.exitCode=1;process.exit();}
          const target='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f/builds/builds/7e0cfdad-4693-41b8-801d-d5bfddc27b4e/logs';
          try{
            const r=await fetch(target,{method:'GET',headers:{Authorization:'Bearer '+token,Accept:'application/json'},redirect:'error',signal:AbortSignal.timeout(16000)});
            const j=await r.json().catch(()=>null);
            const rows=Array.isArray(j?.result?.lines)?j.result.lines:[];
            const sanitized=rows.map(x=>(typeof x==='string'?x:String(x?.message??x?.text??x??'')))
              .map(x=>x.replace(/[A-Za-z0-9_+./-]{100,}/g,'[LONG_TOKEN_REDACTED]').slice(0,260))
              .filter(x=>!/(Bearer |CF_TOKEN|CLOUDFLARE_API_TOKEN|GITHUB_TOKEN|AUTHORIZATION=|client_secret|private.key|api_key=)/i.test(x));
            emit({http:r.status,success:j?.success===true,rows:rows.length,
              tail:sanitized.slice(-50),raw_responses_discarded:true});
          }catch(e){emit({outcome:'read_failed',error_type:e?.name??'Error'});process.exitCode=1;}
          NODE
