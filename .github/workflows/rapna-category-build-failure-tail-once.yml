name: RAPNA category production build failure tail read once

on:
  push:
    branches: [sec-f1/cloudflare-api-readonly-20261009]
    paths: [.github/workflows/rapna-category-build-failure-tail-once.yml]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: GET existing Cloudflare failed build logs only
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CF_TOKEN;
          const emit=x=>console.log('RAPNA_CATEGORY_BUILD_DIAG '+JSON.stringify(x));
          if(!token){emit({status:'HOLD',reason:'missing_token'});process.exitCode=1;process.exit();}
          const target='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f/builds/builds/7e0cfdad-4693-41b8-801d-d5bfddc27b4e/logs';
          try{
            let cursor=null;
            const seen=new Set();
            const safe=[];
            const pages=[];
            for(let page=0;page<8;page++){
              const u=new URL(target);
              if(cursor)u.searchParams.set('cursor',cursor);
              const r=await fetch(u,{method:'GET',headers:{Authorization:'Bearer '+token,Accept:'application/json'},redirect:'error',signal:AbortSignal.timeout(14000)});
              const j=await r.json().catch(()=>null);
              const rows=Array.isArray(j?.result?.lines)?j.result.lines:[];
              const next=j?.result?.cursor??null;
              pages.push({page,http:r.status,success:j?.success===true,count:rows.length,
                has_next:Boolean(next),truncated:j?.result?.truncated===true});
              if(r.status!==200||j?.success!==true)break;
              for(const item of rows) {
                const s=typeof item==='string'?item:Array.isArray(item)?String(item.at(-1)):String(item?.message??item?.text??'');
                if(/Bearer |CF_TOKEN|CLOUDFLARE_API_TOKEN|GITHUB_TOKEN|AUTHORIZATION=|client_secret|private.key|api_key=/i.test(s))continue;
                safe.push(s.replace(/[A-Za-z0-9_+./-]{100,}/g,'[REDACTED]').slice(0,320));
              }
              if(!next||seen.has(next))break;
              seen.add(next);
              cursor=next;
            }
            const key=/^\\s*(?:✖|✘|✗|×|Error:|Failed:|Failed build|fail \\d|error TS|# fail|not ok|\\[ERROR\\]|\\[error\\])/i;
            const matches=safe.map((s,i)=>({i,text:s})).filter(x=>key.test(x.text));
            emit({pages,lines:safe.length,head:safe.slice(0,5),tail:safe.slice(-40),failures:matches.slice(-30),raw_responses_discarded:true});
          }catch(e){emit({outcome:'read_failed',error_type:e?.name??'Error'});process.exitCode=1;}
          NODE
