name: SR271 PR278 authenticated read-only deployment preflight
on:
  push:
    branches: [source-reliability/durable-recovery-20261009]
permissions:
  contents: read
jobs:
  preflight:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify actual allocations and uncertain jobs without mutations
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const root='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f',db='55596003-1b90-4f66-aad8-decb21205f13';
          if(Date.now()>Date.parse('2026-10-09T07:03:00Z'))throw Error('Preflight expired');
          for(const [service,expected] of [['vigia-runtime','787f7769-5079-4b83-ae4c-17b96efa5364'],['vigia-source-runner','9ccaa456-4b52-41ce-a12a-249f9e1a9db4']]){
           const r=await fetch(root+'/workers/scripts/'+service+'/deployments',{headers:{Authorization:'Bearer '+process.env.CF_TOKEN},signal:AbortSignal.timeout(25000)}),p=await r.json();if(!r.ok||!p.success)throw Error('Allocation unreadable');const current=p.result.deployments[0];console.log('R9_MERGE_ALLOCATION '+JSON.stringify({at:new Date().toISOString(),service,current,rollback:p.result.deployments.slice(1,3)}));if(current.versions.length!==1||current.versions[0].version_id!==expected||current.versions[0].percentage!==100)throw Error('Concurrent allocation change');
          }
          for(const sql of ['SELECT owner_id,epoch,expires_at FROM source_reliability_control WHERE id=1','SELECT id,source,mode,epoch,phase,finished_at,receipt_json FROM source_reliability_jobs WHERE finished_at IS NULL','SELECT source,owner_id,mode,expires_at FROM source_sync_locks','SELECT job_id,COUNT(*) AS markers,SUM(committed_at IS NULL) AS pending FROM source_reliability_effects GROUP BY job_id']){
          const r=await fetch(root+'/d1/database/'+db+'/query',{method:'POST',headers:{Authorization:'Bearer '+process.env.CF_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({sql,params:[]}),signal:AbortSignal.timeout(25000)}),p=await r.json();if(!r.ok||!p.success||p.result.some(x=>x.meta?.rows_written||x.meta?.changes))throw Error('SELECT-only preflight unconfirmed');console.log('R9_MERGE_SELECT '+JSON.stringify({at:new Date().toISOString(),sql,result:p.result}));}
          console.log('R9_MERGE_PREFLIGHT '+JSON.stringify({at:new Date().toISOString(),zeroWrite:true}));
          NODE
