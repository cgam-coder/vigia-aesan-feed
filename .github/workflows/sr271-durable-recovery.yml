name: SR271 post-recovery SELECT-only receipts and dry lifecycle
on:
  push:
    branches: [source-reliability/durable-recovery-20261009]
permissions:
  contents: read
jobs:
  preflight:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Verify durable cursor heads and dry post-fix lifecycle without mutations
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const root='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f',database='55596003-1b90-4f66-aad8-decb21205f13',target=Date.parse('2026-10-09T08:12:00Z');
          while(Date.now()<target)await new Promise(resolve=>setTimeout(resolve,5000));
          if(Date.now()>Date.parse('2026-10-09T08:30:00Z'))throw Error('Final evidence checkpoint expired');
          const auth={Authorization:'Bearer '+process.env.CF_TOKEN,'Content-Type':'application/json'};
          for(const sql of [
          "SELECT job_id,ordinal,committed_at,json_extract(result_json,'$.checkpoint') AS checkpoint FROM source_reliability_effects WHERE (job_id='b217d0ca-28ee-43f0-9480-9b99c7775971' AND ordinal>=63) OR (job_id='3dea1386-921d-4a1b-92d1-9e85e74bebc2' AND ordinal>=6) ORDER BY job_id,ordinal",
          "SELECT source,mode,status,cursor,cursor_key,total_units,records_observed,lease_owner_id,lease_expires_at,updated_at FROM source_sync_state WHERE (source='OECD' AND mode='historical-reconcile') OR (source='RASFF' AND mode='reconcile') OR (source='SAFETY GATE' AND mode='recent')",
          "SELECT owner_id,epoch,expires_at FROM source_reliability_control WHERE id=1"
          ]){const r=await fetch(root+'/d1/database/'+database+'/query',{method:'POST',headers:auth,body:JSON.stringify({sql,params:[]}),signal:AbortSignal.timeout(25000)}),p=await r.json();if(!r.ok||!p.success||p.result.some(x=>x.meta?.rows_written||x.meta?.changes))throw Error('SELECT unconfirmed');console.log('R9_FINAL_CHECKPOINT_EFFECTS '+JSON.stringify({at:new Date().toISOString(),sql,result:p.result}));}
          for(const view of ['runner','scheduled']){
           const body={queryId:'sr271-journal-post-recovery-'+view,dry:true,view:'invocations',limit:100,timeframe:{from:Date.parse('2026-10-09T07:43:00Z'),to:Date.now()},parameters:{filterCombination:'and',filters:view==='runner'?[{key:'$metadata.service',operation:'eq',type:'string',value:'vigia-source-runner'}]:[{key:'$metadata.service',operation:'eq',type:'string',value:'vigia-runtime'},{key:'$workers.eventType',operation:'eq',type:'string',value:'scheduled'}]}};
           const r=await fetch(root+'/workers/observability/telemetry/query',{method:'POST',headers:auth,body:JSON.stringify(body),signal:AbortSignal.timeout(30000)}),p=await r.json();console.log('R9_FINAL_TELEMETRY '+JSON.stringify({at:new Date().toISOString(),view,http:r.status,success:p.success,errors:p.errors,dry:p.result?.run?.dry,events:Object.values(p.result?.invocations??{}).flat().map(x=>({at:x.timestamp,source:x.source,service:x.$metadata?.service,requestId:x.$metadata?.requestId,traceId:x.$metadata?.traceId,version:x.$workers?.scriptVersion?.id,outcome:x.$workers?.outcome,cpuMs:x.$workers?.cpuTimeMs,wallMs:x.$workers?.wallTimeMs}))}));
          }
          console.log('R9_FINAL_EFFECTS_COMPLETE '+JSON.stringify({at:new Date().toISOString(),zeroWrite:true}));
          NODE
