name: SR271 compact current Safety Gate recovery with bounded evidence
on:
  push:
    branches: [source-reliability/durable-recovery-20261009]
permissions:
  contents: read
concurrency:
  group: sr271-durable-recovery-20261009
  cancel-in-progress: false
jobs:
  checkpoint:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Verify standalone compact CAS rollback, response loss, old epoch fencing and no resend
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import zlib from 'node:zlib';import crypto from 'node:crypto';
          const code=zlib.gunzipSync(Buffer.from(fs.readFileSync('ops/sr271-compact-verify.b64','utf8'),'base64'));
          if(crypto.createHash('sha256').update(code).digest('hex')!=='1677981cf2b53d7fef47ed82aa48dd42945e9769f5220d9b12b5a59968b904bd')throw Error('Verification artifact changed');
          fs.writeFileSync('ops/sr271-compact-verify.mjs',code);
          NODE
          node --test ops/sr271-compact-verify.mjs
      - name: GET SELECT preflight and distinct bounded compact CAS; no old transaction replay
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import zlib from 'node:zlib';import crypto from 'node:crypto';
          const code=zlib.gunzipSync(Buffer.from(fs.readFileSync('ops/sr271-compact-recovery-api.b64','utf8'),'base64'));
          if(crypto.createHash('sha256').update(code).digest('hex')!=='c4fb472a04f1f14b1fc23bac58cba9a11f698ea391bab901cc0e79c8bbdcd739')throw Error('Compact artifact changed');
          fs.writeFileSync('ops/sr271-compact-recovery-api.mjs',code);
          await import('./ops/sr271-compact-recovery-api.mjs');
          NODE
