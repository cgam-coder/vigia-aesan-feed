name: SR271 fresh Safety Gate current-effects proof observe only
on:
  push:
    branches: [source-reliability/durable-recovery-20261009]
permissions:
  contents: read
concurrency:
  group: sr271-durable-recovery-20261009
  cancel-in-progress: false
jobs:
  compact_proof:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify pinned bounded CAS regression artifact
        run: |
          printf '%s' '' | base64 --decode | gzip --decompress > ops/sr271-compact-verify.mjs
          printf '%s  %s\n' '455526d58851b917b978eaeda5785e17f2c55737613a6ec5d1c4d3c0350917fb' 'ops/sr271-compact-verify.mjs' | sha256sum --check
          node --test ops/sr271-compact-verify.mjs
      - name: Fresh authenticated GET SELECT observation
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          OPERATION: observe
        run: |
          printf '%s' '' | base64 --decode | gzip --decompress > ops/sr271-fresh-compact-api.mjs
          printf '%s  %s\n' '8f14a56277729dd8c3c7f725bf3dc016e6fafab9682342fb94ca4a1ebf184991' 'ops/sr271-fresh-compact-api.mjs' | sha256sum --check
          node ops/sr271-fresh-compact-api.mjs
