name: Runtime writer freeze certification

on:
  push:
    branches: [main]
    paths:
      - "ops/runtime-write-freeze.json"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  writer_gate:
    uses: ./.github/workflows/runtime-writer-gate.yml

  runtime_target:
    uses: ./.github/workflows/runtime-writer-target.yml

  open_observer:
    needs: writer_gate
    if: needs.writer_gate.outputs.frozen != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm no freeze certification is required
        run: echo "RUNTIME_WRITE_FREEZE_CERT=NOT_REQUIRED"

  certify:
    needs: [writer_gate, runtime_target]
    if: needs.writer_gate.outputs.frozen == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
      SOURCE_BASE: ${{ needs.runtime_target.outputs.base_url }}
      ACTIVE_TARGET: ${{ needs.runtime_target.outputs.active }}
      ACTIONS_TOKEN: ${{ github.token }}
      FREEZE_SHA: ${{ github.sha }}
      CURRENT_RUN_ID: ${{ github.run_id }}
      GITHUB_REPOSITORY_NAME: ${{ github.repository }}
    steps:
      - name: Require frozen Sites source
        shell: bash
        run: |
          set -euo pipefail
          test "$ACTIVE_TARGET" = "sites"
          test "$SOURCE_BASE" = "https://vigia-alertas.csar68.chatgpt.site"
          test -n "$VIGIA_SYNC_TOKEN"

      - name: Wait for pre-freeze writer workflow runs to drain
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          const writerPaths=new Set([
            ".github/workflows/update-feed.yml",
            ".github/workflows/update-full-feed.yml",
            ".github/workflows/rapna-sync.yml",
            ".github/workflows/safety-gate-sync.yml",
            ".github/workflows/oecd-historical-reconcile.yml",
            ".github/workflows/oecd-recent-freshness-retry.yml",
            ".github/workflows/rasff-control.yml",
            ".github/workflows/freshness-watchdog.yml",
            ".github/workflows/gh-fixes-closure-once.yml",
          ]);
          const statuses=["in_progress","queued","requested","waiting","pending"];
          const repo=process.env.GITHUB_REPOSITORY_NAME;
          const token=process.env.ACTIONS_TOKEN;
          const freezeSha=process.env.FREEZE_SHA;
          const currentRun=Number(process.env.CURRENT_RUN_ID);
          if(!repo||!token||!freezeSha||!Number.isSafeInteger(currentRun)) throw new Error("missing Actions context");
          const headers={
            Authorization:"Bearer "+token,
            Accept:"application/vnd.github+json",
            "X-GitHub-Api-Version":"2022-11-28",
            "User-Agent":"NagameAlert-Cutover-Freeze-Cert/1.0",
          };
          const sleep=(ms)=>new Promise((resolve)=>setTimeout(resolve,ms));

          async function listStatus(status){
            const rows=[];
            for(let page=1;page<=10;page++){
              const url=new URL("https://api.github.com/repos/"+repo+"/actions/runs");
              url.searchParams.set("status",status);
              url.searchParams.set("per_page","100");
              url.searchParams.set("page",String(page));
              const response=await fetch(url,{headers,signal:AbortSignal.timeout(30_000)});
              if(response.status!==200) throw new Error("Actions run listing failed HTTP "+response.status);
              const body=await response.json();
              const pageRows=Array.isArray(body?.workflow_runs)?body.workflow_runs:[];
              rows.push(...pageRows);
              if(pageRows.length<100) break;
              if(page===10) throw new Error("Actions run listing exceeded bounded pagination");
            }
            return rows;
          }

          for(let attempt=1;attempt<=60;attempt++){
            const batches=await Promise.all(statuses.map(listStatus));
            const active=batches.flat().filter((run)=>
              writerPaths.has(run.path) &&
              Number(run.id)!==currentRun &&
              run.head_sha!==freezeSha
            );
            const unique=[...new Map(active.map((run)=>[run.id,run])).values()];
            if(unique.length===0){
              console.log("RUNTIME_WRITE_FREEZE_RUN_DRAIN "+JSON.stringify({status:"PASS",attempt,active:0,freezeSha}));
              process.exit(0);
            }
            const safe=unique.map((run)=>({
              id:run.id,name:run.name,status:run.status,path:run.path,headSha:run.head_sha
            }));
            console.log("RUNTIME_WRITE_FREEZE_RUN_WAIT "+JSON.stringify({attempt,active:safe}));
            if(attempt===60) throw new Error("Pre-freeze writer runs did not drain within the bounded window");
            await sleep(15_000);
          }
          NODE

      - name: Certify source D1 has no unexpired write leases
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE'
          const base=process.env.SOURCE_BASE;
          const token=process.env.VIGIA_SYNC_TOKEN;
          const headers={
            Authorization:"Bearer "+token,
            "X-Nagame-Migration-Export":"NAGAMEALERT_OPERATIONAL_D1_EXPORT_V2",
            Accept:"application/json",
          };
          const sleep=(ms)=>new Promise((resolve)=>setTimeout(resolve,ms));
          const future=(value,now)=>{
            if(typeof value!=="string"||!value) return false;
            const ms=Date.parse(value);
            return Number.isFinite(ms)&&ms>now;
          };

          async function get(path){
            const response=await fetch(base+path,{headers,redirect:"follow",signal:AbortSignal.timeout(60_000)});
            let body;
            try { body=await response.json(); } catch { body=null; }
            if(response.status!==200) {
              const message=typeof body?.error==="string"?body.error.slice(0,300):"HTTP "+response.status;
              throw new Error(path+" failed: "+message);
            }
            return body;
          }

          async function allRows(table,limit=100){
            const rows=[];
            let cursor=null;
            for(let page=1;page<=100;page++){
              const params=new URLSearchParams({mode:"page",table,limit:String(limit)});
              if(cursor!==null) params.set("cursor",JSON.stringify(cursor));
              const payload=(await get("/api/admin/migration-export?"+params))?.export;
              if(!payload||payload.table!==table||!Array.isArray(payload.rows)||
                 payload.returned!==payload.rows.length||typeof payload.hasMore!=="boolean") {
                throw new Error("Invalid export page for "+table);
              }
              rows.push(...payload.rows);
              if(!payload.hasMore) return rows;
              if(payload.nextCursor===null) throw new Error("Missing continuation cursor for "+table);
              cursor=payload.nextCursor;
            }
            throw new Error("Lease certification page limit exceeded for "+table);
          }

          for(let attempt=1;attempt<=80;attempt++){
            const now=Date.now();
            const [locks,syncStates,freshness,dimension]=await Promise.all([
              allRows("source_sync_locks"),
              allRows("source_sync_state"),
              allRows("source_freshness_state"),
              allRows("dimension_rebuild_state"),
            ]);

            const activeLocks=locks.filter((row)=>future(row.expires_at,now));
            const activeLockSources=new Set(activeLocks.map((row)=>row.source));
            const activeSyncStates=syncStates.filter((row)=>future(row.lease_expires_at,now));
            const activeFreshness=freshness.filter((row)=>
              (row.active_lease===1||row.active_lease===true)&&activeLockSources.has(row.source)
            );
            const activeDimension=dimension.filter((row)=>
              future(row.lease_expires_at,now) ||
              (row.status==="running"&&(row.lease_expires_at===null||row.lease_expires_at===undefined))
            );

            const staleLockRows=locks.filter((row)=>!future(row.expires_at,now));
            const staleSyncLeaseMetadata=syncStates.filter((row)=>
              (row.lease_owner_id!==null||row.lease_mode!==null||row.lease_expires_at!==null) &&
              !future(row.lease_expires_at,now)
            );
            const staleFreshnessFlags=freshness.filter((row)=>
              (row.active_lease===1||row.active_lease===true)&&!activeLockSources.has(row.source)
            );
            const staleDimensionRunning=dimension.filter((row)=>
              row.status==="running"&&!future(row.lease_expires_at,now)
            );

            if(activeLocks.length===0&&activeSyncStates.length===0&&
               activeFreshness.length===0&&activeDimension.length===0){
              console.log("RUNTIME_WRITE_FREEZE_SOURCE_CERT "+JSON.stringify({
                status:"PASS",
                evidenceBasis:"page-only-v2-export+unexpired-lease-semantics",
                attempt,
                checkedAt:new Date(now).toISOString(),
                activeLocks:0,
                activeSyncStateLeases:0,
                activeFreshnessLeases:0,
                activeDimensionLeases:0,
                staleLockRows:staleLockRows.map((row)=>({
                  source:row.source,mode:row.mode,expires_at:row.expires_at
                })),
                staleSyncLeaseMetadata:staleSyncLeaseMetadata.length,
                staleFreshnessFlags:staleFreshnessFlags.map((row)=>row.source),
                staleDimensionRunning:staleDimensionRunning.map((row)=>row.source),
              }));
              process.exit(0);
            }

            console.log("RUNTIME_WRITE_FREEZE_SOURCE_WAIT "+JSON.stringify({
              attempt,
              checkedAt:new Date(now).toISOString(),
              activeLocks:activeLocks.map((row)=>({
                source:row.source,mode:row.mode,expires_at:row.expires_at
              })),
              activeSyncStateLeases:activeSyncStates.map((row)=>({
                source:row.source,mode:row.mode,lease_expires_at:row.lease_expires_at
              })),
              activeFreshnessLeases:activeFreshness.map((row)=>row.source),
              activeDimensionLeases:activeDimension.map((row)=>({
                source:row.source,status:row.status,lease_expires_at:row.lease_expires_at
              })),
            }));

            if(attempt===80) throw new Error("Source write leases did not expire within bounded window");
            await sleep(15_000);
          }
          NODE
