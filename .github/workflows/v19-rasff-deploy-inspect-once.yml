name: V19 RASFF failed build log read-only one-off
on:
  push:
    branches: [sec-f1/cloudflare-api-readonly-20261009]
    paths: [.github/workflows/v19-rasff-deploy-inspect-once.yml]
permissions:
  contents: read
concurrency:
  group: v19-rasff-deploy-inspect-once
  cancel-in-progress: false
jobs:
  inspect:
    if: github.event.deleted == false && github.actor == 'cgam-coder'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read and sanitize failed build diagnostics (GET only)
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CF_TOKEN;
          if(!token)throw Error('TOKEN_UNAVAILABLE');
          const build='8f38fccd-24bb-4b72-b967-5c4c1aa7b1f5';
          const url='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f/builds/builds/'+build+'/logs';
          let cursor=null;
          const lines=[];
          for(let i=0;i<10;i++){
            const r=await fetch(url+(cursor?'?cursor='+encodeURIComponent(cursor):''),{
              method:'GET',redirect:'error',
              headers:{Authorization:'Bearer '+token,Accept:'application/json'},
              signal:AbortSignal.timeout(15000)
            });
            const j=await r.json().catch(()=>null);
            if(r.status!==200||j?.success!==true){console.log('V19_LOG_HOLD '+JSON.stringify({http:r.status,errors:j?.errors?.map(e=>e.code)??[]}));process.exit(0);}
            lines.push(...(j.result?.lines??[]).map(x=>String(x.at(-1)??'')));
            cursor=j.result?.cursor||null;
            if(!cursor)break;
          }
          const clean=(s)=>s.replaceAll(token,'[REDACTED]').replace(/Bearer\s+\S+/gi,'Bearer [REDACTED]')
            .replace(/https?:\/\/\S+/gi,'[URL]').replace(/[\w.+-]+@[\w.-]+\.[a-z]{2,}/gi,'[EMAIL]')
            .slice(0,280);
          const matches=lines.map((x,i)=>({i,x})).filter(v=>/FAIL|Error|assertion|not ok|failed|fatal|cannot find|invalid|TypeScript/i.test(v.x));
          const selected=matches.length?matches.slice(-22):lines.map((x,i)=>({i,x})).slice(-20);
          console.log('V19_BUILD_LOG '+JSON.stringify({total:lines.length,matchCount:matches.length,
            entries:selected.map(v=>({line:v.i,text:clean(v.x)}))}));
          NODE
