name: V19 RASFF production deploy status one-off
on:
  push:
    branches: [sec-f1/cloudflare-api-readonly-20261009]
    paths: [.github/workflows/v19-rasff-deploy-inspect-once.yml]
permissions:
  contents: read
concurrency:
  group: v19-rasff-deploy-inspect-once
  cancel-in-progress: false
jobs:
  inspect:
    if: github.event.deleted == false && github.actor == 'cgam-coder'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify effective Cloudflare deployments by GET only
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CF_TOKEN;
          if (!token) throw Error("CF_TOKEN_UNAVAILABLE");
          const account="9c1807c68493f14259248b5f5782cc6f";
          const base="https://api.cloudflare.com/client/v4/accounts/"+account;
          const out=(x)=>console.log("V19_READONLY "+JSON.stringify(x));
          for (const script of ["vigia-runtime","vigia-source-runner"]) {
            const url=base+"/workers/scripts/"+script+"/deployments";
            const res=await fetch(url,{method:"GET",redirect:"error",
              headers:{Authorization:"Bearer "+token,Accept:"application/json"},
              signal:AbortSignal.timeout(15000)});
            const body=await res.json().catch(()=>null);
            if (res.status!==200 || body?.success!==true) {
              out({script,http:res.status,success:false,error_codes:(body?.errors??[]).map(e=>e.code)});
              throw Error(script+"_DEPLOYMENTS_UNAVAILABLE");
            }
            const all=Array.isArray(body.result?.deployments)?body.result.deployments
              : Array.isArray(body.result)?body.result:[];
            const deployments=all.slice(0,3).map(d=>({
              id:d.id??null,created_on:d.created_on??null,
              versions:(Array.isArray(d.versions)?d.versions:[]).map(v=>({
                version_id:v.version_id??v.id??null,percentage:v.percentage??v.weight??null,
              })),
            }));
            out({script,http:res.status,success:true,count:all.length,deployments});
          }
          NODE
