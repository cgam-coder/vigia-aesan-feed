name: V19 RASFF Cloudflare build preflight one-off
on:
  push:
    branches: [sec-f1/cloudflare-api-readonly-20261009]
    paths: [.github/workflows/v19-rasff-deploy-inspect-once.yml]
permissions:
  contents: read
concurrency:
  group: v19-rasff-deploy-inspect-once
  cancel-in-progress: false
jobs:
  inspect:
    if: github.event.deleted == false && github.actor == 'cgam-coder'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: List latest Cloudflare Workers Builds without writes
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CF_TOKEN;
          if(!token)throw Error('TOKEN_NOT_AVAILABLE');
          const root="https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f";
          const get=async(path)=>{
            if(!path.startsWith('/'))throw Error('INVALID_PATH');
            const r=await fetch(root+path,{method:"GET",redirect:"error",headers:{Authorization:"Bearer "+token,Accept:"application/json"},signal:AbortSignal.timeout(15000)});
            const j=await r.json().catch(()=>null);
            console.log("V19_BUILD_GET "+JSON.stringify({path,http:r.status,success:j?.success,error_codes:j?.errors?.map(e=>e.code)??[]}));
            return r.status===200&&j?.success===true ? j.result : null;
          };
          const scripts=await get('/workers/scripts');
          const all=Array.isArray(scripts)?scripts:Array.isArray(scripts?.result)?scripts.result:[];
          const tag=all.find(s=>s.id==='vigia-runtime'||s.name==='vigia-runtime')?.tag;
          if(!tag){console.log("V19_BUILD_HOLD tag_not_accessible");process.exit(0);}
          const builds=await get('/builds/workers/'+encodeURIComponent(tag)+'/builds');
          const records=Array.isArray(builds)?builds:Array.isArray(builds?.builds)?builds.builds:[];
          console.log("V19_BUILDS "+JSON.stringify({count:records.length,records:records.slice(0,8).map(b=>({
            id:b.build_uuid??null,outcome:b.build_outcome??b.status??null,
            branch:b.build_trigger_metadata?.branch??null,commit:b.build_trigger_metadata?.commit_hash??null,
            created:b.created_on??b.created_at??null,finished:b.completed_at??null,
          }))}));
          NODE
