name: VIGIA five-source freshness watchdog

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/freshness-watchdog.yml"
      - "scripts/freshness-watchdog.mjs"
  schedule:
    - cron: "13,28,43,58 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vigia-five-source-freshness-watchdog
  cancel-in-progress: false

jobs:
  writer_gate:
    uses: ./.github/workflows/runtime-writer-gate.yml

  runtime_target:
    uses: ./.github/workflows/runtime-writer-target.yml

  parity:
    needs: [writer_gate, runtime_target]
    if: needs.writer_gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VIGIA_FRESHNESS_URL: ${{ format('{0}/api/freshness', needs.runtime_target.outputs.base_url) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Observe, audit all sources, then run one bounded recovery
        shell: bash
        env:
          VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
        run: node scripts/freshness-watchdog.mjs
