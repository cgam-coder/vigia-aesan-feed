name: VIGIA five-source freshness watchdog

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/freshness-watchdog.yml"
  schedule:
    - cron: "13,28,43,58 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vigia-five-source-freshness-watchdog
  cancel-in-progress: false

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VIGIA_FRESHNESS_URL: https://vigia-alertas.csar68.chatgpt.site/api/freshness
      VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
    steps:
      - name: Audit official parity and run bounded recovery
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VIGIA_SYNC_TOKEN"
          response_file="$RUNNER_TEMP/freshness.json"
          http_code="$(curl --silent --show-error --location --request POST \
            --header "Authorization: Bearer $VIGIA_SYNC_TOKEN" --retry 1 --retry-all-errors \
            --max-time 1800 --output "$response_file" --write-out '%{http_code}' \
            "$VIGIA_FRESHNESS_URL?audit=1&recover=1")"
          node -e '
            const fs=require("node:fs");
            const status=Number(process.argv[1]);
            const body=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
            const states=body?.states;
            if(!Array.isArray(states)||states.length!==5) throw new Error("Missing five-source freshness state");
            for(const state of states) console.log("FRESHNESS "+JSON.stringify(state));
            if(status!==200||body?.allFresh!==true||states.some((state)=>state.status!=="fresh"))
              throw new Error(`Freshness watchdog failed closed with HTTP ${status}`);
          ' "$http_code" "$response_file"
