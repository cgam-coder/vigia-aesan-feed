name: VIGIA five-source freshness watchdog

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/freshness-watchdog.yml"
  schedule:
    - cron: "13,28,43,58 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vigia-five-source-freshness-watchdog
  cancel-in-progress: false

jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VIGIA_FRESHNESS_URL: https://vigia-alertas.csar68.chatgpt.site/api/freshness
      VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
    steps:
      - name: Audit official parity and run bounded recovery
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VIGIA_SYNC_TOKEN"
          node --input-type=module - <<'NODE'
          const sources=["AESAN","RAPNA","RASFF","SAFETY GATE","OECD"];
          const states=[];
          let failed=false;
          for(const source of sources){
            const url=new URL(process.env.VIGIA_FRESHNESS_URL);
            url.searchParams.set("audit","1");
            url.searchParams.set("recover","1");
            url.searchParams.set("source",source);
            const response=await fetch(url,{method:"POST",headers:{Authorization:`Bearer ${process.env.VIGIA_SYNC_TOKEN}`},
              signal:AbortSignal.timeout(1_800_000)});
            const body=await response.json();
            const state=Array.isArray(body?.states)&&body.states.length===1?body.states[0]:null;
            if(!state||state.source!==source) throw new Error(`Missing freshness state for ${source}`);
            states.push(state);
            console.log("FRESHNESS "+JSON.stringify(state));
            if(response.status!==200||body.allFresh!==true||state.status!=="fresh") failed=true;
          }
          if(states.length!==5||failed) throw new Error("Five-source freshness watchdog failed closed");
          NODE
