name: Source reliability final preflight (GET only)
on:
  push:
    branches: [source-reliability/final-preflight-20261008]
permissions:
  contents: read
jobs:
  inspect:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read stable allocation and all source states
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const root="https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f";
          const cfAllow=/^(?:\/workers\/scripts\/vigia-runtime\/(?:deployments|versions\/[a-f0-9-]{36}|schedules|settings)|\/builds\/builds\?version_ids=[a-f0-9-]{36})$/;
          async function request(url,token){
            if(Date.now()>Date.parse("2026-10-08T14:15:00Z"))throw Error("expired preflight");
            const r=await fetch(url,{method:"GET",redirect:"error",headers:{Authorization:"Bearer "+token,Accept:"application/json"},signal:AbortSignal.timeout(60000)});
            if(!r.ok)throw Error("GET HTTP "+r.status);
            return r.json();
          }
          async function cf(path){if(!cfAllow.test(path))throw Error("invalid CF path");const r=await request(root+path,process.env.CF_TOKEN);if(!r.success)throw Error("CF success=false");return r.result;}
          const a=(await cf("/workers/scripts/vigia-runtime/deployments")).deployments;
          const active=a?.[0];if(active?.versions?.length!==1||active.versions[0].percentage!==100)throw Error("ambiguous allocation");
          const [version,settings,schedules]=await Promise.all([cf("/workers/scripts/vigia-runtime/versions/"+active.versions[0].version_id),cf("/workers/scripts/vigia-runtime/settings"),cf("/workers/scripts/vigia-runtime/schedules")]);
          const db=(settings.bindings??[]).filter(x=>x.type==="d1").map(x=>({name:x.name,id:x.id}));
          const flag=name=>(settings.bindings??[]).find(x=>x.name===name)?.text??null;
          const control={at:new Date().toISOString(),active,rollback:a?.[1]??null,versionNumber:version.number,
            schedulerMode:flag("NAGAMEALERT_RECENT_SCHEDULER_MODE"),delta:flag("NAGAMEALERT_SAFETY_GATE_RECENT_MODE"),
            limits:settings.limits??null,usageModel:settings.usage_model??null,databases:db,schedules};
          console.log("SR_ALLOCATION_ONLY "+JSON.stringify(control));
          const ownerResponse=await fetch("https://vigia-runtime.c-gamiz93.workers.dev/api/source-reliability?observe=1",{headers:{Authorization:"Bearer "+process.env.SYNC_TOKEN,"Cache-Control":"no-store"},signal:AbortSignal.timeout(60000)});
          let owner=null;try{owner=await ownerResponse.json();}catch{}
          console.log("SR_NATIVE_OWNER "+JSON.stringify({http:ownerResponse.status,body:owner}));
          const sourcePaths=["/api/freshness?observe=1&policy=1","/api/freshness?observe=1",...["aesan","rapna","rasff","safety-gate","oecd"].map(x=>"/api/"+x+"/sync?observe=1")];
          const states=[];
          for(const path of sourcePaths){try{states.push({path,body:await request("https://vigia-runtime.c-gamiz93.workers.dev"+path,process.env.SYNC_TOKEN)});}catch(error){states.push({path,outcome:"HOLD",reason:error instanceof Error?error.message:"read-unconfirmed"});}}
          const buildResponse=await fetch(root+"/builds/builds?version_ids="+active.versions[0].version_id,{headers:{Authorization:"Bearer "+process.env.CF_TOKEN},signal:AbortSignal.timeout(60000)});
          let buildMetadata={http:buildResponse.status};if(buildResponse.ok){const payload=await buildResponse.json();buildMetadata={http:buildResponse.status,success:payload.success,builds:(Array.isArray(payload.result?.builds)?payload.result.builds:Object.values(payload.result?.builds??{}).flatMap(v=>Array.isArray(v)?v:[v])).map(b=>({build_uuid:b.build_uuid,status:b.status,metadata:{branch:b.build_trigger_metadata?.branch,commit:b.build_trigger_metadata?.commit_hash}}))};}
          console.log("SR_BUILD_PROVENANCE "+JSON.stringify(buildMetadata));
          const after=(await cf("/workers/scripts/vigia-runtime/deployments")).deployments?.[0];
          if(JSON.stringify(active)!==JSON.stringify(after))throw Error("allocation changed");
          console.log("SR_FINAL_PREFLIGHT "+JSON.stringify({zeroWrite:true,control,states}));
          NODE
