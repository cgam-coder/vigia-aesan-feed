name: AESAN full source evidence once
on:
  push:
    branches: [ops/aesan-full-evidence-20260922]
    paths: [.github/workflows/aesan-full-evidence-once.yml]
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fa423d7ca8b44ed080895248e62a536a57d6e2c8
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Capture official HTML only with verified TLS and bounded requests
        env:
          EVIDENCE_DIR: ${{ runner.temp }}/aesan-full-evidence
        run: |
          set -eu
          mkdir -p "$EVIDENCE_DIR/raw"
          git branch evidence-base fa423d7ca8b44ed080895248e62a536a57d6e2c8
          git bundle create "$EVIDENCE_DIR/original.bundle" evidence-base
          cp feed.json "$EVIDENCE_DIR/baseline-feed.json"
          cat > "$RUNNER_TEMP/capture-aesan.mjs" <<'JS'
          import https from 'node:https';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          import {pathToFileURL} from 'node:url';
          const {parseListCards,isOfficialAesanAlertUrl}=await import(pathToFileURL(path.resolve('scripts/aesan.mjs')));
          const root=process.env.EVIDENCE_DIR, records={}, cache=new Map();
          const startedAt=new Date().toISOString();
          const hash=x=>createHash('sha256').update(x).digest('hex');
          const request=(value,depth=0)=>new Promise((resolve,reject)=>{
            const u=new URL(value);
            if(u.protocol!=='https:'||!['www.aesan.gob.es','aesan.gob.es'].includes(u.hostname)||u.username||u.password) return reject(new Error('Unapproved official URL'));
            const req=https.get(u,{family:4,rejectUnauthorized:true,timeout:30000,headers:{'User-Agent':'NagameAlert-source-evidence/1.0','Accept':'text/html','Accept-Language':'es-ES','Accept-Encoding':'identity'}},res=>{
              if(res.statusCode>=300&&res.statusCode<400&&res.headers.location){res.resume();if(depth>=3)return reject(new Error('Redirect limit'));return resolve(request(new URL(res.headers.location,u).href,depth+1));}
              if(res.statusCode!==200){res.resume();return reject(new Error('HTTP '+res.statusCode+' '+u.href));}
              const chunks=[];let n=0;
              res.on('data',b=>{n+=b.length;if(n>5000000)req.destroy(new Error('HTML size limit'));else chunks.push(b);});
              res.on('error',reject);res.on('end',()=>resolve({body:Buffer.concat(chunks),finalUrl:u.href,status:res.statusCode}));
            });req.on('timeout',()=>req.destroy(new Error('Timeout')));req.on('error',reject);
          });
          async function load(url){
            if(cache.has(url))return cache.get(url);
            const promise=(async()=>{const r=await request(url);const file='raw/'+hash(url)+'.html';await fs.writeFile(path.join(root,file),r.body);records[url]={file,sha256:hash(r.body),bytes:r.body.length,status:r.status,finalUrl:r.finalUrl,fetchedAt:new Date().toISOString()};return r.body.toString('utf8');})();cache.set(url,promise);return promise;
          }
          async function mapLimit(xs,fn){const out=new Array(xs.length);let i=0;await Promise.all([0,1].map(async()=>{while(i<xs.length){const j=i++;out[j]=await fn(xs[j]);}}));return out;}
          const base='https://www.aesan.gob.es/alertas/buscador-alertas';
          const now=new Date(), date=[String(now.getUTCDate()).padStart(2,'0'),String(now.getUTCMonth()+1).padStart(2,'0'),now.getUTCFullYear()].join('/');
          const fullUrl=p=>{const u=new URL(p===1?base:base+'/'+p);u.searchParams.set('filter-initDate','01/01/2000');u.searchParams.set('filter-endDate',date);u.searchParams.set('quantity','40');return u.href;};
          try {
            const first=await load(fullUrl(1));
            const total=Math.max(1,...[...first.matchAll(/(?:href|action)\s*=\s*["'][^"']*\/buscador-alertas\/(\d+)(?:[?"'])/gi)].map(m=>Number(m[1])));
            if(total>400)throw new Error('Declared paginator exceeds 400');
            const full=[first,...await mapLimit(Array.from({length:total-1},(_,i)=>fullUrl(i+2)),load)];
            const recent=await mapLimit(Array.from({length:4},(_,i)=>i?base+'/'+(i+1):base),load);
            const landingUrl='https://www.aesan.gob.es/alertas/alertas-alimentarias';
            const landing=await load(landingUrl);
            const cards=[...full,...recent,landing.replace(/\bseeMoreCardSlide\b/g,'seeMoreCard seeMoreCardSlide')].flatMap(parseListCards);
            const previous=JSON.parse(await fs.readFile('feed.json','utf8'));
            const urls=[...new Set([...cards.map(c=>c.url),...previous.alerts.map(a=>a.url)])].filter(isOfficialAesanAlertUrl);
            if(urls.length>600)throw new Error('Detail capture exceeds 600');
            await mapLimit(urls,load);
            await fs.writeFile(path.join(root,'summary.json'),JSON.stringify({baseCommit:'fa423d7ca8b44ed080895248e62a536a57d6e2c8',baseTree:'beefce320565d7912a8e3141b073272754969c39',startedAt,completedAt:new Date().toISOString(),date,fullPages:total,recentPages:4,details:urls.length,rawCards:cards.length,previousAlerts:previous.alerts.length,network:'HTTPS GET AESAN only; TLS verified; max concurrency 2',published:false},null,2));
            console.log(JSON.stringify({fullPages:total,details:urls.length,requests:Object.keys(records).length,published:false}));
          } finally {await fs.writeFile(path.join(root,'routes.json'),JSON.stringify(records,null,2));}
          JS
          node "$RUNNER_TEMP/capture-aesan.mjs"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: aesan-full-official-evidence-fa423d7c
          path: ${{ runner.temp }}/aesan-full-evidence
          retention-days: 1
          if-no-files-found: error
