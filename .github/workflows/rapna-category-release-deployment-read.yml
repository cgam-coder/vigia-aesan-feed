name: RAPNA category production allocation read-only check
on:
  push:
    branches: [sec-f1/cloudflare-api-readonly-20261009]
    paths: [.github/workflows/rapna-category-release-deployment-read.yml]
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Read existing Cloudflare Worker deployment and latest build SHA only
        env:
          CLOUDFLARE_READ_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VIGIA_READ_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const cf=process.env.CLOUDFLARE_READ_TOKEN,vi=process.env.VIGIA_READ_TOKEN;
          const log=x=>console.log('RAPNA_CATEGORY_DEPLOY '+JSON.stringify(x));
          if(!cf||!vi){log({pass:false,error:'missing_secret'});process.exitCode=1;process.exit();}
          const get=async(url,token)=>{
            const r=await fetch(url,{method:'GET',redirect:'error',headers:{Authorization:'Bearer '+token,Accept:'application/json'},signal:AbortSignal.timeout(16000)});
            const data=await r.json().catch(()=>null);return {http:r.status,data};
          };
          try{
            const host='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f';
            const d=await get(host+'/workers/scripts/vigia-runtime/deployments',cf);
            log({gate:'worker-deployments',http:d.http,success:d.data?.success===true,
              latest:(d.data?.result?.deployments??[]).slice(0,3).map(v=>({
                id:v.id,created:v.created_on,versions:v.versions?.map(w=>({id:w.version_id,pct:w.percentage}))}))});
            const b=await get(host+'/builds/builds/2046b4ce-3be3-4779-9bf8-4b7d5878bebe',cf);
            const x=b.data?.result??{};
            log({gate:'merged-build',http:b.http,success:b.data?.success===true,
              build_status:x.status??null,created:x.created_on??null,
              environment:x.environment??null,branch:x.branch??null});
            const r=await get('https://vigia-runtime.c-gamiz93.workers.dev/api/source-reliability?observe=1',vi);
            log({gate:'runtime-sentinel',http:r.http,build_sha:r.data?.buildSha??null,mode:r.data?.mode,
              audit_time:r.data?.state?.lastAudit?.finishedAt,active_lease:r.data?.activeLease,
              official_historical_certified:r.data?.officialParityCertified===true});
          }catch(e){log({outcome:'GET_error',type:e?.name??'Error'});process.exitCode=1;}
          NODE
