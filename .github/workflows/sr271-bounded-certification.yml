name: SR271 post-cleanup final primary proof within original deadline
on:
  push:
    branches: [source-reliability/recovery-snapshot-20261009]
    paths: [.github/workflows/sr271-bounded-certification.yml, ops/sr271-bounded-observer.mjs]
permissions:
  contents: read
concurrency:
  group: sr271-bounded-final-observer-20261009
  cancel-in-progress: true
jobs:
  post_cleanup:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: observe
        name: Post-cleanup primary SELECT and independent strict watchdog
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
          CHECKPOINT_AT: 2026-10-09T14:39:30.000Z
          RUN_ATTEMPT: ${{ github.run_attempt }}
          FINAL_CHECKPOINT: 'true'
        run: node ops/sr271-bounded-observer.mjs
