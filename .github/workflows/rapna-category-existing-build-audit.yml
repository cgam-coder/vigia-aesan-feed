name: RAPNA category read failed production CI (GET only)
on:
  push:
    branches: [sec-f1/cloudflare-api-readonly-20261009]
    paths: [.github/workflows/rapna-category-existing-build-audit.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Read and redact failures in exact CI build
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CF_TOKEN;
          const out=x=>console.log('RAPNA_FULL_CI_FAIL '+JSON.stringify(x));
          if(!token){out({error:'token_missing'});process.exitCode=1;process.exit();}
          const id='7e0cfdad-4693-41b8-801d-d5bfddc27b4e';
          try{
            const r=await fetch('https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f/builds/builds/'+id+'/logs',
              {method:'GET',redirect:'error',headers:{Authorization:'Bearer '+token,Accept:'application/json'},signal:AbortSignal.timeout(17000)});
            const j=await r.json();
            const rows=(Array.isArray(j?.result?.lines)?j.result.lines:[]).map(v=>Array.isArray(v)?String(v.at(-1)):String(v));
            const filtered=[];
            for(let i=0;i<rows.length;i++){
              if(/(?:^|\s)(?:not ok\b|FAIL\b|FAILED\b|Error:|ERR_ASSERT|AssertionError|TS\d{4}|✗|# fail|npm error)|expected|assert\.equal|test failed|failed to|was not equal/i.test(rows[i])) {
                for(let k=Math.max(0,i-1);k<=Math.min(rows.length-1,i+3);k++)filtered.push(k);
              }
            }
            const eligible=s=>!/(?:Bearer|Authorization|CLOUDFLARE_API_TOKEN|VIGIA_SYNC_TOKEN|github_pat|password|secret|token=)/i.test(s);
            const flagged=[...new Set(filtered)].sort((a,b)=>a-b).filter(i=>eligible(rows[i])).slice(-44).map(i=>({line:i+1,text:rows[i].slice(0,250)}));
            const tail=rows.slice(-30).filter(eligible).map(x=>x.slice(0,250));
            out({http:r.status,success:j?.success===true,row_count:rows.length,flagged,tail,raw_discarded:true});
          }catch(e){out({outcome:'read_failed',error:e?.name??'Error'});process.exitCode=1;}
          NODE
