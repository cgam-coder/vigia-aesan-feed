name: V24 AESAN PR312 authenticated preflight one-shot
on:
  push:
    branches: [audit/v24-aesan312-final-preflight-20261012]
    paths: [.github/workflows/v24-aesan312-preflight-once.yml]
permissions:
  contents: read
jobs:
  observe:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Bounded GET-only AESAN certificate versions and build budget
        env:
          VIGIA_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const out=(stage,x)=>console.log('V24_AESAN312_PREFLIGHT '+JSON.stringify({stage,...x}));
          const T=process.env.VIGIA_TOKEN,CF=process.env.CLOUDFLARE_TOKEN;
          if(!T||!CF){out('verdict',{state:'HOLD_MISSING_EXISTING_SECRETS',reads:0});process.exit(2);}
          const A='9c1807c68493f14259248b5f5782cc6f',D='55596003-1b90-4f66-aad8-decb21205f13';
          const origin='https://vigia-runtime.c-gamiz93.workers.dev';
          const cf='https://api.cloudflare.com/client/v4/accounts/'+A;
          const tasks=[
            ['coordinator',origin+'/api/source-reliability?observe=1',T],
            ['aesan',origin+'/api/aesan/sync?observe=1',T],
            ['freshness',origin+'/api/freshness?observe=1',T],
            ['runtimeDeploy',cf+'/workers/scripts/vigia-runtime/deployments',CF],
            ['runnerDeploy',cf+'/workers/scripts/vigia-source-runner/deployments',CF],
            ['runtimeSettings',cf+'/workers/scripts/vigia-runtime/settings',CF],
            ['runnerSettings',cf+'/workers/scripts/vigia-source-runner/settings',CF],
            ['runtimeCron',cf+'/workers/scripts/vigia-runtime/schedules',CF],
            ['runnerCron',cf+'/workers/scripts/vigia-source-runner/schedules',CF],
            ['d1',cf+'/d1/database/'+D,CF],
            ['buildLimit',cf+'/builds/account/limits',CF]
          ];
          const allowed=new Set(tasks.map(x=>x[1]));
          let reads=0;
          const get=async([k,url,key])=>{
            if(!allowed.has(url)||++reads>11)throw Error('read-limit-or-url-not-authorized');
            try{const r=await fetch(url,{method:'GET',headers:{Authorization:'Bearer '+key,Accept:'application/json'},redirect:'error',signal:AbortSignal.timeout(15000)});const t=await r.text();let j=null;if(t.length<1300000)try{j=JSON.parse(t)}catch{}return[k,{http:r.status,j}];}
            catch(e){return[k,{http:0,j:null,transportError:e instanceof Error?e.name:'unavailable'}];}
          };
          const pairs=await Promise.all(tasks.map(get)),x=Object.fromEntries(pairs);
          const control=x.coordinator.j||{},coord=control.state||{},a=x.aesan.j||{},hs=a.historicalReconcile||{},cert=a.revisionCertification||{},recent=a.recent||{};
          const minutes=t=>typeof t==='string'&&Number.isFinite(Date.parse(t))?Number(((Date.now()-Date.parse(t))/60000).toFixed(2)):null;
          const certCycle=hs.planVersion?.trim()?hs.planVersion.trim():hs.completedAt?'AESAN:historical-reconcile:'+hs.completedAt:null;
          const certified=hs.source==='AESAN'&&hs.mode==='historical-reconcile'&&hs.status==='completed'&&hs.coverage==='official-index-complete'&&
            hs.cursor===hs.totalUnits&&hs.totalUnits>0&&hs.detailFailures===0&&hs.pageErrors===0&&!hs.lastError&&
            cert.source==='AESAN'&&cert.mode==='historical-reconcile'&&cert.auditStatus==='passed'&&cert.coverage==='official-index-complete'&&cert.completedAt===hs.completedAt&&cert.cycleId===certCycle;
          const recentOK=recent.status==='completed'&&!recent.lastError&&recent.detailFailures===0&&minutes(recent.lastSuccessAt)!==null&&minutes(recent.lastSuccessAt)>=0&&minutes(recent.lastSuccessAt)<=45;
          const sg5=['AESAN','RAPNA','RASFF','SAFETY GATE','OECD'].map(name=>{
            const f=(x.freshness.j?.states||[]).find(z=>z.source===name)||{};
            return {name,recentAgeMinutes:minutes(f.lastSyncSuccessAt),checkedAgeMinutes:minutes(f.checkedAt),parity:f.latestIdentityParity===true,
              missing:(f.missingOfficialIdentities||[]).length,mismatches:(f.revisionMismatches||[]).length,historical:f.revisionStatus??null};
          });
          const fiveRecent=sg5.every(s=>s.recentAgeMinutes!==null&&s.recentAgeMinutes>=0&&s.recentAgeMinutes<=45&&
            s.checkedAgeMinutes!==null&&s.checkedAgeMinutes>=0&&s.checkedAgeMinutes<=45&&s.parity&&!s.missing&&!s.mismatches);
          const histories=Object.entries(coord.revisionAttempts||{}).filter(([k])=>['RASFF:reconcile','RAPNA:legacy-reconcile','OECD:historical-reconcile'].includes(k)).map(([k,v])=>({key:k,outcome:v?.outcome??null,durableHold:String(v?.nextEligibleAt||'').startsWith('9999')}));
          const deploys=z=>z.j?.result?.deployments||[];
          const runtime=deploys(x.runtimeDeploy),runner=deploys(x.runnerDeploy);
          const current=ds=>ds[0]?.versions?.find(z=>z.percentage===100)?.version_id||null;
          const rollback=ds=>ds.slice(1).some(z=>Array.isArray(z.versions)&&z.versions.some(v=>v.version_id));
          const bindings=z=>z.j?.result?.bindings||[];
          const rb=bindings(x.runnerSettings),wb=bindings(x.runtimeSettings);
          const activeRunner=rb.some(v=>v.name==='SOURCE_RUNNER_MODE'&&v.type==='plain_text'&&v.text==='active');
          const noHybrid=rb.every(v=>v.name!=='SAFETY_GATE_RECENT_STRATEGY');
          const d1=wb.some(v=>v.name==='DB'&&(v.id===D||v.database_id===D))&&
            (x.d1.j?.result?.uuid===D||x.d1.j?.result?.id===D);
          const cron=z=>Array.isArray(z.j?.result?.schedules)?z.j.result.schedules.map(y=>y.cron):[];
          const rtcron=cron(x.runtimeCron),rcron=cron(x.runnerCron);
          const hlease=a.lease&&Number.isFinite(Date.parse(a.lease.expiresAt))&&Date.parse(a.lease.expiresAt)>Date.now();
          const allHTTP=pairs.every(([,v])=>v.http===200);
          const sameBuild=control.buildSha==='d5fcd11cbeb563258b4bbdc9482a80b8684c81d3';
          const health=allHTTP&&sameBuild&&control.mode==='five-source-coordinated'&&Boolean(coord.ownershipVerifiedAt)&&certified&&
            recentOK&&fiveRecent&&activeRunner&&noHybrid&&d1&&rtcron.length===1&&rtcron[0]==='*/5 * * * *'&&rcron.length===0&&rollback(runtime)&&rollback(runner);
          const buildLimit=x.buildLimit.j?.result||{};
          out('control',{http:Object.fromEntries(pairs.map(([k,v])=>[k,v.http])),exactMain:sameBuild,coordinatorMode:control.mode,
            coordinatorLease:control.activeLease??null,sourceLeaseActive:!!hlease,
            runtimeVersion:current(runtime)?.slice(0,12)||null,runnerVersion:current(runner)?.slice(0,12)||null,
            runtimeRollback:rollback(runtime),runnerRollback:rollback(runner),runnerActive:activeRunner,noHybrid,d1Correct:d1,
            cron:rtcron,runnerCron:rcron,buildLimitReached:buildLimit.has_reached_build_minutes_limit??null,
            remainingBuildMinutesAvailable:typeof buildLimit.remaining_build_minutes==='number',billedIncrementUnknown:true});
          out('AESAN',{recentStatus:recent.status??null,recentAgeMinutes:minutes(recent.lastSuccessAt),
            historicalStatus:hs.status??null,historicalAgeMinutes:minutes(hs.completedAt),historicalCoverage:hs.coverage??null,
            completionMatchesCertificate:hs.completedAt!=null&&hs.completedAt===cert.completedAt,
            certificatePassed:cert.auditStatus==='passed',certificateCycleMatches:cert.cycleId===certCycle,
            terminalCursor:hs.cursor===hs.totalUnits,totalUnits:hs.totalUnits??null,
            recentOK,historicalEligibleFor18h:certified,historicalWithin24h:minutes(hs.completedAt)!==null&&minutes(hs.completedAt)<=1440,
            fiveRecentHealthy:fiveRecent,sources:sg5,historicalHolds:histories,globalHistoryCertified:control.officialParityCertified===true});
          out('verdict',{state:health?'PASS_READONLY_PREPARE':'HOLD',reads,noWrites:true,noD1SQL:true,noSourceSync:true,noDeploy:true,
            noRuntimeChanges:true,authorizationToMerge:false,authorizationToChangeHistoricalLatency:false,
            caveat:'one-time snapshot only, publication requires separate JIT checks and cost gate'});
          if(!health)process.exitCode=1;
          NODE
