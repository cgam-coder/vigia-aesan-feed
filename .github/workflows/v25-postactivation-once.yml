name: V25 Source Runner postactivation passive verification read-only
on:
  push:
    branches: [audit/v25-postactivation-check-20261012]
    paths: [.github/workflows/v25-postactivation-once.yml]
permissions:
  contents: read
jobs:
  audit:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Strictly bounded GETs plus SELECT-only D1 receipts
        env:
          T: ${{ secrets.VIGIA_SYNC_TOKEN }}
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const out=(phase,obj)=>console.log('V25_POSTACT '+JSON.stringify({phase,...obj}));
          const T=process.env.T,CF=process.env.CF;
          if(!T||!CF){out('verdict',{status:'HOLD_EXISTING_SECRETS_ABSENT',queries:0});process.exit(2)}
          const account='9c1807c68493f14259248b5f5782cc6f', dbid='55596003-1b90-4f66-aad8-decb21205f13';
          const api='https://api.cloudflare.com/client/v4/accounts/'+account,root='https://vigia-runtime.c-gamiz93.workers.dev';
          const requiredSha='d5fcd11cbeb563258b4bbdc9482a80b8684c81d3';
          const endpoints=[
            ['owner',root+'/api/source-reliability?observe=1',T],
            ['fresh',root+'/api/freshness?observe=1',T],
            ['runtime',api+'/workers/scripts/vigia-runtime/deployments',CF],
            ['runner',api+'/workers/scripts/vigia-source-runner/deployments',CF],
            ['runtimeSettings',api+'/workers/scripts/vigia-runtime/settings',CF],
            ['runnerSettings',api+'/workers/scripts/vigia-source-runner/settings',CF],
            ['runtimeSchedule',api+'/workers/scripts/vigia-runtime/schedules',CF],
            ['runnerSchedule',api+'/workers/scripts/vigia-source-runner/schedules',CF],
            ['d1',api+'/d1/database/'+dbid,CF],
            ['buildLimit',api+'/builds/account/limits',CF],
            ['build314',api+'/builds/builds/a622cf79-fc79-4ff3-9f26-a42eacdc470d',CF],
          ];
          const allowed=new Set(endpoints.map(x=>x[1]).concat(api+'/d1/database/'+dbid+'/query'));
          let reads=0,selects=0,rowsRead=0,rowsWritten=0;
          async function fetchStrict(url,token,sql=null,params=[]){
            if(!allowed.has(url)||++reads>14)throw Error('ADMISSION_REQUEST_LIMIT');
            if(sql!==null){
              if(++selects>3||!/^SELECT\s/u.test(sql)||sql.includes(';')||
                /\b(DELETE|UPDATE|INSERT|DROP|ALTER|CREATE|PRAGMA|ATTACH|DETACH|VACUUM|REPLACE)\b/iu.test(sql))throw Error('D1_SELECT_POLICY');
            }
            try{
              const r=await fetch(url,{method:sql===null?'GET':'POST',headers:{Authorization:'Bearer '+token,Accept:'application/json',
               ...(sql===null?{}:{'Content-Type':'application/json'})},
               ...(sql===null?{}:{body:JSON.stringify({sql,params})}),redirect:'error',signal:AbortSignal.timeout(14500)});
              const raw=await r.text();let j=null;if(raw.length<=1350000)try{j=JSON.parse(raw)}catch{}
              return {http:r.status,j};
            }catch(e){return{http:0,j:null,error:e instanceof Error?e.name:'transport-error'};}
          }
          try{
            const results=await Promise.all(endpoints.map(async([k,url,token])=>[k,await fetchStrict(url,token)]));
            const x=Object.fromEntries(results);
            const ok=results.every(([,v])=>v.http===200);
            const owner=x.owner.j||{},s=owner.state||{},age=t=>typeof t==='string'&&Number.isFinite(Date.parse(t))?+((Date.now()-Date.parse(t))/60000).toFixed(2):null;
            const sources=['AESAN','RAPNA','RASFF','SAFETY GATE','OECD'].map(n=>{
              const z=(x.fresh.j?.states||[]).find(v=>v.source===n)||{};
              return {name:n,age:age(z.lastSyncSuccessAt),checkedAge:age(z.checkedAt),parity:z.latestIdentityParity===true,
                missing:(z.missingOfficialIdentities||[]).length,mismatch:(z.revisionMismatches||[]).length,history:z.revisionStatus??null};
            });
            const recentHealthy=sources.every(z=>z.age!==null&&z.age>=0&&z.age<=45&&z.checkedAge!==null&&z.checkedAge>=0&&z.checkedAge<=45&&z.parity&&z.missing===0&&z.mismatch===0);
            const revisions=['RAPNA:current-parity','RAPNA:legacy-reconcile','RASFF:reconcile','OECD:historical-reconcile'].map(key=>{
              const a=s.revisionAttempts?.[key]||{};
              return {key,id:a.id??null,outcome:a.outcome??null,pending:(a.pendingDetails||[]).length,
                blocked:String(a.nextEligibleAt||'').startsWith('9999'),reasonClass:/BUDGET_EXHAUSTED/iu.test(a.reason||'')?'BUDGET':
                /prior-revision-outcome-unconfirmed/iu.test(a.reason||'')?'UNKNOWN_FENCE':
                /403/u.test(a.reason||'')?'HTTP403':a.reason?.slice(0,65)||null};
            });
            const deployed=y=>y.j?.result?.deployments||[];
            const current=ds=>ds[0]?.versions?.find(z=>z.percentage===100)?.version_id||null;
            const rollback=ds=>ds.slice(1).some(z=>Array.isArray(z.versions)&&z.versions.some(q=>q.version_id));
            const rt=deployed(x.runtime),runner=deployed(x.runner);
            const rtSettings=x.runtimeSettings.j?.result?.bindings||[],runnerSettings=x.runnerSettings.j?.result?.bindings||[];
            const d1Bound=rtSettings.some(z=>z.name==='DB'&&z.type==='d1'&&z.id===dbid)&&
              (x.d1.j?.result?.uuid===dbid||x.d1.j?.result?.id===dbid);
            const runnerActive=runnerSettings.some(z=>z.name==='SOURCE_RUNNER_MODE'&&z.text==='active');
            const noHybrid=runnerSettings.every(z=>z.name!=='SAFETY_GATE_RECENT_STRATEGY');
            const crons=y=>Array.isArray(y.j?.result?.schedules)?y.j.result.schedules.map(z=>z.cron):[];
            const cr=crons(x.runtimeSchedule),rc=crons(x.runnerSchedule);
            const build=x.build314.j?.result||{},bill=x.buildLimit.j?.result||{};
            const mainMatch=owner.buildSha===requiredSha;
            const stateOk=mainMatch&&owner.mode==='five-source-coordinated'&&Boolean(s.ownershipVerifiedAt);
            out('health',{http:Object.fromEntries(results.map(([k,v])=>[k,v.http])),shaMatches:mainMatch,
              coordinatorMode:owner.mode,coordinatorLeaseActive:owner.activeLease??null,globalHistoricalCertified:owner.officialParityCertified===true,
              recentHealthy,sources,revisions,unknownRecent:Object.entries(s.attempts||{}).filter(([k,v])=>v?.outcome==='unknown').map(([k])=>k),
              runtimeVersion:current(rt)?.slice(0,12)||null,runnerVersion:current(runner)?.slice(0,12)||null,runnerExpectedVersion:'92273d27-d9d4',
              runtimeRollback:rollback(rt),runnerRollback:rollback(runner),runnerActive,noHybrid,d1BindingCorrect:d1Bound,
              runtimeCrons:cr,runnerCrons:rc});
            out('economic',{buildHttp:x.build314.http,buildStatus:build.status??null,buildOutcome:build.build_outcome??null,
              buildTriggerCommit:build.build_trigger_metadata?.commit_hash?.slice(0,12)||null,
              buildLimitHttp:x.buildLimit.http,buildLimitReached:typeof bill.has_reached_build_minutes_limit==='boolean'?bill.has_reached_build_minutes_limit:null,
              buildMinuteBalance:typeof bill.remaining_build_minutes==='number'?bill.remaining_build_minutes:null,
              addedRunnerJobsPerCompletedSixUnitCycle:1,estimatedRecurringAddedGithubMinutes:0,currencySavingsNotCertified:true,
              additionalSourceReadCountNotMeasured:true});
            if(!stateOk||!d1Bound||!ok){out('verdict',{status:'HOLD_BASELINE_OR_READ',reads,selects,rowsWritten});process.exit(2)}
            const id='ab50d0f7-0ad7-4fb5-8078-f6c376aa8f53';
            const sql=[
              ["job","SELECT id,source,mode,phase,epoch,started_at,finished_at,json_extract(receipt_json,'$.outcome') AS receipt_outcome,json_extract(receipt_json,'$.reason') AS reason FROM source_reliability_jobs WHERE id=? LIMIT 1",[id]],
              ["effects","SELECT COUNT(*) AS effects,COUNT(DISTINCT ordinal) AS distinct_ordinals,MIN(ordinal) AS low,MAX(ordinal) AS high,COALESCE(SUM(CASE WHEN committed_at IS NULL OR result_json IS NULL THEN 1 ELSE 0 END),0) AS pending FROM source_reliability_effects WHERE job_id=? AND ordinal>0",[id]],
              ["state","SELECT source,mode,status,cursor,total_units,plan_version,coverage,completed_at,last_error FROM source_sync_state WHERE source='RAPNA' AND mode='current-parity' LIMIT 1",[]],
            ];
            const evidence={};
            for(const [label,statement,params]of sql){
              const r=await fetchStrict(api+'/d1/database/'+dbid+'/query',CF,statement,params),part=r.j?.result?.[0];
              if(r.http!==200||r.j?.success!==true||!Array.isArray(part?.results)||part.meta?.rows_written!==0)throw Error('D1_READ_UNAVAILABLE_'+label);
              rowsRead+=part.meta.rows_read||0;rowsWritten+=part.meta.rows_written||0;
              if(rowsRead>6000||rowsWritten!==0)throw Error('D1_READ_LIMIT');
              evidence[label]=part.results;
            }
            const job=evidence.job?.[0]||{},effect=evidence.effects?.[0]||{},state=evidence.state?.[0]||{};
            const unknown= revisions.find(z=>z.key==='RAPNA:current-parity');
            const historicIntact=job.receipt_outcome==='unknown'&&effect.effects===114&&effect.distinct_ordinals===114&&
              effect.low===1&&effect.high===114&&effect.pending===0&&state.cursor===6&&state.total_units===6&&
              state.status==='completed'&&unknown?.id===id&&unknown.outcome==='unknown';
            out('rapna-fences',{jobOutcome:job.receipt_outcome,jobPhase:job.phase,jobReasonClass:job.reason==='RELIABILITY_BUDGET_EXHAUSTED'?'BUDGET_EXHAUSTED':'other',
              effects:effect.effects,pending:effect.pending,cursor:state.cursor,totalUnits:state.total_units,
              sourceStatus:state.status,officialIndexComplete:state.coverage==='official-index-complete',
              currentUnknownBlocked:unknown?.outcome==='unknown',historicIntact,reads,selects,rowsRead,rowsWritten});
            const infrastructure=ok&&recentHealthy&&stateOk&&d1Bound&&runnerActive&&noHybrid&&
              current(rt)?.startsWith('2914305e')&&current(runner)?.startsWith('92273d27')&&rollback(rt)&&rollback(runner)&&
              JSON.stringify(cr)===JSON.stringify(['*/5 * * * *'])&&rc.length===0;
            const budgetProven=typeof bill.has_reached_build_minutes_limit==='boolean'&&bill.has_reached_build_minutes_limit===false;
            const releaseReady=infrastructure&&historicIntact&&budgetProven&&!owner.activeLease;
            out('verdict',{status:releaseReady?'PASS_PREPARE_NOT_RELEASE':'HOLD_RELEASE_GATE',
              infrastructure,historicIntact,buildBudgetProven:budgetProven,leaseQuiet:!owner.activeLease,
              reads,selects,rowsRead,rowsWritten,sourceJobs:0,d1Mutations:0,configChanges:0,buildsStarted:0,
              noMerge:true,noDeploy:true,notAuthorizationToPublish:true});
          }catch(e){out('verdict',{status:'HOLD',reason:e instanceof Error?e.message:'unknown',reads,selects,rowsRead,rowsWritten,
            sourceJobs:0,d1Mutations:0,buildsStarted:0,noDeploy:true});process.exitCode=1;}
          NODE
