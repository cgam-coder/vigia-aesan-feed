name: VIGIA OECD temporary operator

on:
  workflow_dispatch:

concurrency:
  group: vigia-oecd-temporary-backfill
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      VIGIA_OECD_SYNC_URL: https://vigia-alertas.csar68.chatgpt.site/api/oecd/sync
      VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
    steps:
      - name: Confirm authorization and original snapshot
        run: |
          if [ -z "$VIGIA_SYNC_TOKEN" ]; then
            echo "OECD operator: VIGIA_SYNC_TOKEN is missing"
            exit 1
          fi
          preflight_file="$RUNNER_TEMP/oecd-preflight.json"
          preflight_code="$(curl --silent --show-error --location --request POST --header "Authorization: Bearer $VIGIA_SYNC_TOKEN" --max-time 30 --output "$preflight_file" --write-out '%{http_code}' "$VIGIA_OECD_SYNC_URL?mode=preflight")"
          node -e '
            const fs=require("node:fs");
            const status=Number(process.argv[1]);
            const body=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
            if(status!==200||body?.authorized!==true||body?.source!=="OECD") throw new Error("OECD preflight failed with HTTP "+status);
            console.log("OECD operator: endpoint authorized");
          ' "$preflight_code" "$preflight_file"
          observe_file="$RUNNER_TEMP/oecd-observe.json"
          observe_code="$(curl --silent --show-error --location --max-time 120 --output "$observe_file" --write-out '%{http_code}' "$VIGIA_OECD_SYNC_URL?observe=1")"
          node -e '
            const fs=require("node:fs");
            const status=Number(process.argv[1]);
            const body=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
            if(status!==200||!body?.snapshot||!["ready","backfill-running","backfill-completed"].includes(body.snapshot.status)) {
              throw new Error("OECD verified snapshot is unavailable");
            }
            if(body.snapshot.id!=="oecd-pre-backfill-2026-08-26T17-16-07.295Z-5a0b4aae-8d29-4603-b207-91828889ce7d") {
              throw new Error("OECD original rollback snapshot changed");
            }
            console.log(JSON.stringify({snapshot:body.snapshot,backfill:body.backfill,lease:body.lease}));
          ' "$observe_code" "$observe_file"

      - name: Run bounded resumable OECD backfill
        id: backfill
        run: |
          baseline_file="$RUNNER_TEMP/oecd-backfill-baseline.json"
          baseline_code="$(curl --silent --show-error --location --max-time 120 --output "$baseline_file" --write-out '%{http_code}' "$VIGIA_OECD_SYNC_URL?observe=1")"
          baseline_line="$(node -e '
            const fs=require("node:fs");
            const http=Number(process.argv[1]);
            const body=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
            const state=body?.backfill;
            if(http!==200||!state||state.source!=="OECD"||state.mode!=="backfill") throw new Error("OECD baseline unavailable: HTTP "+http);
            if(state.planVersion!=="oecd-v2-daily"||!state.cursorKey) throw new Error("OECD baseline cursor is not versioned");
            if(body.lease!==null||state.leaseOwnerId!==null||state.leaseMode!==null||state.leaseExpiresAt!==null) throw new Error("OECD baseline has an active lease");
            console.error(JSON.stringify({baseline:true,status:state.status,cursor:state.cursor,cursorKey:state.cursorKey,
              totalUnits:state.totalUnits,recordsObserved:state.recordsObserved,recordsPersisted:state.recordsPersisted,
              newCount:state.newCount,updatedCount:state.updatedCount,detailFailures:state.detailFailures,
              pageErrors:state.pageErrors,lastError:state.lastError}));
            process.stdout.write([state.status,state.cursor,state.totalUnits,state.cursorKey,state.pageErrors,
              state.detailFailures,state.recordsObserved,state.recordsPersisted,state.newCount,state.updatedCount].join("|"));
          ' "$baseline_code" "$baseline_file")"
          IFS='|' read -r baseline_status previous_cursor total_units cursor_key baseline_page_errors baseline_detail_failures previous_records_observed previous_records_persisted previous_new_count baseline_updated_count <<< "$baseline_line"
          completed=false
          if [ "$baseline_status" = "completed" ]; then
            completed=true
          fi
          successful_units=0
          wait_attempts=0
          deadline=$(( $(date +%s) + 18000 ))
          while [ "$completed" != "true" ] && [ "$successful_units" -lt 300 ] && [ "$(date +%s)" -lt "$deadline" ]; do
            response_file="$RUNNER_TEMP/oecd-backfill-$successful_units-$wait_attempts.json"
            http_code="$(curl --silent --show-error --location --request POST --header "Authorization: Bearer $VIGIA_SYNC_TOKEN" --retry 1 --retry-delay 3 --retry-all-errors --max-time 120 --output "$response_file" --write-out '%{http_code}' "$VIGIA_OECD_SYNC_URL?mode=backfill&batchSize=1" || true)"
            if [ "$http_code" = "202" ]; then
              node -e '
                const fs=require("node:fs");
                const body=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
                if(body?.state?.status!=="skipped"||body?.state?.lastSkipReason!=="already-running") {
                  throw new Error("Unexpected OECD HTTP 202 response");
                }
              ' "$response_file"
              wait_attempts=$((wait_attempts + 1))
              if [ "$wait_attempts" -gt 40 ]; then
                echo "OECD lease remained busy beyond the bounded recovery window"
                exit 1
              fi
              sleep 15
              continue
            fi
            state_line="$(node -e '
              const fs=require("node:fs");
              const http=Number(process.argv[1]);
              const body=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
              const previousCursor=Number(process.argv[3]);
              const baselinePageErrors=Number(process.argv[4]);
              const baselineDetailFailures=Number(process.argv[5]);
              const previousObserved=Number(process.argv[6]);
              const previousPersisted=Number(process.argv[7]);
              const previousNewCount=Number(process.argv[8]);
              const baselineUpdatedCount=Number(process.argv[9]);
              const state=body?.state;
              if(http!==200||!state||state.source!=="OECD"||state.mode!=="backfill") throw new Error("Unexpected OECD backfill response: HTTP "+http);
              if(["failed","skipped"].includes(state.status)||state.lastError) throw new Error(state.lastError||("OECD backfill "+state.status));
              if(state.planVersion!=="oecd-v2-daily"||!state.cursorKey) throw new Error("OECD versioned cursor was not persisted");
              if(state.cursor!==previousCursor+1) throw new Error("OECD cursor did not advance exactly one unit from "+previousCursor+" to "+state.cursor);
              if(state.pageErrors!==baselinePageErrors) throw new Error("OECD pageErrors changed from baseline "+baselinePageErrors+" to "+state.pageErrors);
              if(state.detailFailures!==baselineDetailFailures) throw new Error("OECD detailFailures changed from baseline "+baselineDetailFailures+" to "+state.detailFailures);
              if(state.recordsObserved<previousObserved||state.recordsPersisted<previousPersisted||state.newCount<previousNewCount) throw new Error("OECD cumulative counters regressed");
              if(state.updatedCount!==baselineUpdatedCount) throw new Error("OECD updatedCount changed from baseline "+baselineUpdatedCount+" to "+state.updatedCount);
              if(state.status==="completed"&&state.cursor!==state.totalUnits) throw new Error("OECD completed state does not match totalUnits");
              if(state.leaseOwnerId!==null||state.leaseMode!==null||state.leaseExpiresAt!==null) throw new Error("OECD lease was not released after a unit");
              console.error(JSON.stringify({status:state.status,cursor:state.cursor,cursorKey:state.cursorKey,totalUnits:state.totalUnits,
                pagesScanned:state.pagesScanned,recordsObserved:state.recordsObserved,
                recordsPersisted:state.recordsPersisted,newCount:state.newCount,updatedCount:state.updatedCount,
                detailFailures:state.detailFailures,pageErrors:state.pageErrors,lastError:state.lastError}));
              process.stdout.write([state.status,state.cursor,state.totalUnits,state.cursorKey,state.recordsObserved,
                state.recordsPersisted,state.newCount].join("|"));
            ' "$http_code" "$response_file" "$previous_cursor" "$baseline_page_errors" "$baseline_detail_failures" "$previous_records_observed" "$previous_records_persisted" "$previous_new_count" "$baseline_updated_count")"
            IFS='|' read -r state_status current_cursor total_units cursor_key current_records_observed current_records_persisted current_new_count <<< "$state_line"
            previous_cursor="$current_cursor"
            previous_records_observed="$current_records_observed"
            previous_records_persisted="$current_records_persisted"
            previous_new_count="$current_new_count"
            successful_units=$((successful_units + 1))
            wait_attempts=0
            if [ "$state_status" = "completed" ]; then
              completed=true
              break
            fi
            if [ $((successful_units % 10)) -eq 0 ]; then
              audit_file="$RUNNER_TEMP/oecd-audit-$successful_units.json"
              audit_code="$(curl --silent --show-error --location --max-time 120 --output "$audit_file" --write-out '%{http_code}' "$VIGIA_OECD_SYNC_URL?audit=1")"
              node -e '
                const fs=require("node:fs");
                const http=Number(process.argv[1]);
                const body=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
                const audit=body?.audit;
                if(http!==200||!audit) throw new Error("OECD audit failed with HTTP "+http);
                const c=audit.counts, i=audit.integrity, s=audit.logicalStorage;
                if(i.duplicateReferenceGroups||i.invalidIdentities||i.emptyCanonicalRows||i.invalidOfficialUrls) throw new Error("OECD integrity gate failed");
                if(c.oecdAlerts!==c.oecdUniqueReferences||c.oecdAlerts!==c.oecdVersions||c.oecdAlerts!==c.oecdVersionCountSum) throw new Error("OECD initial version gate failed");
                if(c.aesanAlerts<124||c.safetyGateAlerts<46746||c.rapnaAlerts<11151) throw new Error("Existing-source preservation gate failed");
                const logical=s.allCanonicalJsonBytes+s.allVersionSnapshotBytes;
                if(logical>8000000000) throw new Error("OECD logical storage safety envelope exceeded");
                console.log(JSON.stringify({checkedAt:audit.checkedAt,counts:c,integrity:i,logicalStorage:s,totalLogicalBytes:logical,snapshotStatus:audit.snapshot?.status}));
              ' "$audit_code" "$audit_file"
            fi
          done
          echo "completed=$completed" >> "$GITHUB_OUTPUT"
          echo "cursor=$previous_cursor" >> "$GITHUB_OUTPUT"
          echo "successful_units=$successful_units" >> "$GITHUB_OUTPUT"
          echo "OECD bounded run ended: completed=$completed cursor=$previous_cursor units=$successful_units"

      - name: Audit safe checkpoint
        run: |
          audit_file="$RUNNER_TEMP/oecd-final-audit.json"
          audit_code="$(curl --silent --show-error --location --max-time 180 --output "$audit_file" --write-out '%{http_code}' "$VIGIA_OECD_SYNC_URL?audit=1")"
          node -e '
            const fs=require("node:fs");
            const http=Number(process.argv[1]);
            const body=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
            const audit=body?.audit;
            if(http!==200||!audit) throw new Error("OECD checkpoint audit failed with HTTP "+http);
            const c=audit.counts, i=audit.integrity;
            if(i.duplicateReferenceGroups||i.invalidIdentities||i.emptyCanonicalRows||i.invalidOfficialUrls) throw new Error("OECD checkpoint integrity gate failed");
            if(c.oecdAlerts!==c.oecdUniqueReferences||c.oecdAlerts!==c.oecdVersions||c.oecdAlerts!==c.oecdVersionCountSum) throw new Error("OECD checkpoint version gate failed");
            console.log(JSON.stringify(audit));
          ' "$audit_code" "$audit_file"

      - name: Queue next bounded continuation
        if: steps.backfill.outputs.completed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Queuing OECD continuation from cursor \${{ steps.backfill.outputs.cursor }}"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/workflows/oecd-temporary-operator.yml/dispatches" -f ref=main
