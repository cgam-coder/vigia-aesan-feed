name: VIGIA OECD temporary operator

on:
  workflow_dispatch:

concurrency:
  group: vigia-oecd-temporary-idempotence
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  idempotence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VIGIA_OECD_SYNC_URL: https://vigia-alertas.csar68.chatgpt.site/api/oecd/sync
      VIGIA_ALERTS_URL: https://vigia-alertas.csar68.chatgpt.site/api/alerts
      VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
    steps:
      - name: Confirm authorization and completed backfill
        run: |
          if [ -z "$VIGIA_SYNC_TOKEN" ]; then
            echo "OECD idempotence: VIGIA_SYNC_TOKEN is missing"
            exit 1
          fi
          preflight_file="$RUNNER_TEMP/oecd-preflight.json"
          preflight_code="$(curl --silent --show-error --location --request POST --header "Authorization: Bearer $VIGIA_SYNC_TOKEN" --max-time 30 --output "$preflight_file" --write-out '%{http_code}' "$VIGIA_OECD_SYNC_URL?mode=preflight")"
          observe_file="$RUNNER_TEMP/oecd-baseline-observe.json"
          observe_code="$(curl --silent --show-error --location --max-time 120 --output "$observe_file" --write-out '%{http_code}' "$VIGIA_OECD_SYNC_URL?observe=1")"
          audit_file="$RUNNER_TEMP/oecd-baseline-audit.json"
          audit_code="$(curl --silent --show-error --location --max-time 180 --output "$audit_file" --write-out '%{http_code}' "$VIGIA_OECD_SYNC_URL?audit=1")"
          node -e '
            const fs=require("node:fs");
            const preflightCode=Number(process.argv[1]);
            const preflight=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
            const observeCode=Number(process.argv[3]);
            const observe=JSON.parse(fs.readFileSync(process.argv[4],"utf8"));
            const auditCode=Number(process.argv[5]);
            const audit=JSON.parse(fs.readFileSync(process.argv[6],"utf8"))?.audit;
            if(preflightCode!==200||preflight?.authorized!==true||preflight?.source!=="OECD") throw new Error("OECD preflight failed");
            if(observeCode!==200||observe?.backfill?.status!=="completed"||observe.backfill.cursor!==observe.backfill.totalUnits||observe.backfill.cursorKey!=="complete") throw new Error("OECD backfill is not completed");
            if(observe?.snapshot?.status!=="backfill-completed"||observe?.lease!==null) throw new Error("OECD snapshot or lease baseline is unsafe");
            const c=audit?.counts, i=audit?.integrity;
            if(auditCode!==200||!audit||i.duplicateReferenceGroups||i.invalidIdentities||i.emptyCanonicalRows||i.invalidOfficialUrls) throw new Error("OECD baseline integrity failed");
            if(c.oecdAlerts!==c.oecdUniqueReferences||c.oecdAlerts!==c.oecdVersions||c.oecdAlerts!==c.oecdVersionCountSum) throw new Error("OECD baseline versions failed");
            console.log(JSON.stringify({backfill:observe.backfill,snapshot:observe.snapshot,counts:c,integrity:i}));
          ' "$preflight_code" "$preflight_file" "$observe_code" "$observe_file" "$audit_code" "$audit_file"

      - name: Verify concurrent lease and run first recent sync
        run: |
          run_recent() {
            label="$1"
            response_file="$RUNNER_TEMP/oecd-recent-$label.json"
            code_file="$RUNNER_TEMP/oecd-recent-$label.code"
            curl --silent --show-error --location --request POST \
              --header "Authorization: Bearer $VIGIA_SYNC_TOKEN" --max-time 480 \
              --output "$response_file" --write-out '%{http_code}' \
              "$VIGIA_OECD_SYNC_URL?mode=recent" > "$code_file"
          }
          run_recent a &
          pid_a=$!
          run_recent b &
          pid_b=$!
          wait "$pid_a"
          wait "$pid_b"
          node -e '
            const fs=require("node:fs");
            const entries=["a","b"].map((label)=>({
              label,
              code:Number(fs.readFileSync(process.env.RUNNER_TEMP+"/oecd-recent-"+label+".code","utf8")),
              body:JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/oecd-recent-"+label+".json","utf8")),
            }));
            const completed=entries.filter((entry)=>entry.code===200&&entry.body?.state?.status==="completed");
            const skipped=entries.filter((entry)=>entry.code===202&&entry.body?.state?.status==="skipped"&&entry.body?.state?.lastSkipReason==="already-running");
            if(completed.length!==1||skipped.length!==1) throw new Error("OECD concurrent lease gate expected one completed and one skipped call");
            const state=completed[0].body.state;
            if(state.lastError||state.detailFailures!==0||state.pageErrors!==0) throw new Error("OECD first recent sync reported failures");
            if(state.leaseOwnerId!==null||state.leaseMode!==null||state.leaseExpiresAt!==null) throw new Error("OECD first recent lease was not released");
            fs.writeFileSync(process.env.RUNNER_TEMP+"/oecd-first-success.json",JSON.stringify(completed[0].body));
            console.log(JSON.stringify({completed:completed[0],skipped:skipped[0]}));
          '

      - name: Capture first successful state
        run: |
          observe_file="$RUNNER_TEMP/oecd-after-first-observe.json"
          audit_file="$RUNNER_TEMP/oecd-after-first-audit.json"
          alerts_file="$RUNNER_TEMP/oecd-after-first-alerts.json"
          observe_code="$(curl --silent --show-error --location --max-time 120 --output "$observe_file" --write-out '%{http_code}' "$VIGIA_OECD_SYNC_URL?observe=1")"
          audit_code="$(curl --silent --show-error --location --max-time 180 --output "$audit_file" --write-out '%{http_code}' "$VIGIA_OECD_SYNC_URL?audit=1")"
          alerts_code="$(curl --silent --show-error --location --max-time 180 --output "$alerts_file" --write-out '%{http_code}' "$VIGIA_ALERTS_URL")"
          node -e '
            const fs=require("node:fs");
            const observe=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
            const audit=JSON.parse(fs.readFileSync(process.argv[4],"utf8"))?.audit;
            const alerts=JSON.parse(fs.readFileSync(process.argv[6],"utf8"));
            if(Number(process.argv[1])!==200||observe?.recent?.status!=="completed"||observe?.recent?.lastError||observe?.lease!==null) throw new Error("OECD first recent state is unsafe");
            if(Number(process.argv[3])!==200||!audit) throw new Error("OECD first audit unavailable");
            const c=audit.counts, i=audit.integrity;
            if(i.duplicateReferenceGroups||i.invalidIdentities||i.emptyCanonicalRows||i.invalidOfficialUrls) throw new Error("OECD first audit integrity failed");
            if(c.oecdAlerts!==c.oecdUniqueReferences||c.oecdAlerts!==c.oecdVersions||c.oecdAlerts!==c.oecdVersionCountSum) throw new Error("OECD first audit versions failed");
            if(Number(process.argv[5])!==200||alerts?.schemaVersion!==1||alerts?.mode!=="live") throw new Error("VIGÍA public projection unavailable");
            console.log(JSON.stringify({recent:observe.recent,counts:c,integrity:i}));
          ' "$observe_code" "$observe_file" "$audit_code" "$audit_file" "$alerts_code" "$alerts_file"

      - name: Run equivalent recent sync and prove idempotence
        run: |
          second_file="$RUNNER_TEMP/oecd-second-success.json"
          second_code="$(curl --silent --show-error --location --request POST \
            --header "Authorization: Bearer $VIGIA_SYNC_TOKEN" --max-time 480 \
            --output "$second_file" --write-out '%{http_code}' "$VIGIA_OECD_SYNC_URL?mode=recent")"
          final_observe_file="$RUNNER_TEMP/oecd-final-observe.json"
          final_audit_file="$RUNNER_TEMP/oecd-final-audit.json"
          final_alerts_file="$RUNNER_TEMP/oecd-final-alerts.json"
          final_observe_code="$(curl --silent --show-error --location --max-time 120 --output "$final_observe_file" --write-out '%{http_code}' "$VIGIA_OECD_SYNC_URL?observe=1")"
          final_audit_code="$(curl --silent --show-error --location --max-time 180 --output "$final_audit_file" --write-out '%{http_code}' "$VIGIA_OECD_SYNC_URL?audit=1")"
          final_alerts_code="$(curl --silent --show-error --location --max-time 180 --output "$final_alerts_file" --write-out '%{http_code}' "$VIGIA_ALERTS_URL")"
          node -e '
            const crypto=require("node:crypto");
            const fs=require("node:fs");
            const secondCode=Number(process.argv[1]);
            const second=JSON.parse(fs.readFileSync(process.argv[2],"utf8"))?.state;
            const observeCode=Number(process.argv[3]);
            const observe=JSON.parse(fs.readFileSync(process.argv[4],"utf8"));
            const auditCode=Number(process.argv[5]);
            const afterFirst=JSON.parse(fs.readFileSync(process.argv[6],"utf8"))?.audit;
            const finalAudit=JSON.parse(fs.readFileSync(process.argv[7],"utf8"))?.audit;
            const firstAlerts=JSON.parse(fs.readFileSync(process.argv[8],"utf8"));
            const finalAlertsCode=Number(process.argv[9]);
            const finalAlerts=JSON.parse(fs.readFileSync(process.argv[10],"utf8"));
            if(secondCode!==200||second?.status!=="completed"||second.newCount!==0||second.updatedCount!==0||second.detailFailures!==0||second.pageErrors!==0||second.lastError) throw new Error("OECD second recent sync is not idempotent");
            if(second.leaseOwnerId!==null||second.leaseMode!==null||second.leaseExpiresAt!==null) throw new Error("OECD second recent lease was not released");
            if(observeCode!==200||observe?.recent?.status!=="completed"||observe?.recent?.lastError||observe?.lease!==null) throw new Error("OECD final observe state is unsafe");
            if(observe?.backfill?.status!=="completed"||observe?.snapshot?.status!=="backfill-completed") throw new Error("OECD completed backfill state changed");
            if(auditCode!==200||!afterFirst||!finalAudit) throw new Error("OECD final audit unavailable");
            const c1=afterFirst.counts, c2=finalAudit.counts, i=finalAudit.integrity;
            if(i.duplicateReferenceGroups||i.invalidIdentities||i.emptyCanonicalRows||i.invalidOfficialUrls) throw new Error("OECD final integrity failed");
            if(c2.oecdAlerts!==c2.oecdUniqueReferences||c2.oecdAlerts!==c2.oecdVersions||c2.oecdAlerts!==c2.oecdVersionCountSum) throw new Error("OECD final versions failed");
            for(const key of ["oecdAlerts","oecdUniqueReferences","oecdVersions","oecdVersionCountSum"]) if(c1[key]!==c2[key]) throw new Error("OECD counts changed during equivalent second sync: "+key);
            for(const key of ["oecdCanonicalJsonBytes","oecdVersionSnapshotBytes"]) if(afterFirst.logicalStorage[key]!==finalAudit.logicalStorage[key]) throw new Error("OECD logical content changed during equivalent second sync: "+key);
            if(c2.aesanAlerts<124||c2.safetyGateAlerts<46746||c2.rapnaAlerts<11151) throw new Error("Existing sources were not preserved");
            const hash=(body)=>crypto.createHash("sha256").update(JSON.stringify(body.alerts.filter((alert)=>alert.source==="OECD").sort((a,b)=>a.id.localeCompare(b.id)))).digest("hex");
            if(finalAlertsCode!==200||hash(firstAlerts)!==hash(finalAlerts)) throw new Error("OECD public hash or updatedAt projection changed during equivalent second sync");
            console.log(JSON.stringify({second,finalRecent:observe.recent,counts:c2,integrity:i,logicalStorage:finalAudit.logicalStorage,publicOecdHash:hash(finalAlerts)}));
          ' "$second_code" "$second_file" "$final_observe_code" "$final_observe_file" "$final_audit_code" "$RUNNER_TEMP/oecd-after-first-audit.json" "$final_audit_file" "$RUNNER_TEMP/oecd-after-first-alerts.json" "$final_alerts_code" "$final_alerts_file"
