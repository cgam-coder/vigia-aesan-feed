name: VIGIA OECD temporary operator

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/oecd-temporary-operator.yml"

concurrency:
  group: vigia-oecd-temporary-backfill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      VIGIA_OECD_SYNC_URL: https://vigia-alertas.csar68.chatgpt.site/api/oecd/sync
      VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
    steps:
      - name: Confirm authorization and snapshot
        run: |
          if [ -z "${VIGIA_SYNC_TOKEN}" ]; then
            echo "OECD operator: VIGIA_SYNC_TOKEN is missing"
            exit 1
          fi
          preflight_file="${RUNNER_TEMP}/oecd-preflight.json"
          preflight_code="$(curl --silent --show-error --location --request POST --header "Authorization: Bearer ${VIGIA_SYNC_TOKEN}" --max-time 30 --output "${preflight_file}" --write-out '%{http_code}' "${VIGIA_OECD_SYNC_URL}?mode=preflight")"
          node -e '
            const fs=require("node:fs");
            const status=Number(process.argv[1]);
            const body=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
            if(status!==200||body?.authorized!==true||body?.source!=="OECD") throw new Error(`OECD preflight failed with HTTP ${status}`);
            console.log("OECD operator: endpoint authorized");
          ' "${preflight_code}" "${preflight_file}"
          observe_file="${RUNNER_TEMP}/oecd-observe.json"
          observe_code="$(curl --silent --show-error --location --max-time 120 --output "${observe_file}" --write-out '%{http_code}' "${VIGIA_OECD_SYNC_URL}?observe=1")"
          node -e '
            const fs=require("node:fs");
            const status=Number(process.argv[1]);
            const body=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
            if(status!==200||!body?.snapshot||!["ready","backfill-running","backfill-completed"].includes(body.snapshot.status)) {
              throw new Error("OECD verified snapshot is unavailable");
            }
            console.log(JSON.stringify({snapshot:body.snapshot,backfill:body.backfill,lease:body.lease}));
          ' "${observe_code}" "${observe_file}"

      - name: Run resumable OECD backfill
        run: |
          previous_cursor=-1
          completed=0
          for batch in $(seq 1 665); do
            response_file="${RUNNER_TEMP}/oecd-backfill-${batch}.json"
            http_code="$(curl --silent --show-error --location --request POST --header "Authorization: Bearer ${VIGIA_SYNC_TOKEN}" --retry 2 --retry-delay 3 --retry-all-errors --max-time 480 --output "${response_file}" --write-out '%{http_code}' "${VIGIA_OECD_SYNC_URL}?mode=backfill&batchSize=1")"
            state_line="$(node -e '
              const fs=require("node:fs");
              const http=Number(process.argv[1]);
              const body=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
              const previous=Number(process.argv[3]);
              const state=body?.state;
              if(http!==200||!state||state.source!=="OECD"||state.mode!=="backfill") throw new Error(`Unexpected OECD backfill response: HTTP ${http}`);
              if(["failed","skipped"].includes(state.status)||state.lastError) throw new Error(state.lastError||`OECD backfill ${state.status}`);
              if(state.cursor<previous) throw new Error(`OECD cursor regressed from ${previous} to ${state.cursor}`);
              if(state.pageErrors!==0||state.detailFailures!==0) throw new Error("OECD backfill reported failures");
              if(state.leaseOwnerId!==null||state.leaseMode!==null||state.leaseExpiresAt!==null) throw new Error("OECD lease was not released after a unit");
              console.error(JSON.stringify({status:state.status,cursor:state.cursor,totalUnits:state.totalUnits,
                pagesScanned:state.pagesScanned,recordsObserved:state.recordsObserved,
                recordsPersisted:state.recordsPersisted,newCount:state.newCount,updatedCount:state.updatedCount,
                detailFailures:state.detailFailures,pageErrors:state.pageErrors,lastError:state.lastError}));
              process.stdout.write(`${state.status}|${state.cursor}|${state.totalUnits}`);
            ' "${http_code}" "${response_file}" "${previous_cursor}")"
            state_status="${state_line%%|*}"
            cursor_and_total="${state_line#*|}"
            current_cursor="${cursor_and_total%%|*}"
            previous_cursor="${current_cursor}"
            if [ "${state_status}" = "completed" ]; then
              completed=1
              break
            fi
            if [ $((batch % 10)) -eq 0 ]; then
              audit_file="${RUNNER_TEMP}/oecd-audit-${batch}.json"
              audit_code="$(curl --silent --show-error --location --max-time 120 --output "${audit_file}" --write-out '%{http_code}' "${VIGIA_OECD_SYNC_URL}?audit=1")"
              node -e '
                const fs=require("node:fs");
                const http=Number(process.argv[1]);
                const body=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
                const audit=body?.audit;
                if(http!==200||!audit) throw new Error(`OECD audit failed with HTTP ${http}`);
                const c=audit.counts, i=audit.integrity, s=audit.logicalStorage;
                if(i.duplicateReferenceGroups||i.invalidIdentities||i.emptyCanonicalRows||i.invalidOfficialUrls) throw new Error("OECD integrity gate failed");
                if(c.oecdAlerts!==c.oecdUniqueReferences||c.oecdAlerts!==c.oecdVersions||c.oecdAlerts!==c.oecdVersionCountSum) throw new Error("OECD initial version gate failed");
                if(c.aesanAlerts<124||c.safetyGateAlerts<46746||c.rapnaAlerts<11151) throw new Error("Existing-source preservation gate failed");
                const logical=s.allCanonicalJsonBytes+s.allVersionSnapshotBytes;
                if(logical>8000000000) throw new Error("OECD logical storage safety envelope exceeded");
                console.log(JSON.stringify({checkedAt:audit.checkedAt,counts:c,integrity:i,logicalStorage:s,totalLogicalBytes:logical,snapshotStatus:audit.snapshot?.status}));
              ' "${audit_code}" "${audit_file}"
            fi
          done
          if [ "${completed}" -ne 1 ]; then
            echo "OECD backfill remains resumable at cursor ${previous_cursor}"
            exit 2
          fi

      - name: Final backfill audit
        run: |
          audit_file="${RUNNER_TEMP}/oecd-final-audit.json"
          audit_code="$(curl --silent --show-error --location --max-time 180 --output "${audit_file}" --write-out '%{http_code}' "${VIGIA_OECD_SYNC_URL}?audit=1")"
          node -e '
            const fs=require("node:fs");
            const http=Number(process.argv[1]);
            const body=JSON.parse(fs.readFileSync(process.argv[2],"utf8"));
            const audit=body?.audit;
            if(http!==200||!audit) throw new Error(`OECD final audit failed with HTTP ${http}`);
            const c=audit.counts, i=audit.integrity;
            if(i.duplicateReferenceGroups||i.invalidIdentities||i.emptyCanonicalRows||i.invalidOfficialUrls) throw new Error("OECD final integrity gate failed");
            if(c.oecdAlerts!==c.oecdUniqueReferences||c.oecdAlerts!==c.oecdVersions||c.oecdAlerts!==c.oecdVersionCountSum) throw new Error("OECD final version gate failed");
            console.log(JSON.stringify(audit));
          ' "${audit_code}" "${audit_file}"
