name: COST-F1 one-shot Workers Builds quota and triggers (GET only)
on:
  push:
    branches: [cost-f1/builds-quota-readonly-20261010]
    paths: [.github/workflows/cost-f1-builds-quota-readonly-once.yml]
permissions:
  contents: read
concurrency:
  group: vigia-cost-f1-builds-quota-20261010
  cancel-in-progress: false
jobs:
  limits:
    if: github.repository == 'cgam-coder/vigia-aesan-feed' && github.actor == 'cgam-coder'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read only authorized Cloudflare Builds quota and branch controls
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CF_TOKEN;
          const root='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f';
          const print=(kind,body)=>console.log('V20_COST_READ '+JSON.stringify({kind,...body}));
          if(!token){print('token',{present:false,status:'HOLD'});process.exitCode=1;process.exit();}
          function safeMetrics(obj,depth=0){
            if(depth>3||obj===null||typeof obj!=='object')return {};
            const out={};
            for(const [k,v] of Object.entries(obj).slice(0,35)){
              if(!/^[A-Za-z_][A-Za-z_0-9]{0,60}$/.test(k))continue;
              if(typeof v==='number'&&Number.isFinite(v))out[k]=v;
              else if(typeof v==='boolean')out[k]=v;
              else if(typeof v==='string'&&/^\d{1,12}(?:\.\d{1,4})?$/.test(v))out[k]=Number(v);
              else if(v&&typeof v==='object'&&!Array.isArray(v))out[k]=safeMetrics(v,depth+1);
            }return out;
          }
          async function get(path){
            try{
              const resp=await fetch(root+path,{method:'GET',redirect:'error',
                headers:{Authorization:'Bearer '+token,Accept:'application/json'},
                signal:AbortSignal.timeout(14000)});
              const body=await resp.json().catch(()=>null);
              return {http:resp.status,success:resp.ok&&body?.success===true,
                error_codes:Array.isArray(body?.errors)?body.errors.map(x=>x?.code).filter(Number.isInteger).slice(0,5):[],
                result:resp.ok&&body?.success===true?body.result:null};
            }catch{return {http:0,success:false,error_codes:[],result:null};}
          }
          const limits=await get('/builds/account/limits');
          print('build_minute_limits',{http:limits.http,success:limits.success,error_codes:limits.error_codes,
            values:safeMetrics(limits.result)});
          const scripts=await get('/workers/scripts');
          print('worker_discovery',{http:scripts.http,success:scripts.success,
            runtime_found:Array.isArray(scripts.result)&&scripts.result.some(x=>x.id==='vigia-runtime'),
            error_codes:scripts.error_codes});
          const tag=Array.isArray(scripts.result)?scripts.result.find(x=>x.id==='vigia-runtime')?.tag:null;
          if(tag&&/^[a-z0-9-]{16,48}$/i.test(tag)){
            const triggers=await get('/builds/workers/'+encodeURIComponent(tag)+'/triggers');
            const list=Array.isArray(triggers.result)?triggers.result:
              Array.isArray(triggers.result?.triggers)?triggers.result.triggers:[];
            print('branch_controls',{http:triggers.http,success:triggers.success,error_codes:triggers.error_codes,
              count:list.length,items:list.slice(0,3).map(t=>({
                branches_include:(Array.isArray(t.branch_includes)?t.branch_includes:[]).filter(v=>typeof v==='string'&&v.length<90).slice(0,6),
                branches_exclude:(Array.isArray(t.branch_excludes)?t.branch_excludes:[]).filter(v=>typeof v==='string'&&v.length<90).slice(0,6),
                paths_include_count:Array.isArray(t.path_includes)?t.path_includes.length:null,
                paths_exclude_count:Array.isArray(t.path_excludes)?t.path_excludes.length:null,
                has_build_command:typeof t.build_command==='string',has_deploy_command:typeof t.deploy_command==='string'
              }))});
          }else print('branch_controls',{status:'HOLD',reason:'runtime_tag_unavailable'});
          NODE
