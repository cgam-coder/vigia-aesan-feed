name: RAPNA-MEDIA-F1 single actual response CORS check
on:
  push:
    branches: [sec-f1/cloudflare-api-readonly-20261009]
    paths: [.github/workflows/rapna-media-cors-once.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: One official public image response CORS headers only, no file persistence
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const target='https://servicios.consumo.gob.es/rapnaBEPublic/listadoPublico/fichero';
          const body={document:'159_2026_Fotografía_web.jpg',notificacion:84341,type:'IMG',fichaWeb:true};
          const log=(x)=>console.log('RAPNA_MEDIA_CORS_ACTUAL '+JSON.stringify(x));
          const started=Date.now();
          try{
            const res=await fetch(target,{method:'POST',redirect:'error',
              headers:{Origin:'https://nagamealert.com',Accept:'application/json','Content-Type':'application/json'},
              body:JSON.stringify(body),signal:AbortSignal.timeout(12000)
            });
            const origin=res.headers.get('access-control-allow-origin')||'';
            const vary=res.headers.get('vary')||'';
            const allowCredentials=res.headers.get('access-control-allow-credentials')||'';
            const ok=res.ok&&(origin==='*'||origin==='https://nagamealert.com') &&
              /^application\/json(?:\s*;|$)/i.test(res.headers.get('content-type')||'');
            await res.body?.cancel().catch(()=>{});
            log({http:res.status,cors_origin_allowed:origin==='*'||origin==='https://nagamealert.com',
              response_json_media_type:/^application\/json(?:\s*;|$)/i.test(res.headers.get('content-type')||''),
              vary_contains_origin:vary.toLowerCase().includes('origin'),
              credentials_required:allowCredentials.toLowerCase()==='true',
              browser_cors_response_eligible:ok,elapsed_ms:Date.now()-started,
              response_body_discarded:true,media_not_stored:true
            });
          }catch(e){log({outcome:'transport_error',error_name:e?.name??'Error',elapsed_ms:Date.now()-started});}
          NODE
