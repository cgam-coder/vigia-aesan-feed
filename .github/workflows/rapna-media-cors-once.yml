name: RAPNA-MEDIA-F1 single CORS preflight
on:
  push:
    branches: [sec-f1/cloudflare-api-readonly-20261009]
    paths: [.github/workflows/rapna-media-cors-once.yml]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Official read-only CORS OPTIONS probe, no image download
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const endpoint='https://servicios.consumo.gob.es/rapnaBEPublic/listadoPublico/fichero';
          const started=Date.now();
          const output=(obj)=>console.log('RAPNA_CORS_PREFLIGHT '+JSON.stringify(obj));
          try {
            const response=await fetch(endpoint,{method:'OPTIONS',redirect:'error',
              headers:{
                'Origin':'https://nagamealert.com',
                'Access-Control-Request-Method':'POST',
                'Access-Control-Request-Headers':'content-type',
              },
              signal:AbortSignal.timeout(12000)
            });
            const allowOrigin=response.headers.get('access-control-allow-origin')??'';
            const allowed=response.headers.get('access-control-allow-methods')??'';
            const headers=response.headers.get('access-control-allow-headers')??'';
            const success=(allowOrigin==='*'||allowOrigin==='https://nagamealert.com') &&
              allowed.toUpperCase().split(/[ ,]+/).includes('POST') &&
              (headers==='*'||headers.toLowerCase().split(/[ ,]+/).includes('content-type')) &&
              response.status>=200&&response.status<300;
            output({http:response.status,elapsed_ms:Date.now()-started,
              origin_allowed:allowOrigin==='*'||allowOrigin==='https://nagamealert.com',
              allowed_methods_include_post:allowed.toUpperCase().split(/[ ,]+/).includes('POST'),
              allowed_headers_include_content_type:headers==='*'||headers.toLowerCase().split(/[ ,]+/).includes('content-type'),
              browser_cross_origin_post_preflight_supported:success,
              response_body_ignored:true});
          }catch(e){output({outcome:'transport_error',error_type:e?.name??'Error',elapsed_ms:Date.now()-started});}
          NODE
