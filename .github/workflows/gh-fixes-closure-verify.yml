name: GH fixes closure read-only verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gh-fixes-closure-verify.yml"
      - "scripts/gh-fixes-closure-verify.mjs"
      - "scripts/closure-evidence-runtime.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gh-fixes-closure-read-only-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VIGIA_BASE_URL: https://vigia-alertas.csar68.chatgpt.site
      VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Audit every source with a total deadline and phased evidence
        run: |
          set -euo pipefail
          test -n "$VIGIA_SYNC_TOKEN"
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import { createDeadline, createEvidenceJournal } from "./scripts/closure-evidence-runtime.mjs";
          import { validateClosureEvidence } from "./scripts/gh-fixes-closure-verify.mjs";

          const base=process.env.VIGIA_BASE_URL;
          const headers={Authorization:`Bearer ${process.env.VIGIA_SYNC_TOKEN}`,"Content-Type":"application/json"};
          const routes={AESAN:"aesan",RAPNA:"rapna",RASFF:"rasff","SAFETY GATE":"safety-gate",OECD:"oecd"};
          const budget=createDeadline({totalMs:24*60_000});
          const evidencePath=path.join(process.env.RUNNER_TEMP,"gh-fixes-closure-read-only-evidence.json");
          const journal=createEvidenceJournal({path:evidencePath,writeFileSync:fs.writeFileSync});
          const call=async(pathname,method="GET",allowed=[200])=>{
            const timeout=budget.timeout(120_000,`${method} ${pathname}`);
            const response=await fetch(base+pathname,{method,headers,redirect:"follow",signal:AbortSignal.timeout(timeout)});
            const raw=await response.text();
            let body;
            try{body=JSON.parse(raw)}catch{throw new Error(`${method} ${pathname} returned non-JSON HTTP ${response.status}`)}
            if(!allowed.includes(response.status))throw new Error(`${method} ${pathname} failed HTTP ${response.status}: ${raw.slice(0,600)}`);
            return {http:response.status,body};
          };
          const observeAll=async()=>Object.fromEntries(await Promise.all(Object.entries(routes).map(async([source,route])=>
            [source,(await call(`/api/${route}/sync?observe=1`)).body])));
          const activeLease=(observe)=>observe?.lease&&Number.isFinite(Date.parse(observe.lease.expiresAt))&&
            Date.parse(observe.lease.expiresAt)>Date.now();
          const compatibleMaintenance=(source,observe)=>activeLease(observe)&&(
            source==="RASFF"&&observe.lease?.mode==="reconcile"||
            source==="OECD"&&observe.lease?.mode==="historical-reconcile");

          try {
            let observes;
            for(let attempt=0;attempt<20;attempt+=1){
              observes=await observeAll();
              const active=Object.entries(observes).filter(([source,value])=>
                activeLease(value)&&!compatibleMaintenance(source,value)).map(([source])=>source);
              if(!active.length)break;
              if(attempt===19)throw new Error(`Control plane did not become compatible: ${active.join(",")}`);
              console.log(`WAIT_ACTIVE_LEASES ${active.join(",")}`);
              await budget.pause(15_000,"waiting for incompatible leases");
            }
            journal.record("observes",{observes});

            const audits=Object.fromEntries(await Promise.all(Object.entries(routes).filter(([source])=>source!=="AESAN")
              .map(async([source,route])=>[source,(await call(`/api/${route}/sync?audit=1`)).body.audit])));
            journal.record("audits",{audits});

            const aesanPreview=(await call("/api/aesan/sync?mode=preview-publication-identity&reference=ES2026%2F517","POST")).body;
            journal.record("aesan-preview",{aesanPreview});

            let rasffPreview;
            for(let attempt=1;attempt<=180;attempt+=1){
              const observed=(await call("/api/rasff/sync?observe=1")).body;
              if(!activeLease(observed)){
                const result=await call("/api/rasff/sync?mode=preview-version-counts","POST",[200,409]);
                if(result.http===200){rasffPreview=result.body;break}
                if(result.body?.error!=="RASFF version-count repair aborted: active or invalid sync lease")
                  throw new Error(`RASFF preview failed HTTP 409: ${JSON.stringify(result.body).slice(0,600)}`);
              } else if(!compatibleMaintenance("RASFF",observed)) {
                throw new Error("RASFF preview blocked by an incompatible active lease");
              }
              if(attempt===180)throw new Error("RASFF preview could not acquire a bounded idle interval");
              await budget.pause(1_000,"waiting for RASFF preview");
            }
            journal.record("rasff-preview",{rasffPreview});

            const freshnessAudit=await call("/api/freshness?audit=1","POST",[200,503]);
            journal.record("freshness-audit",{freshnessAudit:freshnessAudit.body,freshnessAuditHttp:freshnessAudit.http});
            const freshnessObserve=(await call("/api/freshness?observe=1")).body;
            const evidence=journal.record("complete",{freshnessObserve});
            const summary=validateClosureEvidence(evidence);
            journal.record("validated",{summary});
            console.log("STRICT_CLOSURE_VALIDATION "+JSON.stringify(summary));
          } catch(error) {
            journal.fail(error);
            throw error;
          }
          NODE
      - name: Preserve read-only closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gh-fixes-closure-read-only-evidence
          path: ${{ runner.temp }}/gh-fixes-closure-read-only-evidence.json
          if-no-files-found: error
          retention-days: 14
