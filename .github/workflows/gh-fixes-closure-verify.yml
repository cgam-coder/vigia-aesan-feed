name: GH fixes closure read-only verification

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gh-fixes-closure-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gh-fixes-closure-read-only-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VIGIA_BASE_URL: https://vigia-alertas.csar68.chatgpt.site
      VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
    steps:
      - name: Check out verifier module
        uses: actions/checkout@v4
      - name: Wait for idle control plane and audit every source
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VIGIA_SYNC_TOKEN"
          node --input-type=module - <<'NODE'
          import fs from "node:fs";
          import path from "node:path";
          import { validateClosureEvidence } from "./scripts/gh-fixes-closure-verify.mjs";

          const base=process.env.VIGIA_BASE_URL;
          const headers={Authorization:`Bearer ${process.env.VIGIA_SYNC_TOKEN}`,"Content-Type":"application/json"};
          const routes={AESAN:"aesan",RAPNA:"rapna",RASFF:"rasff","SAFETY GATE":"safety-gate",OECD:"oecd"};
          const REQUEST_TIMEOUT_MS=120_000, LEASE_WAIT_ATTEMPTS=20, LEASE_WAIT_MS=15_000;
          const call=async(pathname,method="GET",allowed=[200])=>{
            const response=await fetch(base+pathname,{method,headers,redirect:"follow",signal:AbortSignal.timeout(REQUEST_TIMEOUT_MS)});
            const raw=await response.text();
            let body;
            try{body=JSON.parse(raw)}catch{throw new Error(`${method} ${pathname} returned non-JSON HTTP ${response.status}`)}
            if(!allowed.includes(response.status))throw new Error(`${method} ${pathname} failed HTTP ${response.status}: ${raw.slice(0,600)}`);
            return {http:response.status,body};
          };
          const observeAll=async()=>Object.fromEntries(await Promise.all(Object.entries(routes).map(async([source,route])=>
            [source,(await call(`/api/${route}/sync?observe=1`)).body])));
          const activeLease=(observe)=>observe?.lease&&Number.isFinite(Date.parse(observe.lease.expiresAt))&&Date.parse(observe.lease.expiresAt)>Date.now();
          const compatibleRasffReconcile=(source,observe)=>source==="RASFF"&&activeLease(observe)&&
            observe.lease?.source==="RASFF"&&observe.lease?.mode==="reconcile"&&
            observe.reconcile?.mode==="reconcile"&&["running","partial"].includes(observe.reconcile.status)&&
            Number.isFinite(Date.parse(observe.reconcile.completedAt));

          let observes;
          for(let attempt=0;attempt<LEASE_WAIT_ATTEMPTS;attempt+=1){
            observes=await observeAll();
            const active=Object.entries(observes).filter(([source,value])=>source!=="OECD"&&activeLease(value)&&
              !compatibleRasffReconcile(source,value)).map(([source])=>source);
            if(!active.length)break;
            if(attempt===LEASE_WAIT_ATTEMPTS-1)throw new Error(`Control plane did not become idle: ${active.join(",")}`);
            console.log(`WAIT_ACTIVE_LEASES ${active.join(",")}`);
            await new Promise(resolve=>setTimeout(resolve,LEASE_WAIT_MS));
          }
          const compatibleLeases=Object.entries(observes).filter(([source,value])=>
            compatibleRasffReconcile(source,value)).map(([source])=>source);
          if(compatibleLeases.length)console.log(`OBSERVE_COMPATIBLE_LEASES ${compatibleLeases.join(",")}`);

          const audits=Object.fromEntries(await Promise.all(Object.entries(routes).filter(([source])=>source!=="AESAN").map(async([source,route])=>
            [source,(await call(`/api/${route}/sync?audit=1`)).body.audit])));
          const aesanPreview=(await call("/api/aesan/sync?mode=preview-publication-identity&reference=ES2026%2F517","POST")).body;
          const rasffPreview=(await call("/api/rasff/sync?mode=preview-version-counts","POST")).body;
          const freshnessAudit=await call("/api/freshness?audit=1","POST",[200,503]);
          const freshnessObserve=(await call("/api/freshness?observe=1")).body;
          const evidence={checkedAt:new Date().toISOString(),observes,audits,aesanPreview,rasffPreview,
            freshnessAudit:freshnessAudit.body,freshnessAuditHttp:freshnessAudit.http,freshnessObserve};
          const evidencePath=path.join(process.env.RUNNER_TEMP,"gh-fixes-closure-read-only-evidence.json");
          fs.writeFileSync(evidencePath,JSON.stringify(evidence,null,2));
          const summary=validateClosureEvidence(evidence);
          console.log("AESAN_IDEMPOTENCE "+JSON.stringify({status:aesanPreview.status,repaired:aesanPreview.repaired,
            reference:aesanPreview.reference,versionCount:aesanPreview.versionCount}));
          console.log("RASFF_IDEMPOTENCE "+JSON.stringify({remaining:rasffPreview.remaining,repaired:rasffPreview.repaired}));
          console.log("OECD_OBSERVE "+JSON.stringify({recent:observes.OECD?.recent,historicalReconcile:observes.OECD?.historicalReconcile,
            activeLease:activeLease(observes.OECD)}));
          console.log("SOURCE_INTEGRITY "+JSON.stringify({
            oecdOfficialDataCharacteristics:{sentinelPublishedDates:audits.OECD?.integrity?.sentinelPublishedDates,
              missingPublishedAt:audits.OECD?.integrity?.missingPublishedAt,
              unclassifiedDomains:audits.OECD?.integrity?.unclassifiedDomains}}));
          console.log("FIVE_SOURCE_FRESHNESS "+JSON.stringify({http:freshnessAudit.http,allFresh:freshnessAudit.body.allFresh,
            states:freshnessAudit.body.states?.map(({source,status,lastSyncSuccessAt,revisionStatus,revisionLastSuccessAt,revisionProgress,revisionTotal,error})=>
              ({source,status,lastSyncSuccessAt,revisionStatus,revisionLastSuccessAt,revisionProgress,revisionTotal,error}))}));
          console.log("STRICT_CLOSURE_VALIDATION "+JSON.stringify(summary));
          NODE
      - name: Preserve read-only closure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gh-fixes-closure-read-only-evidence
          path: ${{ runner.temp }}/gh-fixes-closure-read-only-evidence.json
          if-no-files-found: warn
          retention-days: 14
