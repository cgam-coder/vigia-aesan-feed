name: V24 RAPNA current unexpected UNKNOWN forensic once
on:
  push:
    branches: [audit/v24-issue291-forensic-20261012]
    paths: [.github/workflows/v24-issue291-rapna-current-once.yml]
permissions: {contents: read}
jobs:
  inspect:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read controller RAPNA current receipt and checkpoint only
        env:
          T: ${{ secrets.VIGIA_SYNC_TOKEN }}
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const out=(stage,data)=>console.log('V24_RAPNA_CURRENT '+JSON.stringify({stage,...data}));
          const root='https://vigia-runtime.c-gamiz93.workers.dev';
          const A='9c1807c68493f14259248b5f5782cc6f',D='55596003-1b90-4f66-aad8-decb21205f13',endpoint='https://api.cloudflare.com/client/v4/accounts/'+A+'/d1/database/'+D+'/query';
          const T=process.env.T,CF=process.env.CF;
          if(!T||!CF){out('HOLD',{reason:'no-existing-token'});process.exit(2);}
          let queries=0,readRows=0;const request=async(url,tok,sql,params=[])=>{
            if(url!==root+'/api/source-reliability?observe=1'&&url!==endpoint)throw Error('url-not-allowed');
            if(sql!==undefined&&(!/^SELECT\s/u.test(sql)||sql.includes(';')||/\b(DELETE|INSERT|UPDATE|DROP|ALTER|PRAGMA|CREATE|REPLACE)\b/iu.test(sql)||++queries>4))throw Error('sql-not-allowed');
            const r=await fetch(url,{method:sql?'POST':'GET',headers:{Authorization:'Bearer '+tok,Accept:'application/json',...(sql?{'Content-Type':'application/json'}:{})},...(sql?{body:JSON.stringify({sql,params})}:{}),redirect:'error',signal:AbortSignal.timeout(16000)});
            const j=await r.json().catch(()=>null);
            if(r.status!==200||j?.success===false)throw Error('api-unavailable-'+r.status);
            if(sql){const z=j?.result?.[0];if(!Array.isArray(z?.results)||z?.meta?.rows_written!==0)throw Error('query-invalid');readRows+=z.meta.rows_read||0;if(readRows>1500)throw Error('read-budget');return z.results;}return j;
          };
          try{
            const c=await request(root+'/api/source-reliability?observe=1',T);
            if(c.buildSha!=='d5fcd11cbeb563258b4bbdc9482a80b8684c81d3'||c.mode!=='five-source-coordinated')throw Error('baseline-changed');
            const p=c.state?.revisionAttempts?.['RAPNA:current-parity'];
            out('control',{shaOK:true,at:c.observedAt,coordinatorLease:c.activeLease,epoch:c.epoch,
              job:p?{id:p.id,startedAt:p.startedAt,outcome:p.outcome,retryBlocked:String(p.nextEligibleAt||'').startsWith('9999'),
                nextEligibleAt:p.nextEligibleAt??null,pending:(p.pendingDetails||[]).length,
                reasonClass:/D1_ERROR|Network connection lost/iu.test(p.reason||'')?'D1_NETWORK':/PERSISTENCE_OUTCOME_UNKNOWN/iu.test(p.reason||'')?'PERSISTENCE_UNKNOWN':p.reason?.slice(0,160)??null}:null});
            if(!p?.id){out('verdict',{state:'HOLD_NO_CURRENT_ATTEMPT',queries:0});process.exit(2);}
            const id=p.id;
            const job=await request(endpoint,CF,"SELECT id,source,mode,kind,epoch,phase,started_at,finished_at,write_intent_at,json_extract(receipt_json,'$.outcome') AS outcome,json_extract(receipt_json,'$.reason') AS reason,json_extract(receipt_json,'$.requests') AS requests FROM source_reliability_jobs WHERE id=? LIMIT 1",[id]);
            out('job',{rows:job.map(x=>({...x,reasonClass:/D1_ERROR|Network connection lost/iu.test(x.reason||'')?'D1_NETWORK':/PERSISTENCE_OUTCOME_UNKNOWN/iu.test(x.reason||'')?'PERSISTENCE_UNKNOWN':x.reason?.slice(0,150)??null,reason:undefined}))});
            const effects=await request(endpoint,CF,"SELECT COUNT(*) AS markers,MIN(ordinal) AS first_ordinal,MAX(ordinal) AS last_ordinal,SUM(CASE WHEN committed_at IS NULL OR result_json IS NULL THEN 1 ELSE 0 END) AS pending FROM source_reliability_effects WHERE job_id=?",[id]);
            out('effects',{rows:effects});
            const state=await request(endpoint,CF,"SELECT source,mode,status,cursor,cursor_key,plan_version,total_units,coverage,completed_at,last_error,updated_at FROM source_sync_state WHERE source='RAPNA' AND mode='current-parity' LIMIT 1");
            out('state',{rows:state});
            const cert=await request(endpoint,CF,"SELECT source,mode,cycle_id,completed_at,total_units,audit_status,coverage FROM source_revision_certifications WHERE source='RAPNA' AND mode='current-parity' LIMIT 1");
            out('certificate',{rows:cert});
            out('verdict',{state:'PASS_READ_ONLY_OBSERVATION',queries,readRows,rowsWritten:0,sourceJobs:0,deployedChanges:0,recoveryWrites:0});
          }catch(e){out('verdict',{state:'HOLD',reason:e instanceof Error?e.message:'unknown',queries,readRows});process.exitCode=1;}
          NODE
