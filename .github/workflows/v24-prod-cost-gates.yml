name: V24 production read-only gates once
on:
  push:
    branches: [audit/v24-prod-cost-gates-20261012]
    paths: [.github/workflows/v24-prod-cost-gates.yml]
permissions:
  contents: read
jobs:
  observe:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Bounded GET-only production observation
        env:
          VIGIA_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const emit=(stage,x)=>console.log('V24_PROD_GATES '+JSON.stringify({stage,...x}));
          const sync=process.env.VIGIA_TOKEN,cf=process.env.CLOUDFLARE_TOKEN;
          if(!sync||!cf){emit('verdict',{status:'HOLD_MISSING_EXISTING_SECRET',requests:0});process.exit(2);}
          const origin='https://vigia-runtime.c-gamiz93.workers.dev';
          const api='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f';
          const approved=new Set([
            origin+'/api/source-reliability?observe=1',
            origin+'/api/freshness?observe=1',
            origin+'/api/safety-gate/sync?observe=1',
            api+'/workers/scripts/vigia-runtime/deployments',
            api+'/workers/scripts/vigia-source-runner/deployments',
            api+'/workers/scripts/vigia-source-runner/settings',
            api+'/workers/scripts/vigia-runtime/schedules',
            api+'/workers/scripts/vigia-source-runner/schedules',
          ]);
          let requests=0;
          const get=async (url,token)=>{
            if(!approved.has(url)||++requests>8)throw Error('GET-budget-or-allowlist');
            try{const r=await fetch(url,{method:'GET',headers:{Authorization:'Bearer '+token,Accept:'application/json'},redirect:'error',signal:AbortSignal.timeout(15000)});const text=await r.text();let j=null;if(text.length<1200000)try{j=JSON.parse(text)}catch{}return {http:r.status,j};}
            catch(e){return{http:0,j:null,error:e instanceof Error?e.name:'unknown'};}
          };
          const tasks=[
            ['coordinator',origin+'/api/source-reliability?observe=1',sync],
            ['freshness',origin+'/api/freshness?observe=1',sync],
            ['safety',origin+'/api/safety-gate/sync?observe=1',sync],
            ['runtimeDeploy',api+'/workers/scripts/vigia-runtime/deployments',cf],
            ['runnerDeploy',api+'/workers/scripts/vigia-source-runner/deployments',cf],
            ['runnerSettings',api+'/workers/scripts/vigia-source-runner/settings',cf],
            ['runtimeSchedule',api+'/workers/scripts/vigia-runtime/schedules',cf],
            ['runnerSchedule',api+'/workers/scripts/vigia-source-runner/schedules',cf]
          ];
          const pairs=await Promise.all(tasks.map(async([key,url,token])=>[key,await get(url,token)]));
          const x=Object.fromEntries(pairs),owner=x.coordinator.j||{},states=x.freshness.j?.states||[];
          const names=['AESAN','RAPNA','RASFF','SAFETY GATE','OECD'];
          const sourceStatus=names.map(name=>{
            const s=states.find(y=>y.source===name)||{};
            const last=s.lastSyncSuccessAt?Date.parse(s.lastSyncSuccessAt):NaN;
            const age=Number.isFinite(last)?Math.round((Date.now()-last)/60000*10)/10:null;
            return {name,observed:s.status??'unavailable',syncAgeMinutes:age,parity:s.latestIdentityParity===true,
              missing:(s.missingOfficialIdentities||[]).length,revisionMismatches:(s.revisionMismatches||[]).length,
              history:s.revisionStatus??null};
          });
          const deploy=d=>d?.j?.result?.deployments?.[0]?.versions?.find(v=>v.percentage===100)?.version_id??null;
          const runtimeVersion=deploy(x.runtimeDeploy),runnerVersion=deploy(x.runnerDeploy);
          const vars=x.runnerSettings.j?.result?.settings?.bindings||x.runnerSettings.j?.result?.bindings||[];
          const hybridFlagAbsent=!vars.some(v=>v.name==='SAFETY_GATE_RECENT_STRATEGY');
          const runnerMode=vars.find(v=>v.name==='SOURCE_RUNNER_MODE');
          const crons=o=>{const r=o.j?.result;return Array.isArray(r?.schedules)?r.schedules.map(y=>y.cron):Array.isArray(r)?r.map(y=>y.cron):[];};
          const failures=Object.entries(owner.state?.revisionAttempts||{}).filter(([k,v])=>['RAPNA:legacy-reconcile','RASFF:reconcile','OECD:historical-reconcile'].includes(k)).map(([key,v])=>({key,outcome:v?.outcome??null,blocked:String(v?.nextEligibleAt||'').startsWith('9999')}));
          const sg=x.safety.j?.recent||{};
          const endpointsOK=pairs.every(([,v])=>v.http===200)&&sourceStatus.every(v=>v.observed!=='unavailable');
          emit('control',{http:Object.fromEntries(pairs.map(([k,v])=>[k,v.http])),workerShaMatches:owner.buildSha==='d5fcd11cbeb563258b4bbdc9482a80b8684c81d3',
            coordMode:owner.mode,coordinatorLease:owner.activeLease??null,runnerVersion:runnerVersion?.slice(0,12)||null,
            runtimeVersion:runtimeVersion?.slice(0,12)||null,runnerMode:runnerMode?.type==='plain_text'?runnerMode?.text:null,
            hybridFlagAbsent,runtimeCron:crons(x.runtimeSchedule),runnerCron:crons(x.runnerSchedule)});
          emit('sources',{sourceStatus,historicalHolds:failures,safetyRecentStatus:sg.status??null,
            safetyRecentLastError:sg.lastError?String(sg.lastError).slice(0,80):null,safetyLastSuccessAgeMinutes:sg.lastSuccessAt?Math.round((Date.now()-Date.parse(sg.lastSuccessAt))/60000*10)/10:null,
            allFiveHistoricallyCertified:owner.officialParityCertified===true});
          emit('verdict',{status:endpointsOK?'PASS_READ_ONLY_OBSERVATION':'HOLD_UNAVAILABLE_API',
            requests,d1Writes:0,sourceJobs:0,deploys:0,cloudflareMutations:0,featureActivations:0,historicalRecovery:0});
          if(!endpointsOK)process.exitCode=1;
          NODE
