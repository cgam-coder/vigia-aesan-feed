name: VIGIA RASFF complete backfill

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rasff-backfill-once.yml"

permissions:
  contents: read

concurrency:
  group: vigia-rasff-controlled-activation
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      VIGIA_BASE_URL: https://vigia-alertas.csar68.chatgpt.site
      VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
    steps:
      - name: Complete and continuously certify RASFF backfill
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VIGIA_SYNC_TOKEN"
          node <<'NODE'
          const base = process.env.VIGIA_BASE_URL;
          const token = process.env.VIGIA_SYNC_TOKEN;
          const headers = { Authorization:`Bearer ${token}` };
          const MAX_BATCHES = 850;
          const BATCH_SIZE = 40;

          const call = async (path, method = "GET") => {
            let lastError;
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                const response = await fetch(base + path, {
                  method, headers, redirect:"follow", signal:AbortSignal.timeout(600_000),
                });
                const text = await response.text();
                let body;
                try { body = JSON.parse(text); }
                catch { throw new Error(`${method} ${path} returned non-JSON HTTP ${response.status}: ${text.slice(0, 240)}`); }
                if (response.status === 200) return body;
                if (response.status < 500) throw new Error(`${method} ${path} failed HTTP ${response.status}: ${text.slice(0, 500)}`);
                lastError = new Error(`${method} ${path} transient HTTP ${response.status}`);
              } catch (error) { lastError = error; }
              if (attempt < 3) await new Promise((resolve) => setTimeout(resolve, attempt * 3_000));
            }
            throw lastError;
          };

          const sourceCounts = (audit) => ({
            AESAN:audit.counts.aesanAlerts,
            RAPNA:audit.counts.rapnaAlerts,
            "SAFETY GATE":audit.counts.safetyGateAlerts,
            OECD:audit.counts.oecdAlerts,
          });
          const assertIntegrity = (audit, label) => {
            const anomalies = Object.entries(audit.integrity).filter(([, value]) => value !== 0);
            if (anomalies.length) throw new Error(`${label} integrity anomalies: ${JSON.stringify(anomalies)}`);
            const domains = audit.productDomains;
            if (domains.humanFood + domains.animalFeed + domains.nonFood + domains.unknown !== audit.counts.rasffAlerts ||
                domains.missingOrStaleDimensionState !== 0)
              throw new Error(`${label} product-domain balance failed`);
            const geography = audit.geography;
            if (geography.mappedRows + geography.unmappedRows !== geography.rows ||
                geography.originRows + geography.notifyingRows + geography.distributionRows + geography.affectedRows !== geography.rows ||
                geography.alertsWithGeography > audit.counts.rasffAlerts)
              throw new Error(`${label} geography balance failed`);
            const hazards = audit.hazards;
            if (hazards.mappedRows + hazards.unmappedRows + hazards.unknownRows !== hazards.rows ||
                hazards.alertsWithHazards > audit.counts.rasffAlerts)
              throw new Error(`${label} hazard balance failed`);
          };
          const assertOtherSources = (baseline, audit, label) => {
            const current = sourceCounts(audit);
            for (const source of Object.keys(baseline)) {
              if (baseline[source] !== current[source]) {
                throw new Error(`${label}: ${source} changed from ${baseline[source]} to ${current[source]}`);
              }
            }
          };
          const compact = (state) => ({
            status:state.status, cursor:state.cursor, cursorKey:state.cursorKey,
            totalUnits:state.totalUnits, pagesScanned:state.pagesScanned,
            recordsObserved:state.recordsObserved, recordsPersisted:state.recordsPersisted,
            newCount:state.newCount, updatedCount:state.updatedCount,
            detailFailures:state.detailFailures, pageErrors:state.pageErrors,
            coverage:state.coverage, lastError:state.lastError,
            leaseOwnerId:state.leaseOwnerId, leaseMode:state.leaseMode,
            leaseExpiresAt:state.leaseExpiresAt,
          });

          const initialAudit = (await call("/api/rasff/sync?audit=1")).audit;
          const initialObserve = await call("/api/rasff/sync?observe=1");
          assertIntegrity(initialAudit, "initial");
          if (initialObserve.lease !== null) throw new Error("RASFF lease is active before backfill");
          if (!initialObserve.backfill || initialObserve.backfill.status !== "failed" ||
              initialObserve.backfill.cursor !== 1675 || initialObserve.backfill.cursorKey !== "2020.2422" ||
              initialObserve.backfill.recordsObserved !== 1675 || initialObserve.backfill.recordsPersisted !== 1360 ||
              initialObserve.backfill.detailFailures !== 0 || initialObserve.backfill.pageErrors !== 3)
            throw new Error(`Unexpected exact resume state: ${JSON.stringify(initialObserve.backfill)}`);
          const baselineSources = sourceCounts(initialAudit);
          const historicalPageErrors = initialObserve.backfill.pageErrors;
          console.log("BACKFILL_INITIAL_AUDIT " + JSON.stringify(initialAudit));
          console.log("BACKFILL_INITIAL_OBSERVE " + JSON.stringify(initialObserve));

          let priorCursor = initialObserve.backfill?.cursor ?? -1;
          let priorObserved = initialObserve.backfill?.recordsObserved ?? 0;
          let finalState = initialObserve.backfill?.status === "completed" ? initialObserve.backfill : null;
          for (let batch = 1; !finalState && batch <= MAX_BATCHES; batch++) {
            const body = await call(`/api/rasff/sync?mode=backfill&batchSize=${BATCH_SIZE}`, "POST");
            const state = body.state;
            if (!state || state.source !== "RASFF" || state.mode !== "backfill" ||
                !["partial", "completed"].includes(state.status)) throw new Error(`Batch ${batch} invalid state`);
            if (state.detailFailures !== 0 || state.pageErrors !== historicalPageErrors || state.lastError !== null)
              throw new Error(`Batch ${batch} reported ingestion errors: ${JSON.stringify(compact(state))}`);
            if (state.leaseOwnerId !== null || state.leaseMode !== null || state.leaseExpiresAt !== null)
              throw new Error(`Batch ${batch} response retained lease state`);
            if ((state.status !== "completed" && state.cursor <= priorCursor) || state.recordsObserved < priorObserved)
              throw new Error(`Batch ${batch} cursor/counter did not advance consistently`);

            const observed = await call("/api/rasff/sync?observe=1");
            if (observed.lease !== null || !observed.backfill)
              throw new Error(`Batch ${batch} observe reported an active/missing lease`);
            for (const key of ["status", "cursor", "cursorKey", "recordsObserved", "recordsPersisted",
              "newCount", "updatedCount", "detailFailures", "pageErrors", "coverage"]) {
              if (observed.backfill[key] !== state[key])
                throw new Error(`Batch ${batch} observe drift at ${key}`);
            }

            console.log("BACKFILL_BATCH " + JSON.stringify({ batch, ...compact(state), lease:observed.lease }));
            priorCursor = state.cursor;
            priorObserved = state.recordsObserved;
            if (state.status === "completed") finalState = state;

            if (batch % 25 === 0 || state.status === "completed") {
              const audit = (await call("/api/rasff/sync?audit=1")).audit;
              assertIntegrity(audit, `batch-${batch}`);
              assertOtherSources(baselineSources, audit, `batch-${batch}`);
              if (audit.counts.rasffAlerts > state.recordsObserved)
                throw new Error(`Batch ${batch} audit exceeds observed official records`);
              console.log("BACKFILL_AUDIT " + JSON.stringify({ batch, audit }));
            }
            if (state.status === "completed") break;
          }

          if (!finalState || finalState.status !== "completed" || finalState.coverage !== "official-index-complete" ||
              finalState.cursor !== 0 || finalState.cursorKey !== null)
            throw new Error(`Backfill did not reach complete coverage within ${MAX_BATCHES} batches`);

          const officialPreview = (await call("/api/rasff/sync?mode=preview-reconcile&cursor=0&batchSize=40", "POST")).preview;
          const expectedOperational = officialPreview.totalElements - officialPreview.archiveSkippedCount;
          const finalAudit = (await call("/api/rasff/sync?audit=1")).audit;
          const finalObserve = await call("/api/rasff/sync?observe=1");
          assertIntegrity(finalAudit, "final");
          assertOtherSources(baselineSources, finalAudit, "final");
          if (finalObserve.lease !== null || finalObserve.backfill?.status !== "completed" ||
              finalObserve.backfill.coverage !== "official-index-complete")
            throw new Error("Final observe is not complete and lease-free");
          if (officialPreview.totalElements !== finalState.totalUnits ||
              finalAudit.counts.rasffAlerts !== expectedOperational ||
              finalAudit.counts.rasffUniqueReferences !== finalAudit.counts.rasffAlerts ||
              finalAudit.counts.rasffSourceIdentities !== finalAudit.counts.rasffAlerts ||
              finalAudit.counts.rasffVersions !== finalAudit.counts.rasffVersionCountSum)
            throw new Error("Final D1 corpus does not match the operational official universe");
          console.log("BACKFILL_FINAL_STATE " + JSON.stringify(finalState));
          console.log("BACKFILL_OFFICIAL_UNIVERSE " + JSON.stringify({
            totalElements:officialPreview.totalElements,
            archiveSkipped:officialPreview.archiveSkippedCount,
            expectedOperational,
          }));
          console.log("BACKFILL_FINAL_OBSERVE " + JSON.stringify(finalObserve));
          console.log("BACKFILL_FINAL_AUDIT " + JSON.stringify(finalAudit));
          NODE
