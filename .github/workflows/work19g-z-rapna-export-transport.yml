name: WORK19G-AA RAPNA dimension apply and export

on:
  push:
    branches:
      - work/19g-z-rapna-export-transport
    paths:
      - .github/workflows/work19g-z-rapna-export-transport.yml

permissions:
  contents: read

concurrency:
  group: work19g-aa-rapna-dimension-apply
  cancel-in-progress: false

jobs:
  apply-and-export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Verify existing sync token
        env:
          VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
        run: |
          if [ -z "${VIGIA_SYNC_TOKEN}" ]; then
            exit 1
          fi
          echo "VIGIA_SYNC_TOKEN available: yes"

      - name: Apply certified RAPNA rebuild in checkpointed batches
        env:
          VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
          VIGIA_RAPNA_APPLY_URL: https://vigia-alertas.csar68.chatgpt.site/api/admin/work19g-aa/rapna-dimension-apply
          VIGIA_RAPNA_EXPORT_URL: https://vigia-alertas.csar68.chatgpt.site/api/admin/work19g-y/rapna-export
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          apply_url = os.environ["VIGIA_RAPNA_APPLY_URL"]
          export_url = os.environ["VIGIA_RAPNA_EXPORT_URL"]
          token = os.environ["VIGIA_SYNC_TOKEN"]
          temporary = Path(os.environ["RUNNER_TEMP"])

          def curl_request(method, url, destination, max_time):
              result = subprocess.run([
                  "curl", "--silent", "--show-error", "--location",
                  "--request", method,
                  "--header", f"Authorization: Bearer {token}",
                  "--max-time", str(max_time),
                  "--output", str(destination),
                  "--write-out", "%{http_code}",
                  url,
              ], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, check=False)
              status = result.stdout.decode("ascii", errors="replace").strip()
              if result.returncode != 0 or status != "200":
                  print(json.dumps({
                      "curlExitCode": result.returncode,
                      "httpStatus": status or None,
                  }, sort_keys=True), file=sys.stderr)
                  raise SystemExit(1)
              try:
                  body = json.loads(destination.read_bytes())
              except json.JSONDecodeError as error:
                  raise RuntimeError("Authenticated endpoint did not return valid JSON") from error
              if not isinstance(body, dict):
                  raise RuntimeError("Authenticated endpoint returned an invalid object")
              return body

          def read_gate(ordinal, require_pre_apply=False):
              body = curl_request(
                  "GET", f"{export_url}?limit=1",
                  temporary / f"work19g-aa-gate-{ordinal:04d}.json", 120,
              )
              metadata = body.get("metadata")
              corpus = metadata.get("corpus") if isinstance(metadata, dict) else None
              operational = metadata.get("operational") if isinstance(metadata, dict) else None
              alerts = body.get("alerts")
              if body.get("source") != "RAPNA" or body.get("after") != "":
                  raise RuntimeError("RAPNA gate returned an unexpected source or cursor")
              if not isinstance(body.get("snapshotGuard"), str) or not body["snapshotGuard"]:
                  raise RuntimeError("RAPNA gate has no snapshot guard")
              if corpus != {"alerts": 2567, "alertVersions": 2568, "sumVersionCount": 2568}:
                  raise RuntimeError("RAPNA gate corpus no longer matches the certified baseline")
              if not isinstance(alerts, list) or len(alerts) != 1:
                  raise RuntimeError("RAPNA gate returned an unexpected alert count")
              if body.get("nextAfter") != alerts[0].get("id"):
                  raise RuntimeError("RAPNA gate returned an invalid next cursor")
              if not isinstance(operational, dict):
                  raise RuntimeError("RAPNA gate has invalid operational metadata")
              if operational.get("sourceSyncLease") is not None:
                  print(json.dumps({"status": "paused", "reason": "RAPNA source lease active"}, sort_keys=True))
                  raise SystemExit(78)
              if operational.get("rebuildLease") is not None:
                  raise RuntimeError("RAPNA rebuild lease is not clear")
              latest_sync = operational.get("latestSync")
              if not isinstance(latest_sync, dict) or latest_sync.get("source") != "RAPNA":
                  raise RuntimeError("RAPNA latest sync metadata is invalid")
              if latest_sync.get("status") != "completed" or latest_sync.get("completed_at") is None:
                  raise RuntimeError("Current-hour RAPNA sync is not completed")
              started_at = latest_sync.get("started_at")
              current_hour = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H")
              if not isinstance(started_at, str) or not started_at.startswith(current_hour):
                  raise RuntimeError("Current-hour RAPNA sync has not completed")
              if any(latest_sync.get(key) != 0 for key in ("records_persisted", "new_count", "updated_count")):
                  raise RuntimeError("Current-hour RAPNA sync changed the certified corpus")
              if require_pre_apply:
                  versions = metadata.get("mappingVersions")
                  if not isinstance(versions, list):
                      raise RuntimeError("RAPNA mapping metadata is invalid")
                  states = {
                      row.get("mapping_version"): row.get("row_count")
                      for row in versions
                      if isinstance(row, dict) and row.get("dimension_table") == "dimension_state"
                  }
                  if states != {"work18-v2": 2467, "work19g-j-v4": 100}:
                      raise RuntimeError("RAPNA pre-APPLY mapping state no longer matches certification")

          def require_safe_window():
              now = datetime.now(timezone.utc)
              next_schedule = now.replace(minute=23, second=0, microsecond=0)
              if next_schedule <= now:
                  next_schedule += timedelta(hours=1)
              seconds = (next_schedule - now).total_seconds()
              if seconds < 300:
                  print(json.dumps({
                      "status": "paused",
                      "reason": "RAPNA schedule window",
                      "secondsToNextSchedule": int(seconds),
                  }, sort_keys=True))
                  raise SystemExit(78)

          read_gate(0, require_pre_apply=True)
          totals = {
              "calls": 0, "scanned": 0, "candidateRelations": 0,
              "expectedWrites": 0, "mapped": 0, "unknown": 0,
              "unmapped": 0, "ambiguous": 0, "duplicates": 0, "mismatches": 0,
          }
          previous_next = None

          while True:
              require_safe_window()
              read_gate(totals["calls"] + 1)
              body = curl_request(
                  "POST", apply_url,
                  temporary / f"work19g-aa-apply-{totals['calls'] + 1:04d}.json", 240,
              )
              required = {
                  "mappingVersion", "checkpoint", "nextCheckpoint", "done", "scanned",
                  "candidateRelations", "expectedWrites", "mapped", "unknown", "unmapped",
                  "ambiguous", "duplicates", "mismatches", "errors",
              }
              if set(body) != required or body.get("mappingVersion") != "work19g-j-v4":
                  raise RuntimeError("RAPNA APPLY response contract mismatch")
              if not isinstance(body.get("errors"), list) or body["errors"]:
                  raise RuntimeError("RAPNA APPLY reported errors")
              if body.get("ambiguous") != 0 or body.get("duplicates") != 0:
                  raise RuntimeError("RAPNA APPLY reported ambiguous or duplicate relations")
              for key in ("scanned", "candidateRelations", "expectedWrites", "mapped", "unknown", "unmapped", "mismatches"):
                  if not isinstance(body.get(key), int) or body[key] < 0:
                      raise RuntimeError(f"RAPNA APPLY returned invalid {key}")
              if not isinstance(body.get("done"), bool):
                  raise RuntimeError("RAPNA APPLY returned invalid done state")
              if previous_next is not None and body.get("checkpoint") != previous_next:
                  raise RuntimeError("RAPNA APPLY checkpoint continuity failed")
              if not body["done"] and (
                  not isinstance(body.get("nextCheckpoint"), str)
                  or not body["nextCheckpoint"]
                  or body["nextCheckpoint"] == body.get("checkpoint")
              ):
                  raise RuntimeError("RAPNA APPLY checkpoint did not advance")

              totals["calls"] += 1
              for key in totals:
                  if key != "calls":
                      totals[key] += body[key]
              previous_next = body.get("nextCheckpoint")
              print(json.dumps({
                  "batch": totals["calls"], "scanned": body["scanned"],
                  "mismatches": body["mismatches"], "done": body["done"],
              }, sort_keys=True))
              if body["done"]:
                  break

          expected_totals = {
              "calls": 52, "scanned": 2567, "candidateRelations": 12019,
              "expectedWrites": 24354, "ambiguous": 0, "duplicates": 0,
              "mismatches": 2467,
          }
          for key, expected in expected_totals.items():
              if totals[key] != expected:
                  raise RuntimeError(f"RAPNA APPLY total {key} did not match certification")
          (temporary / "work19g-aa-apply-summary.json").write_text(
              json.dumps(totals, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "status": "apply-completed", "calls": totals["calls"],
              "scanned": totals["scanned"], "staleRematerialized": totals["mismatches"],
          }, sort_keys=True))
          PY

      - name: Export exact post-APPLY RAPNA production corpus
        env:
          VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
          VIGIA_RAPNA_EXPORT_URL: https://vigia-alertas.csar68.chatgpt.site/api/admin/work19g-y/rapna-export
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path
          from urllib.parse import quote

          output = Path("export")
          pages_dir = output / "pages"
          pages_dir.mkdir(parents=True, exist_ok=False)

          base_url = os.environ["VIGIA_RAPNA_EXPORT_URL"]
          token = os.environ["VIGIA_SYNC_TOKEN"]
          run_id = os.environ["GITHUB_RUN_ID"]
          apply_summary = json.loads((Path(os.environ["RUNNER_TEMP"]) / "work19g-aa-apply-summary.json").read_text())

          def curl_get(url, destination):
              result = subprocess.run([
                  "curl",
                  "--silent",
                  "--show-error",
                  "--location",
                  "--request", "GET",
                  "--header", f"Authorization: Bearer {token}",
                  "--max-time", "120",
                  "--output", str(destination),
                  "--write-out", "%{http_code}",
                  url,
              ], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, check=False)
              status = result.stdout.decode("ascii", errors="replace").strip()
              if result.returncode != 0 or status != "200":
                  print(json.dumps({
                      "curlExitCode": result.returncode,
                      "httpStatus": status or None,
                  }, sort_keys=True), file=sys.stderr)
                  raise SystemExit(1)
              return destination.read_bytes()

          gate_path = Path(os.environ["RUNNER_TEMP"]) / "work19g-z-rapna-export-gate.json"
          gate_raw = curl_get(f"{base_url}?limit=1", gate_path)
          try:
              gate = json.loads(gate_raw)
          except json.JSONDecodeError as error:
              raise RuntimeError("Authenticated curl gate did not return valid JSON") from error
          gate_metadata = gate.get("metadata")
          gate_corpus = gate_metadata.get("corpus") if isinstance(gate_metadata, dict) else None
          gate_alerts = gate.get("alerts")
          if gate.get("source") != "RAPNA" or gate.get("after") != "":
              raise RuntimeError("Authenticated curl gate returned an unexpected source or cursor")
          if not isinstance(gate.get("snapshotGuard"), str) or not gate["snapshotGuard"]:
              raise RuntimeError("Authenticated curl gate has no snapshot guard")
          if not isinstance(gate_corpus, dict) or not isinstance(gate_corpus.get("alerts"), int):
              raise RuntimeError("Authenticated curl gate has invalid corpus metadata")
          if not isinstance(gate_metadata.get("dimensions"), dict):
              raise RuntimeError("Authenticated curl gate has invalid dimension metadata")
          if not isinstance(gate_metadata.get("mappingVersions"), list):
              raise RuntimeError("Authenticated curl gate has invalid mapping metadata")
          if not isinstance(gate_metadata.get("operational"), dict):
              raise RuntimeError("Authenticated curl gate has invalid operational metadata")
          if not isinstance(gate_alerts, list) or len(gate_alerts) != (1 if gate_corpus["alerts"] else 0):
              raise RuntimeError("Authenticated curl gate returned an unexpected alert count")
          if gate_alerts and not isinstance(gate_alerts[0], dict):
              raise RuntimeError("Authenticated curl gate returned an invalid alert")
          gate_next = gate_alerts[0].get("id") if gate_alerts else None
          if not isinstance(gate_next, str) and gate_next is not None:
              raise RuntimeError("Authenticated curl gate has invalid nextAfter")
          if gate.get("nextAfter") != gate_next:
              raise RuntimeError("Authenticated curl gate has an inconsistent nextAfter")

          after = ""
          expected_guard = None
          first_metadata = None
          seen_ids = set()
          ordered_ids = []
          manifest = []
          exported_counts = {
              "alertVersions": 0,
              "categories": 0,
              "hazards": 0,
              "geographies": 0,
              "actors": 0,
              "dimensionState": 0,
          }
          sum_version_count = 0
          ordinal = 0

          while True:
              ordinal += 1
              url = f"{base_url}?limit=50"
              if after:
                  url += f"&after={quote(after, safe='')}"
              page_path = pages_dir / f"page-{ordinal:04d}.json"
              raw = curl_get(url, page_path)
              try:
                  body = json.loads(raw)
              except json.JSONDecodeError as error:
                  raise RuntimeError(f"Page {ordinal} is not valid JSON") from error

              if body.get("source") != "RAPNA":
                  raise RuntimeError(f"Page {ordinal} has unexpected source")
              if body.get("after") != after:
                  raise RuntimeError(f"Page {ordinal} does not echo the requested cursor")

              guard = body.get("snapshotGuard")
              if not isinstance(guard, str) or not guard:
                  raise RuntimeError(f"Page {ordinal} has no snapshot guard")
              if expected_guard is None:
                  expected_guard = guard
                  first_metadata = body.get("metadata")
              elif guard != expected_guard:
                  raise RuntimeError(f"Snapshot guard changed on page {ordinal}")

              alerts = body.get("alerts")
              if not isinstance(alerts, list):
                  raise RuntimeError(f"Page {ordinal} alerts are invalid")
              page_ids = []
              for alert in alerts:
                  alert_id = alert.get("id") if isinstance(alert, dict) else None
                  if not isinstance(alert_id, str) or not alert_id:
                      raise RuntimeError(f"Page {ordinal} contains an invalid alert ID")
                  if page_ids and alert_id <= page_ids[-1]:
                      raise RuntimeError(f"Page {ordinal} IDs are not strictly increasing")
                  if ordered_ids and alert_id <= ordered_ids[-1]:
                      raise RuntimeError(f"Page {ordinal} boundary is not strictly increasing")
                  if alert_id in seen_ids:
                      raise RuntimeError(f"Duplicate alert ID: {alert_id}")
                  page_ids.append(alert_id)
                  ordered_ids.append(alert_id)
                  seen_ids.add(alert_id)
                  try:
                      sum_version_count += int(alert["version_count"])
                  except (KeyError, TypeError, ValueError) as error:
                      raise RuntimeError(f"Alert {alert_id} has invalid version_count") from error

              next_after = body.get("nextAfter")
              has_more = body.get("hasMore")
              if not isinstance(has_more, bool):
                  raise RuntimeError(f"Page {ordinal} has invalid hasMore")
              expected_next = page_ids[-1] if page_ids else None
              if next_after != expected_next:
                  raise RuntimeError(f"Page {ordinal} has an invalid nextAfter")
              if has_more and (not isinstance(next_after, str) or not next_after or next_after <= after):
                  raise RuntimeError(f"Page {ordinal} has a missing or non-increasing cursor transition")

              relation_keys = {
                  "versions": "alertVersions",
                  "categories": "categories",
                  "hazards": "hazards",
                  "geographies": "geographies",
                  "actors": "actors",
                  "dimensionStates": "dimensionState",
              }
              for body_key, count_key in relation_keys.items():
                  rows = body.get(body_key)
                  if not isinstance(rows, list):
                      raise RuntimeError(f"Page {ordinal} has invalid {body_key}")
                  exported_counts[count_key] += len(rows)

              manifest.append({
                  "ordinal": ordinal,
                  "after": after,
                  "nextAfter": next_after,
                  "alertCount": len(alerts),
                  "bytes": len(raw),
                  "sha256": hashlib.sha256(raw).hexdigest(),
              })

              if not has_more:
                  break
              after = next_after

          if not isinstance(first_metadata, dict):
              raise RuntimeError("RAPNA metadata is missing")
          corpus = first_metadata.get("corpus")
          dimensions = first_metadata.get("dimensions")
          operational = first_metadata.get("operational")
          mapping_versions = first_metadata.get("mappingVersions")
          if not isinstance(corpus, dict) or not isinstance(dimensions, dict):
              raise RuntimeError("RAPNA corpus metadata is invalid")
          if not isinstance(operational, dict) or not isinstance(mapping_versions, list):
              raise RuntimeError("RAPNA operational metadata is invalid")
          if corpus != {"alerts": 2567, "alertVersions": 2568, "sumVersionCount": 2568}:
              raise RuntimeError("Post-APPLY RAPNA corpus metadata does not match certification")
          expected_dimensions = {
              "categories": 2567,
              "hazards": 2567,
              "geographies": 5134,
              "actors": 2219,
              "dimensionState": 2567,
          }
          if dimensions != expected_dimensions:
              raise RuntimeError("Post-APPLY RAPNA dimension metadata does not match target")
          state_versions = {
              row.get("mapping_version"): row.get("row_count")
              for row in mapping_versions
              if isinstance(row, dict) and row.get("dimension_table") == "dimension_state"
          }
          if state_versions != {"work19g-j-v4": 2567}:
              raise RuntimeError("Post-APPLY RAPNA mapping versions do not match target")
          rebuild = operational.get("dimensionRebuildState")
          required_rebuild = {
              "source": "RAPNA",
              "mapping_version": "work19g-j-v4",
              "status": "completed",
              "scanned_count": 2567,
              "candidate_relation_count": 12019,
              "write_count": 24354,
              "ambiguous_count": 0,
              "duplicate_count": 0,
              "error_count": 0,
              "lease_owner_id": None,
              "lease_expires_at": None,
          }
          if not isinstance(rebuild, dict):
              raise RuntimeError("Post-APPLY RAPNA rebuild state is missing")
          for key, expected in required_rebuild.items():
              if rebuild.get(key) != expected:
                  raise RuntimeError(f"Post-APPLY RAPNA rebuild state {key} does not match certification")

          total_alerts = len(ordered_ids)
          if total_alerts != corpus.get("alerts"):
              raise RuntimeError("Exported alert count does not match RAPNA metadata")
          if len(seen_ids) != total_alerts:
              raise RuntimeError("Unique alert count does not match exported alert count")
          if len(manifest) != 52:
              raise RuntimeError("Post-APPLY RAPNA export did not contain exactly 52 pages")
          if exported_counts["alertVersions"] != corpus.get("alertVersions"):
              raise RuntimeError("Exported alert_versions count does not match RAPNA metadata")
          if sum_version_count != corpus.get("sumVersionCount"):
              raise RuntimeError("Exported version_count sum does not match RAPNA metadata")
          for key in ("categories", "hazards", "geographies", "actors", "dimensionState"):
              if exported_counts[key] != dimensions.get(key):
                  raise RuntimeError(f"Exported {key} count does not match RAPNA metadata")

          manifest_bytes = (json.dumps(
              manifest,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          ) + "\n").encode("utf-8")
          (output / "page-manifest.json").write_bytes(manifest_bytes)
          manifest_sha = hashlib.sha256(manifest_bytes).hexdigest()

          summary = {
              "workflowRunId": run_id,
              "source": "RAPNA",
              "snapshotGuard": expected_guard,
              "pages": len(manifest),
              "totalAlerts": total_alerts,
              "totalVersionsReported": corpus["alertVersions"],
              "totalVersionsExported": exported_counts["alertVersions"],
              "sumVersionCount": sum_version_count,
              "uniqueAlertIds": len(seen_ids),
              "firstId": ordered_ids[0] if ordered_ids else None,
              "lastId": ordered_ids[-1] if ordered_ids else None,
              "dimensionCounts": dimensions,
              "exportedDimensionCounts": {
                  key: exported_counts[key]
                  for key in ("categories", "hazards", "geographies", "actors", "dimensionState")
              },
              "mappingVersionCounts": mapping_versions,
              "latestRapnaSync": operational.get("latestSync"),
              "sourceSyncLease": operational.get("sourceSyncLease"),
              "rebuildMetadata": operational.get("dimensionRebuildState"),
              "rebuildLease": operational.get("rebuildLease"),
              "applyTotals": apply_summary,
              "pageManifestSha256": manifest_sha,
          }
          summary_bytes = (json.dumps(
              summary,
              ensure_ascii=False,
              sort_keys=True,
              separators=(",", ":"),
          ) + "\n").encode("utf-8")
          (output / "export-summary.json").write_bytes(summary_bytes)
          print(json.dumps({
              "source": "RAPNA",
              "pages": len(manifest),
              "totalAlerts": total_alerts,
              "totalVersions": exported_counts["alertVersions"],
              "snapshotGuard": expected_guard,
              "pageManifestSha256": manifest_sha,
          }, sort_keys=True))
          PY

      - name: Upload private audit transport
        uses: actions/upload-artifact@v4
        with:
          name: work19g-aa-rapna-post-apply-${{ github.run_id }}
          path: export/**
          if-no-files-found: error
          retention-days: 1
