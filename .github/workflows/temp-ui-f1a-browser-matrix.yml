name: TEMP UI-F1A exact Preview + Safari certification

on:
  push:
    branches: [work/ui-f1a-browser-carrier]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      preview_url: ${{ steps.build.outputs.preview_url }}
      build_uuid: ${{ steps.build.outputs.build_uuid }}
    env:
      CF_ACCOUNT_ID: 9c1807c68493f14259248b5f5782cc6f
      TARGET_BRANCH: work/ui-f1a-system-theme-ios-compat
      TARGET_COMMIT: 53c77ef03893ad31e232c3eb501baa8fa6fa97e3
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Resolve Preview trigger and start exact build
        id: build
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          api="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID"

          scripts="$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "$api/workers/scripts")"
          printf '%s' "$scripts" >/tmp/scripts.json
          tag="$(python3 - <<'PY'
          import json
          x=json.load(open('/tmp/scripts.json'))
          if not x.get('success'): raise SystemExit(x.get('errors'))
          rows=x.get('result') or []
          matches=[r for r in rows if r.get('id')=='vigia-runtime']
          if len(matches)!=1: raise SystemExit(f'expected one vigia-runtime worker, got {len(matches)}')
          print(matches[0].get('tag') or '')
          PY
          )"
          test -n "$tag"

          triggers="$(curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "$api/builds/workers/$tag/triggers")"
          printf '%s' "$triggers" >/tmp/triggers.json
          trigger_uuid="$(python3 - <<'PY'
          import json
          x=json.load(open('/tmp/triggers.json'))
          if not x.get('success'): raise SystemExit(x.get('errors'))
          rows=x.get('result') or []
          candidates=[]
          for t in rows:
            inc=t.get('branch_includes') or []
            exc=t.get('branch_excludes') or []
            deploy=(t.get('deploy_command') or '').lower()
            covers=('*' in inc or 'work/*' in inc or 'work/ui-f1a-system-theme-ios-compat' in inc)
            safe=('main' in exc and 'wrangler preview' in deploy)
            if covers and safe: candidates.append(t)
          print("TRIGGERS_SAFE "+json.dumps([
            {'name':t.get('trigger_name'),'uuid':t.get('trigger_uuid'),
             'includes':t.get('branch_includes'),'excludes':t.get('branch_excludes'),
             'deploy':t.get('deploy_command')} for t in candidates
          ]))
          if len(candidates)!=1: raise SystemExit(f'expected exactly one safe preview trigger, got {len(candidates)}')
          open('/tmp/trigger_uuid','w').write(candidates[0]['trigger_uuid'])
          PY
          )"
          cat /tmp/triggers.json | python3 -c 'import json,sys; x=json.load(sys.stdin); print("TRIGGER_COUNT",len(x.get("result") or []))'
          trigger_uuid="$(cat /tmp/trigger_uuid)"

          payload="$(python3 - <<'PY'
          import json,os
          print(json.dumps({'branch':os.environ['TARGET_BRANCH'],'commit_hash':os.environ['TARGET_COMMIT']}))
          PY
          )"
          start="$(curl --fail-with-body --silent --show-error             -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --data "$payload"             "$api/builds/triggers/$trigger_uuid/builds")"
          printf '%s' "$start" >/tmp/start.json
          build_uuid="$(python3 - <<'PY'
          import json
          x=json.load(open('/tmp/start.json'))
          if not x.get('success'): raise SystemExit(x.get('errors'))
          r=x.get('result') or {}
          b=r.get('build_uuid')
          if not b: raise SystemExit('missing build_uuid')
          print(b)
          PY
          )"
          echo "BUILD_STARTED $build_uuid"

          preview_url=""
          for i in {1..66}; do
            body="$(curl --fail-with-body --silent --show-error               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               "$api/builds/builds/$build_uuid")"
            printf '%s' "$body" >/tmp/build.json
            read -r status outcome preview branch commit deploy <<<"$(python3 - <<'PY'
          import json
          x=json.load(open('/tmp/build.json'))
          if not x.get('success'): raise SystemExit(x.get('errors'))
          r=x.get('result') or {}; m=r.get('build_trigger_metadata') or {}
          vals=[r.get('status') or '-',r.get('build_outcome') or '-',
                r.get('preview_url') or '-',m.get('branch') or '-',
                m.get('commit_hash') or '-',(m.get('deploy_command') or '-').replace(' ','__SPACE__')]
          print(' '.join(vals))
          PY
            )"
            deploy="${deploy//__SPACE__/ }"
            echo "BUILD_POLL i=$i status=$status outcome=$outcome branch=$branch commit=$commit preview=$preview"
            test "$branch" = "$TARGET_BRANCH"
            test "$commit" = "$TARGET_COMMIT"
            case "$deploy" in *"wrangler preview"*) ;; *) echo "Unsafe deploy command: $deploy"; exit 1;; esac
            if [ "$status" = "stopped" ]; then
              test "$outcome" = "success"
              test "$preview" != "-"
              preview_url="$preview"
              break
            fi
            sleep 10
          done
          test -n "$preview_url"
          echo "preview_url=$preview_url" >>"$GITHUB_OUTPUT"
          echo "build_uuid=$build_uuid" >>"$GITHUB_OUTPUT"

      - name: Verify fixed SSR on exact Preview
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.build.outputs.preview_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 "$PREVIEW_URL/es/alertas" -o /tmp/page.html
          python3 - <<'PY'
          import re
          html=open('/tmp/page.html',encoding='utf-8').read()
          tag=re.search(r'<html\b[^>]*>',html,re.I)
          hard=bool(tag and 'data-na-theme=' in tag.group(0))
          print({'htmlTag':tag.group(0) if tag else None,'hardcodedTheme':hard,'bytes':len(html)})
          if not tag or hard: raise SystemExit('fixed Preview still hardcodes SSR theme')
          PY

  safari-ios:
    needs: preview
    runs-on: macos-15
    timeout-minutes: 12
    env:
      PREVIEW_URL: ${{ needs.preview.outputs.preview_url }}
    steps:
      - name: Real Safari theme and layout smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p safari-evidence ios-evidence
          curl --fail --silent --show-error --location --max-time 30 "$PREVIEW_URL/es/alertas" >/tmp/alerts.html
          /usr/bin/safaridriver --version
          sudo /usr/bin/safaridriver --enable
          /usr/bin/safaridriver --port 4444 > safari-evidence/safaridriver.log 2>&1 &
          DRIVER_PID=$!
          trap 'kill ${DRIVER_PID} 2>/dev/null || true' EXIT
          for i in {1..20}; do curl -sf http://127.0.0.1:4444/status >/dev/null && break; sleep 1; done
          python3 <<'PY'
          import json, os, time, urllib.request
          base='http://127.0.0.1:4444'; preview=os.environ['PREVIEW_URL']
          def req(method,path,body=None):
            data=None if body is None else json.dumps(body).encode()
            r=urllib.request.Request(base+path,data=data,method=method,headers={'Content-Type':'application/json'})
            with urllib.request.urlopen(r,timeout=60) as res: return json.loads(res.read().decode() or '{}')
          sid=req('POST','/session',{'capabilities':{'alwaysMatch':{'browserName':'Safari'}}})['value']['sessionId']
          def cmd(method,path,body=None): return req(method,f'/session/{sid}{path}',body).get('value')
          def js(s): return cmd('POST','/execute/sync',{'script':s,'args':[]})
          evidence={}
          try:
            cmd('POST','/window/rect',{'x':0,'y':0,'width':1366,'height':768})
            for route in ['/','/en/','/es/alertas','/en/alerts','/es/fuentes','/es/metodologia']:
              cmd('POST','/url',{'url':preview+route}); time.sleep(.45)
              s=js("return {ready:document.readyState,sw:document.documentElement.scrollWidth,cw:document.documentElement.clientWidth};")
              assert s['ready']=='complete' and s['sw']<=s['cw']+2,(route,s)
            cmd('POST','/url',{'url':preview+'/es/alertas'}); time.sleep(.5)
            js("localStorage.removeItem('nagamealert-theme');location.reload()"); time.sleep(1.2)
            t=js("return {attr:document.documentElement.getAttribute('data-na-theme'),system:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'};")
            assert t['attr']==t['system'],t
            js("document.querySelector('.na-theme-toggle')?.click()"); time.sleep(.25)
            o=js("return {attr:document.documentElement.getAttribute('data-na-theme'),stored:localStorage.getItem('nagamealert-theme')};")
            assert o['attr']==o['stored'] and o['stored'] in ('dark','light'),o
            js("location.reload()"); time.sleep(1)
            p=js("return {attr:document.documentElement.getAttribute('data-na-theme'),stored:localStorage.getItem('nagamealert-theme')};")
            assert p==o,(p,o)
            evidence={'themeInitial':t,'override':o,'persisted':p}
            open('safari-evidence/results.json','w').write(json.dumps(evidence,indent=2))
            print(json.dumps(evidence,indent=2))
          finally:
            try:req('DELETE',f'/session/{sid}')
            except:pass
          PY

      - name: iOS Simulator Safari screenshots
        shell: bash
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; xs=[x for arr in d.values() for x in arr if x.get("isAvailable") and x.get("name","").startswith("iPhone")]; print(xs[-1]["udid"] if xs else "")')"
          test -n "$UDID"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          for appearance in light dark; do
            xcrun simctl ui "$UDID" appearance "$appearance"
            xcrun simctl terminate "$UDID" com.apple.mobilesafari 2>/dev/null || true
            for spec in "home:/" "alerts:/es/alertas" "sources:/es/fuentes" "method:/es/metodologia"; do
              name="${spec%%:*}"; route="${spec#*:}"
              xcrun simctl openurl "$UDID" "${PREVIEW_URL}${route}"
              sleep 2
              xcrun simctl io "$UDID" screenshot "ios-evidence/${appearance}-${name}.png"
              test -s "ios-evidence/${appearance}-${name}.png"
            done
          done
          xcrun simctl shutdown "$UDID" || true

      - name: Upload Safari/iOS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-f1a-exact-safari-ios-evidence
          path: |
            safari-evidence
            ios-evidence
          if-no-files-found: warn
