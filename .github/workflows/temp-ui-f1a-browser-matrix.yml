name: TEMP UI-F1A Preview SSR probe

on:
  push:
    branches: [work/ui-f1a-browser-carrier]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PREVIEW_URL: https://work-ui-f1a-system-theme-ios-compat-vigia-runtime.c-gamiz93.workers.dev
    steps:
      - name: Inspect Preview SSR theme ownership
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 "$PREVIEW_URL/es/alertas" -o /tmp/page.html
          python3 - <<'PY'
          import re
          html=open('/tmp/page.html',encoding='utf-8').read()
          tag=re.search(r'<html\b[^>]*>',html,re.I)
          script='prefers-color-scheme: dark' in html and 'nagamealert-theme' in html
          hardcoded=bool(tag and re.search(r'data-na-theme=["\']dark["\']',tag.group(0),re.I))
          print({'htmlTag':tag.group(0) if tag else None,'themeBootstrapPresent':script,'hardcodedDark':hardcoded,'bytes':len(html)})
          if not tag or not script:
              raise SystemExit('Preview HTML is missing the expected theme bootstrap contract')
          raise SystemExit(2 if hardcoded else 0)
          PY
