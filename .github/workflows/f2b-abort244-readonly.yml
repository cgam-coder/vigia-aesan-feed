name: Safety Gate report 244 read-only diagnostic

on:
  push:
    branches: [work/scheduler-reliability-s0-evidence]
    paths:
      - ".github/workflows/f2b-abort244-readonly.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect official report 244 and first detail records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const cfToken=process.env.CLOUDFLARE_API_TOKEN;
          const query={queryId:'f2b-abort244-unique-diagnostic',dry:true,view:'events',limit:100,
            timeframe:{from:Date.parse('2026-10-04T13:48:30Z'),to:Date.parse('2026-10-04T13:49:30Z')},
            parameters:{filterCombination:'and',filters:[{key:'$metadata.service',operation:'eq',type:'string',value:'vigia-runtime'}]}};
          const tele=await fetch('https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f/workers/observability/telemetry/query',
            {method:'POST',headers:{Authorization:'Bearer '+cfToken,'Content-Type':'application/json'},body:JSON.stringify(query),redirect:'error',signal:AbortSignal.timeout(45000)});
          const tj=await tele.json();
          const safeKeys=new Set('id timestamp service origin type outcome eventType scriptName scriptVersion message error exception exceptions name stack cpuTimeMs wallTimeMs status statusCode method url request'.split(' '));
          const sanitize=(value,depth=0)=>{
            if(depth>7)return null;
            if(Array.isArray(value))return value.slice(0,20).map(x=>sanitize(x,depth+1));
            if(value&&typeof value==='object')return Object.fromEntries(Object.entries(value).filter(([k])=>safeKeys.has(k)).map(([k,v])=>[k,sanitize(v,depth+1)]));
            if(typeof value==='string')return value.replaceAll(cfToken,'[redacted]').slice(0,3000);
            return value;
          };
          const events=tj.result?.events?.events ?? [];
          const safe=events.map(e=>({timestamp:e.timestamp,metadata:sanitize(e.$metadata),workers:sanitize(e.$workers??e.source?.$workers),source:sanitize(e.source),keys:Object.keys(e)}));
          console.log('SG_DIAG_TELEMETRY '+JSON.stringify({http:tele.status,success:tj.success,eventCount:events.length,events:safe}));
          const base='https://ec.europa.eu/safety-gate-alerts';
          const indexUrl=base+'/api/download/weeklyReport/list/xml/en';
          const fetchText=async(url,timeout=30000)=>{
            const t=Date.now();
            const r=await fetch(url,{headers:{Accept:'application/xml,text/xml'},signal:AbortSignal.timeout(timeout)});
            const text=await r.text();
            return {status:r.status,ok:r.ok,text,ms:Date.now()-t,contentType:r.headers.get('content-type')};
          };
          const strip=s=>String(s??'').replace(/<!\[CDATA\[|\]\]>/g,'').replace(/&amp;/g,'&').trim();
          const tag=(block,name)=>{
            const m=block.match(new RegExp('<'+name+'(?:\\s[^>]*)?>([\\s\\S]*?)<\\/'+name+'>','i'));
            return m?strip(m[1]):'';
          };
          const parseDate=value=>{
            const v=value.trim();
            const m=v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if(m)return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}T00:00:00.000Z`;
            const t=Date.parse(v); return Number.isFinite(t)?new Date(t).toISOString():'';
          };
          const idx=await fetchText(indexUrl,45000);
          if(!idx.ok)throw new Error('index-http-'+idx.status);
          const blocks=[...idx.text.matchAll(/<weeklyReport(?:\s[^>]*)?>[\s\S]*?<\/weeklyReport>/gi)].map(m=>m[0]);
          const reports=blocks.flatMap(block=>{
            const url=tag(block,'URL')||tag(block,'url');
            const reference=tag(block,'reference')||tag(block,'reportNumber');
            const publicationDate=tag(block,'publicationDate')||tag(block,'publishedDate');
            const year=Number(tag(block,'year'));
            const week=Number(tag(block,'week'));
            if(!url.includes('/api/download/weeklyReport/detail/xml/')||!reference)return[];
            return [{url,reference,publicationDate,year,week,date:parseDate(publicationDate)}];
          }).sort((a,b)=>a.date.localeCompare(b.date)||a.reference.localeCompare(b.reference,'en',{numeric:true}));
          console.log('SG_DIAG_INDEX '+JSON.stringify({declared:blocks.length,parsed:reports.length,indexMs:idx.ms}));
          if(reports.length!==1118)throw new Error('unexpected-report-count-'+reports.length);
          const report=reports[244];
          console.log('SG_DIAG_REPORT '+JSON.stringify(report));
          const wr=await fetchText(report.url,45000);
          if(!wr.ok)throw new Error('weekly-http-'+wr.status);
          const nblocks=[...wr.text.matchAll(/<notifications(?:\s[^>]*)?>[\s\S]*?<\/notifications>/gi)].map(m=>m[0]);
          const rows=nblocks.flatMap(block=>{
            const reference=tag(block,'caseNumber')||tag(block,'alertNumber')||tag(block,'notificationNumber');
            const official=tag(block,'reference')||tag(block,'URL')||tag(block,'url');
            let id=null;
            const um=official.match(/(?:alertDetail|detail)\/(-?\d+)/i);
            if(um)id=Number(um[1]);
            else {
              const explicit=tag(block,'notificationId')||tag(block,'notificationID')||tag(block,'alertId')||tag(block,'alertID')||tag(block,'id');
              if(/^\d+$/.test(explicit))id=Number(explicit);
            }
            return reference&&Number.isSafeInteger(id)?[{reference,id,official}]:[];
          }).sort((a,b)=>a.reference.localeCompare(b.reference,'en',{numeric:true})||a.id-b.id);
          console.log('SG_DIAG_ROWS '+JSON.stringify({weeklyMs:wr.ms,blocks:nblocks.length,valid:rows.length,first20:rows.slice(0,20).map(x=>({id:x.id,reference:x.reference}))}));
          const byId=new Map(),byRef=new Map();
          for(const row of rows){
            byId.set(String(row.id),[...(byId.get(String(row.id))??[]),row]);
            byRef.set(row.reference,[...(byRef.get(row.reference)??[]),row]);
          }
          const dupIds=[...byId.entries()].filter(([,v])=>v.length>1).map(([id,v])=>({id,count:v.length,rows:v}));
          const dupRefs=[...byRef.entries()].filter(([,v])=>v.length>1).map(([reference,v])=>({reference,count:v.length,rows:v}));
          console.log('SG_DIAG_DUPLICATES '+JSON.stringify({dupIds,dupRefs}));
          for(const group of dupRefs){
            const details=[];
            for(const row of group.rows){
              const url=base+'/public/api/notification/'+row.id+'?language=es';
              const r=await fetch(url,{headers:{Accept:'application/json'},signal:AbortSignal.timeout(25000)});
              const text=await r.text();
              let body=null,error=null;
              try{body=JSON.parse(text);}catch(e){error=String(e?.message??e);}
              const safe=body?{
                id:body.id??null,reference:body.reference??null,
                creationDate:body.creationDate??null,publicationDate:body.publicationDate??null,modificationDate:body.modificationDate??null,
                corrigendum:body.corrigendum??null,
                country:body.country??null,
                notificationType:body.notificationType??null,
                product:body.product??null,
                risk:body.risk??null,
                measureTaken:body.measureTaken??null,
                traceability:body.traceability??null,
                reactingCountries:body.reactingCountries??null,
                onlineTraderProductIdentifierReference:body.onlineTraderProductIdentifierReference??null
              }:null;
              details.push({status:r.status,id:row.id,bytes:Buffer.byteLength(text),error,body:safe});
            }
            const normalize=v=>{
              const x=structuredClone(v);
              if(x){ delete x.id; }
              return x;
            };
            const stable=v=>{
              if(Array.isArray(v)) return v.map(stable);
              if(v&&typeof v==='object') return Object.fromEntries(Object.entries(v).sort(([a],[b])=>a.localeCompare(b)).map(([k,val])=>[k,stable(val)]));
              return v;
            };
            const normalized=details.map(d=>stable(normalize(d.body)));
            const hashes=[];
            for(const item of normalized){
              const bytes=new TextEncoder().encode(JSON.stringify(item));
              const digest=await crypto.subtle.digest('SHA-256',bytes);
              hashes.push([...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join(''));
            }
            console.log('SG_DIAG_DUP_DETAIL '+JSON.stringify({reference:group.reference,details,normalizedHashes:hashes,equivalentIgnoringId:hashes.every(h=>h===hashes[0])}));
          }
          const targets=rows.slice(0,10);
          for(const row of targets){
            const url=base+'/public/api/notification/'+row.id+'?language=es';
            const t=Date.now();
            let status=null,bytes=0,validJson=false,identityMatch=false,error=null,contentType=null,publicationDate=null;
            try{
              const r=await fetch(url,{headers:{Accept:'application/json'},signal:AbortSignal.timeout(25000)});
              status=r.status;contentType=r.headers.get('content-type');
              const text=await r.text();bytes=Buffer.byteLength(text);
              try{
                const body=JSON.parse(text);validJson=true;publicationDate=body.publicationDate??null;
                identityMatch=body?.id===row.id&&String(body?.reference??'').trim()===row.reference.trim();
              }catch(e){error='json:'+String(e?.message??e);}
            }catch(e){error=String(e?.name??'Error')+':'+String(e?.message??e);}
            console.log('SG_DIAG_DETAIL '+JSON.stringify({id:row.id,reference:row.reference,status,ms:Date.now()-t,bytes,validJson,identityMatch,contentType,error,publicationDate}));
          }
          NODE
