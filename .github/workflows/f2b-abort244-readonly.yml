name: Safety Gate report 244 read-only diagnostic

on:
  push:
    branches: [work/scheduler-reliability-s0-evidence]
    paths:
      - ".github/workflows/f2b-abort244-readonly.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read exact failed-request telemetry; upstream already diagnosed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const cfToken=process.env.CLOUDFLARE_API_TOKEN;
          const query={queryId:'f2b-abort244-unique-diagnostic',dry:true,view:'events',limit:100,
            timeframe:{from:Date.parse('2026-10-04T13:48:38Z'),to:Date.parse('2026-10-04T13:48:46Z')},
            parameters:{filterCombination:'and',filters:[{key:'$metadata.service',operation:'eq',type:'string',value:'vigia-runtime'}]}};
          const tele=await fetch('https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f/workers/observability/telemetry/query',
            {method:'POST',headers:{Authorization:'Bearer '+cfToken,'Content-Type':'application/json'},body:JSON.stringify(query),redirect:'error',signal:AbortSignal.timeout(45000)});
          const tj=await tele.json();
          const safeKeys=new Set('id timestamp service origin type outcome eventType scriptName scriptVersion message error exception exceptions name stack cpuTimeMs wallTimeMs status statusCode method url request'.split(' '));
          const sanitize=(value,depth=0)=>{
            if(depth>7)return null;
            if(Array.isArray(value))return value.slice(0,20).map(x=>sanitize(x,depth+1));
            if(value&&typeof value==='object')return Object.fromEntries(Object.entries(value).filter(([k])=>safeKeys.has(k)).map(([k,v])=>[k,sanitize(v,depth+1)]));
            if(typeof value==='string')return value.replaceAll(cfToken,'[redacted]').slice(0,3000);
            return value;
          };
          const events=tj.result?.events?.events ?? [];
          const safe=events.map(e=>({timestamp:e.timestamp,metadata:sanitize(e.$metadata),workers:sanitize(e.$workers??e.source?.$workers),source:sanitize(e.source),keys:Object.keys(e)}));
          console.log('SG_DIAG_TELEMETRY '+JSON.stringify({http:tele.status,success:tj.success,eventCount:events.length,events:safe.filter(e=>/safety-gate|exception|error|invalid|1150/i.test(JSON.stringify(e)))}));
          NODE
