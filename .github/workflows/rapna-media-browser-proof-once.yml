name: RAPNA-MEDIA-F1 isolated Chrome proof once

on:
  push:
    branches:
      - sec-f1/cloudflare-api-readonly-20261009
    paths:
      - .github/workflows/rapna-media-browser-proof-once.yml

permissions:
  contents: read

concurrency:
  group: rapna-media-browser-proof-once-20261010
  cancel-in-progress: false

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Install isolated pinned browser driver (no repository code/secrets)
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/rapna-playwright" playwright@1.56.1 --ignore-scripts --no-audit --no-fund --silent
          which google-chrome || which google-chrome-stable || which chromium
          timeout 240 "$RUNNER_TEMP/rapna-playwright/node_modules/.bin/playwright" install --with-deps webkit
      - name: Verify one real RAPNA image in isolated preview browser
        shell: bash
        run: |
          node <<'NODE'
          const path=require('node:path');
          const crypto=require('node:crypto');
          const {chromium,webkit}=require(path.join(process.env.RUNNER_TEMP,'rapna-playwright/node_modules/playwright'));
          const preview='https://rapna-media-f1-direct-cors-proof-20261010-vigia-runtime.c-gamiz93.workers.dev';
          const summary={phase:'RAPNA_MEDIA_BROWSER_PROOF',preview_commit:'2e39d81',http:{},browser:'Chrome',fixture:'one public RAPNA alert; in-memory API route only',no_d1_writes:true,no_builds_created:true};
          let browser,context;
          const output=()=>console.log('RAPNA_MEDIA_BROWSER '+JSON.stringify(summary));
          (async()=>{
            let res;
            try{
              res=await fetch('https://nagamealert.com/api/terminal/alerts?source=RAPNA&period=30d&pageSize=10',
                {signal:AbortSignal.timeout(16000)});
              if(!res.ok)throw new Error('public_api_http_'+res.status);
              let data=await res.json();
              const item=data?.items?.find(x=>x.source==='RAPNA'&&x.reference==='159/2026');
              if(!item||typeof item.imageUrl!=='string'||!item.imageUrl.startsWith('/api/rapna/resource?'))throw new Error('missing_official_image_fixture');
              data={...data,items:[item],total:1,pagination:{...data.pagination,returned:1,hasMore:false,nextCursor:null},
                facets:{...data.facets,total:1,sources:{...data.facets?.sources,RAPNA:1}}};
              summary.fixture_url_present=true;
              const executable='/usr/bin/google-chrome';
              browser=await chromium.launch({headless:true,executablePath:executable,args:['--no-sandbox','--disable-dev-shm-usage']});
              context=await browser.newContext({viewport:{width:1440,height:900},locale:'es-ES',timezoneId:'Europe/Madrid',
                serviceWorkers:'block'});
              const page=await context.newPage();
              let routeMocks=0,postRequests=0,proxyFallbackRequests=0,officialResponseCodes=[],jsErrors=[];
              await page.route('**/api/terminal/alerts?**',async route=>{
                routeMocks++;
                await route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(data)});
              });
              page.on('request',request=>{
                if(request.url().startsWith('https://servicios.consumo.gob.es/rapnaBEPublic/listadoPublico/fichero'))postRequests++;
                if(request.url().includes('/api/rapna/resource?'))proxyFallbackRequests++;
              });
              page.on('response',r=>{
                if(r.url().startsWith('https://servicios.consumo.gob.es/rapnaBEPublic/listadoPublico/fichero'))officialResponseCodes.push(r.status());
              });
              page.on('pageerror',error=>{if(jsErrors.length<3)jsErrors.push(error?.name??'Error');});
              const navigation=await page.goto(preview+'/es/alertas?source=RAPNA&period=30d',
                {waitUntil:'domcontentloaded',timeout:30000});
              summary.http.preview_navigation=navigation?.status()??null;
              summary.http.official_response_codes=officialResponseCodes;
              const card=page.locator('article.na-alert-card[data-source="RAPNA"]');
              try{
                await card.first().waitFor({state:'visible',timeout:20000});
                summary.card_rendered=true;
                const img=card.first().locator('figure.na-alert-card__media img').first();
                await img.waitFor({state:'attached',timeout:8000});
                await img.scrollIntoViewIfNeeded();
                await page.waitForFunction(()=>{
                  const i=document.querySelector('article.na-alert-card[data-source="RAPNA"] img');
                  return !!i&&i.complete&&i.naturalWidth>0;
                },null,{timeout:25000});
                summary.card_image=await img.evaluate(i=>({rendered:i.complete&&i.naturalWidth>0,natural_width:i.naturalWidth,
                  natural_height:i.naturalHeight,src_scheme:i.src.startsWith('blob:')?'blob':i.src.startsWith('http')?'http':'other',
                  figure_hidden:i.parentElement?.hasAttribute('hidden')===true}));
                const screenshot=await card.first().screenshot({timeout:5000});
                summary.card_screenshot_sha256=crypto.createHash('sha256').update(screenshot).digest('hex').slice(0,18);
              }catch(error){
                summary.card_rendered=await card.count()>0;
                summary.card_error_type=error?.name??'Error';
                summary.card_error_summary=String(error?.message||'').split('\n')[0].slice(0,140);
              }
              summary.route_fixtures_served=routeMocks;
              summary.official_post_requests=postRequests;
              summary.proxy_fallback_requests=proxyFallbackRequests;
              summary.http.official_response_codes=officialResponseCodes;
              summary.page_error_kinds=jsErrors;

              // Fall back to the existing proxy if the official browser request fails.
              const fallback=await context.newPage();
              let fallbackProxy=0,blockedDirect=0;
              await fallback.route('**/api/terminal/alerts?**',route=>route.fulfill({
                status:200,contentType:'application/json',body:JSON.stringify(data)}));
              await fallback.route('https://servicios.consumo.gob.es/rapnaBEPublic/listadoPublico/fichero',route=>{
                blockedDirect++;return route.abort('failed');
              });
              const png=Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGN4tq8JAAS0AieWIJc1AAAAAElFTkSuQmCC','base64');
              await fallback.route('**/api/rapna/resource?**',route=>{
                fallbackProxy++;return route.fulfill({status:200,contentType:'image/png',body:png});
              });
              await fallback.goto(preview+'/es/alertas?source=RAPNA&period=30d',{
                waitUntil:'domcontentloaded',timeout:30000});
              const fcard=fallback.locator('article.na-alert-card[data-source="RAPNA"]');
              await fcard.first().waitFor({state:'visible',timeout:20000});
              const fimg=fcard.first().locator('figure.na-alert-card__media img').first();
              await fimg.scrollIntoViewIfNeeded();
              await fallback.waitForFunction(()=>{
                const i=document.querySelector('article.na-alert-card[data-source="RAPNA"] img');
                return !!i&&i.complete&&i.naturalWidth>0;
              },null,{timeout:24000});
              summary.fallback={
                direct_request_blocked:blockedDirect>=1,
                same_origin_proxy_used:fallbackProxy===1,
                proxy_image_visible:await fimg.evaluate(i=>i.naturalWidth===1&&!i.parentElement?.hasAttribute('hidden')),
                src_scheme:await fimg.evaluate(i=>i.src.startsWith('https:')?'https':'other'),
              };
              await fallback.close();

              // Repeat the original, unmodified production card at a mobile viewport.
              const mobile=await browser.newContext({viewport:{width:390,height:844},deviceScaleFactor:2,isMobile:true,
                hasTouch:true,locale:'es-ES',serviceWorkers:'block'});
              const mp=await mobile.newPage();let mobileMock=0;
              await mp.route('**/api/terminal/alerts?**',route=>{
                mobileMock++;
                return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(data)});
              });
              await mp.goto(preview+'/es/alertas?source=RAPNA&period=30d',{waitUntil:'domcontentloaded',timeout:30000});
              const mcard=mp.locator('article.na-alert-card[data-source="RAPNA"]');
              await mcard.first().waitFor({state:'visible',timeout:22000});
              const mimg=mcard.first().locator('figure.na-alert-card__media img').first();
              await mimg.scrollIntoViewIfNeeded();
              await mp.waitForFunction(()=>{
                const i=document.querySelector('article.na-alert-card[data-source="RAPNA"] img');
                return !!i&&i.complete&&i.naturalWidth>0;
              },null,{timeout:25000});
              summary.mobile={viewport_width:390,fixture_intercepted:mobileMock>0,
                photo:await mimg.evaluate(i=>({visible:i.naturalWidth>0&&!i.parentElement?.hasAttribute('hidden'),
                  src_scheme:i.src.startsWith('blob:')?'blob':'other',natural_width:i.naturalWidth}))};
              await mobile.close();

              // Desktop WebKit is Safari-like; this does not certify physical iOS Safari.
              try {
                const wk=await webkit.launch({headless:true});
                const wkc=await wk.newContext({viewport:{width:1280,height:800},locale:'es-ES',serviceWorkers:'block'});
                const wp=await wkc.newPage();let webkitMock=0,webkitDirect=0;
                await wp.route('**/api/terminal/alerts?**',route=>{
                  webkitMock++;
                  return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(data)});
                });
                wp.on('request',r=>{
                  if(r.url().startsWith('https://servicios.consumo.gob.es/rapnaBEPublic/listadoPublico/fichero'))webkitDirect++;
                });
                await wp.goto(preview+'/es/alertas?source=RAPNA&period=30d',{waitUntil:'domcontentloaded',timeout:30000});
                const wc=wp.locator('article.na-alert-card[data-source="RAPNA"]');
                await wc.first().waitFor({state:'visible',timeout:22000});
                const wi=wc.first().locator('figure.na-alert-card__media img').first();
                await wi.scrollIntoViewIfNeeded();
                await wp.waitForFunction(()=>{
                  const i=document.querySelector('article.na-alert-card[data-source="RAPNA"] img');
                  return !!i&&i.complete&&i.naturalWidth>0;
                },null,{timeout:25000});
                summary.webkit={result:'PASS',fixture_intercepted:webkitMock>0,direct_posts:webkitDirect,
                  image:await wi.evaluate(i=>({rendered:i.naturalWidth>0,src_scheme:i.src.startsWith('blob:')?'blob':'other',
                    width:i.naturalWidth,hidden:i.parentElement?.hasAttribute('hidden')===true}))};
                await wkc.close();await wk.close();
              }catch(e){summary.webkit={result:'HOLD',error_name:e?.name??'Error',reason:String(e?.message||'').split('\n')[0].slice(0,160)};}

              summary.pass=summary.card_image?.rendered===true&&summary.card_image?.src_scheme==='blob'&&
                summary.card_image?.figure_hidden===false&&routeMocks>0&&postRequests>=1&&proxyFallbackRequests===0&&
                summary.fallback?.direct_request_blocked&&summary.fallback?.same_origin_proxy_used&&
                summary.fallback?.proxy_image_visible&&summary.mobile?.photo?.visible&&
                summary.mobile?.photo?.src_scheme==='blob';
              if(!summary.pass){
                summary.result='HOLD_browser_card';process.exitCode=1;
              }else summary.result='PASS_browser_card';
            }catch(error){summary.result='HOLD_environment_or_fixture';summary.error_type=error?.name??'Error';
              summary.error=String(error?.message??'').split('\n')[0].slice(0,160);process.exitCode=1;}
            finally{if(context)await context.close().catch(()=>{});if(browser)await browser.close().catch(()=>{});output();}
          })();
          NODE
