name: V16 F2-G final active production identity
on:
  push:
    branches: [v16/f2g-production-identity-readonly]
    paths: [".github/workflows/v16-f2g-postsmoke-identity.yml"]
permissions:
  contents: read
jobs:
  terminal:
    if: github.event.head_commit.message == 'V16 F2-G confirm production allocation after smoke read only' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Read stable active production allocation only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const root='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f/workers/scripts/vigia-runtime',expected='2962e07e-2a27-4688-b58f-efeb819fe836';
          const out={observedAt:new Date().toISOString(),productionMutationAttempts:0,reads:[]};
          async function get(path){
            if(Date.now()>Date.parse('2026-10-05T23:59:00Z'))throw Error('expired');
            if(path!=='/deployments'&&path!=='/versions/'+expected)throw Error('scope');
            const r=await fetch(root+path,{method:'GET',redirect:'error',headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN},signal:AbortSignal.timeout(15000)});
            out.reads.push({path,http:r.status,at:new Date().toISOString()});if(!r.ok)throw Error('HTTP-'+r.status);
            const j=await r.json();if(!j.success)throw Error('envelope');return j.result;
          }
          try{
            const first=(await get('/deployments')).deployments?.[0];
            if(first?.versions?.length!==1||first.versions[0].percentage!==100||first.versions[0].version_id!==expected)throw Error('active-drift-or-ambiguous');
            const v=await get('/versions/'+expected);
            const again=(await get('/deployments')).deployments?.[0];
            if(JSON.stringify(first)!==JSON.stringify(again)||v.id!==expected)throw Error('allocation-not-stable');
            out.active={deploymentId:first.id,versionId:v.id,percentage:100,versionNumber:v.number,createdOn:first.created_on,versionCreatedOn:v.metadata?.created_on};out.status='PASS';
          }catch(e){out.status='HOLD';out.reason=e.message;process.exitCode=1;}
          out.completedAt=new Date().toISOString();console.log('F2G_POSTSMOKE_PRODUCTION '+JSON.stringify(out));
          NODE
