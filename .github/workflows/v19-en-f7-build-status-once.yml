name: V19 EN HOME-F7 read-only build status
on:
  push:
    branches: [sec-f1/cloudflare-api-readonly-20261009]
    paths: [.github/workflows/v19-en-f7-build-status-once.yml]
permissions:
  contents: read
concurrency:
  group: v19-en-f7-build-status
  cancel-in-progress: false
jobs:
  read:
    if: github.actor == 'cgam-coder'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: GET-only Cloudflare builds and live/rollback Worker IDs
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CF_TOKEN;
          if(!token)throw Error('TOKEN_UNAVAILABLE');
          const root='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f';
          async function get(path){
            const r=await fetch(root+path,{method:'GET',redirect:'error',
              headers:{Authorization:'Bearer '+token,Accept:'application/json'},
              signal:AbortSignal.timeout(15000)});
            const j=await r.json().catch(()=>null);
            if(r.status!==200||j?.success!==true)throw Error('GET_FAILED_'+r.status);
            return j.result;
          }
          const ss=await get('/workers/scripts');
          const tag=(Array.isArray(ss)?ss:[]).find(x=>x.id==='vigia-runtime')?.tag;
          if(!tag)throw Error('WORKER_TAG_UNAVAILABLE');
          const builds=await get('/builds/workers/'+encodeURIComponent(tag)+'/builds');
          const a=Array.isArray(builds)?builds:(builds?.builds??[]);
          const wanted=new Set(['8daa44eb8337c1d50fc508f5a228974fc98d8577','80692f845fbd0471e643f13ed6e6f87d6dc3be94','c52f638f50177ebb38ac364e8d8587a19aa42d7b']);
          console.log('V19_EN_BUILDS '+JSON.stringify(a.filter(b=>wanted.has(b.build_trigger_metadata?.commit_hash)).map(b=>({
            sha:b.build_trigger_metadata.commit_hash,outcome:b.build_outcome??null,uuid:b.build_uuid
          }))));
          const deploy=await get('/workers/scripts/vigia-runtime/deployments');
          console.log('V19_EN_DEPLOY '+JSON.stringify((deploy.deployments??[]).slice(0,2).map(d=>({
            id:d.id,created:d.created_on,versions:(d.versions??[]).map(v=>({id:v.version_id,pct:v.percentage}))
          }))));
          NODE
