name: V24 RAPNA current postcycle journal proof one-shot
on:
  push:
    branches: [audit/v24-rapna-current-postcycle-journal-20261012]
    paths: [.github/workflows/v24-rapna-postcycle-proof.yml]
permissions:
  contents: read
jobs:
  audit:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Observe RAPNA domain journal writes and last certificate, SELECT-only
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONTROL_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const emit=(stage,rest)=>console.log('V24_RAPNA_JOURNAL '+JSON.stringify({stage,...rest}));
          const CF=process.env.CF_TOKEN,T=process.env.CONTROL_TOKEN;
          if(!CF||!T){emit('verdict',{state:'HOLD_AUTH'});process.exit(2);}
          const root='https://vigia-runtime.c-gamiz93.workers.dev';
          const api='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f';
          const D='55596003-1b90-4f66-aad8-decb21205f13',jobId='ab50d0f7-0ad7-4fb5-8078-f6c376aa8f53';
          const finished='2026-10-12T00:09:09.851Z';
          let gets=0,selects=0,rowsRead=0;
          const get=async(url,token)=>{
            if(![root+'/api/source-reliability?observe=1',root+'/api/freshness?observe=1',api+'/d1/database/'+D].includes(url)||++gets>3)throw Error('GET_LIMIT');
            const r=await fetch(url,{method:'GET',headers:{Authorization:'Bearer '+token,Accept:'application/json'},signal:AbortSignal.timeout(14000),redirect:'error'});
            const j=await r.json().catch(()=>null);if(r.status!==200||!j)throw Error('GET_FAIL_'+r.status);return j;
          };
          const sql=async(label,q,params=[])=>{
            if(!/^SELECT\s/u.test(q)||q.includes(';')||/\b(INSERT|UPDATE|DELETE|DROP|ALTER|PRAGMA|ATTACH|DETACH|VACUUM|REPLACE|CREATE)\b/iu.test(q)||++selects>6)throw Error('SQL_POLICY');
            const r=await fetch(api+'/d1/database/'+D+'/query',{method:'POST',headers:{Authorization:'Bearer '+CF,'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({sql:q,params}),signal:AbortSignal.timeout(22000),redirect:'error'});
            const j=await r.json().catch(()=>null),p=j?.result?.[0];
            if(r.status!==200||j?.success!==true||!Array.isArray(p?.results)||p?.meta?.rows_written!==0)throw Error('SQL_FAIL_'+label+'_'+r.status);
            rowsRead+=p.meta.rows_read||0;if(rowsRead>15000)throw Error('ROWS_LIMIT');
            emit(label,{rows:p.results.slice(0,50),read:p.meta.rows_read,written:p.meta.rows_written});return p.results;
          };
          const inspectDomainSQL="LOWER(TRIM(json_extract(w.value,'$.sql')))";
          const tablePrefixes=["alerts","alert_versions","alert_source_identities","alert_aliases","alert_categories","alert_hazards","alert_geographies","alert_actors","alert_dimension_state"];
          const allowedPrefixes=tablePrefixes.flatMap(t=>[
            inspectDomainSQL+" LIKE 'insert into "+t+" %'",
            inspectDomainSQL+" LIKE 'insert or ignore into "+t+" %'",
            inspectDomainSQL+" LIKE 'update "+t+" %'",
            inspectDomainSQL+" LIKE 'delete from "+t+" %'"
          ]).join(' OR ');
          const hasDomain="EXISTS(SELECT 1 FROM json_each(e.manifest_json,'$.writes') AS w WHERE "+allowedPrefixes+")";
          try{
            const [owner,fresh,db]=await Promise.all([
              get(root+'/api/source-reliability?observe=1',T),get(root+'/api/freshness?observe=1',T),get(api+'/d1/database/'+D,CF)
            ]);
            const control=owner.state?.revisionAttempts?.['RAPNA:current-parity'];
            const valid=owner.buildSha==='d5fcd11cbeb563258b4bbdc9482a80b8684c81d3'&&owner.mode==='five-source-coordinated'&&db.result?.uuid===D;
            const f=(fresh.states||[]).find(x=>x.source==='RAPNA');
            emit('baseline',{shaMatch:owner.buildSha==='d5fcd11cbeb563258b4bbdc9482a80b8684c81d3',mode:owner.mode,dbUUIDCorrect:db.result?.uuid===D,
             latestRecentAt:f?.lastSyncSuccessAt??null,latestParity:f?.latestIdentityParity??null,currentRevisionId:control?.id??null,
             currentRevisionOutcome:control?.outcome??null,coordinatorLease:owner.activeLease??null});
            if(!valid||control?.id!==jobId||control.outcome!=='unknown')throw Error('HOLD_CHANGED_BASELINE_OR_JOB');
            await sql('post-cycle-domain-effects',"SELECT COUNT(*) AS total,COUNT(DISTINCT e.job_id) AS jobs,COALESCE(SUM(CASE WHEN e.committed_at IS NULL OR e.result_json IS NULL THEN 1 ELSE 0 END),0) AS pending,COALESCE(SUM(CASE WHEN "+hasDomain+" THEN 1 ELSE 0 END),0) AS domainMarkers,MAX(e.committed_at) AS lastCommitted FROM source_reliability_effects e WHERE e.source='RAPNA' AND (e.committed_at>? OR e.committed_at IS NULL)",[finished]);
            await sql('post-cycle-by-job',"SELECT e.job_id,e.mode,COUNT(*) AS effects,COALESCE(SUM(CASE WHEN "+hasDomain+" THEN 1 ELSE 0 END),0) AS domainMarkers,COALESCE(SUM(CASE WHEN e.committed_at IS NULL OR e.result_json IS NULL THEN 1 ELSE 0 END),0) AS pending FROM source_reliability_effects e WHERE e.source='RAPNA' AND (e.committed_at>? OR e.committed_at IS NULL) GROUP BY e.job_id,e.mode ORDER BY e.job_id LIMIT 30",[finished]);
            await sql('job-summary',"SELECT mode,kind,COUNT(*) AS jobs,COALESCE(SUM(CASE WHEN json_extract(receipt_json,'$.outcome')='unknown' THEN 1 ELSE 0 END),0) AS unknownJobs,COALESCE(SUM(CASE WHEN json_extract(receipt_json,'$.outcome')='completed' THEN 1 ELSE 0 END),0) AS completeJobs FROM source_reliability_jobs WHERE source='RAPNA' AND started_at>? GROUP BY mode,kind LIMIT 20",[finished]);
            await sql('source-checks',"SELECT COUNT(*) AS checks,COALESCE(SUM(changed_count),0) AS changedCount,MAX(checked_at) AS lastCheck,COALESCE(SUM(CASE WHEN status!='ok' THEN 1 ELSE 0 END),0) AS degraded FROM source_checks WHERE source='RAPNA' AND checked_at>?",[finished]);
            await sql('cert-state',"SELECT s.status,s.cursor,s.total_units,s.completed_at,s.updated_at,s.plan_version,c.cycle_id,c.completed_at AS cert_completed,c.audit_status FROM source_sync_state s LEFT JOIN source_revision_certifications c ON s.source=c.source AND s.mode=c.mode WHERE s.source='RAPNA' AND s.mode='current-parity' LIMIT 1");
            await sql('post-cycle-recovery',"SELECT COUNT(*) AS pendingIntentParts,(SELECT COUNT(*) FROM source_reliability_recoveries WHERE old_job_id=?) AS recoveries FROM source_reliability_recovery_plans WHERE old_job_id=?",[jobId,jobId]);
            emit('verdict',{state:'PASS_READONLY_JOURNAL_OBSERVATION',gets,selects,rowsRead,rowsWritten:0,noSourceJobs:true,noSync:true,noCloudflareChanges:true,notDomainCompletenessProof:true});
          }catch(e){emit('verdict',{state:'HOLD',reason:e instanceof Error?e.message:'unknown',gets,selects,rowsRead,rowsWritten:0});process.exitCode=1;}
          NODE
