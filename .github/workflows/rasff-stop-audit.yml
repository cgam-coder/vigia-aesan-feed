# WORK 20Q-F1 final deferred recovery initial read-only gate
name: VIGIA RASFF final read-only audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rasff-stop-audit.yml"

permissions:
  contents: read

concurrency:
  group: vigia-rasff-controlled-activation
  cancel-in-progress: false

jobs:
  readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VIGIA_BASE_URL: https://vigia-alertas.csar68.chatgpt.site
      VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
    steps:
      - name: Certify final persisted state without writes
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VIGIA_SYNC_TOKEN"
          node <<'NODE'
          const base = process.env.VIGIA_BASE_URL;
          const headers = { Authorization:"Bearer " + process.env.VIGIA_SYNC_TOKEN };
          const call = async (path, method = "GET") => {
            const response = await fetch(base + path, { method, headers, redirect:"follow", signal:AbortSignal.timeout(600_000) });
            const raw = await response.text();
            let body;
            try { body = JSON.parse(raw); } catch { throw new Error(method + " " + path + " returned non-JSON HTTP " + response.status); }
            if (response.status !== 200) throw new Error(method + " " + path + " failed HTTP " + response.status + ": " + raw.slice(0, 1000));
            return body;
          };
          const observe = await call("/api/rasff/sync?observe=1");
          const audit = (await call("/api/rasff/sync?audit=1")).audit;
          const preflight = await call("/api/rasff/sync?mode=preflight", "POST");
          const official = (await call("/api/rasff/sync?mode=preview-reconcile&cursor=0&batchSize=1", "POST")).preview;
          const integrity = Object.entries(audit.integrity).filter(([, value]) => value !== 0);
          const expectedOperational = official.totalElements - official.archiveSkippedCount;
          const delta = expectedOperational - audit.counts.rasffAlerts;
          if (observe.lease !== null || observe.backfill?.status !== "completed" ||
              observe.backfill?.coverage !== "official-index-complete" || observe.backfill?.cursor !== 0 ||
              observe.backfill?.cursorKey !== null || observe.reconcile?.status !== "completed" ||
              observe.reconcile?.coverage !== "official-index-complete" || observe.reconcile?.cursor !== 0 ||
              observe.reconcile?.cursorKey !== null || integrity.length ||
              audit.counts.rasffAlerts !== audit.counts.rasffUniqueReferences ||
              audit.counts.rasffAlerts !== audit.counts.rasffSourceIdentities ||
              audit.counts.rasffVersions !== audit.counts.rasffVersionCountSum ||
              delta !== observe.backfill.detailFailures || delta !== observe.reconcile.detailFailures ||
              preflight?.authorized !== true || preflight?.officialIndex?.totalElements !== official.totalElements)
            throw new Error("Final RASFF read-only gate failed: " + JSON.stringify({ observe, audit, preflight, official, expectedOperational, delta }));
          console.log("FINAL_OBSERVE " + JSON.stringify(observe));
          console.log("FINAL_AUDIT " + JSON.stringify(audit));
          console.log("FINAL_OFFICIAL " + JSON.stringify({ totalElements:official.totalElements,
            archiveSkippedCount:official.archiveSkippedCount, expectedOperational, delta }));
          console.log("FINAL_PREFLIGHT " + JSON.stringify(preflight));
          NODE
