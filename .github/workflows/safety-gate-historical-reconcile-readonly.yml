name: Safety Gate F2B uncertain-result read-only reconciliation

on:
  push:
    branches: [work/scheduler-reliability-s0-evidence]
    paths:
      - ".github/workflows/safety-gate-historical-reconcile-readonly.yml"

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VIGIA_BASE_URL: https://vigia-runtime.c-gamiz93.workers.dev
      VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Capture Safety Gate reconciliation snapshot read-only
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = process.env.VIGIA_BASE_URL;
          const token = process.env.VIGIA_SYNC_TOKEN;
          const cfToken = process.env.CLOUDFLARE_API_TOKEN;
          if (base !== 'https://vigia-runtime.c-gamiz93.workers.dev' || !token || !cfToken) throw new Error('target-or-credentials-not-configured');
          const auth = { Authorization: `Bearer ${token}` };
          const cfAuth = { Authorization: `Bearer ${cfToken}` };
          async function get(url, headers, timeout = 45000) {
            const r = await fetch(url, { method: 'GET', headers, redirect: 'error', signal: AbortSignal.timeout(timeout) });
            const body = await r.json();
            if (r.status !== 200) throw new Error(`read-http-${r.status}`);
            return body;
          }

          const cfRoot = 'https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f/workers/scripts/vigia-runtime';
          const [dep, settings, schedules, observe, auditEnvelope] = await Promise.all([
            get(cfRoot + '/deployments', cfAuth, 30000),
            get(cfRoot + '/settings', cfAuth, 30000),
            get(cfRoot + '/schedules', cfAuth, 30000),
            get(base + '/api/safety-gate/sync?observe=1', auth),
            get(base + '/api/safety-gate/sync?audit=1', auth),
          ]);
          const deployments = dep.result?.deployments ?? dep.result;
          const active = deployments?.[0], previous = deployments?.[1];
          const bindings = settings.result?.bindings ?? [];
          const value = name => {
            const b = bindings.find(x => x.name === name);
            return b?.text ?? b?.value ?? null;
          };
          const crons = schedules.result?.schedules ?? schedules.result;
          const s = observe?.historicalReconcile ?? null;
          const audit = auditEnvelope?.audit ?? auditEnvelope;
          const out = {
            production: {
              cloudflareSuccess: [dep, settings, schedules].every(x => x?.success === true),
              deployment: active?.id ?? null,
              worker: active?.versions?.[0]?.version_id ?? null,
              percentage: active?.versions?.[0]?.percentage ?? null,
              rollbackDeployment: previous?.id ?? null,
              rollbackWorker: previous?.versions?.[0]?.version_id ?? null,
              scheduler: value('NAGAMEALERT_RECENT_SCHEDULER_MODE'),
              delta: value('NAGAMEALERT_SAFETY_GATE_RECENT_MODE'),
              crons: Array.isArray(crons) ? crons.map(x => x.cron) : null,
            },
            historical: s && {
              source: s.source ?? null,
              mode: s.mode ?? null,
              status: s.status ?? null,
              cursor: s.cursor ?? null,
              pagesScanned: s.pagesScanned ?? null,
              totalUnits: s.totalUnits ?? null,
              cursorKey: s.cursorKey ?? null,
              planVersion: s.planVersion ?? null,
              recordsObserved: s.recordsObserved ?? null,
              recordsPersisted: s.recordsPersisted ?? null,
              newCount: s.newCount ?? null,
              updatedCount: s.updatedCount ?? null,
              detailFailures: s.detailFailures ?? null,
              pageErrors: s.pageErrors ?? null,
              coverage: s.coverage ?? null,
              startedAt: s.startedAt ?? null,
              lastSuccessAt: s.lastSuccessAt ?? null,
              completedAt: s.completedAt ?? null,
              lastError: s.lastError ?? null,
              leaseOwnerId: s.leaseOwnerId ?? null,
              leaseMode: s.leaseMode ?? null,
              leaseExpiresAt: s.leaseExpiresAt ?? null,
              lastSkippedAt: s.lastSkippedAt ?? null,
              lastSkipReason: s.lastSkipReason ?? null,
              updatedAt: s.updatedAt ?? null,
            },
            revisionCertification: observe?.revisionCertification ?? null,
            topLevelLease: observe?.lease ?? null,
            recent: observe?.recent ? {
              status: observe.recent.status ?? null,
              lastSuccessAt: observe.recent.lastSuccessAt ?? null,
              completedAt: observe.recent.completedAt ?? null,
              lastError: observe.recent.lastError ?? null,
              leaseOwnerId: observe.recent.leaseOwnerId ?? null,
              leaseMode: observe.recent.leaseMode ?? null,
              leaseExpiresAt: observe.recent.leaseExpiresAt ?? null,
            } : null,
            audit: {
              checkedAt: audit?.checkedAt ?? null,
              counts: audit?.counts ?? null,
              integrity: audit?.integrity ?? null,
            },
          };
          console.log('SAFETY_HISTORICAL_RECONCILE_SNAPSHOT ' + JSON.stringify(out));
          NODE

# CP28 observer epoch 2: new read-only run after exhausted prior reruns.

# CP30 observer epoch 3: rotate read-only snapshots before GitHub rerun ceiling.

# CP32 observer epoch 4: renew read-only snapshots before GitHub rerun ceiling.
