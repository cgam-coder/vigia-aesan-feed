name: TEMP Safety Gate F2B historical detail reachability

on:
  pull_request:
    paths:
      - ".github/workflows/temp-safety-gate-f2b-history-reachability.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sample old, middle and recent weekly reports against official JSON detail
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const indexUrl="https://ec.europa.eu/safety-gate-alerts/api/download/weeklyReport/list/xml/en";
          const detailBase="https://ec.europa.eu/safety-gate-alerts/public/api/notification/";
          const get=async(url,accept="application/xml")=>{
            const response=await fetch(url,{headers:{accept,"user-agent":"NagameAlert-F2B-ReadOnly-Probe/1.0"},
              signal:AbortSignal.timeout(30_000),redirect:"follow"});
            return {status:response.status,text:await response.text(),contentType:response.headers.get("content-type")};
          };
          const index=await get(indexUrl);
          if(index.status!==200) throw new Error("weekly report index HTTP "+index.status);
          const blocks=[...index.text.matchAll(/<weeklyReport>([\s\S]*?)<\/weeklyReport>/gu)].map((m)=>m[1]);
          const value=(block,key)=>block.match(new RegExp("<"+key+">([\\s\\S]*?)<\\/"+key+">","u"))?.[1]?.trim()??null;
          const reports=blocks.map((block)=>({
            reference:value(block,"reference"),publicationDate:value(block,"publicationDate"),
            year:Number(value(block,"year")),week:Number(value(block,"week")),url:value(block,"URL")?.replace(/&amp;/gu,"&")??null,
          })).filter((r)=>r.reference&&Number.isSafeInteger(r.year)&&Number.isSafeInteger(r.week)&&r.url);
          if(reports.length<9) throw new Error("too few official weekly reports: "+reports.length);
          reports.sort((a,b)=>a.year-b.year||a.week-b.week||String(a.reference).localeCompare(String(b.reference)));
          const n=reports.length, mid=Math.floor(n/2);
          const positions=[0,1,2,mid-1,mid,mid+1,n-3,n-2,n-1].filter((v,i,a)=>v>=0&&v<n&&a.indexOf(v)===i);
          const selected=positions.map((i)=>reports[i]);
          let sampledAlerts=0, detail200=0, detail404=0, otherFailures=0, refMismatches=0, xmlIdentityFailures=0;
          const reportResults=[];
          for(const report of selected){
            const xml=await get(report.url);
            if(xml.status!==200){
              reportResults.push({report:report.reference,year:report.year,week:report.week,xmlStatus:xml.status,alerts:0});
              otherFailures++; continue;
            }
            const notifications=[...xml.text.matchAll(/<notifications\b[\s\S]*?<\/notifications>/gu)].map((m)=>m[0]);
            const identities=notifications.map((block)=>{
              const reference=value(block,"caseNumber")??value(block,"alertNumber")??value(block,"notificationNumber");
              const link=value(block,"reference");
              const id=Number(link?.match(/alertDetail\/(\d+)/u)?.[1]);
              return {reference,id};
            });
            const valid=identities.filter((x)=>x.reference&&Number.isSafeInteger(x.id)&&x.id>0);
            xmlIdentityFailures+=identities.length-valid.length;
            const pickIdx=[0,1,2,Math.floor(valid.length/2),valid.length-3,valid.length-2,valid.length-1]
              .filter((v,i,a)=>v>=0&&v<valid.length&&a.indexOf(v)===i);
            const sample=pickIdx.map((i)=>valid[i]);
            const details=[];
            for(const identity of sample){
              sampledAlerts++;
              const response=await get(detailBase+identity.id+"?language=es","application/json");
              let body=null;
              try{body=JSON.parse(response.text);}catch{}
              const returnedRef=typeof body?.reference==="string"?body.reference:null;
              if(response.status===200){
                detail200++;
                if(returnedRef!==identity.reference)refMismatches++;
              }else if(response.status===404)detail404++;
              else otherFailures++;
              details.push({id:identity.id,reference:identity.reference,status:response.status,returnedReference:returnedRef});
            }
            reportResults.push({report:report.reference,year:report.year,week:report.week,xmlStatus:xml.status,
              xmlNotifications:identities.length,validIdentities:valid.length,sampled:details});
          }
          const summary={reportCount:reports.length,sampledReports:selected.length,sampledAlerts,detail200,detail404,
            otherFailures,refMismatches,xmlIdentityFailures,oldest:reports[0],middle:reports[mid],newest:reports.at(-1)};
          console.log("SAFETY_GATE_HISTORY_REACHABILITY "+JSON.stringify(summary));
          for(const result of reportResults)console.log("SAFETY_GATE_HISTORY_REPORT "+JSON.stringify(result));
          if(detail404!==0||otherFailures!==0||refMismatches!==0||xmlIdentityFailures!==0||detail200!==sampledAlerts){
            throw new Error("historical reachability sample is not clean");
          }
          NODE
