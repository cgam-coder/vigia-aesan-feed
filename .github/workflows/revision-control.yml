name: VIGIA revision control shadow

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/revision-control.yml"
      - "scripts/revision-control.mjs"
      - "test/revision-control.test.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vigia-revision-control-shadow
  cancel-in-progress: false

jobs:
  writer_gate:
    uses: ./.github/workflows/runtime-writer-gate.yml

  runtime_target:
    uses: ./.github/workflows/runtime-writer-target.yml

  shadow:
    needs: [writer_gate, runtime_target]
    if: needs.writer_gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Read the common revision control plane without writes
        env:
          VIGIA_BASE_URL: ${{ needs.runtime_target.outputs.base_url }}
          VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VIGIA_SYNC_TOKEN"
          node scripts/revision-control.mjs shadow
