name: V20 P0 durable-state and rollback read-only audit
on:
  push:
    branches: [audit/v20-p0-durable-read-20261010]
    paths: [.github/workflows/v20-p0-durable-readonly-once.yml]
permissions:
  contents: read
concurrency:
  group: vigia-v20-p0-durable-read-20261010
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'cgam-coder/vigia-aesan-feed' && github.actor == 'cgam-coder' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Bounded SELECT-only D1 and Cloudflare Worker-version audit (never mutation)
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VIGIA_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const account='9c1807c68493f14259248b5f5782cc6f';
          const database='55596003-1b90-4f66-aad8-decb21205f13';
          const api='https://api.cloudflare.com/client/v4/accounts/'+account;
          const print=(kind,data)=>console.log('V20_DURABLE '+JSON.stringify({kind,...data}));
          const isUuid=x=>typeof x==='string'&&/^[a-f0-9]{8}-(?:[a-f0-9]{4}-){3}[a-f0-9]{12}$/.test(x);
          const date=x=>typeof x==='string'&&/^20\d\d-\d\d-\d\dT/.test(x)?x.slice(0,24):null;
          const bounded=(v,list)=>list.includes(v)?v:'other';
          const reason=x=>typeof x!=='string'?'none':
            x.startsWith('SOURCE_PERSISTENCE_OUTCOME_UNKNOWN')?'durable-uncertain':
            /prior.*outcome|unconfirmed/i.test(x)?'unconfirmed':
            /certif/i.test(x)?'certification':
            /deadline|timeout/i.test(x)?'timeout':
            /HTTP|upstream|fetch|network/i.test(x)?'upstream-or-network':
            /cursor|snapshot|coverage|identity/i.test(x)?'integrity-or-cursor':
            /reconcil/i.test(x)?'reconciliation':
            'other';
          if(!process.env.CF_TOKEN||!process.env.VIGIA_TOKEN){print('auth',{status:'HOLD',reason:'token-unavailable'});process.exitCode=1;process.exit();}
          const get=async(url,token)=>{
            try{const r=await fetch(url,{method:'GET',redirect:'error',headers:{Authorization:'Bearer '+token,Accept:'application/json'},signal:AbortSignal.timeout(15000)});
              const j=await r.json().catch(()=>null);return {http:r.status,result:j?.result??null,body:j??null,success:r.ok&&j?.success===true};}
            catch{return {http:0,result:null,body:null,success:false};}
          };
          const native=await get('https://nagamealert.com/api/source-reliability?observe=1',process.env.VIGIA_TOKEN);
          const state=native.body?.state??null;
          const lines=['RASFF:reconcile','RAPNA:legacy-reconcile','OECD:historical-reconcile'];
          const jobs=lines.map(lane=>({lane,attempt:state?.revisionAttempts?.[lane]??null})); 
          print('native',{
            http:native.http,mode:native.body?.mode==='five-source-coordinated'?'native':'other',
            buildMatches:native.body?.buildSha==='90e9eb6d6f07bc89083334b8cac0c2e6ea06574f',
            activeLease:native.body?.activeLease===true,ageMinutes:typeof native.body?.ageMinutes==='number'?Number(native.body.ageMinutes.toFixed(2)):null,
            lastWakeAt:date(state?.lastWakeAt),lastOutcome:typeof state?.lastOutcome==='string'&&state.lastOutcome.length<75?state.lastOutcome:'other',
            recentAttempts:Object.entries(state?.attempts??{}).map(([name,attempt])=>({
              source:bounded(name,['AESAN','RAPNA','RASFF','SAFETY GATE','OECD']),
              outcome:bounded(attempt?.outcome,['completed','running','failed','partial','unknown','skipped']),
              issue:reason(attempt?.reason)
            })),
            revisionAttempts:jobs.map(({lane,attempt})=>({lane,exists:Boolean(attempt),idValid:isUuid(attempt?.id),
              outcome:bounded(attempt?.outcome,['completed','running','failed','partial','unknown','skipped']),
              nextEligibleBlocked:attempt?.nextEligibleAt==='9999-01-01T00:00:00.000Z',
              issue:reason(attempt?.reason),startedAt:date(attempt?.startedAt)}))
          });
          if(native.http!==200||!state||jobs.some(x=>!isUuid(x.attempt?.id))){
            print('d1',{status:'HOLD',reason:'native-attempt-identities-unavailable'});process.exitCode=1;process.exit();
          }
          // Cloudflare's D1 query API uses HTTP POST to transport strictly SELECT-only SQL.
          // Every statement is literal, parameterized, and checked against a read-only allowlist.
          const statements=[];
          const add=(label,sql,params)=>{
            if(!/^\s*SELECT\b/iu.test(sql)||/;|--|\/\*|\b(?:INSERT|DELETE|UPDATE|DROP|CREATE|ALTER|REPLACE|VACUUM|PRAGMA)\b/iu.test(sql))throw Error('Unsafe SQL blocked');
            statements.push({label,sql,params});
          };
          for(const {lane,attempt} of jobs){
            const [source,mode]=lane.split(':');
            add(lane+'/job',"SELECT source,mode,kind,phase,write_intent_at AS writeIntentAt,finished_at AS finishedAt,receipt_json AS receipt,started_at AS startedAt,deadline,epoch FROM source_reliability_jobs WHERE id=?",[attempt.id]);
            add(lane+'/effects',"SELECT COUNT(*) AS n,SUM(CASE WHEN committed_at IS NULL THEN 1 ELSE 0 END) AS uncommitted,SUM(CASE WHEN committed_at IS NOT NULL AND result_json IS NULL THEN 1 ELSE 0 END) AS noResult,MAX(ordinal) AS maxOrdinal FROM source_reliability_effects WHERE job_id=?",[attempt.id]);
            add(lane+'/recovery',"SELECT COUNT(*) AS n FROM source_reliability_recoveries WHERE old_job_id=?",[attempt.id]);
            add(lane+'/state',"SELECT status,cursor,total_units AS totalUnits,lease_owner_id AS leaseOwner,last_error AS lastError,updated_at AS updatedAt FROM source_sync_state WHERE source=? AND mode=?",[source,mode]);
            add(lane+'/lease',"SELECT mode,expires_at AS expiresAt FROM source_sync_locks WHERE source=?",[source]);
          }
          add('global/unfinished',"SELECT source,mode,kind,phase,COUNT(*) AS n FROM source_reliability_jobs WHERE finished_at IS NULL GROUP BY source,mode,kind,phase LIMIT 25",[]);
          add('global/uncommitted',"SELECT source,mode,COUNT(*) AS n FROM source_reliability_effects WHERE committed_at IS NULL GROUP BY source,mode LIMIT 25",[]);
          const resp=await fetch(api+'/d1/database/'+database+'/query',{
            method:'POST',redirect:'error',
            headers:{Authorization:'Bearer '+process.env.CF_TOKEN,Accept:'application/json','Content-Type':'application/json'},
            body:JSON.stringify({batch:statements.map(({sql,params})=>({sql,params}))}),
            signal:AbortSignal.timeout(25000)
          }).then(async r=>({http:r.status,body:await r.json().catch(()=>null)})).catch(()=>({http:0,body:null}));
          print('d1-access',{http:resp.http,success:resp.body?.success===true,
            errorCodes:Array.isArray(resp.body?.errors)?resp.body.errors.map(x=>x?.code).filter(Number.isInteger).slice(0,4):[],
            statementCount:statements.length});
          if(resp.http!==200||resp.body?.success!==true||!Array.isArray(resp.body?.result)||resp.body.result.length!==statements.length){
            print('d1',{status:'HOLD',reason:'read-only-d1-api-unavailable'});process.exitCode=1;process.exit();
          }
          const results=new Map();
          for(let i=0;i<statements.length;i++){
            const q=resp.body.result[i];
            results.set(statements[i].label,q?.success===true&&Array.isArray(q?.results)?q.results:null);
          }
          for(const {lane,attempt} of jobs){
            const job=results.get(lane+'/job')?.[0]??null;
            const receipt=typeof job?.receipt==='string'?(()=>{try{return JSON.parse(job.receipt)}catch{return null}})():null;
            const effects=results.get(lane+'/effects')?.[0]??null;
            const recovery=results.get(lane+'/recovery')?.[0]??null;
            const sync=results.get(lane+'/state')?.[0]??null;
            const lock=results.get(lane+'/lease')?.[0]??null;
            print('lane',{
              lane,jobFound:Boolean(job),match:job?.source+':'+job?.mode===lane,
              phase:bounded(job?.phase,['reading','writing','finished','reconciled']),
              writeIntent:job?.writeIntentAt!==null&&job?.writeIntentAt!==undefined,
              finishedAt:date(job?.finishedAt),startedAt:date(job?.startedAt),
              receiptPresent:Boolean(receipt),receiptOutcome:bounded(receipt?.outcome,['completed','running','failed','partial','unknown','skipped']),
              receiptIssue:reason(receipt?.reason),receiptMatches:receipt?.id===attempt.id,
              effectCount:Number.isSafeInteger(effects?.n)?effects.n:null,
              effectUncommitted:Number.isSafeInteger(effects?.uncommitted)?effects.uncommitted:effects?.uncommitted===null?0:null,
              effectCommittedMissingResult:Number.isSafeInteger(effects?.noResult)?effects.noResult:effects?.noResult===null?0:null,
              maxOrdinal:Number.isSafeInteger(effects?.maxOrdinal)?effects.maxOrdinal:null,
              recoveryCount:Number.isSafeInteger(recovery?.n)?recovery.n:null,
              sourceStatus:bounded(sync?.status,['running','completed','partial','failed','skipped','idle']),
              sourceError:reason(sync?.lastError),
              cursor:Number.isSafeInteger(sync?.cursor)?sync.cursor:null,
              totalUnits:Number.isSafeInteger(sync?.totalUnits)?sync.totalUnits:null,
              sourceLeaseOwnerPresent:sync?.leaseOwner!==null&&sync?.leaseOwner!==undefined,
              leasePresent:Boolean(lock),leaseExpiresAt:date(lock?.expiresAt)
            });
          }
          for(const k of ['global/unfinished','global/uncommitted']){
            const rows=results.get(k);
            print(k,{status:rows?'observed':'HOLD',rows:rows?.slice(0,25).map(x=>({
              source:bounded(x.source,['AESAN','RAPNA','RASFF','SAFETY GATE','OECD']),
              mode:bounded(x.mode,['recent','reconcile','legacy-reconcile','historical-reconcile','current-parity']),
              phase:bounded(x.phase,['reading','writing','finished','reconciled']),
              count:Number.isSafeInteger(x.n)?x.n:null
            }))??[]});
          }
          // Inspect current/prior Worker versions without deployments or modifications.
          const versions=[
            ['vigia-runtime','282b63c9-6f2a-469d-b5d0-fe0067833a2b','active'],
            ['vigia-runtime','46dd3c9e-aea2-4cad-a1b6-4d6f8a9bfaae','previous'],
            ['vigia-source-runner','ba9f64ab-1615-4200-9cf5-da0b1d829638','active'],
            ['vigia-source-runner','6e8aed06-f861-4301-b34b-0a539d6974b9','previous']
          ];
          for(const [name,id,role] of versions){
            const v=await get(api+'/workers/scripts/'+name+'/versions/'+id,process.env.CF_TOKEN);
            const resources=v.result?.resources??{};
            const bindings=resources.bindings??{};
            const b=Array.isArray(bindings)?bindings:Object.values(bindings);
            print('version',{worker:name,role,http:v.http,success:v.success,
              correctId:v.result?.id===id,
              bindingTypes:b.filter(x=>x&&typeof x==='object').map(x=>bounded(x.type,['d1','service','assets','secret_text','plain_text','wasm_module','kv_namespace'])).slice(0,15),
              hasScript:Boolean(resources.script),createdAt:date(v.result?.metadata?.created_on)});
          }
          NODE
