name: V24 issue 291 historical forensic read only once
on:
  push:
    branches: [audit/v24-issue291-forensic-20261012]
    paths: [.github/workflows/v24-issue291-forensic-once.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify production baseline and SELECT-only journals
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VIGIA_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const out=(stage,value)=>console.log('V24_291 '+JSON.stringify({stage,...value}));
          const A='9c1807c68493f14259248b5f5782cc6f';
          const D='55596003-1b90-4f66-aad8-decb21205f13';
          const root='https://vigia-runtime.c-gamiz93.workers.dev';
          const api='https://api.cloudflare.com/client/v4/accounts/'+A;
          const expected='d5fcd11cbeb563258b4bbdc9482a80b8684c81d3';
          const ids=['15ff9a7c-4094-4836-996b-b36591cab779','bb90ee24-dffa-4b25-9a03-8e994a29df64','7d965614-eb79-468c-838a-249147a0fb58'];
          const tok=process.env.VIGIA_TOKEN,cf=process.env.CF_TOKEN;
          if(!tok||!cf){out('stop',{reason:'secrets-unavailable',queries:0});process.exit(2);}
          let gets=0,queries=0,rowsRead=0,rowsWritten=0;
          const read=async(url,token,sql=null,params=[])=>{
            const u=new URL(url);
            const allowed=(u.href===root+'/api/source-reliability?observe=1'||
              u.href===root+'/api/freshness?observe=1'||
              u.href===api+'/workers/scripts/vigia-runtime/settings'||
              u.href===api+'/workers/scripts/vigia-runtime/deployments'||
              u.href===api+'/workers/scripts/vigia-source-runner/deployments'||
              u.href===api+'/d1/database/'+D||
              u.href===api+'/d1/database/'+D+'/query');
            if(!allowed)throw Error('URL_DENIED');
            if(sql===null){if(++gets>6)throw Error('GET_BUDGET');}
            else if(++queries>7||!/^SELECT\s/u.test(sql)||sql.includes(';')||/\b(INSERT|UPDATE|DELETE|DROP|ALTER|PRAGMA|REPLACE|CREATE|ATTACH|VACUUM)\b/iu.test(sql))throw Error('SQL_DENIED');
            const r=await fetch(url,{method:sql===null?'GET':'POST',headers:{Authorization:'Bearer '+token,Accept:'application/json',...(sql===null?{}:{'Content-Type':'application/json'})},
              ...(sql===null?{}:{body:JSON.stringify({sql,params})}),redirect:'error',signal:AbortSignal.timeout(18000)});
            const j=await r.json().catch(()=>null);
            if(r.status!==200||j?.success===false)throw Error('HTTP_OR_API_ERROR_'+r.status);
            if(sql!==null){
              const parts=j?.result;
              if(!Array.isArray(parts)||parts.length!==1||!Array.isArray(parts[0]?.results)||parts[0]?.meta?.rows_written!==0)throw Error('SQL_RESULT_INVALID');
              rowsRead+=parts[0].meta?.rows_read||0; rowsWritten+=parts[0].meta.rows_written;
              if(rowsRead>10000||rowsWritten!==0)throw Error('QUERY_BUDGET_OR_WRITE');
              return parts[0].results;
            }
            return j;
          };
          try{
            const [c,f,settings,runtime,runner,db]=await Promise.all([
              read(root+'/api/source-reliability?observe=1',tok),
              read(root+'/api/freshness?observe=1',tok),
              read(api+'/workers/scripts/vigia-runtime/settings',cf),
              read(api+'/workers/scripts/vigia-runtime/deployments',cf),
              read(api+'/workers/scripts/vigia-source-runner/deployments',cf),
              read(api+'/d1/database/'+D,cf)
            ]);
            const bindings=settings?.result?.bindings||[];
            const dbOK=bindings.some(v=>v.name==='DB'&&v.type==='d1'&&v.id===D)&&db?.result?.uuid===D;
            const rev=c?.state?.revisionAttempts||{},attempts=c?.state?.attempts||{};
            const recent=(f.states||[]).map(s=>({source:s.source,syncAgeMinutes:s.lastSyncSuccessAt?+((Date.now()-Date.parse(s.lastSyncSuccessAt))/60000).toFixed(1):null,
              parity:s.latestIdentityParity===true,missing:(s.missingOfficialIdentities||[]).length,revisionMismatches:(s.revisionMismatches||[]).length,historical:s.revisionStatus}));
            const blocked=['RASFF:reconcile','OECD:historical-reconcile','RAPNA:legacy-reconcile'].map(k=>({key:k,id:rev[k]?.id,
              outcome:rev[k]?.outcome,retryBlocked:String(rev[k]?.nextEligibleAt||'').startsWith('9999'),
              pending:(rev[k]?.pendingDetails||[]).length,
              classifiedReason: /403/u.test(rev[k]?.reason||'')?'HTTP403':/D1_ERROR|Network connection lost/u.test(rev[k]?.reason||'')?'D1_NETWORK':rev[k]?.reason?.slice(0,90)||null}));
            const versions=s=>s?.result?.deployments?.[0]?.versions?.find(x=>x.percentage===100)?.version_id?.slice(0,12)||null;
            out('preflight',{http200:true,shaMatch:c?.buildSha===expected,mode:c?.mode,dbOK,dbName:db?.result?.name,
              workerVersion:versions(runtime),runnerVersion:versions(runner),leaseActive:c?.activeLease,global5Historic:c?.officialParityCertified,
              blocked,unknownRecent:Object.entries(attempts).filter(([k,v])=>v?.outcome==='unknown').map(([k])=>k),
              unknownHistorical:Object.entries(rev).filter(([k,v])=>v?.outcome==='unknown').map(([k])=>k),recent});
            if(c?.buildSha!==expected||c?.mode!=='five-source-coordinated'||!dbOK){out('verdict',{state:'HOLD_BASELINE',queries:0});process.exit(2);}
            const prefix='?,?,?';
            const statements=[
              ['states',"SELECT source,mode,status,cursor,cursor_key,plan_version,total_units,coverage,last_success_at,completed_at,last_error,updated_at FROM source_sync_state WHERE (source='RASFF' AND mode='reconcile') OR (source='OECD' AND mode='historical-reconcile') OR (source='RAPNA' AND mode='legacy-reconcile') ORDER BY source",[]],
              ['jobs',"SELECT id,source,mode,phase,started_at,finished_at,write_intent_at,json_extract(receipt_json,'$.outcome') AS receipt_outcome,json_extract(receipt_json,'$.requests') AS requests,json_extract(receipt_json,'$.batches') AS batches FROM source_reliability_jobs WHERE id IN ("+prefix+") ORDER BY source",ids],
              ['effects',"SELECT job_id,COUNT(*) AS markers,COUNT(DISTINCT ordinal) AS distinct_markers,MIN(ordinal) AS first_ordinal,MAX(ordinal) AS last_ordinal,SUM(CASE WHEN committed_at IS NULL OR result_json IS NULL THEN 1 ELSE 0 END) AS pending FROM source_reliability_effects WHERE job_id IN ("+prefix+") GROUP BY job_id ORDER BY job_id",ids],
              ['recoveries',"SELECT old_job_id,recovery_id,manifest_hash,committed_at,json_extract(receipt_json,'$.outcome') AS outcome FROM source_reliability_recoveries WHERE old_job_id IN ("+prefix+") ORDER BY old_job_id",ids],
              ['certificates',"SELECT source,mode,cycle_id,completed_at,total_units,audit_status,coverage FROM source_revision_certifications WHERE source IN ('RAPNA','RASFF','OECD') ORDER BY source,mode LIMIT 12",[]],
              ['leases',"SELECT source,mode,expires_at FROM source_sync_locks WHERE source IN ('RAPNA','RASFF','OECD') ORDER BY source LIMIT 3",[]],
              ['control',"SELECT owner_id,expires_at,epoch,json_extract(state_json,'$.lastWakeAt') AS last_wake, json_extract(state_json,'$.revisionAttempts.RASFF:reconcile.outcome') AS rasff_dummy FROM source_reliability_control WHERE id=1",[]]
            ];
            for(const [label,sql,params] of statements){
              const rows=await read(api+'/d1/database/'+D+'/query',cf,sql,params);
              out(label,{rows});
            }
            out('verdict',{state:'PASS_READ_ONLY_EVIDENCE',gets,queries,rowsRead,rowsWritten,sourceJobs:0,replays:0,deploymentChanges:0,configurationChanges:0});
          }catch(e){out('verdict',{state:'HOLD',reason:e instanceof Error?e.message:'unknown',gets,queries,rowsRead,rowsWritten});process.exitCode=1;}
          NODE
