name: Chat OECD recent recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chat-oecd-recent-repair.yml"

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: vigia-oecd-recent
      cancel-in-progress: false
    env:
      VIGIA_BASE_URL: https://vigia-alertas.csar68.chatgpt.site
      VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
    steps:
      - name: Run normal OECD recent sync and freshness audit
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VIGIA_SYNC_TOKEN"
          node <<'NODE'
          const base = process.env.VIGIA_BASE_URL;
          const headers = { Authorization:`Bearer ${process.env.VIGIA_SYNC_TOKEN}`, "Content-Type":"application/json" };
          const syncResponse = await fetch(base + "/api/oecd/sync?mode=recent", {
            method:"POST", headers, redirect:"follow", signal:AbortSignal.timeout(840_000),
          });
          const syncRaw = await syncResponse.text();
          let syncBody;
          try { syncBody = JSON.parse(syncRaw); } catch { throw new Error("OECD recent returned non-JSON HTTP " + syncResponse.status); }
          const state = syncBody?.state;
          if (syncResponse.status === 202 && state?.status === "skipped") throw new Error("OECD recent unexpectedly skipped: " + JSON.stringify(syncBody));
          if (syncResponse.status !== 200 || state?.source !== "OECD" || state?.mode !== "recent" ||
              !["partial","completed"].includes(state?.status) || state?.lastError ||
              state?.leaseOwnerId !== null || state?.leaseMode !== null || state?.leaseExpiresAt !== null) {
            throw new Error("OECD recent contract failed: HTTP " + syncResponse.status + " " + syncRaw.slice(0,1500));
          }
          console.log("OECD_RECENT_OK " + JSON.stringify({ status:state.status, cursor:state.cursor, pagesScanned:state.pagesScanned,
            observed:state.recordsObserved, persisted:state.recordsPersisted, newCount:state.newCount, updatedCount:state.updatedCount,
            lastSuccessAt:state.lastSuccessAt }));

          const auditUrl = new URL(base + "/api/freshness");
          auditUrl.searchParams.set("audit","1");
          auditUrl.searchParams.set("source","OECD");
          const auditResponse = await fetch(auditUrl, { method:"POST", headers, signal:AbortSignal.timeout(600_000) });
          const auditBody = await auditResponse.json();
          const freshness = Array.isArray(auditBody?.states) ? auditBody.states[0] : null;
          console.log("OECD_FRESHNESS " + JSON.stringify(freshness));
          if (!freshness || freshness.source !== "OECD") throw new Error("Missing OECD freshness state");
          if (freshness.missingOfficialIdentities?.length) {
            throw new Error("OECD still misses official identities: " + JSON.stringify(freshness.missingOfficialIdentities));
          }
          NODE
