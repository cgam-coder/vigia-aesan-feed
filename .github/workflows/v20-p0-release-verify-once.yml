name: V20 P0 five-source post-natural-cron smoke (GET only)
on:
  push:
    branches: [audit/v20-p0-release-20261010]
    paths: [.github/workflows/v20-p0-release-verify-once.yml]
permissions: { contents: read }
concurrency:
  group: v20-p0-release-verify-20261010
  cancel-in-progress: false
jobs:
  smoke:
    if: github.actor == 'cgam-coder' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Verify natural coordinator wake after production release and each public source (GET only)
        env:
          VIGIA_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.VIGIA_TOKEN,expected='0c61589b485a1e40ab8728378e14b85631f89d36';
          const sources=['AESAN','RAPNA','RASFF','SAFETY GATE','OECD'];
          const emit=(what,data)=>console.log('V20_POSTNATURAL '+JSON.stringify({what,...data}));
          if(!token){emit('gate',{status:'HOLD',reason:'secret-unavailable'});process.exitCode=1;process.exit();}
          const deadline=Date.now()+6*60*1000, threshold=Date.parse('2026-10-10T21:04:38Z');
          let natural=false,body=null,checks=0;
          while(Date.now()<deadline){
            checks++;
            try{
              const r=await fetch('https://nagamealert.com/api/source-reliability?observe=1',{method:'GET',redirect:'error',
                headers:{Authorization:'Bearer '+token,Accept:'application/json'},signal:AbortSignal.timeout(14000)});
              body=await r.json();
              natural=r.status===200&&body?.buildSha===expected&&body?.outcome==='observed'&&
                Date.parse(body?.state?.lastWakeAt??'')>threshold&&
                body?.activeLease===false;
            }catch{natural=false;}
            if(natural)break;
            await new Promise(resolve=>setTimeout(resolve,14000));
          }
          const audit=body?.state?.lastAudit?.states??[];
          const parity=Array.isArray(audit)&&audit.length===5&&audit.every(x=>x.latestIdentityParity===true&&
            x.missingOfficialIdentities?.length===0&&x.revisionMismatches?.length===0);
          const recent=Object.entries(body?.state?.attempts??{}).every(([name,v])=>sources.includes(name)&&v?.outcome==='completed');
          emit('coordinator',{natural,checks,buildSha:body?.buildSha??null,lastWakeAt:body?.state?.lastWakeAt??null,
            ageMinutes:body?.ageMinutes??null,parity,recent,activeLease:body?.activeLease??null,globalHistoricalCertified:body?.officialParityCertified===true});
          const results=[];
          for(const source of sources){
            try{
              const url='https://nagamealert.com/api/terminal/alerts?source='+encodeURIComponent(source)+'&period=7d&pageSize=1';
              const r=await fetch(url,{method:'GET',redirect:'error',headers:{Accept:'application/json'},signal:AbortSignal.timeout(14000)});
              const j=await r.json().catch(()=>null);
              results.push({source,http:r.status,contract:j?.apiVersion===1&&Array.isArray(j?.items)&&j?.pagination!==undefined,
                returned:j?.items?.length??null,total:j?.total??null});
            }catch{results.push({source,http:0,contract:false});}
          }
          emit('public_sources',{results});
          const pass=natural&&parity&&recent&&results.length===5&&results.every(x=>x.http===200&&x.contract);
          emit('decision',{status:pass?'PASS':'HOLD',scope:'P0-postnatural, historical revision still independent'});
          if(!pass)process.exitCode=1;
          NODE
