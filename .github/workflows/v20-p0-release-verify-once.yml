name: V20 P0 published build state diagnostic (GET only)
on:
  push:
    branches: [audit/v20-p0-release-20261010]
    paths: [.github/workflows/v20-p0-release-verify-once.yml]
permissions: { contents: read }
concurrency:
  group: v20-p0-release-verify-20261010
  cancel-in-progress: false
jobs:
  verify:
    if: github.actor == 'cgam-coder' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read exact Cloudflare build and deployment state without edits
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VIGIA_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const root='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f';
          const emit=(what,x)=>console.log('V20_BUILD '+JSON.stringify({what,...x}));
          async function read(url,token){
            try{const r=await fetch(url,{method:'GET',redirect:'error',headers:{Authorization:'Bearer '+token,Accept:'application/json'},signal:AbortSignal.timeout(15000)});
            const j=await r.json().catch(()=>null);return {http:r.status,ok:r.ok&&j?.success===true,body:j};}
            catch{return{http:0,ok:false,body:null}};
          }
          const cf=process.env.CF_TOKEN, vigia=process.env.VIGIA_TOKEN;
          if(!cf||!vigia){emit('tokens',{status:'HOLD'});process.exitCode=1;process.exit();}
          const scripts=await read(root+'/workers/scripts',cf);
          const tag=Array.isArray(scripts.body?.result)?scripts.body.result.find(x=>x.id==='vigia-runtime')?.tag:null;
          emit('scripts',{http:scripts.http,hasRuntime:Boolean(tag)});
          if(tag&&/^[a-z0-9-]{16,70}$/i.test(tag)){
            const builds=await read(root+'/builds/workers/'+encodeURIComponent(tag)+'/builds',cf);
            const all=Array.isArray(builds.body?.result)?builds.body.result:
              Array.isArray(builds.body?.result?.builds)?builds.body.result.builds:[];
            emit('builds',{http:builds.http,success:builds.ok,totalFetched:all.length,items:all.slice(0,15).map(b=>({
              id:typeof b.build_uuid==='string'?b.build_uuid:null,
              commit:/^[a-f0-9]{40}$/i.test(b.build_trigger_metadata?.commit_hash??'')?b.build_trigger_metadata.commit_hash:null,
              outcome:typeof b.build_outcome==='string'&&b.build_outcome.length<60?b.build_outcome:null,
              status:typeof b.status==='string'&&b.status.length<50?b.status:null,
              created:typeof b.created_on==='string'?b.created_on:null,
              completed:typeof b.completed_on==='string'?b.completed_on:null,
              triggerType:typeof b.build_trigger_metadata?.trigger_type==='string'?b.build_trigger_metadata.trigger_type:null
            }))});
            const triggers=await read(root+'/builds/workers/'+encodeURIComponent(tag)+'/triggers',cf);
            const list=Array.isArray(triggers.body?.result)?triggers.body.result:
              Array.isArray(triggers.body?.result?.triggers)?triggers.body.result.triggers:[];
            emit('triggers',{http:triggers.http,items:list.slice(0,3).map(t=>({
              include:t.branch_includes??null,exclude:t.branch_excludes??null,
              deployCommandPresent:typeof t.deploy_command==='string',buildCommandPresent:typeof t.build_command==='string',
              enabled:typeof t.enabled==='boolean'?t.enabled:null
            }))});
          }
          for(const name of ['vigia-runtime','vigia-source-runner']){
            const d=await read(root+'/workers/scripts/'+name+'/deployments',cf);
            emit('deployment',{name,http:d.http,items:(d.body?.result?.deployments??[]).slice(0,3).map(v=>({
              id:v.id,created:v.created_on,versions:v.versions?.map(x=>({id:x.version_id,pct:x.percentage}))
            }))});
          }
          const native=await read('https://nagamealert.com/api/source-reliability?observe=1',vigia);
          emit('live',{http:native.http,buildSha:native.body?.buildSha??null,observedAt:native.body?.observedAt??null,ageMinutes:native.body?.ageMinutes??null,lease:native.body?.activeLease??null});
          NODE
