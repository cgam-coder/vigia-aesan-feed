name: SR271 single AESAN reviewed runner activation and exact known failure CAS
on:
  push:
    branches: [source-reliability/durable-recovery-20261009]
    paths: [.github/workflows/sr271-aesan-reviewed-activation.yml]
permissions:
  contents: read
concurrency:
  group: sr271-aesan-reviewed-activation-20261009
  cancel-in-progress: false
jobs:
  activate:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: One justified Runner14 PUT verify allocation and durable CAS then release fence
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          node --input-type=module <<'NODE'
          import {rearmReviewedAesanFailure} from './ops/sr271-reviewed-failure-rearm.mjs';
          import crypto from 'node:crypto';
          const root='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f',database='55596003-1b90-4f66-aad8-decb21205f13',script='/workers/scripts/vigia-source-runner';
          if(Date.now()>Date.parse('2026-10-09T09:34:00Z')||Number(process.env.RUN_ATTEMPT)!==1)throw Error('Runner preflight expired');
          const report=(tag,value)=>console.log(tag+' '+JSON.stringify(value));
          async function cf(path){const r=await fetch(root+path,{headers:{Authorization:'Bearer '+process.env.CF_TOKEN},signal:AbortSignal.timeout(25000)}),p=await r.json();if(!r.ok||!p.success)throw Error('Cloudflare GET failed '+path);return p.result;}
          
          import {gunzipSync} from 'node:zlib';
          const expectedOld='835d6608-4b46-4d0c-bafc-318333b4653f',expectedHash='576b6daa14eaf0e6c71493340e8b4f207573075ca143be9761cc6ddc3b2d5d68',owner='sr271-aesan-reviewed-606-20261009',epoch=229;
          async function query(sql,params=[]){const r=await fetch(root+'/d1/database/'+database+'/query',{method:'POST',headers:{Authorization:'Bearer '+process.env.CF_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({sql,params}),signal:AbortSignal.timeout(25000)}),p=await r.json();if(!r.ok||!p.success)throw Error('D1 statement unconfirmed');if(sql.startsWith('SELECT')&&p.result.some(x=>x.meta?.rows_written||x.meta?.changes))throw Error('SELECT wrote');return p.result[0];}
          async function moduleHash(){const r=await fetch(root+script+'/content/v2',{headers:{Authorization:'Bearer '+process.env.CF_TOKEN},signal:AbortSignal.timeout(25000)});if(!r.ok)throw Error('Module GET failed');const form=await r.formData(),file=form.get('source-runner.mjs');if(!file||typeof file==='string')throw Error('Module missing');return crypto.createHash('sha256').update(new Uint8Array(await file.arrayBuffer())).digest('hex');}
          const allocation=await cf(script+'/deployments'),runtime=await cf('/workers/scripts/vigia-runtime/deployments'),settings=await cf(script+'/settings');
          report('R13_UPLOAD_PREFLIGHT',{at:new Date().toISOString(),runner:allocation.deployments[0],runtime:runtime.deployments[0]});
          const control=(await query('SELECT owner_id,epoch,expires_at FROM source_reliability_control WHERE id=1')).results[0],leases=(await query('SELECT * FROM source_sync_locks WHERE expires_at>?',[new Date().toISOString()])).results,jobs=(await query('SELECT id FROM source_reliability_jobs WHERE finished_at IS NULL AND deadline>?',[Date.now()])).results,pending=(await query('SELECT effect_key FROM source_reliability_effects WHERE committed_at IS NULL')).results;
          report('R13_UPLOAD_FENCE',{control,leases,jobs,pending});
          if(control.owner_id!==owner||control.epoch!==epoch||Date.parse(control.expires_at)<Date.now()+60000||leases.length||jobs.length||pending.length)throw Error('Exclusive checkpoint expired or source active; no upload');
          const beforeHash=await moduleHash();const old=allocation.deployments[0];
          if(old.versions.length!==1||old.versions[0].percentage!==100)throw Error('Mixed runner allocation');
          if(beforeHash!==expectedHash){
          if(old.versions[0].version_id!==expectedOld||beforeHash!=='422fd0033c235aed95c7d06b535483b019a38481649643361a8ab37a66b03e07')throw Error('Unexpected runner drift');
          await cf(script+'/versions/'+expectedOld);
          if(settings.compatibility_date!=='2026-09-25'||!settings.compatibility_flags.includes('nodejs_compat')||settings.bindings.find(b=>b.name==='DB')?.id!==database||!settings.bindings.some(b=>b.type==='secret_text'&&b.name==='VIGIA_SYNC_TOKEN'))throw Error('Settings changed');
          const module=gunzipSync(Buffer.from('','base64'));
          if(crypto.createHash('sha256').update(module).digest('hex')!==expectedHash)throw Error('Artifact hash mismatch');
          const form=new FormData();form.set('metadata',new Blob([JSON.stringify({main_module:'source-runner.mjs',compatibility_date:settings.compatibility_date,compatibility_flags:settings.compatibility_flags,limits:settings.limits,observability:settings.observability,keep_bindings:['secret_text'],bindings:settings.bindings.filter(b=>b.type!=='secret_text'),annotations:{'workers/message':'sr271-aesan-reviewed-606:e0bc9bd68a8436e9b8effc8ed6911bd222df7f49','workers/tag':'sr271-e0bc9bd68a8436e9'}})],{type:'application/json'}));form.set('source-runner.mjs',new Blob([module],{type:'application/javascript+module'}),'source-runner.mjs');
          report('R13_UPLOAD_INTENT',{at:new Date().toISOString(),rollback:expectedOld,hash:expectedHash,onePutOnly:true});
          try{const r=await fetch(root+script,{method:'PUT',headers:{Authorization:'Bearer '+process.env.CF_TOKEN},body:form,signal:AbortSignal.timeout(25000)}),p=await r.json();report('R13_UPLOAD_RESPONSE',{http:r.status,success:p.success,result:p.success?{id:p.result.id,etag:p.result.etag}:undefined,errors:p.errors});}catch(e){report('R13_UPLOAD_TRANSPORT_UNCONFIRMED',{name:e.name,readMarkerOnly:true});}
          }
          let after;
          const readDeadline=Math.min(Date.now()+45000,Date.parse('2026-10-09T09:34:33.061Z')-30000);
          for(;;){after=await cf(script+'/deployments');if(after.deployments[0].versions[0].version_id!==expectedOld)break;if(Date.now()>readDeadline)throw Error('New allocation not yet confirmed; no repeat PUT and no rearm');await new Promise(r=>setTimeout(r,3000));}
          const version=await cf(script+'/versions/'+after.deployments[0].versions[0].version_id),afterHash=await moduleHash(),afterSettings=await cf(script+'/settings'),subdomain=await cf(script+'/subdomain'),schedules=await cf(script+'/schedules');
          if(after.deployments[0].versions.length!==1||after.deployments[0].versions[0].percentage!==100||version.number!==14||afterHash!==expectedHash||!afterSettings.bindings.some(b=>b.type==='secret_text'&&b.name==='VIGIA_SYNC_TOKEN')||afterSettings.bindings.find(b=>b.name==='DB')?.id!==database||subdomain.enabled||subdomain.previews_enabled||schedules.schedules?.length)throw Error('Runner14 verification failed; no repeat');
          await cf(script+'/versions/'+expectedOld);
          report('R13_UPLOAD_VERIFIED',{at:new Date().toISOString(),allocation:after.deployments[0],version:version.id,number:version.number,hash:afterHash,rollback:expectedOld,secretPreserved:true,private:true,noCron:true});
          const effects=(await query("SELECT ordinal,manifest_json,committed_at FROM source_reliability_effects WHERE job_id='7eca0f35-ab72-417e-947e-3a0cd9add999' ORDER BY ordinal")).results;
          if(effects.length!==3||effects.some(e=>!e.committed_at||JSON.parse(e.manifest_json).writes.some(w=>!/^\\s*(?:INSERT\\s+INTO|UPDATE)\\s+source_sync_state\\b/iu.test(w.sql))))throw Error('Old failed attempt domain absence not proved; no rearm');
          const db={prepare(sql){return{sql,params:[],bind(...params){this.params=params;return this;},async first(){return(await query(this.sql,this.params)).results[0]??null;}};},async batch(ss){const r=await fetch(root+'/d1/database/'+database+'/query',{method:'POST',headers:{Authorization:'Bearer '+process.env.CF_TOKEN,'Content-Type':'application/json'},body:JSON.stringify({batch:ss.map(s=>({sql:s.sql,params:s.params}))}),signal:AbortSignal.timeout(25000)}),p=await r.json();if(!r.ok||!p.success||p.result.some(x=>!x.success||x.meta?.served_by_primary!==true))throw Error('Review transaction outcome unconfirmed');return p.result;}};
          const review=await rearmReviewedAesanFailure(db,{owner,epoch},new Date().toISOString(),'e0bc9bd68a8436e9b8effc8ed6911bd222df7f49',expectedHash);
          report('R13_REARM_VERIFIED',review);
          try{await query('UPDATE source_reliability_control SET owner_id=NULL,expires_at=NULL WHERE id=1 AND owner_id=? AND epoch=?',[owner,epoch]);}catch(e){report('R13_RELEASE_UNCONFIRMED',{name:e.name});}
          const released=(await query('SELECT owner_id,epoch,expires_at,state_json FROM source_reliability_control WHERE id=1')).results[0],attempt=JSON.parse(released.state_json).attempts.AESAN;delete released.state_json;
          if(released.owner_id===owner||attempt.id!=='7eca0f35-ab72-417e-947e-3a0cd9add999'||attempt.outcome!=='failed'||attempt.nextEligibleAt!==null)throw Error('Review release not confirmed; do not repeat upload');
          report('R13_UPLOAD_COMPLETE',{at:new Date().toISOString(),released,attempt,sourceEffectsNotReplayed:true,naturalJobRequired:true});
          NODE
