        const db=new DatabaseSync(':memory:');db.exec('PRAGMA foreign_keys=OFF');for(const sql of Object.values(ref.schema))db.exec(sql);\n\
        const tables={categories:'alert_categories',hazards:'alert_hazards',geographies:'alert_geographies',actors:'alert_actors',dimensionState:'alert_dimension_state',dimensionRebuildState:'dimension_rebuild_state'};\n\
        db.exec('BEGIN');for(const [k,t] of Object.entries(tables)){const rr=k==='dimensionRebuildState'?[state]:tableRows[k];for(const\
        \ row of rr){const keys=Object.keys(row);db.prepare('INSERT INTO '+t+' ('+keys.map(x=>'\"'+x+'\"').join(',')+') VALUES\
        \ ('+keys.map(()=>'?').join(',')+')').run(...keys.map(x=>row[x]));}}db.exec('COMMIT');\nconst restored={source:'SAFETY\
        \ GATE'};for(const [k,t] of Object.entries(tables))restored[k]=k==='dimensionRebuildState'?db.prepare('SELECT * FROM\
        \ '+t).get():db.prepare('SELECT * FROM '+t+' ORDER BY alert_id'+(k==='dimensionState'?'':',id')).all();\nassert.equal(sha(bytes(restored)),rollbackSha,'Full\
        \ offline rollback restore');\nconst restoredComparable=Object.fromEntries(Object.keys(tableRows).map(k=>[k,sorted(restored[k])]));assert.equal(sha(bytes(restoredComparable)),currentSha);db.close();\n\
        const proofSha=put('rollback-restore-proof.json',{exact:true,currentDimensionSha256:currentSha,rollbackSha256:rollbackSha,restoredFullSha256:sha(bytes(restored))});\n\
        const allIndex=new Map(alerts.map((a,i)=>[a.id,i]));const remaining=alerts.filter(a=>a.id>state.cursor_alert_id);const\
