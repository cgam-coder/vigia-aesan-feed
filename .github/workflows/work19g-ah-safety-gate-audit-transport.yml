name: WORK19G-AH reusable certified Safety Gate audit
permissions:
  contents: read
  actions: read
concurrency:
  group: work19g-ah-safety-gate-window
  cancel-in-progress: false
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - name: Verify existing sync token
      env:
        VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
      run: "if [ -z \"${VIGIA_SYNC_TOKEN}\" ]; then\n  exit 1\nfi\necho \"VIGIA_SYNC_TOKEN available: yes\"\n"
    - name: Observe most recent successful natural sync with clear queue
      env:
        GH_TOKEN: ${{ github.token }}
      run: "python3 - <<'PY'\nimport json, os, subprocess, time\nfrom datetime import datetime, timezone, timedelta\nfrom\
        \ pathlib import Path\nbegan = datetime.now(timezone.utc)\ndef read(url):\n    r = subprocess.run([\"curl\",\"--silent\"\
        ,\"--show-error\",\"--fail\",\"--max-time\",\"30\",\"-H\",\"Authorization: Bearer \"+os.environ[\"GH_TOKEN\"],url],capture_output=True,check=True)\n\
        \    return json.loads(r.stdout)\nbase = \"https://api.github.com/repos/cgam-coder/vigia-aesan-feed\"\nwhile True:\n\
        \    runs = read(base+\"/actions/runs?per_page=100\")[\"workflow_runs\"]\n    sg = [r for r in runs if r[\"workflow_id\"\
        ] == 339316486]\n    now = datetime.now(timezone.utc)\n    boundary = max(now.replace(minute=m,second=0,microsecond=0)+timedelta(hours=h)\
        \ for h in (-1,0) for m in (7,37) if now.replace(minute=m,second=0,microsecond=0)+timedelta(hours=h)<=now)\n    candidates\
        \ = [r for r in sg if r[\"event\"] == \"schedule\" and datetime.fromisoformat(r[\"created_at\"].replace(\"Z\", \"\
        +00:00\")) >= boundary]\n    if candidates:\n        selected = max(candidates, key=lambda r:r[\"created_at\"])\n\
        \        run = read(base+\"/actions/runs/\"+str(selected[\"id\"]))\n        if run[\"event\"] != \"schedule\": raise\
        \ RuntimeError(\"Not a natural scheduled run\")\n        if run[\"status\"] == \"completed\":\n            if run[\"\
        conclusion\"] != \"success\": raise RuntimeError(\"Natural sync failed\")\n            if not any(r[\"status\"] !=\
        \ \"completed\" for r in sg): break\n    time.sleep(20)\nevidence = {k:run.get(k) for k in (\"id\",\"event\",\"status\"\
        ,\"conclusion\",\"created_at\",\"run_started_at\",\"updated_at\")}\nevidence[\"transportWaitBeganAt\"] = began.isoformat()\n\
        Path(os.environ[\"RUNNER_TEMP\"], \"natural-sync.json\").write_text(json.dumps(evidence))\nprint(json.dumps(evidence))\n\
        PY\n"
    - name: Export exact Safety Gate production corpus
      env:
        VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
        VIGIA_SAFETY_GATE_EXPORT_URL: https://vigia-alertas.csar68.chatgpt.site/api/admin/work19g-ah/safety-gate-export
      run: "python3 - <<'PY'\nimport hashlib\nimport json\nimport os\nimport subprocess\nimport sys\nimport re\nimport time\n\
        from datetime import datetime, timezone\nfrom pathlib import Path\nfrom urllib.parse import quote\n\noutput = Path(\"\
        export\")\npages_dir = output / \"pages\"\npages_dir.mkdir(parents=True, exist_ok=False)\n\nbase_url = os.environ[\"\
        VIGIA_SAFETY_GATE_EXPORT_URL\"]\ntoken = os.environ[\"VIGIA_SYNC_TOKEN\"]\nrun_id = os.environ[\"GITHUB_RUN_ID\"]\n\
        \nstarted = time.monotonic()\nclass TransportFailure(Exception):\n    def __init__(self, code, status):\n        self.code,\
        \ self.status = code, status\n    def size_or_resource(self):\n        return self.status in (\"413\", \"500\", \"\
        502\", \"503\", \"504\", \"507\") or (self.code in (18, 28) and self.status in (\"000\", \"200\"))\ndef curl_get(url,\
        \ destination):\n    result = subprocess.run([\n        \"curl\", \"--silent\", \"--show-error\", \"--location\",\n\
        \        \"--request\", \"GET\",\n        \"--header\", f\"Authorization: Bearer {token}\",\n        \"--max-time\"\
        , \"180\",\n        \"--output\", str(destination),\n        \"--write-out\", \"%{http_code}\",\n        url,\n  \
        \  ], stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, check=False)\n    status = result.stdout.decode(\"ascii\"\
        , errors=\"replace\").strip()\n    if result.returncode != 0 or status != \"200\":\n        print(json.dumps({\n \
        \           \"curlExitCode\": result.returncode,\n            \"httpStatus\": status or None,\n        }, sort_keys=True),\
        \ file=sys.stderr)\n        raise TransportFailure(result.returncode, status)\n    return destination.read_bytes()\n\
        \ngate_path = Path(os.environ[\"RUNNER_TEMP\"]) / \"work19g-ah-safety-gate-export-gate.json\"\ngate_raw = curl_get(f\"\
        {base_url}?metadataOnly=1\", gate_path)\ntry:\n    gate = json.loads(gate_raw)\nexcept json.JSONDecodeError as error:\n\
        \    raise RuntimeError(\"Authenticated curl gate did not return valid JSON\") from error\n\nmetadata = gate.get(\"\
        metadata\")\ncorpus = metadata.get(\"corpus\") if isinstance(metadata, dict) else None\ndimensions = metadata.get(\"\
        dimensions\") if isinstance(metadata, dict) else None\noperational = metadata.get(\"operational\") if isinstance(metadata,\
        \ dict) else None\nmapping_versions = metadata.get(\"mappingVersions\") if isinstance(metadata, dict) else None\n\
        if gate.get(\"runtimeMarker\") != \"work19g-ah-optimized-20260906\":\n    raise RuntimeError(\"Temporary runtime marker\
        \ mismatch\")\nif gate.get(\"source\") != \"SAFETY GATE\":\n    raise RuntimeError(\"Safety Gate gate returned an\
        \ unexpected source or cursor\")\nif not isinstance(gate.get(\"snapshotGuard\"), str) or not re.fullmatch(\"[0-9a-f]{64}\"\
        , gate[\"snapshotGuard\"]):\n    raise RuntimeError(\"Safety Gate gate has no snapshot guard\")\nif not isinstance(corpus,\
        \ dict) or any(not isinstance(corpus.get(key), int) for key in (\n    \"alerts\", \"uniqueIds\", \"uniqueReferences\"\
        , \"alertVersions\", \"sumVersionCount\",\n)):\n    raise RuntimeError(\"Safety Gate gate has invalid corpus metadata\"\
        )\nif not isinstance(dimensions, dict) or any(not isinstance(dimensions.get(key), int) for key in (\n    \"categories\"\
        , \"hazards\", \"geographies\", \"originRelations\", \"notifyingRelations\",\n    \"actors\", \"dimensionState\",\
        \ \"missingState\", \"sourceContentHashMismatches\",\n)):\n    raise RuntimeError(\"Safety Gate gate has invalid dimension\
        \ metadata\")\nif not isinstance(mapping_versions, list) or not isinstance(operational, dict):\n    raise RuntimeError(\"\
        Safety Gate gate has invalid mapping or operational metadata\")\nif operational.get(\"sourceSyncLease\") is not None:\n\
        \    raise RuntimeError(\"Safety Gate source lease is not clear\")\nif operational.get(\"rebuildLease\") is not None:\n\
        \    raise RuntimeError(\"Safety Gate rebuild lease is not clear\")\nlatest_sync = operational.get(\"latestSync\"\
        )\nif not isinstance(latest_sync, dict) or latest_sync.get(\"source\") != \"SAFETY GATE\":\n    raise RuntimeError(\"\
        Safety Gate latest sync metadata is invalid\")\nif latest_sync.get(\"status\") != \"completed\" or latest_sync.get(\"\
        completed_at\") is None:\n    raise RuntimeError(\"Safety Gate latest sync is not completed\")\nstarted_at = latest_sync.get(\"\
        started_at\")\ncompleted_at = latest_sync.get(\"completed_at\")\nif not isinstance(started_at, str) or not isinstance(completed_at,\
        \ str):\n    raise RuntimeError(\"Safety Gate latest sync timestamps are invalid\")\ncompleted = datetime.fromisoformat(completed_at.replace(\"\
        Z\", \"+00:00\"))\ncompleted_age = (datetime.now(timezone.utc) - completed).total_seconds()\nif completed_age < -60\
        \ or completed_age > 20 * 60:\n    raise RuntimeError(\"No recently completed natural Safety Gate sync is available\"\
        )\nnatural = json.loads(Path(os.environ[\"RUNNER_TEMP\"], \"natural-sync.json\").read_text())\nnatural_start = datetime.fromisoformat(natural[\"\
        run_started_at\"].replace(\"Z\", \"+00:00\"))\nsync_start = datetime.fromisoformat(started_at.replace(\"Z\", \"+00:00\"\
        ))\nif sync_start < natural_start or completed < sync_start:\n    raise RuntimeError(\"Metadata does not identify\
        \ the observed natural sync\")\n(output / \"metadata-gate.json\").write_bytes(gate_raw)\n(output / \"natural-sync.json\"\
        ).write_text(json.dumps(natural))\nexpected_guard = gate[\"snapshotGuard\"]\nfirst_metadata = metadata\nprobe_path\
        \ = Path(os.environ[\"RUNNER_TEMP\"]) / \"work19g-ah-probe.json\"\nprobes = []\nchosen_limit = None\nfor candidate\
        \ in (500, 250, 100):\n    probe_start = time.monotonic()\n    try:\n        probe_raw = curl_get(f\"{base_url}?limit={candidate}&expectedGuard={expected_guard}\"\
        , probe_path)\n    except TransportFailure as failure:\n        probes.append({\"limit\":candidate,\"httpStatus\"\
        :failure.status,\"curlExitCode\":failure.code,\"seconds\":round(time.monotonic()-probe_start,3)})\n        if not\
        \ failure.size_or_resource(): raise\n        continue\n    probe = json.loads(probe_raw)\n    if probe.get(\"snapshotGuard\"\
        ) != expected_guard or probe.get(\"metadata\") != metadata:\n        raise RuntimeError(\"Snapshot failure during\
        \ size probe\")\n    if probe.get(\"runtimeMarker\") != gate[\"runtimeMarker\"] or probe.get(\"source\") != \"SAFETY\
        \ GATE\":\n        raise RuntimeError(\"Runtime failure during size probe\")\n    if len(probe.get(\"alerts\", []))\
        \ != min(candidate, corpus[\"alerts\"]):\n        raise RuntimeError(\"Incomplete size probe\")\n    chosen_limit\
        \ = candidate\n    probes.append({\"limit\":candidate,\"httpStatus\":\"200\",\"bytes\":len(probe_raw),\"seconds\"\
        :round(time.monotonic()-probe_start,3)})\n    break\nif chosen_limit is None: raise RuntimeError(\"No safe export\
        \ page size\")\nprint(json.dumps({\"chosenPageSize\":chosen_limit,\"probes\":probes}))\nafter = \"\"\nseen_ids = set()\n\
        seen_references = set()\nordered_ids = []\nmanifest = []\nexported_counts = {\n    \"alertVersions\": 0,\n    \"categories\"\
        : 0,\n    \"hazards\": 0,\n    \"geographies\": 0,\n    \"originRelations\": 0,\n    \"notifyingRelations\": 0,\n\
        \    \"actors\": 0,\n    \"dimensionState\": 0,\n}\nsum_version_count = 0\nordinal = 0\n\nwhile True:\n    ordinal\
        \ += 1\n    url = f\"{base_url}?limit={chosen_limit}&expectedGuard={expected_guard}\"\n    if after:\n        url\
        \ += f\"&after={quote(after, safe='')}\"\n    page_path = pages_dir / f\"page-{ordinal:04d}.json\"\n    if ordinal\
        \ == 1:\n        raw = probe_raw\n        page_path.write_bytes(raw)\n    else:\n        raw = curl_get(url, page_path)\n\
        \    try:\n        body = json.loads(raw)\n    except json.JSONDecodeError as error:\n        raise RuntimeError(f\"\
        Page {ordinal} is not valid JSON\") from error\n\n    if body.get(\"runtimeMarker\") != gate[\"runtimeMarker\"]:\n\
        \        raise RuntimeError(\"Runtime changed during export\")\n    if body.get(\"source\") != \"SAFETY GATE\" or\
        \ body.get(\"after\") != after:\n        raise RuntimeError(f\"Page {ordinal} has unexpected source or cursor\")\n\
        \    guard = body.get(\"snapshotGuard\")\n    if not isinstance(guard, str) or not guard:\n        raise RuntimeError(f\"\
        Page {ordinal} has no snapshot guard\")\n    if guard != expected_guard or body.get(\"metadata\") != metadata:\n \
        \       raise RuntimeError(f\"Snapshot guard or metadata changed on page {ordinal}\")\n\n    page_alerts = body.get(\"\
        alerts\")\n    if not isinstance(page_alerts, list):\n        raise RuntimeError(f\"Page {ordinal} alerts are invalid\"\
        )\n    page_ids = []\n    for alert in page_alerts:\n        alert_id = alert.get(\"id\") if isinstance(alert, dict)\
        \ else None\n        reference = alert.get(\"reference\") if isinstance(alert, dict) else None\n        if not isinstance(alert_id,\
        \ str) or not alert_id:\n            raise RuntimeError(f\"Page {ordinal} contains an invalid alert ID\")\n      \
        \  if not isinstance(reference, str) or not reference:\n            raise RuntimeError(f\"Alert {alert_id} contains\
        \ an invalid reference\")\n        if page_ids and alert_id <= page_ids[-1]:\n            raise RuntimeError(f\"Page\
        \ {ordinal} IDs are not strictly increasing\")\n        if ordered_ids and alert_id <= ordered_ids[-1]:\n        \
        \    raise RuntimeError(f\"Page {ordinal} boundary is not strictly increasing\")\n        if alert_id in seen_ids:\n\
        \            raise RuntimeError(f\"Duplicate alert ID: {alert_id}\")\n        page_ids.append(alert_id)\n        ordered_ids.append(alert_id)\n\
        \        seen_ids.add(alert_id)\n        seen_references.add(reference)\n        try:\n            sum_version_count\
        \ += int(alert[\"version_count\"])\n        except (KeyError, TypeError, ValueError) as error:\n            raise\
        \ RuntimeError(f\"Alert {alert_id} has invalid version_count\") from error\n\n    next_after = body.get(\"nextAfter\"\
        )\n    has_more = body.get(\"hasMore\")\n    if not isinstance(has_more, bool):\n        raise RuntimeError(f\"Page\
        \ {ordinal} has invalid hasMore\")\n    expected_next = page_ids[-1] if page_ids else None\n    if next_after != expected_next:\n\
        \        raise RuntimeError(f\"Page {ordinal} has an invalid nextAfter\")\n    if has_more and (not isinstance(next_after,\
        \ str) or not next_after or next_after <= after):\n        raise RuntimeError(f\"Page {ordinal} has a missing or non-increasing\
        \ cursor transition\")\n\n    relation_keys = {\n        \"versions\":\"alertVersions\", \"categories\":\"categories\"\
        , \"hazards\":\"hazards\",\n        \"geographies\":\"geographies\", \"actors\":\"actors\", \"dimensionStates\":\"\
        dimensionState\",\n    }\n    for body_key, count_key in relation_keys.items():\n        rows = body.get(body_key)\n\
        \        if not isinstance(rows, list):\n            raise RuntimeError(f\"Page {ordinal} has invalid {body_key}\"\
        )\n        if any(row.get(\"alert_id\") not in page_ids for row in rows):\n            raise RuntimeError(\"Relation\
        \ outside exact alert page\")\n        exported_counts[count_key] += len(rows)\n        if body_key == \"geographies\"\
        :\n            exported_counts[\"originRelations\"] += sum(row.get(\"role\") == \"origin\" for row in rows)\n    \
        \        exported_counts[\"notifyingRelations\"] += sum(row.get(\"role\") == \"notifying\" for row in rows)\n\n  \
        \  manifest.append({\n        \"ordinal\":ordinal,\n        \"after\":after,\n        \"nextAfter\":next_after,\n\
        \        \"alertCount\":len(page_alerts),\n        \"bytes\":len(raw),\n        \"sha256\":hashlib.sha256(raw).hexdigest(),\n\
        \    })\n    if not has_more:\n        break\n    after = next_after\n\nif first_metadata != metadata:\n    raise\
        \ RuntimeError(\"Gate and first-page metadata differ\")\ntotal_alerts = len(ordered_ids)\nif total_alerts != corpus[\"\
        alerts\"] or len(seen_ids) != corpus[\"uniqueIds\"]:\n    raise RuntimeError(\"Exported alert or unique ID count does\
        \ not match metadata\")\nif len(seen_references) != corpus[\"uniqueReferences\"]:\n    raise RuntimeError(\"Exported\
        \ unique reference count does not match metadata\")\nif exported_counts[\"alertVersions\"] != corpus[\"alertVersions\"\
        ]:\n    raise RuntimeError(\"Exported alert_versions count does not match metadata\")\nif sum_version_count != corpus[\"\
        sumVersionCount\"]:\n    raise RuntimeError(\"Exported version_count sum does not match metadata\")\nfor key in (\"\
        categories\", \"hazards\", \"geographies\", \"originRelations\", \"notifyingRelations\",\n            \"actors\",\
        \ \"dimensionState\"):\n    if exported_counts[key] != dimensions[key]:\n        raise RuntimeError(f\"Exported {key}\
        \ count does not match metadata\")\n\nmanifest_bytes = (json.dumps(\n    manifest, ensure_ascii=False, sort_keys=True,\
        \ separators=(\",\", \":\"),\n) + \"\\n\").encode(\"utf-8\")\n(output / \"page-manifest.json\").write_bytes(manifest_bytes)\n\
        manifest_sha = hashlib.sha256(manifest_bytes).hexdigest()\nsummary = {\n    \"workflowRunId\":run_id,\n    \"chosenPageSize\"\
        :chosen_limit,\n    \"probeResults\":probes,\n    \"exportDurationSeconds\":round(time.monotonic()-started,3),\n \
        \   \"globalMetadataCalls\":1+len(probes)+len(manifest)-1,\n    \"globalMetadataCallsAvoidedVsPrior210Pages\":420-(1+len(probes)+len(manifest)-1),\n\
        \    \"source\":\"SAFETY GATE\",\n    \"snapshotGuard\":expected_guard,\n    \"pages\":len(manifest),\n    \"totalAlerts\"\
        :total_alerts,\n    \"uniqueAlertIds\":len(seen_ids),\n    \"uniqueReferences\":len(seen_references),\n    \"totalVersionsReported\"\
        :corpus[\"alertVersions\"],\n    \"totalVersionsExported\":exported_counts[\"alertVersions\"],\n    \"sumVersionCount\"\
        :sum_version_count,\n    \"firstId\":ordered_ids[0] if ordered_ids else None,\n    \"lastId\":ordered_ids[-1] if ordered_ids\
        \ else None,\n    \"dimensionCounts\":dimensions,\n    \"exportedDimensionCounts\":exported_counts,\n    \"mappingVersionCounts\"\
        :mapping_versions,\n    \"latestSafetyGateSync\":operational.get(\"latestSync\"),\n    \"sourceSyncLease\":operational.get(\"\
        sourceSyncLease\"),\n    \"rebuildMetadata\":operational.get(\"dimensionRebuildState\"),\n    \"rebuildLease\":operational.get(\"\
        rebuildLease\"),\n    \"pageManifestSha256\":manifest_sha,\n}\nsummary_bytes = (json.dumps(\n    summary, ensure_ascii=False,\
        \ sort_keys=True, separators=(\",\", \":\"),\n) + \"\\n\").encode(\"utf-8\")\n(output / \"export-summary.json\").write_bytes(summary_bytes)\n\
        print(json.dumps({\n    \"source\":\"SAFETY GATE\", \"pages\":len(manifest), \"totalAlerts\":total_alerts,\n    \"\
        chosenPageSize\":chosen_limit,\"exportDurationSeconds\":summary[\"exportDurationSeconds\"],\n    \"totalVersions\"\
        :exported_counts[\"alertVersions\"], \"snapshotGuard\":expected_guard,\n    \"pageManifestSha256\":manifest_sha,\n\
        }, sort_keys=True))\nPY\n"
      id: snapshot
    - name: Recover pinned certified reference for read-only difference diagnostics
      id: reference
      env:
        GH_TOKEN: ${{ github.token }}
      run: "python3 - <<'PYREF'\nimport hashlib,json,os,subprocess,zipfile\nfrom pathlib import Path\np=Path(os.environ['RUNNER_TEMP'])/'work19g-ah-reference.zip'\n\
        # Pinned certified reference; never use a mutable latest artifact as the baseline.\nr=subprocess.run(['curl','--silent','--show-error','--fail','--location','--max-time','180','--header','Authorization:\
        \ Bearer '+os.environ['GH_TOKEN'],'--output',str(p),'https://api.github.com/repos/cgam-coder/vigia-aesan-feed/actions/artifacts/9996015376/zip'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)\n\
        expected='6d82c12e5cb556d236bf0a723efee304b7c6078fffe0e4445b17f296f24904cb'\nobserved=hashlib.sha256(p.read_bytes()).hexdigest()\
        \ if p.exists() else None\nstatus={'artifactId':9996015376,'workflowRunId':34055684913,'expectedSha256':expected,'observedSha256':observed,'downloadExitCode':r.returncode,'verified':r.returncode==0\
        \ and observed==expected}\nPath('export/reference-recovery.json').write_text(json.dumps(status,sort_keys=True)+'\\\
        n')\nif not status['verified']: raise RuntimeError('Certified reference unavailable or digest mismatch; complete fresh\
        \ export remains evidence only')\nout=Path(os.environ['RUNNER_TEMP'])/'work19g-ah-reference'\nwith zipfile.ZipFile(p)\
        \ as z:\n if z.testzip() is not None: raise RuntimeError('Reference archive CRC mismatch')\n for n in z.namelist():\n\
        \  q=Path(n)\n  if q.is_absolute() or '..' in q.parts: raise RuntimeError('Unsafe reference archive path')\n z.extractall(out)\n\
        print(json.dumps({'referenceArtifactId':9996015376,'verified':True}))\nPYREF\n"
    - name: Certify fresh semantic compatibility, exact rollback and current checkpoint plan
      env:
        NODE_OPTIONS: --max-old-space-size=6144
      run: "node --input-type=module >export/certification-stdout.log 2>export/certification-stderr.log <<'JS'\nimport assert\
        \ from 'node:assert/strict';\nimport {readFileSync,writeFileSync,readdirSync} from 'node:fs';\nimport {createHash}\
        \ from 'node:crypto';\nimport {inflateSync} from 'node:zlib';\nimport {DatabaseSync} from 'node:sqlite';\nconst ref=JSON.parse(inflateSync(Buffer.from('','base64')));\n\
        const stable=v=>Array.isArray(v)?'['+v.map(stable).join(',')+']':v&&typeof v==='object'?'{'+Object.entries(v).sort(([a],[b])=>a.localeCompare(b)).map(([k,v])=>JSON.stringify(k)+':'+stable(v)).join(',')+'}':JSON.stringify(v);\n\
        const bytes=v=>Buffer.from(stable(v)+'\\n');\nconst sha=v=>createHash('sha256').update(v).digest('hex');\nconst put=(name,v)=>{const\
        \ b=bytes(v);writeFileSync('export/'+name,b);return sha(b);};\nconst read=name=>JSON.parse(readFileSync('export/'+name));\n\
        const summary=read('export-summary.json'),manifest=read('page-manifest.json'),gate=read('metadata-gate.json');\nassert.equal(sha(readFileSync('export/page-manifest.json')),summary.pageManifestSha256);\n\
        const rows={alerts:[],versions:[],categories:[],hazards:[],geographies:[],actors:[],dimensionStates:[]};\nlet cursor='';\n\
        for(let i=0;i<manifest.length;i++){\n const raw=readFileSync('export/pages/page-'+String(i+1).padStart(4,'0')+'.json');assert.equal(sha(raw),manifest[i].sha256);assert.equal(raw.length,manifest[i].bytes);\n\
        \ const p=JSON.parse(raw);assert.equal(p.after,cursor);assert.equal(p.snapshotGuard,gate.snapshotGuard);assert.equal(sha(stable(p.metadata)),gate.snapshotGuard);assert.equal(p.runtimeMarker,'work19g-ah-optimized-20260906');\n\
        \ const set=new Set();for(const a of p.alerts){assert.equal(a.source,'SAFETY GATE');assert.ok(a.id>cursor);cursor=a.id;set.add(a.id);}\n\
        \ assert.equal(p.nextAfter,p.alerts.at(-1)?.id??null);assert.equal(p.hasMore,i<manifest.length-1);\n for(const k of\
        \ Object.keys(rows)){assert.ok(Array.isArray(p[k]));if(k!=='alerts')assert.ok(p[k].every(x=>set.has(x.alert_id)));rows[k].push(...p[k]);}\n\
        }\nconst {alerts,versions,categories,hazards,geographies,actors,dimensionStates}=rows,md=gate.metadata;\nassert.equal(alerts.length,summary.totalAlerts);assert.equal(new\
        \ Set(alerts.map(a=>a.id)).size,alerts.length);assert.equal(new Set(alerts.map(a=>a.reference)).size,alerts.length);\n\
        const semantic=alerts.map(a=>({id:a.id,reference:a.reference,contentHash:a.content_hash,versionCount:a.version_count,updatedAt:a.updated_at,detectedAt:a.detected_at})).sort((a,b)=>a.id.localeCompare(b.id));\n\
        const semanticSha=put('semantic-manifest.json',semantic);\n\nconst observedTargetSha=sha(bytes(alerts.map(a=>({id:a.id,reference:a.reference,source:a.source,canonical_json:a.canonical_json,content_hash:a.content_hash}))));\n\
        put('comparison-hashes.json',{expectedCanonicalSha256:ref.targetRelevantSha256,observedCanonicalSha256:observedTargetSha,expectedSemanticSha256:ref.semanticSha256,observedSemanticSha256:semanticSha,comparisonRule:'Unchanged:\
        \ stable JSON of ordered id/reference/source/canonical_json/content_hash projection plus newline',semanticFields:['id','reference','contentHash','versionCount','updatedAt','detectedAt']});\n\
        const oldRoot=process.env.RUNNER_TEMP+'/work19g-ah-reference/';\nconst oldManifest=JSON.parse(readFileSync(oldRoot+'page-manifest.json'));\n\
        const oldSummary=JSON.parse(readFileSync(oldRoot+'export-summary.json'));\nassert.equal(sha(readFileSync(oldRoot+'page-manifest.json')),oldSummary.pageManifestSha256);\n\
        const oldAlerts=[];\nfor(let i=0;i<oldManifest.length;i++){\n const raw=readFileSync(oldRoot+'pages/page-'+String(i+1).padStart(4,'0')+'.json');\n\
        \ assert.equal(sha(raw),oldManifest[i].sha256);assert.equal(raw.length,oldManifest[i].bytes);\n oldAlerts.push(...JSON.parse(raw).alerts);\n\
