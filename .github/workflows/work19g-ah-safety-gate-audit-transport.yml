      id: certification
    - name: Record explicit export and certification status
      id: evidence_status
      if: ${{ always() }}
      env:
        SNAPSHOT_OUTCOME: ${{ steps.snapshot.outcome }}
        REFERENCE_OUTCOME: ${{ steps.reference.outcome }}
        CERTIFICATION_OUTCOME: ${{ steps.certification.outcome }}
      run: "python3 - <<'PYSTATUS'\nimport json,os\nfrom datetime import datetime,timezone\nfrom pathlib import Path\nout=Path('export');out.mkdir(exist_ok=True)\n\
        def read(name):\n try:return json.loads((out/name).read_text())\n except (OSError,ValueError):return {}\ncomplete=os.environ['SNAPSHOT_OUTCOME']=='success'\n\
        passed=complete and os.environ['REFERENCE_OUTCOME']=='success' and os.environ['CERTIFICATION_OUTCOME']=='success'\
        \ and bool(read('window-certification.json'))\nsummary=read('export-summary.json');hashes=read('comparison-hashes.json')\n\
        if not complete:stage='export-acquisition'\nelif os.environ['REFERENCE_OUTCOME']!='success':stage='reference-recovery'\n\
        elif passed:stage=None\nelif hashes.get('observedSemanticSha256')!=hashes.get('expectedSemanticSha256'):stage='semantic-manifest'\n\
        elif hashes and hashes.get('observedCanonicalSha256')!=hashes.get('expectedCanonicalSha256'):stage='canonical-target-input'\n\
        else:stage='certification-see-stderr'\nstatus={'exportComplete':complete,'exportIntegrityPassed':complete,'certificationPassed':passed,'certificationFailureStage':stage,'snapshotGuard':summary.get('snapshotGuard'),'pages':summary.get('pages',0),'alerts':summary.get('totalAlerts',0),'workflowRunId':os.environ['GITHUB_RUN_ID'],'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'timestamp':datetime.now(timezone.utc).isoformat(),'snapshotOutcome':os.environ['SNAPSHOT_OUTCOME'],'referenceOutcome':os.environ['REFERENCE_OUTCOME'],'certificationOutcome':os.environ['CERTIFICATION_OUTCOME'],'artifactClassification':'complete-certified'\
        \ if passed else 'complete-uncertified' if complete else 'incomplete-diagnostics-only'}\n(out/'certification-status.json').write_text(json.dumps(status,sort_keys=True,indent=2)+'\\\
        n')\nprint(json.dumps(status,sort_keys=True))\nPYSTATUS\n"
    - name: Upload temporary audit transport
      uses: actions/upload-artifact@v4
      with:
        name: work19g-ah-audit-evidence-${{ github.run_id }}-${{ github.run_attempt }}
        path: export/**
        if-no-files-found: error
        retention-days: 1
      if: ${{ always() && steps.snapshot.outcome == 'success' }}
'on':
  push:
    branches:
    - work/19g-ah-safety-gate-final-rematerialization-transport
    paths:
    - .github/workflows/work19g-ah-safety-gate-audit-transport.yml
