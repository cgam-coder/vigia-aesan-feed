name: Scheduler S0 read-only evidence
on:
  push:
    branches: [work/scheduler-reliability-s0-evidence]
    paths:
      - .github/workflows/scheduler-s0-evidence.yml
      - diagnostics/scheduler-s0-evidence.mjs
permissions:
  contents: read
concurrency:
  group: scheduler-s0-evidence
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Read existing scheduler logs without production mutations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node diagnostics/scheduler-s0-evidence.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scheduler-s0-evidence
          path: scheduler-s0-evidence.json
          retention-days: 7
          if-no-files-found: error
