name: Cloudflare credential presence proof

on:
  push:
    branches:
      - work/cloudflare-chat-operability-proof
    paths:
      - "ops/cloudflare-credential-presence.txt"

permissions:
  contents: read

jobs:
  presence:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$CF_TOKEN" ]; then token=true; else token=false; fi
          if [ -n "$CF_ACCOUNT" ]; then account=true; else account=false; fi
          echo "CLOUDFLARE_CREDENTIAL_PRESENCE token=$token account=$account"
