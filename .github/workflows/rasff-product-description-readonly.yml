name: VIGIA RASFF optional product read-only gate

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rasff-product-description-readonly.yml"

permissions:
  contents: read

concurrency:
  group: vigia-rasff-controlled-activation
  cancel-in-progress: false

jobs:
  readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VIGIA_BASE_URL: https://vigia-alertas.csar68.chatgpt.site
      VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
    steps:
      - name: Certify deployed parser and exact resume boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VIGIA_SYNC_TOKEN"
          node <<'NODE'
          const base = process.env.VIGIA_BASE_URL;
          const headers = { Authorization:`Bearer ${process.env.VIGIA_SYNC_TOKEN}` };
          const call = async (path, method = "GET") => {
            let last;
            for (let attempt = 1; attempt <= 3; attempt++) {
              try {
                const response = await fetch(base + path, { method, headers, redirect:"follow", signal:AbortSignal.timeout(600_000) });
                const text = await response.text();
                let body;
                try { body = JSON.parse(text); }
                catch { throw new Error(`${method} ${path} returned non-JSON HTTP ${response.status}: ${text.slice(0, 240)}`); }
                if (response.status === 200) return body;
                if (response.status < 500) throw new Error(`${method} ${path} failed HTTP ${response.status}: ${text.slice(0, 500)}`);
                last = new Error(`${method} ${path} transient HTTP ${response.status}`);
              } catch (error) { last = error; }
              if (attempt < 3) await new Promise((resolve) => setTimeout(resolve, attempt * 3_000));
            }
            throw last;
          };

          const observe = await call("/api/rasff/sync?observe=1");
          const audit = (await call("/api/rasff/sync?audit=1")).audit;
          const preflight = await call("/api/rasff/sync?mode=preflight", "POST");
          const recent = (await call("/api/rasff/sync?mode=preview-recent", "POST")).preview;
          const boundary = (await call(
            "/api/rasff/sync?mode=preview-reconcile&cursor=8475&cursorKey=2021.6687&batchSize=40",
            "POST",
          )).preview;

          if (observe?.source !== "RASFF" || observe.lease !== null) throw new Error("RASFF lease/state is not clean");
          const backfill = observe.backfill;
          if (!backfill || backfill.status !== "failed" || backfill.coverage !== "partial" ||
              backfill.cursor !== 8475 || backfill.cursorKey !== "2021.6687" ||
              backfill.recordsObserved !== 8475 || backfill.recordsPersisted !== 8160 ||
              backfill.detailFailures !== 0 || backfill.pageErrors !== 6)
            throw new Error(`Unexpected exact resume state: ${JSON.stringify(backfill)}`);
          if (audit?.counts?.rasffAlerts !== 8200 || audit.counts.rasffUniqueReferences !== 8200 ||
              audit.counts.rasffSourceIdentities !== 8200 || audit.counts.rasffNullProductDescriptionAlerts !== 0 ||
              audit.counts.rasffProductIdWithoutDescriptionAlerts !== 0 ||
              Object.values(audit.integrity).some((value) => value !== 0))
            throw new Error(`Unexpected pre-resume audit: ${JSON.stringify(audit)}`);
          if (preflight?.authorized !== true || preflight?.source !== "RASFF" ||
              !Number.isSafeInteger(preflight?.officialIndex?.totalElements) || preflight.officialIndex.totalElements < 32492)
            throw new Error("RASFF preflight contract failed");
          for (const [name, preview] of [["recent", recent], ["boundary", boundary]]) {
            if (!preview || !Array.isArray(preview.alerts) || (preview.detailFailures ?? 0) !== 0 ||
                (preview.pageErrors ?? 0) !== 0 || preview.alerts.some((alert) =>
                  alert.id !== `rasff:${alert.reference}` || alert.contentHash?.length !== 64))
              throw new Error(`${name} preview contract failed: ${JSON.stringify(preview)}`);
          }
          const offending = boundary.alerts.find((alert) => alert.reference === "2021.6273");
          if (!offending || offending.id !== "rasff:2021.6273")
            throw new Error(`2021.6273 did not pass the deployed parser: ${JSON.stringify(boundary.alerts)}`);

          console.log("OPTIONAL_PRODUCT_OBSERVE " + JSON.stringify(observe));
          console.log("OPTIONAL_PRODUCT_AUDIT " + JSON.stringify(audit));
          console.log("OPTIONAL_PRODUCT_PREFLIGHT " + JSON.stringify(preflight));
          console.log("OPTIONAL_PRODUCT_PREVIEW_RECENT " + JSON.stringify(recent));
          console.log("OPTIONAL_PRODUCT_PREVIEW_BOUNDARY " + JSON.stringify(boundary));
          console.log("OPTIONAL_PRODUCT_OFFENDING " + JSON.stringify(offending));
          NODE
