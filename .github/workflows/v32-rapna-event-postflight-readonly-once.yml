name: V32 RAPNA event postflight and Safety Gate read-only once
on:
  push:
    branches: [audit/v32-post-rapna-event-readonly-20261013]
    paths: [.github/workflows/v32-rapna-event-postflight-readonly-once.yml]
permissions:
  contents: read
jobs:
  audit:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      VIGIA_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
    steps:
      - name: Strictly GET plus parameterized D1 SELECT, zero domain changes
        shell: bash
        run: |
          node <<'NODE'
          (async()=>{
            const cf=process.env.CF_TOKEN||'',sync=process.env.VIGIA_TOKEN||'';
            if(!cf||!sync)throw Error('existing-token-unavailable');
            const account='9c1807c68493f14259248b5f5782cc6f';
            const db='55596003-1b90-4f66-aad8-decb21205f13';
            const original='ab50d0f7-0ad7-4fb5-8078-f6c376aa8f53';
            const cloud='https://api.cloudflare.com/client/v4/accounts/'+account;
            const runtime='https://vigia-runtime.c-gamiz93.workers.dev';
            let gets=0,selects=0,rowsRead=0,rowsWritten=0;
            const get=async(url,token)=>{
              if(++gets>6)throw Error('get-limit');
              const res=await fetch(url,{method:'GET',headers:{Authorization:'Bearer '+token,Accept:'application/json'},redirect:'error',signal:AbortSignal.timeout(15000)});
              const raw=await res.text();if(raw.length>1700000)throw Error('response-limit');
              let body=null;try{body=JSON.parse(raw)}catch{}
              if(!res.ok||!body)throw Error('get-failed-'+res.status);
              return body;
            };
            const sql=async(name,statement,params=[])=>{
              if(++selects>8||!/\ASELECT\s/i.test(statement)||statement.includes(';')||
                /\b(?:INSERT|UPDATE|DELETE|DROP|ALTER|REPLACE|CREATE|ATTACH|PRAGMA|VACUUM)\b/i.test(statement))throw Error('sql-policy');
              const res=await fetch(cloud+'/d1/database/'+db+'/query',{method:'POST',
                headers:{Authorization:'Bearer '+cf,'Content-Type':'application/json',Accept:'application/json'},
                body:JSON.stringify({sql:statement,params}),redirect:'error',signal:AbortSignal.timeout(16000)});
              const body=await res.json().catch(()=>null);
              const result=body?.result?.[0];
              if(res.status!==200||body?.success!==true||!Array.isArray(result?.results)||result.meta?.rows_written!==0)throw Error('select-unavailable-'+name+'-'+res.status);
              rowsRead+=Number(result.meta?.rows_read||0);rowsWritten+=Number(result.meta?.rows_written||0);
              if(rowsRead>4500||rowsWritten!==0)throw Error('row-budget-exceeded');
              return result.results;
            };
            const [control,fresh,sg,runnerDeploy,runtimeDeploy]=await Promise.all([
              get(runtime+'/api/source-reliability?observe=1',sync),
              get(runtime+'/api/freshness?observe=1',sync),
              get(runtime+'/api/safety-gate/sync?observe=1',sync),
              get(cloud+'/workers/scripts/vigia-source-runner/deployments',cf),
              get(cloud+'/workers/scripts/vigia-runtime/deployments',cf)
            ]);
            const deployments=x=>(x.result?.deployments||[])[0]?.versions?.find(v=>v.percentage===100)?.version_id||null;
            const queries=await Promise.all([
              sql('job',"SELECT id,source,mode,phase,finished_at,json_extract(receipt_json,'$.outcome') AS outcome,json_extract(receipt_json,'$.reason') AS reason FROM source_reliability_jobs WHERE id=? LIMIT 1",[original]),
              sql('plans',"SELECT COUNT(*) AS n FROM source_reliability_recovery_plans WHERE old_job_id=?",[original]),
              sql('receipts',"SELECT COUNT(*) AS n FROM source_reliability_recoveries WHERE old_job_id=?",[original]),
              sql('effects',"SELECT COUNT(*) AS n,COUNT(DISTINCT ordinal) AS unique_n,MIN(ordinal) AS lo,MAX(ordinal) AS hi,COALESCE(SUM(CASE WHEN committed_at IS NULL OR result_json IS NULL THEN 1 ELSE 0 END),0) AS pending FROM source_reliability_effects WHERE job_id=? AND ordinal>0",[original]),
              sql('successors',"SELECT COUNT(*) AS n FROM source_reliability_jobs WHERE source='RAPNA' AND mode='current-parity' AND id<>? AND started_at>=(SELECT started_at FROM source_reliability_jobs WHERE id=?)",[original,original]),
              sql('syncs',"SELECT source,mode,status,cursor,total_units,completed_at,last_success_at,last_error,detail_failures,page_errors,updated_at,lease_owner_id,lease_expires_at FROM source_sync_state WHERE (source='RAPNA' AND mode='current-parity') OR (source='SAFETY GATE' AND mode='recent')"),
              sql('leases',"SELECT source,mode,expires_at FROM source_sync_locks WHERE source IN ('RAPNA','SAFETY GATE')"),
              sql('five',"SELECT source,status,checked_at,last_sync_success_at,latest_identity_parity,COALESCE(json_array_length(missing_official_identities),-1) AS missing,COALESCE(json_array_length(revision_mismatches),-1) AS mismatches FROM source_freshness_state ORDER BY source")
            ]);
            const [jobs,plans,recs,effects,succ,states,leases,five]=queries;
            const attempt=control?.state?.revisionAttempts?.['RAPNA:current-parity']||{};
            const now=Date.now();
            const age=v=>typeof v==='string'&&Number.isFinite(Date.parse(v))?+((now-Date.parse(v))/60000).toFixed(1):null;
            const fiveBrief=five.map(x=>({source:x.source,status:x.status,parity:x.latest_identity_parity===1,lastAgeMin:age(x.last_sync_success_at),checkAgeMin:age(x.checked_at),missing:x.missing,mismatches:x.mismatches}));
            const originalJob=jobs[0]||null,fx=effects[0]||{},result={
              at:new Date(now).toISOString(),
              versions:{runtime:deployments(runtimeDeploy),runner:deployments(runnerDeploy)},
              original:{id:originalJob?.id||null,phase:originalJob?.phase||null,
                outcome:originalJob?.outcome||null,reason:originalJob?.reason||null},
              recovery:{intentCount:plans[0]?.n??null,receiptCount:recs[0]?.n??null,successorCount:succ[0]?.n??null},
              effects:{count:fx.n??null,unique:fx.unique_n??null,lo:fx.lo??null,hi:fx.hi??null,pending:fx.pending??null},
              currentState:states.find(x=>x.source==='RAPNA')||null,
              safetyGateState:states.find(x=>x.source==='SAFETY GATE')||null,
              safetyGateObservation:{status:sg.recent?.status??null,lastSuccessAt:sg.recent?.lastSuccessAt??null,ageMin:age(sg.recent?.lastSuccessAt),leaseExpiresAt:sg.lease?.expiresAt??null},
              leases:leases.map(x=>({source:x.source,mode:x.mode,expiresAt:x.expires_at})),
              coordinator:{revisionOutcome:attempt.outcome??null,
                originalJobIdMatches:attempt.id===original,reason:attempt.reason??null,
                nextEligibleAt:attempt.nextEligibleAt??null,globalLeaseActive:control.activeLease??null,
                officialParityCertified:control.officialParityCertified??null},
              fiveRecent:fiveBrief,
              GET:gets,SELECT:selects,rowsRead,rowsWritten,sourceJobs:0,deployments:0,
              dataWasNotMutated:true
            };
            const safe=gets===5&&selects===8&&rowsWritten===0&&jobs.length===1&&effects.length===1&&states.length>=1&&five.length===5;
            console.log('V32_POST_EVENT '+JSON.stringify({readOnlyAuditPass:safe,...result}));
            if(!safe)process.exitCode=2;
          })().catch(e=>{
            console.log('V32_POST_EVENT '+JSON.stringify({state:'HOLD_OBSERVABILITY',error:String(e.message||e.name).slice(0,90),noWrites:true,noDeploy:true}));
            process.exitCode=2;
          });
          NODE
