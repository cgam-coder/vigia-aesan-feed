name: RAPNA category production D1 read-only data and cost proof

on:
  push:
    branches:
      - sec-f1/cloudflare-api-readonly-20261009
    paths:
      - .github/workflows/rapna-category-prod-d1-read-once.yml

permissions:
  contents: read

concurrency:
  group: rapna-category-prod-d1-one-off-20261010
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Only SELECT and EXPLAIN SQL, verify D1 identity, aggregate stats, no rows written
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CF_TOKEN;
          const prefix='https://api.cloudflare.com/client/v4/accounts/9c1807c68493f14259248b5f5782cc6f/d1/database/55596003-1b90-4f66-aad8-decb21205f13';
          const output=(x)=>console.log('RAPNA_D1_CATEGORY_READ '+JSON.stringify(x));
          if(!token){output({gate:'auth',ok:false,reason:'token_unavailable'});process.exitCode=1;process.exit();}
          const read=async (endpoint,opts={})=>{
            const res=await fetch(prefix+endpoint,{method:opts.method??'GET',redirect:'error',
              headers:{Authorization:'Bearer '+token,Accept:'application/json',
                ...(opts.body?{'Content-Type':'application/json'}:{})},
              ...(opts.body?{body:JSON.stringify(opts.body)}:{}),signal:AbortSignal.timeout(15000)});
            return {http:res.status,data:await res.json().catch(()=>null)};
          };
          try{
            const detail=await read('');
            const x=detail.data?.result??{};
            const verified=detail.http===200&&detail.data?.success===true&&
              x.uuid==='55596003-1b90-4f66-aad8-decb21205f13';
            output({gate:'identity',http:detail.http,success:detail.data?.success===true,
              matches_expected_uuid:verified,db_size_bytes:typeof x.file_size==='number'?x.file_size:null});
            if(!verified) {process.exitCode=1;process.exit();}
          }catch(e){output({gate:'identity',reason:e?.name??'Error'});process.exitCode=1;process.exit();}
          const queries=[
            {name:'official_categories',
              sql:"SELECT product_class AS category, COUNT(*) AS count FROM alerts WHERE source = 'RAPNA' AND product_class IS NOT NULL AND TRIM(product_class) <> '' GROUP BY product_class ORDER BY category COLLATE NOCASE LIMIT 100",params:[]},
            {name:'period_selection',
              sql:"SELECT COUNT(*) AS all30, SUM(CASE WHEN product_class = 'Juguetes' THEN 1 ELSE 0 END) AS toys30, SUM(CASE WHEN product_class = 'Material eléctrico' THEN 1 ELSE 0 END) AS electrical30, SUM(CASE WHEN product_class IN ('Juguetes','Material eléctrico') THEN 1 ELSE 0 END) AS either30 FROM alerts WHERE source='RAPNA' AND published_at >= ?",params:[new Date(Date.now()-30*86400000).toISOString()]},
            {name:'map_selection',
              sql:"SELECT COUNT(DISTINCT alerts.id) AS allWithGeo, COUNT(DISTINCT CASE WHEN alerts.product_class='Juguetes' THEN alerts.id ELSE NULL END) AS toysWithGeo FROM alerts JOIN alert_geographies geos ON geos.alert_id=alerts.id WHERE alerts.source='RAPNA' AND geos.role='notifying' AND geos.status='mapped' AND alerts.published_at >= ?",params:[new Date(Date.now()-30*86400000).toISOString()]},
            {name:'distinct_query_plan',
              sql:"EXPLAIN QUERY PLAN SELECT DISTINCT TRIM(product_class) AS category FROM alerts WHERE source='RAPNA' AND product_class IS NOT NULL AND TRIM(product_class)<>'' ORDER BY category COLLATE NOCASE LIMIT 100",params:[]}
          ];
          for(const q of queries) {
            if(!/^(SELECT|EXPLAIN QUERY PLAN SELECT)\b/i.test(q.sql.trim())) throw Error('non-select rejected');
            try{
              const res=await read('/query',{method:'POST',body:{sql:q.sql,params:q.params}});
              const v=Array.isArray(res.data?.result)?res.data.result[0]:res.data?.result;
              const rows=Array.isArray(v?.results)?v.results:[];
              const metrics=v?.meta??{};
              let result={};
              if(q.name==='official_categories'){
                result={category_count:rows.length,items:rows.map(r=>({category:typeof r.category==='string'?r.category.slice(0,100):'',
                  alerts:typeof r.count==='number'?r.count:null})).slice(0,100)};
              } else if(q.name==='distinct_query_plan'){
                result={steps:rows.map(r=>String(r.detail??'').slice(0,180)).slice(0,12)};
              } else result={counts:rows[0]??null};
              output({gate:q.name,http:res.http,success:res.data?.success===true,
                rows_read:metrics.rows_read??null,rows_written:metrics.rows_written??null,
                duration_ms:metrics.duration??null,changes:metrics.changes??null,...result});
              if(res.http!==200||res.data?.success!==true||metrics.rows_written>0){process.exitCode=1;break;}
            }catch(e){output({gate:q.name,reason:e?.name??'Error'});process.exitCode=1;break;}
          }
          NODE
