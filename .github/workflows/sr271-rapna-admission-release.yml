name: SR271 Worker118 authenticated readback and verified own checkpoint release
on:
  push:
    branches: [source-reliability/durable-recovery-20261009]
    paths: [.github/workflows/sr271-rapna-admission-release.yml, ops/sr271-rapna-admission-release.mjs]
permissions:
  contents: read
jobs:
  release:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Runtime GET readback, exact unchanged runner, primary state and own lease release
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VIGIA_SYNC_TOKEN: ${{ secrets.VIGIA_SYNC_TOKEN }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node ops/sr271-rapna-admission-release.mjs
