name: WORK AESAN feed recovery

on:
  push:
    branches:
      - work/aesan-feed-test-recovery

permissions:
  contents: write

jobs:
  repair-validate:
    if: github.event.head_commit.message == 'RUN AESAN FEED RECOVERY'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply minimal recovery
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          p=Path('test/safety-gate-workflow.test.mjs')
          t=p.read_text()
          old="""const refresh = workflow.split('      - name: Refresh Safety Gate\\n')[1].split('        run: |\\n')[1]\n  .split('\\n').map(line => line.startsWith('          ') ? line.slice(10) : line).join('\\n');"""
          new="""const refresh = workflow.split('      - name: Refresh Safety Gate\\n')[1].split('        run: |\\n')[1]\n  .split('\\n  oecd:\\n')[0]\n  .split('\\n').map(line => line.startsWith('          ') ? line.slice(10) : line).join('\\n');"""
          if t.count(old) != 1:
              raise SystemExit(f'unexpected Safety Gate test extraction count: {t.count(old)}')
          p.write_text(t.replace(old,new))

          p=Path('.github/workflows/safety-gate-sync.yml')
          t=p.read_text()
          old='body?.apiVersion !== 2 || body?.schemaVersion !== 2 || !Array.isArray(body?.items)'
          new='body?.apiVersion !== 2 || ![2, 3].includes(body?.schemaVersion) || !Array.isArray(body?.items)'
          if t.count(old) != 1:
              raise SystemExit(f'unexpected schema guard count: {t.count(old)}')
          p.write_text(t.replace(old,new))
          PY
      - name: Test complete feed repository
        run: npm test
      - name: Live AESAN read-only generation
        env:
          AESAN_FULL_HISTORY: "0"
          AESAN_MAX_ARCHIVE_PAGES: "400"
        run: |
          set -euo pipefail
          npm run update
          node - <<'NODE'
          const fs=require('node:fs');
          const feed=JSON.parse(fs.readFileSync('feed.json','utf8'));
          if(!Array.isArray(feed?.alerts) || feed.alerts.length < 100) throw new Error('AESAN live feed unexpectedly small');
          const refs=new Set(feed.alerts.map(a=>String(a.reference||'')));
          for(const ref of ['ES2026/517','ES2026/543','ES2026/535']) if(!refs.has(ref)) throw new Error(`Missing certified recent AESAN reference ${ref}`);
          const recent=feed.alerts.slice(0,8).map(a=>({reference:a.reference,publishedAt:a.publishedAt,title:a.title}));
          console.log(JSON.stringify({alerts:feed.alerts.length,recent},null,2));
          NODE
          git checkout -- feed.json
      - name: Commit validated repair and remove carrier
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/work-aesan-feed-recovery.yml
          git add test/safety-gate-workflow.test.mjs .github/workflows/safety-gate-sync.yml
          git config user.name "cgam-coder"
          git config user.email "c.gamiz93@gmail.com"
          git commit -m "fix(ops): restore AESAN feed validation after OECD scheduler merge"
          git push origin HEAD:work/aesan-feed-test-recovery
