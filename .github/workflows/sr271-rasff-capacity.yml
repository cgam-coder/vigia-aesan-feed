name: SR271 bounded RASFF read-only capacity comparison
on:
  push:
    branches: [source-reliability/recovery-snapshot-20261009]
    paths: [.github/workflows/sr271-rasff-capacity.yml, ops/sr271-rasff-read-benchmark.ts]
permissions:
  contents: read
concurrency:
  group: sr271-rasff-read-capacity-20261009
  cancel-in-progress: false
jobs:
  official_get_capacity:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Compare identical official RASFF scope using official read-only search
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/sr271-rasff-read-benchmark.mjs
          printf '%s  %s\n' 'b47568ec46e5824846e89d8249e9519f13ea6a0a4cc84806695f196f6fdc4b35' '/tmp/sr271-rasff-read-benchmark.mjs' | sha256sum --check
          node /tmp/sr271-rasff-read-benchmark.mjs
